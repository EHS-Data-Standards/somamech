# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

env:
  FORCE_COLOR: "1" # Make tools pretty.

permissions: {}

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 dropped: linkml-reference-validator needs >=3.10
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install project
        run: uv sync --dev

      - name: Run test suite
        run: just test

  # Quality-control gate for the paper-extraction pipeline: schema validation,
  # ontology term checks, evidence quote checks, duplicate-key and stub checks.
  # Runs over the WHOLE repository, not just changed files — checking only
  # changed files lets two individually-green PRs break each other when both
  # merge.
  qc:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install just
        run: uv tool install rust-just

      - name: Install project
        run: uv sync --dev

      - name: Cache OAK ontology databases
        uses: ./.github/actions/oak-cache

      - name: Run QC checks
        run: just qc
