# Interactive Claude responder: write "@claude <request>" on an issue or PR
# and Claude answers or does the work. Adapted from monarch-initiative/dismech.
---
name: Claude

on:  # yamllint disable-line rule:truthy
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # This `if:` block is the security boundary: only @claude mentions from
    # repo owners, members, or collaborators trigger the agent, so text
    # written by outsiders can never become instructions to it. For
    # `issues: assigned`, the gate is on the issue AUTHOR's association —
    # assigning an externally-authored issue must not turn untrusted issue
    # text into a trigger.
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read  # so Claude can read CI results on PRs

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve agent model
        uses: ./.github/actions/resolve-agent-config
        with:
          workflow: claude

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install just
        run: uv tool install rust-just

      - name: Install project
        run: uv sync --dev

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.ANTHROPIC_API_KEY == '' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # actions:read must be granted to the action's own token too
          # (the job-level permissions block only scopes GITHUB_TOKEN).
          additional_permissions: |
            actions: read
          use_sticky_comment: true
          track_progress: true
          # Wide-open tools are acceptable because the trusted-author `if:`
          # gate above is the security boundary. Model comes from
          # .github/agent-config.yaml via the resolver step.
          claude_args: |
            --dangerously-skip-permissions
            --model ${{ env.AGENT_MODEL }}
