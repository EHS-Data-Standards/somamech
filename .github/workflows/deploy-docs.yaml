# Validate that the schema docs still build. The actual deployment happens in
# deploy-kb-site.yaml, which packages the MkDocs site under /docs/ inside the
# single Pages artifact whenever a release is published — Pages (source:
# "GitHub Actions") serves one artifact per deployment, so a second deploying
# workflow would just overwrite the site. This workflow exists to catch a
# broken docs build on main instead of at release time.
#
# (It previously ran `mkdocs gh-deploy`, but the gh-pages branch is no longer
# what Pages serves, and the build had been failing since the soma-schema
# PyPI split moved the generated datamodel out of src/.)
---
name: Validate docs build
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: 3.13
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Install dependencies
        run: uv sync --dev --no-progress

      - name: Install SQLite for diagram generation
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Generate project artifacts
        run: just gen-project

      - name: Build DataHarmonizer and documentation
        run: |
          just gen-doc
          npm install
          npm run build
          cp -r dist/assets docs/
          cp dist/index.html docs/harmonizer.html
          sed -i 's|"/assets/|"assets/|g' docs/harmonizer.html
          mkdir -p docs/schemas
          uv run gen-linkml --materialize-patterns --materialize-attributes "$(uv run python -c 'from importlib.resources import files; print(files("soma")/"schema"/"soma.yaml")')" > docs/schemas/soma.json
          cp menu.json docs/
          uv run mkdocs build -d tmp/docs-site
