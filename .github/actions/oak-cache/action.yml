name: Cache OAK ontology databases
description: >-
  Persist OAK's ontology SQLite downloads across CI runs so term validation
  doesn't re-download whole ontology databases every time. Pins PYSTOW_HOME
  (the directory OAK actually reads) to a stable runner-local path and
  restores/saves it with actions/cache. Adapted from monarch-initiative/dismech.

inputs:
  pystow-home:
    description: Directory to use as PYSTOW_HOME (default runner temp)
    required: false
    default: ""

runs:
  using: composite
  steps:
    # OAK resolves sqlite:obo:<name> databases to $PYSTOW_HOME/oaklib/<name>.db.
    # It reads ONLY PYSTOW_HOME for this, so we pin it explicitly to guarantee
    # the cache we restore is the exact directory OAK will read from.
    - name: Pin OAK cache location (PYSTOW_HOME)
      shell: bash
      run: |
        pystow_home="${{ inputs.pystow-home }}"
        if [ -z "$pystow_home" ]; then
          pystow_home="${RUNNER_TEMP}/pystow"
        fi
        mkdir -p "${pystow_home}/oaklib"
        {
          echo "PYSTOW_HOME=${pystow_home}"
          echo "OAK_SQLITE_CACHE_DIR=${pystow_home}/oaklib"
        } >> "$GITHUB_ENV"
        echo "OAK ontology SQLite cache dir: ${pystow_home}/oaklib"

    # The unique run_id key always misses, so the post-job save always runs
    # and captures newly downloaded databases; restore-keys restores the most
    # recent prior cache. Keying on conf/oak_config.yaml invalidates the cache
    # when the adapter config changes.
    - name: Restore/save OAK ontology SQLite cache
      uses: actions/cache@v4
      with:
        path: ${{ env.OAK_SQLITE_CACHE_DIR }}
        key: oak-sqlite-${{ hashFiles('conf/oak_config.yaml') }}-${{ github.run_id }}
        restore-keys: |
          oak-sqlite-${{ hashFiles('conf/oak_config.yaml') }}-
