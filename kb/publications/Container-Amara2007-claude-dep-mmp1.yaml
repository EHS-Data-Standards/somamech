# =============================================================================
# OXIDATIVE STRESS ASSAYS - intracellular ROS production
# =============================================================================

oxidative_stress_assays:
  - id: "OX:amara-ros-dep-1h"
    name: "Intracellular ROS - A549, DEP 1 h"
    description: "Intracellular ROS production quantified by H2DCFH-DA oxidation 1 h after particle addition. Compared with the control condition, incubation for 1 h with DEPs alone or in combination with cigarette smoke condensate gave a significant and similar increase in fluorescence (P<0.05, n=5). Carbon black particles or cigarette smoke condensate alone did not increase fluorescence intensity. Pretreatment for 1 h with N-acetylcysteine (1 mM) reversed both the increased ROS production and the MMP-1 mRNA induction by DEPs. Results are in fluorescent arbitrary units, so no fold value is recorded."
    ros_probe_type: "H2DCFH-DA"
    evidence:
      - reference: "PMID:17449795"
        reference_title: "Diesel exhaust particles induce matrix metalloprotease-1 in human lung epithelial cells via a NADP(H) oxidase/NOX4 redox-dependent mechanism."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "DEP-induced MMP-1 was associated with increased ERK 1/2 phosphorylation and upregulation of expression and activity of the NADPH oxidase analog NOX4."
        explanation: "The oxidase activity the abstract reports as upregulated is the DEP-induced ROS production measured here by H2DCFH-DA oxidation."
    has_specified_output:
      id: "OX:amara-ros-dep-1h-output"
      name: "H2DCFH-DA fluorescence at 1 h (arbitrary units, increased vs control)"
    assay_date: "2007-01-01"
