# =============================================================================
# MAP KINASE SIGNALING - ERK 1/2 phosphorylation
# Recorded with the EGFRSignalingAssay class because that class carries the
# erk_phosphorylation slot. NOTE: EGFR itself was not measured in this study;
# only the downstream ERK 1/2 readout below was.
# =============================================================================

egfr_signaling_assays:
  - id: "EGFR:amara-erk-dep-30min"
    name: "ERK 1/2 phosphorylation - A549, DEP 30 min"
    description: "Western blot time course of ERK 1/2 phosphorylation in A549 cells. With DEP treatment, phosphorylation of ERK 1/2 began at 10 min but was delayed, peaking at 30 min, and was still elevated at 40 min. The degree of increase at 30 min was higher with DEPs than with cigarette smoke condensate compared with the control condition (5.51 +/- 0.34 vs. 0.81 +/- 0.12 increase, respectively; P<0.05, 4 experiments). Carbon black particles did not increase ERK 1/2 phosphorylation. The ERK-pathway inhibitor PD-98059 (50 uM) reduced the DEP-mediated increase in MMP-1, whereas the p38 inhibitor SB-203580 and the JNK inhibitor SP-600125 did not. NOX4 siRNA prevented the DEP-induced ERK 1/2 phosphorylation. EGFR was not measured in this study."
    normalization_reference: "total ERK 1/2"
    evidence:
      - reference: "PMID:17449795"
        reference_title: "Diesel exhaust particles induce matrix metalloprotease-1 in human lung epithelial cells via a NADP(H) oxidase/NOX4 redox-dependent mechanism."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "DEP-induced MMP-1 was associated with increased ERK 1/2 phosphorylation and upregulation of expression and activity of the NADPH oxidase analog NOX4."
        explanation: "The abstract states that DEP-induced MMP-1 was associated with increased ERK 1/2 phosphorylation, the measurement this assay records."
    has_specified_output:
      id: "EGFR:amara-erk-dep-30min-output"
      name: "Phospho-ERK 1/2 at 30 min (densitometric increase 5.51 +/- 0.34 vs 0.81 +/- 0.12 for CSC; arbitrary ratio, not a fold value)"
    assay_date: "2007-01-01"
    has_exposure_condition:
