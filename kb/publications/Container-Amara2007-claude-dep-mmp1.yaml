# =============================================================================
# Amara et al. (2007) - Diesel exhaust particles induce matrix
# metalloprotease-1 in human lung epithelial cells via a NADP(H) oxidase/NOX4
# redox-dependent mechanism
# =============================================================================
#
# Source: Am J Physiol Lung Cell Mol Physiol 293: L170-L181, 2007
# DOI: 10.1152/ajplung.00445.2006
#
# Study design:
#   - In vitro: A549 human alveolar epithelial cell line (type II pneumocyte
#     model) and NCI-H292 human lung epithelial cell line, submerged culture
#     in Ham's F-12 + 10% FCS, stimulated in serum-free medium
#   - Particles: diesel particulate matter SRM 2975 (NIST) dispersed in 0.04%
#     dipalmitoyl lecithin, 5-10 ug/cm2 (10 ug/cm2 = 50 ug/ml), 6 or 24 h;
#     carbon black particles (95 nm, FR103) 10 ug/cm2 as carbonaceous-core
#     control; cigarette smoke condensate (2R4F Kentucky cigarettes) 10 ug/ml
#   - Vehicle control: 0.04% dipalmitoyl lecithin + DMSO (10 ug/ml)
#   - In vivo: male C57BL6 mice, 50 ug DEP in 100 ul sterile saline
#     intratracheally, lungs harvested 24 h after instillation
#
# Key findings (all values below are the paper's own; figure panels were not
# eyeballed for numbers):
#   - DEPs increased MMP-1 mRNA (6 and 24 h, dose-dependent, P<0.05, n=5),
#     protein and activity (24 h) in A549 cells
#   - MMP-2, TIMP-1, TIMP-2 and TGF-beta mRNA were unchanged
#   - Cigarette smoke condensate alone had no effect and did not potentiate DEP
#   - DEPs increased intracellular ROS at 1 h; N-acetylcysteine (1 mM)
#     reversed both the ROS rise and the MMP-1 mRNA induction
#   - DEPs increased NOX4 mRNA and protein but not NOX1 mRNA
#   - NOX4 siRNA reduced NOX4 mRNA by 76.8 +/- 2.45% and abolished the DEP
#     effect on ROS, MMP-1 mRNA, ERK 1/2 and JNK phosphorylation
#   - ERK 1/2 phosphorylation peaked at 30 min with DEP (5.51 +/- 0.34 vs.
#     0.81 +/- 0.12 increase for CSC; P<0.05)
#   - NCI-H292: DEP increased MMP-1 and NOX4 mRNA at 6 h (P<0.05, n=4)
#   - Mice: NOX4-positive alveolar epithelial cells 1.20 +/- 0.50% (saline)
#     vs 30.81 +/- 1.89% (DEP); MMP-1-positive 2.34 +/- 0.89% vs
#     23.21 +/- 1.45% (P<0.05)
#
# Evidence note: the paper is not open access, so references_cache/ holds only
# the abstract. Every snippet below is an exact quote from that abstract and
# verifies against both the committed cache and the locally extracted PDF
# text. Quantitative values in descriptions and outputs come from the full
# text (RESULTS/DISCUSSION and Figs. 2-10), checked locally against the PDF.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:17449795"
  reference_title: "Diesel exhaust particles induce matrix metalloprotease-1 in human lung epithelial cells via a NADP(H) oxidase/NOX4 redox-dependent mechanism."
  doi: "10.1152/ajplung.00445.2006"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:amara-qpcr-001"
    name: "Real-time RT-PCR for MMP, TIMP, NOX and TGF-beta mRNA"
    description: "Quantitative real-time RT-PCR on an ABI 7700 (Applied Biosystems) for NOX1, NOX4, MMP-1, MMP-2, TIMP-1, TIMP-2 and TGF-beta. mRNA expression normalized to ubiquitin, which the authors had previously verified to be unchanged across the experimental conditions."
    equipment_required:
      - "PCR ABI 7700 apparatus (Applied Biosystems)"

  - id: "PROTOCOL:amara-wb-001"
    name: "Western blot for MMP-1 and MAP kinase phosphorylation"
    description: "Western blot with a monoclonal anti-human MMP-1 antibody (1:400, R&D Systems). Housekeeping protein beta-actin detected with a monoclonal anti-beta-actin antibody; results expressed as the ratio of MMP-1 to beta-actin. The same approach was used for phospho-ERK 1/2, phospho-p38 and phospho-JNK time courses."
    equipment_required:
      - "SDS-PAGE and immunoblotting apparatus"

  - id: "PROTOCOL:amara-zymo-001"
    name: "Casein zymography for MMP-1 activity"
    description: "Cell culture supernatants separated under nonreducing conditions on 12% polyacrylamide gels containing 1 mg/ml casein. Gels loaded with 20 ul sample plus 10 ul loading buffer, processed under Laemmli conditions. MMP-1 activity assessed by incubation of the gels in 45% acetic acid and 10% methanol."
    equipment_required:
      - "12% polyacrylamide casein gels"

  - id: "PROTOCOL:amara-dcf-001"
    name: "Intracellular ROS measurement by H2DCFH-DA oxidation"
    description: "Cells cultured in 96-well plates. H2DCFH-DA (final concentration in DMSO 10 uM) added 1 h before addition of the particles. Fluorescence measured at 480-555 nm on a multiwell fluorescence plate reader (Fluorostar BMG) 1 h after addition of the stimuli. Results expressed in fluorescent arbitrary units."
    equipment_required:
      - "Fluorostar BMG multiwell fluorescence plate reader"
      - "2',7'-dichlorodihydrofluorescein diacetate (H2DCFH-DA)"

  - id: "PROTOCOL:amara-sirna-001"
    name: "NOX4 small interfering RNA transfection"
    description: "A549 cells plated at 5x10^5 cells per well on six-well plates and transfected with 0.8 ug of siRNA duplex using Lipofectamine for 4 h in medium devoid of serum and antibiotics. NOX4 siRNA target 5'-AAACCGGCAGGAGUUUACCCAG-3'; scrambled control 5'-AACCAGCAAGGUGUAUCGCCAC-3'. Gene silencing monitored after 24 h; the procedure did not affect cell viability."
    equipment_required:
      - "Lipofectamine transfection reagent"
      - "NOX4 siRNA (Xeragon-Qiagen)"

  - id: "PROTOCOL:amara-ihc-001"
    name: "Immunohistochemistry for NOX4 and MMP-1"
    description: "In A549 cells, a rabbit polyclonal anti-NOX4 antibody at 1:200. In mouse lung, four 6-um cryostat sections fixed in acetone and incubated with monoclonal anti-MMP-1 (GenWay Biotech) at 1:400 and rabbit polyclonal anti-NOX4 at 1:300. Positive cells revealed with the Vectastain ABC-alkaline phosphatase kit and fast red substrate. Quantification by counting positive cells in at least 10 optical fields per slide, scored blind by three investigators."
    equipment_required:
      - "Cryostat"
      - "Vectastain ABC-alkaline phosphatase kit (Vector Laboratories)"
      - "Fast red substrate"

