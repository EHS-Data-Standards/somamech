        name: "Diesel exhaust particles (SRM 2975) 10 ug/cm2 for 30 minutes"
        exposure_agent:
          id: "ENVO:03510008"
          name: "diesel exhaust"
        exposure_concentration:
          value: "10"
          unit:
            id: "UO:0010071"
            name: "microgram per square centimeter"
        exposure_duration:
          value: "30"
          unit:
            id: "UO:0000031"
            name: "minute"
    informs_on_key_event:
