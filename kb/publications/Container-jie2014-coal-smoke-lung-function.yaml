# =============================================================================
# RESPONSE COMPARISONS
#
# Two kinds of estimate, both from the paper's multivariate linear regression
# models (Tables 2-5), both reported_in_paper:
#
#   1. COAL vs NON-COAL (four comparisons). The adjusted between-group
#      coefficient for coal use, pointing at the two groups' output records.
#      change_value is the signed coefficient exactly as its 95% CI is printed
#      in the table. The paper's prose calls these "% decreases" while the
#      tables print them in litres, L/s and percentage points - see the
#      "PERCENT vs LITRES" note at the top of this file.
#      NOTE FOR CONSUMERS: change_value is the ADJUSTED coefficient, while the
#      two linked output records hold the CRUDE group means. Subtracting the
#      outputs therefore does not reproduce change_value (e.g. FVC crude
#      3.87 - 3.22 = 0.65 L, adjusted coefficient -0.317 L). This is not an
#      inconsistency: the regression controls for age, sex, body size,
#      household size, room count, infection history, tobacco smoke and the
#      three PM2.5 measurements. Each comparison's name says "Adjusted" for
#      this reason.
#
#   2. KITCHEN PM2.5 PER 1 cpm (four comparisons). Continuous-exposure
#      regression slopes, so control_output and treated_output are omitted
#      (the hart2018 pattern): no pair of output records exists for a per-unit
#      slope to point at. The paper's prose states these as "2-L", "3-L" and
#      "8 L/s" decreases while the tables print -0.002 L, -0.003 L and
#      -0.008 L/s - see the "SLOPE MAGNITUDE" note at the top of this file.
#
# Models were adjusted for gender, age, weight, height, number of persons
# living in a home, number of rooms in a home, history of recurrent
# respiratory tract infections, environmental tobacco smoke exposure, and
# PM2.5 relative concentrations in the kitchen, living room and outdoors.
# Where the paper reports only "P < 0.0001", p_value carries that stated upper
# bound and the description says so; where it reports only "P < 0.05",
# p_value is omitted because the float slot cannot hold a threshold.
# =============================================================================

response_comparisons:
  - id: "COMP:jie-fvc-coal-vs-noncoal"
    name: "Adjusted (multivariate) difference in FVC for coal use vs no coal use"
    description: "In the multivariate model, coal use was associated with an FVC coefficient of -0.317 L (95%CI -0.396; -0.238), P < 0.0001 (Table 2). The abstract and Results text describe this same number as 'a 31.7% decrease in FVC'; the tabulated coefficient is an absolute difference in litres, and it is recorded as such here. The paper reports only P < 0.0001, so the tabulated p_value 0.0001 is the stated upper bound. Crude group means were 3.22 +/- 0.62 L (coal) vs 3.87 +/- 0.70 L (non-coal); the control output lives on the non-coal assay."
    derived_from_assay: "LF:jie-coal-exposed-spirometry"
    compared_measurement: "fvc"
    control_output: "LF:jie-noncoal-control-spirometry-output-control"
    treated_output: "LF:jie-coal-exposed-spirometry-output-coal"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-0.317"
      unit:
        id: "UO:0000099"
        name: "liter"
      variability:
        variability_type: confidence_interval_95
        lower_bound: "-0.396"
        upper_bound: "-0.238"
        unit:
          id: "UO:0000099"
          name: "liter"
    p_value: 0.0001
    statistical_test: "multivariate linear regression adjusted for gender, age, weight, height, number of persons living in a home, number of rooms in a home, history of recurrent respiratory tract infections, environmental tobacco smoke exposure, and PM2.5 relative concentrations in the kitchen, living room and outdoors"
    derivation: reported_in_paper

