    statistical_test: "multivariate linear regression adjusted for gender, age, weight, height, number of persons living in a home, number of rooms in a home, history of recurrent respiratory tract infections, environmental tobacco smoke exposure, and PM2.5 relative concentrations in the kitchen, living room and outdoors"
