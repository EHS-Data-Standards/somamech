    statistical_test: "multivariate linear regression, coefficient per 1 count per minute of kitchen PM2.5 relative concentration, adjusted for gender, age, weight, height, number of persons living in a home, number of rooms in a home, history of recurrent respiratory tract infections, environmental tobacco smoke exposure, and PM2.5 relative concentrations in the living room and outdoors"
    derivation: reported_in_paper

