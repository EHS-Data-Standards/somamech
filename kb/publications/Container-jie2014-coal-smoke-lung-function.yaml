  - id: "COMP:jie-fvc-per-cpm-kitchen-pm25"
    name: "Adjusted (multivariate) change in FVC per 1 cpm increase in kitchen PM2.5 relative concentration"
    description: "Each 1 cpm increase in the kitchen PM2.5 relative concentration was associated with an FVC coefficient of -0.002 L (95%CI -0.004; 0.000), P < 0.05 (Table 2). Note the discrepancy with the paper's own prose, which states 'a 2-L decrease in FVC ... per 1 cpm PM2.5 exposure': the tabulated coefficient is 0.002 L, i.e. about 2 mL per cpm, a thousandfold smaller than the stated litre figure. The tabulated value is recorded. The paper gives only the P < 0.05 threshold, so p_value is omitted. Continuous-exposure regression slope, so no control/treated output pair exists (see the section note)."
    derived_from_assay: "LF:jie-coal-exposed-spirometry"
    compared_measurement: "fvc"
    change_type: absolute_difference
