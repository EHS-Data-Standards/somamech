    description: "Each 1 cpm increase in the kitchen PM2.5 relative concentration was associated with an FEV1 coefficient of -0.003 L (95%CI -0.005; 0.000), P < 0.05 (Table 3). Note the discrepancy with the paper's own prose, which states 'a 3-L decrease in FEV1 ... per 1 cpm PM2.5 exposure': the tabulated coefficient is 0.003 L, i.e. about 3 mL per cpm. The tabulated value is recorded. The paper gives only the P < 0.05 threshold, so p_value is omitted. Continuous-exposure regression slope, so no control/treated output pair exists (see the section note)."
