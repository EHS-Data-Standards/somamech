# =============================================================================
# Jie et al. (2014) - Relationship between pulmonary function and indoor air
# pollution from coal combustion among adult residents in an inner-city area
# of southwest China
# =============================================================================
#
# Source: Braz J Med Biol Res. 2014;47(11):982-989
# DOI: 10.1590/1414-431X20144084
# PMID: 25296361
#
# Study design (HUMAN OBSERVATIONAL - not in vitro, not an animal experiment):
#   - Cross-sectional study in the YA (Yanan) Road inner-city area of Zunyi
#     city, Guizhou province, southwest China; 104 households, 231 adult
#     participants (of 254 available)
#   - 110 adults in coal-using households (exposure group) vs 121 adults in
#     households using modern energy sources - kerosene, liquid petroleum, gas
#     or electricity (control group). ALL participants were nonsmokers, aged
#     18 years and older, resident in YA Road for more than 3 years
#   - All respiratory measurements made during one winter (October 2011 to
#     March 2012), the season when domestic coal use peaks
#   - Spirometry (FVC, FEV1, FEV1/FVC, PEFR) with a portable electronic
#     FGC-A++ spirometer against American Thoracic Society acceptance criteria
#   - PM2.5 measured during cooking in 52 coal and 52 non-coal households with
#     an LD-3K light-scattering digital dust monitor, in the kitchen, the
#     living room and outdoors, reported as a RELATIVE concentration in counts
#     per minute (cpm) rather than a mass concentration
#
# MODELLING NOTES:
#   - Each fuel group is its own assay with its own InVivoSubject (the
#     isara2016 / calderon2001 pattern), because the two cohorts differ in
#     age, household size and infection history and merging them would lose
#     which group a record describes. The response_comparisons therefore
#     reference a control_output that lives on the companion non-coal assay,
#     with derived_from_assay pointing at the coal-exposed group's assay.
#   - UNIT OF EXPOSURE: the dust monitor reports a relative concentration in
#     counts per minute, NOT ug/m3 ("To determine the cpm, the following
#     equation was used: cpm = count value/measuring time (in min)"). There is
#     no UO term for counts per minute, so the UCUM expression UCUM:1/min is
#     used, following the repo convention for units UO does not cover. These
#     cpm values are therefore NOT comparable with the mass concentrations
#     recorded in the other PM2.5 papers in this knowledge base.
#   - The exposure agent on both conditions is ENVO:01000415 "fine respirable
#     suspended particulate matter": PM2.5 is the pollutant the study actually
#     quantified, and it was measured in BOTH groups' homes, so both
#     conditions carry an exposure_concentration. Which fuel produced it is
#     recorded in each condition's name. exposure_duration is omitted on
#     purpose - the authors state they could not assess it ("we cannot comment
#     on the duration of exposure to coal smoke because we could not
#     adequately assess cooking times in households").
#   - PERCENT vs LITRES - a discrepancy in the source that is reproduced here
#     rather than silently corrected. The abstract and Results text describe
#     the multivariate coal coefficients as "a 31.7% decrease in FVC, a 42.0%
#     decrease in FEV1, a 7.46% decrease in the FEV1/FVC ratio, and a 23.1%
#     decrease in PEFR". Tables 2, 3 and 5 print those same numbers as
#     absolute regression coefficients in the outcome's own unit: FVC -0.317 L
#     (95%CI -0.396; -0.238), FEV1 -0.420 L (-0.525; -0.316), PEFR -0.231 L/s
#     (-0.460; -0.002). The tabulated coefficients are recorded, as
#     absolute_difference in litres and L/s, and the prose "%" framing is
#     noted on each comparison. Only the FEV1/FVC coefficient (-7.463,
#     Table 4) is genuinely a percentage, because the outcome itself is a
#     percentage - and even there the paper's "7.46% decrease" is a
#     difference in percentage points, not a relative decrease.
#   - SLOPE MAGNITUDE - a second discrepancy in the source, also reproduced
#     rather than corrected. Both the abstract and the Results text state "a
#     2-L decrease in FVC and a 3-L decrease in FEV1, as well as an 8 L/s
#     decrease in PEFR per 1 cpm PM2.5 exposure", but the tabulated kitchen
#     PM2.5 coefficients are -0.002 L, -0.003 L and -0.008 L/s per cpm (i.e.
#     2 mL, 3 mL and 8 mL/s, a thousandfold smaller). The tabulated
#     coefficients are what is recorded; the paper's own wording is quoted as
#     evidence and flagged in each comparison's description.
#   - The four PM2.5 per-cpm coefficients are continuous-exposure regression
#     slopes, so they carry no control_output / treated_output pair (the
#     hart2018 pattern): no two output records exist for a per-unit slope to
#     point at, and inventing group records would fabricate data.
#   - P-VALUE DISCREPANCIES in the source. Table 1 and the Results text
#     disagree three times over, and all three are recorded as they stand:
#       * The four crude pulmonary function differences are marked P < 0.05 in
#         Table 1, but the Results text calls the same comparisons "highly
#         significant differences (P ,0.0001)".
#       * The indoor PM2.5 differences between the groups are likewise marked
#         P < 0.05 in Table 1's kitchen and living room rows, while the
#         Results text gives P < 0.0001 for the same contrast.
#       * Household size is given as P = 0.053 in the Results text ("an
#         indication of an imbalance") but printed as P = 0.06 in Table 1.
#     Both readings are quoted in each case. Where the paper gives only a "<"
#     threshold, the p_value slot is either omitted (P < 0.05) or set to the
#     stated upper bound with that noted in the description (P < 0.0001),
#     following the lkhagvadorj2020 convention.
#   - UNIT INCONSISTENCY in Table 5: its caption reads "peak expiratory flow
#     rate (PEFR; L/min)" while its column header reads "Difference in PEFR
#     (L/s)". UCUM:L/s is recorded, because L/s is what the column header and
#     Table 1's own PEFR row ("PEFR (L/s)") both print, and because the
#     magnitudes (around 6 L) are only physiologically plausible as L/s. The
#     caption's "L/min" is treated as a typesetting error in the source, and
#     is flagged here rather than silently dropped.
#   - Crude (unadjusted) group differences are not duplicated as separate
#     comparison records: the two output records already hold both groups'
#     means and SDs with their sample sizes, and the paper reports no crude
#     difference, percent change or fold change for them (only a significance
#     marker), so a crude comparison would add no value the outputs lack. The
#     comparisons carry the multivariate-adjusted coefficients, which are the
#     paper's headline estimates and the only ones with a magnitude and CI.
#
# FINDINGS WITH NO SOMA SLOT (recorded in prose per the extraction rules):
#   - PM2.5 relative concentration by room and group (kitchen, living room,
#     outdoors) is carried on the exposure conditions and in the assay
#     descriptions; there is no assay class for an air-sampling measurement.
#   - History of recurrent pulmonary tract infections: 30.9% (coal) vs 13.2%
#     (non-coal), P < 0.05 - a covariate in the regression models, and the
#     paper offers no measurement of inflammation or infection beyond
#     self-reported history.
#   - Environmental tobacco smoke exposure 32.7% vs 25.6% (P = 0.23) and
#     number of rooms in the home 3.9 +/- 1.2 vs 4.4 +/- 0.9 (P < 0.05).
#
# WHAT THE PAPER DOES *NOT* CLAIM:
#   No key_event_relationships are recorded. This is a cross-sectional
#   association study with no mechanistic intermediate readouts: it measures
#   an exposure index (PM2.5 cpm) and an adverse outcome (reduced ventilatory
#   function), with nothing in between. The Discussion's remarks about
#   oxidation reactions and inflammatory responses in the respiratory tract
#   are attributed to other authors' work (references 19, 20), not to data in
#   this paper, so they inform no key event here. The authors themselves note
#   that "the cross-sectional design limited causal inference".
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:25296361"
  reference_title: "Relationship between pulmonary function and indoor air pollution from coal combustion among adult residents in an inner-city area of southwest China."
  doi: "10.1590/1414-431x20144084"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:jie-spirometry-001"
    name: "FGC-A++ portable spirometry against American Thoracic Society acceptance criteria"
    description: "Lung function examined by measuring FVC, forced expiratory volume in 1 s (FEV1), FEV1/FVC and peak expiratory flow rate (PEFR) according to standard guidelines, using a portable electronic FGC-A++ spirometer (Anhui Institute of Electronic Science, China). Participants sat upright with both feet flat on the ground, were instructed to inhale completely, place the meter in the mouth and exhale with maximal force once the lips were sealed around the mouthpiece, with an investigator demonstrating the maneuver. Per American Thoracic Society guidelines, maneuvers were accepted only if back-extrapolated volume was low (<5% of the FVC and <0.15 L), both FVC and FEV1 were within 0.20 L of the best-effort FVC and FEV1, and little volume accumulated at the end of the effort. Each subject performed three expiratory maneuvers; analysis used the largest FVC, the largest FEV1, the ratio of the largest FEV1 to the largest FVC, and the largest PEFR."
    spirometry_standard: "American Thoracic Society standardisation of spirometry (Miller et al. 2005)"
    equipment_required:
      - "Portable electronic FGC-A++ spirometer (Anhui Institute of Electronic Science, China)"

  - id: "PROTOCOL:jie-pm25-monitoring-001"
    name: "LD-3K light-scattering dust monitoring of PM2.5 relative concentration during cooking"
    description: "PM2.5 concentrations inside and outside the households were measured during cooking with a digital dust monitor (LD-3K; Sibata Scientific Technology Inc., Japan), a portable light-scattering monitor with a laser diode as the light source that determines the relative concentration of PM2.5 from the intensity of the laser beam scattered by particles. The relative concentration is reported as counts per minute: cpm = count value / measuring time in minutes. All air sampling was done 1.2-1.5 m above the floor. Three measurements were taken 1 m from the centre of the cooking stove inside the kitchen, three from random sites inside the living room at least 3 m from the kitchen, and three outdoors at least 20 m from the household as environmental controls. Each measurement was maintained for over 1 min and three readings were averaged, with 1 min between the three readings in a room and 5 min between rooms."
    equipment_required:
      - "Digital dust monitor LD-3K (Sibata Scientific Technology Inc., Japan)"

  - id: "PROTOCOL:jie-questionnaire-001"
    name: "Sociodemographic and smoking questionnaire"
    description: "Questionnaire administered at home after consent, used to assess sociodemographic factors and to identify smoking status (only nonsmokers were eligible), gender, history of recurrent respiratory tract infections, environmental tobacco smoke exposure (defined by the presence of a smoker in the household), number of persons living in the home and number of rooms in the home. Household cooking fuel source was identified for each household visited and used to assign the coal and non-coal categories."

