  - id: "COMP:jie-fev1fvc-per-cpm-kitchen-pm25"
    name: "Adjusted (multivariate) change in FEV1/FVC ratio per 1 cpm increase in kitchen PM2.5 relative concentration"
    description: "Each 1 cpm increase in the kitchen PM2.5 relative concentration was associated with an FEV1/FVC coefficient of 0.008 percentage points (95%CI -0.044; 0.060), P = 0.757 - a null result, recorded because it is the one pulmonary function parameter on which kitchen PM2.5 showed no significant effect, consistent with the paper's statement that the significant effects were on FVC, FEV1 and PEFR. The point estimate is positive, so change_direction is no_change rather than decreased. Continuous-exposure regression slope, so no control/treated output pair exists (see the section note)."
