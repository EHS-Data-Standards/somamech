# households are the exposure group; adults in the same inner-city area whose
# households use modern energy sources are the control group. All participants
# in both groups were nonsmokers.
# =============================================================================

lung_function_assays:
  - id: "LF:jie-coal-exposed-spirometry"
    name: "Spirometry - adult residents of coal-using households (coal-exposed group)"
    description: "Ventilatory function in the 110 nonsmoking adults from coal-using households, measured during the winter of October 2011 to March 2012: FEV1 2.75 +/- 0.56 L, FVC 3.22 +/- 0.62 L, FEV1/FVC 83.13 +/- 3.95%, PEFR 6.00 +/- 0.90 L/s (Table 1). All four parameters were lower than in the 121 non-coal controls; Table 1 marks each difference P < 0.05 while the Results text calls the same comparisons highly significant at P < 0.0001. The PM2.5 relative concentration measured during cooking in these households was 569.5 +/- 50.1 cpm in the kitchen, 543.2 +/- 65.0 cpm in the living room and 416.2 +/- 5.9 cpm outdoors; the kitchen value was significantly higher than both the living room and outdoors (P < 0.0001). Cooking was mainly done indoors on an open-fire traditional stove in a small kitchen without effective ventilation, or in a kitchen adjacent to the living room, and most coal used by Zunyi households is a high-sulfur coal of approximately 3% sulfur content. This group also had a significantly higher prevalence of recurrent pulmonary tract infections (30.9% vs 13.2%, P < 0.05) and fewer rooms per home (3.9 +/- 1.2 vs 4.4 +/- 0.9, P < 0.05); environmental tobacco smoke exposure did not differ significantly (32.7% vs 25.6%, P = 0.23)."
