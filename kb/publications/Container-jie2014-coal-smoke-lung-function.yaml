  - id: "COMP:jie-fev1fvc-coal-vs-noncoal"
    name: "Adjusted (multivariate) difference in FEV1/FVC ratio for coal use vs no coal use"
    description: "In the multivariate model, coal use was associated with an FEV1/FVC coefficient of -7.463 percentage points (95%CI -9.797; -5.129), P < 0.0001 (Table 4). The abstract describes this as 'a 7.46% decrease in the FEV1/FVC ratio'; because the outcome is itself a percentage, the coefficient is a difference in percentage points rather than a relative decrease. The paper reports only P < 0.0001, so the tabulated p_value 0.0001 is the stated upper bound. Crude group means were 83.13 +/- 3.95% (coal) vs 91.63 +/- 5.46% (non-coal); the control output lives on the non-coal assay."
