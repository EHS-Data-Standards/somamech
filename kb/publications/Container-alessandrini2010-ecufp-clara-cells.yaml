# =============================================================================
# KEY EVENT RELATIONSHIPS - all four rest on the same experimental logic:
# the antioxidant NAC, given only around the particle exposure, reversed the
# downstream event. No oxidative stress marker was measured in this study,
# so the upstream event is inferred from NAC reversibility rather than
# observed, which is why none is recorded as strong.
# =============================================================================

key_event_relationships:
  - id: "KER:alessandrini-oxstress-to-mucus-metaplasia"
    name: "EC-UFP-induced oxidative stress leads to mucus secretory program activation in the small airways"
    description: >-
      The antioxidant NAC, administered only before and during the EC-UFP
      exposure, limited goblet cell metaplasia and protected Clara cell
      ultrastructure, and the PAS morphometry showed the same reversal in the
      small airways. Support is moderate rather than strong because no
      oxidative stress marker was measured in this study - the upstream event
      is inferred from NAC reversibility - and quantitative understanding is
      low because the endpoints are plotted volume densities and qualitative
      ultrastructure with no dose-response.
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-mucus-metaplasia"
      name: "Mucus secretory program activation"
      biological_action: increased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: moderate
    quantitative_understanding: low
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We show that oxidative stress plays an important role, since NAC treatment is able to limit goblet cell metaplasia and protect Clara cell ultrastructure."
        explanation: "The authors' own statement of this upstream-to-downstream link, resting on the NAC reversal of both metaplasia and ultrastructural damage."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "NAC strongly reduced EC-UFP-induced mucus hypersecretion in allergic animals"
        explanation: "The results heading for the morphometric half of the same reversal, which the PAS assays record group by group."

  - id: "KER:alessandrini-oxstress-to-club-cell-loss"
    name: "EC-UFP-induced oxidative stress leads to loss of the club (Clara) cell marker CC16"
    description: >-
      The paper's central claim. EC-UFP inhalation altered CC16 at both
      protein and mRNA level and damaged Clara cell morphology, and NAC
      strongly reduced both the functional and the morphological alterations.
      Support is moderate, not strong, for two reasons: no oxidative stress
      marker was measured here, and the antioxidant did NOT reverse every arm
      - NAC failed to reduce the EC-UFP-induced CC16 mRNA increase in
      sensitized and challenged animals, which the authors read as post-
      transcriptional regulation. Quantitative understanding is low: all CC16
      values are plotted.
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-club-cell-loss"
      name: "Club cell marker loss"
      biological_action: decreased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: moderate
    quantitative_understanding: low
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Our findings demonstrate that oxidative stress plays an important role in EC-UFP-induced augmentation of functional and morphological alterations of Clara cells in allergic lung inflammation."
        explanation: "The paper's conclusion, stating exactly this upstream-to-downstream relationship."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "NAC strongly reduced both functional and morphological alterations of Clara cells."
        explanation: "The experimental basis for the link: the antioxidant reversed the club cell changes, which is what makes the upstream event inferable."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "EC-UFP-induced decrease in BALF CC16 concentrations were abrogated by NAC treatment (NS/NAC/UFP; S/NAC/UFP)."
        explanation: "The specific NAC-reversible CC16 endpoint behind this relationship."

  - id: "KER:alessandrini-oxstress-to-airway-inflammation"
    name: "EC-UFP-induced oxidative stress leads to augmented airway inflammation in the allergic lung"
    description: >-
      EC-UFP inhalation before allergen challenge increased the BAL
      inflammatory infiltrate, BALF IL-5 and IL-13, and lung TNF-alpha mRNA
      above the filtered-air allergic control, and NAC significantly reduced
      that augmentation at both the cellular and the TNF-alpha mRNA level. The
      TNF-alpha arm is the best-supported one in the paper because NAC
      reversed it strongly, in contrast to CC16 mRNA. Support is moderate
      because the upstream oxidative stress event is inferred from NAC
      reversibility and the inflammatory endpoints are reported in an
      additional file rather than quantified in the text.
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    relationship_type: "directly leads to"
    evidence_support: moderate
    quantitative_understanding: low
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In sensitized mice, EC-UFP inhalation prior to OVA challenge (S/UFP/OVA) caused a significant increase of BAL inflammatory infiltrate and BALF cytokines IL-5 and IL-13 7 days after OVA challenge, compared with sensitized and challenged mice exposed to filtered air (S/OVA); NAC treatment significantly reduced EC-UFP-induced augmentation of lung allergic inflammation (S/NAC/UFP/OVA)"
        explanation: "Both halves of the link in one sentence: the particle-driven increase in airway inflammation and its reversal by the antioxidant."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the antioxidant strategy reduced TNF-α mRNA expression in whole lung homogenate."
        explanation: "The molecular arm of the same reversal, measured by the TNF-alpha mRNA assay."

  - id: "KER:alessandrini-inflammation-to-epithelial-barrier"
    name: "Augmented airway inflammation leads to increased lung/blood barrier permeability"
    description: >-
      BALF total protein was highest in the group with the strongest
      inflammation (S/UFP/OVA) and the authors read this as an exudative
      response caused by increased airway permeability; serum CC16 rose while
      BALF CC16 fell in the same animals, the classic signature of leakage
      across the alveolo-capillary barrier. Recorded as indirect with weak
      support: no barrier measurement independent of the leaked proteins was
      made - no transepithelial resistance, no tracer flux - so inflammation
      and permeability are correlated here rather than shown to be sequential.
      Importantly, the non-challenged particle-exposed groups showed no
      protein induction at all, which is consistent with inflammation being
      required.
    upstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    downstream_event:
      id: "KE:ke-epithelial-barrier"
      name: "Altered epithelial barrier integrity"
      biological_action: decreased
      level_of_biological_organization: cellular
    relationship_type: "indirectly leads to"
    evidence_support: weak
    quantitative_understanding: low
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "BALF total protein concentration was also most increased in this group, confirming that the exudative response caused by the increased airway permeability plays an important role."
        explanation: "The authors' statement tying the inflamed, particle-exposed group to increased airway permeability, which is this relationship."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "No induction of protein levels were observed in any of the non-challenged groups (NS/UFP, S/UFP, with and without NAC treatment, Fig. 3a)."
        explanation: "The control that makes the link directional: without the allergic challenge, and therefore without the inflammation, there was no barrier leakage."

