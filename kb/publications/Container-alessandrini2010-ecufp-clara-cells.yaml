  - id: "BALF:alessandrini-inflammation"
    name: "BAL inflammatory infiltrate and BALF cytokines IL-5, IL-13 and IFN-gamma - EC-UFP inhalation before allergen challenge, with and without NAC"
    description: >-
      Differential BAL cell count and two site ELISAs for IL-5, IL-13 and IFN-
      gamma, reported in the paper's additional file 1 (functional
      characterization of the mouse model) rather than in a main figure, mean
      +/- SD, one-way ANOVA with post-hoc Scheffe test. EC-UFP inhalation
      before OVA challenge significantly increased the BAL inflammatory
      infiltrate and BALF IL-5 and IL-13 at 7 days compared with the filtered-
      air allergic control, and NAC significantly reduced that augmentation;
      NAC reduced inflammation in S/OVA only non-significantly. Non sensitized
      mice exposed to EC-UFP developed no inflammatory infiltrate and no
      cytokine release at all, and IFN-gamma was unchanged in every group.
      IL-5 and IL-13 have no named measurement slot in this schema and no
      values are tabulated in the fetched text, so no numeric measurements are
      recorded here.
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In sensitized mice, EC-UFP inhalation prior to OVA challenge (S/UFP/OVA) caused a significant increase of BAL inflammatory infiltrate and BALF cytokines IL-5 and IL-13 7 days after OVA challenge, compared with sensitized and challenged mice exposed to filtered air (S/OVA); NAC treatment significantly reduced EC-UFP-induced augmentation of lung allergic inflammation (S/NAC/UFP/OVA)"
        explanation: "Carries both the S/UFP/OVA increase and the S/NAC/UFP/OVA reversal that the treated output records of this assay stand for."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Non sensitized mice exposed to EC-UFP did not develop an inflammatory infiltrate and showed no cytokine release (NS/UFP, see additional file 1: functional characterization of the mouse model)."
        explanation: "The null result recorded by the NS/UFP output record: particles alone did not inflame a non-allergic lung."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "No significant alterations in the IFN-γ concentration were observed in any of the groups"
