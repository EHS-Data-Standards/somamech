gene_expression_assays:
  - id: "GE:alessandrini-cc16-protein-balf"
    name: "CC16 protein concentration in BALF - EC-UFP inhalation before allergen challenge, with and without NAC"
    description: >-
      Figure 2a and 2b, upper panels: CC16 (Clara cell protein, the main
      secretory product of bronchiolar Clara cells) measured by automated
      latex immunoassay in cell-free BALF at 0, 1 and 7 days, mean +/- SD, n =
      4-7 per time point, one-way ANOVA with Least Significant Difference
      test. EC-UFP for 24 h significantly DECREASED BALF CC16 at the 1-day
      time point in both non sensitized and sensitized mice, and NAC abrogated
      that decrease; by one week BALF CC16 had almost returned to the control
      level. In sensitized mice EC-UFP before allergen challenge gave a
      biphasic response - an initial significant reduction followed by a
      significant INCREASE at 7 days above untreated, NS/UFP, S/UFP and S/OVA
      - which NAC significantly reduced. OVA challenge alone caused a
      transitional reduction at 1 day that NAC only minimally reduced. Values
      are plotted only, so no numeric measurements are recorded here; the
      direction of each effect is carried in response_comparisons.
    target_gene: "CC16 (Clara cell protein, secretoglobin family 1A member 1)"
    gene_expression_method: "Automated latex immunoassay for CC16 protein"
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Non sensitized and sensitized mice exposed to EC-UFP for 24 h (NS/UFP, S/UFP) showed a significant decrease in CC16 in BALF at 1-day time point (Fig. 2a, upper panel)."
        explanation: "The EC-UFP-alone decrease in BALF CC16 recorded by the NS/UFP and S/UFP output records."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "EC-UFP-induced decrease in BALF CC16 concentrations were abrogated by NAC treatment (NS/NAC/UFP; S/NAC/UFP)."
        explanation: "The NAC reversal recorded by the NS/NAC/UFP and S/NAC/UFP output records - the paper's basis for an oxidative-stress mechanism."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "One week after EC-UFP inhalation, BALF CC16 concentrations almost reached the control level."
        explanation: "Establishes that the particle-only BALF CC16 decrease was transient, which the assay description records."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Sensitized mice exposed to EC-UFP inhalation prior to allergen challenge showed an initial significant reduction in BALF CC16, followed by a significant increase in CC16 BALF content at the 7-day time point compared to untreated animals"
        explanation: "The biphasic S/UFP/OVA response carried by that output record and by the two corresponding response comparisons."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "NAC minimally reduced OVA-induced CC16 alterations (S/NAC/OVA)."
        explanation: "Supports the weak NAC effect recorded by the S/NAC/OVA output record, in contrast to its strong effect in the particle-exposed groups."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Untreated mice served as baseline controls (dotted line). Data presented as mean ± SD (n = 4-7/time point). *p < 0.05, **p < 0.01 vs untreated;"
        explanation: "Fixes the baseline group, central tendency, group sizes and significance thresholds for this figure."
