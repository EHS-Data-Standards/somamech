  - id: "GCM:alessandrini-em-clara-hyperplasia"
    name: "TEM/SEM Clara cell hyperplasia after EC-UFP inhalation alone, with and without NAC"
    description: >-
      Figures 6 and 7, the non-challenged arm: EC-UFP inhalation alone induced
      hyperplasia and proliferation of the Clara cells of the bronchioli, so
      that ciliated cells seemed reduced in number and appeared constricted,
      and in sensitized non-challenged mice clusters of 3 or 4 Clara cells
      formed. Crucially this happened WITHOUT goblet cell metaplasia, which
      the authors call surprising for such relatively inert particles - it is
      the finding that separates the particle-only response from the particle-
      plus-allergen response recorded in the companion EM assay. NAC reduced
      these morphological alterations to a great extent: no clusters were
      found and the Clara cell surface displayed the typical dome-shaped
      apical projections as in untreated mice. Qualitative ultrastructural
      assessment, n = 2 per time point per group, so no numeric values are
      recorded.
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In TEM as well as in SEM the Clara cells of the bronchioli exhibited hyperplasia and proliferation"
        explanation: "The hyperplasia and proliferation after EC-UFP alone that the NS/UFP and S/UFP output records carry."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Surprisingly, we showed hyperplasia of Clara cells (but no goblet cell metaplasia) following inhalation of relatively inert particles, such as EC-UFP"
        explanation: "States that the particle-only response was hyperplasia WITHOUT metaplasia, the distinction this assay exists to record."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In non sensitized mice EC-UFP inhalation caused alterations in CC16 concentration, both at protein and mRNA level, and induced Clara cell hyperplasia."
        explanation: "The abstract's statement of Clara cell hyperplasia in non sensitized mice, matching the NS/UFP output record."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "NAC strongly reduced EC-UFP-induced morphological alterations in Clara Cells"
        explanation: "The paper's section heading for the NAC reversal recorded by the NS/NAC/UFP and S/NAC/UFP output records."
    has_specified_output:
      - id: "GCM:alessandrini-em-clara-hyperplasia-output-untreated"
        name: "Clara cell hyperplasia - untreated baseline"
        experimental_group: baseline
        measured_under: "EXPOSURE:alessandrini-untreated"
      - id: "GCM:alessandrini-em-clara-hyperplasia-output-ns-ufp"
        name: "Clara cell hyperplasia - NS/UFP"
        experimental_group: treated
        measured_under: "EXPOSURE:alessandrini-ns-ufp"
      - id: "GCM:alessandrini-em-clara-hyperplasia-output-ns-nac-ufp"
        name: "Clara cell hyperplasia - NS/NAC/UFP"
        experimental_group: treated
        measured_under: "EXPOSURE:alessandrini-ns-nac-ufp"
      - id: "GCM:alessandrini-em-clara-hyperplasia-output-s-ufp"
        name: "Clara cell hyperplasia - S/UFP"
