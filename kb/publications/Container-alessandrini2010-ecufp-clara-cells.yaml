  - id: "GE:alessandrini-cc16-protein-serum"
    name: "CC16 protein concentration in serum - EC-UFP inhalation before allergen challenge, with and without NAC"
    description: >-
      Figure 2a and 2b, bottom panels: serum CC16 by automated latex
      immunoassay on blood taken from the retro orbital plexus before BAL,
      mean +/- SD, n = 4-7 per time point, one-way ANOVA with Least
      Significant Difference test. In contrast to the BALF response, serum
      CC16 INCREASED significantly after EC-UFP in both non sensitized and
      sensitized mice and was still raised one week after inhalation; in
      sensitized mice EC-UFP before allergen challenge increased serum CC16
      further, and NAC significantly reduced that increase. NAC reduced serum
      CC16 in sensitized EC-UFP-exposed mice at the 7 day time point but had
      no effect in S/OVA. Because CC16 is a marker of alveolo-capillary
      barrier permeability, the opposite directions in BALF and serum are read
      by the authors as increased leakage across the lung/blood barrier, which
      is why this assay informs on the epithelial barrier key event. Values
      are plotted only, so no numeric measurements are recorded here.
    target_gene: "CC16 (Clara cell protein, secretoglobin family 1A member 1)"
    gene_expression_method: "Automated latex immunoassay for CC16 protein"
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In contrast to BALF CC16 concentrations, serum CC16 concentrations increased significantly following exposure to EC-UFP in both non sensitized and sensitized mice (Fig. 2a, bottom panel)."
        explanation: "The serum CC16 increase after EC-UFP recorded by the NS/UFP and S/UFP output records, and the BALF/serum divergence stated in the description."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In sensitized mice, inhalation of EC-UFP prior to OVA challenge caused most significant alterations of BALF and serum CC16 concentration, BALF total protein and TNF-α relative expression compared to relevant controls"
        explanation: "Establishes S/UFP/OVA as the group with the largest serum CC16 alteration, which is what that output record stands for."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Our results showed that sensitized and challenged mice exposed to EC-UFP prior to allergen challenge showed a transient decrease, followed by a late increase of CC16 in BALF"
        explanation: "The authors' own summary of the biphasic BALF course that the divergent serum course is contrasted with here."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "BALF total protein concentration was also most increased in this group, confirming that the exudative response caused by the increased airway permeability plays an important role."
        explanation: "Ties the serum CC16 rise to increased airway permeability, the key event this assay is mapped to."
