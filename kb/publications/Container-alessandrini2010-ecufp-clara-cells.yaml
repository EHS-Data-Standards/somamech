  - id: "GCM:alessandrini-pas-large-airways"
    name: "Volume density of PAS positive material in large airways (circumference > 800 um) - EC-UFP inhalation before allergen challenge, with and without NAC"
    description: >-
      Figure 5b: the same morphometrical analysis in cross sections of large
      airways (circumference > 800 um), 7 days after OVA challenge / EC-UFP
      inhalation, expressed as percentage of PAS positive material per total
      epithelial cells, n = 6-12 per group, one-way ANOVA with post-hoc
      Scheffe test. The allergen-driven metaplasia of Clara cells into mucous
      cells was significant in the large airways, but EC-UFP exposure before
      allergen challenge did NOT increase it further here - the mirror of the
      small-airway result. NAC significantly decreased goblet cell metaplasia
      and mucus hypersecretion in the large bronchi as well. Values are
      plotted only, so no numeric measurements are recorded here.
