# =============================================================================
# RESPONSE COMPARISONS - every change the paper states, with the direction
# it states. No change_value or change_type is recorded anywhere: the paper
# reports directions and significance markers off plots, never a magnitude,
# and nothing is computed here. Airway hyperresponsiveness (PenH) has no
# named measurement slot, so its direction is carried in the assay
# description and evidence instead of a comparison record.
# =============================================================================

response_comparisons:
  - id: "COMP:alessandrini-cc16-balf-ns-ufp"
    name: "BALF CC16, NS/UFP vs untreated baseline - decreased"
    description: >-
      Figure 2a upper panel. EC-UFP inhalation alone for 24 h significantly
      decreased BALF CC16 at the 1-day time point in non sensitized mice.
      Marked p < 0.05 or p < 0.01 vs untreated off the plot; no magnitude is
      stated, so none is recorded.
    derived_from_assay: "GE:alessandrini-cc16-protein-balf"
    compared_measurement: "protein_level"
    control_output: "GE:alessandrini-cc16-protein-balf-output-untreated"
    treated_output: "GE:alessandrini-cc16-protein-balf-output-ns-ufp"
    change_direction: decreased
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-cc16-balf-s-ufp"
    name: "BALF CC16, S/UFP vs untreated baseline - decreased"
    description: >-
      Figure 2a upper panel. The same significant 1-day decrease in BALF CC16
      occurred in sensitized but non-challenged mice, so allergic
      sensitization was not required for it.
    derived_from_assay: "GE:alessandrini-cc16-protein-balf"
    compared_measurement: "protein_level"
    control_output: "GE:alessandrini-cc16-protein-balf-output-untreated"
    treated_output: "GE:alessandrini-cc16-protein-balf-output-s-ufp"
    change_direction: decreased
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-cc16-balf-ns-nac-ufp"
    name: "BALF CC16, NS/NAC/UFP vs untreated baseline - no change"
    description: >-
      Figure 2a upper panel. NAC abrogated the EC-UFP-induced BALF CC16
      decrease, so the NAC-treated particle-exposed group no longer differed
      from the untreated baseline. This NAC reversibility is the paper's
      evidence that the CC16 response is oxidative-stress driven.
    derived_from_assay: "GE:alessandrini-cc16-protein-balf"
    compared_measurement: "protein_level"
    control_output: "GE:alessandrini-cc16-protein-balf-output-untreated"
    treated_output: "GE:alessandrini-cc16-protein-balf-output-ns-nac-ufp"
    change_direction: no_change
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-cc16-balf-s-ufp-ova"
    name: "BALF CC16 at 7 days, S/UFP/OVA vs untreated baseline - increased"
    description: >-
      Figure 2b upper panel. In sensitized mice, EC-UFP before allergen
      challenge gave a biphasic course: an initial significant reduction and
      then a significant INCREASE in BALF CC16 at the 7-day time point above
      untreated animals, NS/UFP, S/UFP and S/OVA. The record here is for the
      late increase; the early reduction is stated in the same sentence and in
      the assay description.
    derived_from_assay: "GE:alessandrini-cc16-protein-balf"
    compared_measurement: "protein_level"
    control_output: "GE:alessandrini-cc16-protein-balf-output-untreated"
    treated_output: "GE:alessandrini-cc16-protein-balf-output-s-ufp-ova"
    change_direction: increased
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-cc16-serum-ns-ufp"
    name: "Serum CC16, NS/UFP vs untreated baseline - increased"
    description: >-
      Figure 2a bottom panel. Serum CC16 increased significantly after EC-UFP
      inhalation in non sensitized mice and was still detectable one week
      later - the opposite direction to BALF CC16 in the same animals, which
      the authors read as leakage across the air/blood barrier.
    derived_from_assay: "GE:alessandrini-cc16-protein-serum"
    compared_measurement: "protein_level"
    control_output: "GE:alessandrini-cc16-protein-serum-output-untreated"
    treated_output: "GE:alessandrini-cc16-protein-serum-output-ns-ufp"
    change_direction: increased
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-cc16-serum-s-ufp-ova"
    name: "Serum CC16, S/UFP/OVA vs untreated baseline - increased"
    description: >-
      Figure 2b bottom panel. S/UFP/OVA showed the most significant serum CC16
      alteration of any group; NAC significantly reduced it (S/NAC/UFP/OVA).
    derived_from_assay: "GE:alessandrini-cc16-protein-serum"
    compared_measurement: "protein_level"
    control_output: "GE:alessandrini-cc16-protein-serum-output-untreated"
    treated_output: "GE:alessandrini-cc16-protein-serum-output-s-ufp-ova"
    change_direction: increased
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-protein-s-ova"
    name: "BALF total protein, S/OVA vs untreated baseline - increased"
    description: >-
      Figure 3b. Allergen challenge alone raised BALF total protein above the
      untreated baseline; NAC significantly reduced that rise (S/NAC/OVA).
    derived_from_assay: "BALF:alessandrini-total-protein"
    compared_measurement: "total_protein_concentration"
    control_output: "BALF:alessandrini-total-protein-output-untreated"
    treated_output: "BALF:alessandrini-total-protein-output-s-ova"
    change_direction: increased
    statistical_test: "One-way ANOVA with post-hoc Scheffe test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-protein-s-ufp-ova"
    name: "BALF total protein at 7 days, S/UFP/OVA vs S/OVA - increased"
    description: >-
      Figure 3b. EC-UFP inhalation before OVA challenge produced a further
      increase of BALF total protein over the filtered-air allergic control at
      the 7 days time point - the exudative response the authors attribute to
      increased airway permeability.
    derived_from_assay: "BALF:alessandrini-total-protein"
    compared_measurement: "total_protein_concentration"
    control_output: "BALF:alessandrini-total-protein-output-s-ova"
    treated_output: "BALF:alessandrini-total-protein-output-s-ufp-ova"
    change_direction: increased
    statistical_test: "One-way ANOVA with post-hoc Scheffe test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-protein-s-nac-ufp-ova"
    name: "BALF total protein at 7 days, S/NAC/UFP/OVA vs S/UFP/OVA - decreased"
    description: >-
      Figure 3b. NAC significantly reduced BALF total protein concentrations
      at the 7 days time point, so the particle-driven barrier leakage is
      oxidative-stress dependent.
    derived_from_assay: "BALF:alessandrini-total-protein"
    compared_measurement: "total_protein_concentration"
    control_output: "BALF:alessandrini-total-protein-output-s-ufp-ova"
    treated_output: "BALF:alessandrini-total-protein-output-s-nac-ufp-ova"
    change_direction: decreased
    statistical_test: "One-way ANOVA with post-hoc Scheffe test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-protein-ns-ufp"
    name: "BALF total protein, NS/UFP vs untreated baseline - no change"
    description: >-
      Figure 3a. NULL RESULT: no induction of protein levels was observed in
      any of the non-challenged groups, with or without NAC. EC-UFP alone did
      not open the lung/blood barrier - the allergic challenge was required.
    derived_from_assay: "BALF:alessandrini-total-protein"
    compared_measurement: "total_protein_concentration"
    control_output: "BALF:alessandrini-total-protein-output-untreated"
    treated_output: "BALF:alessandrini-total-protein-output-ns-ufp"
    change_direction: no_change
    statistical_test: "One-way ANOVA with post-hoc Scheffe test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-cc16-mrna-ns-ufp"
    name: "Lung CC16 mRNA, NS/UFP vs untreated baseline - increased"
    description: >-
      Figure 4a upper panel. EC-UFP exposure alone increased CC16 relative
      mRNA expression in non sensitized mice. Note the direction: the BALF
      CC16 protein fell at the same time point while its mRNA rose, which the
      authors interpret as increased intracellular storage of CC16 protein.
    derived_from_assay: "GE:alessandrini-cc16-mrna-lung"
    compared_measurement: "mrna_level"
    control_output: "GE:alessandrini-cc16-mrna-lung-output-untreated"
    treated_output: "GE:alessandrini-cc16-mrna-lung-output-ns-ufp"
    change_direction: increased
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-cc16-mrna-s-ova"
    name: "Lung CC16 mRNA, S/OVA vs untreated baseline - no change"
    description: >-
      Figure 4b upper panel. NULL RESULT: allergen challenge alone had no
      significant effect on relative CC16 mRNA expression, although it did
      significantly increase TNF-alpha in the same animals.
    derived_from_assay: "GE:alessandrini-cc16-mrna-lung"
    compared_measurement: "mrna_level"
    control_output: "GE:alessandrini-cc16-mrna-lung-output-untreated"
    treated_output: "GE:alessandrini-cc16-mrna-lung-output-s-ova"
    change_direction: no_change
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-cc16-mrna-s-nac-ufp-ova"
    name: "Lung CC16 mRNA, S/NAC/UFP/OVA vs S/UFP/OVA - no change"
    description: >-
      Figure 4b upper panel. NULL RESULT for the antioxidant: in sensitized
      and challenged animals NAC FAILED to reduce the EC-UFP-induced increase
      in CC16 mRNA, in contrast to its strong effect on TNF-alpha mRNA in the
      very same samples. This dissociation is why the authors propose post-
      transcriptional regulation of CC16 by NAC.
    derived_from_assay: "GE:alessandrini-cc16-mrna-lung"
    compared_measurement: "mrna_level"
    control_output: "GE:alessandrini-cc16-mrna-lung-output-s-ufp-ova"
    treated_output: "GE:alessandrini-cc16-mrna-lung-output-s-nac-ufp-ova"
    change_direction: no_change
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-tnfa-mrna-ns-ufp"
    name: "Lung TNF-alpha mRNA, NS/UFP vs untreated baseline - increased"
    description: >-
      Figure 4a bottom panel. EC-UFP exposure alone increased TNF-alpha
      relative mRNA expression in non sensitized mice, i.e. the particles
      engaged a pro-inflammatory transcriptional response even without
      allergen.
    derived_from_assay: "GE:alessandrini-tnfa-mrna-lung"
    compared_measurement: "mrna_level"
    control_output: "GE:alessandrini-tnfa-mrna-lung-output-untreated"
    treated_output: "GE:alessandrini-tnfa-mrna-lung-output-ns-ufp"
    change_direction: increased
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-tnfa-mrna-s-ufp-ova"
    name: "Lung TNF-alpha mRNA, S/UFP/OVA vs S/OVA - increased"
    description: >-
      Figure 4b bottom panel. EC-UFP before allergen challenge increased TNF-
      alpha mRNA significantly compared with ALL other groups, including the
      filtered-air allergic control - the synergistic effect of allergic
      inflammation and particle inhalation on lung TNF-alpha that the
      discussion describes.
    derived_from_assay: "GE:alessandrini-tnfa-mrna-lung"
    compared_measurement: "mrna_level"
    control_output: "GE:alessandrini-tnfa-mrna-lung-output-s-ova"
    treated_output: "GE:alessandrini-tnfa-mrna-lung-output-s-ufp-ova"
    change_direction: increased
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-tnfa-mrna-s-nac-ufp-ova"
    name: "Lung TNF-alpha mRNA, S/NAC/UFP/OVA vs S/UFP/OVA - decreased"
    description: >-
      Figure 4b bottom panel. NAC strongly reduced the EC-UFP-induced increase
      in TNF-alpha mRNA expression. Paired with the unchanged CC16 mRNA under
      NAC, this is the cleanest oxidative-stress-dependent endpoint in the
      paper.
    derived_from_assay: "GE:alessandrini-tnfa-mrna-lung"
    compared_measurement: "mrna_level"
    control_output: "GE:alessandrini-tnfa-mrna-lung-output-s-ufp-ova"
    treated_output: "GE:alessandrini-tnfa-mrna-lung-output-s-nac-ufp-ova"
    change_direction: decreased
    statistical_test: "One-way ANOVA with Least Significant Difference (LSD) test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-pas-small-s-ova"
    name: "PAS positive volume density in small airways, S/OVA vs NS/UFP - increased"
    description: >-
      Figure 5a. Allergen challenge alone had a significant effect on goblet
      cell metaplasia and mucus hypersecretion, against an NS/UFP group that
      showed no PAS positive material at all. NS/UFP is the reference group
      the figure's significance markers are against, which is why it is the
      control output here.
    derived_from_assay: "GCM:alessandrini-pas-small-airways"
    compared_measurement: "goblet_cell_percentage"
    control_output: "GCM:alessandrini-pas-small-airways-output-ns-ufp"
    treated_output: "GCM:alessandrini-pas-small-airways-output-s-ova"
    change_direction: increased
    statistical_test: "One-way ANOVA with post-hoc Scheffe test"
    derivation: reported_in_paper

  - id: "COMP:alessandrini-pas-small-s-ufp-ova"
    name: "PAS positive volume density in small airways, S/UFP/OVA vs S/OVA - increased"
    description: >-
      Figure 5a. EC-UFP exposure before allergen challenge increased goblet
      cell metaplasia and mucus hypersecretion in the SMALL airways over the
