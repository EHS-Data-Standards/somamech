balf_sputum_assays:
  - id: "BALF:alessandrini-total-protein"
    name: "BALF total protein concentration - EC-UFP inhalation before allergen challenge, with and without NAC"
    description: >-
      Figure 3, Coomassie protein assay on cell-free BALF, mean +/- SD, n =
      4-8 per time point, one-way ANOVA with post-hoc Scheffe test, at 0, 1
      and 7 days. OVA challenge alone raised BALF total protein above the
      untreated baseline and NAC significantly reduced that rise. EC-UFP
      inhalation before OVA challenge produced a further increase at the 7 day
      time point (S/UFP/OVA), which NAC significantly reduced. The non-
      challenged groups (NS/UFP, S/UFP, with and without NAC) showed no
      induction of protein levels at all, so the particle effect on barrier
      leakage required the allergic challenge. Values are plotted only, so no
      numeric measurements are recorded here.
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In sensitized mice, OVA challenge alone caused an increase in BALF total protein concentration compared to control, which was significantly reduced by NAC treatment (Fig. 3b)."
        explanation: "Supports the S/OVA vs untreated difference and the NAC effect in S/NAC/OVA that this assay's output records stand for."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "A further increase of BALF total protein was detected in sensitized mice exposed to EC-UFP inhalation prior to OVA challenge (S/UFP/OVA) at the 7 days time point (Fig. 3b)."
        explanation: "The particle-plus-allergen increase in BALF total protein recorded by the S/UFP/OVA output record."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "NAC significantly reduced BALF total protein concentrations (S/NAC/UFP/OVA) at the 7 days time point."
        explanation: "Supports the reversal recorded by the S/NAC/UFP/OVA output record and the corresponding response comparison."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "No induction of protein levels were observed in any of the non-challenged groups (NS/UFP, S/UFP, with and without NAC treatment, Fig. 3a)."
        explanation: "The explicit null result carried by the four non-challenged output records of this assay."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Untreated mice served as baseline controls (dotted line). Data presented as mean ± SD (n = 4-8/time point)."
        explanation: "Fixes the baseline group, the central tendency and the group sizes stated for this figure."
    has_specified_output:
      - id: "BALF:alessandrini-total-protein-output-untreated"
        name: "BALF total protein - untreated baseline"
        experimental_group: baseline
        measured_under: "EXPOSURE:alessandrini-untreated"
      - id: "BALF:alessandrini-total-protein-output-ns-ufp"
