    name: "CC16 relative mRNA expression in whole lung homogenate - EC-UFP inhalation before allergen challenge, with and without NAC"
    description: >-
      Figure 4a and 4b, upper panels: TaqMan real-time RT-PCR for CC16 in lung
      homogenates retrieved 24 h after EC-UFP / filtered air exposure,
      normalised to 18S and to the untreated group by the delta-delta-CT
      method, mean +/- SD, n = 3-6 per group, one-way ANOVA with Least
      Significant Difference test. EC-UFP exposure alone INCREASED CC16 mRNA
      in both non sensitized and sensitized mice, which the authors read as
      increased intracellular storage of CC16 protein. Allergen challenge
      alone had no significant effect on CC16 mRNA. EC-UFP before allergen
      challenge raised CC16 mRNA similarly to NS/UFP and S/UFP. NAC moderately
      reduced CC16 mRNA in non challenged animals but FAILED to reduce the EC-
      UFP-induced increase in sensitized and challenged animals - the authors'
      reason for proposing post-transcriptional regulation of CC16 by NAC.
      Note that this assay is mapped to the club cell marker key event, whose
      canonical wording is a decrease; the direction actually observed here is
      an increase and is recorded in the response_comparisons. Values are
      plotted only, so no numeric measurements are recorded here.
