# =============================================================================
# Alessandrini et al. (2010) - Effects of ultrafine particles-induced
# oxidative stress on Clara cells in allergic lung inflammation
# =============================================================================
#
# Source: Particle and Fibre Toxicology 2010, 7:11
# DOI: 10.1186/1743-8977-7-11
#
# Study design (all in vivo, mouse):
#   - Five to seven-week-old Balb/c mice
#   - OVA/alum sensitization i.p. on days 0, 7, 14, 28, 42, 56; OVA aerosol
#     challenge (20 min, 1% LPS-depleted OVA) on day 70
#   - Elemental carbon ultrafine particles (EC-UFP), spark-generated,
#     507 ug/m3 for 24 h, inhaled immediately before allergen challenge
#   - N-acetylcysteine (NAC) 250 mg/kg i.p. twice (shortly before and close
#     to mid EC-UFP exposure) as the antioxidant intervention
#   - Nine groups: untreated baseline, NS/UFP, NS/NAC/UFP, S/UFP,
#     S/NAC/UFP, S/OVA, S/NAC/OVA, S/UFP/OVA, S/NAC/UFP/OVA
#   - BAL at 0, 1 or 7 days after OVA challenge / end of EC-UFP exposure
#
# NUMERIC VALUES: this paper reports essentially all of its endpoints as
# plots (Fig. 2 BALF/serum CC16, Fig. 3 BALF total protein, Fig. 4 CC16 and
# TNF-alpha mRNA, Fig. 5 PAS volume density) or in an additional file (BAL
# cells, cytokines, airway hyperresponsiveness). Per the extraction rules no
# figure-derived measurement is invented here, so the output records carry
# experimental_group and measured_under but NO numeric values; the direction
# and significance of every effect is carried in response_comparisons and in
# the assay descriptions, each backed by a verbatim quote. The only numbers
# stated in the text are the exposure characterisation, the NAC dose, the
# group sizes and the sensitization titres, and those are recorded where a
# slot exists for them.
#
# The paper's mechanistic claim rests on NAC reversibility rather than on a
# direct oxidative stress measurement - no ROS, GSH or isoprostane endpoint
# was measured in THIS study (the isoprostane data belong to the authors'
# earlier paper), so no OxidativeStressAssay is recorded. Oxidative stress
# appears only as the upstream key event of the key_event_relationships.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:20420656"
  reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
  doi: "10.1186/1743-8977-7-11"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:alessandrini-bal-protein-001"
    name: "Bronchoalveolar lavage with BALF total protein and cytokine ELISA"
    description: >-
      Airways lavaged five times with 0.8 ml PBS. Aliquots of cell-free BAL
      fluid assayed in duplicate for total protein by Coomassie Protein Assay
      (Pierce Chemical Co.) and for IL-5, IFN-gamma and IL-13 by two site
      ELISAs using antibodies from BD Biosciences (IL-5, IFN-gamma) and
      BioSource (IL-13). BAL performed at 0, 1 or 7 days after OVA challenge
      or after termination of EC-UFP exposure, n = 4 per time point; BALF
      stored at -80 C after centrifugation.
    equipment_required:
      - "Coomassie Protein Assay (Pierce Chemical Co.)"
      - "Two site ELISA kits (BD Biosciences; BioSource)"

  - id: "PROTOCOL:alessandrini-bal-diffcount-001"
    name: "Differential BAL cell count on Diff-Quick stained cytospins"
    description: >-
      Viability and yield of BAL cells quantified via trypan blue exclusion in
      a hemocytometer. Differential BAL cell count of 400 cells per sample
      performed on cytospins (600 rpm for 10 min) fixed and stained with Diff-
      Quick (Dade Behring).
    equipment_required:
      - "Hemocytometer"
      - "Cytospin centrifuge"
      - "Diff-Quick stain (Dade Behring, Marburg, Germany)"

  - id: "PROTOCOL:alessandrini-cc16-immunoassay-001"
    name: "Automated latex immunoassay for CC16 in BALF and serum"
    description: >-
      Cell-free BALF and serum aliquots assayed in duplicate for CC16 by an
      automated latex immunoassay using a polyclonal rabbit antibody raised
      against rat CC16 and applicable to both rat and mouse CC16 analysis.
      Before BAL, blood samples were taken from the retro orbital plexus and
      centrifuged; serum aliquots stored at -80 C.
    equipment_required:
      - "Automated latex immunoassay analyser"
      - "Polyclonal rabbit anti-rat CC16 antibody"

  - id: "PROTOCOL:alessandrini-qpcr-cc16-001"
    name: "TaqMan real-time RT-PCR for CC16 in whole lung homogenate"
    description: >-
      Lungs retrieved 1 day after EC-UFP exposure / allergen challenge,
      homogenized, total RNA isolated with the RNeasy Mini kit (Qiagen) and
      first strand cDNA synthesised with the iScript cDNA synthesis kit
      (BioRad). Quantitative PCR with TaqMan Gene Expression Assay
      Mm01230908_m1 for CC16 and TaqMan Universal PCR Master Mix on an
      ABIprism7000 Sequence Detection System (Applied Biosystems). Expression
      normalised to the housekeeping gene 18S (Hs99999901_s1) and to the mean
      of the untreated group by the delta-delta-CT method. One protocol id per
      target gene because each target uses its own TaqMan assay.
    equipment_required:
      - "ABIprism7000 Sequence Detection System (Applied Biosystems, Darmstadt, Germany)"
      - "TaqMan Gene Expression Assay Mm01230908_m1"
      - "RNeasy Mini kit (Qiagen GmbH); iScript cDNA synthesis kit (BioRad)"

  - id: "PROTOCOL:alessandrini-qpcr-tnfa-001"
    name: "TaqMan real-time RT-PCR for TNF-alpha in whole lung homogenate"
    description: >-
      Lungs retrieved 1 day after EC-UFP exposure / allergen challenge,
      homogenized, total RNA isolated with the RNeasy Mini kit (Qiagen) and
      first strand cDNA synthesised with the iScript cDNA synthesis kit
      (BioRad). Quantitative PCR with TaqMan Gene Expression Assay
      Mm00443258_m1 for TNF-alpha and TaqMan Universal PCR Master Mix on an
      ABIprism7000 Sequence Detection System (Applied Biosystems). Expression
      normalised to the housekeeping gene 18S (Hs99999901_s1) and to the mean
      of the untreated group by the delta-delta-CT method. One protocol id per
      target gene because each target uses its own TaqMan assay.
    equipment_required:
      - "ABIprism7000 Sequence Detection System (Applied Biosystems, Darmstadt, Germany)"
      - "TaqMan Gene Expression Assay Mm00443258_m1"
      - "RNeasy Mini kit (Qiagen GmbH); iScript cDNA synthesis kit (BioRad)"

  - id: "PROTOCOL:alessandrini-pas-morphometry-001"
    name: "PAS staining and morphometrical analysis of volume density of PAS positive material"
    description: >-
      Lungs removed after BAL and fixed in 10% buffered formalin; left lobe
      used for histopathology. After paraffin embedding, 3.5 um sections
      stained with hematoxylin-eosin and periodic acid Schiff. Volume density
      of PAS positive material determined with the double square lattice test
      system E80 and the Optimas software package in cross sections of small
      (circumference <= 800 um) and large (circumference > 800 um) airways.
      Data expressed as percentage of PAS positive material per total
      epithelial cells; lungs retrieved 7 days after OVA challenge / EC-UFP
      inhalation, n = 6-12 per group.
    equipment_required:
      - "Double square lattice test system E80"
      - "Optimas software package (Washington, USA)"
      - "Periodic acid Schiff and hematoxylin-eosin stains"
    quality_control_criteria: "Volume density scored separately in small (circumference <= 800 um) and large (circumference > 800 um) airway cross sections"

  - id: "PROTOCOL:alessandrini-em-001"
    name: "Transmission and scanning electron microscopy of bronchiolar epithelium"
    description: >-
      Lungs fixed by intratracheal perfusion with 2.5% glutaraldehyde in 0.1 M
      cacodylate buffer (pH 7.4), n = 2 per time point per group. For TEM
      peripheral and central sections of the right lung were minced, for SEM
      the left lung was cut longitudinally; all samples fixed a further 4-7
      days in glutaraldehyde and postfixed in 1% osmiumtetroxide. TEM: EMbed
      812 embedding, semithin 500 nm sections stained with Richardson solution
      to select the region, then ultrathin sections on formvar-coated 75-mesh
      nickel grids double-stained with uranyl acetate and lead citrate,
      observed at 80 kV (JEOL 1210). SEM: cacodylate rinses, ascending ethanol
      dehydration, critical point drying, sputter-coating with 10 nm gold,
      examined at 15 kV (JEOL 6300). Analysis focussed on the small airways at
      the one week time point.
    equipment_required:
      - "JEOL 1210 transmission electron microscope (Tokyo, Japan), 80 kV"
      - "JEOL 6300 scanning electron microscope (Tokyo, Japan), 15 kV"
      - "EMbed 812 (Science Services); uranyl acetate and lead citrate"
    quality_control_criteria: "Semithin Richardson-stained sections used to select the portion suitable for electron microscopy; small airways only, one week time point"

  - id: "PROTOCOL:alessandrini-plethysmography-001"
    name: "Unrestrained whole body plethysmography for enhanced pause (PenH)"
    description: >-
      Lung function tests performed 24 h after allergen challenge in
      unrestrained animals using whole body plethysmography (Buxco
      Electronics). The enhanced pause (PenH) determined before and after
      methacholine exposure was applied as an index of airway
      hyperresponsiveness. Methacholine doses M1-M5: 10 mg/ml nebulized for 1,
      2 and 4 minutes, then 40 mg/ml for 2 and 4 minutes, with a 3 min
      recording interval after each level; the mean of the PenH values of the
      2nd and 3rd min was used to quantify airway hyperresponsiveness. n = 5-7
      per group.
    equipment_required:
      - "Buxco Electronics whole body plethysmograph (Sharon, Connecticut, USA)"
      - "Methacholine aerosol, 10 mg/ml and 40 mg/ml"

