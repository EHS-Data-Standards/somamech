  - id: "GCM:alessandrini-em-goblet-metaplasia"
    name: "TEM/SEM goblet cell metaplasia and Clara cell ultrastructural damage - EC-UFP inhalation before allergen challenge, with and without NAC"
    description: >-
      Figures 6 and 7: transmission and scanning electron microscopy of the
      small airways at the one week time point, n = 2 per time point per
      group. This is a QUALITATIVE ultrastructural assessment, so the output
      records carry no numeric values at all. In untreated mice Clara cells
      were cuboidal with dense homogenous secretory granules near the apex and
      no goblet cells were detectable. In S/OVA the bronchioli featured goblet
      cell metaplasia: the dense secretory granules converted to mucus
      containing vesicles, with signs of partial necrosis. In S/UFP/OVA the
      damage was most profound - more pronounced goblet cell metaplasia than
      S/OVA, areas with no rudiments of secretory granules left, smooth
      endoplasmic reticulum and dimorphic mitochondria entirely displaced by
      mucous vesicles, widening of intercellular spaces, detachment of the
      epithelium and necrosis. NAC treatment extensively reduced these
      alterations: over broad ranges of bronchioli Clara cells displayed
      normal features and necrosis appeared to a strikingly lesser degree. No
      particles were ever detected inside Clara cells, so the authors read the
      damage as an indirect particle effect mediated by inflammatory mediators
      in the lung lining fluid.
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In S/OVA mice, the bronchioli featured goblet cell metaplasia: the dense homogenous secretory granules of the Clara cells converted to mucus containing vesicles, some of them containing dark residues of the secret"
        explanation: "The allergen-driven metaplasia recorded by the S/OVA output record of this assay."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Electron miscroscopy shows most dramatic alterations of Clara cell ultrastructure in this group, characterized by extreme hyperplasia, metaplasia with complete loss of secretory granules and necrosis."
        explanation: "The authors' summary of the S/UFP/OVA ultrastructure, which that output record stands for (the typo 'miscroscopy' is as printed)."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In some areas no rudiments of the secretory granules could be detected"
        explanation: "The complete secretory granule loss in S/UFP/OVA that distinguishes it from the allergen-only group."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Widening of the intercellular spaces and detachment of the epithelium were frequently observed (Fig. 6, S/UFP/OVA, arrows)."
        explanation: "The epithelial detachment in S/UFP/OVA, the ultrastructural counterpart of the raised BALF total protein in the same group."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Over broad ranges of bronchioli Clara cells displayed normal features. Necrosis appeared to a striking less degree."
        explanation: "The NAC rescue recorded by the S/NAC/UFP/OVA output record."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Following EC-UFP exposure, no particles could be detected within Clara cells. EC-UFP inhalation alone induced alterations in the morphology of Clara cells."
        explanation: "Establishes that the Clara cell changes were not caused by particles inside the cells, as noted in this assay's description."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In the analysis of the samples performed by SEM and TEM, we focussed on the small airways (circumference ≤ 800 μm), one week time point."
        explanation: "Fixes the airway segment and time point these output records refer to."
    has_specified_output:
