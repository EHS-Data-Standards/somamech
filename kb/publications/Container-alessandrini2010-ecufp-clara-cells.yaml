# =============================================================================
# GOBLET CELL ASSAYS - PAS morphometry by airway size, and the TEM/SEM
# ultrastructure of Clara (club) cells
# =============================================================================

goblet_cell_assays:
  - id: "GCM:alessandrini-pas-small-airways"
    name: "Volume density of PAS positive material in small airways (circumference <= 800 um) - EC-UFP inhalation before allergen challenge, with and without NAC"
    description: >-
      Figure 5a: morphometrical analysis of the volume density of PAS positive
      material in cross sections of small airways (circumference <= 800 um), 7
      days after OVA challenge / EC-UFP inhalation, expressed as percentage of
      PAS positive material per total epithelial cells, n = 6-12 per group,
      one-way ANOVA with post-hoc Scheffe test. NS/UFP showed no PAS positive
      material at all. Allergen challenge alone (S/OVA) produced significant
      goblet cell metaplasia and mucus hypersecretion. EC-UFP before allergen
      challenge INCREASED goblet cell metaplasia and mucus hypersecretion in
      the small airways - the airway-size-specific finding of this paper,
      which the authors attribute to predominant ultrafine particle deposition
      in smaller airways. NAC significantly decreased it. Values are plotted
      only, so no numeric measurements are recorded here.
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Interestingly, sensitized and challenged mice exposed to EC-UFP prior to challenge showed increased goblet cell metaplasia induced by EC-UFP exposure only in the small airways, in contrast to large airways."
        explanation: "States the small-airway-specific increase that this assay's S/UFP/OVA output record carries."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In sensitized animals allergen challenge alone had a significant effect on goblet cell metaplasia and mucus hypersecretion (Fig. 5a, b, d)."
        explanation: "Supports the S/OVA output record, the allergic control against which the particle effect is read."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "NAC strongly reduced EC-UFP-induced mucus hypersecretion in allergic animals"
        explanation: "The paper's section heading for the NAC reversal recorded by the S/NAC/UFP/OVA output record."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The data are expressed as percentage of PAS positive material/total epithelial cells."
        explanation: "Defines the quantity the output records of this assay refer to."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "n = 6-12/group. **p < 0.01 vs NS/UFP; ##p < 0.01 vs S/UFP/OVA."
        explanation: "Fixes the group sizes and the two reference groups the figure's significance markers are against."
    has_specified_output:
      - id: "GCM:alessandrini-pas-small-airways-output-ns-ufp"
        name: "PAS positive volume density, small airways - NS/UFP"
        experimental_group: treated
        measured_under: "EXPOSURE:alessandrini-ns-ufp"
      - id: "GCM:alessandrini-pas-small-airways-output-s-ova"
        name: "PAS positive volume density, small airways - S/OVA"
        experimental_group: vehicle_control
        measured_under: "EXPOSURE:alessandrini-s-ova"
      - id: "GCM:alessandrini-pas-small-airways-output-s-ufp-ova"
