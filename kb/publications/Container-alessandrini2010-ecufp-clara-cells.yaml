# =============================================================================
# LUNG FUNCTION ASSAY - airway hyperresponsiveness (PenH)
# =============================================================================

lung_function_assays:
  - id: "LF:alessandrini-penh-methacholine"
    name: "Airway hyperresponsiveness to methacholine (enhanced pause, PenH) - EC-UFP inhalation before allergen challenge, with and without NAC"
    description: >-
      Unrestrained whole body plethysmography 24 h after allergen challenge, n
      = 5-7 per group, enhanced pause (PenH) before and after five
      methacholine levels (10 mg/ml for 1, 2 and 4 min, then 40 mg/ml for 2
      and 4 min) as the index of airway hyperresponsiveness, one-way ANOVA
      with Least Significant Difference test. PenH rose significantly with
      increasing methacholine concentration in sensitized mice exposed to EC-
      UFP before OVA challenge compared with untreated mice, and the increase
      over the filtered-air allergic control was close to significant. NAC
      reduced the EC-UFP-dependent increase in airway hyperresponsiveness. The
      PenH traces live in the paper's additional file 1 rather than a main
      figure and no values are tabulated in the fetched text, so no numeric
      measurements are recorded here; PenH also has no named measurement slot
      in this schema.
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "NAC reduced EC-UFP-induced airway hyperresponsiveness"
        explanation: "The paper's own results heading for this endpoint: particles raised airway hyperresponsiveness and the antioxidant lowered it, which is what the S/UFP/OVA and S/NAC/UFP/OVA output records carry."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "For whole body plethysmography, the 'enhanced pause' (PenH) determined before and after methacholine exposure was applied as an index of airway hyperresponsiveness (AHR), as previously described"
        explanation: "Defines the quantity these output records refer to and why the assay is mapped to the decreased-lung-function adverse outcome."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Lung function tests were performed 24 h after allergen challenge in unrestrained animals using whole body plethysmography"
        explanation: "Fixes the timing and the unrestrained plethysmography method behind these output records."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "NAC had minor effects on lung CC16 concentrations of sensitized and challenged mice maybe because our model reproduces a mild allergic inflammation of the lung, as shown by the data on inflammatory cells, cytokines and airway hyperresponsiveness"
        explanation: "The authors' caveat that this model is a mild allergic inflammation, which bounds how much the airway hyperresponsiveness result can carry."
    has_specified_output:
      - id: "LF:alessandrini-penh-methacholine-output-untreated"
        name: "PenH airway hyperresponsiveness - untreated baseline"
        experimental_group: baseline
        measured_under: "EXPOSURE:alessandrini-untreated"
      - id: "LF:alessandrini-penh-methacholine-output-s-ova"
        name: "PenH airway hyperresponsiveness - S/OVA"
        experimental_group: vehicle_control
        measured_under: "EXPOSURE:alessandrini-s-ova"
      - id: "LF:alessandrini-penh-methacholine-output-s-ufp-ova"
        name: "PenH airway hyperresponsiveness - S/UFP/OVA"
        experimental_group: treated
        measured_under: "EXPOSURE:alessandrini-s-ufp-ova"
      - id: "LF:alessandrini-penh-methacholine-output-s-nac-ufp-ova"
        name: "PenH airway hyperresponsiveness - S/NAC/UFP/OVA"
        experimental_group: treated
        measured_under: "EXPOSURE:alessandrini-s-nac-ufp-ova"
    has_exposure_condition:
      - id: "EXPOSURE:alessandrini-untreated"
        name: "Untreated baseline control - no sensitization, no EC-UFP inhalation, no OVA challenge (n = 8)"
      - id: "EXPOSURE:alessandrini-s-ova"
        name: "OVA-sensitized and OVA-challenged mice exposed to filtered air (S/OVA)"
      - id: "EXPOSURE:alessandrini-s-ufp-ova"
