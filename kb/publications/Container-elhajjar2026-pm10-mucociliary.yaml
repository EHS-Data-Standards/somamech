oxidative_stress_assays:
  - id: "OXS:elhajjar-ros-d4-1ug"
    name: "Cellular ROS on D4 after 4 daily PM10 nebulisations at 1 ug/cm2/day"
    description: "DCFDA fluorescence, read as a percentage of the matched PBS Control, increased significantly on D4 only at the lowest dose (1 ug/cm2/day). The effect was transient: by D8 and D11 fluorescence was back to control values. Fluorescence values are figure-only (Fig. 5A) and are not transcribed."
    ros_probe_type: "DCFDA"
    evidence:
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The mean fluorescence intensity of the DCFH probe, which reflects cellular ROS production, increased significantly only on D4 at the lowest dose tested"
        explanation: "States the significant D4 increase in cellular ROS at the lowest PM10 dose that this assay records."
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "This effect appeared to be ... as fluorescence returned to values comparable to those of the control on D8 and D11."
        explanation: "Supports the transience recorded in the description: the ROS signal was back to control values on D8 and D11."
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
