ciliary_function_assays:
  - id: "CIL:elhajjar-sem-cilia-6ug-d4"
    name: "Cilia density and length by SEM on D4 after PM10 at 6 ug/cm2/day"
    description: "Scanning electron microscopy of the pseudo-epithelium on D4 showed an apparent reduction in cilia density and/or length at the highest dose compared with the ALI Control (Fig. 3A-C). The authors treat this as a possible, not a measured, alteration: no cilia counts, lengths or beat frequencies were quantified, so no numeric output is recorded. Ciliary beating was otherwise described as active in video recordings that are not shown."
    airway_region: "tracheobronchial"
    evidence:
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "However, using SEM, an apparent reduction in cilia density and/or length was observed at the highest dose, compared with the ALI Control (Fig. 3A-C)."
        explanation: "States the SEM observation of reduced cilia density and/or length at the highest PM10 dose that this assay records."
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "After repeated exposures at the highest dose, SEM analysis suggested a possible shortening of the cilia and a reduction of their density."
        explanation: "The discussion's restatement, and the basis for recording this as a suggested rather than quantified change."
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
