  # ---- Barrier integrity (TEER) ----
  - id: "GE:elhajjar-teer-6ug"
    name: "TEER after repeated PM10 exposure at 6 ug/cm2/day"
    description: "TEER of the pseudo-epithelium measured on D2, D4, D8 and D11. All values stayed far above the 200-300 ohm.cm2 minimum considered acceptable, but TEER dropped significantly at 6 ug/cm2/day on D2, D4 and D8 relative to both the PBS Control and the 1 ug/cm2/day dose, and had recovered by D11. The drop was not accompanied by any loss of viability. Individual TEER values are figure-only (Fig. 3D) and are not transcribed."
    gene_expression_method: "TEER measurement (EVOM3 volt-ohm meter, STX2-PLUS electrodes)"
    evidence:
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "on D2, D4 and D8, TEER significantly dropped for the highest concentration ... compared to PBS Control and to the lowest concentration."
        explanation: "States the significant TEER fall at the highest dose on D2, D4 and D8 versus both comparators that this assay records."
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "No significant changes were found on D11"
        explanation: "Supports the recovery by D11 recorded in the description."
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "These transient reductions in TEER were not associated with any detectable impairment in cell viability."
        explanation: "Supports the statement that the barrier change was not a cytotoxic effect."
      - reference: "PMID:41389869"
