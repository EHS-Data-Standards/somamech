goblet_cell_assays:
  - id: "GCM:elhajjar-total-mucin-pm10"
    name: "Total mucin production on D4, D8 and D11 after repeated PM10 exposure"
    description: "Total secreted plus excreted mucin measured by ELLA and normalised to protein. Repeated PM10 exposure did not significantly change global mucus production versus the PBS Control, but a trend toward an increase was seen mainly at 6 ug/cm2/day, reaching p=0.057 on D11. Percentages relative to control are figure-only (Fig. 4A) and are not transcribed. The authors note the increase cannot come from MUC5AC or MUC5B, which were down-regulated, and may involve other gel-forming or membrane-bound mucins that were not measured."
    evidence:
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Repeated exposure to PM10 did not significantly modify global mucus production compared to the PBS Control group (Fig. 4 A)."
        explanation: "States the primary, non-significant result this assay records for total mucus production."
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "However, a trend toward an increase was noted mainly with the higher dose, which reached the limit of the significance on D11 (p= 0.057)."
        explanation: "Gives the borderline p=0.057 trend on D11 at the higher dose recorded in the description."
      - reference: "PMID:41389869"
        reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
        supports: SUPPORT
