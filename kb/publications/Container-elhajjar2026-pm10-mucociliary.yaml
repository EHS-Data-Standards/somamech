# =============================================================================
# El Hajjar et al. (2026) - Repeated air-liquid interface exposure of a human
# tracheobronchial mucociliary pseudo-epithelium to indoor PM10
# =============================================================================
#
# Source: Toxicology 520 (2026) 154369
# DOI: 10.1016/j.tox.2025.154369
# PMID: 41389869
#
# Study design (in vitro only):
#   - Primary normal human bronchial epithelial (NHBE) cells from a single
#     healthy, non-smoking 14-year-old male donor, seeded on Transwell
#     inserts and differentiated 14 days at the air-liquid interface (ALI)
#     into a mucociliary pseudo-epithelium (basal, ciliated and
#     mucin-producing cells).
#   - Exposure: PM10 fraction of SRM 2585 ("Organic contaminants in house
#     dust") nebulised apically with a VITROCELL Cloud Max (QCM dosimetry)
#     at 1 or 6 ug/cm2/day on 4 consecutive days (D0-D3). Controls: an
#     unexposed "ALI Control" and a nebulised-vehicle "PBS Control"; effects
#     of PM10 are reported against the PBS Control.
#   - Read-outs on D4 (16 h after the fourth exposure) and post-exposure on
#     D8 and D11: TEER, viability, cellular ROS, total mucin, IL-6/IL-8
#     release. RNA was taken on D4 only.
#   - Co-exposure: the same apical PM10 nebulisations plus, on the basal
#     side from D2 to D4, conditioned medium from human monocyte-derived
#     macrophages (MDMs) that had themselves been repeatedly exposed to the
#     PM2.5 fraction of SRM 2585 (1 or 10 ug/cm2/day). Low doses were
#     combined with low doses and high with high. Only gene expression could
#     be read out after co-exposure, because MDM-derived mediators in the
#     medium are indistinguishable from epithelial ones.
#
# Key findings recorded here:
#   - Cellular ROS (DCFDA) rose significantly only on D4 at 1 ug/cm2/day and
#     returned to control level by D8/D11.
#   - Oxidative-stress PCR array (84 genes, D4): CYBB +2.06-fold, MT3
#     -3.01-fold, PRDX1 -2.05-fold at 6 ug/cm2/day; GPX3 +2.28-fold was a
#     nebulisation (PBS vs ALI) effect.
#   - DNA-damage PCR array (84 genes, D4): HUS1 +2.16-fold and FANCG
#     -2.05-fold, at 1 ug/cm2/day only.
#   - TEER dropped significantly at 6 ug/cm2/day on D2, D4 and D8 and had
#     recovered by D11, with no loss of viability.
#   - SEM suggested reduced cilia density and/or length at 6 ug/cm2/day.
#   - Total mucus was not significantly changed (trend up; p=0.057 on D11 at
#     the high dose) while MUC5AC mRNA fell and MUC5B mRNA fell at 1
#     ug/cm2/day.
#   - IL-6 mRNA rose dose-dependently on D4 with delayed IL-6 release on D8
#     and D11; IL-8 mRNA fell and IL-8 release was unchanged.
#   - Co-exposure: MUC5AC, IL-6 (low dose) and IL-8 (high dose, dose-
#     dependent) mRNA all rose; PTGS2 +2.04-fold and SOD2 +2.32-fold at the
#     high doses, CCL5 -2.07-fold at the low doses.
#
# Values shown only in figures (ROS fluorescence, TEER, mucin, cytokine and
# mucin/cytokine qPCR fold changes) are NOT transcribed: those assays carry
# the qualitative direction plus an exact quote, and no invented numbers.
# Numeric fold changes are taken only from Tables 2, 3 and 4.
#
# =============================================================================

source_publication:
  reference: "PMID:41389869"
  reference_title: "Biological responses of human tracheobronchial mucociliary pseudo-epithelium repeatedly exposed at the air-liquid interface to PM(10) indoor particles."
  doi: "10.1016/j.tox.2025.154369"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:elhajjar-ali-culture-001"
    name: "NHBE differentiation into a mucociliary pseudo-epithelium at the air-liquid interface"
    description: "NHBE cells (ATCC PCS-300-010) seeded at 30,000 cells per collagen-coated 6.5 mm Transwell insert, grown submerged to confluency for 3 days, then passaged to the air-liquid interface by removing the apical medium. Basal medium: PneumaCult-ALI with 10X supplement, Maintenance supplement 100X and hydrocortisone. ALI cultures were maintained for 14 days to allow differentiation into basal, ciliated and mucin-producing cells. Apical mucus was removed on D0, D4 and D8; basal medium was renewed every two days."
    equipment_required:
      - "Transwell inserts, 6.5 mm, 0.4 um pore (Costar)"
      - "Collagen coating solution (30 ug/mL in 0.02 M acetic acid)"
      - "PneumaCult-ALI medium (StemCell Technologies)"

  - id: "PROTOCOL:elhajjar-nebulization-001"
    name: "Apical nebulisation of PM10 aerosols with VITROCELL Cloud Max"
    description: "PM10 isolated from SRM 2585 by cyclonic separation, suspended at 4 mg/mL in PBS 1:80 with 0.04% Tween 20, antibiotics and Fungizone, sonicated 40 min. 30 uL of suspension nebulised apically on 4 consecutive days. Deposited mass was controlled with a quartz crystal microbalance: the nominal 1 ug/cm2 corresponded to 0.95 +/- 0.17 and the nominal 6 ug/cm2 to 6.08 +/- 1.00 ug/cm2."
    equipment_required:
      - "VITROCELL Cloud Max system (VITROCELL Systems, Germany)"
      - "Quartz Crystal Microbalance (QCM)"

  - id: "PROTOCOL:elhajjar-teer-001"
    name: "Trans-epithelial electrical resistance measurement"
    description: "TEER measured on D2, D4, D8 and D11 with an EVOM3 volt-ohm meter and STX2-PLUS electrode pair. Resistance across the pseudo-epithelium minus resistance across the semipermeable membrane alone (Blank), expressed in ohm.cm2. Pseudo-epithelia treated 30 min with 1% Triton X-100 served as positive controls."
    equipment_required:
      - "EVOM3 volt-ohm meter (World Precision Instruments)"
      - "STX2-PLUS electrode pair"

  - id: "PROTOCOL:elhajjar-sem-001"
    name: "Scanning electron microscopy of ciliated cells"
    description: "Cultures pre-fixed in 2.5% glutaraldehyde in 0.1 M sodium cacodylate buffer pH 7.2, dehydrated in a 30-100% ethanol gradient, critical-point dried, metal-coated and imaged on a Supra 55 scanning electron microscope at x5000."
    equipment_required:
      - "Leica EM CPD030 critical point dryer"
      - "JFC 1300 metal coater (JEOL)"
      - "Supra 55 scanning electron microscope (ZEISS)"

  - id: "PROTOCOL:elhajjar-dcfda-001"
    name: "Cellular ROS measurement with the DCFDA probe"
    description: "Inserts incubated 35 min with 10 uM DCFDA in PBS on the apical side, washed, lysed 5 min in 90% DMSO/PBS, scraped and centrifuged. Supernatant fluorescence read at 488/530 nm on a Synergy H1 plate reader, blank-subtracted and expressed as a percentage of the matched PBS Control. Pyocyanin (400 uM, 30 min) was the positive control."
    equipment_required:
      - "2',7'-dichlorofluorescin diacetate (DCFDA) probe"
      - "Synergy H1 microplate reader (BioTek)"

  - id: "PROTOCOL:elhajjar-ella-001"
    name: "Total mucin quantification by enzyme-linked lectin assay (ELLA)"
    description: "Sandwich ELLA on cell lysates: plates coated with Triticum vulgaris lectin, detection with peroxidase-conjugated Ulex europaeus lectin and TMB, absorbance at 450 nm against a porcine mucin standard curve (10,000-78.1 nM). Mucin was normalised to total protein measured by BCA. LPS (100 ug/mL, 24 h) was the positive control."
    equipment_required:
      - "Triticum vulgaris lectin (Merck Sigma)"
      - "Peroxidase-conjugated Ulex europaeus lectin"
      - "BCA protein quantification kit"

  - id: "PROTOCOL:elhajjar-elisa-001"
    name: "IL-6 and IL-8 ELISA on basal culture medium"
    description: "IL-6 and IL-8 released into the basal medium quantified with ELISA MAX Deluxe Set human kits (BioLegend), absorbance at 450 nm on a Synergy H1 reader against a calibration curve. Basal media were collected on D4, D8 and D11."
    equipment_required:
      - "ELISA MAX Deluxe Set human IL-6 and IL-8 kits (BioLegend)"
      - "Synergy H1 microplate reader (BioTek)"

  - id: "PROTOCOL:elhajjar-qpcr-001"
    name: "RT-qPCR for mucin and cytokine gene expression"
    description: "RNA extracted on D4 (RNeasy Mini Kit, DNase digestion), pooled from six biological replicates (6 inserts from 3 independent experiments). cDNA libraries made with the QuantiTect Whole Transcriptome kit, qPCR with QuantiNova SYBR Green on a QuantStudio 5. GAPDH housekeeping gene, ddCt method, fold change against the PBS Control (exposure) or the PBS/M0 Control (co-exposure), 4 technical replicates."
    equipment_required:
      - "QuantStudio 5 Real-Time PCR System"
      - "QuantiNova SYBR Green PCR kit (Qiagen)"

  - id: "PROTOCOL:elhajjar-pcrarray-oxstress-001"
    name: "RT2 Profiler PCR array, Human Oxidative Stress Pathway (PAHS-065YA)"
    description: "84-gene pathway-focused array run on cDNA from 0.5 ug of pooled RNA taken on D4, for both the exposure and the co-exposure experiments. Normalised to the mean of ACTB, B2M, GAPDH, HPRT1 and RPLP0; fold change by the ddCt method in QIAGEN GeneGlobe; two independent replicates per sample; unpaired two-tailed Student t-test, p threshold 0.05. Modulation was called at a 2-fold change."
    equipment_required:
      - "RT2 Profiler PCR Array PAHS-065YA (Qiagen)"
      - "QuantStudio 5 Real-Time PCR System"

  - id: "PROTOCOL:elhajjar-pcrarray-dnadamage-001"
    name: "RT2 Profiler PCR array, Human DNA Damage Signaling Pathway (PAHS-029ZA)"
    description: "84-gene pathway-focused array run on cDNA from 0.5 ug of pooled RNA taken on D4, for the PM10 exposure experiment only. Same normalisation, analysis and 2-fold calling rule as the oxidative stress array."
    equipment_required:
      - "RT2 Profiler PCR Array PAHS-029ZA (Qiagen)"
      - "QuantStudio 5 Real-Time PCR System"

