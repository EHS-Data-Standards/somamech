# =============================================================================
# Decrue et al. (2022) - Increased Impact of Air Pollution on Lung Function in
# Preterm versus Term Infants: The BILD Study
# =============================================================================
#
# Source: Am J Respir Crit Care Med. 2022;205(1):99-107 (PMID:34587471)
# DOI: 10.1164/rccm.202102-0272OC
#
# Study design:
#   - Prospective unselected birth cohort (BILD, Basel-Bern Infant Lung
#     Development), Switzerland, recruitment 1999-2017
#   - 771 infants in the main analysis: 517 term and 254 preterm, the preterm
#     group split into extremely (<28 wk GA, n = 65), very early (29-31 wk GA,
#     n = 90) and moderate to late (32-36 wk GA, n = 99) preterm infants
#   - Individual prenatal exposure to PM10 and NO2 estimated with time-space
#     hybrid land-use regression models; the second trimester of pregnancy was
#     the a priori main exposure window
#   - Tidal breathing flow volume loops (minute ventilation VE, VT, tPTEF/tE)
#     and fractional exhaled nitric oxide (FeNO) measured at 44 weeks
#     postconceptional age with an Exhalyzer D per ERS/ATS guidelines
#   - Multilevel mixed-effects linear regression adjusted for sex, weight,
#     season and postconceptional age at measurement, gestational age at
#     birth, maternal smoking, maternal asthma, days of supplementary oxygen
#     and days of mechanical ventilation; FeNO models additionally adjusted
#     for VE. Benjamini-Hochberg adjustment reported alongside raw P values.
#
# Key findings captured here:
#   - Minute ventilation (VE, a measure of ventilatory need) rose with
#     second-trimester PM10 in every group, most steeply in moderate to late
#     preterm infants: +75.3 ml/min (term), +88.6 (all preterm), +184.9
#     (moderate to late preterm) per 10 ug/m3 PM10
#   - Prematurity x PM10 interaction for VE: P = 0.040, padj = 0.09
#   - FeNO rose with second-trimester PM10 in preterm infants (+2.8 ppb) and
#     moderate to late preterm infants (+3.4 ppb) but not in term infants;
#     the prematurity x PM10 interaction for FeNO stayed significant after
#     multiple-comparison adjustment (P = 0.006, padj = 0.036)
#   - No associations of second-trimester NO2 with lung function or FeNO
#
# Curation notes:
#   - The schema's LungFunctionOutput has no slot for minute ventilation or
#     tidal volume, so the VE effect estimates are recorded in the assay
#     descriptions and carried by exact quotes rather than in a typed
#     measurement slot. FeNO does have a slot and is used for the PM10-FeNO
#     effect estimates (ppb per 10 ug/m3 PM10), the way Cuesta-Mosquera 2025
#     records a three-year FVC change in decline_rate.
#   - Increasing VE is reported by the authors as *impaired* lung function
#     (increased ventilatory need), so these assays inform on the adverse
#     outcome "Decreased lung function".
#   - exposure_concentration holds each group's mean second-trimester PM10
#     (Table 3), not the 10 ug/m3 contrast used for the effect estimates;
#     the contrast is stated in the exposure name and assay description.
#
# =============================================================================

source_publication:
  reference: "PMID:34587471"
  reference_title: "Increased Impact of Air Pollution on Lung Function in Preterm versus Term Infants: The BILD Study."
  doi: "10.1164/rccm.202102-0272OC"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:decrue-tbfvl-001"
    name: "Tidal breathing flow volume loop measurement at 44 weeks postconceptional age"
    description: "Pulmonary function testing performed at 44 weeks' postconceptional age with an Exhalyzer D (EcoMedics) following European Respiratory Society/American Thoracic Society guidelines. Minute ventilation (VE = respiratory rate x VT) was recorded, and the ratio of time to peak tidal expiratory flow to expiratory time (tPTEF/tE) was used to describe tidal breathing flow volume loop shape. Measurements passing ERS/ATS quality control were retained (775 of 890 infants)."
    equipment_required:
      - "Exhalyzer D (EcoMedics)"
    quality_control_criteria: "Lung function measurements had to pass quality control according to ERS/ATS guidelines; outliers in the moderate to late preterm group with severe asphyxia were excluded."
    protocol_type: SpirometryProtocol
    spirometry_standard: "ERS/ATS"

  - id: "PROTOCOL:decrue-feno-001"
    name: "Fractional exhaled nitric oxide measurement in infants"
    description: "FeNO measured alongside tidal breathing lung function at 44 weeks' postconceptional age as a marker of airway inflammatory response and oxidative stress. FeNO values were missing for 71 children (26 term, 45 preterm infants). Regression models for FeNO were additionally adjusted for minute ventilation."
    protocol_type: Protocol

  - id: "PROTOCOL:decrue-airpollution-001"
    name: "Individual air pollution exposure modelling for the BILD cohort"
    description: "Individual mean exposure to NO2 and PM10 estimated with time-space hybrid models. Background air pollution was measured at the Payerne monitoring station; the NO2 model integrated land use, population density, traffic, dispersion models, meteorological data and Payerne air quality with 28,849 biweekly and monthly passive sampler measurements collected over more than 10 years at 146 locations for external validation. Mean exposure for the second trimester of pregnancy was the a priori main exposure window; first trimester, third trimester and postnatal windows were used for sensitivity analysis."
    protocol_type: Protocol

# =============================================================================
# LUNG FUNCTION ASSAYS
# =============================================================================
#
# Two outcomes per gestational-age group:
#   - ventilatory need (minute ventilation VE)  -> Decreased lung function
#   - fractional exhaled nitric oxide (FeNO)    -> Airway inflammation
#
# =============================================================================

lung_function_assays:

  # ---------------------------------------------------------------------------
  # Ventilatory need (minute ventilation) versus second-trimester PM10
  # ---------------------------------------------------------------------------

  - id: "LF:decrue-term-pm10-ventilation"
    name: "Minute ventilation versus second-trimester PM10 in term infants"
    description: "Association of second-trimester PM10 exposure with minute ventilation (VE) at 44 weeks' postconceptional age in 517 term infants. VE increased by 75.3 ml/min (95% CI 19.7 to 130.8) per 10 ug/m3 increase in PM10 (P = 0.008, Benjamini-Hochberg adjusted P = 0.074). Increasing VE reflects increased ventilatory need and is interpreted by the authors as impaired lung function. Second-trimester NO2 showed no association in this group (-2.5 ml/min, 95% CI -43.8 to 38.9, P = 0.907). No structured slot exists for minute ventilation, so the effect estimate is recorded here and in the evidence quotes."
    reference_dataset: "Within-study comparison against the preterm and moderate to late preterm strata of the same cohort"
    has_specified_output:
      id: "LF:decrue-term-pm10-ventilation-output"
      name: "Minute ventilation response to second-trimester PM10 in term infants"
    evidence:
      - reference: "PMID:34587471"
        reference_title: "Increased Impact of Air Pollution on Lung Function in Preterm versus Term Infants: The BILD Study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Within the term group, _VE increased by 75.3 (19.7– 130.8) ml/min"
        explanation: "Gives the 75.3 ml/min minute-ventilation coefficient and its 95% confidence interval for term infants recorded in this assay."
      - reference: "PMID:34587471"
        reference_title: "Increased Impact of Air Pollution on Lung Function in Preterm versus Term Infants: The BILD Study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "75.3 19.7 to 130.8 0.008 0.074 88.6 18.6 to 158.7 0.013 0.090 184.9 79.1 to 290.7 0.001 0.139"
        explanation: "Table 4 row for VE and second-trimester PM10: the first four numbers are the term-group coefficient, 95% CI, P value (0.008) and adjusted P value (0.074) recorded in this assay."
      - reference: "PMID:34587471"
        reference_title: "Increased Impact of Air Pollution on Lung Function in Preterm versus Term Infants: The BILD Study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "_VE has been shown to be a parameter of ventilatory need (33), with preterm infants and infants with wheeze increasing their VT and lowering their respiratory rate to maintain or elevate_VE."
        explanation: "Establishes that the minute ventilation measured here is a marker of ventilatory need, which is why a rise is treated as impaired lung function."
      - reference: "PMID:34587471"
        reference_title: "Increased Impact of Air Pollution on Lung Function in Preterm versus Term Infants: The BILD Study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "PM10 second trimester 19.9 (6.1 – 44.7) 19.9 (7.5 – 37.7) 20.0 (6.1 – 44.7) 18.5 (6.3 – 38.3)"
        explanation: "Table 3 row giving the mean (range) second-trimester PM10 for the overall, term (19.9 ug/m3), preterm and moderate to late preterm groups; the term value is this assay's exposure concentration."
      - reference: "PMID:34587471"
        reference_title: "Increased Impact of Air Pollution on Lung Function in Preterm versus Term Infants: The BILD Study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The relatively low air pollution levels were potentially the reason why no associations of prenatal NO2 exposure with infant lung function was seen in the current study"
        explanation: "Supports the null second-trimester NO2 finding noted in this assay's description."
    has_exposure_condition:
      - id: "EXPOSURE:decrue-pm10-t2-term"
        name: "Modelled maternal second-trimester PM10 exposure, term infants (mean 19.9 ug/m3; effect estimates are per 10 ug/m3 increase)"
        exposure_agent:
