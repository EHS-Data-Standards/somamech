# =============================================================================
# Cao et al. (2018) - Cigarette whole smoke solutions disturb mucin homeostasis
# in a human in vitro airway tissue model
# =============================================================================
#
# Source: Toxicology 409: 119-128
# PMID: 30053496 | DOI: 10.1016/j.tox.2018.07.015
#
# Study design (from the paper's Materials and Methods):
#   - In vitro: human air-liquid-interface (ALI) airway tissue model built from
#     normal human primary bronchial epithelial cells collected from the
#     tracheobronchial region (MatTek), differentiated 4 weeks on 24-well PET
#     Transwell inserts in PneumaCult-ALI Maintenance Medium
#   - Test articles: cigarette whole smoke solutions (WSSs) in DMSO, prepared by
#     machine smoking 60 Marlboro Red (CI R60) or 60 Marlboro Silver (CI S60)
#     cigarettes with the Canadian Intense (CI) protocol (55-mL puff volume,
#     30-s puff interval, 2.0-s puff duration, 100% filter vent blocking)
#   - Exposure: 100 uL of 0.1%, 0.25%, 0.5% or 1.0% WSS applied apically
#     4 h/day for up to 5 consecutive days; DMSO adjusted to 1.0% in all groups;
#     1.0% DMSO vehicle control
#   - Readouts: MUC5AC/MUC5B ELISA on apical washes (T1, T3, T5, PT7, PT14),
#     MUC5AC/MUC5B qRT-PCR (4 h, T1, PT14; 18S rRNA reference, ddCt),
#     PAS staining for goblet cell density (T5, PT14), cilia beating frequency
#     by Sisson-Ammons Video Analysis (T1, T5, PT7)
#   - Statistics: One-Way ANOVA with Dunnett's test vs the DMSO vehicle control;
#     two-tailed t-test for CI S60 vs CI R60; p < 0.05 significant
#
# Evidence note: the publicly cached record for this PMID is the abstract, so
# every evidence snippet below is quoted from the abstract and is machine
# verifiable. Design details in the comments and descriptions come from the
# full text of the PDF, read locally.
# =============================================================================

source_publication:
  reference: "PMID:30053496"
  reference_title: "Cigarette whole smoke solutions disturb mucin homeostasis in a human in vitro airway tissue model."
  doi: "10.1016/j.tox.2018.07.015"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:cao-wss-exposure-001"
    protocol_type: Protocol
    name: "Cigarette whole smoke solution (WSS) preparation and ALI exposure"
    description: "Mainstream smoke from 60 Marlboro Red (R60) or 60 Marlboro Silver (S60) cigarettes, machine smoked with the Canadian Intense protocol (55-mL puff volume, 30-s puff interval, 2.0-s puff duration, 100% blocking of filter ventilation), bubbled through three perfluoroalkoxy impingers each holding 30 mL DMSO and pooled to 100 mL of WSS. Stock WSSs diluted in PBS to 0.1%, 0.25%, 0.5% and 1.0% immediately before use, with DMSO adjusted to 1.0% in every treatment group. Cultures received 100 uL of diluted WSS or 1.0% DMSO apically for 4 h per day on up to 5 consecutive days, then were washed with PBS and refed basolaterally."
    equipment_required:
      - "Perfluoroalkoxy impingers"
      - "24-well PET Transwell culture inserts (Corning)"

  - id: "PROTOCOL:cao-mucin-elisa-001"
    protocol_type: MolecularAssayProtocol
    name: "MUC5AC and MUC5B ELISA on apical washes"
    description: "Mucus collected by washing the apical culture surface twice with 100 uL PBS; DTT added to 0.025 mM; vortexed and centrifuged at 600 x g for 10 min. 25 uL supernatant plus equal volume 50 mM carbonate/bicarbonate (pH 9.5) dried overnight in a MaxiSorp 96-well plate, blocked with 10 mg/mL BSA, probed with anti-MUC5AC (45M1) or anti-MUC5B antibody, detected with HRP-conjugated goat anti-mouse secondary and TMB substrate, absorbance read at 450 nm."
    detection_method: "Colorimetric ELISA, absorbance at 450 nm (BioTek Synergy H4)"
    antibodies_used:
      - "anti-MUC5AC (45M1), Thermo Scientific"
      - "anti-MUC5B, Thermo Scientific"
      - "HRP-conjugated goat anti-mouse IgG (Santa Cruz Biotechnology)"

  - id: "PROTOCOL:cao-rtpcr-001"
    protocol_type: MolecularAssayProtocol
    name: "Quantitative real-time RT-PCR for MUC5AC and MUC5B"
    description: "Total RNA extracted with the RNeasy Mini Kit; cDNA synthesised from RNA with integrity number >= 9.5. TaqMan Gene Expression Assays for MUC5AC (Hs00873651_mH), MUC5B (Hs00861595_m1) and 18S rRNA (Hs99999901_s1) run on a ViiA 7 RT-PCR system: 95 C for 10 min, then 40 cycles of 95 C for 15 s and 60 C for 1 min. Fold change calculated by the ddCt method against 18S rRNA and the vehicle control."
    detection_method: "TaqMan quantitative RT-PCR (ViiA 7 system)"
    reference_gene: "18S rRNA (Hs99999901_s1)"
    normalization_method: "ddCt method, 2^-ddCt fold change"

  - id: "PROTOCOL:cao-pas-001"
    protocol_type: StainingProtocol
    name: "Periodic acid-Schiff (PAS) staining for goblet cells"
    description: "Cultures fixed in 10% neutral buffered formalin, paraffin embedded and sectioned at 4-5 um. Rehydrated sections oxidised in 0.5% periodic acid for 5 min, incubated with Schiff's reagent for 15 min, counter-stained with hematoxylin, dehydrated and cover-slipped. PAS-stained mucus-producing goblet cells with typical goblet cell morphology were counted over a 5-mm tissue section and goblet cell density expressed as the percentage of goblet cells to the total number of cells counted."
    staining_type: "periodic acid-Schiff (PAS) histochemistry"
    fixation_method: "10% neutral buffered formalin"
    counterstain: "hematoxylin"
    detection_method: "Light microscopy cell counting over a 5-mm tissue section"

  - id: "PROTOCOL:cao-cbf-sava-001"
    protocol_type: ImagingProtocol
    name: "Cilia beating frequency by Sisson-Ammons Video Analysis (SAVA)"
    description: "Cultures equilibrated on a 30 C heated stage for 15 min before measurement. Four random fields with at least 1000 motile points selected per culture; CBF determined by whole field analysis. Five cultures used per treatment condition."
    equipment_required:
      - "Sisson-Ammons Video Analysis (SAVA) system"
      - "30 C heated microscope stage"
    temperature_control:
      value: "30"
      unit:
        id: "UO:0000027"
        name: "degree Celsius"

