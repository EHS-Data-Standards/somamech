ciliary_function_assays:

  - id: "CBF:cao-ci-wss-t5"
    name: "Cilia beating frequency - 24 h after five daily CI WSS treatments"
    description: "CBF of human ALI airway cultures measured by Sisson-Ammons Video Analysis whole field analysis (four random fields with at least 1000 motile points per culture) 24 h after five daily 4-h treatments with CI S60 or CI R60 whole smoke solution. A single treatment did not alter CBF; five treatments produced significant increases in CBF in all treatment groups, with no significant difference between the two whole smoke solutions at comparable concentrations. The authors interpret the increase as an adaptive response to remove the excess mucus induced by treatment. n = 5, p < 0.05 vs the concurrent DMSO vehicle control."
