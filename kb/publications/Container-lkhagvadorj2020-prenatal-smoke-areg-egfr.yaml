# =============================================================================
# Lkhagvadorj et al. (2020) - Prenatal smoke exposure dysregulates lung
# epithelial cell differentiation in mouse offspring: role for AREG-induced
# EGFR signaling
# =============================================================================
#
# Source: Am J Physiol Lung Cell Mol Physiol 319: L742-L751, 2020
# DOI: 10.1152/ajplung.00209.2020
#
# Study design (in vivo developmental study + ex vivo organoid validation):
#   - Species: Mus musculus, C57Bl/6 (Harlan, The Netherlands)
#   - EXPOSED GENERATION: dams (F0), 8-10 wk old at the start
#   - EXPOSURE WINDOW: PRENATAL ONLY. Dams were exposed from 7 days BEFORE
#     mating until the day of euthanization; smoke exposure was constant
#     during the whole pregnancy. Mothers and offspring were NOT exposed to
#     cigarette smoke after the offspring was born.
#   - Smoke: Teague TE-10 system, mainstream smoke of Kentucky 2R4F reference
#     cigarettes, two 50-min sessions per day with a 3-h interval, 10
#     cigarettes per session (stepped up 3/5/7/10 over the first four days).
#     Dosimetry per session: total particulate matter 211 +/- 30 mg/m3,
#     CO 205 +/- 35 ppm (max 241 ppm). Control dams breathed fresh air.
#   - Dams: n=3 air-exposed, n=4 smoke-exposed
#   - OFFSPRING TIMEPOINT: a single timepoint - offspring were euthanized ONE
#     DAY AFTER BIRTH (1-day-old neonates). n=16 offspring from nonsmoking
#     mothers, n=24 from smoking mothers. Left lung -> qRT-PCR; right lung ->
#     formalin/paraffin for IHC and IF.
#   - ORGANOID ARM (separate, unexposed animals): EpCAM+ lung cells from
#     pathogen-free 8-12 wk old mice (n=3 male, n=2 female) grown as 3-D
#     lung organoids in Matrigel with fibroblasts; AREG 10 ng/mL refreshed
#     every 2 days vs non-treated; assessed 14 days after treatment. The
#     organoid arm is an AREG-treatment model, NOT a smoke-exposure model.
#
# Key findings (neonatal lung, prenatal smoke vs prenatal air):
#   - Fewer tubulin+ ciliated cells (P<0.001), lower Foxj1 (P=0.03)
#   - Higher Foxm1 (P=0.014) and Spdef (P<0.001) mRNA
#   - More pro-SPC+ (P=0.001) and NKX2.1+ (P=0.0005) AECII cells
#   - PDPN+ (AECI) cell numbers unchanged, but lower Pdpn (P<0.0001) and
#     Gramd2 (P<0.0001) mRNA
#   - More AREG-expressing cells (P=0.04), higher Areg mRNA (P=0.0014),
#     lower Egf mRNA (P=0.0018); Egfr mRNA unchanged
#   - Club cells (CC10) and Aqp5 mRNA unchanged
#
# Key findings (AREG-treated vs non-treated organoids):
#   - Bronchiolar: fewer tubulin+ ciliated cells (P<0.001), more KRT5+ basal
#     cells (P=0.02), CC10+ club cells unchanged
#   - Alveolar: more pro-SPC+ AECII (P=0.03), PDPN+ AECI unchanged
#
# QUOTE PROVENANCE: the committed references_cache entry for PMID:32783621 is
# abstract_only (the publisher copy is paywalled). Every evidence snippet in
# this file is therefore copied from the ABSTRACT, which is the text CI
# resolves against. All quantitative detail above and in the description:
# fields (exposure regimen, dosimetry, n's, p-values, per-sex results) was
# read from the local PDF full text, which is gitignored and never pushed.
#
# NO MEASURED VALUES ARE RECORDED: the paper reports every cell count and
# mRNA level only as individual data points in figures ("Data are shown as
# individual values"), with no numeric means or fold changes in the text or
# any table. Per the extraction rules, no values were digitized or invented.
# The direction of change and the reported p-value are captured in
# response_comparisons instead.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:32783621"
  reference_title: "Prenatal smoke exposure dysregulates lung epithelial cell differentiation in mouse offspring: role for AREG-induced EGFR signaling."
  doi: "10.1152/ajplung.00209.2020"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:lkhagvadorj-smoke-001"
    name: "Maternal cigarette smoke exposure (prenatal window)"
    description: "Mainstream cigarette smoke generated with a TE-10 smoke exposure system (Teague Enterprises, Woodland, CA) using Kentucky 2R4F research-reference filtered cigarettes. Two sessions of 50 min per day with a 3-h interval between exposures; smoke of 10 cigarettes generated per session. Adaptation: 3 cigarettes/session on day 1, 5 on day 2, 7 on day 3, 10 from day 4 onward. Per session this generated total particulate matter of 211 +/- 30 mg/m3 and a CO level of 205 +/- 35 parts per million (max 241 ppm). Dams were exposed from 7 days before mating until the day of euthanization, constant throughout pregnancy; mothers and offspring were not exposed after birth. Simultaneous cycling induced with 1.25 IU pregnant mare's serum gonadotropin and 1.25 IU human chorionic gonadotrophin; mating confirmed by vaginal plug detection. Approved by the IACUC of the University of Groningen (Permit No. 6589a)."
    equipment_required:
      - "TE-10 smoke exposure system (Teague Enterprises, Woodland, CA)"
      - "Kentucky 2R4F research-reference filtered cigarettes (The Tobacco Research Institute, University of Kentucky)"

  - id: "PROTOCOL:lkhagvadorj-ihc-001"
    name: "Immunohistochemistry on neonatal lung tissue"
    description: "3 um sections of formalin-fixed, paraffin-embedded right lung. Deparaffinized, antigen retrieval in citrate (pH 6.0) and Tris-HCl (pH 7.4) buffer in a microwave oven for 15 min, then 0.3% H2O2 in PBS for 30 min. Primary antibodies against tubulin (ciliated cells), CC10 (club cells), pro-SPC and NKX2.1 (AECII), PDPN (AECI), Ki67 (proliferation) and amphiregulin. Detection with HRP enzyme and biotinylated secondary antibodies (30 min), colour reaction with 0.05% diaminobenzidine (DAB) and 3-amino-9-ethylcarbazole (AEC). Slides were coded and examiners blinded to groups. Tubulin+ and CC10+ cells counted manually in all airways and corrected per millimetre of airway; pro-SPC+, NKX2.1+, AREG+, PDPN+ and pro-SPC/Ki67+ cells quantified morphometrically and corrected for the total lung tissue area per section."
    equipment_required:
      - "Aperio-ImageScope viewing software (Aperio 11.2.0.780, Vista, CA)"
      - "TissueFAXS imaging system (TissueGnostics, Austria)"
      - "ImageJ"

  - id: "PROTOCOL:lkhagvadorj-qpcr-001"
    name: "TaqMan RT-qPCR on neonatal lung tissue"
    description: "Total RNA isolated from left lung with an RNA isolation TRIzol Kit (Invitrogen); cDNA reverse transcribed with SuperScript-II Reverse Transcriptase (Invitrogen). TaqMan on-demand gene expression assays (Applied Biosystems) for Gapdh (Mm99999915_g1), Foxj1 (Mm01267279_m1), Scgb1a1 (Mm00442046_m1), Foxm1 (Mm00514924_m1), Spdef (Mm00600221_m1), Pdpn (Mm00447558_m1), Aqp5 (Mm00437578_m1), Gramd2 (Mm01174485_m1), Nkx2.1, Egf (Mm00438696_m1), Areg (Mm01354339_m1) and Egfr (Mm01187858_m1). Reactions in triplicate, 10 uL total (2 uL MilliQ water, 5 uL PCR MasterMix (Eurogentec), 0.5 uL assay mix, 2.5 uL cDNA), run on a LightCycler 480 Real-Time PCR System (Roche) and analysed with LightCycler 480 SW 1.5 software using the fit points method. Normalized to Gapdh by 2^-dCp; undetectable Cp values (>40) were interpreted as the maximum Cp value."
    equipment_required:
      - "LightCycler 480 Real-Time PCR System (Roche, Basel, Switzerland)"
      - "TaqMan Gene Expression Assays (Applied Biosystems, Foster City, CA)"
      - "TRIzol RNA isolation kit (Invitrogen)"

  - id: "PROTOCOL:lkhagvadorj-organoid-001"
    name: "Three-dimensional mouse lung organoid culture with AREG treatment"
    description: "EpCAM+ cells isolated from lungs of pathogen-free male (n=3) and female (n=2) mice aged 8-12 wk. Approximately 10,000 EpCAM+ lung cells seeded with an equal number of fibroblasts per insert in 100 uL growth factor-reduced Matrigel diluted 1:1 with DMEM/F12 containing 5% FBS, into transwell inserts for 24 wells. In the treated groups AREG (10 ng/mL; R&D Systems, Minneapolis) was freshly added every 2 days. Cultures maintained at 37C in a humidified incubator with 5% CO2. After 14 days organoids were fixed in acetone diluted 1:1 (vol/vol) with methanol for 15 min at -20C. For bronchial analyses organoids were stabilized in 2% agarose, dehydrated and paraffin-embedded for cross-sectional histology."
    equipment_required:
      - "Growth factor-reduced Matrigel"
      - "Transwell inserts for 24 wells"
      - "Recombinant AREG (R&D Systems, Minneapolis)"

  - id: "PROTOCOL:lkhagvadorj-if-001"
    name: "Immunofluorescence on lung organoids"
    description: "Paraffin-embedded bronchiolar organoids double- or triple-stained with primary antibodies against KRT5 (basal cell), CC10 (club cell) and tubulin (ciliated cell), visualized with fluorescent secondary antibodies and DAPI-containing mounting medium (Abcam). Alveolar organoid cultures washed with PBS, blocked in PBS with 5% (wt/vol) BSA, incubated overnight at 4C with primary antibodies against pro-SPC (AECII) and PDPN (AECI) diluted in PBS with 0.1% BSA and 0.1% Triton, washed 30 min and detected with fluorescent secondary antibodies and DAPI. Slides scanned on the TissueFAXS imaging system; images acquired on a Leica SP8 confocal microscope and a Leica 4000b microscope at x40 magnification. Positive cells counted manually and corrected for the total number of bronchial and alveolar epithelial cells in the organoids."
    equipment_required:
      - "Leica SP8 confocal microscope"
      - "Leica 4000b microscope"
      - "TissueFAXS imaging system (TissueGnostics, Austria)"
      - "ImageJ"

# =============================================================================
# CILIARY FUNCTION ASSAYS - ciliated cell numbers
# (in vivo neonatal lung, and ex vivo AREG-treated bronchiolar organoids)
# =============================================================================

ciliary_function_assays:
  - id: "CIL:lkhagvadorj-ciliated-cells-neonate"
    name: "Ciliated cell number in neonatal lung - prenatal air vs prenatal smoke"
    description: "Tubulin-positive (ciliated) cells counted manually in all airways of 1-day-old offspring and corrected per millimetre of airway (IHC, DAB). Prenatally smoke-exposed neonates had lower numbers of ciliated cells than controls (P<0.001), seen in both male and female offspring (P<0.0001). The paper reports these counts only as individual data points in Fig. 1B/1b, with no numeric mean, so no value is recorded here."
    airway_region: "all airways of the neonatal lung (bronchial/bronchiolar epithelium)"
    analysis_software: "Aperio-ImageScope 11.2.0.780; TissueFAXS"
    evidence:
      - reference: "PMID:32783621"
        reference_title: "Prenatal smoke exposure dysregulates lung epithelial cell differentiation in mouse offspring: role for AREG-induced EGFR signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that prenatal smoke exposure reduced the number of ciliated cells and the expression of the cilia-related transcription factor Foxj1"
        explanation: "The abstract states directly that prenatal smoke exposure reduced the number of ciliated cells, which is the decrease this assay's smoke-exposed output records relative to its air-exposed control output."
    has_exposure_condition:
      - id: "EXPOSURE:lkhagvadorj-prenatal-air"
        name: "Prenatal fresh air - dams exposed to fresh air from 7 days before mating until euthanization; offspring assessed 1 day after birth"
        timing_post_exposure:
          value: "1"
          unit:
            id: "UO:0000033"
            name: "day"
      - id: "EXPOSURE:lkhagvadorj-prenatal-smoke"
        name: "Prenatal cigarette smoke - dams exposed 2 x 50 min/day (10 cigarettes per session, 2R4F) from 7 days before mating throughout pregnancy until euthanization; offspring assessed 1 day after birth and never exposed postnatally"
        exposure_agent:
          id: "ECTO:0300003"
          name: "exposure to cigarette smoking via maternal"
        timing_post_exposure:
          value: "1"
          unit:
            id: "UO:0000033"
            name: "day"
    has_specified_output:
      - id: "CIL:lkhagvadorj-ciliated-cells-neonate-output-control"
        name: "Ciliated cell number, offspring of air-exposed dams"
        experimental_group: control
        measured_under: "EXPOSURE:lkhagvadorj-prenatal-air"
      - id: "CIL:lkhagvadorj-ciliated-cells-neonate-output-smoke"
        name: "Ciliated cell number, offspring of smoke-exposed dams"
        experimental_group: treated
        measured_under: "EXPOSURE:lkhagvadorj-prenatal-smoke"
    assay_date: "2020-01-01"
    informs_on_key_event:
      id: "KE:ke-altered-ciliogenesis"
      name: "Altered ciliogenesis"
      biological_action: decreased
      level_of_biological_organization: cellular
    study_subject:
      subject_type: InVivoSubject
      id: "SUBJECT:lkhagvadorj-neonate-smoke"
      name: "One-day-old C57Bl/6 mouse offspring of smoke- or air-exposed dams"
      model_species:
        id: "NCBITaxon:10090"
        name: "Mus musculus"
      age:
        value: "1"
        unit:
          id: "UO:0000033"
          name: "day"
      sex: "male and female (analysed separately as well as pooled)"
      subject_characteristics: "C57Bl/6 neonates euthanized one day after birth. n=16 offspring from nonsmoking mothers (n=3 dams), n=24 from smoking mothers (n=4 dams). Dams were 8-10 wk old at the start of exposure. Offspring themselves were never directly exposed."
      sample_type: biopsy
