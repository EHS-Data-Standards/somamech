# =============================================================================
# KEY EVENT RELATIONSHIPS
#
# The paper frames AREG-induced EGFR signaling as the upstream event and the
# epithelial differentiation shifts as its consequences. The causal direction
# is supported by the organoid arm, where AREG was applied directly and
# reproduced the ciliated-cell loss, basal-cell gain and AECII gain seen in
# prenatally smoke-exposed neonates. EGFR phosphorylation itself was never
# measured and Egfr mRNA was unchanged, and the paper states the link as
# "may be induced by", so evidence_support is moderate throughout.
# =============================================================================

key_event_relationships:
  - id: "KER:lkhagvadorj-egfr-to-ciliogenesis"
    name: "EGFR activation leads to altered ciliogenesis"
    description: "AREG treatment of bronchiolar lung organoids reduced tubulin-positive ciliated cell numbers, reproducing the ciliated cell loss and Foxj1 downregulation seen in prenatally smoke-exposed neonates that had higher Areg and lower Egf expression."
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-altered-ciliogenesis"
      name: "Altered ciliogenesis"
      biological_action: decreased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:32783621"
        reference_title: "Prenatal smoke exposure dysregulates lung epithelial cell differentiation in mouse offspring: role for AREG-induced EGFR signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In bronchial organoids, AREG treatment resulted in fewer ciliated cells and more basal cells when compared with non-treated bronchiolar organoids."
        explanation: "Applying the EGFR ligand AREG directly to organoids reduced ciliated cell numbers, which is the upstream-to-downstream link this relationship asserts."

  - id: "KER:lkhagvadorj-egfr-to-basal-hyperplasia"
    name: "EGFR activation leads to basal cell hyperplasia"
    description: "AREG treatment of bronchiolar lung organoids increased KRT5-positive basal cell numbers (P=0.02), consistent with published reports that AREG-induced EGFR activation drives airway epithelial differentiation toward basal and mucous cell hyperplasia."
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-basal-cell-hyperplasia"
      name: "Basal cell hyperplasia"
      biological_action: increased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:32783621"
        reference_title: "Prenatal smoke exposure dysregulates lung epithelial cell differentiation in mouse offspring: role for AREG-induced EGFR signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "AREG treatment resulted in fewer ciliated cells and more basal cells when compared with non-treated bronchiolar organoids"
        explanation: "Direct AREG treatment increased basal cell numbers in bronchiolar organoids, which is the upstream-to-downstream link this relationship asserts."

  - id: "KER:lkhagvadorj-egfr-to-aecii-hyperplasia"
    name: "EGFR activation leads to alveolar epithelial type II cell hyperplasia"
    description: "AREG treatment of alveolar lung organoids increased pro-SPC-positive AECII numbers (P=0.03), reproducing the higher AECII numbers found in prenatally smoke-exposed neonates."
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-aecii-hyperplasia"
      name: "Alveolar epithelial type II cell hyperplasia"
      biological_action: increased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:32783621"
        reference_title: "Prenatal smoke exposure dysregulates lung epithelial cell differentiation in mouse offspring: role for AREG-induced EGFR signaling."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In alveolar organoids, AREG treatment led to more AECII cells than non-treated AECII cells."
        explanation: "Direct AREG treatment increased AECII numbers in alveolar organoids, which is the upstream-to-downstream link this relationship asserts."

  - id: "KER:lkhagvadorj-egfr-to-mucus-metaplasia"
    name: "EGFR activation leads to mucus secretory program activation"
    description: "Prenatally smoke-exposed neonates with higher Areg and lower Egf expression showed higher expression of the mucus-related transcription factors Spdef and Foxm1. The organoid arm did not test the secretory program directly, so this link rests on the neonatal co-occurrence rather than on an AREG intervention."
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-mucus-metaplasia"
      name: "Mucus secretory program activation"
      biological_action: increased
      level_of_biological_organization: cellular
    relationship_type: "indirectly leads to"
