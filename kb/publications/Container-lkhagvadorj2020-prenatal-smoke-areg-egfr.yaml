# =============================================================================
# RESPONSE COMPARISONS
#
# The paper reports NO numeric means, SDs/SEMs or fold changes for any of
# these readouts - "Data are shown as individual values" in every figure - so
# no change_value or change_type is recorded. What the paper does state is the
# direction of change and an exact p-value from a two-tailed Mann-Whitney U
# test; those are captured here with derivation: reported_in_paper. The
# p-values were read from the local PDF full text (Results section), not from
# the abstract; the abstract states only the directions.
# =============================================================================

response_comparisons:
  - id: "COMP:lkhagvadorj-ciliated-cells-neonate"
    name: "Ciliated cell number, prenatal smoke vs prenatal air (neonatal lung)"
    description: "Paper reports P<0.001 for the pooled comparison (and P<0.0001 in each sex separately) without an exact value; the tabulated p_value 0.001 is therefore the stated upper bound, not an exact figure. No magnitude of change is reported."
