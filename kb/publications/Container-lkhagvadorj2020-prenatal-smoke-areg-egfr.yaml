    compared_measurement: "percentage_ciliated_cells"
    control_output: "CIL:lkhagvadorj-ciliated-cells-neonate-output-control"
    treated_output: "CIL:lkhagvadorj-ciliated-cells-neonate-output-smoke"
    change_direction: decreased
