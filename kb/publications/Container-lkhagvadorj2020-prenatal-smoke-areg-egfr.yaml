egfr_signaling_assays:
  - id: "EGFR:lkhagvadorj-areg-neonate"
    name: "AREG expression in neonatal lung - prenatal air vs prenatal smoke"
    description: "Two readouts of the EGFR ligand amphiregulin in 1-day-old offspring: (1) AREG-expressing cells by IHC, found mainly in the lung parenchyma, higher in prenatally smoke-exposed offspring (P=0.04 overall, most pronounced in females P=0.012; Fig. 4B/4b); (2) Areg mRNA by TaqMan RT-qPCR on left lung RNA, higher in smoke-exposed offspring in both sexes (P=0.0014 overall; both sexes P<0.05; Fig. 4C/4c). Egfr mRNA itself was NOT changed by prenatal smoke exposure (Fig. 4E/4e), so the paper's inference of increased EGFR signalling rests on ligand availability (more AREG, less EGF) rather than on any direct measure of EGFR phosphorylation, which was not assayed. Individual values only; no numeric level recorded."
    normalization_reference: "Gapdh (mRNA); total lung tissue area per section (AREG+ cells)"
    evidence:
