  - id: "CIL:lkhagvadorj-ciliated-cells-organoid"
    name: "Ciliated cell number in bronchiolar lung organoids - non-treated vs AREG"
    description: "Tubulin-positive cells counted in whole bronchiolar mouse lung organoids after 14 days (triple IF for tubulin, CC10 and KRT5), corrected for the total number of bronchial epithelial cells. AREG-treated organoids had lower numbers of tubulin-positive cells than non-treated organoids (P<0.001, Fig. 5D). This arm uses organoids derived from unexposed adult mice and tests AREG directly, not smoke. Counts are reported only as individual data points, so no value is recorded."
