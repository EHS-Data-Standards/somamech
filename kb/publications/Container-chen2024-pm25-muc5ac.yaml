egfr_signaling_assays:
  # PM2.5 model group - EGFR/MAPK activation
  - id: "EGFR:chen2024-pegfr-model"
    name: "p-EGFR and MAPK phosphorylation - PM2.5 model group"
    description: "Western blot and immunohistochemistry of rat lung tissue after 4 weeks of nebulised PM2.5. p-EGFR, p-ERK1/2, p-JNK and p-p38 were increased relative to the blank control group. The paper reports group differences only in figures, so no numeric values are recorded. Note: the Western blot Results paragraph states the opposite direction for p-EGFR; the abstract, the immunohistochemistry paragraph, the discussion and the conclusions all report the increase recorded here."
    evidence:
      - reference: "PMID:38809424"
        reference_title: "Effects of PM2.5 on mucus hypersecretion in airway through miR-133b-5p/EGFR/Claudin1/MUC5AC axis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The protein detection results showed that the expression of p-EGFR, MUC5AC, p-ERK1/2, p-JNK and p-p38 proteins was increased and the expression of Claudin1 protein was decreased in the model group compared with the control group."
        explanation: "States directly that p-EGFR and the three MAPK phosphoproteins rose in the PM2.5 model group relative to control, which is the EGFR activation this assay records."
      - reference: "PMID:38809424"
        reference_title: "Effects of PM2.5 on mucus hypersecretion in airway through miR-133b-5p/EGFR/Claudin1/MUC5AC axis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PM2.5 inhibited the expression of miR-133b-5p to activate the EGFR/MAPK signal pathway"
        explanation: "The authors' conclusion that PM2.5 activates the EGFR/MAPK pathway in rats supports linking this assay to the EGFR activation key event."
    has_specified_output:
      id: "EGFR:chen2024-pegfr-model-output"
      name: "p-EGFR and MAPK phosphoprotein levels - model group"
      description: "Increased p-EGFR, p-ERK1/2, p-JNK and p-p38 versus control by Western blot and immunohistochemistry. No numeric values are reported in the text; group data appear only in Figures 6 and 7."
    has_exposure_condition:
