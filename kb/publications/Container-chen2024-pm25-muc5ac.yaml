# =============================================================================
# Chen et al. (2024) - Effects of PM2.5 on mucus hypersecretion in airway
# through the miR-133b-5p/EGFR/Claudin1/MUC5AC axis
# =============================================================================
#
# Source: Aging (Albany NY). 2024;16(10):8472-8483
# DOI: 10.18632/aging.205785
#
# Study design:
#   - In vivo: 60 SPF male Wistar rats (6-8 weeks, 220+/-20 g), six groups of
#     ten: blank control (saline); PM2.5 model; model + AG1478 (EGFR blocker,
#     17.5 mg/kg SC twice a week); model + miR-133b-5p agomir (10 nmol, in situ
#     lung injection 48 h before sacrifice); model + Claudin1 overexpression
#     empty adenovirus (tracheal instillation); model + Claudin1
#     overexpression adenovirus
#   - PM2.5 source: sampled on the roof of Jiangxi Provincial Chest Hospital
#     (Nanchang, China), March-June 2020; suspension 40 ug/mL, ultrasonic
#     nebulisation 1 h/day for 4 weeks
#   - In vitro: 293T cells, dual-luciferase reporter assay for miR-133b-5p
#     binding to EGFR
#   - Readouts: serum IL-1 and TNF-alpha (ELISA), lung histopathology (HE,
#     AB-PAS), p-EGFR / MUC5AC / Claudin1 / p-ERK1/2 / p-JNK / p-p38 (Western
#     blot and immunohistochemistry), miR-133b-5p (RT-qPCR)
#
# Key findings (all directional; the paper reports group means only in
# figures, so no numeric values are extracted here):
#   - PM2.5 exposure lowered miR-133b-5p and raised MUC5AC protein in rat lung
#   - p-EGFR, MUC5AC, p-ERK1/2, p-JNK and p-p38 increased and Claudin1
#     decreased in the model group vs control
#   - AG1478, miR-133b-5p agomir and Claudin1 overexpression each reversed
#     those protein changes and lowered serum IL-1 / TNF-alpha
#   - Dual-luciferase confirmed miR-133b-5p targets EGFR
#
# Curation notes:
#   - No quantitative group values (means, SDs, fold changes, p-values) appear
#     in the text of this paper; every quantitative result is shown only in
#     figures. Per the extraction rules, no numbers have been invented, so the
#     assay outputs carry directional descriptions and no measurement values.
#   - The Results paragraph describing the Western blot states the opposite
#     direction for MUC5AC and p-EGFR ("down-regulated in the model group")
#     from the abstract, the immunohistochemistry paragraph, the discussion and
#     the conclusions. The consistent direction (increase in the model group)
#     is the one recorded here, and the discrepancy is flagged in the WB-based
#     assay descriptions.
#   - Serum cytokines are recorded with BALFSputumAssay, the only
#     inflammation-readout assay class in the schema; the subject sample type
#     is blood (serum), not BALF or sputum.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:38809424"
  reference_title: "Effects of PM2.5 on mucus hypersecretion in airway through miR-133b-5p/EGFR/Claudin1/MUC5AC axis."
  doi: "10.18632/aging.205785"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:chen2024-elisa-001"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for serum IL-1 and TNF-alpha"
    description: "Serum ELISA using rat TNF-alpha (MM-0180R1) and rat IL-1 (MM-0046R1) kits. Biotin-labelled antibody 30 min at 37 C, HRP-labelled detection antibody 30 min at 37 C, substrate A+B 15 min at 37 C in the dark, stop solution, OD read at 450 nm."
    detection_method: "ELISA, absorbance at 450 nm"
    equipment_required:
      - "Automatic microplate reader (WD-2102B)"
      - "Rat TNF-alpha ELISA kit (MM-0180R1)"
      - "Rat IL-1 ELISA kit (MM-0046R1)"

  - id: "PROTOCOL:chen2024-wb-001"
    protocol_type: MolecularAssayProtocol
    name: "Western blot for lung tissue proteins"
    description: "50 mg lung tissue lysed and ground, centrifuged 12000 r/min for 10 min, BCA protein quantification, 10% SDS-PAGE separation gel with 5% stacking gel, 300 mA transfer to PVDF for 90 min, 3% skim milk block 1 h at room temperature, primary antibody overnight, secondary antibody 2 h, chemiluminescence imaging."
    detection_method: "chemiluminescence imaging"
    antibodies_used:
      - "P-EGFR (AF30314, Affinity)"
      - "Claudin1 (AF0127, Affinity)"
      - "MUC5AC (A17325, Abclonal)"
      - "P-ERK1/2 (AF1015, Affinity)"
      - "P-JUK (AF3318, Affinity)"
      - "P-P38 (AF4001, Affinity)"
      - "Horseradish labeled goat anti-rabbit IgG (H+L) (ZB-2301)"
    equipment_required:
      - "SDS-PAGE apparatus"
      - "PVDF membrane"
      - "Ultra-high sensitivity chemiluminescence imaging system"

  - id: "PROTOCOL:chen2024-ihc-001"
    protocol_type: StainingProtocol
    name: "Immunohistochemistry for lung tissue proteins"
    description: "Paraffin sections baked 2 h at 65 C, dewaxed in xylene, graded ethanol hydration, citric acid buffer antigen retrieval in a pressure cooker, 3% hydrogen peroxide 10 min to quench endogenous peroxidase, 5% BSA block 30 min at 37 C, primary antibody overnight at 4 C, horseradish-labelled goat anti-rabbit IgG (H+L) 1:150 30 min at 4 C, DAB development 5-10 min, haematoxylin counterstain."
    staining_type: "immunohistochemistry"
    detection_method: "DAB chromogen"
    counterstain: "haematoxylin"
    antibodies_used:
      - "Horseradish labeled goat anti-rabbit IgG (H+L) (ZB-2301, 1:150)"
    equipment_required:
      - "Microtome (Leica 2235)"
      - "Microscope (BX43, OLYMPUS)"
      - "DAB color rendering kit (CW0125, CWBIO)"

  - id: "PROTOCOL:chen2024-qpcr-001"
    protocol_type: MolecularAssayProtocol
    name: "RT-qPCR for miR-133b-5p in lung tissue"
    description: "Lung tissue miRNA extracted with Trizon lysate, purity and concentration checked by UV spectrophotometry, stem-loop first-strand cDNA synthesis, SYBR qPCR in a 20 uL system (95 C 10 min; 40 cycles of 95 C 10 s, 58 C 30 s, 72 C 30 s). U6 or beta-actin used as internal reference."
    detection_method: "SYBR Green qPCR"
    reference_gene: "U6"
    primer_sequences:
      - "miR-133b-5p F: GCGGCTGGTCAAACGGAA"
      - "miR-133b-5p R: AGTGCAGGGTCCGAGGTATT"
      - "U6 F: ATTGGAACGATACAGAGAAGATT"
      - "U6 R: GGAACGCTTCACGAATTTG"
    equipment_required:
      - "Fluorescence cycler (CFX Connect real-time)"
      - "UV spectrophotometer (NP80, NanoPhotometer)"

  - id: "PROTOCOL:chen2024-he-001"
    protocol_type: StainingProtocol
    name: "HE staining of lung tissue"
    description: "Tissue rinsed, dehydrated through graded ethanol and xylene, paraffin embedded and sectioned, dewaxed and hydrated, haematoxylin 3 min, hydrochloric acid ethanol differentiation 15 s, bluing 15 s, eosin 3 min, dehydrated, cleared and mounted for microscopy."
    staining_type: "haematoxylin and eosin"
    equipment_required:
      - "Microtome (Leica 2235)"
      - "Microscope (BX43, OLYMPUS)"

  - id: "PROTOCOL:chen2024-abpas-001"
    protocol_type: StainingProtocol
    name: "Alcian blue periodic acid Schiff (AB-PAS) staining for airway mucus"
    description: "Sections dewaxed to water, Alcian blue 13 min, periodic acid oxidation 5 min, Schiff reagent 13 min, running water 10 min, ethanol dehydration, xylene clearing and neutral gum mounting. Mucinous material stains purplish red; classically rounded proximal airways imaged and quantified with Image-Pro Plus 6.0."
    staining_type: "Alcian blue periodic acid Schiff (AB-PAS)"
    detection_method: "light microscopy, Image-Pro Plus 6.0 image analysis"
    equipment_required:
      - "Light microscope (BX43, OLYMPUS)"
      - "Image-Pro Plus 6.0"

  - id: "PROTOCOL:chen2024-luciferase-001"
    protocol_type: MolecularAssayProtocol
    name: "Dual-luciferase reporter assay for miR-133b-5p binding to EGFR"
    description: "293T cells seeded at 8x10^4 per well in 12-well plates, transfected at 70% confluence in 5% FBS medium with EGFR wild-type or mutant luciferase reporter vectors plus miRNA mimic or mimic NC and the pRL-SV40 Renilla plasmid. 70 uL lysate per group assayed in black 96-well plates with 100 uL firefly luciferase reagent, then 100 uL Renilla reagent."
    detection_method: "dual-luciferase reporter assay (firefly / Renilla)"
    equipment_required:
      - "Multifunctional microplate analyzer (SuPerMax 3100)"
      - "Biluciferase Reporter Detection Kit (RG027)"
      - "Lipofectamine 3000 (L3000015, Invitrogen)"

