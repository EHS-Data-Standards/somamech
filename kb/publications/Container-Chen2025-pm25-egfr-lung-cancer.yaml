        reference_title: "The role of PM2.5 exposure in lung cancer: mechanisms, genetic factors, and clinical implications."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "PM2.5 exposure increases IL-1β release from macrophages, encouraging a progenitor-like state in EGFR-mutant alveolar type II cells, which are precursors to lung adenocarcinoma (Hill et al, 2023)."
        explanation: "The review states the IL-1beta release from macrophages that this assay records and the downstream effect on EGFR-mutant alveolar type II cells."
    has_exposure_condition:
