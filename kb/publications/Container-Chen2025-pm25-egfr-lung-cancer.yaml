gene_expression_assays:

  # --- AhR-dependent TMPRSS2 transcription --------------------------------
  - id: "GENE:chen2025-pm25-ahr-tmprss2"
    name: "AhR-dependent TMPRSS2 transcription after PM2.5 exposure"
    description: "Mechanism reported by the review from Wang et al (2023): PM2.5 exposure induces aryl hydrocarbon receptor (AhR)-dependent transcription of transmembrane serine protease 2 (TMPRSS2) in EGFR-mutant cells, promoting cancer progression. The review reports no expression values, so no output measurement is recorded."
    target_gene: "PR:O15393"
    evidence:
      - reference: "PMID:39578555"
        reference_title: "The role of PM2.5 exposure in lung cancer: mechanisms, genetic factors, and clinical implications."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "PM2.5 exposure induces aryl hydrocarbon receptor (AhR)-dependent transcription of transmembrane serine protease 2 (TMPRSS2)"
        explanation: "The review names the AhR-dependent transcription of TMPRSS2 that this assay records as induced by PM2.5 exposure."
    has_exposure_condition:
      - id: "EXPOSURE:chen2025-pm25-cell-exposure"
        name: "PM2.5 exposure of lung cancer cells"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
    informs_on_key_event:
      id: "KE:mie-ahr-activation"
      name: "AhR pathway activation"
      biological_action: activated
      level_of_biological_organization: molecular
    study_subject:
      subject_type: CellularSystem
      id: "soma:chen2025-egfr-mutant-cells-001"
      name: "EGFR-mutant lung cancer cells (cell line and species not stated in the review)"
      cell_type:
        id: "CL:0001063"
        name: "neoplastic cell"
      anatomical_origin:
        id: "UBERON:0002048"
        name: "lung"

  # --- AhR-dependent IL-18 transcription ----------------------------------
  - id: "GENE:chen2025-pm25-ahr-il18"
    name: "AhR-dependent IL-18 transcription after PM2.5 exposure"
    description: "Mechanism reported by the review from Wang et al (2023): PM2.5 exposure induces AhR-dependent transcription of interleukin-18 (IL-18) in EGFR-mutant cells, further promoting cancer progression. No expression values are reported in the review."
    target_gene: "PR:Q14116"
    evidence:
      - reference: "PMID:39578555"
        reference_title: "The role of PM2.5 exposure in lung cancer: mechanisms, genetic factors, and clinical implications."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "and interleukin-18 (IL-18), further promoting cancer progression"
        explanation: "The review names IL-18 as the second AhR-dependent transcript induced by PM2.5 exposure, which is what this assay records."
    has_exposure_condition:
      - id: "EXPOSURE:chen2025-pm25-cell-exposure"
        name: "PM2.5 exposure of lung cancer cells"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
    informs_on_key_event:
      id: "KE:mie-ahr-activation"
      name: "AhR pathway activation"
      biological_action: activated
      level_of_biological_organization: molecular
    study_subject:
      subject_type: CellularSystem
      id: "soma:chen2025-egfr-mutant-cells-001"
      name: "EGFR-mutant lung cancer cells (cell line and species not stated in the review)"
      cell_type:
        id: "CL:0001063"
        name: "neoplastic cell"
      anatomical_origin:
        id: "UBERON:0002048"
        name: "lung"

  # --- NF-kB-driven IL-6 production ---------------------------------------
  - id: "GENE:chen2025-pm25-nfkb-il6"
    name: "IL-6 production driven by PM2.5-enhanced NF-kB activity"
    description: "Mechanism reported by the review from Liu et al (2018): PM2.5 exposure enhances NF-kB activity, which drives production of the pro-inflammatory cytokine interleukin-6 (IL-6). The review names neither the model system nor any expression value for this step, so no study subject and no output measurement are recorded."
    target_gene: "PR:P05231"
    evidence:
      - reference: "PMID:39578555"
        reference_title: "The role of PM2.5 exposure in lung cancer: mechanisms, genetic factors, and clinical implications."
        supports: SUPPORT
        evidence_source: OTHER
        snippet: "PM2.5 exposure enhances NF- κB activity, which in turn drives the production of pro-in ﬂammatory cytokines like interleukin-6 (IL-6)"
        explanation: "The review states that PM2.5-enhanced NF-kB activity drives production of IL-6, the cytokine this assay records."
    has_exposure_condition:
      - id: "EXPOSURE:chen2025-pm25-cell-exposure"
        name: "PM2.5 exposure of lung cancer cells"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
    informs_on_key_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue

  # --- IL-1beta release from macrophages ----------------------------------
  - id: "GENE:chen2025-pm25-il1b-macrophage"
    name: "IL-1beta release from macrophages after PM2.5 exposure"
    description: "Mechanism reported by the review from Hill et al (2023): PM2.5 exposure increases IL-1beta release from macrophages, which encourages a progenitor-like state in EGFR-mutant alveolar type II cells, the precursors of lung adenocarcinoma. The review reports no quantitative cytokine values."
    target_gene: "PR:P01584"
    evidence:
