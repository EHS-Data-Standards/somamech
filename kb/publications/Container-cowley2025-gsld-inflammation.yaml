    name: "BAL neutrophils in wild-type C57Bl/6 mice after GSLD qPM2.5 inhalation"
    description: "Whole-body inhalation of GSLD qPM2.5 produced dose-dependent increases in total BAL cells and neutrophils 24 h after exposure (Fig. 5a,b). With the 3x exposure paradigm, wild-type C57Bl/6 controls had 58 +/- 9% BAL neutrophils (Fig. 11c). At an equivalent dose, GSLD qPM2.5 elicited greater neutrophilia than coal fly ash (CFA) qPM2.5. Dose-response curves themselves are figure-only and are not transcribed."
    target_cell_type:
      id: "CL:0000775"
      name: "neutrophil"
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "exhibited dose-dependent increases in total cells and neutrophils in BAL fluid collected 24 h after treatment"
        explanation: "States the dose-dependent increase in total BAL cells and neutrophils 24 h after GSLD qPM2.5 exposure that this assay records."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Using the 3x GSLD qPM2.5 inhalation exposure paradigm, Trpv1N606D mice exhibited increased (76 ± 6 vs. 58 ± 9%)"
        explanation: "Gives the 58 +/- 9% wild-type BAL neutrophil value recorded as this assay's output, measured with the 3x inhalation paradigm."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Using the 3x exposure paradigm, GSLD qPM 2.5 elicited greater neutrophilia as well as Cxcl2 and Muc5ac mRNA expression than an equivalent dose of CFA qPM 2.5"
        explanation: "Supports the comparison noted in the description: GSLD qPM2.5 was more neutrophilic than an equivalent dose of coal fly ash."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "percentage of neutrophils in BAL following inhalation exposure of mice to GSLD qPM2.5 for 12 min (1x), 24 min (2x), or 36 min (3x) over the course of one day or 72 min over 2 days (6x)"
        explanation: "States that the 3x inhalation paradigm is 36 min of exposure in one day, the exposure duration recorded for this assay."
