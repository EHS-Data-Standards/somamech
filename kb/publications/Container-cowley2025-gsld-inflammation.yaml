  # ---- THP-1 macrophage-like cells, in vitro ----
  - id: "GE:cowley-il6-thp1"
    name: "IL6 mRNA in differentiated THP-1 cells treated with GSLD qPM2.5"
    description: "PMA-differentiated (macrophage-like) THP-1 cells treated with GSLD qPM2.5 at 0.045 mg/mL (12 ug/cm2) induced IL6 mRNA. Unlike in HBEC3-KT cells the response was partly TLR4-dependent: the TLR4 inhibitor TAK-242 reduced IL6 induction by ~22% (p=0.076) for GSLD qPM2.5 and ~51% (p=0.044) for Salton Sea dust qPM2.5, versus >95% (p=0.000002) for LPS. TRPV1 inhibition had no effect in THP-1 cells and deferoxamine enhanced responses. TNFa induction was <2-fold vehicle control in all cases. Fold-change values are figure-only and are not transcribed."
    gene_expression_method: "TaqMan qRT-PCR (Hs00174131_m1)"
    normalization_reference: "beta-2-microglobulin (Hs00187842_m1), comparative cycle threshold (ddCT) method"
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Induction of IL6, but not IL8 mRNA by LPS was reduced > 95% by TAK-242 (p = 0.000002), ~ 22% (p = 0.076) for GSLD qPM 2.5, and ~ 51% (p = 0.044) for SSD qPM 2.5"
        explanation: "Gives the TAK-242 (TLR4 inhibitor) effect sizes and p-values on IL6 mRNA induction in THP-1 cells recorded in the description."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Pro-inflammatory biomarker mRNA induction was replicated in vitro using HBEC3-KT and differentiated monocyte-derived (macrophage-like) THP-1 cells."
        explanation: "States that the pro-inflammatory mRNA induction was reproduced in differentiated THP-1 cells, the system this assay uses."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "a concentration of 0.25 mg/mL or 66 µg/cm2 was used for HBEC3-KT cells and 0.045 mg/mL or 12  µg/cm 2 for THP-1 cells"
