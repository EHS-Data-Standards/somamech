  # ---- HBEC3-KT, in vitro ----
  - id: "GE:cowley-il6-hbec3kt"
    name: "IL6 mRNA in HBEC3-KT cells treated with GSLD qPM2.5"
    description: "HBEC3-KT cells treated for 24 h with GSLD qPM2.5 at 0.25 mg/mL (66 ug/cm2) reproduced the pro-inflammatory mRNA induction seen in mouse lung. IL6 mRNA induction was significantly reduced by co-treatment with the metal/calcium chelator EGTA plus the non-selective calcium channel blocker ruthenium red, and by the TRPV1 antagonists LJO-328 and AMG-9810 and the TRPV3 antagonist 007; the TLR4 inhibitor TAK-242 and the iron chelator deferoxamine also reduced IL6 induction. Fold-change values are figure-only and are not transcribed."
    gene_expression_method: "TaqMan qRT-PCR (Hs00174131_m1)"
    normalization_reference: "beta-2-microglobulin (Hs00187842_m1), comparative cycle threshold (ddCT) method"
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Treatment of HBEC3-KT cells for 24  h with GSLD qPM2.5 (0.25  mg/mL; 66  µg/cm 2) replicated the induc"
        explanation: "Gives the exposure condition (0.25 mg/mL = 66 ug/cm2 for 24 h) and the replication of the in vivo cytokine mRNA induction that this assay records (the sentence is hyphen-wrapped at 'induc-tion' in the cached PDF text)."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In HBEC3-KT cells, IL6 and IL8 (the human analogue of Cxcl1 and Cxcl2) mRNA induction was attenuated by ethylene glycol-bis(β-aminoethyl ether)-N, N,N′,N’-tetraacetic acid (EGTA) and ruthenium red (RR) co-treatment, and by TRPV1 and TRPV3 antagonists, but less by the Toll-like Receptor-4 (TLR4) inhibitor TAK-242 and deferoxamine."
        explanation: "States the pharmacology summarised in the description: IL6 mRNA induction in HBEC3-KT cells was attenuated by EGTA + ruthenium red and by TRPV1/TRPV3 antagonists."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
