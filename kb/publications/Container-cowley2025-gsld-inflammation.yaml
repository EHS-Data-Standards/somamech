goblet_cell_assays:
  - id: "GCM:cowley-muc5ac-mouse-lung"
    name: "Muc5ac mRNA in mouse lung after GSLD qPM2.5 exposure"
    description: "Muc5ac mRNA in the left lung lobe was induced by both inhaled and oropharyngeally aspirated GSLD qPM2.5 (Fig. 6d; Supplemental Fig. 9d), and with the 3x paradigm more strongly than by an equivalent dose of coal fly ash qPM2.5 (Supplemental Fig. 10). Fold-change values are figure-only and are not transcribed. No goblet cell counts were reported."
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Exposure of mice via inhalation and oropharyngeal aspiration caused neutrophilia, increased expression of mRNA for Il6, Cxcl1, Cxcl2, and Muc5ac in the lungs, and increased IL6 and CXCL1 in bronchoalveolar lavage."
        explanation: "Names Muc5ac among the mRNAs increased in the lungs of mice exposed to GSLD qPM2.5 by inhalation and oropharyngeal aspiration."
