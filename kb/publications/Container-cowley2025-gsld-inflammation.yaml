# =============================================================================
# Cowley et al. (2025) - Pro-inflammatory effects of inhaled Great Salt Lake
# dust particles
# =============================================================================
#
# Source: Part Fibre Toxicol. 2025;22:2
# DOI: 10.1186/s12989-025-00618-9
# PMID: 39819386
#
# Study design:
#   - In vivo: male and female C57Bl/6 mice (8-10 weeks), whole-body
#     inhalation (inExpose, PALAS RBG 1000ID) of Great Salt Lake dust
#     quasi-PM2.5 (GSLD qPM2.5, PM < 3.1 um) for ~12 min intervals
#     (1x, 2x, 3x in one day, or 6x over two days); also oropharyngeal
#     aspiration (2.5-250 ug). Comparison PM: coal fly ash (CFA) qPM2.5.
#   - In vivo: CRISPR "humanized" Trpv1N606D mice vs wild-type C57Bl/6,
#     3x inhalation paradigm.
#   - In vitro: immortalized human bronchial epithelial HBEC3-KT cells
#     (0.25 mg/mL = 66 ug/cm2, 24 h) and PMA-differentiated THP-1
#     macrophage-like cells (0.045 mg/mL = 12 ug/cm2).
#
# Key findings recorded here:
#   - Dose-dependent BAL neutrophilia and total cell increases after GSLD
#     qPM2.5 inhalation; GSLD > CFA at an equivalent dose.
#   - Trpv1N606D mice: 76 +/- 6% BAL neutrophils vs 58 +/- 9% in wild type.
#   - IL6 and CXCL1 protein elevated 2-3-fold in BAL after inhalation.
#   - Il6, Cxcl1, Cxcl2 and Muc5ac mRNA induced in mouse lung.
#   - IL6/IL8 mRNA induction replicated in HBEC3-KT and THP-1 cells;
#     attenuated by EGTA + ruthenium red and by TRPV1/TRPV3 antagonists,
#     less so by the TLR4 inhibitor TAK-242 and deferoxamine.
#
# Values shown only in figures are NOT transcribed: those assays carry the
# qualitative direction plus an exact quote, and no invented numbers.
#
# =============================================================================

source_publication:
  reference: "PMID:39819386"
  reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
  doi: "10.1186/s12989-025-00618-9"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:cowley-inhalation-001"
    name: "Whole-body inhalation exposure to resuspended GSLD qPM2.5"
    equipment_required:
      - "inExpose whole-body inhalation system (Scireq)"
      - "PALAS RBG 1000ID dust generator"
      - "Casella CEL-712 Microdust Pro real-time monitor"
      - "DustTrack II with PM2.5 inlet filter (TSI)"

  - id: "PROTOCOL:cowley-bal-001"
    name: "Bronchoalveolar lavage with Giemsa differential cell counts"
    equipment_required:
      - "Tracheal cannula"
      - "Cytospin"
      - "Giemsa stain"
      - "Light microscope"

  - id: "PROTOCOL:cowley-elisa-001"
    name: "Mouse CXCL1 (KC) and IL6 ELISA on BAL supernatant"
    equipment_required:
      - "Mouse CXCL1 (KC) ELISA kit (Invitrogen)"
      - "Mouse IL6 ELISA kit (Invitrogen)"
      - "Plate reader"

  - id: "PROTOCOL:cowley-qpcr-mouse-001"
    name: "TaqMan qRT-PCR for mouse cytokine and mucin mRNA"
    equipment_required:
      - "Life Technologies QuantStudio 6 Flex"
      - "ABI High-Capacity cDNA kit"
      - "TaqMan probes Il6 (Mm00446190_m1), Cxcl1 (Mm04207460_m1), Cxcl2 (Mm00436450_m1), Muc5ac (Mm01276718_m1)"

  - id: "PROTOCOL:cowley-qpcr-human-001"
    name: "TaqMan qRT-PCR for human IL6 and IL8 mRNA"
    equipment_required:
      - "Life Technologies QuantStudio 6 Flex"
      - "PureLink RNA Mini Kit"
      - "TaqMan probes IL6 (Hs00174131_m1), IL8 (Hs00174103_m1)"

