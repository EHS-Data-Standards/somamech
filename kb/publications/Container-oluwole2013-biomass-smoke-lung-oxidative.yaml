# =============================================================================
# RESPONSE COMPARISONS
#
# The paper states that measured FEV1 was significantly lower than predicted
# FEV1 but never reports the size of that difference, so change_value is
# omitted rather than computed (the extraction rule is: never calculate a
# delta). p_value is omitted too — the paper reports only the threshold
# p<0.05, not an exact value. What these records carry is which two output
# records the paper compared, in which direction, and by what test.
# =============================================================================

response_comparisons:
  - id: "COMP:oluwole-mothers-fev1"
    name: "FEV1 in biomass-exposed mothers vs ATS-predicted normal"
    description: "The paper reports 1.94+/-0.51 vs 2.79+/-0.36 L/s with p<0.05 (a significance threshold, not an exact p-value) and gives no difference, percent change or fold change, so change_value is omitted rather than computed. The comparator is an external predicted-value reference, not a sampled unexposed group."
    derived_from_assay: "LF:oluwole-mothers-spirometry"
    compared_measurement: "fev1"
    control_output: "LF:oluwole-mothers-spirometry-output-predicted"
    treated_output: "LF:oluwole-mothers-spirometry-output-exposed"
    change_type: absolute_difference
    change_direction: decreased
    statistical_test: "Student's t-test"
    derivation: reported_in_paper

  - id: "COMP:oluwole-children-fev1"
    name: "FEV1 in biomass-exposed children vs ATS-predicted normal"
    description: "The paper reports 1.76+/-0.54 vs 2.57+/-0.66 L/s with p<0.05 (a significance threshold, not an exact p-value) and gives no difference, percent change or fold change, so change_value is omitted rather than computed. The comparator is an external predicted-value reference, not a sampled unexposed group."
    derived_from_assay: "LF:oluwole-children-spirometry"
    compared_measurement: "fev1"
    control_output: "LF:oluwole-children-spirometry-output-predicted"
    treated_output: "LF:oluwole-children-spirometry-output-exposed"
    change_type: absolute_difference
    change_direction: decreased
    statistical_test: "Student's t-test"
    derivation: reported_in_paper

# =============================================================================
# KEY EVENT RELATIONSHIPS
#
# Cross-sectional correlations only. The paper found NO significant
# association between measured PM2.5 level and either serum oxidant
# parameters or FEV1, lacked a clean-fuel control arm, and states that
# further studies are needed to define causal relationships. Both
# relationships are therefore "associated with" with evidence_support: weak,
# NOT a causal exposure-response link.
# =============================================================================

key_event_relationships:
  - id: "KER:oluwole-oxidative-stress-to-lung-function"
    name: "Increased oxidative stress is associated with decreased lung function"
    description: "Serum MDA, a marker of systemic lipid peroxidation, was negatively associated with FEV1/FVC in both mothers and children (both r=-0.3, p=0.05). This is a cross-sectional correlation in a cohort with no clean-fuel comparison arm; the paper does not establish direction or causality."
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    relationship_type: "associated with"
    evidence_support: weak
    evidence:
      - reference: "PMID:23777718"
        reference_title: "Relationship between household air pollution from biomass smoke exposure, and pulmonary dysfunction, oxidant-antioxidant imbalance and systemic inflammation in rural women and children in Nigeria."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "However, MDA concentration was negatively associated with FEV1/FVC in mothers and children (both r=-0.3, p=0.05; Figure 1)."
        explanation: "Reports the negative association between the lipid-peroxidation marker and lung function that this relationship records, as a correlation coefficient rather than a causal effect."
      - reference: "PMID:23777718"
        reference_title: "Relationship between household air pollution from biomass smoke exposure, and pulmonary dysfunction, oxidant-antioxidant imbalance and systemic inflammation in rural women and children in Nigeria."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Correlation analysis showed no significant association between PM2.5 concentration levels and serum oxidant parameters."
        explanation: "Supports the weak evidence_support and the non-causal relationship_type: the measured exposure level itself did not track with the oxidant markers, so no exposure-response claim is made."

  - id: "KER:oluwole-oxidative-stress-to-systemic-inflammation"
    name: "Increased oxidative stress is associated with increased systemic inflammation"
    description: "Serum MDA correlated positively with serum CRP in children (r=0.3, p<0.05) but not in mothers (r=0.1, p=0.64). The association is therefore present in only one of the two groups studied, and the authors note that nutritional deficiency or unrecognised lung infection could also account for the elevated CRP and MDA. Note also the asymmetry on the downstream side: the children's CRP elevation above the normal range was significant (p<0.05) while the mothers' was not (p=0.39), so the systemic-inflammation key event is better supported in the children than in the mothers."
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-systemic-inflammation"
      name: "Increased systemic inflammation"
      biological_action: increased
      level_of_biological_organization: organism
    relationship_type: "associated with"
    evidence_support: weak
    evidence:
      - reference: "PMID:23777718"
        reference_title: "Relationship between household air pollution from biomass smoke exposure, and pulmonary dysfunction, oxidant-antioxidant imbalance and systemic inflammation in rural women and children in Nigeria."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "MDA showed a significant positive correlation with CRP only in children (r=0.3, p<0.05) but no significant association was observed in mothers (r=0.1, p=0.64; Figure 2)."
        explanation: "Reports the MDA-CRP correlation behind this relationship and, by showing it in children only, supports recording the evidence as weak rather than consistent across the cohort."
