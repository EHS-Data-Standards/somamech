# =============================================================================
# SYSTEMIC INFLAMMATION — serum C-reactive protein by ELISA.
#
# Modelling note: serum CRP has no dedicated slot in the SOMA microschemas.
# BALFSputumAssay covers BALF and sputum only, so serum CRP is recorded as a
# GeneExpressionAssay protein_level measured by ELISA, which is the only slot
# in the schema for a protein concentration in a body fluid. target_gene is
# deliberately omitted: no Protein Ontology CURIE for C-reactive protein could
# be verified during extraction, and an unverified CURIE is worse than none.
# =============================================================================

gene_expression_assays:
  - id: "GE:oluwole-crp-mothers"
    name: "Serum C-reactive protein (ELISA) - biomass-exposed rural mothers"
    description: "Serum CRP in the exposed mothers was 3.79 +/- 1.89 ug/ml, above the laboratory normal range of 1-3 ug/ml, but the difference from the normal range was not statistically significant in mothers (p=0.39). In the regression analysis CRP was a strong predictor of impaired lung function in mothers (-2.55 +/- 1.08, p<0.05). SOD showed a positive correlation with CRP in mothers."
