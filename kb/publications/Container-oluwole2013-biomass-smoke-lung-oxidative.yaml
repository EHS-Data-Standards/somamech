# =============================================================================
# OXIDANT / ANTIOXIDANT ASSAYS — serum lipid peroxidation (MDA) and
# antioxidant enzyme status (SOD). Kept separate from the spirometry and the
# systemic-inflammation readouts.
#
# The comparator for these biomarkers is a laboratory NORMAL RANGE, not a
# measured control group, so no comparator output record is created: a range
# is not a mean and inventing one would fabricate a value the paper never
# reports. The ranges are stated in the description text instead.
# =============================================================================

oxidative_stress_assays:
  - id: "OX:oluwole-mda-mothers"
    name: "Serum malondialdehyde - biomass-exposed rural mothers"
    description: "Serum lipid peroxidation measured as MDA by the thiobarbituric acid colorimetric reaction. Mean serum MDA in the exposed mothers was 5.90 +/- 2.40 umol/L, higher than the laboratory normal range of <4.5 umol/L (p<0.05). 55 of the 59 mother-child pairs consented to blood draw, so n = 55. MDA was negatively associated with FEV1/FVC (r=-0.3, p=0.05) but showed no significant correlation with CRP in mothers (r=0.1, p=0.64), and no significant association with measured PM2.5 level."
    evidence:
      - reference: "PMID:23777718"
        reference_title: "Relationship between household air pollution from biomass smoke exposure, and pulmonary dysfunction, oxidant-antioxidant imbalance and systemic inflammation in rural women and children in Nigeria."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Mean serum MDA concentrations in mothers (5.90±2.40 µmol/L)"
        explanation: "States the mean and standard deviation of serum MDA recorded as this assay's malondialdehyde_level output for the exposed mothers."
