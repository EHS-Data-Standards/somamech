# =============================================================================
# Oluwole et al. (2013) - Relationship between household air pollution from
# biomass smoke exposure, and pulmonary dysfunction, oxidant-antioxidant
# imbalance and systemic inflammation in rural women and children in Nigeria
# =============================================================================
#
# Source: Glob J Health Sci. 2013;5(4):28-38
# DOI: 10.5539/gjhs.v5n4p28
# PMID: 23777718
#
# Study design (HUMAN OBSERVATIONAL — not in vitro, not an animal experiment):
#   - Cross-sectional pilot study, three rural communities (Ajibade, Eruwa,
#     Olorisaoko) near Ibadan, southwest Nigeria
#   - Population: 59 mother-child pairs (118 subjects) from 59 households that
#     cook with biomass fuel (firewood) almost exclusively
#     * mothers: mean age 43.0 +/- 11.7 y, eligibility 20-60 y
#     * children: mean age 13.6 +/- 3.2 y, eligibility 7-17 y
#   - Spirometry performed in all 59 pairs; 55 of the 59 pairs consented to
#     blood draw, so serum biomarker records carry n = 55
#   - Indoor PM2.5 measured in cooking areas with a pDR 1500 aerosol monitor
#
# IMPORTANT — WHAT THE EXPOSURE CONTRAST ACTUALLY IS:
#   This study sampled NO clean-fuel control households. The authors state this
#   as a limitation: "Another limitation is the lack of control households
#   where cleaner fuels are used for cooking in the community where the study
#   was performed." Every comparison the paper makes is therefore against
#   EXTERNAL reference values, not against an internal unexposed arm:
#     * spirometry vs. ATS-recommended predicted normal values (the paper
#       reports these predicted means +/- SD, so they are modelled as the
#       comparator output record, marked control and pointing at the
#       COND:oluwole-predicted-normal reference condition rather than at a
#       sampled household)
#     * serum biomarkers vs. laboratory normal ranges (reported only as ranges,
#       not as means, so they stay in description text and are NOT given a
#       fabricated comparator output record)
#
# IMPORTANT — WHAT THE PAPER DOES *NOT* CLAIM:
#   These are cross-sectional ASSOCIATIONS, not an exposure-response
#   relationship. The paper found NO significant association between measured
#   PM2.5 level and either serum oxidant parameters or FEV1, and closes with
#   "Further studies are needed to better define causal relationships and the
#   mechanisms involved." The key event relationships below are therefore
#   recorded with relationship_type "associated with" and
#   evidence_support: weak.
#
# Key findings recorded here:
#   - Median indoor PM2.5 1575.1 ug/m3 (IQR 943.6-2847.0), vs WHO 25 ug/m3
#   - FEV1 significantly below ATS-predicted in mothers and in children
#   - Serum MDA above the normal range in mothers and children
#   - Serum SOD below the lower limit of normal in 42% of mothers, 51% of
#     children (the paper gives no mean SOD value in text, so the finding is
#     recorded in the string slot antioxidant_enzyme_activities, with no
#     invented numeric value). Recorded as two assays, one per group, so that
#     which group a record describes is machine-readable via study_subject.
#   - Serum CRP above the normal range in mothers and children
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:23777718"
  reference_title: "Relationship between household air pollution from biomass smoke exposure, and pulmonary dysfunction, oxidant-antioxidant imbalance and systemic inflammation in rural women and children in Nigeria."
  doi: "10.5539/gjhs.v5n4p28"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:oluwole-spirometry-001"
    name: "KoKo spirometry per ATS recommendations"
    description: "Pulmonary function tests with the PC-based full function KoKo spirometer (nSpire Health, Inc. Longmont, Colorado) in accordance with American Thoracic Society (ATS) recommendations. Spirometry performed at similar times of day to minimise diurnal variation; spirometer calibrated daily and operated within the ambient temperature. FVC, FEV1, FEV1/FVC ratio and peak expiratory flow rate (PEFR) measured. Predicted normal values taken from the ATS recommendations."
    spirometry_standard: "American Thoracic Society (ATS) recommendations"
    equipment_required:
      - "KoKo PC-based full function spirometer (nSpire Health, Inc. Longmont, Colorado)"

  - id: "PROTOCOL:oluwole-pm25-001"
    name: "Real-time indoor PM2.5 monitoring in cooking areas"
    description: "Indoor air sampling in 59 households. Real-time PM2.5 measured in cooking areas before and during cooking with the pDR 1500 personal aerosol monitor and data logger (Thermo Scientific, Franklin, Massachusetts), using gravimetric and optically-based methods. After calibration and equilibration the instrument cycled every minute for one hour during cooking of evening meals. Sampler placed at the centre of the kitchen, approximately 0.5 m from the ground and within a 1 m radius of the plume from the pollution source."
    equipment_required:
      - "pDR 1500 personal aerosol monitor and data logger (Thermo Scientific, Franklin, Massachusetts)"

  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:oluwole-mda-001"
    name: "Serum malondialdehyde by thiobarbituric acid colorimetry"
    description: "Serum lipid peroxidation assayed by the colorimetric reaction between MDA and thiobarbituric acid (Kamal et al., 1989). Venous blood collected in 10 ml Vacutainer EDTA tubes; serum frozen and stored at -80 C until analysis at the Institute for Advanced Medical Research and Training laboratory, University College Hospital, Ibadan."
    detection_method: "colorimetry (MDA-thiobarbituric acid reaction)"

  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:oluwole-sod-001"
    name: "Serum superoxide dismutase by epinephrine autoxidation inhibition"
    description: "Antioxidant enzyme superoxide dismutase (SOD) assayed by the epinephrine autoxidation inhibition method (Magwere, Naik, & Hasler, 1997). Vitamin C determined by colorimetric method and vitamin E by high-performance liquid chromatography in the same serum samples."
    detection_method: "epinephrine autoxidation inhibition assay"

  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:oluwole-crp-elisa-001"
    name: "Serum C-reactive protein by ELISA"
    description: "Serum C-reactive protein (CRP) levels determined by enzyme-linked immunosorbent assay (ELISA) immunoplate as described by the manufacturer (Immuno-Biological Labs. Inc.)."
    detection_method: "ELISA (Immuno-Biological Labs. Inc. immunoplate)"

# =============================================================================
# LUNG FUNCTION ASSAYS — spirometry in the exposed cohort, compared with the
# ATS-recommended predicted normal values (the study's only comparator; no
# clean-fuel control households were sampled)
