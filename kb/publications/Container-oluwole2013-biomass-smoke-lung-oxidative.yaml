        evidence_source: HUMAN_CLINICAL
        snippet: "Additionally, mean serum CRP concentrations in mothers (3.79±1.89 µg/ml) and children (3.56±1.54 µg/ml) were higher than normal range (1-3 µg/ml, p=0.39 and p<0.05, respectively)."
        explanation: "States the mean and standard deviation of serum CRP recorded as this assay's protein_level output for the exposed mothers. Quoted whole so that 'respectively' keeps its referents: the p=0.39 belongs to the mothers and the p<0.05 to the children, so the mothers' elevation above the normal range was NOT statistically significant."
