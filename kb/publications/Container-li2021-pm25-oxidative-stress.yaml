# =============================================================================
# Li et al. (2021) - Effective-component compatibility of Bufei Yishen formula
# protects COPD rats against PM2.5-induced oxidative stress via the
# miR-155/FOXO3a pathway
# =============================================================================
#
# Source: Ecotoxicol Environ Saf. 2021;228:112918
# DOI: 10.1016/j.ecoenv.2021.112918
#
# Study design (read from the local full text; the committed reference cache
# for this PMID is abstract-only, so every evidence snippet below is quoted
# from the abstract):
#   - In vivo: 32 male SD rats (6-9 wk), randomized into four groups.
#     8 weeks cigarette smoke + Klebsiella pneumoniae to establish COPD, then
#     8 more weeks of whole-body concentrated ambient PM2.5 (4 h/day, mean
#     daily concentration 739.97 ug/m3). Groups: Control (filtered air,
#     PM2.5 < 10 ug/m3, distilled water gavage), Model (PM2.5-aggravated
#     COPD), ECC-BYF (5.5 mg/kg/d), NAC (108 mg/kg/d). Sacrifice week 17.
#   - In vitro: human bronchial epithelial Beas-2B cells and primary mouse
#     tracheal epithelial cells (MTECs), pretreated with ECC-BYF (2-32 ug/mL)
#     or NAC (500 uM) for 24 h, then PM2.5 suspension 100 ug/mL for 24 h.
#   - Transfection: miR-155 mimic (50 nM) and pcDNA-FOXO3a (14 ug) in Beas-2B.
#
# Key findings:
#   - PM2.5-aggravated COPD rats: reduced lung function (VT, PEF, EF50, FVC,
#     FEV0.3, FEV0.3/FVC), lung injury, goblet cell hyperplasia, oxidative
#     stress (T-SOD down, MDA up in serum and BALF).
#   - ECC-BYF and NAC reversed these changes.
#   - ECC-BYF decreased ROS in PM2.5-exposed Beas-2B and MTECs, raised T-SOD
#     and GSH-Px and lowered MDA in Beas-2B.
#   - ECC-BYF raised FOXO3a (and downstream SOD2/CAT) and lowered miR-155,
#     both dose-dependently; miR-155 mimic abolished the protection and
#     FOXO3a overexpression partially restored it.
#
# IMPORTANT - no numeric measurement values are recorded below. This paper
# reports every group-level result in figures only; the running text and the
# abstract state directions of change and significance thresholds but no
# numbers. Per the extraction rules, figure-derived values are not estimated,
# so each output record carries only its experimental group, the exposure
# condition it was measured under, and a description of the reported
# direction. Exposure concentrations, doses, durations and group sizes ARE
# stated numerically in the Methods and are recorded as such.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:34773846"
  reference_title: "Effective-component compatibility of Bufei Yishen formula protects COPD rats against PM2.5-induced oxidative stress via miR-155/FOXO3a pathway."
  doi: "10.1016/j.ecoenv.2021.112918"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:li-pft-001"
    protocol_type: SpirometryProtocol
    name: "Noninvasive and invasive pulmonary function testing in rats"
    description: "Unrestrained lung function (tidal volume VT, peak expiratory flow PEF, expiratory flow at 50% tidal volume EF50) measured by whole-body plethysmography every fourth week from week 1 to week 16. At week 17 rats were anesthetized with 3% pentobarbital sodium (35 mg/kg, ip) and FVC, FEV0.3 and FEV0.3/FVC were measured on an invasive pulmonary function test system. n = 8 per group."
    spirometry_standard: "whole-body plethysmography (noninvasive) plus invasive pulmonary function test system"
    plethysmography_method: "unrestrained whole-body plethysmography"
    equipment_required:
      - "Whole-body plethysmograph"
      - "Invasive pulmonary function test (PFT) system"

  - id: "PROTOCOL:li-he-001"
    protocol_type: StainingProtocol
    name: "Hematoxylin-eosin staining and histomorphometry of rat lung"
    description: "Lung tissues collected at week 17 and stained with hematoxylin-eosin. Light microscopy scored interalveolar septa thickening, inflammatory cell infiltration, airway lumen narrowing and goblet cell hyperplasia in the airway epithelium. Histomorphometry reported mean linear intercept (MLI), mean alveolar number (MAN) and a total lung injury score. n = 6-8 per group."
    staining_type: "hematoxylin-eosin (H&E)"
    detection_method: "light microscopy with histomorphometric image analysis"
    equipment_required:
      - "Microtome"
      - "Light microscope"

  - id: "PROTOCOL:li-redoxkit-001"
    protocol_type: MolecularAssayProtocol
    name: "Colorimetric kit assays for MDA, T-SOD and GSH-Px"
    description: "Malondialdehyde (MDA), total superoxide dismutase (T-SOD) and glutathione peroxidase (GSH-Px) determined in rat serum and bronchoalveolar lavage fluid, and in Beas-2B lysates, with matched commercial kits according to the manufacturer's protocol (Nanjing Jiancheng Co., Jiangsu, China)."
    detection_method: "colorimetric assay kits (Nanjing Jiancheng)"
    equipment_required:
      - "Microplate reader"
      - "MDA / T-SOD / GSH-Px assay kits (Nanjing Jiancheng Co.)"

  - id: "PROTOCOL:li-dcfhda-001"
    protocol_type: ImagingProtocol
    name: "DCFH-DA immunofluorescence detection of intracellular ROS"
    description: "Intracellular reactive oxygen species detected with a 2',7'-dichlorofluorescein-diacetate (DCFH-DA) probe in Beas-2B cells (scale bar 100 um) and in primary mouse tracheal epithelial cells (scale bar 200 um); results reported as ROS fluorescence intensity."
    fluorescent_labeling: "2',7'-dichlorofluorescein-diacetate (DCFH-DA)"
    fluorescent_tracer: "DCFH-DA"
    equipment_required:
      - "Fluorescence microscope"
      - "DCFH-DA probe"

  - id: "PROTOCOL:li-qpcr-001"
    protocol_type: MolecularAssayProtocol
    name: "Quantitative real-time PCR for FOXO3a, SOD2, CAT and miR-155-5p"
    description: "Total RNA isolated with TRIZOL from lung tissues or cultured cells, reverse transcribed with a high capacity cDNA reverse transcription kit, and quantified on a 7500 real-time PCR system with SYBR Green Master Mix. Relative expression analysed by the 2^-ddCT method. miR-155-5p normalized to U6 snRNA; FOXO3a, SOD2 and CAT mRNA normalized to GAPDH."
    detection_method: "SYBR Green quantitative real-time PCR (7500 real-time PCR system)"
    normalization_method: "2^-ddCT relative quantification"
    reference_gene: "GAPDH (mRNA targets); U6 snRNA (miR-155-5p)"
    primer_sequences:
      - "Rat CAT Forward: TCACCTGAAGGACCCTGACA"
      - "Rat CAT Reverse: TCCATCTGGAATCCCTCGGT"
      - "Rat SOD2 Forward: AGGGCGTCATTCACTTCGAG"
      - "Rat SOD2 Reverse: CCTCTCTTCATCCGCTGGAC"
      - "Rat FOXO3a Forward: CTACGCTGACCTGATCACCC"
      - "Rat FOXO3a Reverse: TTCGTTCTGAACCCGCATGA"
      - "Human CAT Forward: TGGAGCTGGTAACCCAGTAGG"
      - "Human CAT Reverse: CCTTTGCCTTGGAGTATTTGGTA"
      - "Human SOD2 Forward: GGTGGGCCAAAGGATGAAGAG"
      - "Human SOD2 Reverse: CCACAAGCCAAACGACTTCC"
      - "Human miR-155-5p Forward: AACACGCTTAATGCTAATCGTGA"
      - "Human miR-155-5p Reverse: GTCGTATCCAGTGCAGGGT"

  - id: "PROTOCOL:li-wb-001"
    protocol_type: MolecularAssayProtocol
    name: "Western blotting for Nrf2, HO-1, FOXO3a and SOD2"
    description: "Protein extraction, SDS-PAGE and probing with Nrf2 (Proteintech 16396-1-AP), HO-1 (GeneTex GTX101147), FOXO3a (GeneTex GTX100277) and SOD2 (GeneTex GTX116093) antibodies, all at 1:1000. GAPDH used as internal control."
    detection_method: "chemiluminescent immunoblot"
    normalization_method: "GAPDH loading control"
    antibodies_used:
      - "Nrf2 (Proteintech 16396-1-AP, 1:1000)"
      - "HO-1 (GeneTex GTX101147, 1:1000)"
      - "FOXO3a (GeneTex GTX100277, 1:1000)"
      - "SOD2 (GeneTex GTX116093, 1:1000)"
    equipment_required:
      - "SDS-PAGE apparatus"
      - "Chemiluminescence imaging system"

  - id: "PROTOCOL:li-transfect-001"
    protocol_type: MolecularAssayProtocol
    name: "Lipofectamine transfection of miR-155 mimic and pcDNA-FOXO3a"
    description: "Beas-2B cells seeded in six-well plates at 60-70% confluence in serum-free medium and transfected with pcDNA-FOXO3a plasmid (14 ug), miR-155 mimic (50 nM) or the matched negative controls (Guangzhou RiboBio) complexed with Lipofectamine 2000. After 24 h the cells were used for ECC-BYF treatment and PM2.5 exposure."
    detection_method: "Lipofectamine 2000 transient transfection"
    equipment_required:
      - "Lipofectamine 2000 (Invitrogen)"
      - "miR-155 mimic and pcDNA-FOXO3a plasmid (Guangzhou RiboBio)"

# =============================================================================
# LUNG FUNCTION ASSAYS - In vivo, PM2.5-aggravated COPD rats
# =============================================================================

lung_function_assays:
  - id: "LF:li-rat-pm25-copd"
    name: "Pulmonary function in PM2.5-aggravated COPD rats with ECC-BYF or NAC"
    description: "Noninvasive (VT, PEF, EF50) and invasive (FVC, FEV0.3, FEV0.3/FVC) pulmonary function in four rat groups. VT, PEF and EF50 decreased continuously from week 1 to week 16 in the model group; all six parameters were significantly lower in the model group than in the healthy control at week 17 (P < 0.01), indicating irreversible airflow limitation. ECC-BYF and NAC administration significantly increased all six parameters relative to the model group (P < 0.01). n = 8 per group. Values are reported only in Fig. 1b-g, so no numeric measurements are recorded here."
    reference_dataset: "no reference dataset - rat model, group comparisons only"
    evidence:
      - reference: "PMID:34773846"
        reference_title: "Effective-component compatibility of Bufei Yishen formula protects COPD rats against PM2.5-induced oxidative stress via miR-155/FOXO3a pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "As expected, PM2.5-aggravated COPD rats showed a reduction of lung function, persistent lung inflammation, and remodeling of lung tissue."
        explanation: "States the model-group result this assay records: lung function fell in PM2.5-aggravated COPD rats relative to healthy controls."
      - reference: "PMID:34773846"
        reference_title: "Effective-component compatibility of Bufei Yishen formula protects COPD rats against PM2.5-induced oxidative stress via miR-155/FOXO3a pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In comparison, ECC-BYF administration significantly enhanced lung function, alleviated alveolar destruction, inflammatory cell infiltration, mucus hypersecretion, and collagen deposition, along with diminishing inflammatory cytokine production and oxidative stress."
        explanation: "States the treated-group result this assay records: ECC-BYF significantly improved lung function relative to the PM2.5-aggravated COPD model group."
    has_exposure_condition:
      - id: "EXPOSURE:li-rat-filtered-air"
        name: "Filtered air (PM2.5 < 10 ug/m3) with distilled water gavage, healthy control rats"
        exposure_duration:
          value: "8"
          unit:
            id: "UO:0000034"
            name: "week"
      - id: "EXPOSURE:li-rat-pm25-8wk"
        name: "Concentrated ambient PM2.5, 4 h/day for 8 weeks, in rats with pre-existing COPD"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
        exposure_concentration:
          value: "739.97"
          unit:
            id: "UCUM:ug/m3"
            name: "microgram per cubic meter"
        exposure_duration:
          value: "8"
          unit:
            id: "UO:0000034"
            name: "week"
      - id: "EXPOSURE:li-rat-eccbyf-pm25-8wk"
        name: "ECC-BYF 5.5 mg/kg/d by gavage before daily PM2.5 exposure, 8 weeks"
        exposure_concentration:
          value: "5.5"
          unit:
            id: "UO:0000311"
            name: "milligram per kilogram per day"
        exposure_duration:
          value: "8"
          unit:
            id: "UO:0000034"
            name: "week"
      - id: "EXPOSURE:li-rat-nac-pm25-8wk"
        name: "N-acetylcysteine 108 mg/kg/d by gavage before daily PM2.5 exposure, 8 weeks"
        exposure_agent:
          id: "CHEBI:28939"
          name: "N-acetyl-L-cysteine"
        exposure_concentration:
          value: "108"
          unit:
            id: "UO:0000311"
            name: "milligram per kilogram per day"
        exposure_duration:
          value: "8"
          unit:
            id: "UO:0000034"
            name: "week"
    has_specified_output:
      - id: "LF:li-rat-pm25-copd-output-control"
        name: "Healthy control rats - pulmonary function"
        description: "Reference group. VT, PEF, EF50, FVC, FEV0.3 and FEV0.3/FVC all higher than the model group (P < 0.01). Figure-only values; none recorded."
        experimental_group: control
        measured_under: "EXPOSURE:li-rat-filtered-air"
      - id: "LF:li-rat-pm25-copd-output-model"
        name: "PM2.5-aggravated COPD rats - pulmonary function"
        description: "All six parameters significantly decreased versus healthy control (P < 0.01). Figure-only values; none recorded."
        experimental_group: treated
        measured_under: "EXPOSURE:li-rat-pm25-8wk"
      - id: "LF:li-rat-pm25-copd-output-eccbyf"
        name: "ECC-BYF-treated PM2.5-aggravated COPD rats - pulmonary function"
        description: "All six parameters significantly increased versus the model group (P < 0.01). Figure-only values; none recorded."
        experimental_group: treated
        measured_under: "EXPOSURE:li-rat-eccbyf-pm25-8wk"
      - id: "LF:li-rat-pm25-copd-output-nac"
        name: "NAC-treated PM2.5-aggravated COPD rats - pulmonary function"
        description: "Positive-comparator group; FVC, FEV0.3 and FEV0.3/FVC increased versus the model group. Figure-only values; none recorded."
        experimental_group: treated
        measured_under: "EXPOSURE:li-rat-nac-pm25-8wk"
    assay_date: "2021-01-01"
    informs_on_key_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    study_subject:
      # The whole animal: lung function is measured on the living rat, with
      # no specimen taken. The per-specimen subjects (-lung, -serum, -balf)
      # and this one all declare the same cohort via member_of_cohort (#132).
      subject_type: InVivoSubject
      id: "SUBJECT:li-rat-copd-pm25"
      name: "PM2.5-aggravated COPD Sprague-Dawley rat"
      model_species:
        id: "NCBITaxon:10116"
        name: "Rattus norvegicus"
      age:
        # The paper states a 6-9 week range, not a single age; recorded as
        # bounds with no value rather than picking a midpoint.
        variability:
          variability_type: range
          lower_bound: "6"
          upper_bound: "9"
        unit:
          id: "UO:0000034"
          name: "week"
      sex: "male"
      disease_state: "cigarette smoke plus Klebsiella pneumoniae-induced COPD, aggravated by concentrated ambient PM2.5"
      subject_characteristics: "32 male SD rats, 6-9 weeks old, randomized into four groups (n = 8): Control, Model (PM2.5-aggravated COPD), ECC-BYF, NAC. COPD induced over 8 weeks by twice-daily cigarette smoke inhalation (30 min each) plus intranasal Klebsiella pneumoniae every five days, then 8 weeks of whole-body concentrated PM2.5 exposure."
      clinical_context: "Pulmonary function measured every fourth week to week 16 (noninvasive) and at week 17 (invasive)"
      member_of_cohort: "SUBJECT:li-rat-copd-cohort"
    follows_protocols:
      - id: "PROTOCOL:li-pft-001"
        name: "Noninvasive and invasive pulmonary function testing in rats"

