# =============================================================================
# KEY EVENT RELATIONSHIPS - the miR-155/FOXO3a axis this paper reports
# =============================================================================

key_event_relationships:
  - id: "KER:li-mir155-to-foxo3a"
    name: "Increased miR-155 expression leads to decreased FOXO3a expression"
    description: "miR-155 binds the 3'-UTR of FOXO3a mRNA and suppresses it. Transfecting a miR-155 mimic into Beas-2B significantly decreased FOXO3a protein, and ECC-BYF raised FOXO3a while lowering miR-155 dose-dependently."
    upstream_event:
      id: "KE:ke-increased-mir155"
      name: "Increased miR-155 expression"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-decreased-foxo3a"
      name: "Decreased FOXO3a expression"
      biological_action: decreased
      level_of_biological_organization: molecular
    relationship_type: "directly leads to"
    evidence_support: strong
    evidence:
      - reference: "PMID:34773846"
        reference_title: "Effective-component compatibility of Bufei Yishen formula protects COPD rats against PM2.5-induced oxidative stress via miR-155/FOXO3a pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In vitro transfection of miR-155 mimic into Beas-2B significantly decreased FOXO3a protein expression, accompanied by the reduced superoxide dismutase 2 (SOD2) and catalase (CAT) expressions, thus eliminating the protective effect of ECC-BYF on PM2.5-evoked oxidative stress."
        explanation: "A gain-of-function experiment: raising miR-155 alone lowered FOXO3a protein, which is the directional link this relationship asserts."

  - id: "KER:li-foxo3a-to-oxidative-stress"
    name: "Decreased FOXO3a expression leads to increased oxidative stress"
    description: "FOXO3a drives transcription of the antioxidant enzymes SOD2 and CAT. Lowering FOXO3a with a miR-155 mimic reduced SOD2 and CAT and abolished the antioxidant protection of ECC-BYF, while FOXO3a overexpression partially restored it."
    upstream_event:
      id: "KE:ke-decreased-foxo3a"
      name: "Decreased FOXO3a expression"
      biological_action: decreased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    relationship_type: "directly leads to"
    evidence_support: strong
    evidence:
      - reference: "PMID:34773846"
        reference_title: "Effective-component compatibility of Bufei Yishen formula protects COPD rats against PM2.5-induced oxidative stress via miR-155/FOXO3a pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Nonethless, FOXO3a overexpression could partially restore the antioxidative effect of ECC-BYF."
        explanation: "A rescue experiment: restoring FOXO3a restored antioxidant capacity, which is the causal direction this relationship asserts."

  - id: "KER:li-oxidative-stress-to-lung-function"
    name: "Increased oxidative stress leads to decreased lung function"
    description: "In PM2.5-aggravated COPD rats the oxidant/antioxidant imbalance in serum and BALF accompanied reduced lung function and lung tissue remodeling, and treatments that suppressed oxidative stress (ECC-BYF, NAC) also improved lung function."
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    relationship_type: "indirectly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:34773846"
        reference_title: "Effective-component compatibility of Bufei Yishen formula protects COPD rats against PM2.5-induced oxidative stress via miR-155/FOXO3a pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In comparison, ECC-BYF administration significantly enhanced lung function, alleviated alveolar destruction, inflammatory cell infiltration, mucus hypersecretion, and collagen deposition, along with diminishing inflammatory cytokine production and oxidative stress."
        explanation: "The same intervention both diminished oxidative stress and enhanced lung function in the same animals, which is the correlative in vivo support this relationship rests on."
