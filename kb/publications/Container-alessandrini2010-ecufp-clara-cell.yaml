gene_expression_assays:
  # Serum CC16 protein rises after EC-UFP inhalation
  - id: "GE:alessandrini-serum-cc16-ufp"
    name: "Serum CC16 protein - EC-UFP exposed mice"
    description: "CC16 protein in serum by automated latex immunoassay. In contrast to BALF, serum CC16 rose significantly after EC-UFP inhalation in both non sensitized and sensitized mice and was still raised one week later; NAC reduced serum CC16 in sensitized EC-UFP-exposed mice at the 7-day time point. Figure-only data (Fig. 2a, bottom panel)."
    target_gene: "NCBIGene:22287"
    gene_expression_method: "automated latex immunoassay (serum protein)"
    normalization_reference: "untreated baseline control mice"
    evidence:
