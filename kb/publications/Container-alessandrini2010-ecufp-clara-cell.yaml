# =============================================================================
# Alessandrini et al. (2010) - Effects of ultrafine particles-induced oxidative
# stress on Clara cells in allergic lung inflammation
# =============================================================================
#
# Source: Part Fibre Toxicol. 2010;7:11
# DOI: 10.1186/1743-8977-7-11
#
# Study design (in vivo only):
#   - Balb/c mice (five to seven weeks old), OVA/alum sensitization on days
#     0, 7, 14, 28, 42, 56; aerosol OVA challenge on day 70
#   - Elemental carbon ultrafine particles (EC-UFP) generated by spark
#     discharge; 24 h inhalation at 507 ug/m3 immediately before challenge
#   - N-acetylcysteine (NAC) 250 mg/kg i.p., twice (before and mid exposure)
#   - Groups: NS/UFP, NS/NAC/UFP, S/UFP, S/NAC/UFP, S/OVA, S/NAC/OVA,
#     S/UFP/OVA, S/NAC/UFP/OVA, plus untreated baseline controls
#   - Readouts: CC16 in BALF and serum (latex immunoassay), BALF total protein
#     and cytokines, CC16 and TNF-alpha mRNA in lung homogenate (TaqMan
#     RT-PCR, 18S reference), PAS morphometry of small and large airways,
#     TEM/SEM of bronchiolar epithelium, whole-body plethysmography (PenH)
#
# Key findings:
#   - EC-UFP inhalation decreased BALF CC16 and increased serum CC16
#   - EC-UFP increased CC16 and TNF-alpha mRNA in lung homogenate
#   - EC-UFP before allergen challenge gave the largest changes in BALF and
#     serum CC16, BALF total protein and TNF-alpha expression
#   - Goblet cell metaplasia after challenge alone was significant in the
#     large airways; EC-UFP added metaplasia in the small airways
#   - NAC reduced the functional and morphological alterations
#
# NOTE ON VALUES: this paper reports its outcome data in figures (Fig. 2-7)
# and gives no numeric outcome values in the text, so no measurement values
# are recorded here. Direction of change is carried by the key event blocks
# and by the quoted evidence on each assay.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:20420656"
  reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
  doi: "10.1186/1743-8977-7-11"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:alessandrini-ecufp-exposure-001"
    name: "EC-UFP generation and 24 h whole-body inhalation exposure"
    description: "Elemental carbon ultrafine particles generated by electric spark discharge (model GFG1000, Palas GmbH, Karlsruhe) from agglomerated carbon particles. Count median diameter 51.7 nm (geometric SD 1.54), average mass median diameter 84.7 nm, organic carbon content estimated at less than 5%. All exposures ran 24 h at a mass concentration of 507 ug/m3, corresponding to an average particle number concentration of 9.3 x 10^6/cm3."
    equipment_required:
      - "Spark discharge generator (GFG1000, Palas GmbH, Karlsruhe, Germany)"
      - "Inhalation exposure chamber"

  - id: "PROTOCOL:alessandrini-bal-001"
    name: "Bronchoalveolar lavage and BALF analysis"
    description: "Airways lavaged five times with 0.8 ml PBS. Cell-free BALF assayed in duplicate for total protein (Coomassie Protein Assay, Pierce) and for IL-5, IFN-gamma and IL-13 by two-site ELISA (BD Biosciences for IL-5 and IFN-gamma, BioSource for IL-13). BAL cell viability and yield by trypan blue exclusion; differential count of 400 cells per sample on Diff-Quick stained cytospins."
    equipment_required:
      - "Hemocytometer"
      - "Cytospin centrifuge"
      - "ELISA plate reader"

  - id: "PROTOCOL:alessandrini-cc16-latex-001"
    name: "Automated latex immunoassay for CC16 in BALF and serum"
    description: "Cell-free BALF and serum aliquots assayed in duplicate for CC16 by an automated latex immunoassay using a polyclonal rabbit antibody raised against rat CC16, applicable to both rat and mouse CC16 analysis."
    equipment_required:
      - "Automated latex immunoassay analyser"

  - id: "PROTOCOL:alessandrini-qpcr-001"
    name: "Real-time RT-PCR for CC16 and TNF-alpha in lung homogenate"
    description: "Lungs retrieved 1 day after EC-UFP exposure/allergen challenge. Total RNA isolated from whole lung with the RNeasy Mini kit (Qiagen); first strand cDNA with the iScript kit (BioRad). TaqMan Gene Expression Assays (CC16: Mm01230908_m1; TNF-alpha: Mm00443258_m1; 18S: Hs99999901_s1) on an ABIprism7000. Expression normalised to 18S and to the mean of the untreated group by the delta-delta-CT method."
    equipment_required:
      - "ABIprism7000 Sequence Detection System (Applied Biosystems)"
      - "RNeasy Mini kit (Qiagen)"
      - "iScript cDNA synthesis kit (BioRad)"

  - id: "PROTOCOL:alessandrini-pas-001"
    name: "PAS staining and morphometrical analysis of mucus"
    description: "Left lobe fixed in 10% buffered formalin, paraffin embedded, 3.5 um sections stained with hematoxylin-eosin and periodic acid Schiff. Volume density of PAS positive material measured with a double square lattice test system (E80) and Optimas software in cross sections of small (circumference <= 800 um) and large (circumference > 800 um) airways. Data expressed as percentage of PAS positive material per total epithelial cells."
    equipment_required:
      - "Microtome"
      - "Light microscope with Optimas image analysis"

  - id: "PROTOCOL:alessandrini-em-001"
    name: "Transmission and scanning electron microscopy of bronchiolar epithelium"
    description: "Lungs fixed by intratracheal perfusion with 2.5% glutaraldehyde in 0.1 M cacodylate buffer (pH 7.4), n = 2 per time point per group, postfixed in 1% osmium tetroxide. TEM: EMbed 812 embedding, ultrathin sections double-stained with uranyl acetate and lead citrate, JEOL 1210 at 80 kV. SEM: critical point drying, 10 nm gold sputter coating, JEOL 6300 at 15 kV."
    equipment_required:
      - "JEOL 1210 transmission electron microscope"
      - "JEOL 6300 scanning electron microscope"
      - "Critical point dryer and gold sputter coater"

  - id: "PROTOCOL:alessandrini-plethysmography-001"
    name: "Whole body plethysmography with methacholine challenge"
    description: "Lung function tests 24 h after allergen challenge in unrestrained animals using whole body plethysmography (Buxco Electronics). Enhanced pause (PenH) before and after methacholine used as index of airway hyperresponsiveness. Methacholine doses: 10 mg/ml nebulized for 1, 2 and 4 min (M1-M3), then 40 mg/ml for 2 and 4 min (M4-M5), with a 3 min recording interval after each level; the mean PenH of the 2nd and 3rd min quantified AHR."
    equipment_required:
      - "Buxco whole body plethysmograph"
      - "Methacholine nebulizer"

# =============================================================================
# BALF ASSAYS - CC16, total protein and inflammation in bronchoalveolar lavage
# =============================================================================

balf_sputum_assays:
  # BALF CC16 falls one day after EC-UFP inhalation, with or without sensitization
  - id: "BALF:alessandrini-cc16-ufp-1d"
    name: "BALF CC16 - EC-UFP exposed mice, 1 day"
    description: "CC16 concentration in cell-free BALF one day after 24 h EC-UFP inhalation in non sensitized (NS/UFP) and sensitized (S/UFP) mice, measured by automated latex immunoassay. Significant decrease versus untreated controls; the decrease was abrogated by NAC treatment (NS/NAC/UFP, S/NAC/UFP), and one week after inhalation BALF CC16 almost reached the control level. Values are reported only in Fig. 2a (upper panel); n = 4-7 per time point."
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Non sensitized and sensitized mice exposed to EC-UFP for 24 h (NS/UFP , S/UFP) showed a significant decrease in CC16 in BALF at 1-day time point (Fig. 2a, upper panel)."
        explanation: "States the measured direction of change this assay records: BALF CC16 fell significantly one day after EC-UFP inhalation in both non sensitized and sensitized mice."
    has_specified_output:
      id: "BALF:alessandrini-cc16-ufp-1d-output"
      name: "BALF CC16 concentration after EC-UFP, 1 day"
      description: "Decreased BALF CC16 concentration (mg/l); figure-only data, no numeric value reported in the text."
    has_exposure_condition:
      - id: "EXPOSURE:alessandrini-ecufp-507ug-24h"
        name: "EC-UFP 507 ug/m3 for 24 hours"
        exposure_agent:
          id: "ENVO:01000416"
          name: "ultrafine respirable suspended particulate matter"
        exposure_concentration:
          value: "507"
          unit:
            id: "UCUM:ug/m3"
            name: "microgram per cubic meter"
