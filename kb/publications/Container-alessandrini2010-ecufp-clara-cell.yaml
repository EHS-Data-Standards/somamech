goblet_cell_assays:
  # Allergen challenge alone: metaplasia significant in the large airways
  - id: "GCM:alessandrini-pas-s-ova"
    name: "PAS morphometry - sensitized and challenged mice, filtered air"
    description: "Volume density of PAS positive material in small (circumference <= 800 um) and large (circumference > 800 um) airways, 7 days after allergen challenge, expressed as percentage of PAS positive material per total epithelial cells (n = 6-12 per group). Allergen challenge alone had a significant effect on goblet cell metaplasia and mucus hypersecretion, which the morphometrical analysis localised to the large airways. Figure-only data (Fig. 5)."
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In sensitized animals allergen challenge alone had a significant effect on goblet cell metaplasia and mucus hypersecretion (Fig. 5a, b, d)."
        explanation: "States the significant goblet cell metaplasia and mucus hypersecretion after allergen challenge alone that this assay records."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In the morphometrical analysis of PAS positive material we showed that this phenomenon was significant only in the large airways."
        explanation: "Locates the challenge-only metaplasia in the large airways, the airway compartment this assay distinguishes."
    has_specified_output:
      id: "GCM:alessandrini-pas-s-ova-output"
      name: "Volume density of PAS positive material, S/OVA"
      description: "Increased volume density of PAS positive material in large airways; figure-only data, no numeric value reported in the text."
