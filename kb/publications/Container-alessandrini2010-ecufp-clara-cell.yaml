lung_function_assays:
  - id: "LF:alessandrini-ahr-ufp-ova"
    name: "Airway hyperresponsiveness (PenH) - EC-UFP before OVA challenge"
    description: "Enhanced pause (PenH) measured by whole body plethysmography 24 h after OVA challenge in unrestrained animals (n = 5-7). PenH rose significantly with increasing methacholine concentrations in sensitized animals exposed to EC-UFP before challenge compared with untreated animals, with a close to significant increase versus sensitized and challenged mice exposed to filtered air; NAC reduced the EC-UFP-dependent increase. Data in additional file 1; no numeric PenH values in the main text."
    evidence:
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "NAC reduced EC-UFP-induced airway hyperresponsiveness"
        explanation: "States both that EC-UFP induced airway hyperresponsiveness and that NAC reduced it, which is the result this assay records."
