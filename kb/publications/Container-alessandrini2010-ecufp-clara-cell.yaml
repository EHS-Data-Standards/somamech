      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In sensitized mice, inhalation of EC-UFP prior to OVA challenge caused most significant alterations of BALF and serum CC16 concentration, BALF total protein and TNF-alpha relative expression compared to relevant controls; their Clara cells displayed the strongest morphological alterations and strongest goblet cell metaplasia occurred in the small airways."
        explanation: "Identifies the S/UFP/OVA group as showing the largest change in BALF CC16 concentration, which is what this assay records."
      - reference: "PMID:20420656"
        reference_title: "Effects of ultrafine particles-induced oxidative stress on Clara cells in allergic lung inflammation."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "NAC strongly reduced both functional and morphological alterations of Clara cells."
        explanation: "Supports the recorded NAC effect: the antioxidant reduced the EC-UFP-driven functional alterations of Clara cells, including the BALF CC16 changes."
