        evidence_source: MODEL_ORGANISM
        snippet: "In contrast to BALF CC16 concentrations, serum CC16 concentrations increased significantly following exposure to EC-UFP in both non sensitized and sensitized mice (Fig. 2a, bottom panel)."
        explanation: "States the increase in serum CC16 after EC-UFP inhalation that this assay records, and contrasts it with the fall in BALF CC16."
