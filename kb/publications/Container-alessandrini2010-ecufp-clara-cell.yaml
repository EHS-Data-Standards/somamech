    name: "BALF CC16 - sensitized mice, EC-UFP before OVA challenge"
    description: "CC16 in BALF of sensitized mice given 24 h EC-UFP inhalation immediately before aerosol OVA challenge (S/UFP/OVA). An initial significant reduction was followed by a significant increase in BALF CC16 at the 7-day time point compared with untreated animals, NS/UFP, S/UFP and S/OVA; NAC treatment significantly reduced this increase (S/NAC/UFP/OVA). Figure-only data (Fig. 2b, upper panel)."
