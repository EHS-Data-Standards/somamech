# =============================================================================
# OXIDATIVE STRESS ASSAYS — the two breath-condensate markers.
#
# Split into two assays because they are two different protocols with
# different sensitivities and they gave OPPOSITE answers: TBARS tracked
# SO2, NO2 and PM2.5, while 8-isoprostane responded only to same-day SO2.
# That contrast is the paper's own methodological conclusion, so collapsing
# them into one assay would erase it.
#
# Neither carries an output record: the absolute TBARS and 8-isoprostane
# levels are in Tables 1 and 4, which are not in the retrievable full text.
# =============================================================================

oxidative_stress_assays:
  - id: "OX:liu2009-tbars-ebc"
    name: "Thiobarbituric acid reactive substances in exhaled breath condensate of asthmatic children"
    description: "TBARS in exhaled breath condensate, measured weekly in duplicate by fluorescence in the same panel of 182 asthmatic children (616 breath samples), analysed against daily ambient SO2, NO2, O3 and PM2.5 in mixed-effects models with log-transformed outcomes. TBARS rose significantly with SO2, NO2 and PM2.5 but not with O3, and the associations persisted for at least 3 days, with the headline estimates expressed per interquartile-range increase in the 3-day average. Two-pollutant models did not markedly change the TBARS results, so each pollutant's estimate was independent of the others. Among children not taking inhaled corticosteroids the TBARS estimates were significant, and the product term for SO2 and inhaled corticosteroid use was positively associated with TBARS (p = 0.04). The authors argue that TBARS, being derived from oxidative degradation of a broader range of substances than 8-isoprostane, may be the more sensitive breath-condensate biomarker of air-pollution-related oxidative stress in asthmatic children, especially for acute exposures. Because more than 99% of samples gave a value above zero and most were above the 0.02 uM detection limit, values below the detection limit were given no special treatment. No absolute TBARS value is recorded because Tables 1 and 4 are not in the retrievable full text."
    ros_probe_type: "thiobarbituric acid reactive substances (TBARS) by fluorescence, with malonaldehyde bis-(dimethyl acetal) as the standard"
    evidence:
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Once a week we measured spirometry and fractional exhaled nitric oxide (FeNO), and determined thiobarbituric acid reactive substances (TBARS) and 8-isoprostane--two oxidative stress markers--and interleukin-6 (IL-6) in breath condensate."
        explanation: "Names TBARS and 8-isoprostane as the paper's two oxidative stress markers in breath condensate, which is why these two assays inform on the increased-oxidative-stress key event."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Thiobarbituric acid reactive substances (TBARS) were determined in duplicate by a fluorescence method adapted from Yagi (1982)."
        explanation: "States the TBARS detection method and duplicate replication recorded on this assay's protocol."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The detection limit was 0.02 μM (three times the standard deviation above the blank). The within-run coefficient of variation was 8%."
        explanation: "Gives the TBARS detection limit and within-run coefficient of variation recorded as the protocol's quality_control_criteria."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Exhaled breath condensate was collected using an RTube (Respiratory Research Inc., Charlottesville, VA, USA). Participants sat and breathed at tidal volumes orally into a mouthpiece attached to a cold condenser, for 10 min. Approximately 1 mL of breath condensate was collected."
        explanation: "States the breath condensate collection method shared by both oxidative stress assays, recorded as the sub-protocol on each."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "SO2, NO2, and PM(2.5) were associated with increases in TBARS, with changes being 36.2% (95% CI, 15.7 to 57.2), 21.8% (95% CI, 8.2 to 36.0), and 24.8% (95% CI, 10.8 to 39.4), respectively."
        explanation: "States the three headline TBARS estimates recorded as response comparisons, with their 95% confidence intervals, per interquartile-range increase in the 3-day average of each pollutant."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "TBARS was significantly positively associated with SO2, NO2, and PM2.5, but not with O3. The associations for TBARS persisted for at least 3 days."
        explanation: "Confirms the direction and significance of the three positive TBARS associations and states the ozone null result recorded as the fourth TBARS comparison, as well as the 3-day persistence that justifies the 3-day averaging window."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The level of reactive oxygen species in the airways can be determined by assaying concentrations of oxidative stress markers in breath condensate (Horvath et al. 2005)."
        explanation: "States the premise that makes a breath-condensate marker a read-out for airway oxidative stress, which is why this assay informs on the increased-oxidative-stress key event."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "TBARS are a group of low-molecular-weight chemicals that are formed during the decomposition of lipid peroxidation products (Halliwell and Chirico 1993), and thus are often used as an index of lipid peroxidation and oxidative stress (Kodavanti et al. 2000; Rhoden et al. 2004; Walter et al. 2004)."
        explanation: "Supports recording TBARS against the lipid_peroxidation measurement slot: the paper itself identifies TBARS as an index of lipid peroxidation."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Because TBARS are derived from oxidative degradation of a broader range of biological substances including lipids and sugars than is 8-isoprostane (Halliwell and Gutteridge 1981; Janero 1990), and because we observed an increase in TBARS but not 8-isoprostane in breath samples in relation to elevated air pollutants, it appears that TBARS may be a more sensitive biomarker than 8-iso-prostane in breath condensate as a useful tool for investigating air pollution-related oxidative stress among asthmatic children, especially for acute exposures."
        explanation: "States the authors' methodological conclusion that TBARS is the more sensitive of the two markers, which is why the two breath-condensate markers are kept as separate assays rather than merged."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Because > 99% of the samples gave a value > 0 for TBARS and 8-isoprostane, and most of them were above the detection limit, data points below the detection limit were not given special treatment."
        explanation: "States how values below the detection limit were handled in both breath-condensate assays, which bears on how the percent-change estimates should be read."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "TBARS in breath condensate may be a useful tool for investigating air pollution-related oxidative stress among asthmatic children."
        explanation: "States the authors' concluding endorsement of the marker this assay records."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Air pollution may increase airway oxidative stress and decrease small airway function of asthmatic children. Inhaled corticosteroids may reduce oxidative stress and improve airway function."
        explanation: "States the paper's overall conclusion, which links this assay to the increased-oxidative-stress key event and underpins the key event relationship recorded below."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
