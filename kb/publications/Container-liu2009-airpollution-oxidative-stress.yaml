  # ---------------------------------------------------------------------------
  # FeNO — a separate assay from the spirometry above, because
  # informs_on_key_event is single-valued and FeNO is the paper's airway
  # INFLAMMATION marker, not a lung function parameter. The feno slot lives on
  # LungFunctionOutput, which is why this is a lung_function_assay.
  # ---------------------------------------------------------------------------

  - id: "LF:liu2009-feno-cohort"
    name: "Weekly fractional exhaled nitric oxide in 182 asthmatic children under ambient air pollution"
    description: "Weekly single-breath on-line FeNO at 0.05 L/sec in the same panel of 182 asthmatic children, giving 672 FeNO test results, analysed against daily ambient SO2, NO2, O3 and PM2.5 in the same mixed-effects models. FeNO data were log-transformed to fit a normal distribution. FeNO trended positive against SO2, NO2 and PM2.5 without reaching significance, and had a statistically significant NEGATIVE association with O3 — a result the authors call counterintuitive, note survived adjustment for co-pollutants and study period, and leave unexplained. Including two pollutants in the models did not markedly change the FeNO results, so the per-pollutant estimates were independent of co-pollutants. Risk estimates for FeNO were not very different between children taking and not taking inhaled corticosteroids (reported as data not shown). The authors offer three readings of the null inflammation result: insufficient sample size, inflammation in the lower airways not being captured by FeNO at a flow rate of 0.05 L/sec, or a baseline state of airway inflammation in these asthmatic children that overwhelmed the effect of air pollution at the low exposure concentrations studied. IL-6 was also measured in breath condensate by ELISA (R&D Systems, Minneapolis, MN, USA) in duplicate with a detection limit of 0.48 pg/mL, but only 2 of 616 samples had detectable levels and no further analysis was conducted, so no IL-6 assay is recorded in this file. No absolute FeNO value is recorded because Tables 1 and 4 are not in the retrievable full text."
    evidence:
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Single-breath on-line measures of FeNO were carried out according to American Thoracic Society and European Respiratory Society Guidelines (American Thoracic Society 2005) using an Eco Physics CLD AL MED chemiluminescence analyzer (Eco Medics AG, Duernten, Switzerland)."
        explanation: "States the FeNO standard and instrument recorded on this assay's protocol."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The test was repeated a maximum of eight times in an attempt to obtain at least two acceptable plateau FeNO values within 10%. The value assigned to the subject was the mean of the two values."
        explanation: "States the FeNO acceptability criteria recorded as the protocol's quality_control_criteria."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In recent years, some researchers have used fractional exhaled nitric oxide (FeNO) to investigate the relationship between exposure to air pollutants and airway inflammation (Delfino et al. 2006; Mar et al. 2005)."
        explanation: "Supports treating FeNO as this paper's airway inflammation marker, which is why this assay informs on the airway inflammation key event rather than on decreased lung function."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Data for FeNO, TBARS, and 8-isoprostane were log-transformed to fit a normal distribution."
        explanation: "States the log transformation applied to the FeNO, TBARS and 8-isoprostane end points before modelling, which is why their estimates are percent changes."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FeNO had a trend of positive associations with SO2, NO2, and PM2.5, but the associations were not statistically significant. FeNO had a statistically significant negative association with O3."
        explanation: "States all four FeNO comparisons recorded below: a non-significant positive trend against SO2, NO2 and PM2.5, and a significant negative association with O3."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FeNO, 8-isoprostane, and IL-6 were not associated with air pollutants."
        explanation: "The abstract's blanket null statement for FeNO, 8-isoprostane and IL-6. It is quoted here because it contradicts the Results section, which reports a significant negative FeNO-O3 association and a significant positive 8-isoprostane-SO2 association; the more specific Results statements are what the comparisons record, and the discrepancy is flagged in each affected comparison's description."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The negative association between O3 concentration and FeNO is counterintuitive, because laboratory studies have shown that O3 at high concentrations (200–400 ppb) caused inflammation in the airways of human subjects (Balmes et al. 1996; Frampton et al. 1997). In the present study, adjusting for co-pollutants and study periods in the models did not change the results. A sound interpretation for this result remains to be found at this point in time."
        explanation: "Records the authors' own assessment of the significant negative FeNO-O3 association: counterintuitive, robust to co-pollutant and study-period adjustment, and unexplained. This is why that comparison is recorded as decreased with the authors' caveat rather than read as an anti-inflammatory effect of ozone."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Unlike previously published studies (Delfino et al. 2006; Mar et al. 2005), in our study we did not find statistically significant adverse changes in inflammatory marker FeNO associated with air pollution, and the level of IL-6 in breath condensate was too low to be detectable."
        explanation: "States the overall null inflammation finding this assay records, and that IL-6 was below detection — the reason no IL-6 assay appears in this file."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "One interpretation for the results of inflammation markers was that we might need a larger sample size to detect significant changes in airway inflammation. Another possible explanation might be that the inflammation in lower airways of the children was not captured by FeNO measured at a flow rate of 0.05 L/sec"
        explanation: "Gives two of the three explanations the authors offer for the null inflammation result, both recorded in this assay's description."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Alternatively, this group of asthmatic children might have been in such a state of airway inflammation that it overwhelmed the effects of air pollution, particularly when exposure concentrations were lower than those in other studies (Delfino et al. 2006; Mar et al. 2005)."
        explanation: "Gives the third explanation the authors offer for the null inflammation result: pre-existing airway inflammation in an asthmatic cohort may have masked a pollution effect at these low exposure concentrations."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We determined the level of interleukin-6 (IL-6) using an ELISA kit from R&D Systems (Minneapolis, MN, USA). We conducted the ELISA assays in duplicate by following manufacturer’s instructions accompanying the kit. The detection limit was 0.48 pg/mL."
        explanation: "Documents the IL-6 ELISA described in this assay's description. No IL-6 assay is recorded in this file because the measurement yielded no analysable data."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In 616 breath samples, only 2 samples had detectable IL-6 levels. We therefore did not conduct further analysis on IL-6."
        explanation: "States why no IL-6 assay or output appears in this file: IL-6 was detectable in 2 of 616 breath samples and the authors ran no further analysis on it."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "For FeNO and TBARS, including two pollutants in models did not markedly change the regression results, suggesting that the results of each pollutant were independent of other pollutants."
        explanation: "Supports the description's statement that the FeNO and TBARS per-pollutant estimates were independent of co-pollutants, in contrast to the lung function estimates for SO2 and NO2."
    has_exposure_condition:
      - id: "COND:liu2009-ambient-air"
