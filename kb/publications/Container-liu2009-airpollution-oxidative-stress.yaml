        evidence_source: HUMAN_CLINICAL
        snippet: "Risk estimates appear to be larger in children not taking corticosteroids than in children taking corticosteroids."
        explanation: "States the direction of the corticosteroid effect modification that this assay's description records."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "For example, the product term for SO2 and ICS was positively associated with TBARS (p = 0.04), but negatively associated with FEV1 (p < 0.01), FEV25–75% (p = 0.02), and 8-isoprostane (p = 0.01), indicating that the use of ICS was a significant effect modifier."
        explanation: "Gives the interaction p-values that establish inhaled corticosteroid use as an effect modifier. Quoted as printed: the label 'FEV25–75%' appears nowhere else in the paper and is evidently a typographical error for FEF25-75%, which is noted rather than corrected."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In the present study only 37% of children used ICS, which could result in a reduced statistical power to detect associations with pollutants in this group."
        explanation: "Gives the proportion of children using inhaled corticosteroids (37%) recorded in this assay's description and in subject_characteristics, and the power limitation the authors attach to the stratified analysis."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
