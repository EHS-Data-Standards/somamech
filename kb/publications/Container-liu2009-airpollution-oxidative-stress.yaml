# =============================================================================
# Liu et al. (2009) — "Acute effects of air pollution on pulmonary function,
# airway inflammation, and oxidative stress in asthmatic children"
# =============================================================================
#
# Source: Environ Health Perspect (2009) — the journal and year the cache
#   entry's frontmatter records. Volume, issue and page numbers are not in the
#   retrievable text and are deliberately not stated here.
# DOI: 10.1289/ehp11813
# PMID: 19440509
#
# Study design (HUMAN PANEL STUDY — not in vitro, not an animal experiment):
#   - Longitudinal repeated-measures (panel) study of 182 asthmatic children
#     aged 9-14 from nonsmoking households in Windsor, Ontario, Canada,
#     followed for 4 weeks between October and December 2005. Children were
#     studied in two test periods: 11 October - 11 November (95 children) and
#     14 November - 9 December 2005 (87 children).
#   - Exposure: daily ambient SO2, NO2, O3 and PM2.5 from the National Air
#     Pollution Surveillance network of Environment Canada, averaged over the
#     two monitoring stations representing Windsor and over a 24-hr period;
#     multiday moving averages were also tested.
#   - Outcomes, measured once a week at the children's schools: spirometry
#     (FEV1, FEF25-75%), fractional exhaled nitric oxide (FeNO), and three
#     breath-condensate markers — TBARS and 8-isoprostane (oxidative stress)
#     and IL-6 (inflammation). 691 spirometry results, 672 FeNO results and
#     616 breath samples in all.
#
# IMPORTANT — WHAT THE EXPOSURE CONTRAST ACTUALLY IS:
#   There is NO unexposed arm and no control group. Every child breathed the
#   same ambient air; what varies is the day-to-day pollutant level. The
#   paper's results are therefore REGRESSION ESTIMATES from mixed-effects
#   models — the percent change in an end point per interquartile-range
#   increase in a pollutant — not differences between groups. That is
#   modelled here as:
#     * FOUR assays, one per end point family, because informs_on_key_event is
#       single-valued and these end points inform on three different key
#       events: spirometry -> decreased lung function, FeNO -> airway
#       inflammation, TBARS and 8-isoprostane -> increased oxidative stress
#     * the pollutant metrics as ExposureConditions on each assay
#     * every estimate as a response_comparison with control_output and
#       treated_output DELIBERATELY OMITTED, because no such pair of groups
#       exists. Which pollutant and which averaging window each comparison
#       belongs to is in its id, name and description.
#
# IMPORTANT — NO ABSOLUTE MEASUREMENT VALUES ARE RECORDED:
#   has_specified_output is omitted on all four assays. The paper reports its
#   cohort characteristics, pollutant concentrations and end-point levels in
#   Tables 1-4 and Figures 2-3, none of whose cells are present in the
#   retrievable full text; the narrative gives only the regression estimates.
#   Per the extraction rules, a slot with no reported value is omitted rather
#   than guessed, so the absolute FEV1, FEF25-75%, FeNO, TBARS and
#   8-isoprostane levels appear nowhere in this file. Everything quantitative
#   here lives in response_comparisons.
#
# IMPORTANT — THE IQR INCREMENTS ARE NOT EXPOSURE CONCENTRATIONS:
#   The only numeric exposure figures in the retrievable text are the
#   interquartile-range *increases* against which the percent changes are
#   expressed (3-day average SO2 5.4 ppb, NO2 6.8 ppb, PM2.5 5.4 ug/m3,
#   O3 5.3 ppb). Those are increments of a distribution, not levels the
#   children were exposed to, so they are NOT recorded in
#   exposure_concentration; they are stated in each condition's name and in
#   every comparison's description. Table 2's actual daily concentrations are
#   not in the retrievable text.
#
# SOURCE INCONSISTENCY recorded as printed (never silently corrected):
#   The abstract states "FeNO, 8-isoprostane, and IL-6 were not associated
#   with air pollutants" and "O3 (5.3 ppb) was not associated with health end
#   points", while the Results section reports that "FeNO had a statistically
#   significant negative association with O3" and that "8-Iso-prostane was
#   significantly positively associated with same-day SO2". The Results
#   statements are the more specific ones and are what the comparisons below
#   record; the abstract's blanket null statements are quoted alongside them
#   and flagged in each affected comparison's description.
#   Separately, the ICS interaction sentence prints "FEV25-75%", a label that
#   exists nowhere else in the paper and is evidently a typographical error
#   for FEF25-75%; it is quoted as printed and flagged, not corrected.
#
# Key findings recorded here:
#   - Per IQR increase in 3-day average SO2, NO2 and PM2.5: FEF25-75% fell
#     3.1%, 2.8% and 3.0% respectively, and TBARS in breath condensate rose
#     36.2%, 21.8% and 24.8% respectively
#   - O3 was not associated with any end point except a counterintuitive
#     negative association with FeNO
#   - FeNO and IL-6 showed no adverse association with air pollution; IL-6 was
#     detectable in only 2 of 616 breath samples, so no IL-6 assay is recorded
#   - Risk estimates were larger in children not taking inhaled corticosteroids
#   - FEF25-75% and TBARS moved coherently with a similar lag structure, which
#     is the single key event relationship this paper supports
#
# Every KeyEvent block below is copied byte-for-byte from the wording already
# on main (shared vocabulary — never re-authored here).
# =============================================================================

source_publication:
  reference: "PMID:19440509"
  reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
  doi: "10.1289/ehp11813"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:liu2009-spirometry-001"
    name: "KoKo spirometry in asthmatic schoolchildren per American Thoracic Society criteria"
    description: "Spirometry performed according to American Thoracic Society criteria (American Thoracic Society 1995) by registered respiratory technologists visiting the children's schools once a week, on the same day of the week for each child. KoKo Spirometers (Ferraris CardioRespiratory; Pulmonary Data Services, Inc. Louiseville, CO, USA) were calibrated daily and results adjusted for temperature and barometric pressure. A maximum of eight forced vital capacity manoeuvres were carried out in an attempt to achieve three acceptable flow-volume loops, two of them within 0.20 L for FVC and FEV1 and within 0.20 L/sec for FEF25-75%. The value assigned to each child was the largest acceptable value within 200 mL of a second value. No bronchodilator was administered as part of the test, so the bronchodilator slots are omitted; the children were not asked to alter their use of asthma medications during the study, and daily use of inhaled corticosteroids and short-acting beta-agonist was instead carried into the models as a covariate."
    spirometry_standard: "American Thoracic Society criteria (American Thoracic Society 1995)"
    equipment_required:
      - "KoKo Spirometer (Ferraris CardioRespiratory; Pulmonary Data Services, Inc. Louiseville, CO, USA)"
    quality_control_criteria: "Three acceptable flow-volume loops attempted from a maximum of eight forced vital capacity manoeuvres, with two loops agreeing within 0.20 L for FVC and FEV1 and within 0.20 L/sec for FEF25-75%; the value assigned to the child was the largest acceptable value within 200 mL of a second value. Spirometers were calibrated daily and results adjusted for temperature and barometric pressure."
    institution: "Health Canada, with testing conducted at elementary schools in Windsor, Ontario, Canada"

  # Typed as a MolecularAssayProtocol, not a SpirometryProtocol: FeNO is an
  # analyte measured by chemiluminescence in exhaled gas, not a spirometry
  # manoeuvre. That lets detection_method carry the chemiluminescence method;
  # the ATS/ERS guideline the measurement follows is stated in the description
  # and quality_control_criteria instead of in spirometry_standard, which this
  # protocol class does not have.
  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:liu2009-feno-001"
    name: "Single-breath on-line fractional exhaled nitric oxide at 0.05 L/sec"
    detection_method: "chemiluminescence (Eco Physics CLD AL MED analyzer), single-breath on-line measurement at an exhalation flow rate of 0.05 L/sec per American Thoracic Society and European Respiratory Society Guidelines (American Thoracic Society 2005)"
    description: "Single-breath on-line measures of FeNO carried out according to American Thoracic Society and European Respiratory Society Guidelines (American Thoracic Society 2005) using an Eco Physics CLD AL MED chemiluminescence analyzer (Eco Medics AG, Duernten, Switzerland). Before performing a slow vital capacity manoeuvre over at least 6 sec at 0.05 L/sec, subjects took three tidal volume breaths through a DENOX 88 (Eco Medics AG, Duernten, Switzerland) containing an NOx absorber cartridge that scrubs ambient air to between 0 and 1.5 ppb. The test was repeated a maximum of eight times in an attempt to obtain at least two acceptable plateau FeNO values within 10%, and the value assigned to the subject was the mean of those two values. FeNO statistics were calculated with spiroWare 88 software (Eco Medics AG, Duernten, Switzerland). The authors note in the discussion that the single 0.05 L/sec flow rate may not capture lower-airway inflammation, citing a study in which wood smoke raised FeNO measured at 0.27 L/sec but not at 0.05 L/sec — a stated limitation of this protocol, not a result of this study."
    equipment_required:
      - "Eco Physics CLD AL MED chemiluminescence analyzer (Eco Medics AG, Duernten, Switzerland)"
      - "DENOX 88 NOx absorber cartridge (Eco Medics AG, Duernten, Switzerland)"
      - "spiroWare 88 software (Eco Medics AG, Duernten, Switzerland)"
    quality_control_criteria: "At least two acceptable plateau FeNO values agreeing within 10%, from a maximum of eight repeats; ambient air scrubbed to between 0 and 1.5 ppb through an NOx absorber cartridge before the manoeuvre."
    institution: "Health Canada, with testing conducted at elementary schools in Windsor, Ontario, Canada"

  - id: "PROTOCOL:liu2009-ebc-collection-001"
    name: "Exhaled breath condensate collection by RTube with amylase contamination control"
    description: "Exhaled breath condensate collected using an RTube (Respiratory Research Inc., Charlottesville, VA, USA). Participants sat and breathed at tidal volumes orally into a mouthpiece attached to a cold condenser for 10 min, yielding approximately 1 mL of condensate, which was transferred into a microtube and stored at -20 C and then -80 C until use. Saliva contamination was assessed by measuring alpha-amylase activity in breath condensate with an assay kit (Pointe Scientific, MI, USA) following the increase in absorbance at 405 nm as the artificial substrate 2-chloro-p-nitrophenyl-alpha-d-maltotrioside is hydrolyzed. Amylase was measured in 25% of breath samples; the median concentration was 0.60 unit/L with a 95th percentile of 1.46 unit/L, none of the samples approached the reported salivary amylase concentration of 1,250 unit/L, and saliva contamination was estimated at less than 0.1%, so interference of breath analysis by saliva was judged negligible. 616 breath samples were collected in total. This collection protocol feeds both breath-condensate assays in this file."
    equipment_required:
      - "RTube breath condensate collector (Respiratory Research Inc., Charlottesville, VA, USA)"
      - "alpha-amylase assay kit (Pointe Scientific, MI, USA)"
    quality_control_criteria: "Saliva contamination screened by alpha-amylase activity in 25% of samples: median 0.60 unit/L, 95th percentile 1.46 unit/L, no sample near the reported salivary amylase concentration of 1,250 unit/L; estimated saliva contamination below 0.1%."
    institution: "Health Canada"

  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:liu2009-tbars-001"
    name: "Thiobarbituric acid reactive substances in breath condensate by fluorescence"
    description: "TBARS determined in duplicate by a fluorescence method adapted from Yagi (1982), with malonaldehyde bis-(dimethyl acetal) (Aldrich Chemical Co., Milwaukee, WI, USA) used to construct the standard curve. To reduce background interference at the very low TBARS levels present in exhaled breath condensate, all glassware was washed in soap-free detergent then rinsed with distilled water and ethanol before use. Butanol (OmniSolv, 99.95%; EM Science, Darmstadt, Germany) was used for extraction; the n-butanol extract was transferred to a Whatman glass bottom microplate (Whatman, NJ, USA) pre-washed with ethanol, and fluorescence was measured at 530 nm/590 nm excitation/emission with a Cytofluor 2350 reader (Millipore, Billerica, MA, USA). The detection limit was 0.02 uM (three times the standard deviation above the blank) and the within-run coefficient of variation was 8%. Because more than 99% of samples gave a value above zero and most were above the detection limit, data points below the detection limit were given no special treatment."
    detection_method: "fluorescence at 530 nm/590 nm excitation/emission after n-butanol extraction (thiobarbituric acid reaction, method adapted from Yagi 1982)"
    equipment_required:
      - "Cytofluor 2350 fluorescence reader (Millipore, Billerica, MA, USA)"
      - "Whatman glass bottom microplate (Whatman, NJ, USA)"
    quality_control_criteria: "Detection limit 0.02 uM, taken as three times the standard deviation above the blank; within-run coefficient of variation 8%; all glassware washed in soap-free detergent and rinsed with distilled water and ethanol to suppress background interference."
    replicate_requirements: 2
    sub_protocols:
      - id: "PROTOCOL:liu2009-ebc-collection-001"
        name: "Exhaled breath condensate collection by RTube with amylase contamination control"
    institution: "Health Canada"

  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:liu2009-8isoprostane-eia-001"
    name: "8-Isoprostane in breath condensate by colorimetric enzyme immunoassay"
    description: "8-Isoprostane concentrations in breath condensate measured with a colorimetric enzyme immunoassay kit (Cayman Chemical, Ann Arbor, MI, USA), in triplicate. A modified standard curve was established for concentrations between 0.975 and 62.5 pg/mL, and 8-isoprostane was detectable down to 0.975 pg/mL (three times the standard deviation above the blank), with a within-run coefficient of variation of 5%. As a cross-check, 8-isoprostane was also measured on 8 random samples by radioimmunoassay following Montuschi et al. (2003): the Pearson correlation coefficient between the two methods was 0.744 (p = 0.055), with a mean positive bias of approximately 35% in favour of the radioimmunoassay, which the authors attribute to variation in antibody avidity and specificity and to extrapolation from calibration curves at the very low levels typical of breath condensate. The authors conclude that TBARS may be a more sensitive biomarker than 8-isoprostane in breath condensate for acute air-pollution exposures."
    detection_method: "colorimetric enzyme immunoassay (Cayman Chemical), cross-checked against radioimmunoassay on 8 random samples"
    equipment_required:
      - "colorimetric enzyme immunoassay kit for 8-isoprostane (Cayman Chemical, Ann Arbor, MI, USA)"
    quality_control_criteria: "Modified standard curve from 0.975 to 62.5 pg/mL; detection limit 0.975 pg/mL, taken as three times the standard deviation above the blank; within-run coefficient of variation 5%; method agreement against radioimmunoassay on 8 random samples gave a Pearson correlation coefficient of 0.744 (p = 0.055) with a mean positive bias of about 35% in favour of the radioimmunoassay."
    replicate_requirements: 3
    sub_protocols:
      - id: "PROTOCOL:liu2009-ebc-collection-001"
        name: "Exhaled breath condensate collection by RTube with amylase contamination control"
    institution: "Health Canada"

  - id: "PROTOCOL:liu2009-ambient-monitoring-001"
    name: "Daily ambient SO2, NO2, O3 and PM2.5 from the National Air Pollution Surveillance network"
    description: "Hourly measures of PM2.5, sulfur dioxide, nitrogen dioxide and ozone obtained from the National Air Pollution Surveillance network of Environment Canada. Two monitoring stations represented Windsor, both located upwind of the prevailing winds; 180 of the 182 participating children lived within a 10-km radius of the air monitoring sites, one lived 12 km away and another 17 km away. Values from the two monitors were averaged. SO2 was measured using ultraviolet fluorescence and the electrical conductivity from changes in chemical composition of a bromine solution, NO2 using chemiluminescence, O3 using ultraviolet absorbance, and PM2.5 using a tapered element oscillating microbalance monitor. Pollutant concentrations were averaged over a 24-hr period, and multiday moving averages were tested in the models to examine potentially delayed response. Daily temperature and relative humidity were correlated with some pollutants and were carried into the models as covariates, as was the testing period, to reduce the impact of seasonality."
    equipment_required:
      - "ultraviolet fluorescence and bromine-solution electrical conductivity analyser (SO2)"
      - "chemiluminescence analyser (NO2)"
      - "ultraviolet absorbance analyser (O3)"
      - "tapered element oscillating microbalance monitor (PM2.5)"
    institution: "National Air Pollution Surveillance network, Environment Canada; two monitoring stations representing Windsor, Ontario"

# =============================================================================
# LUNG FUNCTION ASSAY — weekly spirometry.
#
# Carries no output record: the paper's absolute FEV1 and FEF25-75% values are
# in Table 1 and Table 4, neither of whose cells are in the retrievable full
# text. The findings are regression estimates and live in
# response_comparisons, keyed to this assay by derived_from_assay.
#
# exposure_duration on the pollutant conditions encodes the AVERAGING WINDOW of
# the model's exposure metric (72 h for the 3-day moving average the abstract's
# headline estimates use), not a duration the paper reports as an exposure
# time. Read 72 h as "3-day moving average".
# =============================================================================

lung_function_assays:
  - id: "LF:liu2009-spirometry-cohort"
    name: "Weekly spirometry in 182 asthmatic children aged 9-14 under ambient air pollution"
    description: "Weekly spirometry (FEV1 and FEF25-75%) in 182 asthmatic children aged 9-14 from nonsmoking households in Windsor, Ontario, over 4 weeks in October-December 2005, giving 691 spirometry test results, analysed against daily ambient SO2, NO2, O3 and PM2.5. Seven children had 5 measurement days, 142 had 4, 27 had 3 and 6 had 2; there were 39 measurement days in all and no air monitoring day was missing. Associations were estimated with mixed-effects regression models assuming random slopes and random intercepts and accounting for intraindividual correlation, adjusted for daily temperature, relative humidity, testing period and the daily use of inhaled corticosteroids and short-acting beta-agonist; results were expressed as percent change per interquartile-range increase in a pollutant, with p <= 0.05 taken as significant. Because subjects served as their own control, age, race, family income and family asthma history were not adjusted for, and day-of-week was not adjusted for because testing was kept on the same weekday for each child. FEV1 and FEF25-75% both trended negative against all four pollutants, but only FEF25-75% reached significance; the significant FEF25-75% associations persisted for at least 3 days, and the risk estimates were larger for 3-day averages than for shorter terms. Two-pollutant models left the PM2.5 and O3 estimates largely unchanged but did shift those for SO2 and NO2, which the authors read as PM2.5 having confounded some of the SO2 and NO2 effect on pulmonary function. Stratifying by inhaled corticosteroid use (only 37% of the children used them) showed significant FEV1 and FEF25-75% risk estimates among children not taking them; those stratified estimates are reported only in Figure 2 and carry no numbers in the retrievable text, so no comparison records them. No absolute lung function value is recorded on this assay because Tables 1 and 4 are not in the retrievable full text."
    evidence:
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We studied 182 children with asthma, 9-14 years of age, for 4 weeks."
        explanation: "States the cohort size, age range and follow-up duration of the panel whose spirometry this assay records."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "A total of 182 asthmatic children participated in the study, for a total of 691 spirometry test results, 672 FeNO test results, and 616 breath samples."
        explanation: "Gives the 691 spirometry test results behind this assay, and the FeNO and breath-sample counts behind the other three assays in this file."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Spirometry was performed according to American Thoracic Society criteria (American Thoracic Society 1995)."
        explanation: "States the spirometry standard recorded on this assay's spirometry protocol."
