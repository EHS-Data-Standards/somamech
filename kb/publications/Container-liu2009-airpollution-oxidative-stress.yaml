# =============================================================================
# KEY EVENT RELATIONSHIPS
#
# ONE relationship only, and it is a coherence claim rather than a
# demonstrated mechanism. The authors observed that FEF25-75% fell and TBARS
# rose in response to the same three pollutants with a similar lag structure,
# and read that as "a coherent outcome for small airway function and
# oxidative stress". They did not test mediation, did not vary oxidative
# stress experimentally, and this is an observational panel with no unexposed
# arm — so relationship_type is "associated with" and evidence_support is
# weak.
#
# NO relationship is recorded from oxidative stress to airway inflammation:
# the paper's inflammation markers were null (FeNO showed no adverse
# association, IL-6 was undetectable in 614 of 616 samples), so this paper
# supplies no evidence for that link. The statement that "oxidative stress
# often occurs along with tissue inflammation" is background the authors cite
# from other publications, not a finding of this study, and is not recorded.
#
# Every KeyEvent block below is copied byte-for-byte from the wording already
# on main.
# =============================================================================

key_event_relationships:
  - id: "KER:liu2009-oxidative-stress-to-lung-function"
    name: "Increased oxidative stress is associated with decreased lung function"
    description: "Adverse changes in FEF25-75% tracked the increases in breath-condensate TBARS across the same three pollutants (SO2, NO2 and PM2.5) with a similar lag structure, which the authors read as a coherent outcome for small airway function and oxidative stress. This is a coherence-of-response argument in an observational panel with no unexposed arm: the two end points respond to the same exposures over the same window, but no mediation analysis was performed, oxidative stress was never manipulated, and the authors make no causal claim. Direction and causality are therefore not established, which is why the relationship is recorded as an association with weak support. The authors further report that inhaled corticosteroids, which are thought to reduce airway inflammation and oxidative stress, appeared to blunt both the TBARS and the lung function responses — consistent with the two moving together, but again observational."
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    relationship_type: "associated with"
    evidence_support: weak
    evidence:
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Adverse changes in FEF25–75% were consistent with those of TBARS in response to SO2, NO2, and PM2.5 with a similar lag structure, suggesting a coherent outcome for small airway function and oxidative stress."
        explanation: "The paper's own statement of this relationship: the lung function decrement and the oxidative stress increase responded to the same three pollutants over a similar lag, which the authors call a coherent outcome. It is a coherence claim, not a demonstrated mechanism, which is why relationship_type is 'associated with' and evidence_support is weak."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Air pollution may increase airway oxidative stress and decrease small airway function of asthmatic children. Inhaled corticosteroids may reduce oxidative stress and improve airway function."
        explanation: "The paper's conclusion names both key events in this relationship as consequences of air pollution, and the authors' hedged 'may' is part of why the support is recorded as weak."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "ICS are thought to reduce inflammation and oxidative stress in airways (Baraldi et al. 2003; Khor et al. 2007). Children with asthma exacerbation have reduced 8-isoprostane in breath condensate after ICS treatment (Baraldi et al. 2003). In the present study, we found that ICS seems to be able to reduce some of the adverse effects of air pollutants, as the risk estimates appear to be larger for the children who did not take ICS during the study period."
        explanation: "Supports the description's secondary argument: an intervention thought to reduce airway oxidative stress appeared to blunt both the oxidative stress and the lung function responses, which is consistent with the two key events moving together. The authors' 'seems to be able' and the reliance on an unmanipulated subgroup comparison are why this does not raise the evidence above weak."
      - reference: "PMID:19440509"
        reference_title: "Acute effects of air pollution on pulmonary function, airway inflammation, and oxidative stress in asthmatic children."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "When a large number of regression models are run on a data set, some statistically significant associations may occur by chance. To reduce the possibility of spurious relationships due to multiple comparisons, we limited sensitivity analyses to those that consistently demonstrated statistical significance in base models, and considered only results showing a consistent pattern as actual effects."
        explanation: "States the authors' own multiple-comparisons caveat and the consistency-of-pattern criterion they relied on instead of a formal correction. It is the methodological basis of the coherence argument behind this relationship, and part of why the support is recorded as weak."
