# =============================================================================
# RESPONSE COMPARISONS
#
# Every estimate is a percent change in an end point per interquartile-range
# increase in one pollutant, from a mixed-effects regression model. These are
# regression estimates across a continuously exposed cohort, NOT differences
# between a control group and a treated group, so control_output and
# treated_output are omitted throughout: this panel has no unexposed arm and
# each child served as their own control.
#
# change_value is recorded only where the paper prints a number. Where the
# paper states a direction and a significance verdict without a figure (the
# FEV1 trend, the FeNO associations, the 8-isoprostane associations, the ozone
# nulls), change_value is omitted rather than computed or guessed.
#
# p_value is omitted throughout: the paper prints no per-estimate p-values in
# the retrievable text, only the p <= 0.05 threshold it judges significance
# by. change_direction follows that threshold, so an estimate the paper does
# not call significant is recorded as no_change even where the paper describes
# a directional trend; each description says so.
#
# sample_size on each change_value is the number of OBSERVATIONS behind the
# model fit, not the number of children: 691 spirometry test results, 672 FeNO
# test results and 616 breath samples, all from the same 182 children measured
# repeatedly over 4 weeks. That follows the repeated-measures convention
# already used on main (Container-intpanis2017 records 5404 clinical visits
# from 2449 participants the same way). The subject count is in each assay's
# study_subject and subject_characteristics.
# =============================================================================

response_comparisons:

  # --- FEF25-75%: the paper's significant lung function finding -------------

  - id: "COMP:liu2009-so2-3day-fef2575"
    name: "FEF25-75% change per interquartile-range increase in 3-day average SO2"
    description: "Percent change in forced expiratory flow between 25% and 75% of forced vital capacity per interquartile-range increase of 5.4 ppb in the 3-day average ambient sulfur dioxide concentration, from a mixed-effects regression model with random slopes and intercepts, adjusted for daily temperature, relative humidity, testing period and daily use of inhaled corticosteroids and short-acting beta-agonist. The 95% confidence interval excludes zero, so this estimate is significant under the paper's stated p <= 0.05 criterion; no per-estimate p-value is printed in the retrievable text, so p_value is omitted rather than invented. NOTE a tension in the source: the abstract prints this interval as excluding zero, but the Results sentence on Table 4 names only NO2 and PM2.5 as having a statistically significant FEF25-75% association, not SO2. The two statements concern different model columns — the abstract's is the 3-day average recorded here, Table 4's is the single-pollutant model — and both are quoted on the assay; change_direction follows the abstract's printed interval for the 3-day window. The authors note that the SO2 lung function estimates were sensitive to including PM2.5 in the model, so part of this effect may be confounded by PM2.5. A regression estimate across a continuously exposed cohort, not a contrast between a control and a treated group: control_output and treated_output are deliberately omitted."
    derived_from_assay: "LF:liu2009-spirometry-cohort"
    compared_measurement: "fef25_75"
    change_type: percent_change
    change_direction: decreased
    change_value:
      value: "-3.1"
      unit:
        id: "UO:0000187"
        name: "percent"
      central_tendency: single_value
      sample_size: 691
      variability:
        variability_type: confidence_interval_95
        lower_bound: "-5.8"
        upper_bound: "-0.3"
        unit:
          id: "UO:0000187"
          name: "percent"
    statistical_test: "mixed-effects regression model with random slopes and random intercepts accounting for intraindividual correlation (S-PLUS version 6.1)"
    derivation: reported_in_paper

  - id: "COMP:liu2009-no2-3day-fef2575"
    name: "FEF25-75% change per interquartile-range increase in 3-day average NO2"
    description: "Percent change in forced expiratory flow between 25% and 75% of forced vital capacity per interquartile-range increase of 6.8 ppb in the 3-day average ambient nitrogen dioxide concentration, from the same mixed-effects regression model. The 95% confidence interval excludes zero, so this estimate is significant under the paper's stated p <= 0.05 criterion; no per-estimate p-value is printed in the retrievable text, so p_value is omitted. The Results section separately confirms that FEF25-75% had a statistically significant association with NO2. The authors note that the NO2 lung function estimates were sensitive to including PM2.5 in the model, so part of this effect may be confounded by PM2.5. A regression estimate across a continuously exposed cohort, not a contrast between a control and a treated group: control_output and treated_output are deliberately omitted."
    derived_from_assay: "LF:liu2009-spirometry-cohort"
