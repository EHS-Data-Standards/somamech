# =============================================================================
# RESPONSE COMPARISONS
#
# Only the FVC contrast is recorded: it is the one lung-function comparison
# the paper reports as statistically significant. The paper's Discussion
# rounds the FVC advantage to "100 mL", but that figure matches neither the
# Table 3 means (difference 0.08 L) nor the text medians exactly, so
# change_value is omitted rather than reconciled. Direction note: the
# "control" arm here is the HIGHER-exposure (traditional cooking) arm, so
# change_direction `increased` means the intervention (ICS) arm had the
# higher FVC.
# =============================================================================

response_comparisons:
  - id: "COMP:cuestamosquera-fvc"
    name: "Follow-up FVC, Save80 ICS arm vs traditional-cooking arm"
    description: "FVC at the three-year follow-up was significantly higher in the ICS arm than in the traditional-cooking control arm (Table 3 means 2.82 +/- 0.62 vs 2.74 +/- 0.58 L, P = 4.4e-02; text medians 2.82 vs 2.74 L, P-value = 0.044, Wilcoxon test). The Discussion rounds the advantage to 100 mL ('better forced vital capacity (FVC, 100 mL)'), which matches neither the Table 3 mean difference (0.08 L) nor the medians exactly, so change_value is omitted rather than computed or reconciled."
    derived_from_assay: "LF:cuestamosquera-spirometry-followup"
    compared_measurement: "fvc"
    control_output: "LF:cuestamosquera-spirometry-followup-output-traditional"
    treated_output: "LF:cuestamosquera-spirometry-followup-output-ics"
    change_type: absolute_difference
    change_direction: increased
    p_value: 0.044
    statistical_test: "Wilcoxon rank sum test"
    derivation: reported_in_paper
