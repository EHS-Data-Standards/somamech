# =============================================================================
# Cuesta-Mosquera et al. (2025) - Improved cookstoves enhance household air
# quality and respiratory health in rural Rwanda
# =============================================================================
#
# Source: Sci Rep. 2025;15:26065
# DOI: 10.1038/s41598-025-09863-6
# PMID: 40681630
#
# Study design (HUMAN RANDOMIZED CONTROLLED TRIAL — not in vitro, not an
# animal experiment):
#   - RCT over three years (September 2019 to May 2022) in two rural Rwandan
#     districts (Musanze and Gatsibo); blinding not possible
#   - 1001 adults responsible for cooking in their homes, randomly allocated
#     to an intervention group that received the wood-fueled Save80 improved
#     cookstove (ICS) at the start (n = 380) and a control group that kept
#     cooking with traditional methods, mainly indoor three-stone wood fires
#     (n = 621), receiving the stove only at the end
#   - Health assessments in 2019 and 2022: RESPIRE-based questionnaire
#     (symptoms: cough, mucus, chest tightness, wheezing, ocular itchiness)
#     and ERS/ATS spirometry (FVC, FEV1, FEV1/FVC, PEF)
#   - Follow-up: 907 questionnaires (557 traditional, 350 ICS), acceptable
#     spirometry from 848 (520 traditional, 328 ICS)
#   - Household air pollution (HAP) measured in 2022 in a subsample of 45
#     control-group households cooking first with traditional methods, then
#     with the ICS after training (paired within household): online BC, BrC
#     and PM0.3-2.5 (microAeth MA200, TSI OPSS 3330), plus PM10 filters
#     (n = 21) analysed for OC/EC/TC (EUSAAR-2) and 22 PAH species (GC-MS)
#
# MODELLING NOTES:
#   - experimental_group follows the TRIAL arms, as the paper names them: the
#     traditional-cooking arm is `control` and the ICS arm is `treated`
#     (the intervention). Note the inversion relative to toxicology usage:
#     here the CONTROL arm is the HIGHER-exposure arm, so the significant
#     FVC difference favoring the ICS arm is recorded with change_direction
#     `increased` (treated vs control).
#   - One spirometry assay with one output record per arm (both arms come
#     from the same randomized cohort; baseline showed no significant
#     between-group differences in symptoms or lung function).
#   - Respiratory symptom prevalences have no SOMA slot, so they stay in
#     prose (the isara2016 pattern): at follow-up (Table 3, n = 907)
#     coughing 18.2% traditional vs 7.5% ICS (P = 8.3e-04) and mucus 13.2%
#     vs 4.8% (P = 8.7e-04) were significantly lower in the ICS arm; chest
#     tightness (12.3% vs 6.7%), wheezing (5.4% vs 2.7%) and ocular
#     itchiness (6.4% vs 3.2%) were lower without statistical significance.
#   - Longitudinal change: mean dFVC over the three years was -0.02 in the
#     ICS arm vs -0.16 in the control arm (P < 0.001). dFVC has no output
#     slot (decline_rate is mL/year and computing a rate would violate the
#     no-computed-deltas rule), so it is recorded in prose with its quote.
#   - HAP measurements are environmental characterization, not biological
#     assays, so they live on the two ExposureCondition records (Table 3
#     values; exposure n = 45, filter concentrations n = 21).
#   - No key_event_relationships are recorded: the paper links the exposure
#     contrast (cooking method) directly to symptoms and lung function and
#     measured no mechanistic intermediate key events.
#
# INTERNAL DISCREPANCIES IN THE SOURCE (recorded as printed, Table 3 taken
# as primary for numeric records):
#   - Coughing/mucus prevalence: the Results text says "coughing (29%
#     traditional cooks vs. 19% ICS users)" and "mucus production (13%
#     traditional cooks vs. 22% ICS users)" while Table 3 gives 18.2% vs
#     7.5% and 13.2% vs 4.8%. The text's mucus figures contradict the
#     "reductions" they illustrate and the abstract's "-9%", so the text
#     values appear garbled; Table 3 values are recorded, in prose.
#   - FEV1: Table 3 means are 2.30 L (traditional) vs 2.35 L (ICS), while
#     the text's MEDIANS run the other way (2.30 L ICS vs 2.35 L
#     traditional). Means and medians can legitimately disagree; Table 3
#     means are recorded and the medians stay in the description.
#   - FEV1/FVC: Table 3 prints the column as "(%)" with values 0.84 +/- 0.1
#     (a fraction); the text gives medians of 84% (ICS) and 85%
#     (traditional). Recorded as printed in Table 3 (0.84, dimensionless).
#   - PEF: Table 3 prints "PEF (L)"; PEF is a flow conventionally reported
#     in L/s, but the printed unit is recorded as-is (UO:0000099, liter)
#     rather than silently normalised (the isara2016/oluwole2013 rule).
#   - PM0.3-2.5 exposure: the text says 167 +/- 207 ug m-3 hour-1 for
#     traditional cooking, Table 3 says 167.1 +/- 204.1; Table 3 recorded.
#   - PM0.3-1: Table 3 heads the row "(ug m-3)" while the text calls the
#     same numbers exposures in ug m-3 hour-1; left in prose.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:40681630"
  reference_title: "Improved cookstoves enhance household air quality and respiratory health in rural Rwanda."
  doi: "10.1038/s41598-025-09863-6"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:cuestamosquera-spirometry-001"
    name: "Mobile Vyntus SPIRO spirometry per ERS/ATS guidelines"
    description: "Spirometry following the guidelines from the European Respiratory Society and the American Thoracic Society (ERS/ATS), measuring forced vital capacity (FVC), forced expiratory volume in 1 s (FEV1), and peak expiratory flow (PEF). Airway obstruction defined as FEV1/FVC ratio < 70%. Repetitive measurements were carried out until at least three flow-volume curves met the ERS/GOLD criteria. Mobile spirometer Vyntus SPIRO PC-Spirometer (VYAIRE) with a mouthpiece with an integrated bacterial filter and a nose clip. Air volume calibration with a calibration pump at regular intervals throughout the day (every morning, afternoon, and after significant weather changes); meteorological parameters for calibration measured with a portable weather station (Technoline WS 6765). Conducted in community halls, supervised by medical doctors who trained personnel from Safer Rwanda."
    spirometry_standard: "European Respiratory Society / American Thoracic Society (ERS/ATS) guidelines; flow-volume curves meeting ERS/GOLD criteria"
    equipment_required:
      - "Vyntus SPIRO PC-Spirometer (VYAIRE) with bacterial-filter mouthpiece and nose clip"
      - "Portable weather station (Technoline WS 6765)"

  - id: "PROTOCOL:cuestamosquera-questionnaire-001"
    name: "RESPIRE-based structured health questionnaire with CAT"
    description: "Structured questionnaire based on the RESPIRE study, integrating the COPD Assessment Test (CAT) and questions on cooking practices (time spent cooking per day, main cooking fuel, kitchen location indoor/outdoor, chimneys) and living conditions. Participants were asked about the occurrence and frequency of cough, wheezing, chest tightness, and ocular itchiness, about other disease diagnoses (e.g., asthma, COPD, allergies, heart disease), and whether they were active or passive smokers. The same questionnaire was applied in the 2019 baseline and the 2022 follow-up assessment, administered by trained interviewers."

  - id: "PROTOCOL:cuestamosquera-hap-online-001"
    name: "In-home online HAP monitoring of BC, BrC and PM during cooking"
    description: "Household air pollution measured in 2022 at 45 control-group households, over two rounds: first cooking with traditional methods, then cooking with the Save80 ICS after training. Three stages per measurement: 10 to 15 min before the cooking fire started, during cooking with the fire on, and 10 to 15 min after the fire was turned off. Time-resolved black carbon measured with a portable microAeth MA200 light absorption photometer (Aethlabs; five wavelengths 375-880 nm, 10 s resolution) and PM estimated from particle number size distributions measured with an Optical Particle Size Spectrometer model 3330 (TSI Inc; 0.3-10 um, 10 s resolution), assuming spherical particles of density 1.4 g/cm3 with a biomass-burning refractive index correction; PM masses estimated for 0.3-1 um (PM0.3-1) and 1-2.5 um ranges. Instruments carried in TROPOS-made portable backpacks with silica gel dryers, placed indoors 2-3 m from the cooking fire or stove. Total HAP exposure computed by integrating the measured concentration over the cooking period. QA/QC per the World Calibration Centre for Aerosol Physics (WCCAP), Leipzig."
    equipment_required:
      - "microAeth MA200 portable light absorption photometer (Aethlabs)"
      - "Optical Particle Size Spectrometer model 3330 (TSI Inc)"
      - "TROPOS-made portable backpack with 1-m stainless-steel inlet and silica gel dryer"

  - id: "PROTOCOL:cuestamosquera-filter-analysis-001"
    name: "PM10 filter collection with OC/EC/TC and PAH laboratory analysis"
    description: "Totalized PM10 filter samples collected during cooking periods at a subgroup of the HAP-measured households (n = 21) with a low-volume portable sampler Gilian 12 (Sensidyne; 10 L/min, 37 mm quartz-fiber filters pre-heated 24 h at 105 C and stored frozen). OC/EC mass concentrations determined by a thermal-optical method following the EUSAAR-2 protocol with a Sunset Laboratory dual carbonaceous analyzer. Twenty-two particulate PAH species (13 on the U.S. EPA sensitive list) determined from filter punches with a Curie-point pyrolyzer (JPS-350, JAI) coupled to a GC-MS system (6890N GC, 5973 inert MSD, Agilent Technologies)."
    equipment_required:
      - "Gilian 12 low-volume portable sampler (Sensidyne) with 37 mm quartz-fiber filters"
      - "Sunset Laboratory dual carbonaceous analyzer"
      - "Curie-point pyrolyzer (JPS-350, JAI) coupled to GC-MS (6890N GC, 5973 inert MSD, Agilent Technologies)"

# =============================================================================
# LUNG FUNCTION ASSAY — ERS/ATS spirometry at the 2022 follow-up, one output
# record per trial arm. The traditional-cooking arm is the trial's control
# group (and the higher-exposure arm); the ICS arm is the intervention.
# =============================================================================

lung_function_assays:
  - id: "LF:cuestamosquera-spirometry-followup"
    name: "Spirometry at three-year follow-up - traditional cooking vs Save80 improved cookstove arms"
    description: "Follow-up (2022) spirometry in 848 adults (520 traditional cooking, 328 ICS) after three years of randomized cooking-method assignment. FVC was significantly higher in the ICS arm (Table 3 means: 2.82 +/- 0.62 L vs 2.74 +/- 0.58 L, Wilcoxon P = 4.4e-02; text medians 2.82 L vs 2.74 L, P = 0.044). FEV1 (Table 3 means: 2.30 +/- 0.51 L traditional vs 2.35 +/- 0.54 L ICS, P = 1.8e-01; the text's medians run the other way, 2.30 L ICS vs 2.35 L traditional, P = 0.179), FEV1/FVC (0.84 +/- 0.1 in both arms per Table 3, printed under a '(%)' header; text medians 84% ICS vs 85% traditional, P = 0.288) and PEF (4.46 +/- 1.3 vs 4.46 +/- 1.4, printed as 'PEF (L)', P = 0.936) did not differ significantly. At the 2019 baseline (1001 questionnaires, acceptable spirometry in 935) there were no significant between-group differences in symptoms or lung function; obstructive disease (FEV1/FVC < 70%) was found in 32 participants (3%) at baseline and 50 (6%) at follow-up (26 traditional, mean FEV1/FVC 62%; 24 ICS, mean FEV1/FVC 60%; no significant group difference). Longitudinal change: mean dFVC over the three years was -0.02 in the ICS arm vs -0.16 in the control arm (P < 0.001, favoring the intervention); dFVC is recorded here in prose because no output slot holds a within-group delta and computing a decline rate would violate the no-computed-deltas rule. Symptom prevalences at follow-up (no SOMA slot, prose only; Table 3, n = 907): coughing 18.2% traditional vs 7.5% ICS (P = 8.3e-04) and mucus 13.2% vs 4.8% (P = 8.7e-04) were significantly lower in the ICS arm; chest tightness (12.3% vs 6.7%, P = 4.5e-01), wheezing (5.4% vs 2.7%, P = 3.6e-01) and ocular itchiness (6.4% vs 3.2%, P = 3.5e-01) were lower without statistical significance. The Results text prints different symptom percentages (coughing 29% vs 19%; mucus 13% vs 22%) whose mucus figures contradict the reduction they illustrate; Table 3 values are taken as primary. PEF unit note: the paper prints PEF in L; PEF is a flow conventionally in L/s, but the unit is recorded as printed rather than silently normalised."
