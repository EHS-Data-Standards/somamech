  - id: "GE:kim-claudin1-h292-24h"
    name: "Claudin-1, ZO-1 and E-cadherin protein after CLB 2.0 with and without IL-6, NCI-H292 cells"
    description: "Western blot of tight junction proteins in NCI-H292 cells treated with CLB 2.0 (10 mg/ml) or CLB 2.0 plus IL-6 (30 ng/ml) for 24 h, with tubulin as loading control. Claudin-1 was inhibited by CLB 2.0 and the cotreatment inhibited it dramatically further. NULL RESULT: ZO-1 and E-cadherin were not changed by either treatment, so the effect is specific to Claudin-1 among the three tight junction proteins examined. A companion transfection arm (Fig. 2B) showed recombinant IL-6 with CLB 2.0 completely diminished Claudin-1 while siRNA-IL-6 only partially inhibited it, placing secreted IL-6 as a required co-factor. Blots are figure panels with no densitometry values, so protein_level is left unfilled."
