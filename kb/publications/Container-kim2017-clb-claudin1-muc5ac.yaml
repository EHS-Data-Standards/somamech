      name: "Mucin hypersecretion"
      biological_action: increased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: strong
    evidence:
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Interestingly, ectopic overexpressed Claudin-1 dramatically inhibited MUC5AC gene expression, but siRNA-Claudin 1 increased the CLB2.0-induced MUC5AC gene expression."
        explanation: "Bidirectional genetic evidence: restoring Claudin-1 suppressed MUC5AC and removing it raised MUC5AC further, which is the causal link this relationship asserts."
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Our data also suggest that secreted IL-6 regulates CLB2.0-induced MUC5AC and MUC1 expression via ROS-mediated downregulation of claudin-1 expression to maintain mucus homeostasis in the airway."
        explanation: "The paper's own summary routing the mucin response through the downregulation of Claudin-1."
