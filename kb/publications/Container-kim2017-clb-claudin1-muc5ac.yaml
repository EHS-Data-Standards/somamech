  - id: "GCM:kim-muc5ac-mrna-il6-24h"
    name: "MUC5AC mRNA after CLB 2.0 with and without IL-6"
    description: "qRT-PCR for MUC5AC transcript 24 h after treatment with CLB 2.0 (10 mg/ml), IL-6 (30 ng/ml), or both. MUC5AC gene expression increased significantly with the cotreatment of CLB 2.0 and IL-6 compared with CLB 2.0 alone, establishing that the IL-6 the cells secrete amplifies the mucin response rather than merely accompanying it. Reported as a bar chart (Fig. 1D) with significance marked only as P < 0.05; no fold-change values are tabulated, so muc5ac_mrna_expression is left unfilled."
    evidence:
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Interestingly, MUC5AC gene expression increased significantly by the cotreatment of CLB 2.0 and IL-6 compared to CLB 2.0 alone (Fig. 1D), but the MUC1 gene expression dramatically decreased by the cotreatment of CLB 2.0 and IL-6 (Fig. 1E)."
