    description: "NCI-H292 cells transfected with a wild-type Claudin-1 construct or Claudin-1-specific siRNA, then treated with CLB 2.0 (10 mg/ml) for 24 h before qRT-PCR for MUC5AC. Ectopic Claudin-1 dramatically inhibited MUC5AC gene expression while siRNA-Claudin-1 increased the CLB 2.0-induced MUC5AC, placing Claudin-1 as a negative regulator of the mucin response. This is the paper's central result: the loss of Claudin-1 caused by CLB 2.0 is itself what permits MUC5AC to rise. Reported as a bar chart (Fig. 2C) with significance marked only as P < 0.05; no fold-change values are tabulated."
