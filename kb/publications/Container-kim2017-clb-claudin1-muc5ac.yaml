# =============================================================================
# Kim et al. (2017) - Airborne particulate matter increases MUC5AC expression
# by downregulating Claudin-1 expression in human airway cells
# =============================================================================
#
# Source: BMB Rep. 2017;50(10):516-521
# DOI: 10.5483/bmbrep.2017.50.10.100
#
# Study design (in vitro only):
#   - Normal human bronchial/nasal epithelial cells (the paper writes
#     "normal human bronchial epithelial (NHNE) cells" and then refers to
#     them as NHNE throughout; the inconsistency is the paper's own) for the
#     cytokine array, IL-6 Western blot/ELISA and the MUC5AC/MUC1 qRT-PCR of
#     Fig. 1
#   - NCI-H292 human lung mucoepidermoid carcinoma cells for every
#     mechanistic arm (Figs. 2-4); the paper states the NHNE results were
#     reproduced in NCI-H292 cells and that primary cells had technical
#     limitations
#   - Exposure agent is CLB 2.0: carboxyl latex beads (Thermo Fisher C37278),
#     carboxyl charge-stabilized hydrophobic polystyrene microspheres with
#     sizes from 0.02 to 2.0 um, used as a defined surrogate for airborne
#     particulate matter because PM2.5 composition is variable. Recorded with
#     exposure_agent CHEBI:53276 (poly(styrene)), not an ENVO particulate
#     matter term, because the material actually applied was polystyrene
#     beads and not collected PM.
#   - Concentrations/durations from the figure legends: CLB 2.0 10 mg/ml;
#     recombinant IL-6 30 ng/ml; N-acetyl-cysteine (NAC) 1 mM with 1 h
#     pretreatment; 4 h for IL-6 secretion, 24 h for mucin/Claudin-1
#     readouts, 5 min for ROS, 15 min for ERK1/2 phosphorylation
#   - Genetic manipulation: wild-type overexpression constructs and
#     target-specific siRNA for IL-6, Claudin-1 and ERK1/2
#   - Statistics: mean +/- S.D. of at least three independent experiments,
#     Wilcoxon Mann-Whitney test, significance reported only as P < 0.05
#
# Key findings:
#   - CLB 2.0 induced dose- and time-dependent extracellular IL-6 secretion,
#     peaking at 4 h
#   - Cotreatment with CLB 2.0 and IL-6 increased MUC5AC and decreased MUC1
#     mRNA relative to CLB 2.0 alone
#   - Claudin-1 protein was inhibited by CLB 2.0 and further inhibited by
#     CLB 2.0 + IL-6; ZO-1 and E-cadherin were NOT changed (null result)
#   - Claudin-1 overexpression suppressed MUC5AC and raised MUC1; siRNA
#     Claudin-1 did the reverse
#   - ROS peaked 5 min after CLB 2.0 and did not affect cell viability; NAC
#     restored Claudin-1 and lowered IL-6 and MUC5AC while raising MUC1
#   - ERK1/2 (not p38, not JNK) was phosphorylated, maximal at 15 min, in a
#     ROS-dependent way; wild-type ERK1/2 suppressed Claudin-1 and MUC1 and
#     raised MUC5AC, siRNA-ERK1/2 did the reverse
#
# Provenance of numbers: this paper reports NO numeric measurement values in
# its text - every quantitative result is a figure panel (cytokine array
# spots, Western blots, bar charts) with no values or densitometry tabulated.
# Per the extraction rule against deriving values from figures, the output
# records therefore carry no measurement slots; they record the experimental
# group, the exposure condition it was measured under, and the direction of
# the effect as the paper states it. For the same reason there is no
# response_comparisons section: the paper states directions but never a
# magnitude, and a change value must not be invented or computed here.
# Concentrations, durations and reagent identities come from the Materials
# and Methods section and the figure legends, which do state them.
#
# Every snippet below is verbatim from the committed full text in
# references_cache/PMID_28946937.md (content_type: full_text_pdf).
#
# KEY EVENT NOTE: KE:ke-erk-activation is newly minted by this file. The
# corpus had no ERK/MAPK key event (the existing KE:ke1-egfr-activation is
# EGFR-specific and this paper involves no EGFR), and ERK1/2 is the switch
# molecule the paper's central claim rests on. The block is kept to the four
# minimal fields so the next paper can reuse it verbatim.
#
# =============================================================================

source_publication:
  reference: "PMID:28946937"
  reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
  doi: "10.5483/bmbrep.2017.50.10.100"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:kim-cytokine-array"
    protocol_type: MolecularAssayProtocol
    name: "Human cytokine array of conditioned medium"
    description: "Cytokine assay performed with a Human Cytokine Array Panel A kit (R&D Systems) according to the manufacturer's instructions. Serum-starved cells were treated with CLB2 for 4 h; after treatment the supernatant was assayed according to the kit instructions. Run on cell culture medium in a dose-dependent manner and as a time course. Results are reported as array spot panels with no tabulated signal intensities."
    detection_method: "membrane-based sandwich immunoassay (cytokine array)"
    equipment_required:
      - "Human Cytokine Array Panel A kit (R&D Systems)"

  - id: "PROTOCOL:kim-elisa-il6"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for IL-6 in cell supernatant"
    description: "Cells were treated with CLB 2.0 for 4 h and their supernatants were collected; IL-6 levels in the cell supernatants were measured by ELISA. The ELISA kit and the purified IL-6 cytokine used as standard/treatment were purchased from R&D Systems. Results are reported as bar charts without tabulated concentrations."
    detection_method: "sandwich ELISA"
    equipment_required:
      - "IL-6 ELISA kit (R&D Systems)"

  - id: "PROTOCOL:kim-wb-il6"
    protocol_type: MolecularAssayProtocol
    name: "Western blot for IL-6"
    description: "After treatment of the cells with CLB 2.0 for 4 h, total cell lysates were analyzed by Western blot analysis with specific anti-IL-6 antibody. No densitometry values are reported; the blots are shown as figure panels only."
    detection_method: "immunoblot with specific anti-IL-6 antibody"
    antibodies_used:
      - "anti-IL-6 (specific antibody; supplier not stated in the paper)"

  - id: "PROTOCOL:kim-wb-tj"
    protocol_type: MolecularAssayProtocol
    name: "Western blot for tight junction proteins Claudin-1, ZO-1 and E-cadherin"
    description: "After the cells were treated with CLB 2.0 (10 mg/ml) or CLB 2.0 and IL-6 (30 ng/ml) for 24 h, Western blot analysis was performed with specific Claudin-1, ZO-1 and E-cadherin antibodies. Tubulin was used as the loading control. Blots are shown as figure panels with no densitometry values."
    detection_method: "immunoblot"
    normalization_method: "tubulin loading control"
    antibodies_used:
      - "anti-Claudin-1"
      - "anti-ZO-1"
      - "anti-E-cadherin"
      - "anti-tubulin (loading control)"

  - id: "PROTOCOL:kim-wb-mapk"
    protocol_type: MolecularAssayProtocol
    name: "Western blot for MAPK phosphorylation (ERK1/2, p38, JNK)"
    description: "Cells were treated with CLB 2.0 in a time-dependent manner and Western blots were performed with phospho-specific antibodies to detect MAPK activation (ERK1/2, p38 and JNK). Tubulin was used as the loading control. For the ROS-dependence arm, cells were treated with CLB 2.0 (10 mg/ml) or CLB 2.0 and NAC (1 mM; pretreatment for one hour) for 15 min before blotting for ERK1/2 phosphorylation. Blots are shown as figure panels with no densitometry values."
    detection_method: "immunoblot with phospho-specific antibodies"
    normalization_method: "tubulin loading control"
    antibodies_used:
      - "anti-phospho-ERK1/2"
      - "anti-phospho-p38"
      - "anti-phospho-JNK"
      - "anti-tubulin (loading control)"

  - id: "PROTOCOL:kim-qpcr-muc5ac"
    protocol_type: MolecularAssayProtocol
    name: "Real-time PCR for MUC5AC"
    description: "Real-time PCR performed using a BioRad iQ iCycler Detection System (BioRad Laboratories; Hercules, CA) with iQ SYBR Green Supermix. Reactions were performed in a total volume of 20 ul, including 10 ul 2x SYBR Green PCR Master Mix, 300 nM of each primer, and 1 ul of the previously reverse-transcribed cDNA template. Total RNA was collected 24 h after treatment. The paper does not publish the MUC5AC primer sequences or the reference gene."
    detection_method: "SYBR Green real-time PCR"
    equipment_required:
      - "BioRad iQ iCycler Detection System (BioRad Laboratories)"
      - "iQ SYBR Green Supermix"

  - id: "PROTOCOL:kim-qpcr-muc1"
    protocol_type: MolecularAssayProtocol
    name: "Real-time PCR for MUC1"
    description: "Real-time PCR performed using a BioRad iQ iCycler Detection System (BioRad Laboratories; Hercules, CA) with iQ SYBR Green Supermix. Reactions were performed in a total volume of 20 ul, including 10 ul 2x SYBR Green PCR Master Mix, 300 nM of each primer, and 1 ul of the previously reverse-transcribed cDNA template. Total RNA was collected 24 h after treatment. The paper does not publish the MUC1 primer sequences or the reference gene."
    detection_method: "SYBR Green real-time PCR"
    equipment_required:
      - "BioRad iQ iCycler Detection System (BioRad Laboratories)"
      - "iQ SYBR Green Supermix"

  - id: "PROTOCOL:kim-ros-flow"
    protocol_type: MolecularAssayProtocol
    name: "Intracellular ROS measurement by DCF flow cytometry"
    description: "Cells were pre-incubated in the presence of DCFH-DA (50 uM) for 30 min and then exposed to CLB 2.0 for the indicated times. Cell-associated DCF fluorescence levels were analyzed by flow cytometry. For the IL-6 cotreatment arm the cells were treated with CLB 2.0 (10 mg/ml) or CLB 2.0 and IL-6 (30 ng/ml) for 5 min before flow cytometry. Results are reported as bar charts with no tabulated fluorescence values."
    detection_method: "flow cytometry of DCF fluorescence"
    equipment_required:
      - "flow cytometer"
      - "DCFH-DA probe"

  - id: "PROTOCOL:kim-viability-cck8"
    protocol_type: MolecularAssayProtocol
    name: "Cell proliferation / viability assay (CCK-8)"
    description: "Cells were pre-incubated in the presence of N-acetyl-cysteine (NAC) for 1 h in a dose-dependent manner and then treated with CLB 2.0 for 1 h. Cell proliferation assay was performed with CCK-8 (Dojindo; Rockville, MD)."
    detection_method: "CCK-8 colorimetric viability assay"
    equipment_required:
      - "CCK-8 kit (Dojindo)"
      - "microplate absorbance reader"

  - id: "PROTOCOL:kim-transfection"
    protocol_type: MolecularAssayProtocol
    name: "Transient transfection with wild-type constructs or target-specific siRNA"
    description: "Cells were transfected with either a construct driving the expression of the wild-type protein or an siRNA specific for the same target, then treated with CLB 2.0 (10 mg/ml) before harvest. Used for IL-6 (4 h before lysis, Claudin-1 blot), Claudin-1 (24 h before qRT-PCR for MUC5AC and MUC1) and ERK1/2 (24 h before qRT-PCR for MUC5AC and MUC1). The paper does not state the transfection reagent, vector backbone or siRNA sequences."

