oxidative_stress_assays:
  - id: "OX:kim-clb20-ros-h292"
    name: "Intracellular ROS production after CLB 2.0 in NCI-H292 cells"
    description: "DCF flow cytometry time course in NCI-H292 cells exposed to CLB 2.0. ROS production peaked at 5 min and had already declined by 10 min, and it did not affect cell viability (CCK-8, NAC dose series). Cotreatment of CLB 2.0 with IL-6 (30 ng/ml) raised ROS production well above CLB 2.0 alone. The paper reports these panels as bar charts only (Fig. 3A-C) with no fluorescence values or fold changes, so no measurement slots are filled."
    ros_probe_type: "2',7'-dichlorofluorescein diacetate (DCFH-DA), 50 uM, 30 min pre-incubation; cell-associated DCF fluorescence read by flow cytometry"
    evidence:
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "ROS production picked at 5 min and then decreased at 10 min (Fig. 3A)."
        explanation: "States the ROS time course - a peak at 5 min falling by 10 min - that this assay's two treated output records capture."
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In addition, ROS production was unaffected cell viability (Fig. 3B)."
        explanation: "States that the ROS burst did not compromise viability, so the downstream effects recorded elsewhere in this file are not a cytotoxicity artefact."
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
