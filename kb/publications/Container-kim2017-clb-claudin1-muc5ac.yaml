# =============================================================================
# KEY EVENT RELATIONSHIPS
#
# The pathway the paper assembles:
#   CLB 2.0 -> ROS -> IL-6 secretion and ERK1/2 activation
#           -> Claudin-1 downregulation -> MUC5AC up / MUC1 down
#
# Each link below is supported by an inhibitor or genetic reversal, which is
# why the evidence_support is strong rather than correlational.
# =============================================================================

key_event_relationships:
  - id: "KER:kim-ros-to-inflammation"
    name: "Increased oxidative stress leads to airway inflammation via IL-6 secretion"
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    relationship_type: "directly leads to"
    evidence_support: strong
    evidence:
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "These results suggest that ROS production is not only critical for the inhibition of Claudin-1 and the activation of MUC5AC gene expression in response to CLB2.0, but also essential for CLB 2.0-induced secretion extraracellularly of IL-6."
        explanation: "The paper's own conclusion that ROS production is essential for CLB 2.0-induced IL-6 secretion, which is the causal direction this relationship asserts. (The spelling 'extraracellularly' is the paper's.)"
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "CLB2.0-induced IL-6 secretion was mediated by ROS."
        explanation: "The abstract's one-line statement of the same link."

  - id: "KER:kim-ros-to-erk"
    name: "Increased oxidative stress leads to ERK1/2 activation"
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-erk-activation"
      name: "ERK1/2 activation"
      biological_action: activated
      level_of_biological_organization: molecular
    relationship_type: "directly leads to"
    evidence_support: strong
    evidence:
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "NAC dramatically decreased CLB2.0-induced ERK1/2 activation, suggesting that ROS might be critical for CLB 2.0-induced ERK1/2 activation."
        explanation: "Scavenger reversal: removing ROS with NAC abolished the ERK1/2 activation, which is the causal link this relationship asserts."
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "CLB2.0 activated the ERK1/2 MAPK via a ROS-dependent pathway."
        explanation: "The abstract's statement that the ERK1/2 activation runs through a ROS-dependent pathway."

  - id: "KER:kim-inflammation-to-barrier"
    name: "Airway inflammation leads to loss of epithelial barrier integrity via Claudin-1 downregulation"
    upstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    downstream_event:
      id: "KE:ke-epithelial-barrier"
      name: "Altered epithelial barrier integrity"
      biological_action: decreased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: strong
    evidence:
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "IL-6 and CLB2.0 completely diminished Claudin-1 expression, whereas siRNA-IL-6 partially inhibited Claudin-1 expression, suggesting that both CLB2.0 and secreted IL-6 could completely decrease Claudin-1 expression (Fig. 2B)."
        explanation: "Knockdown reversal: silencing the inflammatory cytokine IL-6 blunted the Claudin-1 loss, which is the causal link this relationship asserts."
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Claudin-1 expression was inhibited by CLB 2.0, and the cotreatment of CLB2.0 and IL-6 dramatically inhibited Claudin-1 expression, but not ZO-1 and E-cadherin expression (Fig. 2A)."
        explanation: "Adding IL-6 deepened the Claudin-1 loss, the dose-wise counterpart to the knockdown result."

  - id: "KER:kim-erk-to-barrier"
    name: "ERK1/2 activation leads to loss of epithelial barrier integrity via Claudin-1 downregulation"
    upstream_event:
      id: "KE:ke-erk-activation"
      name: "ERK1/2 activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-epithelial-barrier"
      name: "Altered epithelial barrier integrity"
      biological_action: decreased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: strong
    evidence:
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "ERK1/2 downregulated the claudin-1 and MUC1 expressions, whereas it dramatically increased CLB2.0-induced MUC5AC expression."
        explanation: "The abstract's statement that ERK1/2 downregulates Claudin-1, which is the causal direction this relationship asserts."
      - reference: "PMID:28946937"
        reference_title: "Airborne particulate matter increases MUC5AC expression by downregulating Claudin-1 expression in human airway cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "However, siRNA-ERK1/2 significantly increased CLB2.0-induced Claudin-1 and MUC1 expression and dramatically decreased MUC5AC gene expression (Fig. 4C)."
        explanation: "Knockdown reversal: silencing ERK1/2 restored Claudin-1, the bidirectional evidence that makes this link strong."

  - id: "KER:kim-barrier-to-mucin"
    name: "Loss of epithelial barrier integrity leads to mucin hypersecretion"
    upstream_event:
      id: "KE:ke-epithelial-barrier"
      name: "Altered epithelial barrier integrity"
      biological_action: decreased
      level_of_biological_organization: cellular
    downstream_event:
