response_comparisons:

  # --- Mucociliary transport ------------------------------------------------

  - id: "COMP:carvalho-mct-tsp"
    name: "Mucociliary transport, total suspended particles vs Ringer's control"
    description: >-
      The paper states that exposure to total suspended particles decreased
      mucociliary transport. No effect size, statistic or p-value is reported
      in the cached reference, so only the direction is recorded.
    derived_from_assay: "MCC:carvalho-frog-palate-transport"
    compared_measurement: "transport_rate"
    control_output: "MCC:carvalho-frog-palate-transport-output-control"
    treated_output: "MCC:carvalho-frog-palate-transport-output-tsp"
    change_direction: decreased
    derivation: reported_in_paper

  - id: "COMP:carvalho-mct-pm3p0"
    name: "Mucociliary transport, PM2.5 at 3.0 mg/mL vs Ringer's control"
    description: >-
      The paper states that exposure to PM3.0 — urban ambient PM2.5 at
      3.0 mg/mL — decreased mucociliary transport. Direction only; no effect
      size or p-value is reported.
    derived_from_assay: "MCC:carvalho-frog-palate-transport"
    compared_measurement: "transport_rate"
    control_output: "MCC:carvalho-frog-palate-transport-output-control"
    treated_output: "MCC:carvalho-frog-palate-transport-output-pm3p0"
    change_direction: decreased
    derivation: reported_in_paper

  # --- Ciliary beating frequency -------------------------------------------

