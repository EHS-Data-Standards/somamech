    name: "Ciliary beating frequency, total suspended particles vs Ringer's control"
    description: >-
      Ciliary beating frequency was diminished by total suspended particles,
      and the paper states the effect was present at all times during
      exposure. Direction only; no frequency values or p-values are reported.
