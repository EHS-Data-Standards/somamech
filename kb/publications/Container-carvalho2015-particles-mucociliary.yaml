# =============================================================================
# Carvalho-Oliveira et al. (2015) — "Chemical composition modulates the
# adverse effects of particles on the mucociliary epithelium."
# Clinics (Sao Paulo) 70(10). PMID:26598085. DOI 10.6061/clinics/2015(10)09
# =============================================================================
#
# Cached reference content_type: full_text_html. The payload retrieved by
# `just fetch-reference` is the structured abstract (OBJECTIVE / METHOD /
# RESULTS / CONCLUSION) plus publisher landing-page boilerplate; the article
# body was not part of it. Every snippet below is therefore quoted from the
# structured abstract, which is the copy committed to references_cache/ and
# the copy CI resolves quotes against.
#
# Study design:
#   Ex vivo frog palate preparations immersed in one of four solutions:
#     - amphibian Ringer's solution (control)
#     - total suspended particles (TSP), 0.1 mg/mL — collected from the
#       electrostatic precipitator of a steel mill
#     - urban ambient PM2.5, 0.1 mg/mL ("PM0.1")
#     - urban ambient PM2.5, 3.0 mg/mL ("PM3.0")
#   Three mucociliary endpoints were quantified by morphometry: mucociliary
#   transport, ciliary beating frequency, and the amount of acid and neutral
#   mucous in epithelial cells. Particle composition was characterised by
#   X-ray fluorescence and gas chromatography/mass spectrometry.
#
# What is and is not recorded here:
#   - The abstract reports every outcome QUALITATIVELY — a direction of
#     change, never a number. So the output records below carry
#     experimental_group and measured_under but NO QuantityValues, and the
#     directions are recorded at the analysis layer in response_comparisons
#     with change_direction and derivation: reported_in_paper, with no
#     change_value. This follows the pattern already on main for
#     direction-only results (e.g. Container-lindner2018-cbnp-allergic-asthma).
#   - The exposure concentrations ARE quantitative and are recorded as such.
#   - The paper also reports that PM2.5 reduced EPITHELIUM THICKNESS. No
#     assay output class in the schema carries an epithelial-thickness slot
#     (mucus_layer_thickness is the mucus layer, not the epithelium), so that
#     finding is recorded in the mucus assay's description and in a quoted
#     evidence snippet, but not as a response_comparison — inventing a
#     compared_measurement string that is not a real output slot would break
#     consumers keyed on slot names.
#   - The mucous comparisons use compared_measurement:
#     mucin_protein_concentration, which is an APPROXIMATION. The paper
#     measured the morphometric AREA or amount of acid and neutral mucous
#     within epithelial cells histochemically, not a mucin protein
#     concentration; GobletCellOutput has no slot for histochemical mucous
#     content, and mucin_protein_concentration is the nearest real slot. Since
#     no value is recorded — only a direction — the approximation costs no
#     numeric fidelity, but a consumer reading the slot name literally should
#     know the readout was morphometry, not a protein assay.
#   - The paper asserts no key-event-to-key-event causal link in its own
#     voice, so there is no key_event_relationships section.
#
# Every `informs_on_key_event:` block below is copied byte-for-byte from the
# wording already on origin/main (shared vocabulary — never re-authored).
# Variant counts at time of extraction: KE:ke3-impaired-mcc, KE:ke-decreased-cbf
# and KE:ke-mucin-hypersecretion were each unanimous across kb/ and
# tests/data/valid/.
#
# Note on KE:ke-mucin-hypersecretion: this paper reports a DECREASE in
# epithelial mucous, while the shared key event node is worded "Mucin
# hypersecretion" / increased. The node is the AOP vocabulary term the assay
# informs on, not a claim about this paper's direction; the direction this
# paper found is carried by the response_comparisons entries. The block is
# reused verbatim rather than re-worded, per the extraction rules.
# =============================================================================

source_publication:
  reference: "PMID:26598085"
  reference_title: "Chemical composition modulates the adverse effects of particles on the mucociliary epithelium."
  doi: "10.6061/clinics/2015(10)09"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:carvalho-frog-palate-exposure-001"
    protocol_type: Protocol
    name: "Frog palate preparation and immersion exposure to particle suspensions"
    description: >-
      Ex vivo frog palate preparations were immersed in one of four solutions:
      total suspended particles at 0.1 mg/mL, urban ambient particulate matter
      of 2.5 micrometres at 0.1 mg/mL (PM0.1) or 3.0 mg/mL (PM3.0), or
      amphibian Ringer's solution as the control. Immersion times, replicate
      counts and preparation details are not reported in the cached reference
      and are therefore not recorded.

  - id: "PROTOCOL:carvalho-mct-morphometry-001"
    protocol_type: ImagingProtocol
    name: "Morphometric quantification of mucociliary transport on the frog palate"
    description: >-
      Mucociliary transport was quantified through morphometry of frog palate
      preparations. Acquisition parameters and the transport-rate units are not
      reported in the cached reference.

  - id: "PROTOCOL:carvalho-cbf-morphometry-001"
    protocol_type: ImagingProtocol
    name: "Morphometric quantification of ciliary beating frequency on the frog palate"
    description: >-
      Ciliary beating frequency was quantified through morphometry of frog
      palate preparations, measured repeatedly over the course of exposure —
      the paper reports the effect of total suspended particles as present at
      all times during exposure. Sampling schedule and frequency units are not
      reported in the cached reference.

  - id: "PROTOCOL:carvalho-mucous-morphometry-001"
    protocol_type: StainingProtocol
    name: "Morphometric quantification of acid and neutral mucous in epithelial cells"
    description: >-
      The amount of acid and neutral mucous in epithelial cells was quantified
      through morphometry of frog palate preparations. The abstract does not
      name the histochemical stains used (acid and neutral mucins are
      conventionally distinguished by Alcian blue and periodic acid-Schiff, but
      the cached reference does not state this, so no stain is recorded).

  - id: "PROTOCOL:carvalho-particle-composition-001"
    protocol_type: MolecularAssayProtocol
    name: "Particle chemical composition by X-ray fluorescence and GC/MS"
    description: >-
      Particle chemical compositions were determined by X-ray fluorescence and
      gas chromatography/mass spectrometry. Total suspended particles showed a
      predominance of Fe and no organic compounds; the PM2.5 sample contained
      predominant amounts of S, Fe and Si and, to a lesser extent, Cu, Ni, V,
      Zn and organic compounds. The abstract reports no elemental
      concentrations, so no measurements are recorded from this protocol.

