    name: "Ciliary beating frequency, PM2.5 at 0.1 mg/mL vs Ringer's control"
    description: >-
      NULL RESULT. The paper reports that particulate matter of 2.5 micrometres
      did not elicit changes in ciliary beating frequency; the statement is
