    description: "Each IQR increase (5.80 ug/m3) in measured indoor PM2.5 from the weekly integrated filter was associated with a 4.64 mL decrease in pre-bronchodilator FEV1 (95% CI: -23.39, 14.11) - smaller in magnitude than the indoor BC association and less precise (the CI spans zero). Continuous-exposure regression coefficient; no control/treated output pair exists (see section note)."
