# =============================================================================
# Hart et al. (2018) - Effects of Indoor and Ambient Black Carbon and PM2.5 on
# Pulmonary Function among Individuals with COPD
# =============================================================================
#
# Source: Environ Health Perspect. 2018;126(12):127008
# DOI: 10.1289/EHP3668
# PMID: 30570336
#
# Study design (HUMAN OBSERVATIONAL — longitudinal panel study, not in vitro,
# not an animal experiment):
#   - The COPD and Air Pollution Study, Eastern Massachusetts, November 2012 to
#     December 2014
#   - 125 patients with COPD (mean age 73.4 +/- 8.6 y, mostly white males,
#     recruited from VA Boston), not currently smoking, not living with a
#     smoker, and without major known indoor combustion sources
#   - Up to four clinic visits per participant approximately 3 months apart;
#     367 study visits in all, each with pre- and post-bronchodilator (180 ug
#     albuterol) spirometry
#   - For the week before each visit, indoor PM2.5 and black carbon (BC) were
#     measured in each home on a weekly integrated Teflon filter (Harvard
#     Personal Exposure Monitor, 2.5 um cutoff; BC by reflectometry); daily
#     ambient BC and PM2.5 came from a central site monitor (Countway Medical
#     Library, Boston), which also supplied the weights used to estimate daily
#     indoor exposures (lag0 to lag3)
#
# IMPORTANT — WHAT THE EXPOSURE CONTRAST ACTUALLY IS:
#   This is a continuous-exposure panel study. There is NO unexposed control
#   group and no two-group contrast anywhere in the paper: every headline
#   number is a mixed-effects regression coefficient — the change in a
#   pulmonary function measure per interquartile range (IQR) increase in an
#   exposure. Those reported-in-paper effect estimates are recorded below as
#   response_comparisons WITHOUT control_output/treated_output references,
#   because no pair of output records exists for them to point at; each
#   comparison's description says exactly what the coefficient is. The only
#   within-assay grouping is pre- vs post-bronchodilator spirometry, modelled
#   as two output records (baseline / treated) as in the pre/post fixture.
#
# Key findings recorded here:
#   - Median (IQR) indoor BC 0.19 (0.22) ug/m3; indoor PM2.5 6.67 (5.80) ug/m3
#     — very low-level exposures
#   - Each IQR increase in weekly indoor BC was associated with a 17.87 mL
#     decrease in pre-bronchodilator FEV1 (95% CI: -33.76, -1.98) — about the
#     FEV1 decrease associated with an additional 1.5 y of age
#   - Each IQR increase in weekly indoor PM2.5 was associated with a smaller,
#     less precise 4.64 mL decrease in pre-bronchodilator FEV1 (95% CI:
#     -23.39, 14.11)
#   - Indoor and ambient PM2.5 were associated with decreases in FVC (from
#     -5.85 mL for lag1 ambient to -21.28 mL for lag0 indoor, per IQR)
#   - Indoor BC was associated with lower FEV1/FVC for all time periods;
#     ambient BC showed no consistent association with any measure
#   - Neither indoor nor ambient BC or PM2.5 were associated with
#     post-bronchodilator pulmonary function
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:30570336"
  reference_title: "Effects of Indoor and Ambient Black Carbon and PM2.5 on Pulmonary Function among Individuals with COPD."
  doi: "10.1289/EHP3668"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:hart-spirometry-001"
    name: "Pre- and post-bronchodilator spirometry per American Thoracic Society methods"
    description: "Spirometry (HDpft 1000; Nspire) performed pre- and post-180 ug of albuterol (2 puffs) administered by a valved spacer, using American Thoracic Society methods (Miller et al. 2005). The highest values of pre- and post-bronchodilator FEV1 and FVC from acceptable efforts were used. Usual bronchodilator medications were not withheld before testing. All visits were scheduled with the participant in stable clinical status (a minimum of 2 weeks after completion of antibiotics or steroids for a COPD exacerbation)."
    spirometry_standard: "American Thoracic Society methods (Miller et al. 2005)"
    bronchodilator_agent: "albuterol"
    bronchodilator_dose:
      value: "180"
      unit:
        id: "UO:0000023"
        name: "microgram"
    equipment_required:
      - "HDpft 1000 spirometer (Nspire)"

  - id: "PROTOCOL:hart-indoor-sampling-001"
    name: "In-home weekly integrated filter sampling of PM2.5 and black carbon"
    description: "For the week prior to each clinic visit, participants placed a small particle sampler in the room where they spent most time (excluding the kitchen) to collect PM2.5 on Teflon filters. Sampler pumps (VP0140; Medo USA) were preset to a flow rate of 1.8 L/min and used a Harvard Personal Exposure Monitor with a size-selective impactor to collect particles with a 2.5 um cutoff (Demokritou et al. 2001). Teflon filters were equilibrated in a temperature- and humidity-controlled room and weighed on a Mettler MT5 electronic microbalance before and after sampling (gravimetric PM2.5). BC was measured on the same filters with an EEL M43D Smokestain Reflectometer (Diffusion Systems), which determines the blackness of PM filter samples; each filter served as its own blank. Concentrations were calculated by dividing net micrograms by the total volume of air sampled. The sampler ran indoors for a mean of 7.6 days (range 4-10)."
    equipment_required:
      - "Harvard Personal Exposure Monitor with size-selective impactor (2.5 um cutoff)"
      - "VP0140 sampler pump (Medo USA), 1.8 L/min"
      - "Mettler MT5 electronic microbalance"
      - "EEL M43D Smokestain Reflectometer (Diffusion Systems)"

  - id: "PROTOCOL:hart-ambient-monitoring-001"
    name: "Central site ambient monitoring and estimation of daily indoor exposures"
    description: "Daily measures of outdoor BC and PM2.5 were available from the monitor located on top of the Countway Medical Library in Boston, Massachusetts (Kang et al. 2010). The daily central-site values were used as weights to estimate daily indoor values for each home (Indoor daily = Outdoor measured daily / Outdoor measured weekly x Indoor measured weekly), yielding estimated indoor concentrations on the day of spirometry (lag0) and the 3 days before testing (lags 1-3). Daily estimates were calculated only for the days each participant ran the sampler. BC at this central site captures temporal variability of BC at sites throughout Eastern Massachusetts (Gryparis et al. 2007; Tang et al. 2018), and fine-particle infiltration varies little over 7 days (Brown et al. 2009), so in the absence of significant indoor sources, indoor levels are assumed proportional to outdoor levels."
    equipment_required:
      - "Central site monitor, Countway Medical Library, Boston, Massachusetts"

# =============================================================================
# LUNG FUNCTION ASSAY — pre- and post-bronchodilator spirometry across 367
# visits from 125 COPD patients, with indoor (weekly integrated filter) and
# ambient (central site) BC and PM2.5 exposure characterization.
#
# The pre/post-bronchodilator pair follows the per-condition output pattern:
# the pre-bronchodilator record is the baseline state, the post-albuterol
# record the treated state. The air-pollution exposures are continuous
# covariates, not assigned groups, so no output record points at them; their
# distributions are recorded on the exposure conditions and their effect
# estimates in response_comparisons below.
# =============================================================================

lung_function_assays:
  - id: "LF:hart-copd-spirometry"
    name: "Pre- and post-bronchodilator spirometry in COPD patients with indoor and ambient BC/PM2.5 exposure assessment"
    description: "Longitudinal panel spirometry in the COPD and Air Pollution Study: 367 visits from 125 COPD patients in Eastern Massachusetts (2012-2014), each visit preceded by a week of in-home PM2.5 and BC filter sampling. Cohort averages across visits: pre-bronchodilator FEV1 1.82 +/- 0.60 L, FVC 3.32 +/- 0.80 L, FEV1/FVC 0.55 +/- 0.13; post-bronchodilator FEV1 1.93 +/- 0.16 L, FVC 3.46 +/- 0.81 L, FEV1/FVC 0.56 +/- 0.13 (values as printed in the paper; the post-bronchodilator FEV1 SD of 0.16 L is anomalously small next to the pre-bronchodilator SD of 0.60 L and may be a typo in the source, but is recorded as printed). Exposure distributions: average indoor PM2.5 on the integrated filter 8.61 +/- 6.34 ug/m3 [median (IQR) = 6.67 (5.80)]; average indoor BC 0.24 +/- 0.28 ug/m3 [median (IQR) = 0.19 (0.22)]; average indoor/outdoor ratio 1.48 +/- 1.20 for PM2.5 and 0.46 +/- 0.67 for BC. Associations between exposures and pulmonary function (per-IQR mixed-model effect estimates) are recorded in response_comparisons. Neither indoor nor ambient BC or PM2.5 were associated with post-bronchodilator pulmonary function; the authors suggest associations might have been attenuated or masked in participants who used a short-acting bronchodilator prior to clinic visits."
