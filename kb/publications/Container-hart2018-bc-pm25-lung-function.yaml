# =============================================================================
# RESPONSE COMPARISONS — the paper's reported per-IQR effect estimates.
#
# MODELLING NOTE: these are multivariable adjusted mixed-effects regression
# coefficients (change in a pre-bronchodilator pulmonary function measure per
# IQR increase in a continuous exposure), reported directly in the paper.
# There is no control group and no treated group, so control_output and
# treated_output are deliberately omitted: no pair of output records exists
# for a continuous-exposure coefficient to point at, and fabricating group
# records would invent data the paper does not contain. change_value carries
# the signed beta exactly as its 95% CI is printed (the paper words the first
# two as a "17.87 ... mL decrease" and a "4.64 ... mL decrease"; the betas are
# negative, matching their CIs). Models were adjusted for age, gender, race,
# height (FEV1/FVC models excepted), BMI, season, ambient temperature and
# relative humidity on the day of spirometry, pulmonary medication use,
# self-reported cold or illness in the past 2 weeks, and individual-level
# socioeconomic status, with a random intercept per participant. Exact
# p-values are not reported, so p_value is omitted.
# =============================================================================

response_comparisons:
  - id: "COMP:hart-indoor-bc-fev1-pre"
    name: "Change in pre-bronchodilator FEV1 per IQR increase in weekly indoor BC"
    description: "Each IQR increase (0.22 ug/m3) in indoor BC from the weekly integrated filter was associated with a 17.87 mL decrease in pre-bronchodilator FEV1 (95% CI: -33.76, -1.98), with similar effect estimates for each of the individual lag days (lag0-3). The authors note this decrease is consistent with the FEV1 decrease associated with an additional 1.5 y of age (-18.26 mL; 95% CI: -37.10, 0.59). Continuous-exposure regression coefficient; no control/treated output pair exists (see section note)."
    derived_from_assay: "LF:hart-copd-spirometry"
    compared_measurement: "fev1"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-17.87"
      unit:
        id: "UO:0000098"
        name: "milliliter"
      variability:
        variability_type: confidence_interval_95
        lower_bound: "-33.76"
        upper_bound: "-1.98"
        unit:
          id: "UO:0000098"
          name: "milliliter"
    statistical_test: "multivariable adjusted mixed effects regression (random intercept per participant), scaled per IQR of exposure"
    derivation: reported_in_paper

