        unit:
          id: "UO:0000098"
          name: "milliliter"
    has_exposure_condition:
      - id: "EXPOSURE:chen-pm25-cumulative-high"
        name: "High cumulative daily maximum PM2.5 from controlled burning/flaring of oil and gas"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
    informs_on_key_event:
