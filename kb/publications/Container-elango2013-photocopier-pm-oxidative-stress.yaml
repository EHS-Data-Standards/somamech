# =============================================================================
# Elango et al. (2013) - Chronic exposure to emissions from photocopiers in
# copy shops causes oxidative stress and systematic inflammation among
# photocopier operators in India
# =============================================================================
#
# Source: Environ Health. 2013;12:78
# DOI: 10.1186/1476-069X-12-78
# PMID: 24025094
#
# Study design:
#   - Cross-sectional human occupational study (in vivo), Coimbatore, south
#     India, January 2011 - February 2012
#   - Indoor air quality monitored in five photocopy centers over 8-hour
#     working days (PM10, PM2.5, CO, NO2, O3, SO2, Pb, As, Ni, NH3, benzene,
#     benzo(a)pyrene)
#   - 81 photocopier operators (64 male, 17 female) with at least five years
#     employment in a xerographic unit, versus 43 unexposed healthy controls
#     (31 male, 12 female) from the same geographical area
#   - Spirometry (Vitalograph Alpha 6000, ATS guidelines, ERS 1993 predicted
#     equations); results as % predicted
#   - Serum: thiobarbituric acid reactive substances (TBARS, lipid
#     peroxidation) and total ferric reducing antioxidant capacity (FRAC);
#     total protein, albumin, globulin
#   - EDTA / lithium heparin plasma by commercial ELISA: LTB4, 8-isoprostane,
#     CRP, IL-8, ICAM-1, CC-16, ECP
#   - Group comparisons by Mann Whitney test; correlations by Spearman rank
#
# Key findings recorded here:
#   - PM10 (mean 376.4 ug/m3) and PM2.5 (mean 168.2 ug/m3) in the copy shops
#     were 2-3 fold above the Indian NAAQS limits; all other measured
#     pollutants were within limits
#   - Serum TBARS significantly higher in operators (2.7 vs 1.4 uM,
#     P < 0.001) and FRAC significantly lower (1.0 vs 1.5 mM, P = 0.010):
#     increased oxidative stress
#   - Plasma IL-8, LTB4, ICAM-1 and ECP significantly higher in operators:
#     systemic inflammation. Serum albumin lower and globulin higher.
#   - 8-isoprostane, CRP and CC-16 did NOT differ significantly between the
#     groups (recorded here as negative findings)
#   - Lung function (% predicted FVC, FEV1, FEV1/FVC, PEF, FEF25-75) and the
#     prevalence of restrictive/obstructive disease did NOT differ between
#     operators and controls
#
# Curation notes:
#   - Figure 2 reports the spirometry indices only as box plots, so no
#     numeric lung function values are extracted; the lung function assay
#     records the reported absence of a difference and the Table 6 disease
#     prevalence counts.
#   - The paper is internally inconsistent about the FRAC P value: the
#     Results text says "p = 0.001" while Table 8 gives 0.010. The Table 8
#     value is recorded, and both quotes are attached.
#   - Plasma cytokine/mediator assays are recorded under the schema's in vivo
#     inflammatory-mediator assay class (balf_sputum_assays), following the
#     Cherry 2021 extraction; the samples are plasma, not BALF or sputum.
#
# =============================================================================

source_publication:
  reference: "PMID:24025094"
  reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
  doi: "10.1186/1476-069X-12-78"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:elango-air-monitoring-001"
    protocol_type: Protocol
    name: "Indoor air quality monitoring in photocopy centers"
    description: "Indoor air quality monitored in five photocopy centers in Coimbatore as per Indian Standard guidelines (IS 5182), with sampling equipment positioned directly opposite the photocopier(s). Measurements made on working days over 8 hours by an ISO 2001 certified commercial laboratory. PM2.5 sampled gravimetrically at 1.5 L/minute for 8 hours and PM10 gravimetrically at 1000 L/minute for 8 hours; CO, NO2, O3, SO2, Pb, As, Ni, NH3, benzene and benzo(a)pyrene by the methods listed in Table 1."
    equipment_required:
      - "Gravimetric particulate samplers (PM2.5 and PM10)"
      - "Gas sampling trains for CO, NO2, O3, SO2 and NH3"
      - "Atomic absorption spectroscopy for Pb, As and Ni"
      - "Gas chromatograph with flame ionisation detector for benzene and benzo(a)pyrene"

  - id: "PROTOCOL:elango-spirometry-001"
    protocol_type: SpirometryProtocol
    name: "Spirometry following American Thoracic Society guidelines"
    description: "Pulmonary function assessed with a Vitalograph Alpha 6000 (UK) at the photocopier centers where the subjects worked, between 10.00 a.m. and 2.00 p.m. on a working day in a single visit. Parameters taken from the flow-volume curve were FVC, FEV1, FEV1/FVC, peak expiratory flow and FEF25-75, expressed as percentages of predicted values using the European Respiratory Society 1993 equations."
    spirometry_standard: "American Thoracic Society"
    equipment_required:
      - "Vitalograph Alpha 6000 spirometer"

  - id: "PROTOCOL:elango-serum-oxidative-001"
    protocol_type: MolecularAssayProtocol
    name: "Serum lipid peroxidation (TBARS) and total ferric reducing antioxidant capacity"
    description: "Peripheral venous blood collected at the workplace; serum separated, aliquoted into labelled cryo vials and stored at -80 C. Lipid peroxidation (thiobarbituric acid reactive substances) and total antioxidant capacity (ferric reducing antioxidant capacity) measured in serum by the published colorimetric methods cited as references 37 and 38."
    detection_method: "colorimetric assay of serum"
    equipment_required:
      - "Refrigerated centrifuge"
      - "-80 C freezer"
      - "Spectrophotometer"

  - id: "PROTOCOL:elango-elisa-001"
    protocol_type: MolecularAssayProtocol
    name: "Commercial ELISA panel for plasma inflammatory and oxidative markers"
    description: "Markers assessed in EDTA plasma by commercial ELISA kits: LTB4, 8-isoprostane, CRP and glutathione peroxidase (Cayman Chemical, USA); IL-8 (Koma Biotech, Korea); ICAM-1, CC-16 and ECP (USCN Life Sciences, China). Myeloperoxidase was assayed in lithium heparin plasma (Enzo Life Sciences, Switzerland). Intra-assay coefficients of variation ranged from 1.4% to 4.0% and inter-assay coefficients of variation from 2.4% to 4.4%."
    detection_method: "enzyme linked immunosorbent assay (ELISA)"
    platform: "Cayman Chemical, Koma Biotech, USCN Life Sciences and Enzo Life Sciences commercial ELISA kits"
    quality_control_criteria: "Intra-assay CV 1.4-4.0%; inter-assay CV 2.4-4.4%"
    equipment_required:
      - "Microplate reader"

# =============================================================================
# OXIDATIVE STRESS ASSAYS
# =============================================================================

oxidative_stress_assays:
  # ---------------------------------------------------------------------------
  # Serum TBARS - lipid peroxidation
  # ---------------------------------------------------------------------------
  - id: "OXSTRESS:elango-tbars-serum"
    name: "Serum thiobarbituric acid reactive substances (TBARS) in photocopier operators"
    description: "Serum lipid peroxidation measured as TBARS in 81 photocopier operators and 43 unexposed controls. Median (interquartile range) 2.7 (2.1-3.5) uM in operators versus 1.4 (1.0-1.9) uM in controls, P < 0.001 (Mann Whitney). Among non smokers only, 2.8 (2.1-3.4) uM in operators versus 1.4 (0.8-1.7) uM in controls, P < 0.001, so the difference is not explained by smoking."
    evidence:
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "TBARS (μM) 1.4 (1.0 – 1.9) 2.7 (2.1 – 3.5) <0.001 1.4 (0.8 – 1.7) 2.8 (2.1 – 3.4) <0.001"
        explanation: "Table 8 row giving the control and photocopier-operator TBARS medians and interquartile ranges with the P value, for the whole cohort and for non smokers, as recorded by this assay."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Serum thiobarbituric acid reactive substances (TBARS) concentration was significantly higher (p < 0.001) among"
        explanation: "The Results text stating that serum TBARS was significantly higher among the photocopier operators."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "p values for Mann Whitney test."
        explanation: "Table 8 footnote identifying the statistical test behind the P values recorded for every marker in this file."
    has_specified_output:
      id: "OXSTRESS:elango-tbars-serum-output"
      name: "Serum TBARS concentration in photocopier operators"
      description: "Median serum TBARS in photocopier operators, 2.7 uM (interquartile range 2.1-3.5; n = 81), against 1.4 uM (1.0-1.9; n = 43) in controls, P < 0.001."
      lipid_peroxidation:
