  # ---------------------------------------------------------------------------
  # Plasma 8-isoprostane - negative finding
  # ---------------------------------------------------------------------------
  - id: "OXSTRESS:elango-8isoprostane-plasma"
    name: "Plasma 8-isoprostane in photocopier operators (no significant difference)"
    description: "Plasma 8-isoprostane measured by ELISA. Median 46.4 (31.7-65.4) pg/mL in the 81 photocopier operators versus 41.7 (23.6-52.8) pg/mL in the 43 controls, P = 0.146; among non smokers 45.5 (24.6-67.5) versus 35.4 (20.5-51.5) pg/mL, P = 0.159. A negative finding: unlike TBARS, this lipid peroxidation marker did not separate the groups. The authors suggest TBARS may be the more sensitive biomarker."
    evidence:
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "8-Isoprostane (pg/mL) 41.7 (23.6 – 52.8) 46.4 (31.7 – 65.4) 0.146 35.4 (20.5 – 51.5) 45.5 (24.6 – 67.5) 0.159"
        explanation: "Table 8 row giving the control and operator 8-isoprostane medians, interquartile ranges and P values recorded by this assay."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "However, levels of 8-Isoprostane did not show significant differences between the two groups."
        explanation: "States the negative finding this assay records: 8-isoprostane did not differ between exposed operators and controls, so this marker does not support increased oxidative stress in this cohort."
    has_specified_output:
      id: "OXSTRESS:elango-8isoprostane-plasma-output"
      name: "Plasma 8-isoprostane concentration in photocopier operators"
      description: "Median plasma 8-isoprostane in photocopier operators, 46.4 pg/mL (interquartile range 31.7-65.4; n = 81), against 41.7 pg/mL (23.6-52.8; n = 43) in controls, P = 0.146 (not significant)."
