  # ---------------------------------------------------------------------------
  # CRP and lung function correlation
  # ---------------------------------------------------------------------------
  - id: "LUNGFUNC:elango-crp-lungfunction-correlation"
    name: "Correlation of plasma CRP with lung function across the study population"
    description: "Spearman rank correlations across the whole study population (81 operators and 43 controls). Plasma CRP correlated negatively with % predicted FVC (r = -0.261, p = 0.005) and with % predicted FEV1 (r = -0.221, p = 0.019); plasma CC-16 correlated positively with % predicted FVC (r = 0.195, p = 0.04). No other inflammatory biomarker was significantly related to lung function. The authors call CRP the best indicator of pulmonary function among the markers assayed."
    evidence:
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Plasma CRP levels were also found to have a negative correlation with % predicted FVC (r = −0.261, p = 0.005)"
        explanation: "Gives the CRP versus % predicted FVC correlation coefficient and P value recorded by this assay."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Plasma CC-16 was found to have positive association with % predicted FVC (r = 0.195, p = 0.04)."
        explanation: "Gives the CC-16 versus % predicted FVC correlation coefficient and P value recorded in this assay's description."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The lack of elevation in CRP was in accordance with the lack of lung function impairment."
        explanation: "Links the unchanged CRP to the unchanged lung function, the interpretation recorded in this assay's description."
    has_specified_output:
      id: "LUNGFUNC:elango-crp-lungfunction-correlation-output"
      name: "CRP and CC-16 correlations with spirometry"
      description: "Plasma CRP versus % predicted FVC r = -0.261 (p = 0.005) and versus % predicted FEV1 r = -0.221 (p = 0.019); plasma CC-16 versus % predicted FVC r = 0.195 (p = 0.04). Spearman rank correlation across all 124 subjects. Correlation coefficients are not concentrations, so they are recorded in the description rather than in a named measurement slot."
    reference_dataset: "European Respiratory Society 1993 predicted equations"
    informs_on_key_event:
      id: "KE:ao-decreased-lung-function"
