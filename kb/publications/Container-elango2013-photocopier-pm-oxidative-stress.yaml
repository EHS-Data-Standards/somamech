      description: "Restriction in 30% of photocopier operators (24 of 81) against 28% of controls (12 of 43), P = 0.841; obstruction 10% versus 9%, P = 0.918; both 5% versus 5%, P = 0.967 (Chi square test). These are disease prevalences rather than spirometry values, so no named measurement slot is used."
