    name: "Serum total ferric reducing antioxidant capacity (FRAC) in photocopier operators"
    description: "Total antioxidant capacity of serum measured as ferric reducing antioxidant capacity. Median 1.0 (0.8-1.4) mM in the 81 photocopier operators versus 1.5 (0.8-1.9) mM in the 43 controls, P = 0.010 by Table 8; among non smokers 1.0 (0.7-1.4) versus 1.6 (0.8-2.0) mM, P = 0.008. The Results text quotes this comparison as p = 0.001, which disagrees with the 0.010 printed in Table 8; the Table 8 value is recorded here and both passages are quoted below."
    evidence:
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FRAC (mM) 1.5 (0.8 – 1.9) 1.0 (0.8 – 1.4) 0.010 1.6 (0.8 – 2.0) 1.0 (0.7 – 1.4) 0.008"
        explanation: "Table 8 row giving the control and operator FRAC medians and interquartile ranges with the P values recorded by this assay (whole cohort 0.010, non smokers 0.008)."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Serum total ferric reducing antioxidant capacity was found to be significantly lower (p = 0.001) among operators in photocopier centers when compared to healthy controls."
        explanation: "The Results text stating the direction of the FRAC difference; note it quotes p = 0.001 where Table 8 prints 0.010, the discrepancy noted in this assay's description."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In harmony with the above results, total serum ferric reducing antioxidant capacity was significantly reduced among the photocopier operators when compared to the healthy control group suggesting increased oxidative stress."
        explanation: "The authors' interpretation that the reduced antioxidant capacity indicates increased oxidative stress, the key event this assay informs on."
    has_specified_output:
