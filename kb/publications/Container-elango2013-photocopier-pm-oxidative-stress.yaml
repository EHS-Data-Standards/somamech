      name: "Serum total antioxidant capacity in photocopier operators"
      description: "Median serum FRAC in photocopier operators, 1.0 mM (interquartile range 0.8-1.4; n = 81), against 1.5 mM (0.8-1.9; n = 43) in controls, P = 0.010."
