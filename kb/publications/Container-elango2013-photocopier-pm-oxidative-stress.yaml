# LUNG FUNCTION ASSAYS
# =============================================================================

lung_function_assays:
  # ---------------------------------------------------------------------------
  # Spirometry - negative finding
  # ---------------------------------------------------------------------------
  - id: "LUNGFUNC:elango-spirometry"
    name: "Spirometry in photocopier operators versus unexposed controls (no significant difference)"
    description: "Spirometry in 81 photocopier operators and 43 controls. No significant difference between the groups in % predicted FVC, FEV1, FEV1/FVC, peak expiratory flow or FEF25-75, and none in the subgroup analysis restricted to non smokers. Figure 2 shows these indices only as box plots, so no numeric spirometry values are extracted here. This is the central negative finding of the paper: chronic photocopier emission exposure raised oxidative stress and inflammatory markers without measurably reducing lung function."
    evidence:
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "Lung function parameters did not show any significant differences between the photocopier operators and healthy control groups."
        explanation: "States the negative spirometry finding this assay records, so the assay does not support the decreased lung function adverse outcome in this cohort."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "Sub group analysis among non smokers did not reveal any significant difference between the two groups."
        explanation: "Confirms that the null spirometry result holds in the non-smoker subgroup, so it is not masked by the higher smoking prevalence among operators."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
