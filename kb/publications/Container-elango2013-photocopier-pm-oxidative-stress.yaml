  # Plasma CC-16 - epithelial barrier marker, negative finding
  # ---------------------------------------------------------------------------
  - id: "BALF:elango-cc16-plasma"
    name: "Plasma Clara cell protein 16 (CC-16) in photocopier operators (no significant difference)"
    description: "Plasma CC-16, which rises in serum when lung epithelial permeability is disturbed by inhaled pollutants, measured by ELISA. Median 7.8 (3.3-33.8) ng/mL in the 81 photocopier operators versus 7.3 (2.7-28.3) ng/mL in the 43 controls, P = 0.705; among non smokers 7.1 (2.9-32.3) versus 7.8 (2.7-36.1) ng/mL, P = 0.908. A negative finding that the authors themselves call surprising: the epithelial barrier appears unperturbed despite the particulate exposure. CC-16 did correlate positively with % predicted FVC across the whole study population (r = 0.195, p = 0.04). The schema has no named CC-16 slot, so the values are recorded in this description and in the quoted evidence."
    evidence:
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "CC-16 (ng/mL) 7.3 (2.7 – 28.3) 7.8 (3.3 – 33.8) 0.705 7.8 (2.7 – 36.1) 7.1 (2.9 – 32.3) 0.908"
        explanation: "Table 8 row giving the control and operator plasma CC-16 medians, interquartile ranges and P values recorded by this assay."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "In the present study, neither significant increase nor significant decrease was observed in the plasma levels of CC-16 of photocopier operators indicating insignificant effects of the PM on the lung epithelium which is surprising."
        explanation: "States the negative finding this assay records: no change in plasma CC-16, which the authors read as no detectable effect of the particulate exposure on the lung epithelium, so this marker does not support the altered epithelial barrier key event in this cohort."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Plasma CC-16 was found to have positive association with % predicted FVC (r = 0.195, p = 0.04)."
