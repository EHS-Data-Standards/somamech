  # ---------------------------------------------------------------------------
  # Prevalence of restrictive and obstructive lung disease
  # ---------------------------------------------------------------------------
  - id: "LUNGFUNC:elango-disease-prevalence"
    name: "Prevalence of restrictive and obstructive lung disease in photocopier operators"
    description: "Spirometrically defined disease prevalence (Table 6). Restriction in 24 of 81 operators (30%) versus 12 of 43 controls (28%), P = 0.841; obstruction in 8 (10%) versus 4 (9%), P = 0.918; combined restriction and obstruction in 4 (5%) versus 2 (5%), P = 0.967. The high prevalence of restrictive disease in both groups is unexplained and, the authors note, has no local reference data for comparison. No significant difference between operators and controls, in the whole cohort or among non smokers (46 operators, 29 controls)."
    evidence:
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Restriction 12 (28) 24 (30) 0.841 5 (11) 3 (10) 0.766"
        explanation: "Table 6 row giving the restriction counts and percentages for controls and operators with the P value recorded by this assay (the last three columns are the non-smoker subgroup)."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Obstruction 4 (9) 8 (10) 0.918 12 (26) 10 (35) 0.305"
        explanation: "Table 6 row giving the obstruction counts and percentages for controls and operators with the P value recorded by this assay."
      - reference: "PMID:24025094"
        reference_title: "Chronic exposure to emissions from photocopiers in copy shops causes oxidative stress and systematic inflammation among photocopier operators in India."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "However, no significant difference was observed between the photocopier operators and control subjects in the prevalence of respiratory diseases."
        explanation: "States the negative finding this assay records: disease prevalence did not differ between exposed operators and controls, so it does not support the decreased lung function adverse outcome."
    has_specified_output:
