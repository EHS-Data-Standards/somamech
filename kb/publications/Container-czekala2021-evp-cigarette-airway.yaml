  - id: "GE:czekala-teer-3r4f-90puff"
    name: "TEER barrier integrity - 3R4F smoke 90 puffs, 28 days"
    description: "By T23 the 90-puff 3R4F dose caused a drastic decline in TEER compared to air control (p <= 0.0001), reaching a 0.87-fold decrease at that timepoint, which the authors attribute to excessive cytotoxicity (37% cytotoxicity at T23). Histology showed severe tissue disruption with only a few basal cells remaining at T28."
    gene_expression_method: "TEER measurement (EVOM2 with ENDOHM-6 electrode)"
    normalization_reference: "fold change compared to matched air controls"
    evidence:
      - reference: "PMID:34345855"
        reference_title: "Multi-endpoint analysis of human 3D airway epithelium following repeated exposure to whole electronic vapor product aerosol or cigarette smoke."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Fig. 9A shows that by T23, 90 puffs per exposure dose of 3R4F smoke caused a drastic decline in TEER compared to air control (p ≤ 0.0001), reaching a 0.87-fold decrease in TEER at this timepoint due to excessive cytotoxicity (Fig. 3). Further cross comparison with histological images showed that the tissue structure was severely disrupted, with only a few basal cells remaining on T28 (Fig. 7.1A)."
        explanation: "Supplies the fold change, significance level, cytotoxicity attribution and histological corroboration recorded by this assay."
      - reference: "PMID:34345855"
        reference_title: "Multi-endpoint analysis of human 3D airway epithelium following repeated exposure to whole electronic vapor product aerosol or cigarette smoke."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The TEER values were significantly reduced from T23 onwards for 90-puff 3R4F smoke group due to severe cytotoxicity (T23, 37% cytotoxicity)."
        explanation: "Gives the 37% cytotoxicity figure at T23 that this assay's description cites as the confounder."
    has_specified_output:
      id: "GE:czekala-teer-3r4f-90puff-output"
      name: "TEER fold change - 3R4F 90 puffs"
      description: "0.87-fold decrease at T23 (p <= 0.0001), confounded by 37% cytotoxicity at the same timepoint."
