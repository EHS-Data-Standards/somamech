      - reference: "PMID:34345855"
        reference_title: "Multi-endpoint analysis of human 3D airway epithelium following repeated exposure to whole electronic vapor product aerosol or cigarette smoke."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In comparison to the IL-13 control group, neither 3R4F smoke nor myblu aerosol triggered goblet cell hyperplasia or hypersecretion of mucus in this study; similar results were also reported by Iskikawa et al. (Ishikawa and Ito, 2017)."
        explanation: "Establishes the contrast between the IL-13 positive control and both test articles that this assay records."
      - reference: "PMID:34345855"
        reference_title: "Multi-endpoint analysis of human 3D airway epithelium following repeated exposure to whole electronic vapor product aerosol or cigarette smoke."
        supports: SUPPORT
        evidence_source: IN_VITRO
