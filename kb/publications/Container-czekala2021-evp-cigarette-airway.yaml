  - id: "CAA:czekala-3r4f-30puff"
    name: "Cilia active area - 3R4F smoke, 30 puffs, 28 days"
    description: "Cilia active area over 28 days of repeated exposure to 30 puffs of 1:17 diluted 3R4F smoke. A single exposure followed by 2 days recovery did not reduce CAA (0.89-fold at both T0 and T2); two further exposures dropped the fold change to 0.48 at T6 (45% reduction, p <= 0.0001), and by T20 the fold change was close to 0."
