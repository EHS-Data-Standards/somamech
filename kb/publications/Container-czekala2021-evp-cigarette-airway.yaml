  - id: "GCM:czekala-il13-positive-control"
    name: "IL-13 positive control - goblet cell hyperplasia and mucus hypersecretion, T19"
    description: "Dedicated tissues exposed to IL-13 (10 ng/ml) on six alternate days as a positive control for goblet cell hyperplasia, evaluated at T19. IL-13 thickened the tissue through mucin accumulation and cell proliferation, with elevated non-specific mucin (alcian blue) and MUC5AC. Neither 3R4F smoke nor myblu aerosol triggered goblet cell hyperplasia or mucus hypersecretion by comparison; the authors relate this to the absence of immune cells in the model. IL-13 is not recorded as an exposure_agent because it has no CHEBI/ECTO/ENVO term."
    evidence:
      - reference: "PMID:34345855"
        reference_title: "Multi-endpoint analysis of human 3D airway epithelium following repeated exposure to whole electronic vapor product aerosol or cigarette smoke."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Repeated addition of IL-13 to the 3D lung model caused the tissue to thicken due to the accumulation of mucin and cell proliferation. Non-specific mucin (stained with alcian blue) and MUC5AC secretion were both elevated as reflected by intensive staining in Fig. 7.1H & 3H."
