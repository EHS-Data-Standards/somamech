ciliary_function_assays:
  # --- CBF, 3R4F cigarette smoke ---
  - id: "CBF:czekala-3r4f-30puff"
    name: "Cilia beat frequency - 3R4F smoke, 30 puffs, 28 days"
    description: "CBF measured over 28 days of repeated exposure to 30 puffs of 1:17 diluted 3R4F smoke, the sub-cytotoxic dose. Significant inhibition from T6 (p <= 0.01) and a larger decrease after T20 (p <= 0.0001), ending at a 0.57-fold change relative to air control at T28. Fold-change time courses are figure-only (Fig. 8A) and are not transcribed."
    analysis_software: "Sisson-Ammons Video Analysis"
    evidence:
      - reference: "PMID:34345855"
        reference_title: "Multi-endpoint analysis of human 3D airway epithelium following repeated exposure to whole electronic vapor product aerosol or cigarette smoke."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "At sub-cytotoxic exposures (30 puffs) significant inhibition of CBF was observed from T6 (p ≤ 0.01), followed by a larger decrease in CBF after T20 (p ≤ 0.0001) resulting in a decrease of 0.57-fold relative to the air control at the end of the experiment at T28."
        explanation: "Gives the direction, significance and end-of-study fold change for CBF at the 30-puff 3R4F dose recorded by this assay."
