# =============================================================================
# Czekala et al. (2021) - Multi-endpoint analysis of human 3D airway epithelium
# following repeated exposure to whole electronic vapor product aerosol or
# cigarette smoke
# =============================================================================
#
# Source: Curr Res Toxicol (2021); PMID:34345855
# DOI: 10.1016/j.crtox.2021.02.004
#
# Study design:
#   - In vitro only: MucilAir (Epithelix) 3D organotypic human airway
#     epithelium at the air-liquid interface, single donor batch MD072001
#     (pathology-free, non-smoker, 41-year-old male Caucasian)
#   - Repeated whole-aerosol / whole-smoke exposure 3 times per week for
#     28 days at 30, 60 or 90 puffs per exposure; inserts in triplicate
#   - Test articles: myblu electronic vapor product (EVP) aerosol, undiluted
#     (ISO 20768:2018 vaping regime) and 3R4F Kentucky reference cigarette
#     smoke diluted 1:17 with filtered humidified air (ISO 20778:2018)
#   - Air control: 90 puffs of humidified filtered air
#   - Positive controls: IL-13 (10 ng/ml, six alternate days) for goblet cell
#     hyperplasia; procaterol hydrochloride (10 uM) for increased CBF
#   - Endpoints: LDH cytotoxicity, pro-inflammatory mediators (TNF-alpha,
#     MMP-1/3/9, IL-1beta, IL-6, IL-8) by MSD multiplex, cilia beat frequency
#     (CBF) and cilia active area (CAA), TEER barrier integrity, and
#     immunohistochemistry (alcian blue + H&E, MUC5AC, FOX-J1)
#
# Key findings:
#   - Undiluted myblu aerosol at all three puff doses did not significantly
#     change pro-inflammatory mediators, CBF, TEER or cytotoxicity vs air
#   - Diluted 3R4F smoke significantly reduced CBF and CAA at all three doses
#   - 60 and 90 puffs of 3R4F raised TNF-alpha, MMPs and interleukins, dropped
#     TEER, and (at 90 puffs) destroyed the tissue from T19 onwards
#   - FOX-J1-positive (ciliated) cells: air 53%; myblu 53/55/51%;
#     3R4F 30 puffs 50%, 60 puffs 6.9%, 90 puffs not quantifiable
#   - Neither product induced goblet cell hyperplasia; the IL-13 positive
#     control did
#
# Curation notes (judgement calls a reviewer should check):
#   - Anatomical origin: the paper does not state the airway region of donor
#     batch MD072001; it says MucilAir is made from nasal, tracheal OR
#     bronchial cells, and the Limitations paragraph states "the model tested
#     is mainly composed of bronchial epithelial cells". Bronchial epithelial
#     cell / bronchus is recorded on that basis.
#   - exposure_agent is nicotine (CHEBI:18723) for both products, following
#     the Haswell 2017 precedent: nicotine is the only delivered constituent
#     this study quantified. The recorded exposure_concentration is the
#     nicotine deposited into PBS in a blank well over a 30-puff dose
#     (dosimetry), not a concentration applied to the tissue. Only the
#     30-puff values appear in the text (3R4F 3.09 ug/ml, myblu 22.84 ug/ml),
#     so the 60- and 90-puff exposures carry no concentration.
#   - Most endpoints are reported as fold change vs air control in figures
#     only. Fold changes named in the text are kept in assay descriptions
#     rather than forced into unit-bearing measurement slots (a fold change
#     is not Hz, not a percentage). Only true percentages (FOX-J1, MUC5AC
#     and alcian blue percent-specific-staining, LDH percent cytotoxicity)
#     are recorded as QuantityValues.
#   - Alcian blue percent specific staining is recorded in
#     mucin_protein_concentration (a comparative, not absolute, mucin
#     measure); there is no dedicated histochemical-mucin slot.
#   - LDH cytotoxicity and nicotine dosimetry carry no informs_on_key_event:
#     no existing key event fits general cytotoxicity, and no new key event
#     was minted for it.
#   - Key events, all reused from existing extractions, none newly minted:
#     CBF -> KE:ke-decreased-cbf; FOX-J1 -> KE:ke-altered-ciliogenesis;
#     MUC5AC and alcian blue -> KE:ke-mucin-hypersecretion; IL-13 positive
#     control -> KE:ke-mucus-metaplasia; TNF-alpha and MMPs ->
#     KE:ke-airway-inflammation; IL-1beta/IL-6/IL-8 -> KE:ke-il1-inflammation;
#     TEER -> KE:ke-epithelial-barrier.
#     Cilia active area (CAA) is mapped to KE:ke3-impaired-mcc (Impaired
#     mucociliary clearance): CAA is the fraction of the epithelial surface
#     carrying actively beating cilia, i.e. the tissue-level ciliary capacity
#     that drives clearance. This study did not measure mucociliary transport
#     directly, so a reviewer should confirm this mapping rather than a
#     separate ciliary-function key event.
#   - Assay dates are not recorded: the paper reports study days (T0-T28)
#     relative to the first exposure, never calendar dates.
#   - Oxidative stress was NOT measured in this study. The authors infer it
#     ("we did see evidence of oxidative stress with the elevation of MMPs
#     and cytokines"), so no OxidativeStressAssay and no link to
#     KE:mie-oxidative-stress is recorded here.
#   - In vitro secreted-mediator readouts use GeneExpressionAssay (the
#     in-vitro-capable generic assay class); BALFSputumAssay is in vivo only.
#     TEER and LDH likewise use GeneExpressionAssay, following the Haswell
#     2017 precedent for TEER.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:34345855"
  reference_title: "Multi-endpoint analysis of human 3D airway epithelium following repeated exposure to whole electronic vapor product aerosol or cigarette smoke."
  doi: "10.1016/j.crtox.2021.02.004"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:czekala-exposure-001"
    name: "Repeated whole smoke / whole EVP aerosol exposure at the air-liquid interface"
    description: "Fresh whole smoke or aerosol generated with a bespoke 5-port Smoke Aerosol Exposure In Vitro System (SAEIVS, Burghart Tabaktechnik). 3R4F smoke generated under ISO 20778:2018 (55 ml puff, 2 s duration, 30 s interval, bell profile, ventilation blocked) and diluted 1:17 with filtered humidified air; myblu aerosol generated under ISO 20768:2018 (55 ml puff, 3 s duration, 30 s interval, square profile) and delivered undiluted. Tissues exposed 3 times per week for 28 days to 30, 60 or 90 puffs, or to filtered humidified air; inserts tested in triplicate; 2-day (or weekend) incubation between exposures. Delivery confirmed by quantifying nicotine trapped in PBS in a blank well of the 24-well plate by HPLC-MS/MS (AB Sciex API 6500 Q-Trap with Agilent 1290 Infinity HPLC, electrospray ionisation, multiple reaction monitoring, external calibration 2.5-100 ng/ml)."
    equipment_required:
      - "Smoke Aerosol Exposure In Vitro System (SAEIVS, Burghart Tabaktechnik)"
      - "3R4F Kentucky Reference Cigarette (University of Kentucky)"
      - "myblu EVP, 1.6% [w/w] nicotine, tobacco flavour (Fontem Ventures)"
      - "MucilAir culture inserts (Epithelix Sarl)"
      - "AB Sciex API 6500 (Q-Trap) with Agilent 1290 Infinity HPLC"

  - id: "PROTOCOL:czekala-ldh-001"
    protocol_type: MolecularAssayProtocol
    name: "LDH release cytotoxicity assay"
    description: "Basal culture medium collected before every exposure. Lactate dehydrogenase quantified with the CytoTox 96 assay (Promega G1780) per manufacturer instructions; absorbance read at 490 nm on a Sunrise plate reader (TECAN). Percent cytotoxicity calculated as experimental LDH release to basal culture medium divided by total LDH release to basal medium after lysis of the human organotypic lung model, times 100."
    detection_method: "colorimetric LDH activity, absorbance at 490 nm"
    platform: "Sunrise Reader (TECAN), 96-well"
    equipment_required:
      - "CytoTox 96 assay (Promega, G1780)"
      - "Sunrise Reader (TECAN)"

  - id: "PROTOCOL:czekala-msd-001"
    protocol_type: MolecularAssayProtocol
    name: "MSD multiplex immunoassay for secreted pro-inflammatory mediators"
    description: "TNF-alpha, MMP-1, MMP-3, MMP-9, IL-1beta, IL-6 and IL-8 secreted into the basal medium measured in sub-samples collected from each well prior to each exposure and stored at -80 C until thawed once. Quantified with the MSD Multi-Spot Assay System MESO Scale QuickPlex on custom plates per manufacturer instructions. Analysis in R 3.5.1; t-test with Benjamini-Hochberg false discovery rate correction, adjusted p-value threshold 5%."
    detection_method: "MSD electrochemiluminescence multiplex immunoassay"
    normalization_method: "normalized mean fold change over the air control treatment"
    platform: "MSD MESO Scale QuickPlex (custom plates)"
    equipment_required:
      - "MSD Multi-Spot Assay System MESO Scale QuickPlex"

  - id: "PROTOCOL:czekala-cbf-001"
    protocol_type: ImagingProtocol
    name: "Cilia beat frequency and cilia active area measurement"
    description: "Cilia activity measured prior to exposure. Tissues acclimated 20 min before and during measurement at 37 C in an ibidi Heating System for multi-well plates. CBF and CAA recorded on an Olympus IX53P1F inverted microscope at 4x and analysed with Sisson-Ammons Video Analysis software; each captured image divided into 2 blocks analysed by the same routine; 1024 frames per video at 200 frames per second; pixel intensities of a region of interest extracted over time and fast Fourier transformed, with Gaussian noise reduction. Procaterol hydrochloride (10 uM, Sigma-Aldrich) basolateral served as positive control for increased CBF."
    imaging_frame_rate:
      value: "200"
      unit:
        id: "UO:0000106"
        name: "hertz"
    temperature_control:
      value: "37"
      unit:
        id: "UO:0000027"
        name: "degree Celsius"
    equipment_required:
      - "Olympus IX53P1F inverted microscope"
      - "Sisson-Ammons Video Analysis software"
      - "ibidi Heating System for MWP"

  - id: "PROTOCOL:czekala-teer-001"
    protocol_type: MolecularAssayProtocol
    name: "Transepithelial electrical resistance (TEER) measurement"
    description: "Barrier integrity and tight junctions assessed with an EVOM2 Epithelial Volt/Ohm Meter and ENDOHM-6 electrode (World Precision Instruments). Tissue surface rinsed with PBS to remove the mucus layer; background readings of DPBS containing Ca2+ and Mg2+ subtracted from each resistance value; corrected values multiplied by the 0.33 cm2 insert surface area and averaged per treatment group. Tissues classed as having intact barrier function at 2000 ohms/cm or greater per the manufacturer's guidance; results expressed as fold change versus matched air controls."
    detection_method: "EVOM2 Epithelial Volt/Ohm Meter with ENDOHM-6 electrode"
    equipment_required:
      - "EVOM2 Epithelial Volt/Ohm Meter (World Precision Instruments)"
      - "ENDOHM-6 electrode"

  - id: "PROTOCOL:czekala-ihc-001"
    protocol_type: StainingProtocol
    name: "Histology and immunohistochemistry for mucin, MUC5AC and FOX-J1"
    description: "One tissue per treatment group harvested at T28 (T19 for the IL-13 group), fixed in 10% neutral buffered formalin for 30 min, cut into half discs, dehydrated in 70% ethanol and paraffin-embedded on a PELORIS Rapid Tissue Processor (Leica Biosystem); 3 um sections. Sections rehydrated, incubated in alcian blue 40 min at room temperature, washed 3 times in PBS and counter-stained with haematoxylin and eosin 15 min. MUC5AC (Thermofisher MA5-12178, 1/800, 1 h) and FOX-J1 (Novus BIO NBP1-87928, 2 ug/mL, 1 h) staining performed on a Benchmark robot (Ventana-Roche) with the Ultraview DAB kit; CC1 buffer (Tris/EDTA pH 8.4) antigen retrieval at 95 C for 30 min before primary antibody. Slides imaged on an Olympus VS120 Virtual Slide microscope and quantified with Image Pro Plus 6.2 (Media Cybernetics); results shown as percentage of specific staining."
    staining_type: "alcian blue with haematoxylin and eosin counterstain; DAB immunohistochemistry"
    detection_method: "Ultraview DAB (Ventana-Roche), Image Pro Plus 6.2 quantification"
    fixation_method: "10% neutral buffered formalin, 30 min"
    counterstain: "haematoxylin and eosin"
    antibodies_used:
      - "anti-MUC5AC (Thermofisher MA5-12178, 1/800)"
      - "anti-FOX-J1 (Novus BIO NBP1-87928, 2 ug/mL)"
    equipment_required:
      - "PELORIS Rapid Tissue Processor (Leica Biosystem)"
      - "Benchmark robot (Ventana-Roche)"
      - "Olympus VS120 Virtual Slide microscope"
      - "Image Pro Plus 6.2 (Media Cybernetics)"

