        snippet: "Measurements taken at T2 showed a single exposure to 30 puffs of cigarette smoke, followed by 2 days recovery did not reduce CAA. Both measurements at T0 and T2 showed a fold change of 0.89 vs air control. A further two exposures caused the fold change to drop to 0.48 at T6 (45% reduction, p ≤ 0.0001). By T20, the fold change was close to 0."
