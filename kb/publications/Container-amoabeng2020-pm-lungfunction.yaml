# =============================================================================
# Amoabeng Nti et al. (2020) - Effect of Particulate Matter Exposure on
# Respiratory Health of e-Waste Workers at Agbogbloshie, Accra, Ghana
# =============================================================================
#
# Source: Int J Environ Res Public Health. 2020;17(9):3042
# DOI: 10.3390/ijerph17093042
# Cached text: references_cache/PMID_32349371.md (content_type: full_text_xml)
#
# Study design:
#   - Longitudinal cohort study with repeated measures, March 2017 - Nov 2018
#   - 207 participants: 142 informal e-waste workers (Agbogbloshie scrapyard,
#     Accra) and 65 controls (Madina-Zongo, >10 km from the e-waste site)
#   - All male; e-waste job categories: burners, dismantlers, sorters, collectors
#   - Personal breathing-zone PM2.5, PM2.5-10 and PM10 sampled over a 4-h work
#     shift (2 h in the harmattan season) with a MetOne Aerocet 831
#   - Spirometry (FVC, FEV1, FEV1/FVC, PEF, FEF25-75) per ATS guidelines,
#     EasyOne portable spirometer, NHANES III predicted z-scores
#   - Random-effects models with random slopes; effect estimates are reported
#     as percentage change in the log-transformed lung function index
#
# Key findings captured here:
#   - Breathing-zone PM at the e-waste site exceeded WHO air quality standards
#     in every season and was 2-3x the control site for PM2.5
#   - PM in personal air was NOT significantly associated with lung function
#     percent predicted at the 95% level (small effect sizes)
#   - Seasonal (rainy, harmattan) and job-category (burner) contrasts showed
#     decrements concentrated in the small-airway indices PEF and FEF25-75
#   - A past history of asthma predicted a 35.8% decrease in FEV1
#
# NOT extracted (values in the paper are stated as ranges spanning both study
# groups and all three seasons, so they cannot be attributed to a single
# group): the absolute FEV1 and FVC litre values in Table S3.
# =============================================================================

source_publication:
  reference: "PMID:32349371"
  reference_title: "Effect of Particulate Matter Exposure on Respiratory Health of e-Waste Workers at Agbogbloshie, Accra, Ghana."
  doi: "10.3390/ijerph17093042"

# =============================================================================
# KEY EVENTS
# =============================================================================

key_events:
  - id: "KE:ao-decreased-lung-function"
    name: "Decreased lung function"
    biological_action: decreased
    level_of_biological_organization: organ

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:amoabeng-spirometry-001"
    name: "Portable spirometry per ATS guidelines"
    protocol_type: SpirometryProtocol
    description: "Spirometry performed in the standing position by a qualified technician and physician. Minimum of three acceptable FVC manoeuvres (maximum six if reproducibility criteria were not met); end-of-test criterion of at least 2 s of no volume change with exhalation of at least 6 s; reproducibility criterion of less than 5% variation or 0.1 L difference between the largest FVC and FEV1. Results expressed as predicted z-scores using the NHANES III equation, with ethnically appropriate reference values (Hankinson 1999). An abnormal test was defined as less than 80% or greater than 120% of predicted for FVC and FEV1 and less than 70% for FEV1/FVC."
    spirometry_standard: "American Thoracic Society (ATS) guidelines"
    equipment_required:
      - "EasyOne portable spirometer (ndd Medical Technologies, Andover, MA)"
    quality_control_criteria: "Less than 5% variation or 0.1 L difference between the largest FVC and FEV1; exhalation of at least 6 s with at least 2 s of no volume change"

  - id: "PROTOCOL:amoabeng-pm-sampling-001"
    name: "Personal breathing-zone PM sampling"
    description: "PM in the breathing zone was measured with a MetOne Aerocet 831 particle mass profiler measuring PM2.5 and PM10 per minute at a flow rate of 2.8 L/min. The battery-operated sampler was carried in a backpack worn by participants during routine work tasks. Sampling lasted 4 h of the work shift, reduced to 2 h during the harmattan season because the pump overloaded quickly. The coarse (PM2.5-10) fraction was derived as the difference between the PM10 and PM2.5 concentrations."
    equipment_required:
      - "MetOne Aerocet 831 particle mass profiler (MetOne Instruments Incorporated, Grants Pass, OR, USA)"

