key_event_relationships:
  - id: "KER:lambert-cftr-to-asl"
    name: "CFTR function leads to airway surface liquid depth"
    description: "Lambert 2014 concludes that roflumilast activates CFTR-mediated anion transport via a cyclic AMP-dependent pathway and thereby partially reverses the deleterious effects of whole cigarette smoke, resulting in augmented ASL depth - i.e. CFTR function determines ASL depth in this model."
    upstream_event:
      id: "KE:ke-decreased-cftr"
      name: "Decreased CFTR function"
      biological_action: decreased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-decreased-asl"
      name: "Decreased ASL height"
      biological_action: decreased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: moderate
