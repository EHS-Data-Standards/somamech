asl_assays:
  - id: "ASL:lambert-hbe-wcs-roflumilast"
    name: "ASL depth - WCS-exposed HBE monolayers with and without roflumilast"
    description: "Roflumilast improved the depleted ASL depth of HBE monolayers exposed to WCS: 9.0 +/- 3.1 micrometer with roflumilast vs. 5.6 +/- 2.0 micrometer in the WCS-exposed control, P < 0.05, which the authors report as 79% of the depth observed in air controls. The abstract does not state whether the +/- terms are SD or SEM, nor the sample size, nor the absolute air-control depth, so none of those is recorded."
    evidence:
      - reference: "PMID:24106801"
        reference_title: "Cystic fibrosis transmembrane conductance regulator activation by roflumilast contributes to therapeutic benefit in chronic bronchitis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Roflumilast improved the depleted ASL depth of HBE monolayers exposed to WCS (9.0 ± 3.1 μm vs. 5.6 ± 2.0 μm ... P < 0.05), achieving 79% of that observed in air controls."
        explanation: "The abstract gives both ASL depth values recorded by this assay - the WCS-exposed control and the roflumilast-treated arm - and states that the treated depth reaches 79% of the air control. The elision marks the abstract's own '[control]' label, which the quote checker strips from bracketed spans."
    has_exposure_condition:
      - id: "EXPOSURE:lambert-wcs-hbe"
        name: "Whole cigarette smoke (WCS), no roflumilast (control arm)"
        exposure_agent:
          id: "ENVO:01000838"
          name: "smoke"
      - id: "EXPOSURE:lambert-wcs-roflumilast-hbe"
        name: "Whole cigarette smoke (WCS) with roflumilast treatment"
        exposure_agent:
          id: "CHEBI:47657"
          name: "roflumilast"
    has_specified_output:
      - id: "ASL:lambert-hbe-wcs-roflumilast-output-control"
        name: "ASL depth in WCS-exposed HBE monolayers (control arm)"
        experimental_group: control
        measured_under: "EXPOSURE:lambert-wcs-hbe"
        asl_height_um:
          value: "5.6"
          unit:
            id: "UO:0000017"
            name: "micrometer"
          central_tendency: mean
      - id: "ASL:lambert-hbe-wcs-roflumilast-output-roflumilast"
        name: "ASL depth in WCS-exposed HBE monolayers treated with roflumilast"
        experimental_group: treated
        measured_under: "EXPOSURE:lambert-wcs-roflumilast-hbe"
        asl_height_um:
          value: "9.0"
          unit:
            id: "UO:0000017"
            name: "micrometer"
          central_tendency: mean
    informs_on_key_event:
      id: "KE:ke-decreased-asl"
      name: "Decreased ASL height"
      biological_action: decreased
      level_of_biological_organization: cellular
    study_subject:
      subject_type: CellularSystem
      id: "soma:lambert-hbe-001"
      name: "Primary human bronchial epithelial (HBE) monolayers"
      cell_type:
        id: "CL:0002328"
        name: "bronchial epithelial cell"
      primary_cell:
        id: "CL:0002328"
        name: "bronchial epithelial cell"
      anatomical_origin:
        id: "UBERON:0002185"
        name: "bronchus"
      model_species:
        id: "NCBITaxon:9606"
        name: "Homo sapiens"
    follows_protocols:
      - id: "PROTOCOL:lambert-confocal-asl-001"
        name: "Confocal microscopy measurement of airway surface liquid depth"
      - id: "PROTOCOL:lambert-wcs-exposure-001"
        name: "Whole cigarette smoke exposure of epithelial monolayers"

# =============================================================================
# RESPONSE COMPARISONS
#
# The abstract states both arms' values and the significance threshold
# (P < 0.05) but never a delta, a percent change, or a fold change for these
# two comparisons, so change_value is deliberately left empty: computing one
# here would be a derived number the paper does not report. p_value is also
# left empty because "P < 0.05" is a threshold, not a reported p-value.
# =============================================================================

response_comparisons:
  - id: "COMP:lambert-cftr-isc-wcs-roflumilast"
    name: "CFTR activity in WCS-exposed HBE cells, roflumilast vs. untreated control"
    description: "Roflumilast partially restored CFTR activity in WCS-exposed HBE cells (5.3 vs. 1.2 microampere/cm2). The paper reports the significance threshold P < 0.05 rather than an exact p-value, and states no delta, percent change, or fold change, so change_value is not recorded."
    derived_from_assay: "CFTR:lambert-hbe-wcs-roflumilast"
    compared_measurement: "cftr_chloride_secretion"
    control_output: "CFTR:lambert-hbe-wcs-roflumilast-output-control"
    treated_output: "CFTR:lambert-hbe-wcs-roflumilast-output-roflumilast"
    change_direction: increased
    derivation: reported_in_paper

  - id: "COMP:lambert-asl-depth-wcs-roflumilast"
    name: "ASL depth in WCS-exposed HBE monolayers, roflumilast vs. untreated control"
    description: "Roflumilast improved the depleted ASL depth of WCS-exposed HBE monolayers (9.0 vs. 5.6 micrometer), reaching 79% of the air control. The paper reports the significance threshold P < 0.05 rather than an exact p-value, and states no delta, percent change, or fold change between these two arms, so change_value is not recorded."
    derived_from_assay: "ASL:lambert-hbe-wcs-roflumilast"
    compared_measurement: "asl_height_um"
    control_output: "ASL:lambert-hbe-wcs-roflumilast-output-control"
    treated_output: "ASL:lambert-hbe-wcs-roflumilast-output-roflumilast"
    change_direction: increased
    derivation: reported_in_paper

