lung_function_assays:
  - id: "LF:lindner-ahr-methacholine"
    name: "Total lung resistance in response to methacholine - CBNP during established allergic airway inflammation"
    description: >-
      Figure 1c, invasive measurement of total lung resistance in response to
      a 100 mg/mL methacholine dose, n = 7-8, mean +/- SEM, Mann-Whitney U
      test versus OVA/H2O. Airway hyperresponsiveness was increased in the
      OVA control compared with the PBS control, confirming the asthma model.
      NULL RESULT: airway hyperresponsiveness in the CBNP groups was not
      different from the OVA/H2O group. Reported as a plot only, so no
      numeric values are transcribed.
    evidence:
      - reference: "PMID:29614747"
        reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the airway hyperresponsiveness to methacholine was increased in the OVA control group compared to the PBS control group (Figure 1c)"
        explanation: "Supports the difference between the PBS control and OVA control output records of this assay, which establishes that the model was working."
      - reference: "PMID:29614747"
        reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "the airway hyperresponsiveness to methacholine was not different from OVA/H2O treated mice (Figure 1c)"
        explanation: "The explicit null finding for lung resistance that the four CBNP output records and the no_change response comparison record."
    has_specified_output:
