# =============================================================================
# RESPONSE COMPARISONS
#
# Analysis layer: the changes the paper itself states for each CBNP group
# versus the OVA/H2O allergic control. For this paper most of them are
# `no_change` - that is the result, not an omission. The paper reports
# significance as thresholds (p < 0.05, p < 0.01) rather than exact p-values,
# so p_value is left unset and the threshold is given in the description.
# No change magnitudes are recorded, because the paper states directions and
# significance only; nothing is computed here.
# =============================================================================

response_comparisons:
  # --- the null results -------------------------------------------------------
  - id: "COMP:lindner-il6-balf-p90"
    name: "BAL fluid IL-6, OVA/P90 vs OVA/H2O - no change"
    description: "Table 2. NULL RESULT reported by the paper: P90 did not increase BAL fluid IL-6 (0.8+/-0.2 vs 1.1+/-0.3 pg/mL, not significant). No change magnitude is stated by the paper, so none is recorded."
    derived_from_assay: "BALF:lindner-cytokines-cbnp"
    compared_measurement: "il6_concentration"
    control_output: "BALF:lindner-cytokines-cbnp-output-ova"
    treated_output: "BALF:lindner-cytokines-cbnp-output-p90"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-il8-balf-p90"
    name: "BAL fluid KC (murine IL-8 homologue), OVA/P90 vs OVA/H2O - no change"
    description: "Table 2. NULL RESULT: P90 did not increase BAL fluid KC (16.7+/-4.3 vs 21.6+/-5.7 pg/mL, not significant). The paper describes KC as the murine homolog of human IL-8, which is why it is carried in il8_concentration."
    derived_from_assay: "BALF:lindner-cytokines-cbnp"
    compared_measurement: "il8_concentration"
    control_output: "BALF:lindner-cytokines-cbnp-output-ova"
    treated_output: "BALF:lindner-cytokines-cbnp-output-p90"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-lung-resistance-p90"
    name: "Lung resistance to methacholine, OVA/P90 vs OVA/H2O - no change"
    description: "Figure 1c. NULL RESULT: airway hyperresponsiveness to methacholine in the CBNP groups was not different from OVA/H2O. Values are plotted only, so no magnitude is available."
    derived_from_assay: "LF:lindner-ahr-methacholine"
    compared_measurement: "lung_resistance"
    control_output: "LF:lindner-ahr-methacholine-output-ova"
    treated_output: "LF:lindner-ahr-methacholine-output-p90"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-cyp1a1-intrapulmonary-p90"
    name: "Cyp1a1 mRNA in intrapulmonary airways, OVA/P90 vs OVA/H2O - no change"
    description: "Table 3. NULL RESULT: the exposure to CBNP did not increase Cyp1a1 mRNA (1.3+/-0.4 vs 1.0+/-0.2 n-fold, not significant), i.e. no AhR pathway activation."
    derived_from_assay: "GE:lindner-cyp1a1-intrapulmonary"
    compared_measurement: "mrna_level"
    control_output: "GE:lindner-cyp1a1-intrapulmonary-output-ova"
    treated_output: "GE:lindner-cyp1a1-intrapulmonary-output-p90"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-cyp1b1-trachea-as-pah"
    name: "Cyp1b1 mRNA in tracheal epithelial cells, OVA/AS-PAH vs OVA/H2O - no change"
    description: "Table 3. AS-PAH carries a mixture of at least 12 surface PAH species and gave the numerically highest Cyp1b1 value (2.8+/-0.9 vs 1.2+/-0.3 n-fold), but the paper states that no CBNP increased the Cyp enzymes, i.e. the difference was not significant."
    derived_from_assay: "GE:lindner-cyp1b1-trachea"
    compared_measurement: "mrna_level"
    control_output: "GE:lindner-cyp1b1-trachea-output-ova"
    treated_output: "GE:lindner-cyp1b1-trachea-output-as-pah"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-ho1-intrapulmonary-p90"
    name: "HO-1 mRNA in intrapulmonary airways, OVA/P90 vs OVA/H2O - no change"
    description: "Table 3. NULL RESULT for the oxidative stress MIE: HO-1 mRNA did not increase after CBNP exposure (1.1+/-0.1 vs 1.3+/-0.1 n-fold, not significant)."
    derived_from_assay: "GE:lindner-ho1-intrapulmonary"
    compared_measurement: "mrna_level"
    control_output: "GE:lindner-ho1-intrapulmonary-output-ova"
    treated_output: "GE:lindner-ho1-intrapulmonary-output-p90"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-muc5ac-intrapulmonary-p90"
    name: "Muc5ac mRNA in intrapulmonary airways, OVA/P90 vs OVA/H2O - no change"
    description: "Table 3. Airway-region specificity: while P90 raised Muc5ac in the trachea, Muc5ac mRNA in the intrapulmonary airways remained constant (29+/-4 vs 44+/-11 n-fold, not significant)."
    derived_from_assay: "GCM:lindner-mucins-intrapulmonary"
    compared_measurement: "muc5ac_mrna_expression"
    control_output: "GCM:lindner-mucins-intrapulmonary-output-ova"
    treated_output: "GCM:lindner-mucins-intrapulmonary-output-p90"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-muc5b-trachea-p90"
    name: "Muc5b mRNA in tracheal epithelial cells, OVA/P90 vs OVA/H2O - no change"
    description: "Table 3. The mirror of the intrapulmonary Muc5b decrease: P90 had no effect on Muc5b mRNA in the tracheal epithelial cells (2.2+/-0.2 vs 2.2+/-0.6 n-fold)."
    derived_from_assay: "GCM:lindner-mucins-trachea"
    compared_measurement: "muc5b_mrna_expression"
    control_output: "GCM:lindner-mucins-trachea-output-ova"
    treated_output: "GCM:lindner-mucins-trachea-output-p90"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-muc5ac-trachea-as-pah"
    name: "Muc5ac mRNA in tracheal epithelial cells, OVA/AS-PAH vs OVA/H2O - no change"
    description: "Table 3. The PAH-containing CBNP did not change mucin mRNA expression; AS-PAH gave 39+/-20 vs 35+/-10 n-fold. Read with the P90 result, this is the paper's basis for suggesting that the higher specific surface area of uncoated P90, not the surface PAH, drives the Muc5ac response."
    derived_from_assay: "GCM:lindner-mucins-trachea"
    compared_measurement: "muc5ac_mrna_expression"
    control_output: "GCM:lindner-mucins-trachea-output-ova"
    treated_output: "GCM:lindner-mucins-trachea-output-as-pah"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-pas-trachea-p90"
    name: "PAS-positive cells in tracheal epithelium, OVA/P90 vs OVA/H2O - no change"
    description: "Figure 2d,e. NULL RESULT: the number of PAS-positive cells was not increased after P90 exposure, so the P90-induced Muc5ac mRNA rise did not translate into more mucus-storing goblet cells. Plotted only (n = 2-3), so no magnitude is available."
    derived_from_assay: "GCM:lindner-pas-trachea"
    compared_measurement: "goblet_cell_percentage"
    control_output: "GCM:lindner-pas-trachea-output-ova"
    treated_output: "GCM:lindner-pas-trachea-output-p90"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-transport-rate-p90"
    name: "Tracheal particle transport speed, OVA/P90 vs OVA/H2O - no change"
    description: "Figure 3b. NULL RESULT: the exposure to the CBNP did not further decrease the particle transport, even though the OVA challenge itself had already slowed it. Plotted only, so no magnitude is available."
    derived_from_assay: "MCC:lindner-transport-trachea"
    compared_measurement: "transport_rate"
    control_output: "MCC:lindner-transport-trachea-output-ova"
    treated_output: "MCC:lindner-transport-trachea-output-p90"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  # --- the significant changes, all of them either attenuating or
  # --- P90-specific epithelial effects ---------------------------------------
  - id: "COMP:lindner-il1beta-balf-as-pah"
    name: "BAL fluid IL-1 beta, OVA/AS-PAH vs OVA/H2O - decreased"
    description: "Table 2. AS-PAH reduced IL-1 beta protein in the BAL fluid (0.5+/-0.1 vs 1.3+/-0.2 pg/mL). The paper marks significance as p < 0.05 without an exact p-value and states no change magnitude, so neither is recorded. This is an attenuation of the allergic inflammation, not an aggravation."
    derived_from_assay: "BALF:lindner-cytokines-cbnp"
    compared_measurement: "il1_beta_concentration"
    control_output: "BALF:lindner-cytokines-cbnp-output-ova"
    treated_output: "BALF:lindner-cytokines-cbnp-output-as-pah"
    change_direction: decreased
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-il1beta-balf-p90-9na"
    name: "BAL fluid IL-1 beta, OVA/P90-9NA vs OVA/H2O - decreased"
    description: "Table 2. P90-9NA reduced IL-1 beta protein in the BAL fluid (0.7+/-0.2 vs 1.3+/-0.2 pg/mL), marked p < 0.05. Another attenuating effect of a PAH-coated particle."
    derived_from_assay: "BALF:lindner-cytokines-cbnp"
    compared_measurement: "il1_beta_concentration"
    control_output: "BALF:lindner-cytokines-cbnp-output-ova"
    treated_output: "BALF:lindner-cytokines-cbnp-output-p90-9na"
    change_direction: decreased
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-il6-mrna-intrapulmonary-p90-9na"
    name: "IL-6 mRNA in intrapulmonary airways, OVA/P90-9NA vs OVA/H2O - decreased"
    description: "Table 3. P90-9NA significantly decreased IL-6 mRNA in intrapulmonary airways (4.3+/-0.5 vs 7.9+/-1.2 n-fold), marked p < 0.05."
    derived_from_assay: "GE:lindner-il6-intrapulmonary"
    compared_measurement: "mrna_level"
    control_output: "GE:lindner-il6-intrapulmonary-output-ova"
    treated_output: "GE:lindner-il6-intrapulmonary-output-p90-9na"
    change_direction: decreased
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-il13-mrna-intrapulmonary-p90-9na"
    name: "IL-13 mRNA in intrapulmonary airways, OVA/P90-9NA vs OVA/H2O - decreased"
    description: "Table 3. P90-9NA significantly decreased IL-13 mRNA in intrapulmonary airways (34+/-4 vs 52+/-8 n-fold), marked p < 0.05, consistent with the decreased IL-13 protein in its BAL fluid."
    derived_from_assay: "GE:lindner-il13-intrapulmonary"
    compared_measurement: "mrna_level"
    control_output: "GE:lindner-il13-intrapulmonary-output-ova"
    treated_output: "GE:lindner-il13-intrapulmonary-output-p90-9na"
    change_direction: decreased
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-muc5ac-trachea-p90"
    name: "Muc5ac mRNA in tracheal epithelial cells, OVA/P90 vs OVA/H2O - increased"
    description: "Table 3. The clearest positive finding of the paper: unmodified P90 increased Muc5ac mRNA in the tracheal epithelial cells (101+/-15 vs 35+/-10 n-fold), marked p < 0.01. The paper reports a direction and a significance threshold rather than an exact p-value or a change magnitude, so neither is recorded."
    derived_from_assay: "GCM:lindner-mucins-trachea"
    compared_measurement: "muc5ac_mrna_expression"
    control_output: "GCM:lindner-mucins-trachea-output-ova"
    treated_output: "GCM:lindner-mucins-trachea-output-p90"
    change_direction: increased
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-muc5b-intrapulmonary-p90"
    name: "Muc5b mRNA in intrapulmonary airways, OVA/P90 vs OVA/H2O - decreased"
    description: "Table 3. Unmodified P90 decreased Muc5b mRNA in the intrapulmonary airways (18+/-3 vs 31+/-5 n-fold), marked p < 0.05. Because Muc5b is required for effective mucociliary clearance, the authors read this as a potential worsening of the allergic airway inflammation despite the overall null result."
    derived_from_assay: "GCM:lindner-mucins-intrapulmonary"
    compared_measurement: "muc5b_mrna_expression"
    control_output: "GCM:lindner-mucins-intrapulmonary-output-ova"
    treated_output: "GCM:lindner-mucins-intrapulmonary-output-p90"
    change_direction: decreased
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-beat-frequency-p90"
    name: "Tracheal ciliary beat frequency, OVA/P90 vs OVA/H2O - decreased"
    description: "Figure 3c. The unmodified P90 decreased the tracheal ciliary beat frequency; the PAH-coated particles and AS-PAH did not. Plotted only, so no magnitude is available. The authors attribute the effect to the Muc5ac-rich mucus agglutinating the cilia, not to cilia damage, because ATP stimulation raised beat frequency equally in all groups."
    derived_from_assay: "CILIA:lindner-cbf-trachea"
    compared_measurement: "beat_frequency_hz"
    control_output: "CILIA:lindner-cbf-trachea-output-ova"
    treated_output: "CILIA:lindner-cbf-trachea-output-p90"
    change_direction: decreased
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

  - id: "COMP:lindner-beat-frequency-p90-bap"
    name: "Tracheal ciliary beat frequency, OVA/P90-BaP vs OVA/H2O - no change"
    description: "Figure 3c. The PAH-coated P90 particles did not affect the ciliary beat frequency, which together with their unchanged Muc5ac mRNA is the paper's basis for pointing at the higher specific surface area of unmodified P90 as the critical particle characteristic."
    derived_from_assay: "CILIA:lindner-cbf-trachea"
    compared_measurement: "beat_frequency_hz"
    control_output: "CILIA:lindner-cbf-trachea-output-ova"
    treated_output: "CILIA:lindner-cbf-trachea-output-p90-bap"
    change_direction: no_change
    statistical_test: "Mann-Whitney U test"
    derivation: reported_in_paper

# =============================================================================
# KEY EVENT RELATIONSHIPS - the mechanism the paper proposes for the one
# positive P90 finding, kept separate from the null results
# =============================================================================

key_event_relationships:
  - id: "KER:lindner-muc5ac-to-cbf"
    name: "Increased Muc5ac-rich mucus leads to decreased ciliary beat frequency"
    description: >-
      The mechanism the authors propose for the single P90-specific effect on
      ciliary function: the P90-induced Muc5ac increase makes the released
      mucus more adhesive and viscous, which agglutinates the cilia. The
      inference is explicitly hypothetical in the paper ("we suggest",
      "might have"), and rests on a plotted beat frequency difference plus
      the observation that ATP stimulation restored beat frequency equally
      in all groups, so evidence support is recorded as weak.
    upstream_event:
      id: "KE:ke-mucin-hypersecretion"
      name: "Mucin hypersecretion"
      biological_action: increased
      level_of_biological_organization: cellular
    downstream_event:
      id: "KE:ke-decreased-cbf"
      name: "Decreased ciliary beat frequency"
      biological_action: decreased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: weak
    evidence:
      - reference: "PMID:29614747"
        reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The resulting more adhesive and viscous mucus might have agglutinated the cilia, causing the observed decrease in the ciliary beat frequency."
        explanation: "The authors' own statement of this upstream-to-downstream link, phrased as a suggestion, which is why evidence_support is weak."

  - id: "KER:lindner-muc5b-loss-to-mcc"
    name: "Decreased Muc5b in intrapulmonary airways leads to impaired mucociliary clearance"
    description: >-
      Muc5b is required for airway defence against pathogens and for
      effective mucociliary clearance, so the authors read the P90-induced
      decrease of Muc5b mRNA in the intrapulmonary airways as probably
      affecting mucociliary clearance. No clearance measurement was made in
      the intrapulmonary airways in this study - the measured particle
      transport speed is tracheal and was unchanged by CBNP - so this link
      is an inference rather than a measured relationship and is recorded as
      indirect with weak support.
    upstream_event:
      id: "KE:ke-muc5b-decrease"
      name: "Decreased Muc5b expression"
      biological_action: decreased
      level_of_biological_organization: cellular
    downstream_event:
      id: "KE:ke3-impaired-mcc"
      name: "Impaired mucociliary clearance"
      biological_action: impaired
      level_of_biological_organization: tissue
    relationship_type: "indirectly leads to"
    evidence_support: weak
    evidence:
      - reference: "PMID:29614747"
        reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Our results indicate that the proportion of Muc5ac and Muc5b is affected due to the P90-induced decrease of Muc5b mRNA expression in the intrapulmonary airways, probably affecting the mucociliary clearance."
        explanation: "The authors state the link between the altered Muc5ac/Muc5b proportion and mucociliary clearance, hedged with 'probably', matching the weak evidence support recorded here."
