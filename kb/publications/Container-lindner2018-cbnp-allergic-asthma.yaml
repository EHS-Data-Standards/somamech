# =============================================================================
# Lindner et al. (2018) - Low Dose Carbon Black Nanoparticle Exposure Does Not
# Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence
# of Surface Polycyclic Aromatic Hydrocarbons
# =============================================================================
#
# Source: Nanomaterials (Basel) 2018;8(4):213
# DOI: 10.3390/nano8040213
#
# Study design (all in vivo, mouse):
#   - Female Balb/c mice, 7-9 weeks old
#   - OVA sensitisation i.p. on days 1, 14, 21; OVA aerosol challenge on
#     days 26, 27, 28; PBS/H2O group = non-allergic control
#   - CBNP given oropharyngeally twice (day 28 before the last challenge and
#     day 29): 70 uL of a 100 ug/mL suspension = approx. 7 ug total dose
#   - Six groups: PBS/H2O, OVA/H2O, OVA/P90, OVA/P90-BaP, OVA/P90-9NA,
#     OVA/AS-PAH
#   - P90 = Printex(R)90 carbon black; P90-BaP = P90 coated with
#     benzo[a]pyrene (10% of particle mass); P90-9NA = P90 coated with
#     9-nitroanthracene (14% of particle mass); AS-PAH = acetylene soot
#     carrying a mixture of at least 12 surface PAH species
#
# THIS IS A NEGATIVE-RESULT PAPER. The primary finding is a null result: at a
# low (ambient-equivalent) dose, none of the four CBNP aggravated an
# established allergic airway inflammation. Every "no change" recorded below
# is data the paper reports, not a missing measurement. The few significant
# changes that were observed went in the opposite (attenuating) direction,
# except for the unmodified P90 particles, which decreased tracheal ciliary
# beat frequency, decreased Muc5b mRNA in intrapulmonary airways, and
# increased tracheal Muc5ac mRNA.
#
# Numeric values: Table 2 (BAL cytokine/chemokine protein, pg/mL) and Table 3
# (mRNA, n-fold expression) are transcribed as reported, mean +/- SEM.
# Figure-derived endpoints (relative lung weight, differential cell counts,
# airway resistance, PAS quantification, ciliary beat frequency, particle
# transport speed) are recorded as output records WITHOUT numeric values,
# because the paper reports them only as plots - the direction of the effect
# is carried in response_comparisons and in the descriptions.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:29614747"
  reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
  doi: "10.3390/nano8040213"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:lindner-cba-001"
    name: "Cytometric bead array for BAL fluid cytokines and chemokines"
    description: "BAL fluid centrifuged; cytokines and chemokines relevant for lung inflammation determined in the supernatant with CBA Flex Set Kits (BD Bioscience). Fluorescent intensity read on a BD Accuri C6 flow cytometer, analysed with FCAP Array v3.0. Results reported as absolute protein concentrations (pg/mL)."
    equipment_required:
      - "CBA Flex Set Kits (BD Bioscience, San Jose, CA, USA)"
      - "BD Accuri C6 flow cytometer (BD Bioscience)"
      - "FCAP Array v3.0 Software (BD Bioscience)"

  - id: "PROTOCOL:lindner-bal-diffcount-001"
    name: "Bronchoalveolar lavage and differential immune cell count"
    description: "Trachea cannulated and lungs rinsed with 1 mL D-PBS containing protease inhibitor. BAL volume recorded and total immune cell number counted in a Neubauer chamber. For the differential count, 50 uL of BAL fluid was cytospinned (500 x g, 5 min) and macrophages, lymphocytes, eosinophil and neutrophil granulocytes stained by the Pappenheim method or with Diffquick solutions. At least 100 immune cells counted per sample; results given as total cells per mL BAL fluid."
    equipment_required:
      - "Neubauer counting chamber"
      - "Cytospin (Thermo Scientific)"
      - "Diffquick solutions (Medion Grifols Diagnostics AG)"

  - id: "PROTOCOL:lindner-lungfx-001"
    name: "Invasive measurement of total lung resistance with methacholine challenge"
    description: "Airway responsiveness to methacholine assessed invasively as total lung resistance using Finepoint RC Units (Data Science International). Mice anaesthetised, tracheotomised with a cannula and mechanically ventilated. Data represent the airway resistance in response to a 100 mg/mL methacholine dose."
    equipment_required:
      - "Finepoint RC Units (Data Science International, New Brighton, MN, USA)"
      - "Tracheal cannula and mechanical ventilator"

  - id: "PROTOCOL:lindner-qpcr-trachea-001"
    name: "TaqMan real-time RT-PCR on isolated tracheal epithelial cells"
    description: "Total RNA isolated from tracheal epithelial cells. Real-time RT-PCR in TaqMan Universal PCR Master Mix on an ABI PRISM 7900HT or StepOnePlus Sequence Detector System; probes tagged with reporter 6-FAM and quencher Tamra. Expression changes calculated as the difference in cycle threshold to the housekeeping gene RPL32 with the delta-delta-CT method and reported as n-fold expression (2^-ddCT)."
    equipment_required:
      - "ABI PRISM 7900HT / StepOnePlus Sequence Detector System (Applied Biosystems)"
      - "TaqMan Universal PCR Master Mix (Life Technologies)"

  - id: "PROTOCOL:lindner-qpcr-airways-001"
    name: "SYBR Green real-time RT-PCR on microdissected intrapulmonary airways"
    description: "Distal airways microdissected from surrounding parenchyma under a stereomicroscope and pooled. Real-time RT-PCR on a Roche Light Cycler 480 II using Light Cycler 480 SYBR green I Master. Cycling: 95 C 10 min, then 45 cycles touch-down 63-58 C for 8 s at 0.5 C/s and 72 C for 10 s. Expression changes calculated as n-fold difference in cycle threshold to the housekeeping gene RPL32, normalised by the rule of proportion."
    equipment_required:
      - "Roche Light Cycler 480 II Instrument (Roche Diagnostics)"
      - "Light Cycler 480 SYBR green I Master (Roche Diagnostics)"

  - id: "PROTOCOL:lindner-pas-lung-001"
    name: "PAS staining and stereological quantification of goblet cells in lung sections"
    description: "Lungs fixed ex situ by intra-tracheal instillation of 4% phosphate buffered paraformaldehyde, stored overnight in 4% paraformaldehyde and paraffin embedded with randomised orientation (orientator technique). 2 um sections stained with periodic acid-Schiff reagent, imaged at 20-fold magnification. Surface area of mucin-containing goblet cells per epithelial basal membrane surface area (Sgc/Sep) and volume of PAS-stained epithelial mucin per Sep (Vmucin/Sep) determined with the newCAST computer-assisted stereology toolbox."
    equipment_required:
      - "Olympus BX-51 microscope with DP-25 digital camera"
      - "newCAST stereology toolbox (Visiopharm, Hoersholm, Denmark)"
      - "Periodic acid-Schiff reagent"

  - id: "PROTOCOL:lindner-pas-trachea-001"
    name: "PAS staining of tracheal epithelium and counting of PAS-positive cells"
    description: "Tracheae pinned on a cork plate, fixed in 4% phosphate-buffered paraformaldehyde, paraffin embedded and longitudinally sliced in fractionated series. 7 um sections stained via PAS reaction and haematoxylin. PAS-positive cells counted in at least 2 areas 490 um apart, each at least 350 um wide, one slice every 70 um, with at least 520 total epithelial cells counted. Reported as the percentage of the total number of non-ciliated cells."
    equipment_required:
      - "Microtome"
      - "Periodic acid-Schiff reagent and haematoxylin"

  - id: "PROTOCOL:lindner-cbf-001"
    name: "Video microscopy of ciliary beat frequency in explanted trachea"
    description: "Trachea samples pinned epithelium-up in a Sylgard-coated Delta T4 culture dish under 2 mL HEPES-Ringer solution, held at 30 C. Cilia motion recorded with 1000 images at 100 Hz in at least four areas per trachea; ciliary beat frequency of 10 ciliated cells measured per area and determined by Fourier transformation of grey level changes over time with Matlab-based software. Mean frequency calculated per trachea. ATP (10 uM) added at the end of each experiment to activate cilia beating."
    equipment_required:
      - "Zeiss Examiner.D1 microscope, Achroplan 40x/0.80 W objective"
      - "SMX-150M camera (EHD Imaging GmbH)"
      - "Bioptechs Delta T4 Culture Dish Controller"
    quality_control_criteria: "Mean ciliary beat frequency calculated from at least 40 ciliated cells measured at four different tracheal regions of each animal"

  - id: "PROTOCOL:lindner-transport-001"
    name: "Particle transport speed on explanted tracheal epithelium"
    description: "Transport of 4.5 um polystyrene particles (2 x 10^6 particles/mL) recorded on the explanted tracheal epithelium at 30 C with 200 images at 12 Hz from at least four different areas per trachea. Particle transport speed determined with Image-Pro Plus 6.0 and the mean speed calculated for each trachea."
    equipment_required:
      - "Zeiss Examiner.D1 microscope, 20x/1.0 DIC (UV) VIS-R objective"
      - "4.5 um polystyrene particles"
      - "Image-Pro Plus 6.0 (Medium Cybernetics)"

