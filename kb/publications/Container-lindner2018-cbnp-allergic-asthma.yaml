  # Table 2 - cytokine/chemokine protein in BAL fluid, all six groups.
  # Slotted: IL-6, IL-1beta, and KC (the murine homologue of human IL-8, which
  # is how the paper itself describes it) in il8_concentration. Mcp-1, IL-4,
  # IL-5, IL-13 and IL-17A have no named slot and are transcribed in the
  # description below.
  # ---------------------------------------------------------------------------
  - id: "BALF:lindner-cytokines-cbnp"
    name: "BAL fluid cytokine and chemokine levels - CBNP during established allergic airway inflammation"
    description: >-
      Table 2, cytometric bead array, concentrations in pg/mL, mean +/- SEM,
      n = 11-16, OVA/CBNP groups compared with the OVA/H2O group by
      Mann-Whitney U test. NULL RESULT for aggravation: no CBNP increased any
      cytokine or chemokine relative to OVA/H2O. Values without a named
      measurement slot, in the order PBS/H2O, OVA/H2O, OVA/P90, OVA/P90-BaP,
      OVA/P90-9NA, OVA/AS-PAH - Mcp-1: 0.01+/-0.01, 27.0+/-5.7, 12.7+/-3.9*,
      7.4+/-5.5*, 11.7+/-5.7*, 0.6+/-0.3*; IL-4: 0.8+/-0.6, 1.2+/-0.2,
      0.7+/-0.1, 0.7+/-0.1*, 0.9+/-0.2, 0.6+/-0.2*; IL-5: 0.8+/-0.3,
      12.7+/-2.1, 10.4+/-1.8, 13.4+/-1.8, 11.1+/-1.8, 11.7+/-2.2; IL-13:
      0.03+/-0.01, 7.3+/-1.1, 4.4+/-0.9*, 5.7+/-1.1, 4.4+/-0.6*, 5.4+/-1.2;
      IL-17A: 0.2+/-0.1, 0.4+/-0.1, 0.3+/-0.1, 0.3+/-0.1, 0.4+/-0.1,
      0.3+/-0.1 (* p < 0.05 vs OVA/H2O). Every significant CBNP effect was a
      DECREASE, i.e. an attenuation rather than an aggravation.
    evidence:
      - reference: "PMID:29614747"
        reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The exposure to CBNP did not increase the relative lung wet weight (Figure 1a) nor the number of immune cells (Figure 1b) or inflammatory cytokines (Table 2) in the BAL fluid, and the airway hyperresponsiveness to methacholine was not different from OVA/H2O treated mice (Figure 1c)."
        explanation: "States directly that none of the CBNP raised BAL fluid inflammatory cytokines above the OVA/H2O level, which is the null result the treated output records carry."
      - reference: "PMID:29614747"
