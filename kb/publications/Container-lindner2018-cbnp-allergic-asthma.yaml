mcc_assays:
  - id: "MCC:lindner-transport-trachea"
    name: "Tracheal particle transport speed - CBNP during established allergic airway inflammation"
    description: >-
      Figure 3b, mean transport speed of 4.5 um polystyrene particles on the
      explanted tracheal epithelium, each data point one animal, mean +/-
      SEM. The OVA challenge alone decreased transport speed relative to the
      PBS control, which the authors attribute to the mucus on the
      epithelium decelerating transport rather than to a ciliary defect.
      NULL RESULT: CBNP exposure did not further decrease particle transport.
      Reported as a scatter plot only, so no numeric values are transcribed.
    evidence:
      - reference: "PMID:29614747"
        reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The exposure to the CBNP did not further decrease the particle transport (Figure 3b), but the ciliary beat frequency was decreased following exposure to P90 (Figure 3c)."
        explanation: "The null result for particle transport that this assay's treated output records carry, alongside the separate P90 effect on beat frequency."
      - reference: "PMID:29614747"
        reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Compared to the PBS control group, the cilia-induced particle transport speed was decreased in the OVA controls (Figure 3b), whereas the ciliary beat frequency was not affected (Figure 3c)"
        explanation: "Supports the difference between this assay's PBS control and OVA control output records, i.e. that the allergic model itself impaired transport."
    mucus_composition: "Lectin staining (Ulex europaeus agglutinin-1 and wheat germ agglutinin) showed increased mucus on the epithelium of all OVA-treated mice, and a further increased mucus quantity after P90 exposure"
    has_specified_output:
