  # ---------------------------------------------------------------------------
  - id: "GCM:lindner-mucins-trachea"
    name: "Muc5ac and Muc5b mRNA in tracheal epithelial cells - CBNP during established allergic airway inflammation"
    description: >-
      Table 3, Muc5ac and Muc5b mRNA in isolated tracheal epithelial cells,
      n-fold expression normalised to RPL32, mean +/- SEM, n = 4-8,
      Mann-Whitney U test versus OVA/H2O. The unmodified P90 particles
      significantly INCREASED Muc5ac (101+/-15 vs 35+/-10, p < 0.01); none of
      the PAH-coated particles or AS-PAH changed either mucin. Muc5b was flat
