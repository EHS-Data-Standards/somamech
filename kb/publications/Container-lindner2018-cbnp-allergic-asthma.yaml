  # ---------------------------------------------------------------------------
  # Figure 1b - differential immune cell count. Reported as a plot only, so no
  # numeric values are transcribed.
  # ---------------------------------------------------------------------------
  - id: "BALF:lindner-immune-cells-cbnp"
    name: "BAL fluid differential immune cell count - CBNP during established allergic airway inflammation"
    description: >-
      Figure 1b, differential count of macrophages, lymphocytes, eosinophil
      and neutrophil granulocytes per mL BAL fluid, n = 18-25, mean +/- SEM,
      Mann-Whitney U test versus OVA/H2O. Macrophage, lymphocyte and
      granulocyte numbers were increased in the OVA control relative to the
      PBS control. NULL RESULT: CBNP exposure did not increase immune cell
      numbers. The only significant CBNP effects were decreases in eosinophil
      number after P90-BaP and P90-9NA. Values are plotted, not tabulated, so
      no numeric measurements are recorded here.
    target_cell_type:
      id: "CL:0000771"
      name: "eosinophil"
    evidence:
      - reference: "PMID:29614747"
        reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "P90-BaP and P90-9NA decreased the number of eosinophils (Figure 1b)"
        explanation: "Names the only significant change in the differential cell count - a decrease of eosinophils in the two PAH-coated P90 groups - which is what the P90-BaP and P90-9NA output records stand for."
      - reference: "PMID:29614747"
        reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we did not detect an increase or a decrease in immune cell numbers after exposure to P90 nanoparticles"
        explanation: "Supports the explicit null finding recorded for the unmodified P90 group in this assay."
    has_specified_output:
      - id: "BALF:lindner-immune-cells-cbnp-output-pbs"
        name: "Differential immune cell count - PBS/H2O non-allergic control"
        experimental_group: control
