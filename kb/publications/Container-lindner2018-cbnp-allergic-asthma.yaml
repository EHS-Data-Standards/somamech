# =============================================================================
# CILIARY FUNCTION ASSAYS - tracheal ciliary beat frequency
# =============================================================================

ciliary_function_assays:
  - id: "CILIA:lindner-cbf-trachea"
    name: "Tracheal ciliary beat frequency - CBNP during established allergic airway inflammation"
    description: >-
      Figure 3c, mean ciliary beat frequency of explanted tracheae, each data
      point one animal, mean +/- SEM, calculated from at least 40 ciliated
      cells at four tracheal regions per animal. The OVA challenge alone did
      NOT affect ciliary beat frequency. The only CBNP effect was a DECREASE
      after the unmodified P90; the PAH-coated particles and AS-PAH left
      beat frequency unchanged. Reported as a scatter plot only, so no
      numeric values are transcribed. The authors attribute the P90 effect to
      the more adhesive, viscous Muc5ac-rich mucus agglutinating the cilia
      rather than to cilia damage, since ATP stimulation restored the beat
      frequency equally in all groups.
    airway_region: "trachea"
    analysis_software: "Matlab-based Fourier transformation of grey level changes over time"
    evidence:
      - reference: "PMID:29614747"
        reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The exposure to the CBNP did not further decrease the particle transport (Figure 3b), but the ciliary beat frequency was decreased following exposure to P90 (Figure 3c)."
        explanation: "Names the decrease of ciliary beat frequency specific to the unmodified P90 group, which is what this assay's P90 output record carries."
      - reference: "PMID:29614747"
        reference_title: "Low Dose Carbon Black Nanoparticle Exposure Does Not Aggravate Allergic Airway Inflammation in Mice Irrespective of the Presence of Surface Polycyclic Aromatic Hydrocarbons."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Compared to the PBS control group, the cilia-induced particle transport speed was decreased in the OVA controls (Figure 3b), whereas the ciliary beat frequency was not affected (Figure 3c)"
        explanation: "Supports the equality of the PBS and OVA control output records for beat frequency, which is the baseline the P90 decrease is measured against."
    has_specified_output:
      - id: "CILIA:lindner-cbf-trachea-output-pbs"
        name: "Ciliary beat frequency - PBS/H2O non-allergic control"
        experimental_group: control
