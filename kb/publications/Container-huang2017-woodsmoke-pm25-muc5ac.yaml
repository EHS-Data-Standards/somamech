# =============================================================================
# Huang et al. (2017) - Positive feedback of the amphiregulin-EGFR-ERK pathway
# mediates PM2.5 from wood smoke-induced MUC5AC expression in epithelial cells
# =============================================================================
#
# Source: Sci Rep (2017); PMID:28894207
# DOI: 10.1038/s41598-017-11541-1
#
# Study design:
#   - In vivo: 16 female Sprague-Dawley rats (9 weeks, 180-200 g), randomized
#     to wood smoke or clean-air control; wood smoke 1 h x 4/day x 5 days/week
#     for 3 months (exposure room average PM2.5 20.4 mg/m3, CO 90.15 ppm)
#   - In vitro: primary human bronchial/tracheal epithelial cells at air-liquid
#     interface (2 weeks ALI differentiation) and the NCI-H292 cell line
#   - Stressor: PM2.5 collected from China fir burned in a conventional Chinese
#     wood stove (WSPM2.5), resuspended from filters in DMSO
#   - Controls: extracts from clean filters containing 0.1% DMSO
#
# Key findings:
#   - Wood smoke induced airway mucous cell metaplasia and MUC5AC production in
#     the rat airway; MUC5B rose but not significantly
#   - WSPM2.5 induced MUC5AC mRNA (2.44-/4.55-fold) and protein (1.64-/2.29-fold)
#     in primary ALI cultures at 8 and 40 ug/ml
#   - WSPM2.5 (8 ug/ml) induced MUC5AC mRNA 40.26-fold and protein 4.65-fold in
#     NCI-H292 cells
#   - Induction is EGFR-ligand dependent and requires EGFR-ERK signaling
#   - Amphiregulin (AR) is the major responsible ligand; EGFR-ERK activation in
#     turn drives de novo AR synthesis, forming a positive feedback loop
#
# Extraction note: phosphorylation and staining results are reported only as
# densitometry/figure panels in this paper, so those assays carry qualitative
# output records and evidence quotes rather than invented numbers. Control
# records on fold-change scales are anchored at 1.0, the paper's stated
# reference ("the fold increase is the relative change over untreated cells").
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:28894207"
  reference_title: "Positive feedback of the amphiregulin-EGFR-ERK pathway mediates PM2.5 from wood smoke-induced MUC5AC expression in epithelial cells."
  doi: "10.1038/s41598-017-11541-1"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:huang-woodsmoke-exposure-001"
    name: "Rat whole-body wood smoke exposure"
    description: "A total of 40 g of China fir sawdust was smouldered and the smoke channeled through a piston pump into the exposure room. Rats exposed 1 h four times per day, five days per week, for three months. Exposure-room averages: CO 90.15 ppm, O2 20.94%, PM2.5 20.4 mg/m3. Control rats breathed clean room air. Approved by the Local Ethics Committee of Guangzhou Medical University."
    equipment_required:
      - "Wood smoke exposure room"
      - "Piston pump"
      - "China fir sawdust"

  - id: "PROTOCOL:huang-wspm25-collection-001"
    name: "WSPM2.5 collection and resuspension"
    description: "PM2.5 collected from China fir burned in a conventional Chinese wood stove (April 23-May 6, 2015) with a high-volume sampler (TE-6070, Tisch) fitted with a PM2.5 selective-inlet head (1.13 m3/min), onto glass fibre membrane filters (1.6 um pore, 406 cm2). Filters soaked in DMSO, filtered through a 5 um needle filter, pooled; 40 mg/ml stock stored at -20 C and sonicated 3 x 25 s before use. Controls prepared from clean filters containing 0.1% DMSO."
    equipment_required:
      - "High-volume sampler TE-6070 (Tisch, USA) with PM2.5 selective-inlet head"
      - "Glass fibre membrane filters (1.6 um pore size)"
      - "Sonicator"

  - id: "PROTOCOL:huang-abpas-ihc-001"
    protocol_type: StainingProtocol
    name: "AB-PAS and MUC5AC/MUC5B immunohistochemistry on rat lung"
    description: "Right lung inflated at 25 cm H2O, fixed in 4% paraformaldehyde for 24 h, paraffin-embedded and cut into 4 um para-sagittal sections (n = 5 rats/group). Sections stained with Alcian blue/periodic acid Schiff for mucus and immunostained for MUC5AC (1:50) and MUC5B (1:200) with an immunohistochemistry detection kit (Gene Tech, Shanghai). Quantified with Image-Pro Plus 6.0."
    staining_type: "AB-PAS"
    fixation_method: "4% paraformaldehyde"
    antibodies_used:
      - "anti-MUC5AC (45 M1, Abcam), 1:50"
      - "anti-MUC5B (Santa Cruz Biotechnology), 1:200"
    detection_method: "DAB immunohistochemistry detection kit (Gene Tech, Shanghai)"

  - id: "PROTOCOL:huang-qpcr-001"
    protocol_type: MolecularAssayProtocol
    name: "Real-time quantitative RT-PCR"
    description: "TRIzol RNA extraction; 500 ng RNA reverse transcribed in 10 ul with the PrimeScript RT Reagent Kit (Takara). 2 ul cDNA amplified in 25 ul with SYBR Premix Ex Taq on an MXP3000 QPCR system (Stratagene): 95 C 30 s; 40 cycles of 95 C 5 s and 60 C 30 s; 95 C 1 min; melt 60-95 C. Relative amounts calculated by the 2^-ddCt method."
    detection_method: "SYBR Green real-time PCR"
    reference_gene: "GAPDH"
    normalization_method: "2^-ddCt relative quantification against GAPDH"
    platform: "MXP3000 QPCR system (Stratagene, USA)"

  - id: "PROTOCOL:huang-elisa-muc5ac-001"
    protocol_type: MolecularAssayProtocol
    name: "MUC5AC ELISA on culture supernatants"
    description: "50 ul of sample incubated with 50 ul bicarbonate-carbonate buffer for 2 h at 37 C, blocked with 2% BSA for 1 h, incubated with mouse anti-MUC5AC (1:200) for 2 h at 37 C, then HRP-conjugated anti-mouse IgG (1:5000) for 1 h. Developed with TMB, stopped with 2 M H2SO4, absorbance read at 450 nm. Standard curve from serially diluted bovine submaxillary gland mucin. Data expressed as the ratio of the observed value to the control group value."
    detection_method: "colorimetric ELISA at 450 nm"
    antibodies_used:
      - "mouse anti-MUC5AC (45 M1, Abcam), 1:200"
      - "HRP-conjugated anti-mouse IgG, 1:5000"

  - id: "PROTOCOL:huang-elisa-ligand-001"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for EGFR ligands AR, TGF-alpha and HB-EGF"
    description: "Commercial ELISA kits for AR, TGF-alpha and HB-EGF (R&D Systems) used on cell culture medium per the manufacturer's instructions; optical density measured at 450 nm."
    detection_method: "colorimetric ELISA at 450 nm"
    platform: "R&D Systems ELISA kits"

  - id: "PROTOCOL:huang-wb-001"
    protocol_type: MolecularAssayProtocol
    name: "Western blot for phospho-EGFR and phospho-ERK"
    description: "RIPA lysis with protease and phosphatase inhibitor cocktails, 30 min on ice; centrifuged 12,000 x g, 4 C, 20 min. Protein quantified by BCA. 30 ug protein per lane on 10% SDS-PAGE, transferred to PVDF, blocked in 5% milk, probed 16 h at 4 C with anti-phospho-ERK1/2 (1:1000) or anti-phospho-EGFR (1:10000), then HRP-conjugated secondary IgG and SuperSignal West Femto substrate. Membranes stripped and re-probed with anti-ERK (1:2000), anti-EGFR (1:100,000) and anti-GAPDH (1:1000) for normalization."
    detection_method: "chemiluminescence (SuperSignal West Femto)"
    antibodies_used:
      - "anti-phospho-EGFR (Tyr1068) (Abcam), 1:10000"
      - "anti-EGFR (Abcam), 1:100,000"
      - "anti-phospho-ERK (Thr202/Tyr204) (Cell Signaling Technology), 1:1000"
      - "anti-ERK (Cell Signaling Technology), 1:2000"
      - "anti-GAPDH (TDYbio, Beijing), 1:1000"
    normalization_method: "densitometry normalized to GAPDH or total ERK"
    lysis_buffer: "RIPA buffer (Pierce) with protease and phosphatase inhibitor cocktails"

  - id: "PROTOCOL:huang-if-muc5ac-001"
    protocol_type: StainingProtocol
    name: "MUC5AC immunofluorescence on differentiated ALI cultures"
    description: "Differentiated bronchial/tracheal epithelial cells fixed in 4% paraformaldehyde 20 min, permeabilized with 0.5% Triton X-100, blocked with 3% BSA 1 h, incubated overnight at 4 C with mouse monoclonal anti-MUC5AC (1:100), then Cy3-conjugated anti-mouse IgG (1:200) for 1 h; nuclei stained with DAPI 5 min. Inserts excised, mounted and imaged by confocal microscopy; MUC5AC signal expressed as the ratio of Cy3 to total DAPI fluorescence (Image-Pro Plus 6.0)."
    staining_type: "immunofluorescence"
    fixation_method: "4% paraformaldehyde"
    counterstain: "DAPI"
    antibodies_used:
      - "mouse monoclonal anti-MUC5AC (45 M1, Abcam), 1:100"
      - "Cy3-conjugated anti-mouse IgG, 1:200"
    detection_method: "confocal fluorescence microscopy"
    normalization_method: "MUC5AC (Cy3) fluorescence divided by total DAPI fluorescence"

