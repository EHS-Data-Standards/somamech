  # ---------------------------------------------------------------------------
  - id: "GEX:huang-ar-autocrine-feedback-h292"
    name: "EGFR-ERK dependence and de novo synthesis of amphiregulin in NCI-H292 cells"
    description: "Pretreatment with EGFR-neutralizing antibody (0.5 ug/ml), AG1478 (10 uM) or PD98059 (5 uM) significantly reduced WSPM2.5-induced AR mRNA expression and AR release, and exogenous AR (1,800 pg/ml) increased AR mRNA in an AG1478- and PD98059-sensitive way. Actinomycin D and cycloheximide (10 ug/ml) inhibited AR secretion and attenuated MUC5AC mRNA, showing de novo AR synthesis is required. This closes the positive feedback loop between AR release and EGFR-ERK activation. Results are reported as figure panels, so no numeric values are recorded."
    target_gene: "AREG (amphiregulin, AR)"
    gene_expression_method: "real-time quantitative RT-PCR and ELISA"
    normalization_reference: "GAPDH"
    evidence:
      - reference: "PMID:28894207"
        reference_title: "Positive feedback of the amphiregulin-EGFR-ERK pathway mediates PM2.5 from wood smoke-induced MUC5AC expression in epithelial cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Pretreatment with anti-EGFR, AG1478 or PD98059 significantly reduced WSPM2.5-induced AR mRNA expression (Fig. 9A) and AR release (Fig. 9B), indicating that the autocrine effects of AR are mediated by the EGFR-ERK pathway in epithelial cells."
