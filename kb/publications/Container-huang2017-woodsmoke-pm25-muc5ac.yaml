        evidence_source: IN_VITRO
        snippet: "Interestingly, AR neutralization suppressed most of the WSPM2.5-induced EGFR and ERK phosphorylation (Fig. 7A,B and C) and MUC5AC gene expression (Fig. 7D), whereas blockade of TGF-α or HB-EGF showed a partial reduction, but this decrease failed to reach statistical significance."
