    name: "EGFR activation leads to mucin hypersecretion"
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-mucin-hypersecretion"
      name: "Mucin hypersecretion"
      biological_action: increased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: strong
    evidence:
      - reference: "PMID:28894207"
        reference_title: "Positive feedback of the amphiregulin-EGFR-ERK pathway mediates PM2.5 from wood smoke-induced MUC5AC expression in epithelial cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Furthermore, pretreatment with the selective ERK kinase inhibitor PD98059 (Fig. 5C) significantly inhibited WSPM2.5-induced MUC5AC expression, indicating that WSPM2.5-induced MUC5AC production is dependent on ERK activation."
        explanation: "Inhibitor reversal: blocking ERK downstream of EGFR abolished the MUC5AC induction, which is the causal link this relationship asserts."
      - reference: "PMID:28894207"
        reference_title: "Positive feedback of the amphiregulin-EGFR-ERK pathway mediates PM2.5 from wood smoke-induced MUC5AC expression in epithelial cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In summary, this study found that WSPM2.5 induces MUC5AC expression through the AR-EGFR-ERK pathway and that subsequent activation of EGFR-ERK leads to autocrine effects of AR, with the released AR further promoting its own expression."
        explanation: "The paper's own summary that WSPM2.5 induces MUC5AC expression through the AR-EGFR-ERK pathway."
