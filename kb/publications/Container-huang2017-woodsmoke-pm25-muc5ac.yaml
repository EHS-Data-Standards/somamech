  - id: "EGFR:huang-ligand-neutralization-h292"
    name: "Identification of amphiregulin as the EGFR ligand driving WSPM2.5-induced signaling"
    description: "NCI-H292 cells pretreated 1 h with neutralizing antibodies against AR, TGF-alpha or HB-EGF, then stimulated with WSPM2.5 (60 min for p-EGFR, 5 min for p-ERK, 24 h for MUC5AC mRNA). AR neutralization suppressed most of the WSPM2.5-induced EGFR and ERK phosphorylation and MUC5AC expression, while TGF-alpha and HB-EGF blockade gave only non-significant partial reductions. Recombinant AR (300-1,800 pg/ml) induced MUC5AC dose-dependently. Results are reported as figure panels, so no numeric values are recorded."
    normalization_reference: "GAPDH"
    evidence:
      - reference: "PMID:28894207"
        reference_title: "Positive feedback of the amphiregulin-EGFR-ERK pathway mediates PM2.5 from wood smoke-induced MUC5AC expression in epithelial cells."
