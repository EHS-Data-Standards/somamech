  - id: "GCM:huang-woodsmoke-rat-3mo"
    name: "Airway mucous cell metaplasia and mucin expression in rats after 3 months of wood smoke"
    description: "AB-PAS staining, MUC5AC/MUC5B immunohistochemistry and whole-lung real-time PCR in Sprague-Dawley rats exposed to wood smoke or clean air for three months (n = 5 rats/group). Wood smoke induced severe airway mucous cell metaplasia and highly elevated MUC5AC; MUC5B also rose but not significantly. Quantification is reported only in figure panels, so no numeric values are recorded here."
    evidence:
      - reference: "PMID:28894207"
        reference_title: "Positive feedback of the amphiregulin-EGFR-ERK pathway mediates PM2.5 from wood smoke-induced MUC5AC expression in epithelial cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "exposure to wood smoke for 3 months induced severe airway mucous cell metaplasia, whereas the control animals did not exhibit mucous cell metaplasia"
        explanation: "States the in vivo contrast this assay records: wood smoke produced severe airway mucous cell metaplasia while control animals did not."
      - reference: "PMID:28894207"
        reference_title: "Positive feedback of the amphiregulin-EGFR-ERK pathway mediates PM2.5 from wood smoke-induced MUC5AC expression in epithelial cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Furthermore, both immunochemistry (Fig. 1C,D and H) and real-time PCR (Fig. 1J) revealed that MUC5AC levels were highly elevated in the wood smoke group."
        explanation: "Names the two readouts (immunochemistry and real-time PCR) behind the elevated MUC5AC recorded for the wood smoke output record."
      - reference: "PMID:28894207"
        reference_title: "Positive feedback of the amphiregulin-EGFR-ERK pathway mediates PM2.5 from wood smoke-induced MUC5AC expression in epithelial cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "MUC5B expression (Fig. 1E,F,I and J) was also elevated after wood smoke challenge, although this changes was not statistically significant."
        explanation: "Supports recording the MUC5B rise as non-significant rather than as an effect."
