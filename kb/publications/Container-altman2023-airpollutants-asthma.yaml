      name: "MUPPITS1 nasal transcriptome population"
      model_species:
        id: "NCBITaxon:9606"
        name: "Homo sapiens"
      cohort_size: 168
      inclusion_criteria: "MUPPITS1 participants who reported a respiratory illness during follow-up and had nasal lavage RNA-sequencing available. Module analyses used 17 V-Ex+, 38 V+Ex+, 72 V-Ex- and 120 V+Ex- samples."
      age_range:
