# =============================================================================
# GENE EXPRESSION ASSAYS - nasal airway transcriptional modules vs pollutants
# =============================================================================
# Table 2 columns, in printed order, are:
#   module name | cell association | number of genes |
#   AQI FDR | AQI effect size | PM2.5 FDR | PM2.5 effect size |
#   O3 FDR | O3 effect size
# The effect size is the change in module expression (log2) per one unit
# increase in the pollutant summed over 3 days, so it is recorded here with a
# dimensionless UCUM unit. Where the paper converts a coefficient into a
# percentage change, that percentage is recorded instead.
# =============================================================================

gene_expression_assays:
  - id: "GE:altman-pm25-kallikrein-module"
    name: "Tissue kallikreins and IL-23-IL-17 axis module vs PM2.5"
    description: "Nasal airway expression of the tissue kallikreins and IL-23-IL-17 axis module (143 genes, no cell association) was positively associated with PM2.5 concentrations summed over 3 days (FDR = 0.019, effect size 0.0108 log2 per unit; Table 2). The paper converts the coefficient 0.011 into a 25.7% increase in module expression for a 10 microgram per cubic metre mean increase in PM2.5 over 3 days, which is the value recorded here. This module is one of the three specific to non-viral exacerbations. Association only; the observational design cannot establish that PM2.5 caused the change."
    gene_expression_method: "bulk RNA-sequencing of nasal lavage cell pellets, summarised into weighted gene co-expression modules"
    normalization_reference: "nasal lavage cell percentages and RNA-sequencing library counts"
    evidence:
      - reference: "PMID:36608946"
        reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "For example, the coefficient for the tissue kallikrein induction and IL­23–IL­17 axis module is 0·011, which indicates a 10 μg/m³ mean increase in PM 2·5 for 3 days equates to a 25·7% increase in module expression (appendix p 8)."
        explanation: "Gives both the module coefficient and the 25.7% increase per 10 microgram per cubic metre increase in PM2.5 over 3 days that this assay records as its mRNA level."
      - reference: "PMID:36608946"
        reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Tissue kallikreins and IL-23–IL-17 axis None 143 0·074 0·0023 0·019 0·0108 0·83 0·4875"
        explanation: "Table 2 row for this module: 143 genes, PM2.5 FDR 0.019 and PM2.5 effect size 0.0108."
      - reference: "PMID:36608946"
        reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Moreover, individual pollutants were significantly associated with altered gene expression in coordinated inflammatory pathways, including PM2·5 with increased epithelial induction of tissue kallikreins, mucus hypersecretion, and barrier functions and O3 with increased type-2 inflammation."
        explanation: "The summary statement linking PM2.5 to increased epithelial induction of tissue kallikreins, which is the module measured here."
    has_specified_output:
      id: "GE:altman-pm25-kallikrein-module-output"
      name: "Tissue kallikreins and IL-23-IL-17 module expression change"
      mrna_level:
        value: "25.7"
        unit:
          id: "UO:0000187"
          name: "percent"
    has_exposure_condition:
      - id: "EXPOSURE:altman-pm25-10ugm3-3d"
        name: "10 microgram per cubic metre mean increase in PM2.5 over 3 days"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
        exposure_concentration:
          value: "10"
          unit:
            id: "UCUM:ug/m3"
            name: "microgram per cubic metre"
        exposure_duration:
          value: "3"
          unit:
            id: "UO:0000033"
            name: "day"
    informs_on_key_event:
