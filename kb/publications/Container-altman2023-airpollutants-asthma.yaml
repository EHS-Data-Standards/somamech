# =============================================================================
# Altman et al. (2023) - Associations between outdoor air pollutants and
# non-viral asthma exacerbations and airway inflammatory responses in children
# and adolescents living in urban areas in the USA
# =============================================================================
#
# Source: Lancet Planet Health 2023; 7: e33-44
# DOI: 10.1016/S2542-5196(22)00302-3
#
# Study design:
#   - Retrospective secondary analysis of two human cohorts (no in vitro work)
#   - MUPPITS1: 208 children aged 6-17 with exacerbation-prone asthma in nine
#     US urban centres, followed 2015-2017 for respiratory illnesses;
#     168 participants included in this analysis
#   - ICATA: 419 participants aged 6-20 with persistent allergic asthma in
#     eight US urban sites, 2006-2009; 189 participants included (validation)
#   - Exposure: regional US EPA air quality index (AQI) values and individual
#     pollutant concentrations (PM2.5, PM10, O3, NO2, SO2, CO, Pb) matched to
#     each participant's core-based statistical area and event date
#   - Readouts: respiratory event type, spirometry (FEV1% predicted, FEV1/FVC),
#     and nasal-lavage bulk RNA-seq co-expression modules
#   - Events classified as viral (V+) or non-viral (V-), with (Ex+) or
#     without (Ex-) an asthma exacerbation
#
# Key findings captured here:
#   - AQI, and specifically O3, NO2 and PM2.5 concentrations, were raised
#     around non-viral exacerbations (V-Ex+) relative to the other three
#     event subgroups
#   - During V-Ex+ events AQI and O3 were inversely associated with
#     FEV1% predicted and FEV1/FVC
#   - PM2.5 concentrations were positively associated with epithelial
#     transcriptional modules (tissue kallikreins/IL-23-IL-17, keratinisation
#     and tight junctions, eosinophil activation and mucus hypersecretion,
#     EGFR signalling, cilia and IL-33 response)
#   - O3 concentrations were specifically associated with the type-2
#     inflammation module
#
# Caveat recorded in the descriptions below: this is an observational
# association study. Nothing here establishes that a measured pollutant
# caused the transcriptional or physiological change.
#
# No values were read off figures. Every number below is either narrated in
# the text or printed in Table 1 / Table 2, and the quoting evidence block
# names where it came from.
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:36608946"
  reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
  doi: "10.1016/S2542-5196(22)00302-3"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:altman-epa-aqi-001"
    name: "US EPA air quality index and pollutant exposure assignment"
    description: "AQI values and individual pollutant data (PM2.5, PM10, O3, NO2, SO2, CO, Pb) downloaded from the US Environmental Protection Agency for the study years and recruitment cities. For each pollutant, monitors within each core-based statistical area were subset to those in the recruitment census tract, and the maximum concentration was taken for each city census tract and day, then matched to each event by core-based statistical area and date. Module analyses used pollutant values summed over the day of nasal sample collection and the preceding 2 days."
    equipment_required:
      - "US EPA pre-generated air quality data files (https://aqs.epa.gov/aqsweb/airdata/download_files.html)"

  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:altman-spirometry-001"
    name: "Spirometry and fractional exhaled NO (ATS/ERS)"
    description: "Spirometry and measurement of fractional exhaled NO (FeNO) collected according to American Thoracic Society and European Respiratory Society guidelines. FEV1% predicted and FEV1/FVC were compared with same-day AQI values or pollutant concentrations using generalised linear mixed-effects models with a random effect for participant; values collected after initiation of systemic corticosteroids were excluded, and the FEV1/FVC model additionally controlled for age and sex."
    spirometry_standard: "American Thoracic Society / European Respiratory Society standardisation of spirometry"

  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:altman-rnaseq-001"
    name: "Nasal lavage bulk RNA-sequencing and co-expression module analysis"
    description: "RNA-sequencing performed on bulk RNA extracted from nasal lavage cell pellets (Gene Expression Omnibus GSE115824). Data summarised into cell-associated modules of coexpressed genes using combined cell association by correlation and weighted gene correlation network analysis, annotated with DAVID and STRING. Module expression was compared with AQI values or pollutant concentrations summed over 3 days using a generalised linear mixed-effects model adjusted for nasal lavage cell percentages and RNA-sequencing library counts, with a random effect for participant. Benjamini-Hochberg false discovery rate < 0.05 was considered significant."
    detection_method: "bulk RNA-sequencing"
    normalization_method: "adjusted for cell percentages in the nasal lavage sample and number of counts in the RNA-sequencing library"
    platform: "Illumina RNA-sequencing (GEO accession GSE115824)"

# =============================================================================
# LUNG FUNCTION ASSAYS - spirometry during respiratory events (MUPPITS1)
# =============================================================================
# Table 1 columns, in printed order, are:
#   V+Ex+ | V-Ex+ | p value | V+Ex- | V-Ex- | p value
# so the quoted Table 1 rows below carry all four subgroup medians (IQR).
# =============================================================================

lung_function_assays:
  - id: "LF:altman-v-minus-ex-plus"
    name: "Lung function during non-viral asthma exacerbations (V-Ex+)"
    description: "Spirometry during non-viral exacerbation events (V-Ex+, 14 of 154 assessed events) in the MUPPITS1 cohort. Median FEV1% predicted 71 (IQR 64-80) and median FEV1/FVC 0.62 (IQR 0.60-0.72) (Table 1). Same-day AQI was inversely associated with FEV1% predicted (beta = -0.35, FDR = 0.014) and with FEV1/FVC (beta = -0.0028, FDR = 0.014), and among individual pollutants only O3 was significantly associated with FEV1% predicted (beta = -591, FDR = 0.052) and FEV1/FVC (beta = -6.0, FDR = 0.0084); no significant inverse association was seen in the other three event groups. Observational association only."
    evidence:
      - reference: "PMID:36608946"
        reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FEV1% predicted 71 (59 to 83) 71 (64 to 80) 0·94 92 (84 to 102) 90 (83 to 104) 0·84"
        explanation: "Table 1 row for FEV1% predicted; the second value, 71 (64 to 80), is the V-Ex+ subgroup median recorded as this assay's fev1."
      - reference: "PMID:36608946"
        reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FEV1/FVC 0·66 (0·60 to 0·79) 0·62 (0·60 to 0·72) 0·74 0·79 (0·70 to 0·84) 0·78 (0·72 to 0·84) 0·64"
        explanation: "Table 1 row for FEV1/FVC; the second value, 0.62 (0.60 to 0.72), is the V-Ex+ subgroup median recorded as this assay's fev1_fvc_ratio."
      - reference: "PMID:36608946"
        reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "During V–Ex+ events, AQI values showed a significant inverse association with FEV 1% predicted"
        explanation: "States the inverse association between same-day air quality index and FEV1% predicted that this assay records for the non-viral exacerbation subgroup."
      - reference: "PMID:36608946"
        reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Among the individual pollutants, O 3 was significantly associated with FEV 1% predicted (β=–591, FDR=0·052) and FEV1/FVC (β=–6·0, FDR=0·0084) only in the V–Ex+ event subgroup (appendix p 7)."
        explanation: "Gives the O3-specific associations with FEV1% predicted and FEV1/FVC, and that they were confined to the V-Ex+ subgroup, which is why ozone is the exposure agent on this assay."
      - reference: "PMID:36608946"
        reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We identified that increased air quality index values, driven predominantly by increased PM2·5 and O3 concentrations, were significantly associated with asthma exacerbations and decreases in pulmonary function that occurred in the absence of a provoking viral infection."
        explanation: "The paper's summary finding that raised AQI, driven by PM2.5 and O3, was associated with exacerbations and with decreases in pulmonary function in the absence of a virus."
    has_specified_output:
      id: "LF:altman-v-minus-ex-plus-output"
      name: "Spirometry, non-viral exacerbation subgroup"
