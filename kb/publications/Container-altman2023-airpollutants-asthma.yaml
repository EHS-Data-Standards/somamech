  - id: "GE:altman-o3-type2-module"
    name: "Type-2 inflammation module vs O3"
    description: "Nasal airway expression of the type-2 inflammation module (eosinophil-associated, 242 genes, containing the canonical type-2 cytokines IL4, IL5 and IL13) was the only module specifically associated with O3 concentrations summed over 3 days (FDR = 0.037, effect size 3.7624; Table 2). The paper converts this to a 47.8% increase in module expression for a mean 0.05 ppm increase in O3 over 3 days, which is the value recorded here. Association only."
    gene_expression_method: "bulk RNA-sequencing of nasal lavage cell pellets, summarised into weighted gene co-expression modules"
    normalization_reference: "nasal lavage cell percentages and RNA-sequencing library counts"
    evidence:
      - reference: "PMID:36608946"
        reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "By contrast, O 3 concentrations were related specifically to increased expression of the type­2 inflammation module (FDR <0·05) with an effect size of 3·76, which indicates a mean 0·05 ppm increase in O 3 for 3 days equates to a 47·8% increase in module expression (appendix p 8)."
        explanation: "Gives the O3-specific association with the type-2 inflammation module, the effect size, and the 47.8% increase per 0.05 ppm increase in O3 over 3 days recorded as this assay's mRNA level."
      - reference: "PMID:36608946"
        reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Type-2 inflammation Eosinophil 242 0·039 0·0020 0·73 0·0012 0·037 3·7624"
        explanation: "Table 2 row for this module: eosinophil-associated, 242 genes, O3 FDR 0.037 and O3 effect size 3.7624."
      - reference: "PMID:36608946"
        reference_title: "Associations between outdoor air pollutants and non-viral asthma exacerbations and airway inflammatory responses in children and adolescents living in urban areas in the USA: a retrospective secondary analysis."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We observed that O 3 is associated with eosinophilic or type­2 inflammation; it was positively associated with expression of a module containing canonical type ­2 cytokines IL4, IL5, and IL13, among numerous other ele­ ments of type ­2 inflammation, and with a concurrent decrease in lung function."
        explanation: "Confirms the module contents (IL4, IL5, IL13) and that the O3 association came with a concurrent decrease in lung function."
    has_specified_output:
      id: "GE:altman-o3-type2-module-output"
      name: "Type-2 inflammation module expression change"
      mrna_level:
        value: "47.8"
        unit:
