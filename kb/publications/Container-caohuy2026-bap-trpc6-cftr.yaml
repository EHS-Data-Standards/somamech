  # --- beta2AR vs CFTR correlation under B[a]P, dBCi (Fig 2e) ---
  - id: "GE:caohuy-b2ar-cftr-correlation-bap-dbci"
    name: "beta2AR and CFTR protein co-decline under B[a]P - Pearson correlation (dBCi)"
    description: "Densitometry of beta2AR and CFTR Western blots across the B[a]P dose series in differentiated BCi.NS1.1 organoids. The two protein changes were positively correlated with a Pearson correlation coefficient r = 0.9948 (p = 0.005), indicating coordinated loss of beta2AR and CFTR."
    gene_expression_method: "Western blot densitometry with Pearson correlation"
    normalization_reference: "beta-actin"
    evidence:
      - reference: "PMID:42079210"
        reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Finally, Fig 2e showed that there was a significant positive correlation between changes in 2AR and CFTR with a Pearson Correlation Coefficient (r) of 0.9948 (p= 0.005)."
        explanation: "States the Pearson correlation coefficient and p-value recorded as this assay's output."
    has_specified_output:
      id: "GE:caohuy-b2ar-cftr-correlation-bap-dbci-output"
      name: "Pearson correlation between beta2AR and CFTR protein changes"
      description: "Pearson correlation coefficient r = 0.9948, p = 0.005 (three independent experiments)."
    has_exposure_condition:
