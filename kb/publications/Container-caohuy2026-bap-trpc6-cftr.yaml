# =============================================================================
# Caohuy et al. (2026) - PM2.5 toxin benzo[a]pyrene induces life-limiting
# inflammation and oxidative stress in the airway by up-regulation of TRPC6
# and inactivation of beta2AR/CFTR signaling
# =============================================================================
#
# Source: bioRxiv preprint, posted 2026-04-24
# DOI: 10.64898/2026.04.21.719931
#
# Study design (three model systems, all in vitro / ex vivo):
#   - Differentiated BCi-NS1.1 (dBCi) human airway basal-stem-cell organoids
#     at air-liquid interface (ALI) for 25-28 days
#   - Polarized human bronchial 16HBE14o- cells at ALI for 9-10 days
#   - Ex vivo ferret lung tracheobronchial slice cultures (24 h)
#
# Exposures:
#   - Benzo[a]pyrene (B[a]P) 0.1, 1.0 and 10 uM (6 h apical + 18 h ALI = 24 h)
#   - PM2.5 (ERM-CZ110, Sigma-Aldrich) 12.5, 25, 50 and 100 ng/mL for 24 h
#   - H2O2 100 uM as a positive control for oxidative stress
#
# Key findings recorded here:
#   - PM2.5 and B[a]P reduce CFTR chloride channel activity (Ussing chamber)
#   - PM2.5 and B[a]P reduce beta2AR and CFTR protein, and raise TRPC6 protein
#   - Loss of beta2AR correlates with loss of CFTR (Pearson r = 0.9948, p = 0.005)
#     and inversely with TRPC6 gain (Pearson r = -0.9875, p = 0.01)
#   - PM2.5, B[a]P and H2O2 all significantly increase ROS (CellROX Green)
#   - PM2.5 raises basolateral IL-6 and IL-8 secretion
#   - Ex vivo ferret slices reproduce all of the above
#   - B[a]P dose-dependently lowers five serum-marker microRNAs
#
# NOTE ON VALUES: this paper reports its measurements graphically (Western
# blots, bar charts, Isc tracings) and states significance in the text rather
# than tabulating numbers. Per the extraction rules, no measurement values are
# recorded here beyond the two Pearson coefficients the text states explicitly;
# figure-eyeballed values would be fabrications.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:42079210"
  reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
  doi: "10.64898/2026.04.21.719931"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:caohuy-ali-culture-001"
    name: "Air-liquid interface culture of dBCi organoids and polarized 16HBE14o- cells"
    description: "BCi-NS1.1 basal stem cells and 16HBE14o- cells seeded at 5x10^5 cells/cm2 on 12-mm Snapwell or Transwell inserts and 9x10^5 cells/cm2 on 24-mm Transwell inserts; maintained at air-liquid interface for 25-28 days (dBCi) and 9-10 days (16HBE14o-) at 37 C, 5% CO2. Apical and basolateral sides exposed to DMSO, B[a]P or PM2.5; after 6-hr incubation apical media were removed and exposure continued for a further 18 hr under ALI conditions. DMSO was under 1.0% in all treatments."
    equipment_required:
      - "Snapwell and Transwell inserts (12-mm and 24-mm)"
      - "Humidified tissue culture incubator (37 C, 5% CO2)"
      - "Pneumacult-ALI media kit (Stemcell)"

  - id: "PROTOCOL:caohuy-ussing-001"
    protocol_type: Protocol
    name: "Ussing chamber measurement of cAMP-activated CFTR short-circuit current"
    description: "Treated Snapwell inserts mounted in Ussing chambers (Physiologic Instruments, Reno, Nevada) with a basolateral-to-apical chloride gradient (NaCl replaced by sodium gluconate). Sodium currents inactivated with 100 uM amiloride, CFTR activated with 10 uM forskolin plus 100 uM IBMX, then inhibited with 10 uM CFTRinh-172. Both compartments gassed with 5% CO2 (pH 7.4) at 37 C."
    equipment_required:
      - "Ussing chambers (Physiologic Instruments, Reno, Nevada)"
      - "Amiloride, forskolin, IBMX, CFTRinh-172 (Sigma-Aldrich)"

  - id: "PROTOCOL:caohuy-wb-001"
    protocol_type: MolecularAssayProtocol
    name: "Western blot for CFTR, beta2AR, TRPC6 and NF-kB pathway proteins"
    description: "RIPA lysis with anti-protease/phosphatase cocktail; 50 ug lysate per sample on 4-12% gradient gels (Invitrogen); PVDF transfer; overnight primary antibody at 4 C; HRP-coupled secondary; chemiluminescent detection on a BioRad ChemiDoc imaging system and quantification with Imagelab software."
    detection_method: "chemiluminescence (BioRad ChemiDoc)"
    normalization_method: "beta-actin loading control"
    lysis_buffer: "RIPA buffer with Halt protease and phosphatase inhibitor cocktail"
    antibodies_used:
      - "CFTR (R&D Systems, MAB1660)"
      - "CFTR (SCBT, sc-376683)"
      - "beta2AR (Novus Biologicals, NBP261710)"
      - "TRPC6 (Protein Tech, 18236-1-AP)"
      - "phospho-AKT Ser473 (Cell Signaling, 9271)"
      - "phospho-NFkB p65 Ser276 (Cell Signaling, 3037)"
      - "NFkB p65 total (Cell Signaling, 8242)"
      - "phospho-NFkB p65 Ser536 (no catalog number stated by the paper)"
      - "beta-actin (Sigma, A5441)"

  - id: "PROTOCOL:caohuy-wb-ferret-001"
    protocol_type: MolecularAssayProtocol
    name: "Western blot for CFTR, beta2AR and TRPC6 in ferret lung slice lysates"
    description: "Ferret tracheobronchial slice tissues homogenized in RIPA buffer with anti-protease/phosphatase inhibitor cocktail using a handheld motor-driven tissue homogenizer and centrifuged at 20,000 rpm for 5 min; 50 ug lysate per sample on 4-12% gradient gels; PVDF transfer; overnight primary antibody at 4 C. The paper specifies a different antibody panel for the ferret blots than for the human cell blots."
    normalization_method: "beta-actin loading control"
    lysis_buffer: "RIPA buffer with anti-protease/phosphatase inhibitor cocktail"
    antibodies_used:
      - "CFTR (CFF Antibody Distribution program, mAb 660 + mAb 596)"
      - "beta2AR (Novus Biologicals, NBP261710)"
      - "TRPC6 (Protein Tech, 18236-1-AP)"
      - "beta-actin (Cell Signaling, 4970)"

  - id: "PROTOCOL:caohuy-elisa-001"
    protocol_type: MolecularAssayProtocol
    name: "DuoSet ELISA for basolateral IL-6, IL-8 and TNF-alpha"
    description: "Culture media from the basolateral compartments assayed for IL-8, IL-6 and TNF-alpha with the respective DuoSet ELISA kits (R&D Systems) per the manufacturer's instructions. Concentrations calculated from a standard curve and normalized to MTT or total protein values."
    detection_method: "sandwich ELISA (R&D Systems DuoSet)"
    normalization_method: "normalized to MTT or total protein concentration"

  - id: "PROTOCOL:caohuy-cellrox-001"
    protocol_type: MolecularAssayProtocol
    name: "CellROX Green oxidative stress (ROS) assay"
    description: "Apical and basolateral sides of polarized 16HBE14o- cells incubated with PM2.5, B[a]P or H2O2 at 37 C. After 6 hr the apical media were replaced with 10 uM CellROX Green in Ca2+/Mg2+-free HBSS and incubated a further 18 hr. Monolayers washed and lysed in 0.1% Triton X-100-PBS; fluorescence read at Ex 483 nm / Em 530 nm on a CLARIOstar microplate reader; background subtracted and values normalized to total protein."
    detection_method: "CellROX Green fluorescence (Ex 483 nm / Em 530 nm, CLARIOstar)"
    normalization_method: "normalized to total protein concentration"
    equipment_required:
      - "CellROX Green reagent (ThermoFisher)"
      - "CLARIOstar microplate reader (BMG LABTECH)"

  - id: "PROTOCOL:caohuy-ferret-slice-001"
    name: "Ex vivo ferret lung tracheobronchial slice culture"
    description: "Ferret lung parenchyma washed in PBS with penicillin/streptomycin and dissected into 9 cubes per lung (average wet weight 400 mg) containing tracheobronchial tubes. Tissues conditioned 1 hr in Pneumacult-EX Plus Basal media, then cultured 24 hr in the same media containing DMSO, 100 ng/mL PM2.5 or 10 uM B[a]P at 37 C, 5% CO2. Media collected and centrifuged at 400 x g for IL-6 ELISA; tissues homogenized in RIPA buffer for Western blot."
    equipment_required:
      - "Pneumacult-EX Plus Basal media kit (Stemcell)"
      - "Ferret IL-6 ELISA kit (Genorise, PA, USA)"
      - "Handheld motor-driven tissue homogenizer"

  - id: "PROTOCOL:caohuy-taqman-mir-001"
    protocol_type: MolecularAssayProtocol
    name: "TaqMan microRNA quantification in dBCi organoids"
    description: "Total RNA extracted with mirVana kits (Life Technologies); RNA quality checked on a NanoDrop ND-1000 (A260/A280 between 1.8 and 2.0). MicroRNAs measured with specific TaqMan probes, U6 as endogenous control, relative fold changes by the 2^-ddCT method. Data are three technical replicates, reported as mean +/- SEM."
    detection_method: "TaqMan qRT-PCR"
    reference_gene: "U6"
    normalization_method: "2^-ddCT relative to U6"

