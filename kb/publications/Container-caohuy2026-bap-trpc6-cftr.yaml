cftr_assays:
  # B[a]P dose series in differentiated BCi-NS1.1 organoids (Fig 2a, 2b)
  - id: "CFTR:caohuy-bap-dbci-24h"
    name: "CFTR short-circuit current - B[a]P in differentiated BCi-NS1.1 organoids"
    description: "cAMP-activated CFTR-dependent short-circuit current (Isc) measured in Ussing chambers after 24 h exposure of differentiated BCi.NS1.1 (dBCi) ALI organoids to B[a]P (0.1, 1.0 and 10 uM). Isc was systematically and significantly reduced as B[a]P concentration rose. The paper reports the result as representative Isc tracings (Fig 2a, 2b), so no numeric Isc value is recorded here."
    stimulation_agent: "10 uM forskolin + 100 uM IBMX"
    evidence:
      - reference: "PMID:42079210"
        reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Fig 2a and Fig 2b showed that CFTR channel function, represented by short circuit currents (Isc), were systematically and significantly reduced by increases in"
        explanation: "The primary result sentence for this assay: Fig 2a/2b report that cAMP-activated CFTR short-circuit current fell systematically and significantly as the exposure concentration rose. The quote is cut mid-sentence before the 'B[a]P concentrations' phrase because the validator strips bracketed spans from snippets but not from the cached text; the cached PDF also renders the delta of 'delta-Isc' as a Symbol-font glyph, which the snippet reproduces verbatim."
      - reference: "PMID:42079210"
        reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "2AR results in loss of CFTR channel function and coordinated loss of both 2AR and CFTR proteins."
        explanation: "The authors' summary of the Fig 2 Ussing chamber and Western blot series: 24 h of B[a]P exposure causes loss of CFTR channel function, which is what this assay records."
      - reference: "PMID:42079210"
        reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "CFTR channel activity was detected by first inactivating sodium currents with 100 µM amiloride; then activating CFTR chloride channels with 10 µM forskolin and 100 µM IBMX; then specifically inactivating CFTR channels with 10 µM CFTRinh-172."
        explanation: "Methods sentence establishing that the recorded current is the CFTR-specific, forskolin/IBMX-activated component measured in the Ussing chamber."
    has_specified_output:
      id: "CFTR:caohuy-bap-dbci-24h-output"
      name: "CFTR-dependent Isc after B[a]P exposure"
      description: "Reported as representative Isc tracings with significant, dose-dependent reduction versus DMSO control (one-way ANOVA with Tukey post-hoc, p < 0.01, three independent experiments). No numeric value is stated in the text."
