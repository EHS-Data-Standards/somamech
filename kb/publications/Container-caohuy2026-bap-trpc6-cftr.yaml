  - id: "GE:caohuy-cftr-pm25-16hbe-24h"
    name: "CFTR protein - PM2.5 dose series in polarized 16HBE14o- cells (Western blot)"
    description: "Total CFTR protein by Western blot in polarized 16HBE14o- cells treated for 24 h with PM2.5 at 12.5, 25, 50 and 100 ng/mL. CFTR expression declined progressively as PM2.5 concentration rose (Fig 3c). Representative blots only; no densitometric value is stated in the text."
    target_gene: "PR:000003411"
    gene_expression_method: "Western blot"
    normalization_reference: "beta-actin"
    evidence:
      - reference: "PMID:42079210"
        reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Finally, Fig 3c showed that as PM2.5 concentration rose, expression of both CFTR and 2AR progressively declined"
        explanation: "States that CFTR protein expression declined progressively with rising PM2.5 concentration, the decrease this assay records. (The cached PDF text renders 'β2AR' with a Symbol-font beta glyph, which the snippet reproduces verbatim.)"
      - reference: "PMID:42079210"
        reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Cells were treated with various concentrations of PM2.5 for 24 hr."
        explanation: "Figure 3 legend confirming the 24 h PM2.5 exposure used for this Western blot."
    has_specified_output:
      id: "GE:caohuy-cftr-pm25-16hbe-24h-output"
      name: "CFTR protein level after PM2.5"
      description: "Progressive, dose-dependent decline in CFTR protein relative to DMSO control (representative Western blot, Fig 3c; n = 4). No numeric value stated in the text."
    has_exposure_condition:
      - id: "EXPOSURE:caohuy-pm25-100ng-24h"
        name: "PM2.5 (ERM-CZ110) 100 ng/mL for 24 hours"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
        exposure_concentration:
          value: "100"
          unit:
            id: "UO:0000275"
            name: "nanogram per milliliter"
        exposure_duration:
          value: "24"
          unit:
            id: "UO:0000032"
            name: "hour"
    informs_on_key_event:
