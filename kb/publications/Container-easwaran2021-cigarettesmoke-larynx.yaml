    description: "BrdU positive proliferating cells in the mid-membranous vocal fold epithelium were significantly elevated after 1 day of cigarette smoke exposure and were back to control levels at 5 days, 10 days and after 5 days of cessation. Cell counts appear only in Fig. 8 and are not transcribed here."
    gene_expression_method: "BrdU immunohistochemistry with DAB detection; positive nuclei counted at 20x on left and right vocal folds"
    evidence:
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "BrdU labeled cells were significantly elevated only after 1 day of CSE (Fig. 8B, F) in the vocal folds."
        explanation: "States the day-1-only increase in BrdU labelled proliferating cells in the vocal folds that this assay records."
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
