    name: "Total subglottic glandular area after short-term cigarette smoke exposure (negative result)"
    description: "Total mucus-producing glandular area in the subglottis was not significantly increased at any exposure time point or in the 5 day reversibility group, so the increased submucosal gland cell proliferation seen at days 5 and 10 was not accompanied by gland hypertrophy. Recorded as a negative result; areas appear only in Fig. 6."
