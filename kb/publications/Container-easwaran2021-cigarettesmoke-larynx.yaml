  - id: "CILIARY:easwaran-sem-vf-microprojections"
    name: "SEM of vocal fold epithelial surface microprojections after short-term cigarette smoke exposure"
    description: "Blinded visual scoring of SEM images of the vocal fold surface showed significant microprojection damage only after 10 days of cigarette smoke exposure, rated moderate to extensive (score 2-3); the 5 day exposure and 5 day reversibility groups were not significantly damaged. Epithelial sloughing/exfoliation was seen at day 5 and ulceration at day 10, which the authors read as early signs of necrosis. The paper describes these microprojections as contributing to epithelial barrier integrity, which is why this assay is mapped to the epithelial barrier key event. Damage scores appear only in Fig. 13."
    airway_region: "larynx, glottis (vocal fold, stratified squamous epithelium)"
    analysis_software: "Blinder web-based scoring application (Solibyte Solutions)"
    evidence:
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Significant damage to the VF microprojections was observed only in the mice in the 10 day CSE group (Fig. 13E, J, K) in comparison to the mice in the control (Fig. 13A, F, K) and 1 day CSE group (Fig. 13B, G, K)."
        explanation: "States that significant vocal fold microprojection damage occurred only in the 10 day exposure group, which is what this assay records."
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Visual examination of the right and left vocal folds indicated that CS causes moderate to extensive (score 2–3) damage to the VF after 10 days of CSE (Fig. 13K)."
        explanation: "Gives the moderate-to-extensive (score 2-3) severity recorded in this assay's description and output."
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Epithelial sloughing/exfoliation and ulceration associated with necrosis were seen in the SEM images of the VF regions after 5 and 10 days of CSE, respectively (Fig. 13C, E)."
        explanation: "Supports the recorded epithelial sloughing at day 5 and ulceration at day 10 on the vocal fold surface."
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These microprojections are believed to play a role in maintaining epithelial barrier integrity, regulating mucus secretions, and nutrient transport"
        explanation: "The paper's own statement that microprojections help maintain epithelial barrier integrity, which is the basis for mapping this assay to the epithelial barrier key event."
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Evaluation of the VF surface by scanning electron microscopy (SEM) revealed significant epithelial microprojection damage at day 10 and early signs of necrosis at days 5 and 10 post-CSE."
        explanation: "The abstract's summary of the same SEM result: microprojection damage at day 10 and early necrosis at days 5 and 10."
    has_specified_output:
      id: "CILIARY:easwaran-sem-vf-microprojections-output"
      name: "Blinded visual damage score of vocal fold epithelial microprojections"
      description: "Direction only: significant damage at day 10 versus control and 1 day exposure (p <= 0.05 per Fig. 13), rated moderate to extensive on a 0-3 scale; no significant damage at 5 days or after cessation. Scores are shown only in Fig. 13 and are therefore not recorded."
