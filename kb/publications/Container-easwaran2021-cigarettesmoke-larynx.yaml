# =============================================================================
# GOBLET CELL / MUCIN ASSAYS
# Subglottic submucosal gland area and acidic vs neutral mucin composition
# by Alcian blue / periodic acid-Schiff staining.
# =============================================================================

goblet_cell_assays:

  - id: "GCM:easwaran-mucin-composition-day10"
    name: "Acidic and neutral mucin composition of the subglottic submucosal glands after short-term cigarette smoke exposure"
    description: "Mucin composition shifted only at day 10: the percentage area of Alcian blue stained acidic mucins decreased significantly and the percentage area of PAS stained neutral mucins increased significantly. Acidic and neutral mucin levels were unchanged at days 1 and 5 and in the 5 day reversibility group. This is a shift in stored glandular mucin composition rather than a measured increase in secretion. Percentage areas appear only in Fig. 7 and are not transcribed here."
    evidence:
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Acidic mucins significantly decreased in the CSE group on day 10 (Fig. 7F)."
        explanation: "States the significant day-10 decrease in acidic mucins recorded by this assay."
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Neutral mucin levels were significantly elevated after 10 days of CSE (Fig. 7F)."
        explanation: "States the significant day-10 increase in neutral mucins recorded by this assay."
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Area of AB-positive acidic and PAS-positive neutral mucin levels did not change in the CSE group at days 1 and 5 and the 5 day REV group (Fig. 7D, E)."
        explanation: "Supports the recorded absence of any change at days 1 and 5 and in the reversibility group."
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The digital images of AB/PAS stained slides were utilized to measure the subglottic glandular area and mucus composition by Fiji (derivative of ImageJ; NIH)."
        explanation: "Gives the AB/PAS image analysis method by which the acidic and neutral mucin areas were measured."
    has_specified_output:
      id: "GCM:easwaran-mucin-composition-day10-output"
      name: "Percentage area of acidic (Alcian blue) and neutral (PAS) mucins in the subglottic glands"
      description: "Direction only: acidic mucin area decreased and neutral mucin area increased at day 10 (p values reported in Fig. 7 as * p <= 0.05 and **** p <= 0.0001); no change at days 1 or 5 or after cessation. Percentage areas are shown only in Fig. 7 and are therefore not recorded."
    assay_date: "2021-01-01"
    has_exposure_condition:
      - id: "EXPOSURE:easwaran-cs-10day"
        name: "Whole body mainstream 3R4F cigarette smoke, ~2 h/day for 10 days (delivered dose 79.755 mg/kg per day, average TPM ~621 mg/m3)"
        exposure_agent:
