# =============================================================================
# SCANNING ELECTRON MICROSCOPY OF THE LARYNGEAL EPITHELIAL SURFACE
# Filed under ciliary_function_assays, the schema's epithelial-surface
# microscopy assay class. See the curation note in the header.
# =============================================================================

ciliary_function_assays:

  - id: "CILIARY:easwaran-sem-subglottic-cilia"
    name: "SEM of cilia in the respiratory-epithelium-lined subglottis after short-term cigarette smoke exposure"
    description: "Scanning electron microscopy of the respiratory-epithelium-lined laryngeal regions showed compound cilia after 5 and 10 days of cigarette smoke exposure, both normal and compound cilia in the 5 day reversibility group, and cellular surface blistering with ciliary loss at day 10. The findings are qualitative morphological observations; no beat frequency, cilia length or ciliated cell counts were measured."
    airway_region: "larynx, subglottis (respiratory epithelium)"
    evidence:
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The presence of compound cilia was observed in the laryngeal regions lined by RE, after 5 and 10 days after CSE (Fig. 14B, C)."
        explanation: "States the appearance of compound cilia in the respiratory-epithelium-lined larynx at days 5 and 10 that this assay records."
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Cellular surface blistering (rounded) accompanied by the ciliary loss was predominantly seen along this epithelium at day 10 post CSE (Fig. 14C, E)."
        explanation: "States the day-10 cellular surface blistering with ciliary loss that this assay records."
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Examination of the laryngeal subglottic epithelium by SEM showed signs of abnormal cilia including compound and loss of these organelles."
        explanation: "Summarises the abnormal subglottic cilia - compound cilia and ciliary loss - that this assay records."
      - reference: "PMID:33996505"
        reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "SEM visualizations additionally indicated the presence of deformed cilia at days 5 and 10 after CSE and post-cessation in the respiratory epithelium lined subglottis."
        explanation: "The abstract's summary of the same observation, including its persistence post-cessation."
    has_specified_output:
      id: "CILIARY:easwaran-sem-subglottic-cilia-output"
      name: "Qualitative SEM appearance of subglottic cilia"
      description: "Qualitative only: compound cilia at days 5 and 10, normal plus compound cilia after 5 days of cessation, ciliary loss with cellular blistering at day 10. No quantitative ciliary measurement was reported."
