# =============================================================================
# Easwaran et al. (2021) - Short-term whole body cigarette smoke exposure
# induces regional differences in cellular response in the mouse larynx
# =============================================================================
#
# Source: Toxicol Rep. 2021;8:920-930
# DOI: 10.1016/j.toxrep.2021.04.007
# PMID: 33996505
#
# Study design:
#   - In vivo: male C57BL/6J mice, 8-9 weeks old (n = 56), whole-body
#     inhalation (inExpose, SCIREQ) of mainstream smoke from 14 3R4F
#     reference cigarettes, ~2 h/day (126 min), 5 days/week.
#   - Groups: 1 day CSE, 5 day CSE, 10 day CSE (n = 8 each) and a
#     reversibility (REV) group exposed 5 days then air-exposed 5 days.
#     Controls were left in room air.
#   - Delivered dose 5.6968 mg/kg per cigarette (79.755 mg/kg for the 14
#     cigarettes given each day); average TPM ~621 mg/m3.
#   - Endpoints, scored separately in the glottic (vocal fold, VF) and
#     subglottic regions: BrdU immunohistochemistry (proliferation),
#     p63 immunofluorescence (basal cells), cleaved caspase-3
#     immunohistochemistry (apoptosis), H&E (VF epithelial thickness),
#     Alcian blue / periodic acid-Schiff (subglottic glandular area and
#     acidic vs neutral mucin composition), and scanning electron
#     microscopy (VF surface microprojections, subglottic cilia).
#
# Key findings recorded here:
#   - VF: BrdU+ proliferating cells and p63+ basal cells up at day 1 only;
#     no change in VF epithelial thickness; no cleaved caspase-3 signal at
#     any time point.
#   - Subglottis: BrdU+ cells in the submucosal glands up at days 5 and 10
#     and after 5-day cessation; cleaved caspase-3+ cells up at day 1 only.
#   - Mucins: acidic (Alcian blue) mucin area down and neutral (PAS) mucin
#     area up at day 10 only; total subglottic glandular area unchanged at
#     every time point.
#   - SEM: significant VF microprojection damage at day 10 with epithelial
#     sloughing (day 5) and ulceration (day 10); compound cilia in the
#     respiratory-epithelium-lined subglottis at days 5 and 10 with ciliary
#     loss and cellular blistering at day 10.
#
# EVERY quantitative result in this paper is presented only in figures
# (Figs. 3-14) - the text reports directions and significance but no group
# means. No numbers are transcribed here: each assay carries the
# qualitative direction plus exact quotes, and the output objects record
# that the values are figure-only rather than inventing them.
#
# Curation notes for reviewers:
#   - Two NEW key events are minted here (see the PR description):
#     KE:ke-epithelial-proliferation and KE:ke-epithelial-cell-death.
#     Nothing in the existing shared vocabulary covers epithelial cell
#     proliferation or apoptosis, which are this paper's primary endpoints.
#   - KE:ke3-impaired-ciliary ("Decreased ciliary function") is reused from
#     the existing fixture vocabulary for the SEM cilia observations.
#   - Both SEM assays are filed under ciliary_function_assays because that
#     is the schema's epithelial-surface-microscopy assay class (it carries
#     airway_region and analysis_software); the vocal-fold one describes
#     microprojections rather than cilia and informs on
#     KE:ke-epithelial-barrier.
#
# =============================================================================

source_publication:
  reference: "PMID:33996505"
  reference_title: "Short-term whole body cigarette smoke exposure induces regional differences in cellular response in the mouse larynx."
  doi: "10.1016/j.toxrep.2021.04.007"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:easwaran-cs-exposure-001"
    name: "Short-term whole body mainstream cigarette smoke exposure to 3R4F reference cigarettes"
    description: "Mice were placed in the whole body chamber of the inExpose system and exposed to mainstream smoke from 14 3R4F Kentucky reference cigarettes per day, using the FTC/ISO regimen of 35 mL puffs of 2 s duration followed by 58 s of fresh air at 2 L/min, once a minute, 9 puffs per cigarette; approximately 2 h 6 min per day, 5 days/week."
    equipment_required:
      - "inExpose whole body inhalation exposure system (SCIREQ, Montreal)"
      - "Cigarette smoking robot (CSR) carousel"
      - "Microdust Pro real-time particulate monitor"
      - "Flexiware v8.0 software"
      - "3R4F Kentucky research cigarettes (Center for Tobacco Reference Products)"

  - id: "PROTOCOL:easwaran-brdu-ihc-001"
    name: "BrdU immunohistochemistry on coronal laryngeal sections"
    description: "BrdU (100 mg/kg body weight) was given by intraperitoneal injection immediately after the final smoke or air exposure and mice were euthanized 2 h later. Standard immunohistochemistry with DAB substrate produced brown nuclear staining; positive cells were counted at 20x in the vocal folds and, for the subglottis, at 40x within ten high power fields along a fixed 700 um length on each side."
    equipment_required:
      - "Aperio ImageScope v.12.3.2.8013 counter tool (Leica Biosystems)"
      - "BrdU antibody ab142567 (Abcam)"
      - "3,3'-Diaminobenzidine (DAB) substrate"

  - id: "PROTOCOL:easwaran-p63-if-001"
    name: "p63 immunofluorescence for vocal fold basal cells"
    description: "Heat-induced antigen retrieval in citrate buffer, overnight incubation with anti-p63 (1:100, CM 163 A, Biocare Medical), donkey anti-mouse Alexa Fluor 647 secondary (1:500) and Hoechst counterstain; images acquired at 20x on a Zeiss Axioimager and p63 positive basal cells counted in the mid-membranous vocal fold over a fixed 300 um length."
    equipment_required:
      - "Zeiss Axioimager microscope"
      - "Anti-p63 antibody CM 163 A (Biocare Medical)"
      - "Fiji (ImageJ) counter tool"

  - id: "PROTOCOL:easwaran-cc3-ihc-001"
    name: "Cleaved caspase-3 immunohistochemistry for apoptosis"
    description: "Sections were stained with anti-cleaved caspase-3 (1:500, 9664T, Cell Signaling Technology) using the ImmPRESS Excel Amplified HRP Polymer kit and counterstained with Hematoxylin QS. Positive cells were counted at 40x along the entire mid-membranous vocal fold and, in the subglottis, within five randomly selected 100 x 100 um regions per side."
    equipment_required:
      - "ImmPRESS Excel Amplified HRP Polymer kit (Vector Laboratories)"
      - "Anti-cleaved caspase-3 antibody 9664T (Cell Signaling Technology)"
      - "Zeiss Axioimager microscope"

  - id: "PROTOCOL:easwaran-abpas-001"
    name: "Alcian blue / periodic acid-Schiff staining with colour deconvolution for subglottic mucin composition"
    description: "AB/PAS stained subglottic glandular regions were traced with the polygon tool at 10x magnification, with area measurements restricted to glands larger than 100 um2. Stain vectors in the colour deconvolution tool separated Alcian blue stained acidic mucins from PAS stained neutral mucins, and the area stained for each was measured."
    equipment_required:
      - "Fiji (derivative of ImageJ; NIH) colour deconvolution tool"
      - "Alcian blue / periodic acid-Schiff stain"

  - id: "PROTOCOL:easwaran-sem-001"
    name: "Scanning electron microscopy of the laryngeal mucosa with blinded damage scoring"
    description: "Larynges were fixed, dehydrated, split longitudinally to reveal the vocal fold surface, critical point dried, mounted and sputter coated with gold/palladium (60:40), then imaged at 5-25kx. Twenty 2 x 2 um images per group were scored by three blinded judges on a four-point scale (0 normal, 1 mild/minimal, 2 moderate, 3 extensive/severe); 50% of images were scored twice for quality control."
    equipment_required:
      - "FEI Strata 235 DB DualBeam FIB/SEM"
      - "Critical point dryer and Au/Pd sputter coater"
      - "Blinder web-based scoring application (Solibyte Solutions)"

