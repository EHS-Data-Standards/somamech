    description: >-
      Fig. 10b, with the initial screen in Supplemental Fig. 12b. The IL8
      companion of the TRPV1/TRPV3 antagonist assay, run on the same cells and
      conditions. THE DIRECTION OF EFFECT IS OPPOSITE TO IL6 FOR THE SINGLE
      ANTAGONISTS: inhibiting either TRPV1 (LJO-328 20 uM) or TRPV3 (007 50 uM)
      alone appeared to INCREASE IL8 induction, while the LJO-328 plus 007
      combination was inhibitory. The screen likewise found IL8 increased by
      007. Because the single-antagonist effect is an increase, the output
      records for LJO-328, AMG-9810 and 007 are annotated as such rather than
      being read as inhibition. Inhibitors of TRPA1, TRPM8/TRPM8 delta-M801 and
      TRPV4 did not affect mRNA induction and are not modelled. The figure
      legend states the data are mean and standard deviation analysed by 1-way
      ANOVA with a Dunnett post-test, normalized to GSLD qPM2.5 treated cells.
      NO MEASUREMENT VALUES: all values are figure-only normalized ratios.
