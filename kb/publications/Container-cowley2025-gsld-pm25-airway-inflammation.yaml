# =============================================================================
# GENE EXPRESSION ASSAYS - mouse lung cytokine mRNA after GSLD qPM2.5
# =============================================================================
# Fig. 6a-c (inhalation) and Supplemental Fig. 9a-c (OPA). One assay per gene,
# because GeneExpressionAssay.target_gene is single-valued and a merged assay
# would silently drop the other genes. All values are figure-only, so no output
# record carries an mrna_level. Muc5ac (Fig. 6d) is recorded separately as a
# GobletCellAssay, which has a named muc5ac_mrna_expression slot.
# =============================================================================

gene_expression_assays:
  - id: "GENE:cowley-il6-lung-inhalation"
    name: "Mouse lung Il6 mRNA after whole-body GSLD qPM2.5 inhalation"
    description: >-
      Fig. 6a. Il6 mRNA in the left lung lobe rose after whole-body inhalation of
      GSLD qPM2.5, measured by TaqMan qRT-PCR and normalized to Gapdh by the
      comparative cycle threshold method. The paper states the effects were dose
      dependent with no differences between male and female mice, and that the
      same induction occurred after oropharyngeal aspiration (Supplemental
      Fig. 9a). The figure legend reports mean and standard deviation with
      1-way ANOVA and a Dunnett post-test (* p < 0.05, ** p < 0.01, p < 0.001).
      NO MEASUREMENT VALUES: the relative expression values appear only in the
      figure, so each output record carries its condition and no mrna_level.
    target_gene: "NCBIGene:16193"
    gene_expression_method: "TaqMan quantitative real-time RT-PCR (delta delta CT)"
    normalization_reference: "Gapdh"
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "At the molecular level, both inhaled (Fig. 6a-d) and OPA-delivered GSLD qPM 2.5 (Supplemental Fig. 9a-d) induced the expression of mRNA for Cxcl1, Cxcl2, Il6"
        explanation: "States that both inhaled and aspirated GSLD qPM2.5 induced Il6 mRNA, the direction this assay records. The sentence continues past a figure caption in the source text, so the quote stops where the caption interrupts it."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "increased expression of mRNA for Il6, Cxcl1, and Cxcl2 occurred."
        explanation: "The authors' discussion restating that lung Il6 mRNA increased, alongside Cxcl1 and Cxcl2."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The effects of GSLD were dose dependent and no differences were observed between male and female mice."
        explanation: "Supports the dose dependence recorded in the description and the pooling of male and female mice in the study subject."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Cytokine gene expression was analyzed by quantita- tive real-time polymerase reaction using a Life Technolo- gies QuantStudio 6 Flex instrument and TaqMan probes (Applied Biosystems) for mouse Il6 (Mm00446190_m1), Cxcl1 (Mm04207460_m1), Cxcl2 (Mm00436450_m1), and Muc5ac (Mm01276718_m1)."
        explanation: "Identifies the TaqMan probe and platform behind this assay's protocol, and the four mouse targets that are split across one assay each."
