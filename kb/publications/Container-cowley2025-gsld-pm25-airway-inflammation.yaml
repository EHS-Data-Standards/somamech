        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mouse CXCL1 (KC) and IL6 kits were purchased from Invitrogen, and performed as specified by the supplier."
        explanation: "Identifies the two ELISA kits behind this assay's protocols."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
