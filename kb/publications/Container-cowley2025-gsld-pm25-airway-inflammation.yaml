  # ===========================================================================
  # THP-1 MACROPHAGE-LIKE CELLS - Supplemental Fig. 13a-d.
  # This is the one in vitro arm with stated numbers: TAK-242 reduced
  # LPS-induced IL6 mRNA by >95% (p = 0.000002), GSLD-induced IL6 by ~22%
  # (p = 0.076) and SSD-induced IL6 by ~51% (p = 0.044). Those three
  # percentages are recorded in response_comparisons with
  # derivation: reported_in_paper. The assay informs on the newly minted
  # KE:mie-tlr4-activation, since establishing TLR4 mediation is its purpose.
  # ===========================================================================
  - id: "GENE:cowley-il6-thp1-tlr4"
    name: "IL6 mRNA in differentiated THP-1 cells - TLR4 inhibition of GSLD, Salton Sea dust and LPS responses"
    description: >-
      Supplemental Fig. 13a and c. THP-1 monocytes were differentiated for 72 h
      with phorbol 12-myristate acetate (25 nM) to a macrophage-like phenotype,
      then treated with GSLD qPM2.5 at 0.045 mg/mL (12 ug/cm2), Salton Sea dust
      qPM2.5, or LPS, with and without 30 min pre-treatment and co-treatment
      with the TLR4 inhibitor TAK-242. IL6 mRNA induction was reduced by
      TAK-242 by more than 95% for LPS (p = 0.000002), by ~22% for GSLD qPM2.5
      (p = 0.076, i.e. not significant at the paper's 0.05 threshold) and by
      ~51% for SSD qPM2.5 (p = 0.044). IL8 mRNA induction was not reduced by
      TAK-242, and TNFa induction was less than 2-fold over vehicle control in
      all cases and unaffected by any co-treatment, so neither is modelled as a
      measurement here. The authors read this as a role for LPS, acting through
      TLR4, in driving inflammation in THP-1 cells, and contrast it with the
      epithelial cells: TRPV1 inhibition had no effect on the THP-1 response to
      GSLD qPM2.5, while deferoxamine enhanced it. NO ABSOLUTE VALUES: the
      per-group expression levels are figure-only, so the output records carry
      no mrna_level; only the three reported inhibition percentages are
      recorded, in response_comparisons. For context on the concentration
      chosen, the LC50 for GSLD qPM2.5 in differentiated THP-1 cells was
      ~0.024 mg/mL (15 ug/cm2), so the 12 ug/cm2 used here sits just below the
      LC50 - these cells are markedly more sensitive than HBEC3-KT, whose LC50
      was 0.73 mg/mL.
    target_gene: "NCBIGene:3569"
    gene_expression_method: "TaqMan quantitative real-time RT-PCR (delta delta CT)"
    normalization_reference: "B2M"
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Induction of IL6, but not IL8 mRNA by LPS was reduced > 95% by TAK-242 (p = 0.000002), ~ 22% (p = 0.076) for GSLD qPM 2.5, and ~ 51% (p = 0.044) for SSD qPM 2.5, respectively (Supple - mental Fig. 13a and c) suggesting a role for LPS in driv - ing inflammation in THP-1 cells."
        explanation: "The single source of all three inhibition percentages and p-values recorded in response_comparisons, and of the statement that IL8 was not reduced."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Alternatively, TRPV1 inhibition had no effect on the responses of THP-1 cells to GSLD qPM2.5 while DFO enhanced responses"
        explanation: "The contrast with the epithelial cells recorded in this assay's description: the THP-1 response is not TRPV1-dependent."
      - reference: "PMID:39819386"
