# =============================================================================
# Cowley et al. (2025) - Pro-inflammatory effects of inhaled Great Salt Lake
# dust particles
# =============================================================================
#
# Source: Part Fibre Toxicol. 2025;22:2
# DOI: 10.1186/s12989-025-00618-9
#
# The committed reference cache entry for this PMID is full text
# (content_type: full_text_pdf), so every evidence snippet below is quoted
# from text CI can resolve. No verification receipt is needed.
#
# Study design
# ------------
# Great Salt Lake lakebed sediment was collected (July 2022), dried,
# resuspended and size-fractionated on an Andersen cascade impactor; the
# PM < 3.1 um fraction is called quasi-PM2.5 (GSLD qPM2.5). Coal fly ash
# (CFA) qPM2.5 and Salton Sea dust (SSD) qPM2.5 were prepared the same way
# and used as comparators.
#
#   IN VIVO (male and female C57Bl/6 mice, 8-10 weeks; BAL and lung taken
#   24 h after exposure):
#     - Whole-body inhalation (inExpose), ~12 min per interval, 1x / 2x / 3x
#       in one day or 6x over two days, i.e. 12 / 24 / 36 / 72 min total.
#       Aerosol averaged ~200 mg/m3 post-chamber.
#     - Oropharyngeal aspiration (OPA) of 2.5, 12.5, 62.5 and 250 ug in 25 uL.
#     - CFA qPM2.5 inhalation using the same 3x paradigm, as a comparator.
#     - CRISPR "humanized" Trpv1N606D mice vs wild-type C57Bl/6, 3x paradigm.
#   IN VITRO:
#     - HBEC3-KT human bronchial epithelial cells, GSLD qPM2.5 at 0.25 mg/mL
#       (66 ug/cm2) for 24 h, with and without EGTA+ruthenium red, TAK-242
#       (TLR4), deferoxamine, LJO-328 and AMG-9810 (TRPV1), 007 (TRPV3).
#     - Differentiated (PMA) THP-1 macrophage-like cells, GSLD qPM2.5 at
#       0.045 mg/mL (12 ug/cm2), SSD qPM2.5 and LPS, with and without TAK-242.
#     - HEK-293/GCaMP6s calcium flux assays for TRP channel activation.
#
# NUMERIC VALUES. This paper reports almost all of its per-group data in
# figures and supplemental figures; the running text gives very few absolute
# numbers. Extraction therefore follows the rule that no value may be read
# off a figure:
#   - The only per-group measurement values recorded in output records are the
#     BAL neutrophil percentages in Fig. 11c, which the text states in full
#     (76 +/- 6% for Trpv1N606D vs 58 +/- 9% for wild-type, mean and standard
#     deviation per the figure legend). Genotype is a property of the subject,
#     not of an output record, so these two groups are two assays with their
#     own InVivoSubject rather than two outputs of one assay.
#   - Every other output record carries its experimental_group and its
#     measured_under condition but NO measurement value, because the paper
#     publishes only a figure for it. The direction and significance of each
#     response is stated in the assay description and carried by quoted
#     evidence.
#   - Changes the paper states in words or numbers are recorded in
#     response_comparisons with derivation: reported_in_paper. These are the
#     2-3-fold rise of BAL IL6 and CXCL1 after inhalation, and the three
#     TAK-242 inhibition percentages in THP-1 cells (>95% for LPS-induced
#     IL6, ~22% for GSLD, ~51% for SSD, each with its p-value). The "2-3-fold"
#     statement is recorded as a fold_change whose variability is a range with
#     lower_bound 2 and upper_bound 3, because that is the form the paper used.
#   - The in vitro LC50 values (unfractionated GSLD 1.13 mg/mL, GSLD qPM2.5
#     0.73 mg/mL, CFA 4.36 mg/mL in HBEC3-KT; GSLD qPM2.5 ~0.024 mg/mL in
#     THP-1) are real numbers in the text, but the schema has no cytotoxicity
#     assay or viability output slot, so they are not invented into one. They
#     are preserved as quoted evidence and in the descriptions of the in vitro
#     assays, following the precedent set by the ferecatu2010 extraction.
#   - The TRP channel calcium-flux arm likewise has no matching assay class.
#     Its result is preserved as quoted evidence on the TRP-antagonist assays
#     and in the key_event_relationships, not fabricated into another class.
#
# INHALED DOSE IS MODELLED AS CONCENTRATION x DURATION. The paper estimates
# inhaled masses of "76-86, 150-170, 23-26, and 460-520 ug ... for the 1x, 2x,
# 3x, and 6x exposures". The 3x figure (23-26 ug) is lower than the 1x figure
# and is inconsistent with the stated monotonic dose-response, so it appears
# to be a typographical error in the paper. Rather than record a value that is
# probably wrong, each inhalation ExposureCondition carries the aerosol
# concentration the paper measured (~200 mg/m3 post-chamber) and the exposure
# duration (12, 24, 36 or 72 min), which are internally consistent and stated
# plainly. The estimated inhaled masses are quoted verbatim in the inhalation
# protocol description, including the apparent typo, so nothing is lost.
#
# EXPOSURE AGENTS. The qPM2.5 fractions (GSLD, CFA and SSD) carry
# ENVO:01000415 "fine respirable suspended particulate matter", the term most
# of the corpus already uses for PM2.5, since qPM2.5 is explicitly a fine
# particulate fraction (PM < 3.1 um) rather than bulk dust. exposure_agent is
# optional and is therefore OMITTED on the three controls that are not an air
# exposure - the 25 uL oropharyngeal vehicle aspirate and the two culture-medium
# controls - because asserting an agent there would be false; only
# EXPOSURE:cowley-air-control, where the mice genuinely breathed unexposed air,
# names ENVO:00002005 "air".
#
# ONE ASSAY PER GENE. GeneExpressionAssay.target_gene is single-valued, so a
# merged assay for the four mouse cytokine genes could name only one of them
# and would silently drop the rest. Il6, Cxcl1 and Cxcl2 therefore get one
# assay each. Muc5ac is recorded as a GobletCellAssay instead, because
# muc5ac_mrna_expression is a named GobletCellOutput slot, and per issue #131
# each TaqMan target gets its own protocol id rather than sharing one.
#
# KEY EVENTS. Every reused Key Event block is copied VERBATIM from
# origin/main. The two reused blocks were counted first and the corpus is
# unanimous on both:
#   KE:ke-airway-inflammation  "Airway inflammation"    increased  tissue   (52)
#   KE:ke-mucin-hypersecretion "Mucin hypersecretion"   increased  cellular (21)
# Two new molecular initiating events are minted, because no existing KE on
# main covers either mechanism (the nearest, KE:ke-decreased-intracellular-
# calcium, is the opposite direction and a different event):
#   KE:mie-trp-channel-activation "TRP channel activation" activated molecular
#   KE:mie-tlr4-activation        "TLR4 activation"        activated molecular
# Both are kept minimal so the next paper can reuse them. They are assigned to
# the assays whose purpose is to establish them: the HBEC3-KT TRPV1/TRPV3
# antagonist arms inform on TRP channel activation, and the THP-1 TAK-242 arms
# inform on TLR4 activation. The cytokine readouts that are not inhibitor
# experiments inform on KE:ke-airway-inflammation.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:39819386"
  reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
  doi: "10.1186/s12989-025-00618-9"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:cowley-gsld-inhalation-001"
    protocol_type: MolecularAssayProtocol
    name: "Whole-body inhalation exposure of mice to GSLD qPM2.5"
    description: "GSL sediment collected July 2022 near the Great Saltair, Great Salt Lake State Park and the Kennecott Copper mine, dried 10 days at 40 C, resuspended with compressed filtered air and size-fractionated on a 10-stage Andersen cascade impactor at 1 L/min; the pooled PM < 3.1 um fraction is quasi-PM2.5 (qPM2.5). For exposure, 1.25 g GSLD qPM2.5 was resuspended at ~100 mg/min with a PALAS RBG 1000ID at 1,200 RPM, 7 mm piston, 200 mm/h feed rate, bias airflow 2 L/min, into an inExpose whole-body system (Scireq). Aerosol monitored in real time with a Casella CEL-712 Microdust Pro pre-chamber and gravimetrically post-chamber with an impactor and DustTrack II with a PM2.5 inlet. PM concentrations averaged ~1,800 mg/m3 pre-chamber and ~200 mg/m3 post-chamber with ~75% being <= 2.5 um. Mice were exposed for ~12 min intervals: 1x, 2x or 3x in one day, or 6x over two days. The paper's own estimate of the inhaled mass, quoted verbatim, is: 'Inhalable doses of 76-86, 150-170, 23-26, and 460-520 ug were estimated for the 1x, 2x, 3x, and 6x exposures' using a mouse tidal volume of 0.18 mL, 243 breaths/min, a 12 min exposure time and a PM2.5 value of 195-220.8 mg/m3. The 3x figure of 23-26 ug is lower than the 1x figure and appears to be a typographical error, so it is recorded here only as the paper's own words and is not used as a structured exposure value. Applying deposition estimates of ~4%, ~12.5% and ~50% for the deep lung/alveolar, tracheobronchial and nasal/oropharyngeal regions, the paper estimates deposited doses of ~3.2, ~10.1 and ~40.5 ug of PM for a 1x exposure. In all cases mice were sacrificed 24 h after exposure by Euthasol injection. Protocol typed as MolecularAssayProtocol because the schema offers no exposure-protocol subclass."
    detection_method: "not applicable - exposure protocol"
    equipment_required:
      - "inExpose whole-body inhalation system (Scireq)"
      - "PALAS RBG 1000ID dust disperser"
      - "Casella CEL-712 Microdust Pro"
      - "TSI DustTrack II with PM2.5 inlet filter"
      - "10-stage Andersen cascade impactor"
    institution: "University of Utah"
    quality_control_criteria: "Aerosol concentration monitored in real time pre-chamber and confirmed gravimetrically post-chamber; studies approved by the University of Utah IACUC committee"

  - id: "PROTOCOL:cowley-cfa-inhalation-001"
    protocol_type: MolecularAssayProtocol
    name: "Whole-body inhalation exposure of mice to CFA qPM2.5, 3x paradigm"
    description: "Coal fly ash collected from the Hunter power plant in Castledale, UT and prepared as qPM2.5 exactly as for GSLD. Inhalation exposure to CFA qPM2.5 was performed using the 3x exposure paradigm only, as an equivalent-dose comparator for GSLD qPM2.5, with sacrifice 24 h after exposure. Protocol typed as MolecularAssayProtocol because the schema offers no exposure-protocol subclass."
    detection_method: "not applicable - exposure protocol"
    equipment_required:
      - "inExpose whole-body inhalation system (Scireq)"
      - "PALAS RBG 1000ID dust disperser"
    institution: "University of Utah"

  - id: "PROTOCOL:cowley-gsld-opa-001"
    protocol_type: MolecularAssayProtocol
    name: "Oropharyngeal aspiration exposure of mice to GSLD qPM2.5"
    description: "Mice were dosed with GSLD qPM2.5 by oropharyngeal (OPA) aspiration in a total volume of 25 uL. Doses of 2.5, 12.5, 62.5 and 250 ug qPM2.5 were used to establish a dose-response and to allow comparison with the authors' prior OPA studies of other particulate matter. The paper states these doses model potential inhalable doses of ~86.4-375 ug PM2.5 for humans, estimated from PM2.5 = 50 ug/m3 with either resting (tidal volume 450 mL, 12 breaths/min, 240 min) or exercising (2500 mL, 50 breaths/min, 60 min) ventilation. Mice were sacrificed 24 h after treatment. Protocol typed as MolecularAssayProtocol because the schema offers no exposure-protocol subclass."
    detection_method: "not applicable - exposure protocol"
    institution: "University of Utah"
    quality_control_criteria: "Studies approved by the University of Utah IACUC committee"

  - id: "PROTOCOL:cowley-bal-diffcount-001"
    protocol_type: StainingProtocol
    name: "Bronchoalveolar lavage collection and Giemsa differential cell counting"
    description: "A cannula was inserted through a small incision in the trachea. Cold saline (1 mL) was infused slowly, first 0.5 mL, retracting, then the entire 1 mL. This first 1 mL was placed on ice, clarified by centrifugation and the supernatant frozen at -80 C for ELISA. A further 4 mL was collected 1 mL at a time and placed on ice. Cells from the initial 1 mL and the 4 mL sample were pooled, concentrated by centrifugation, resuspended in 1 mL cold saline, counted, and 5,000 cells fixed to slides by cytospin. Differential counts were also made by tissue flow cytometry on a Cytek Aurora using the antibody panel and singlet/viable/CD45+ gating of Nguyen et al., analysed in FlowJo."
    staining_type: "Giemsa"
    detection_method: "manual differential cell count on cytospin preparations, with tissue flow cytometry (Cytek Aurora, FlowJo) as a second method"
    equipment_required:
      - "Cytospin"
      - "Cytek Aurora flow cytometer"
    institution: "University of Utah"

  - id: "PROTOCOL:cowley-bal-elisa-il6-001"
    protocol_type: MolecularAssayProtocol
    name: "Mouse IL6 ELISA on bronchoalveolar lavage supernatant"
    description: "The first 1 mL of BAL fluid was clarified by centrifugation and the supernatant frozen at -80 C for protein analysis. Mouse IL6 was measured with an Invitrogen kit performed as specified by the supplier. Given its own protocol id separate from the CXCL1 ELISA because the two use different kits and antibody pairs (issue #131)."
    detection_method: "sandwich ELISA (Invitrogen mouse IL6 kit)"
    platform: "Invitrogen mouse IL6 ELISA kit"
    institution: "University of Utah"

  - id: "PROTOCOL:cowley-bal-elisa-cxcl1-001"
    protocol_type: MolecularAssayProtocol
    name: "Mouse CXCL1 (KC) ELISA on bronchoalveolar lavage supernatant"
    description: "The first 1 mL of BAL fluid was clarified by centrifugation and the supernatant frozen at -80 C for protein analysis. Mouse CXCL1 (KC) was measured with an Invitrogen kit performed as specified by the supplier. Given its own protocol id separate from the IL6 ELISA because the two use different kits and antibody pairs (issue #131)."
    detection_method: "sandwich ELISA (Invitrogen mouse CXCL1/KC kit)"
    platform: "Invitrogen mouse CXCL1 (KC) ELISA kit"
    institution: "University of Utah"

  - id: "PROTOCOL:cowley-qpcr-mouse-il6"
    protocol_type: MolecularAssayProtocol
    name: "TaqMan qRT-PCR for mouse Il6 in lung tissue"
    description: "Before fixation the left bronchus was tied closed and the left lung lobe removed into RNALater at 4 C. Within one week the tissue was homogenized in Trizol (1 mL per 50-100 mg), phase separated with chloroform, the RNA precipitated with ethanol and purified on a PureLink RNA Mini Kit. RNA (2 ug) was reverse transcribed with the ABI High-Capacity cDNA Kit plus RNase inhibitor. Quantification used a Life Technologies QuantStudio 6 Flex and the TaqMan probe for mouse Il6 (Mm00446190_m1). Each TaqMan target has its own protocol id because each uses a distinct probe (issue #131)."
    detection_method: "TaqMan quantitative real-time RT-PCR, comparative cycle threshold (delta delta CT) method"
    normalization_method: "normalized to mouse Gapdh (Mm99999915_g1), which exhibited stability across treatments"
    reference_gene: "Gapdh"
    platform: "Life Technologies QuantStudio 6 Flex"
    institution: "University of Utah"

  - id: "PROTOCOL:cowley-qpcr-mouse-cxcl1"
    protocol_type: MolecularAssayProtocol
    name: "TaqMan qRT-PCR for mouse Cxcl1 in lung tissue"
    description: "Lung RNA prepared as for the mouse Il6 protocol. Quantification used a Life Technologies QuantStudio 6 Flex and the TaqMan probe for mouse Cxcl1 (Mm04207460_m1). Each TaqMan target has its own protocol id because each uses a distinct probe (issue #131)."
    detection_method: "TaqMan quantitative real-time RT-PCR, comparative cycle threshold (delta delta CT) method"
    normalization_method: "normalized to mouse Gapdh (Mm99999915_g1), which exhibited stability across treatments"
    reference_gene: "Gapdh"
    platform: "Life Technologies QuantStudio 6 Flex"
    institution: "University of Utah"

  - id: "PROTOCOL:cowley-qpcr-mouse-cxcl2"
    protocol_type: MolecularAssayProtocol
    name: "TaqMan qRT-PCR for mouse Cxcl2 in lung tissue"
    description: "Lung RNA prepared as for the mouse Il6 protocol. Quantification used a Life Technologies QuantStudio 6 Flex and the TaqMan probe for mouse Cxcl2 (Mm00436450_m1). Each TaqMan target has its own protocol id because each uses a distinct probe (issue #131)."
    detection_method: "TaqMan quantitative real-time RT-PCR, comparative cycle threshold (delta delta CT) method"
    normalization_method: "normalized to mouse Gapdh (Mm99999915_g1), which exhibited stability across treatments"
    reference_gene: "Gapdh"
    platform: "Life Technologies QuantStudio 6 Flex"
    institution: "University of Utah"

  - id: "PROTOCOL:cowley-qpcr-mouse-muc5ac"
    protocol_type: MolecularAssayProtocol
    name: "TaqMan qRT-PCR for mouse Muc5ac in lung tissue"
    description: "Lung RNA prepared as for the mouse Il6 protocol. Quantification used a Life Technologies QuantStudio 6 Flex and the TaqMan probe for mouse Muc5ac (Mm01276718_m1). Each TaqMan target has its own protocol id because each uses a distinct probe (issue #131)."
    detection_method: "TaqMan quantitative real-time RT-PCR, comparative cycle threshold (delta delta CT) method"
    normalization_method: "normalized to mouse Gapdh (Mm99999915_g1), which exhibited stability across treatments"
    reference_gene: "Gapdh"
    platform: "Life Technologies QuantStudio 6 Flex"
    institution: "University of Utah"

  - id: "PROTOCOL:cowley-hbec-treatment-001"
    protocol_type: MolecularAssayProtocol
    name: "HBEC3-KT culture, GSLD qPM2.5 treatment and pathway-inhibitor co-treatment"
    description: "Immortalized human bronchial epithelial HBEC3-KT cells (ATCC) were grown in Airway Epithelial Basal Medium with the Bronchial Epithelial Cell Growth Kit, plated in 12-well plates at 25,000 cells/cm2 and treated 72 h later. GSLD qPM2.5 treatments were suspended in media, sonicated 20 min, vortex mixed 1 min and vortex mixed again immediately before application to keep the suspension homogeneous. A concentration of 0.25 mg/mL (66 ug/cm2) was used for HBEC3-KT cells, for 24 h. For pathway inhibitor studies cells were pre-treated for 30 min and then co-treated. Inhibitor concentrations were EGTA + ruthenium red (10 + 50 uM), TAK-242 (1 uM), deferoxamine (50 uM), LJO-328 (20 uM), AMG-9810 (1 uM), 007 (50 uM), and LJO-328 + 007 (20 + 50 uM). All treatment groups were corrected for their respective controls and normalized to GSLD qPM2.5 treated cells."
    detection_method: "not applicable - cell culture and treatment protocol"
    institution: "University of Utah"

  - id: "PROTOCOL:cowley-thp1-treatment-001"
    protocol_type: MolecularAssayProtocol
    name: "THP-1 differentiation, dust/LPS treatment and TAK-242 co-treatment"
    description: "THP-1 cells (ATCC) were maintained in RPMI 1640 with 10% fetal bovine serum and 0.05 mM 2-mercaptoethanol at 0.3-1 million cells/mL, plated in 12-well plates and differentiated for 72 h with phorbol 12-myristate acetate (25 nM) to a macrophage-like phenotype before treatment. GSLD qPM2.5 was applied at 0.045 mg/mL (12 ug/cm2); SSD qPM2.5 and LPS (E. coli O111:B4) were used in parallel. For inhibitor studies cells were pre-treated 30 min with TAK-242 and then co-treated."
    detection_method: "not applicable - cell culture and treatment protocol"
    institution: "University of Utah"

  - id: "PROTOCOL:cowley-qpcr-human-il6"
    protocol_type: MolecularAssayProtocol
    name: "TaqMan qRT-PCR for human IL6"
    description: "At the end of treatment the media was aspirated and stored, cells were washed with PBS and frozen at -80 C. RNA was isolated with the PureLink RNA Mini Kit and quantified with the TaqMan probe for human IL6 (Hs00174131_m1) on a Life Technologies QuantStudio 6 Flex. Each TaqMan target has its own protocol id because each uses a distinct probe (issue #131)."
    detection_method: "TaqMan quantitative real-time RT-PCR, comparative cycle threshold (delta delta CT) method"
    normalization_method: "normalized to human beta-2-microglobulin (B2M; Hs00187842_m1), which exhibited stability across treatments"
    reference_gene: "B2M"
    platform: "Life Technologies QuantStudio 6 Flex"
    institution: "University of Utah"

  - id: "PROTOCOL:cowley-qpcr-human-il8"
    protocol_type: MolecularAssayProtocol
    name: "TaqMan qRT-PCR for human IL8"
    description: "RNA prepared as for the human IL6 protocol and quantified with the TaqMan probe for human IL8 (Hs00174103_m1) on a Life Technologies QuantStudio 6 Flex. Each TaqMan target has its own protocol id because each uses a distinct probe (issue #131)."
    detection_method: "TaqMan quantitative real-time RT-PCR, comparative cycle threshold (delta delta CT) method"
    normalization_method: "normalized to human beta-2-microglobulin (B2M; Hs00187842_m1), which exhibited stability across treatments"
    reference_gene: "B2M"
    platform: "Life Technologies QuantStudio 6 Flex"
    institution: "University of Utah"

# =============================================================================
# BALF / SPUTUM ASSAYS (in vivo, mouse)
# =============================================================================

balf_sputum_assays:
  # ---------------------------------------------------------------------------
  # Fig. 5a and b - total BAL cell count and neutrophil percentage as a
  # function of inhaled GSLD qPM2.5 dose. Figure-only data, so the five output
  # records carry their condition but no measurement value.
  # ---------------------------------------------------------------------------
  - id: "BALF:cowley-gsld-inhalation-dose"
    name: "BAL total cells and neutrophils after whole-body GSLD qPM2.5 inhalation, 1x to 6x"
    description: >-
      Fig. 5a and b and Supplemental Fig. 6. Male and female C57Bl/6 mice were
      exposed whole-body to GSLD qPM2.5 aerosol averaging ~200 mg/m3
      post-chamber for 12 min (1x), 24 min (2x) or 36 min (3x) in one day, or
      72 min over two days (6x), and BAL was collected 24 h after exposure.
      Total cell counts and the percentage of neutrophils both rose
      dose-dependently; the figure legend reports mean and standard deviation
      with 1-way ANOVA and a Dunnett post-test, significance ** p < 0.01 and
      **** p < 0.0001. Histology of the post-lavage tissue confirmed pulmonary
      inflammation, increased neutrophils and alveolar edema, and tissue flow
      cytometry confirmed Ly6G+ neutrophilia along with changes in eosinophils,
      alveolar, interstitial and monocyte-derived macrophages, CD3+ and CD8+ T
      cells and B cells (Supplemental Fig. 8). NO MEASUREMENT VALUES: the paper
      publishes these counts only as figures, so no output record carries a
      value and none was read off the figure. The paper states the effects were
      dose dependent with no difference between male and female mice.
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Mice exposed to/treated with GSLD qPM2.5 by inhalation (Fig. 5a and b and Supplemental Fig. 6) and OPA (Sup - plemental Fig. 7a-f) exhibited dose-dependent increases in total cells and neutrophils in BAL fluid collected 24 h after treatment."
        explanation: "States the direction and dose dependence of the total cell and neutrophil responses this assay records, and the 24 h sampling time."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Total cell counts and (b) percentage of neutrophils in BAL following inhalation exposure of mice to GSLD qPM2.5 for 12 min (1x), 24 min (2x), or 36 min (3x) over the course of one day or 72 min over 2 days (6x)."
        explanation: "Fig. 5 legend, giving the two measured endpoints and the exposure duration behind each of this assay's four treated conditions."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Histological analysis of post-lavage tis - sue from both exposure paradigms confirmed pulmonary inflammation, increased neutrophils, and alveolar edema (Fig. 5c-f)."
        explanation: "Independent histological confirmation of the airway inflammation key event this assay informs on."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Neutrophilia (Ly6G +), changes in eosinophils, alveolar, interstitial, and monocyte-derived macrophages, CD3+ T cells, CD8 + T cells, and B cells were also shown using tissue flow cytometry (Supplemental Fig. 8)."
        explanation: "Confirms the neutrophilia by a second method and names the other leukocyte populations that changed."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Data are the mean and standard deviation. **p < 0.01 and ****p < 0.0001 using 1-way ANOVA and a Dunnett post-test"
        explanation: "Fig. 5 legend statistics, recorded in the description because the per-group values themselves are figure-only."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PM concentrations averaged ~ 1,800 mg/m3 pre-chamber and ~ 200 mg/m3 post-chamber, with ~ 75% being ≤ 2.5 μm."
        explanation: "Source of the ~200 mg/m3 aerosol concentration carried by each inhalation exposure condition in this assay."
    has_exposure_condition:
      - id: "EXPOSURE:cowley-air-control"
        name: "Unexposed air control (no GSLD qPM2.5 aerosol)"
        exposure_agent:
          id: "ENVO:00002005"
          name: "air"
      - id: "EXPOSURE:cowley-gsld-inhal-1x-12min"
        name: "GSLD qPM2.5 whole-body inhalation, ~200 mg/m3, 12 min (1x)"
        exposure_agent:
