# =============================================================================
# RESPONSE COMPARISONS (analysis layer)
# =============================================================================
# Only changes the paper states itself, all with derivation: reported_in_paper.
# Nothing here was computed during extraction.
# =============================================================================

response_comparisons:
  # The paper gives the BAL protein rise as "2-3-fold", a range rather than a
  # point estimate, so change_value carries the midpoint 2.5 with the reported
  # range as its variability. The same statement covers IL6 and CXCL1, so each
  # gets its own comparison against the same pair of output records.
  - id: "COMP:cowley-bal-il6-3x"
    name: "BAL IL6 protein, 3x GSLD qPM2.5 inhalation versus air control"
    description: "The paper states IL6 and CXCL1 protein in BAL were elevated 2-3-fold following inhalation. change_value is the midpoint of that stated range and the variability records the range itself, because the paper reports a range and extraction must not narrow it to a single number."
    derived_from_assay: "BALF:cowley-gsld-3x-cytokines"
    compared_measurement: "il6_concentration"
    control_output: "BALF:cowley-gsld-3x-cytokines-output-control"
    treated_output: "BALF:cowley-gsld-3x-cytokines-output-3x"
    change_type: fold_change
    change_direction: increased
    change_value:
      value: "2.5"
      unit:
        id: "UO:0000190"
        name: "ratio unit"
      central_tendency: single_value
      variability:
        variability_type: range
        lower_bound: "2"
        upper_bound: "3"
        unit:
          id: "UO:0000190"
          name: "ratio unit"
    derivation: reported_in_paper

  - id: "COMP:cowley-bal-cxcl1-3x"
    name: "BAL CXCL1 protein, 3x GSLD qPM2.5 inhalation versus air control"
    description: "The CXCL1 half of the same 2-3-fold statement. CXCL1 (murine KC) has no named BALFSputumOutput slot, so compared_measurement names il8_concentration, following the paper's own description of IL8 as the human analogue of Cxcl1 and Cxcl2 and the convention used elsewhere in this corpus for murine KC. change_value is the midpoint of the stated range with the range as its variability."
