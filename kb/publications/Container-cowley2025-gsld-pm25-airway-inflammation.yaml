  - id: "KER:cowley-tlr4-to-airway-inflammation"
    name: "TLR4 activation leads to airway inflammation after lakebed dust exposure"
    description: "The parallel mechanism the paper proposes for the myeloid compartment. GSL sediment and its qPM2.5 contain LPS and bacteria, and the TLR4 inhibitor TAK-242 reduced IL6 mRNA induction in differentiated THP-1 cells by ~22% for GSLD qPM2.5 (p = 0.076) and ~51% for SSD qPM2.5 (p = 0.044), against more than 95% for LPS itself. TAK-242 also slightly reduced IL6 induction in HBEC3-KT cells, though not IL8. Evidence support is moderate: the inhibition is partial, the GSLD effect did not reach the paper's own significance threshold, and the authors describe the THP-1 responses as only partially TLR4-mediated. Quantitative understanding is low."
