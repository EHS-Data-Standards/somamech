  # ===========================================================================
  # IN VITRO - HBEC3-KT human bronchial epithelial cells
  # ===========================================================================
  # Fig. 8a/b (chelators and TLR4 inhibition) and Fig. 10a/b (TRP antagonists).
  # EXPOSURE AGENT FOR CO-TREATMENTS: GSLD qPM2.5 is present in every one of
  # these conditions and is the agent whose response is measured, so each
  # condition's exposure_agent is the particulate matter and the co-treating
  # inhibitor and its concentration are named in the condition's name. The
  # qPM2.5 fractions use ENVO:01000415 "fine respirable suspended particulate
  # matter", the term 19 of the 26 papers on main already use for PM2.5, rather
  # than the broader ENVO:00002008 "dust". The alternative - naming
  # the inhibitor as the exposure agent - cannot be applied consistently here:
  # LJO-328, AMG-9810 and 007 have no CHEBI terms (checked against CHEBI via
  # OLS), and the EGTA + ruthenium red arm is two inhibitors at once, so
  # exposure_agent could name only one of them.
  # All values in these figures are normalized to GSLD-treated cells and are
  # published only as figures, so no output record carries an mrna_level.
  # ===========================================================================
  - id: "GENE:cowley-il6-hbec-chelators"
    name: "IL6 mRNA in HBEC3-KT cells - GSLD qPM2.5 with calcium/metal chelation and TLR4 inhibition"
    description: >-
      Fig. 8a. HBEC3-KT cells treated for 24 h with GSLD qPM2.5 at 0.25 mg/mL
      (66 ug/cm2) induced IL6 mRNA, reproducing the Il6 induction seen in mouse
      lung. The induction was significantly reduced by co-treatment with the
      metal/calcium chelator EGTA plus the non-selective calcium channel blocker
      ruthenium red (10 + 50 uM), and was also reduced - though the authors
      describe the effect as slight - by the TLR4 inhibitor TAK-242 (1 uM) and
      by the iron chelator deferoxamine (50 uM). The figure legend states the
      data are mean and standard deviation analysed by 1-way ANOVA with a
      Dunnett post-test (** p < 0.01, **** p < 0.0001), with all treatment
      groups corrected for their respective controls and normalized to GSLD
      qPM2.5 treated cells. Separately (Fig. 8c), pre-extracting the dust with
      water and ethanol, which sterilized it and removed soluble components,
      ENHANCED IL6 induction, while heating it to 500 C for 4 h, which
      sterilized it and removed or degraded semi-volatile organics and oxidized
      metals, REDUCED IL6 induction. NO MEASUREMENT VALUES: every value in this
      figure is a figure-only normalized ratio, so no output record carries an
      mrna_level. Context for potency: in these same cells the LC50 for GSLD
      qPM2.5 was 0.73 mg/mL (459 ug/cm2) versus 1.13 mg/mL for unfractionated
      GSLD and 4.36 mg/mL for coal fly ash, so the 66 ug/cm2 used here is well
      below the cytotoxic range. The schema has no cytotoxicity assay class, so
      those LC50 values are recorded here and in the quoted evidence rather than
      being forced into an unrelated assay type.
    target_gene: "NCBIGene:3569"
    gene_expression_method: "TaqMan quantitative real-time RT-PCR (delta delta CT)"
    normalization_reference: "B2M"
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Treatment of HBEC3-KT cells for 24 h with GSLD qPM2.5 (0.25 mg/mL; 66 µg/cm 2) replicated the induc - tion of Il6, Cxcl1, and Cxcl2 mRNA observed in mice."
        explanation: "Gives the concentration, duration and result for this assay's GSLD condition, and states that it reproduced the mouse lung induction."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Induction of IL6 and IL8 mRNA was signifi - cantly reduced by co-treating cells with a combination of the metal/calcium chelator EGTA and the non-selec - tive calcium channel blocker ruthenium red (RR; Fig. 8a and b)."
        explanation: "States the significant reduction of IL6 induction by EGTA plus ruthenium red that this assay's chelator condition records."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The TLR4 inhibitor TAK-242 and the iron che - lator deferoxamine also reduced IL6, but not IL8 induc- tion (Fig. 8a and b)."
        explanation: "States that TAK-242 and deferoxamine reduced IL6 induction specifically, which is what distinguishes this assay's results from the IL8 companion assay."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "For these studies, a concentration of 0.25 mg/mL or 66 µg/cm2 was used for HBEC3-KT cells and 0.045 mg/ mL or 12 µg/cm 2 for THP-1 cells."
        explanation: "Source of the 66 ug/cm2 concentration carried by every GSLD condition in this assay."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "GSLD qPM 2.5 was more cyto - toxic than unfractionated GSLD and CFA; the LC 50 for unfractionated GSLD and GSLD qPM 2.5 were 1.13 mg/ mL (710 µg/cm 2) and 0.73 mg/mL (459 µg/cm 2), respec- tively."
        explanation: "The LC50 values quoted in this assay's description, which establish that the 66 ug/cm2 treatment concentration is well below cytotoxic levels. Retained as evidence because the schema has no cytotoxicity assay class."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Immortalized human bronchial epithelial (HBEC3-KT) cells (ATCC; Rockville, MD) were grown in Airway Epithelial Basal Medium supplemented with Bronchial Epithelial Cell Growth Kit (ATCC; Rockville, MD)."
        explanation: "Identifies the cell model and culture medium recorded on this assay's study subject."
