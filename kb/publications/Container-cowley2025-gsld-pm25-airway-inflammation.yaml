  - id: "BALF:cowley-gsld-3x-neutrophils-trpv1n606d"
    name: "BAL neutrophil percentage in humanized Trpv1N606D mice after 3x GSLD qPM2.5 inhalation"
    description: >-
      Fig. 11c. CRISPR-Cas9 Trpv1N606D mice, in which the mouse TRPV1 residue
      N606 is replaced by the corresponding human aspartate, had 76 +/- 6%
      neutrophils in BAL after the 3x GSLD qPM2.5 inhalation paradigm, higher
      than the 58 +/- 9% of wild-type C57Bl/6 controls. The mice were made
      because mouse TRPV1 is intrinsically less sensitive than human TRPV1 to
      coal fly ash, and the N606D substitution sensitized mouse TRPV1 to both
      CFA and GSLD qPM2.5 in calcium flux assays. The authors read the greater
      neutrophilia as support for TRPV1 initiating lung inflammation after GSLD
      inhalation. The paper also notes that increases in lung cytokine mRNA and
      BAL cytokine protein in these mice were comparable to, and not
      significantly different from, wild-type mice, so no such difference is
      recorded here.
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Using the 3x GSLD qPM2.5 inhalation exposure paradigm, Trpv1N606D mice exhibited increased (76 ± 6 vs. 58 ± 9%) neutro - philia compared to wild-type controls (Fig. 11c)"
        explanation: "States the 76 +/- 6% BAL neutrophil percentage recorded in this assay's output record and the wild-type value it exceeded."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Trpv1N606D mice exhibited greater neutrophilia than C57Bl/6 mice following GSLD qPM2.5 inhalation."
