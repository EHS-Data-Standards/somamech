  # qPM2.5, 3x inhalation paradigm. Figure-only data.
  # ---------------------------------------------------------------------------
  - id: "BALF:cowley-gsld-vs-cfa-3x"
    name: "BAL neutrophilia after 3x inhalation of GSLD qPM2.5 versus coal fly ash qPM2.5"
    description: >-
      Supplemental Fig. 10. Using the 3x inhalation paradigm, GSLD qPM2.5
      produced greater neutrophilia than an equivalent dose of coal fly ash
      (CFA) qPM2.5, as well as greater Cxcl2 and Muc5ac mRNA expression. CFA is
      a well-characterized pneumotoxic particulate from the Hunter power plant
      in Castledale, UT, prepared as qPM2.5 by the same cascade-impactor method,
      and the authors use it as the reference particle against which GSLD
      potency is judged. NO MEASUREMENT VALUES: this comparison is published
      only as a supplemental figure, so both output records carry their
      condition and no value.
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Using the 3x exposure paradigm, GSLD qPM 2.5 elicited greater neutrophilia as well as Cxcl2 and Muc5ac mRNA expression than an equivalent dose of CFA qPM 2.5 (Sup- plemental Fig. 10)."
        explanation: "States the comparison this assay records: greater neutrophilia from GSLD than from an equivalent dose of CFA under the 3x paradigm."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Inhaled GSLD qPM2.5 caused a greater neutrophilic response than coal fly ash qPM2.5 and was more cytotoxic to human airway epithelial cells (HBEC3-KT) in vitro."
        explanation: "The authors' own abstract-level statement of the same GSLD-versus-CFA result."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Inhalation exposure to CFA qPM2.5 was also performed using the 3x exposure paradigm and in all cases, 24 h after exposure, mice were sacrificed by Euthasol injection."
