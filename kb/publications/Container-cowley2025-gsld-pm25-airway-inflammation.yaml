# =============================================================================
# KEY EVENT RELATIONSHIPS
# =============================================================================
# The two mechanistic links the paper argues for. Both are given moderate
# evidence support: each rests on antagonist pharmacology plus, for TRPV1, a
# genetic test in vivo, but neither is quantitatively characterized.
# =============================================================================

key_event_relationships:
  - id: "KER:cowley-trp-to-airway-inflammation"
    name: "TRP channel activation leads to airway inflammation after lakebed dust inhalation"
    description: "The paper's central proposed mechanism for the epithelial response. GSLD qPM2.5 activates human and mouse TRPV1 (and TRPA1 and TRPM8) in calcium flux assays; blocking TRPV1 with LJO-328 or AMG-9810, or TRPV3 with 007, attenuates IL6 mRNA induction in HBEC3-KT cells; EGTA plus the non-selective calcium channel blocker ruthenium red attenuates both IL6 and IL8 induction, consistent with a calcium-entry-dependent step. The strongest support is genetic and in vivo: humanized Trpv1N606D mice, whose TRPV1 is sensitized to the dust, developed more BAL neutrophilia than wild-type C57Bl/6 mice after the same 3x inhalation exposure. Evidence support is moderate rather than strong because the IL8 readout moved in the opposite direction under single-antagonist treatment, TRPV3 activation by the dust was not itself observed in the calcium assays, and cytokine mRNA and BAL protein did not differ significantly between the two mouse genotypes. Quantitative understanding is low: no dose-response relating channel activation to inflammation magnitude is reported."
