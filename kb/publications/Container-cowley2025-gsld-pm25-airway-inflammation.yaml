  # ---------------------------------------------------------------------------
  # Fig. 6e and f - IL6 and CXCL1 protein in BAL after the 3x inhalation
  # paradigm, by ELISA. The paper states the rise as "2-3-fold", which is
  # recorded in response_comparisons; the absolute concentrations are
  # figure-only.
  # ---------------------------------------------------------------------------
  - id: "BALF:cowley-gsld-3x-cytokines"
    name: "BAL IL6 and CXCL1 protein after 3x GSLD qPM2.5 inhalation"
    description: >-
      Fig. 6e and f. CXCL1 and IL6 protein concentrations were measured by
      ELISA in the first 1 mL of BAL fluid from mice given the 3x inhalation
      exposure, and both were elevated 2-3-fold relative to control. The figure
      legend reports mean and standard deviation analysed by 1-way ANOVA with a
      Dunnett post-test. NO ABSOLUTE VALUES: the per-group concentrations appear
      only in the figure, so neither output record carries an
      il6_concentration or il8_concentration value. The stated 2-3-fold rise is
      recorded in response_comparisons as a fold_change whose variability is the
      reported range, with derivation: reported_in_paper. Note that CXCL1 (KC)
      is a mouse chemokine with no named BALFSputumOutput slot of its own; the
      paper itself describes IL8 as the human analogue of Cxcl1 and Cxcl2, and
      the CXCL1 comparison below therefore uses il8_concentration as its
      compared_measurement, following the convention used elsewhere in this
      corpus for murine KC.
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "IL6 and CXCL1 protein in BAL was also elevated 2-3-fold in BAL following inha - lation (Fig. 6e and f)."
        explanation: "The sole quantitative statement about these two BAL proteins, and the source of the 2-3-fold change recorded in response_comparisons."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "CXCL1 and (f) IL6 protein concentrations in BAL of 3x exposed mice determined by ELISA."
        explanation: "Fig. 6 legend, confirming that these measurements come from the 3x exposure group and were made by ELISA."
