    name: "IL8 mRNA in HBEC3-KT cells - GSLD qPM2.5 with calcium/metal chelation and TLR4 inhibition"
    description: >-
      Fig. 8b. The companion of the IL6 chelator assay, run on the same cells
      and conditions but reading IL8, which the paper identifies as the human
      analogue of mouse Cxcl1 and Cxcl2. GSLD qPM2.5 at 66 ug/cm2 for 24 h
      induced IL8 mRNA, and the induction was significantly reduced by EGTA plus
      ruthenium red (10 + 50 uM). THE TWO READOUTS DIVERGE HERE: unlike IL6, IL8
      induction was NOT reduced by the TLR4 inhibitor TAK-242 (1 uM) or by the
      iron chelator deferoxamine (50 uM). Likewise (Fig. 8d), neither
      water/ethanol pre-extraction nor heating to 500 C affected IL8 induction,
      although the authors note a trend toward enhanced IL8 induction after
      heating. The figure legend states the data are mean and standard deviation
      analysed by 1-way ANOVA with a Dunnett post-test, with all treatment groups
      corrected for their respective controls and normalized to GSLD qPM2.5
      treated cells. NO MEASUREMENT VALUES: every value in this figure is a
      figure-only normalized ratio, so no output record carries an mrna_level.
