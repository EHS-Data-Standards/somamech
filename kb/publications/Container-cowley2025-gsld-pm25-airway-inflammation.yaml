        snippet: "Exposure of mice via inhalation and oropharyngeal aspiration caused neutrophilia, increased expression of mRNA for Il6, Cxcl1, Cxcl2, and Muc5ac in the lungs, and increased IL6 and CXCL1 in bronchoalveolar lavage."
