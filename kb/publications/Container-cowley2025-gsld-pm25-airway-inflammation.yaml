  # ===========================================================================
  # TRP CHANNEL ANTAGONIST ARMS - Fig. 10a/b and Supplemental Fig. 12a/b.
  # These two assays inform on the newly minted KE:mie-trp-channel-activation,
  # because establishing that TRPV1 and TRPV3 gate the cytokine response is
  # their purpose. The calcium-flux evidence that GSLD qPM2.5 actually opens
  # these channels is quoted on them, since the schema has no calcium-flux
  # assay class to hold it.
  # ===========================================================================
  - id: "GENE:cowley-il6-hbec-trp"
    name: "IL6 mRNA in HBEC3-KT cells - GSLD qPM2.5 with TRPV1 and TRPV3 antagonists"
    description: >-
      Fig. 10a, with the initial screen in Supplemental Fig. 12a. HBEC3-KT cells
      were pre-treated 30 min and co-treated for 24 h with GSLD qPM2.5
      (66 ug/cm2) and TRP channel antagonists. Inhibitors of TRPA1 (A967079),
      TRPM8 and TRPM8 delta-M801 (AMTB) and TRPV4 (HC-067047) did not affect
      mRNA induction and are therefore not modelled as conditions here. IL6
      induction WAS attenuated by the TRPV1 antagonist LJO-328 (20 uM), by a
      second TRPV1 antagonist AMG-9810 (1 uM), by the TRPV3 antagonist 007
      (50 uM), and by the LJO-328 plus 007 combination. Supporting the
      mechanism, calcium flux assays in HEK-293/GCaMP6s cells showed that GSLD
      qPM2.5 activates mouse and human TRPA1, TRPM8, the truncated TRPM8
      delta-M801 variant and TRPV1, while TRPV3 and TRPV4 activation was not
      observed - so the TRPV3 antagonist effect on cytokine induction is
      pharmacological rather than explained by direct TRPV3 activation by the
      dust. The same pattern of IL6 and IL8 inhibition was seen with Salton Sea
      dust qPM2.5, though there the antagonist effect was dose dependent. The
      figure legend states the data are mean and standard deviation analysed by
      1-way ANOVA with a Dunnett post-test (* p < 0.05, *** p < 0.001,
      **** p < 0.0001), normalized to GSLD qPM2.5 treated cells. NO MEASUREMENT
      VALUES: all values are figure-only normalized ratios.
    target_gene: "NCBIGene:3569"
    gene_expression_method: "TaqMan quantitative real-time RT-PCR (delta delta CT)"
    normalization_reference: "B2M"
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "IL6 induction was attenuated by both LJO-328 and 007, while IL8 was increased by 007."
        explanation: "The screen result this assay records: IL6 induction was attenuated by both the TRPV1 and the TRPV3 antagonist, in contrast to IL8."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Subsequent experiments confirmed the inhibition of IL6 induction by LJO-328, AMG-9810 (another TRPV1 antagonist), and a combination of LJO-328 and 007 (Fig. 10a)."
        explanation: "Names the three confirming conditions - LJO-328, AMG-9810 and LJO-328 plus 007 - that this assay's output records represent."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Accordingly, GSLD qPM2.5 activated human TRPV1 as well as other human TRP channels."
        explanation: "The authors' statement that the dust activates human TRPV1, which is the molecular initiating event this assay informs on."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "TRPV3 and TRPV4 activation was not observed."
        explanation: "The calcium-flux negative result noted in this assay's description, which is why the TRPV3 antagonist effect is described as pharmacological rather than evidence of direct TRPV3 activation."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Dust from the Salton Sea playa (SSD qPM2.5) also stimulated IL6 and IL8 mRNA expression and activated TRPV1 in vitro, but inhibition by TRPV1 and V3 antagonists was dose dependent."
        explanation: "Supports the statement in this assay's description that the same TRP-dependent pattern held for Salton Sea dust, with a dose-dependent antagonist effect."
