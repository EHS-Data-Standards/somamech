# GOBLET CELL ASSAY - mouse lung Muc5ac mRNA after GSLD qPM2.5 inhalation
# =============================================================================
# Fig. 6d (inhalation) and Supplemental Fig. 9d (OPA). Recorded as a
# GobletCellAssay rather than a GeneExpressionAssay because
# muc5ac_mrna_expression is a named GobletCellOutput slot. Values are
# figure-only, so no output record carries a value.
# =============================================================================

goblet_cell_assays:
  - id: "GOBLET:cowley-muc5ac-lung-inhalation"
    name: "Mouse lung Muc5ac mRNA after whole-body GSLD qPM2.5 inhalation"
    description: >-
      Fig. 6d. Muc5ac mRNA in the left lung lobe was induced after whole-body
      inhalation of GSLD qPM2.5, measured by TaqMan qRT-PCR (Mm01276718_m1) and
      normalized to Gapdh by the comparative cycle threshold method; the same
      induction occurred after oropharyngeal aspiration (Supplemental Fig. 9d).
      The authors note in the discussion that Muc5ac has been shown to
      contribute to airway obstruction and hypersensitivity in asthma, which is
      why this readout is tracked separately from the inflammatory cytokines.
      GSLD qPM2.5 also induced more Muc5ac mRNA than an equivalent dose of coal
      fly ash under the 3x paradigm. NO MEASUREMENT VALUES: the relative
      expression values appear only in the figure, so each output record carries
      its condition and no muc5ac_mrna_expression value. Note the contrast with
      the in vitro arm, where MUC5AC induction in HBEC3-KT cells was reported as
      negligible and variable and was not shown.
    evidence:
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Exposure of mice via inhalation and oropharyngeal aspiration caused neutrophilia, increased expression of mRNA for Il6, Cxcl1, Cxcl2, and Muc5ac in the lungs, and increased IL6 and CXCL1 in bronchoalveolar lavage."
        explanation: "States that both inhalation and aspiration increased Muc5ac mRNA in the lungs, the direction this assay records."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Muc5ac RNA was induced, which has been shown to contribute to airway obstruction"
        explanation: "The authors' discussion of the Muc5ac induction and why it matters, supporting the mucin hypersecretion key event this assay informs on."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Using the 3x exposure paradigm, GSLD qPM 2.5 elicited greater neutrophilia as well as Cxcl2 and Muc5ac mRNA expression than an equivalent dose of CFA qPM 2.5 (Sup- plemental Fig. 10)."
        explanation: "Supports the statement in this assay's description that GSLD induced more Muc5ac mRNA than an equivalent dose of coal fly ash."
      - reference: "PMID:39819386"
        reference_title: "Pro-inflammatory effects of inhaled Great Salt Lake dust particles."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "MUC5AC induction was negligible and variable (not shown)."
        explanation: "The contrasting in vitro result noted in this assay's description, which is why no HBEC3-KT MUC5AC assay is recorded in this file."
