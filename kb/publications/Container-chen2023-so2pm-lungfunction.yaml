# =============================================================================
# Chen et al. (2023) - The impact of the synergistic effect of SO2 and
# PM2.5/PM10 on obstructive lung disease in subtropical Taiwan
# =============================================================================
#
# Source: Front Public Health. 2023;11:1229820
# DOI: 10.3389/fpubh.2023.1229820
#
# Study Design:
#   - Cross-sectional human epidemiological study
#   - 2,635 participants from the Taiwan Biobank (TWB), aged 30-70 years
#   - Exposure assessment from the Taiwan Air Quality Monitoring Database
#     (TAQMD, 74 stations); annual average pollutant levels at the station
#     nearest each participant's residential address for the year before survey
#   - Obstructive lung disease defined as FEV1/FVC < 70% (ATS/ERS guidelines)
#   - Groups: obstructive impairment (n=733, 27.8%) vs normal spirometry
#     (n=1,902, 72.2%)
#
# Key findings:
#   - Higher temperature, higher relative humidity, and lower rainfall were
#     risk factors for obstructive lung disease
#   - SO2 positively correlated with PM10 (r=0.53) and PM2.5 (r=0.52)
#   - SO2 modified the relative risk of obstructive impairment for PM10
#     (beta=0.01, p=0.0052) and PM2.5 (beta=0.01, p=0.0155)
#   - Adjusted ORs for obstructive impairment: SO2 1.25 (model 1) / 1.28
#     (model 2); PM10 0.99; PM2.5 0.97
#   - Bivariate thin-plate smoothing splines (SO2 vs PM10, SO2 vs PM2.5)
#     significantly associated with obstructive impairment (p < 0.0001),
#     supporting a synergistic effect of SO2 and PM2.5/PM10
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:37809009"
  reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
  doi: "10.3389/fpubh.2023.1229820"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:chen-spirometry-001"
    name: "Taiwan Biobank spirometry"
    description: "Spirometry performed by technicians using MicroLab spirometers and Spida 5 software (Micro Medical Ltd., Rochester, Kent, UK). Pulmonary function parameters recorded in the Taiwan Biobank: FEV1, FVC, FEV1/FVC% ratio, FVC-predicted value, and FEV1-predicted value. Obstructive lung disease defined as FEV1/FVC < 70% according to American Thoracic Society and European Respiratory Society guidelines."
    spirometry_standard: "ATS/ERS"
    equipment_required:
      - "MicroLab spirometer (Micro Medical Ltd., Rochester, Kent, UK)"
      - "Spida 5 software"

  - id: "PROTOCOL:chen-airmonitoring-001"
    name: "TAQMD residential air pollutant exposure assessment"
    description: "Exposure assigned from 74 Taiwan Air Quality Monitoring Database (TAQMD) stations. Google geocoding located each residential address; the nearest air quality monitoring station was identified; annual average concentrations of PM2.5, PM10, CO, NO, NO2, NOx, SO2, and O3 were calculated for the year leading up to the survey date. PM2.5 and PM10 detected by beta-ray attenuation method; SO2 detected by ultraviolet fluorescence method."
    equipment_required:
      - "Taiwan Air Quality Monitoring Database (74 stations)"
      - "Beta-ray attenuation PM monitor"
      - "Ultraviolet fluorescence SO2 monitor"

# =============================================================================
# LUNG FUNCTION ASSAYS (spirometry, human epidemiology)
# =============================================================================

lung_function_assays:

  # ---------------------------------------------------------------------------
  # Full cohort (n=2,635) - spirometry plus regression/GAM synergy analysis
  # ---------------------------------------------------------------------------
  - id: "LF:chen-cohort-2023"
    name: "Spirometry and SO2/PM synergy analysis - full TWB cohort"
    description: "Spirometry in the full cross-sectional cohort (n=2,635; mean age 49.80 +/- 10.53 years). Mean FEV1 percent predicted 84.89 (SD 22.35). Multinomial logistic regression: adjusted OR for obstructive impairment per unit SO2 1.25 (95% CI 1.14-1.36, p<0.001) in model 1 and 1.28 (95% CI 1.17-1.39, p<0.001) in model 2; PM10 OR 0.99 (95% CI 0.98-0.99, p<0.001); PM2.5 OR 0.97 (95% CI 0.96-0.98, p<0.001); temperature OR 1.24 (model 1) and 1.31 (model 2); relative humidity OR 1.05 (model 1) and 1.04 (model 2); rainfall OR 0.08 in both models. SO2 modified the relationship of PM10 (beta=0.01, p=0.0052; per SD beta=0.11) and PM2.5 (beta=0.01, p=0.0155; per SD beta=0.09) with the relative risk of obstructive impairment. Bivariate thin-plate smoothing splines (SO2 vs PM10, SO2 vs PM2.5) were significantly associated with obstructive impairment (p<0.0001), indicating a synergistic effect."
    has_specified_output:
      id: "LF:chen-cohort-2023-output"
      name: "Full cohort spirometry results"
      description: "Mean (SD) FEV1 percent predicted for the total cohort: 84.89 (22.35). Values from Table 1 column 'Total' (n=2,635)."
      fev1:
        value: "84.89"
        unit:
          id: "UO:0000187"
          name: "percent"
      evidence:
        - reference: "PMID:37809009"
          reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
          supports: SUPPORT
          evidence_source: HUMAN_CLINICAL
          snippet: "FEV10_PRED, mean (SD) 84.89 (22.35) 58.42 (18.31) 95.09 (13.73) <0.0001"
          explanation: "Table 1 row for FEV1 percent predicted, mean (SD): total cohort 84.89 (22.35), obstructive impairment group 58.42 (18.31), normal spirometry group 95.09 (13.73)."
    informs_on_key_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    study_subject:
      subject_type: InVivoSubject
      id: "SUBJECT:chen-twb-cohort"
      name: "Taiwan Biobank cross-sectional cohort"
      model_species:
        id: "NCBITaxon:9606"
        name: "Homo sapiens"
      age:
        value: "49.80"
        unit:
          id: "UO:0000036"
          name: "year"
      subject_characteristics: "n=2,635 Taiwan Biobank volunteers aged 30-70 years without history of cancer; 1,225 (46.5%) men and 1,410 (53.5%) women; mean age 49.80 (SD 10.53) years; 61.2% from southern Taiwan"
      clinical_context: "Cross-sectional spirometry with residential annual-average air pollutant exposure assessment"
    has_exposure_condition:
      - id: "EXPOSURE:chen-so2-cohort"
        name: "Ambient SO2, annual average, full cohort"
        exposure_agent:
          id: "CHEBI:18422"
          name: "sulfur dioxide"
        exposure_concentration:
          value: "3.63"
          unit:
            id: "UO:0000170"
            name: "parts per billion"
        exposure_duration:
          value: "1"
          unit:
            id: "UO:0000036"
            name: "year"
