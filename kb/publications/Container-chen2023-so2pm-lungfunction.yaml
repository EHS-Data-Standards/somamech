    follows_protocols:
      - id: "PROTOCOL:chen-spirometry-001"
        name: "Taiwan Biobank spirometry"
      - id: "PROTOCOL:chen-airmonitoring-001"
        name: "TAQMD residential air pollutant exposure assessment"
    evidence:
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The mean age of the 2,635 enrolled participants was 49.80 ± 10.53 years."
        explanation: "Establishes the cohort size (n=2,635) and mean age used for this assay's study subject."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In Table 1, we present the average air pollution levels based on a total of 2,635 observations, indicating the following values: PM10: 68.12 μg/m3, PM 2.5: 37.72 μg/m3, SO 2: 3.63 ppb, CO: 0.44 ppm, NO: 4.09 ppb, NO2: 14.86 ppb, NOx: 18.93 ppb."
        explanation: "Gives the cohort-wide average exposure levels recorded in this assay's exposure conditions: PM10 68.12 ug/m3, PM2.5 37.72 ug/m3, SO2 3.63 ppb."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The results showed that SO2 modified the relationship of both PM10 (β = 0.01, p = 0.0052) and PM2.5 (β = 0.01, p = 0.0155) with the relative risk of obstructive impairment (Table 3)."
        explanation: "Reports the interaction (effect modification) of SO2 with PM10 and PM2.5 on obstructive impairment risk recorded in this assay's description."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Analysis of per standard deviation (per SD) increase also showed that SO 2 modified the relationship of both PM10 (β = 0.11, p = 0.0052) and PM2.5 (β = 0.09, p = 0.0155)."
        explanation: "Per-SD interaction estimates for SO2 with PM10 and PM2.5 recorded in this assay's description."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Model 1 showed that the independent predictive factors were temperature (OR = 1.24; 95% CI = 1.09–1.41; p = 0.0009), relative humidity (OR = 1.05; 95% CI = 1.01–1.10; p = 0.0160), rainfall (OR = 0.08; 95% CI = 0.01–0.68; p = 0.0202), PM10 (OR = 0.99; 95% CI = 0.98–0.99; p < 0.001), and SO2 (OR = 1.25; 95% CI = 1.14–1.36; p < 0.001)."
        explanation: "Model 1 adjusted odds ratios for obstructive impairment recorded in this assay's description."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Model 2 showed that the independent predictive factors were temperature (OR = 1.31; 95% CI = 1.15–1.49; p < 0.001), relative humidity (OR = 1.04; 95% CI = 1.00–1.09; p = 0.0372), rainfall (OR = 0.08; 95% CI = 0.01–0.67; p = 0.0197), PM2.5 (OR = 0.97; 95% CI = 0.96–0.98; p < 0.001), and SO2 (OR = 1.28; 95% CI = 1.17–1.39; p < 0.001)."
        explanation: "Model 2 adjusted odds ratios for obstructive impairment recorded in this assay's description."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We also found that the bivariate thin-plate smoothing spline in models 1 and 2 were significantly associated with obstructive impairment (p < 0.0001) (Table 4)."
        explanation: "GAM bivariate spline result supporting the synergistic effect of SO2 with PM10/PM2.5 on obstructive impairment."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Furthermore, we identified interactions and synergistic effects among SO2 and PM2.5/PM10."
        explanation: "States the paper's central synergy conclusion captured by this assay."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "We found that SO2 was positively correlated with PM10 and PM2.5, with correlation coefficients of 0.53 (p < 0.0001) and 0.52 (p < 0.0001), respectively (Table 2)."
        explanation: "Correlation between co-exposures (SO2 with PM10/PM2.5) noted in this assay's description context."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Regarding meteorological factors, higher temperature, higher relative humidity, and lower rainfall were risk factors for obstructive lung disease."
        explanation: "Meteorological risk factors recorded in this assay's description."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Lastly, we selected data from the air quality monitoring station recorded during the year leading up to the survey date and calculated the average values of air pollutants including PM2.5, PM10, CO, NO, NO2, NOx, SO2, and O3 for the chosen year (21)."
        explanation: "Supports the one-year annual-average exposure duration recorded in this assay's exposure conditions."

