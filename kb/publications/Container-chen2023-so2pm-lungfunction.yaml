            id: "UCUM:ug/m3"
            name: "microgram per cubic meter"
        exposure_duration:
          value: "1"
          unit:
            id: "UO:0000036"
            name: "year"
      - id: "EXPOSURE:chen-pm25-cohort"
        name: "Ambient PM2.5, annual average, full cohort"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
        exposure_concentration:
          value: "37.72"
          unit:
            id: "UCUM:ug/m3"
            name: "microgram per cubic meter"
        exposure_duration:
          value: "1"
