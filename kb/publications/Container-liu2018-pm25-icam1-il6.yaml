# =============================================================================
# Liu et al. (2018) - PM2.5-induced oxidative stress increases intercellular
# adhesion molecule-1 expression in lung epithelial cells through the
# IL-6/AKT/STAT3/NF-kB-dependent pathway
# =============================================================================
#
# Source: Part Fibre Toxicol. 2018;15:4
# DOI: 10.1186/s12989-018-0240-x
#
# The committed reference cache for this PMID is full text (content_type:
# full_text_pdf), so every evidence snippet below is quoted from the committed
# copy - some from the PubMed abstract at the head of the file, some from the
# PDF body text. No local-PDF-only quotes are used and no receipt is needed.
#
# Study design - three arms:
#   1. In vitro: A549 cells (human lung type II alveolar epithelial line)
#      exposed for 24 h to two fractions of NIST SRM1649b urban dust:
#        - O-PMs = organic solvent (DMSO)-extractable fraction
#        - W-PMs = water-soluble fraction
#      Readouts: MTT viability (25-400 ug/ml, 24/48/72 h), DCFH-DA ROS,
#      U937 monocyte adhesion, ICAM-1 by Western blot / flow cytometry /
#      immunofluorescence, phospho-AKT / phospho-STAT3 / phospho-p65 and
#      phospho-ERK / p38 / JNK by Western blot, p65 nuclear translocation,
#      a 'human cytokine antibody array, IL-6 by Western blot and ELISA, and
#      pharmacological / siRNA interventions: NAC 5 mM, BAY11-7082 10 uM
#      (NF-kB), LY294002 10 uM (AKT), Stattic 10 uM (STAT3), SB203580 10 uM
#      (p38), SP600125 10 uM (JNK), anti-ICAM-1 1 ug/ml, tocilizumab 20 ug/ml,
#      sgp130Fc 5 ug/ml, p65 siRNA and IL-6 siRNA (1 uM).
#   2. In vivo: male C57BL/6 wild-type (WT) and IL-6 knockout (KO) mice,
#      8-12 weeks, 20-35 g, intratracheal instillation of 200-350 ug PMs per
#      mouse in 100 ul sterile PBS, sacrificed at Day 7 or Day 14 (n = 6 per
#      group). NAC 3-5 mg/mouse (150 mg/kg) intraperitoneally one day before
#      PMs in a separate WT arm. Readouts: lung-tissue immunohistochemistry
#      and Western blot for ICAM-1 and IL-6 (plus phospho-AKT/p65/STAT3), and
#      plasma sICAM-1 and IL-6 by ELISA.
#   3. Human: plasma from 8 COPD patients (all with a smoking history) and
#      8 never-smoking healthy subjects, Taoyuan General Hospital
#      (TYGH99025). Readouts: WBC, CRP, sICAM-1 and IL-6.
#
# NUMERIC VALUES - what is and is not recorded here:
#   The only group-level magnitudes stated numerically anywhere in the running
#   text are the O-PMs ICAM-1 Western blot fold changes (1.3 +/- 0.2 at
#   25 ug/ml, 2.2 +/- 0.1 at 50 ug/ml, 2.7 +/- 0.2 at 100 ug/ml vs untreated
#   control) and the statement that monocyte adhesion to O-PMs-treated cells
#   was 2-times that to W-PMs-treated cells. Those are recorded, the first as
#   output values plus response_comparisons entries. Every other result -
#   ROS fluorescence, phosphorylation densitometry, IL-6 levels, mouse lung
#   and plasma levels, human WBC/CRP/sICAM-1/IL-6 group levels - is reported
#   only as figure panels, so per the extraction rules no magnitude is
#   estimated and those output records carry only their experimental group,
#   the condition they were measured under, and the reported direction.
#   Table 1 does list per-individual sICAM-1 and IL-6 for all 16 human
#   subjects, but the paper states no group mean or spread, and deriving one
#   would be a computation rather than an extraction, so the human output
#   records stay descriptive.
#
#   Spread type: the Statistical analysis section states "All data are
#   expressed as the mean +/- SEM", so the ICAM-1 fold changes are recorded as
#   standard_error. Note the Fig. 1d legend instead says "Values are the mean
#   +/- SD of three independent experiments" for the adhesion assay - the
#   paper is internally inconsistent on this point, and no value from Fig. 1d
#   is recorded numerically here.
#
#   The ICAM-1 fold changes are expressed relative to untreated control, so
#   the control output record is the normalization reference. No numeric value
#   is written into it: 1.0 follows from the normalization rather than being a
#   measurement the paper reports.
#
# KEY EVENTS - all four are reused verbatim from origin/main, none minted:
#   KE:mie-oxidative-stress      (47 uses, unanimous wording)
#   KE:ke-airway-inflammation    (50 uses, unanimous wording)
#   KE:ke-pi3k-akt-activation    (12 uses, unanimous wording)
#   KE:ke-systemic-inflammation  (12 uses, unanimous wording)
#   ICAM-1 induction and monocyte adhesion are mapped to
#   KE:ke-airway-inflammation rather than a new adhesion-molecule key event:
#   the paper's own framing is that epithelial ICAM-1 mediates monocyte
#   adherence and infiltration into inflammatory sites and pulmonary lesions,
#   which is what that key event already covers.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:29329563"
  reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
  doi: "10.1186/s12989-018-0240-x"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:liu-pm-extraction-001"
    protocol_type: MolecularAssayProtocol
    name: "Preparation of water-soluble (W-PMs) and organic-extractable (O-PMs) fractions of SRM1649b"
    description: "The particulate matter was NIST standard reference material 1649b (SRM1649b), composed of urban dust. 50 mg of PMs was dispersed in 1 ml of milli-Q water or in 1 ml of dimethyl sulfoxide (DMSO), shaken and ultra-sonicated for 2 h in an ultrasonic bath, then centrifuged at 13000 x g for 30 min; the supernatant was collected as the water-soluble (W-PMs) or organic-extractable (O-PMs) fraction. All extracts were stored at -20 C until biological analysis."
    detection_method: "solvent extraction followed by ultrasonication and centrifugation"
    equipment_required:
      - "Ultrasonic bath"
      - "Refrigerated centrifuge (13000 x g)"
      - "NIST SRM1649b urban dust"

  - id: "PROTOCOL:liu-mtt-001"
    protocol_type: MolecularAssayProtocol
    name: "MTT cytotoxicity assay in A549 cells"
    description: "A549 cells seeded in 96-well plates at 1 x 10^4 cells per well in 100 ul medium, cultured 24 h, then treated with 0, 25, 50, 100, 200 or 400 ug/ml of PMs for 24, 48 or 72 h. 20 ul of MTT (1 mg/ml in PBS) added per well and incubated 2 h at 37 C, then 100 ul DMSO added and absorbance read at 570 nm on a microplate spectrophotometer (Thermo MK3). Data expressed as a percentage of the solvent control (0.1% DMSO), set to 100%. Experiments performed in triplicate and repeated 3 times."
    detection_method: "MTT tetrazolium reduction, absorbance at 570 nm"
    equipment_required:
      - "Microplate spectrophotometer (Thermo MK3)"
      - "MTT reagent"

  - id: "PROTOCOL:liu-dcfhda-001"
    protocol_type: ImagingProtocol
    name: "DCFH-DA detection of intracellular ROS in A549 cells"
    description: "Confluent A549 cells on 12-well plates treated with 50 or 100 ug/ml of W-PMs or O-PMs for 24 h, then 10 uM 2',7'-dichlorofluorescein-diacetate (DCFH-DA) added for 20 min at 37 C in the dark. Cells washed twice with ice-cold PBS. Fluorescence observed with a fluorescence microscope (excitation 488 nm, emission 519 nm) and analysed on a FACScan flow cytometer (Becton Dickinson)."
    fluorescent_labeling: "2',7'-dichlorofluorescein-diacetate (DCFH-DA)"
    fluorescent_tracer: "DCFH-DA"
    equipment_required:
      - "Fluorescence microscope (excitation 488 nm, emission 519 nm)"
      - "FACScan flow cytometer (Becton Dickinson)"
      - "DCFH-DA probe"

  - id: "PROTOCOL:liu-flow-icam1-001"
    protocol_type: MolecularAssayProtocol
    name: "Flow cytometry for ICAM-1 surface expression on A549 cells"
    description: "A549 cells treated or untreated for 1 h with 10 uM Bay11-7082 (NF-kB inhibitor), LY294002 (AKT inhibitor), Stattic (STAT3 inhibitor), SB203580 (p38 inhibitor) or SP600125 (JNK inhibitor), then treated with 100 ug/ml O-PMs for 24 h and washed twice with PBS. After trypsinization, 10^5 suspended A549 cells incubated in 100 ul PBS containing 5 ul FITC-conjugated anti-human ICAM-1 antibody (Dako) or FITC-conjugated control IgG for 15 min, resuspended in 500 ul PBS and analysed on a FACScan flow cytometer. Experiments performed in triplicate and repeated 3 times."
    detection_method: "flow cytometry with FITC-conjugated anti-ICAM-1"
    antibodies_used:
      - "FITC-conjugated anti-human ICAM-1 (Dako)"
      - "FITC-conjugated control IgG (Dako)"
    equipment_required:
      - "FACScan flow cytometer"

  - id: "PROTOCOL:liu-adhesion-001"
    protocol_type: ImagingProtocol
    name: "Epithelial cell-leukocyte (A549-U937) adhesion assay"
    description: "A549 cells in 24-well plates untreated or pretreated for 1 h with 10 uM Bay11-7082, LY294002 or Stattic, 5 mM N-acetyl cysteine, 1 ug/ml anti-ICAM-1 antibody, or p65 siRNA, then treated with or without 100 ug/ml O-PMs for 24 h. U937 cells labelled for 1 h at 37 C with 10 mM BCECF/AM (Boehringer Mannheim) in DMSO and suspended in A549 culture medium. 10^6 labelled U937 cells added to 10^6 adherent PM-treated A549 cells and incubated 1 h; nonadherent cells removed by two gentle PBS washes and bound U937 cells counted by fluorescence microscopy."
    fluorescent_labeling: "BCECF/AM"
    fluorescent_tracer: "BCECF/AM"
    equipment_required:
      - "Fluorescence microscope"
      - "BCECF/AM (Boehringer Mannheim)"

  - id: "PROTOCOL:liu-cytokinearray-001"
    protocol_type: MolecularAssayProtocol
    name: "Human cytokine antibody array on A549 conditioned media"
    description: "A human cytokine antibody array (RayBiotech) used to identify cytokines secreted from A549 cells with or without O-PMs treatment, following the manufacturer's instructions. The signal intensity of each spot was analysed with ImageJ and normalized to the average of the positive control spots to determine the variation of the cytokines."
    detection_method: "sandwich antibody array with densitometric spot quantification (ImageJ)"
    normalization_method: "normalized to the average of the positive control spots"
    equipment_required:
      - "Human cytokine antibody array (RayBiotech)"
      - "ImageJ densitometry"

  - id: "PROTOCOL:liu-wb-001"
    protocol_type: MolecularAssayProtocol
    name: "Western blot for ICAM-1, IL-6, MAPKs, AKT, STAT3 and p65"
    description: "Cells harvested in lysis buffer (20 mM Tris-HCl, 150 mM NaCl, 1 mM EDTA, 1 mM EGTA, 1% Triton X-100, 1 mM phenylmethylsulfonyl fluoride) with protease and phosphatase inhibitor; lysates centrifuged 14000 x g for 30 min at 4 C. Cytoplasmic and nuclear fractions extracted with cytoplasmic extraction and NE-PER Nuclear reagents (Thermo Fisher Scientific). 20 ug of protein per lane resolved by SDS-PAGE and transferred to PVDF membranes (Pall), blocked 30 min at room temperature in 5% nonfat milk in Tris-buffered saline with 0.2% Tween 20. Membranes incubated overnight at 4 C with primary antibodies, then 1 h at room temperature with HRP-conjugated goat anti-rabbit IgG (Sigma, 1:2000) and detected by chemiluminescence (NEN). Images captured on a UVP BioSpectrum 600 system and band intensity quantified by densitometry. The same lysis and blotting procedure was applied to mouse lung tissue."
    detection_method: "chemiluminescent immunoblot with densitometric quantification"
    normalization_method: "GAPDH loading control; Lamin A, alpha-Tubulin and beta-actin used as fraction markers"
    reference_gene: "GAPDH"
    antibodies_used:
      - "ICAM-1, phospho-STAT3, t-STAT3, IL-6 (Abcam, 1:5000)"
      - "phospho-JNK, t-JNK (Cell Signaling Technology, 1:2000)"
      - "phospho-ERK1/2, t-ERK1/2 (Cell Signaling Technology, 1:8000)"
      - "phospho-p38, t-p38 (Santa Cruz Biotechnology, 1:8000)"
      - "t-p65, phospho-p65 (Epitomics, 1:1000)"
      - "Lamin A, alpha-Tubulin, beta-actin (Epitomics, 1:5000)"
      - "GAPDH (Santa Cruz Biotechnology, 1:3000) loading control"
      - "HRP-conjugated goat anti-rabbit IgG (Sigma, 1:2000)"
    equipment_required:
      - "SDS-PAGE apparatus"
      - "UVP BioSpectrum 600 imaging system"
      - "NE-PER nuclear and cytoplasmic extraction reagents"

  - id: "PROTOCOL:liu-sirna-001"
    protocol_type: MolecularAssayProtocol
    name: "siRNA knockdown of p65 and IL-6 in A549 cells"
    description: "Accell SMART pool siRNAs (Dharmacon) targeting p65 or IL-6. A 100 uM siRNA stock prepared in RNase-free water and stored at -20 C. A549 cells cultured in 6-well plates at 70-80% confluence for 24 h, then 1 uM of p65 or IL-6 siRNA added in Turbofect (Thermo Fisher Scientific). After 24 h of transfection cells were stimulated with 100 ug/ml O-PMs for 24 h. Knockdown of p65 confirmed in cell lysates by Western blot; knockdown of IL-6 confirmed in conditioned medium by ELISA."
    detection_method: "Turbofect-mediated transient siRNA transfection, confirmed by Western blot (p65) and ELISA (IL-6)"
    equipment_required:
      - "Accell SMART pool siRNA against p65 and IL-6 (Dharmacon)"
      - "Turbofect transfection reagent (Thermo Fisher Scientific)"

  - id: "PROTOCOL:liu-elisa-sicam1-001"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for soluble ICAM-1 in conditioned media and plasma"
    description: "Conditioned media collected from A549 cells (2 x 10^5) with and without 100 ug/ml O-PMs for 24 h; plasma collected from mice and from patients. sICAM-1 determined with ELISA kits (R&D Systems) following the manufacturer's protocols. Absorbance read at 450 nm on an EL808 microplate absorbance reader (BioTek). Cell samples run in triplicate and repeated three times. Plasma was collected from 8 COPD patients and 8 healthy subjects, and from mice (six mice per group) at 7 and 14 days after PMs treatment."
    detection_method: "sandwich ELISA, absorbance at 450 nm"
    equipment_required:
      - "sICAM-1 ELISA kit (R&D Systems)"
      - "EL808 microplate absorbance reader (BioTek)"

  - id: "PROTOCOL:liu-elisa-il6-001"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for IL-6 in conditioned media and plasma"
    description: "IL-6 determined by ELISA in A549 conditioned media and in mouse and human plasma. Human IL-6 kits from BioLegend and mouse IL-6 kits from R&D Systems, used according to the manufacturers' protocols, with absorbance read at 450 nm on an EL808 microplate absorbance reader (BioTek). Cell samples run in triplicate and repeated three times."
    detection_method: "sandwich ELISA, absorbance at 450 nm"
    equipment_required:
      - "Human IL-6 ELISA kit (BioLegend)"
      - "Mouse IL-6 ELISA kit (R&D Systems)"
      - "EL808 microplate absorbance reader (BioTek)"

  - id: "PROTOCOL:liu-if-icam1-001"
    protocol_type: ImagingProtocol
    name: "Immunofluorescent staining of ICAM-1 in A549 cells"
    description: "A sterilized coverslip with 0.1% gelatin coating placed in a 24-well plate and A549 cells seeded at 1 x 10^5 cells/ml. Confluent cells treated with 100 ug/ml W-PMs or O-PMs for 24 h, washed with PBS, fixed with 4% formaldehyde for 15 min and permeabilized with 0.3% Triton X-100 for 1 min at room temperature. Blocked in PBS with 1% bovine serum albumin for 1 h, incubated with ICAM-1 antibody (1:500, Abcam) overnight at 4 C, washed, then DyLight 488-conjugated secondary antibody (1:1000, Abcam) for 1 h at room temperature. Counterstained with 1 ug/ml DAPI for 5 min and photographed by fluorescence microscopy."
    fluorescent_labeling: "anti-ICAM-1 (Abcam, 1:500) with DyLight 488-conjugated secondary antibody (Abcam, 1:1000) and DAPI nuclear counterstain"
    fluorescent_tracer: "DyLight 488"
    equipment_required:
      - "Fluorescence microscope"

  - id: "PROTOCOL:liu-instillation-001"
    protocol_type: Protocol
    name: "Intratracheal instillation of PMs in WT and IL-6 KO mice"
    description: "Procedures followed National Taiwan University animal care guidelines (ICCUC: 20160235) and the Guide for the Care and Use of Laboratory Animals, NIH publication No. 86-23 (revised 1985). Male C57BL/6 wild-type and IL-6 knockout mice, 8-12 weeks old, 20-35 g. Mice anesthetized with inhaled 2% isoflurane, necks shaved and sterilized with 75% alcohol, a vertical 5-mm incision made and the trachea exposed; the anterior tracheal wall between the second and third cartilage rings punctured with an insulin syringe at 45 degrees to avoid damaging the posterior wall. PMs thawed at room temperature and diluted in sterile PBS to 200-350 ug per 100 ul; a 100 ul suspension slowly instilled intratracheally followed by 100 ul of clean air (n = 6 per group). In a separate WT arm, 50 ul of NAC (3-5 mg/mouse, 150 mg/kg body weight) in PBS was injected intraperitoneally one day before PMs administration. Control mice received an equal volume of PBS. Forelegs held to keep the animal upright for 10 s, then the mice were rotated to help the solution enter the lungs and the skin incision was sutured. Mice were anesthetized with Zoletil/Xylazine (2 mg/kg + 5 mg/kg) and sacrificed at Day 7 or Day 14. Blood was collected for plasma sICAM-1 and IL-6; part of the lung was immersion-fixed in 4% buffered paraformaldehyde and paraffin-embedded for immunohistochemistry, and the remainder frozen in liquid nitrogen for protein isolation."
    equipment_required:
      - "Isoflurane anesthesia system"
      - "Insulin syringe"

  - id: "PROTOCOL:liu-ihc-001"
    protocol_type: StainingProtocol
    name: "Immunohistochemistry for ICAM-1 and IL-6 in mouse lung"
    description: "5-um-thick lung sections incubated overnight at 4 C with ICAM-1 or IL-6 antibodies (1:100, Abcam), then with biotin-conjugated goat anti-rabbit IgG (1:200, Vector lab) for 1 h at room temperature. Sections stained with 3,3-diaminobenzidine tetrahydrochloride (DAB), counterstained with hematoxylin and examined by light microscopy."
    staining_type: "DAB immunohistochemistry with hematoxylin counterstain"
    detection_method: "light microscopy"
    antibodies_used:
      - "anti-ICAM-1 (Abcam, 1:100)"
      - "anti-IL-6 (Abcam, 1:100)"
      - "biotin-conjugated goat anti-rabbit IgG (Vector lab, 1:200)"
    equipment_required:
      - "Microtome"
      - "Light microscope"

  - id: "PROTOCOL:liu-tem-001"
    protocol_type: ImagingProtocol
    name: "Transmission electron microscopy of O-PMs-treated A549 cells"
    description: "A549 cells treated with 100 ug/ml O-PMs for 24 h collected by centrifugation, washed with PBS, fixed with 2% glutaraldehyde and 2% paraformaldehyde in PBS for 1 min and post-fixed with 1% osmic acid for 30 min. Samples dehydrated in graded ethanol, washed with propylene oxide and embedded in epoxy resin. Ultrathin sections cut on a Reichert ultramicrotome, stained with lead citrate and uranyl acetate and examined in a HITACHI H-7100 at 100 kV."
    equipment_required:
      - "Reichert ultramicrotome"
      - "HITACHI H-7100 transmission electron microscope"

