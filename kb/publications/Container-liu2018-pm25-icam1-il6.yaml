  - id: "GE:liu-a549-u937-adhesion"
    name: "U937 monocyte adhesion to PMs-treated A549 cells"
    description: "BCECF/AM-labelled U937 monocytic cells incubated for 1 h with A549 monolayers pretreated for 24 h with 50 or 100 ug/ml O-PMs or W-PMs, with or without 1 h of 5 mM NAC, and bound cells counted by fluorescence microscopy. Control confluent A549 cells showed minimal binding; adhesion was significantly increased by PMs pretreatment, and the number of monocytes that adhered to O-PMs-treated cells was 2-times higher than to W-PMs-treated cells. NAC pretreatment significantly decreased the O-PMs-increased adhesion. The 2-fold O-PMs-over-W-PMs ratio is the only magnitude stated for this assay and is recorded as a response_comparisons entry rather than as an output value, because the paper gives no per-group bound-cell counts. Note that the Fig. 1d legend reports mean +/- SD of three independent experiments, unlike the mean +/- SEM declared in the Statistical analysis section."
    target_gene: "NCBIGene:3383"
    gene_expression_method: "fluorescence-microscopy counting of BCECF/AM-labelled adherent U937 cells"
    evidence:
