  - id: "GE:liu-a549-il6-blockade"
    name: "IL-6 receptor blockade and IL-6 knockdown versus O-PMs-induced ICAM-1 in A549 cells"
    description: "A549 cells pretreated with the IL-6 receptor inhibitor tocilizumab (TCZ, 20 ug/ml), the IL-6 trans-signalling blocker sgp130Fc (5 ug/ml), or IL-6 siRNA (1 uM), then treated with 100 ug/ml O-PMs for 24 h. TCZ significantly reduced ICAM-1 secretion and expression and also reduced the phosphorylation of AKT, p65 and STAT3. IL-6 siRNA likewise attenuated O-PMs-induced ICAM-1 expression and AKT/p65/STAT3 phosphorylation. sgp130Fc, which blocks IL-6 trans-signalling without affecting classic signalling, did not affect ICAM-1 expression, indicating the effect runs through classic IL-6 signalling. Values appear only in Fig. 5c-e and Additional file 1 Fig. S1; none recorded."
    target_gene: "NCBIGene:3569"
    gene_expression_method: "Western blot and ELISA with receptor blockade and siRNA knockdown"
    normalization_reference: "GAPDH"
    evidence:
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
