    name: "ICAM-1 and IL-6 in lung tissue of PMs-instilled WT and IL-6 KO mice"
    description: "WT and IL-6 KO C57BL/6 mice untreated or injected intratracheally with 200-350 ug PMs per mouse and examined at Day 7 and Day 14 (n = 6 per group). Lung tissues assessed by immunohistochemical staining and Western blot. PMs significantly induced ICAM-1 and IL-6 expression in lung tissues at Day 7 and Day 14 in WT mice, along with the phosphorylation of AKT, p65 and STAT3, whereas in IL-6 KO mice the expression of ICAM-1 and IL-6 was not obvious by immunohistochemistry. This is the in vivo genetic test that IL-6 is required for the PMs-induced ICAM-1 response. Values appear only in Fig. 6a-c; none recorded."
