key_event_relationships:
  - id: "KER:liu-oxidative-stress-to-pi3k-akt"
    name: "Increased oxidative stress leads to PI3K/AKT pathway activation"
    description: "Tested directly rather than assumed: 24 h of O-PMs raised DCFH-DA ROS and, in the same cells, raised phospho-AKT, phospho-STAT3 and phospho-p65 in a concentration-dependent manner, and 1 h of 5 mM NAC before the exposure attenuated both the ROS and all three phosphorylation events. An antioxidant arm that removes the upstream event and abolishes the downstream one is the strongest design available in a single in vitro study, but the exposure is a complex particulate extract and no ROS-donor arm was run in the other direction, so support is recorded as moderate rather than strong."
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-pi3k-akt-activation"
      name: "PI3K/AKT pathway activation"
      biological_action: activated
      level_of_biological_organization: molecular
    relationship_type: "directly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Pretreating A549 cells with N-acetyl cysteine (NAC), an antioxidant, attenuated O-PMs-induced ROS generation, the phosphorylation of the mentioned kinases, and the expression of ICAM-1."
        explanation: "The antioxidant intervention that removes the upstream event and the downstream phosphorylation together, which is the evidence for this edge."
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "O-PMs also induced the phosphorylation of AKT, p65, and STAT3."
        explanation: "States the downstream event of this relationship."

  - id: "KER:liu-pi3k-akt-to-airway-inflammation"
    name: "PI3K/AKT pathway activation leads to airway inflammation"
    description: "The pathway dependence was established pharmacologically and genetically: LY294002 (AKT), BAY11-7082 (NF-kB) and Stattic (STAT3) each significantly down-regulated O-PMs-induced ICAM-1 expression and U937 monocyte adhesion, p65 siRNA attenuated ICAM-1 together with AKT and STAT3 phosphorylation, and p65 translocated to the nucleus on exposure. The p38 and JNK inhibitors did not, which rules out the parallel MAPK route. Three independent inhibitors plus a knockdown converging on the same endpoint is strong in vitro evidence; it is recorded as moderate because the inflammation endpoint here is epithelial ICAM-1 and monocyte adherence in culture rather than inflammation in an intact airway."
    upstream_event:
      id: "KE:ke-pi3k-akt-activation"
      name: "PI3K/AKT pathway activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    relationship_type: "directly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Furthermore, an AKT inhibitor (LY294002), NF-κB inhibitor (BAY11-7082), and STAT3 inhibitor (Stattic) significantly down-regulated O-PMs-induced ICAM-1 expression as well as the adhesion of U937 cells to epithelial cells."
        explanation: "The three-inhibitor result that makes the downstream ICAM-1 and adhesion endpoints dependent on the upstream AKT/STAT3/NF-kB activation."
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Moreover, the levels of O-PMs-induced ICAM-1 expression as well as the AKT and STAT3 phosphorylation were attenuated in the p65 siRNA-treated A549 cells (Fig. 4c)."
        explanation: "The genetic knockdown corroborating the pharmacological result for the same edge."

  - id: "KER:liu-oxidative-stress-to-airway-inflammation"
    name: "Increased oxidative stress leads to airway inflammation"
    description: "The paper's overall conclusion, and the edge its title names: PMs-induced ROS contribute to ICAM-1 expression through IL-6/AKT/STAT3/NF-kB. Supported in both directions of intervention and in both compartments - NAC lowered ROS, ICAM-1 and monocyte adhesion in A549 cells, and pre-administration of NAC attenuated PMs-induced ICAM-1 and IL-6 in mouse lung. Recorded as indirect because the authors place IL-6 and the kinase cascade between the two events rather than treating the link as immediate."
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    relationship_type: "indirectly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "These results suggest that PMs increase ICAM-1 expression in pulmonary epithelial cells in vitro and in vivo through the IL-6/AKT/STAT3/NF-κB signaling pathway."
        explanation: "The authors' own statement of this edge and of the intermediates that make it indirect."
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Pre-administration of NAC attenuated those PMs-induced adverse effects in WT mice."
        explanation: "The in vivo antioxidant arm supporting the same edge in intact lung rather than only in culture."

  - id: "KER:liu-airway-inflammation-to-systemic-inflammation"
    name: "Airway inflammation is accompanied by increased systemic inflammation"
    description: "The same intratracheal exposure that raised ICAM-1 and IL-6 in mouse lung tissue also raised plasma sICAM-1 and IL-6, and NAC lowered both compartments together; in the human arm, COPD patients had higher plasma sICAM-1, IL-6, WBC and CRP than healthy subjects. The airway and systemic compartments were measured in parallel and nothing tests which drives which, and the human arm is cross-sectional with eight subjects per group, so this is recorded as an association with weak support."
    upstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    downstream_event:
      id: "KE:ke-systemic-inflammation"
      name: "Increased systemic inflammation"
      biological_action: increased
      level_of_biological_organization: organism
    relationship_type: "associated with"
    evidence_support: weak
    evidence:
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In addition, the intratracheal instillation of PMs significantly increased the levels of the ICAM-1 and IL-6 in lung tissues and plasma in WT mice, but not in IL-6 knockout mice."
        explanation: "Reports the airway (lung tissue) and systemic (plasma) compartments rising together in the same animals, which is the parallel measurement behind this association."
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Furthermore, patients with chronic obstructive pulmonary disease (COPD) had higher plasma levels of ICAM-1 and IL-6 compared to healthy subjects."
        explanation: "The human cross-sectional observation of the systemic side of this association."
