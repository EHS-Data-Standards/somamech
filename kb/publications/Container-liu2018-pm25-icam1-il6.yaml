  - id: "GE:liu-human-copd-plasma"
    name: "Plasma sICAM-1, IL-6, WBC and CRP in COPD patients versus healthy subjects"
    description: "Plasma from 8 COPD patients with a smoking history and 8 never-smoking healthy subjects with normal pulmonary function, assayed for sICAM-1 and IL-6 by ELISA alongside white blood cell count and C-reactive protein. COPD patients had higher plasma levels of sICAM-1 and IL-6 than healthy subjects, consistent with the animal model, and plasma WBC and CRP also showed a highly statistically significant increase. Table 1 lists sICAM-1 and IL-6 for each of the 16 individuals, but the paper reports no group mean or spread for either marker and the group-level results appear only as Fig. 7a-d, so no numeric value is recorded here rather than deriving one from the individual rows."
    target_gene: "NCBIGene:3383"
    gene_expression_method: "ELISA, with clinical haematology for WBC and CRP"
    evidence:
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Furthermore, patients with chronic obstructive pulmonary disease (COPD) had higher plasma levels of ICAM-1 and IL-6 compared to healthy subjects."
        explanation: "States the group difference in plasma ICAM-1 and IL-6 that this assay records."
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
