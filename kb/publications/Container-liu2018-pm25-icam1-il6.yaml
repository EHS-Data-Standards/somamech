oxidative_stress_assays:
  - id: "OX:liu-a549-ros-opms-wpms"
    name: "Intracellular ROS in A549 cells exposed to O-PMs or W-PMs (DCFH-DA)"
    description: "DCFH-DA fluorescence in confluent A549 cells after 24 h exposure to 50 or 100 ug/ml of the organic-extractable (O-PMs) or water-soluble (W-PMs) fraction of SRM1649b, read by fluorescence microscopy and flow cytometry. Both fractions significantly increased ROS production over control, and O-PMs-induced ROS production was higher than that induced by W-PMs. Fluorescence is shown only as images and flow histograms in Fig. 1b, so no magnitude is recorded."
    ros_probe_type: "DCFH-DA"
    evidence:
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Cells treated with 50 or 100 μg/ml of PMs for 24 h significantly increased ROS production according to fluorescence microscopy and flow cytometry (Fig. 1b)."
        explanation: "States the exposure levels, duration and direction of change this assay records for both PM fractions."
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
