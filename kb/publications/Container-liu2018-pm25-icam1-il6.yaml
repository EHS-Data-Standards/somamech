  - id: "GE:liu-a549-icam1-opms-dose"
    name: "ICAM-1 protein in A549 cells across an O-PMs dose series (Western blot)"
    description: "A549 cells incubated with 0, 25, 50 or 100 ug/ml O-PMs for 24 h and ICAM-1 protein in cell lysates measured by Western blot with GAPDH as loading control. O-PMs significantly increased ICAM-1 expression in a dose-dependent manner, by 1.3 +/- 0.2 times the untreated control level at 25 ug/ml, 2.2 +/- 0.1 at 50 ug/ml and 2.7 +/- 0.2 at 100 ug/ml. These are the only group-level magnitudes stated numerically in the paper's running text and are recorded here as fold change relative to untreated control, with the spread type taken from the Statistical analysis section's declaration that all data are expressed as the mean +/- SEM. Significance was reported only as a threshold (p < 0.05 vs untreated cells), so no p_value is recorded. The result was consistent with the immunofluorescent images in Fig. 2c."
    target_gene: "NCBIGene:3383"
    gene_expression_method: "Western blot"
    normalization_reference: "GAPDH"
    evidence:
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "(by 1.3 ± 0.2 times compared to untreated control levels at 25 μg/ml, 2.2 ± 0.1 at 50 μg/ml, 2.7 ± 0.2 at 100 μg/ml)"
        explanation: "The source of every numeric value in this assay's output records: the per-dose ICAM-1 fold changes relative to untreated control."
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We observed a significant increase in ICAM-1 expression by O-PMs, but not W-PMs."
        explanation: "States the direction and the fraction specificity of the ICAM-1 induction this assay records."
      - reference: "PMID:29329563"
        reference_title: "PM(2.5)-induced oxidative stress increases intercellular adhesion molecule-1 expression in lung epithelial cells through the IL-6/AKT/STAT3/NF-κB-dependent pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "All data are expressed as the mean ± SEM."
