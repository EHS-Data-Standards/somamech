# =============================================================================
# LUNG FUNCTION ASSAY 3 — IHD PANEL (the negative control panel)
#
# 7 patients with ischemic heart disease and no pre-existing lung impairment,
# 170 spirometries. No pollutant was associated with lung function here. The
# authors treat this null result as evidence that the COPD and asthma findings
# are not chance products of multiple testing.
# =============================================================================

  - id: "LF:lagorio-ihd-spirometry"
    name: "Supervised spirometry in the ischemic heart disease panel with ambient pollutant exposure assessment"
    description: "Time-series panel spirometry in 7 patients with stable angina or previous myocardial infarction and no concomitant COPD, examined at home over the same two 1999 survey periods, yielding 170 spirometries. Group averages over the survey periods: FVC 81 +/- 9 % of predicted and FEV1 84 +/- 10 % of predicted. The average number of repeated observations was 24 per case (range 12 to 32). No association between respiratory function indices and average concentrations of any of the pollutants was observed in this panel, at any single lag or as cumulative exposure over 48 or 72 h, and no statistically significant negative association between metal concentrations and lung function was found either (data not shown in the paper). No numeric effect estimate from this panel reaches statistical significance, so no response comparison is recorded for it; the record is kept because the authors treat this null, in subjects with no pre-existing lung impairment, as a strength of the study - evidence that the COPD and asthma associations are not chance findings arising from the number of relationships examined."
    evidence:
      - reference: "PMID:16674831"
        reference_title: "Air pollution and lung function among susceptible adult subjects: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Participation in the IHD panel was restricted to subjects aged 40 to 64 years"
        explanation: "States the IHD panel's age eligibility criterion recorded in subject_characteristics."
      - reference: "PMID:16674831"
        reference_title: "Air pollution and lung function among susceptible adult subjects: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FVC (% predicted) Male 108 63 10 38 113 11 139 81 10 Female 63 61 9 70 116 12 31 80 4 Total 171 63 10 108 115 12 170 81 9"
        explanation: "Table 1's FVC block: the IHD columns of the Total row give 170 observations, mean 81, SD 9 (% of predicted)."
      - reference: "PMID:16674831"
        reference_title: "Air pollution and lung function among susceptible adult subjects: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FEV1 (% predicted) Male 108 45 10 38 94 13 139 84 10 Female 63 47 10 70 96 18 31 84 5 Total 171 45 10 108 95 16 170 84 10"
        explanation: "Table 1's FEV1 block: the IHD columns of the Total row give 170 observations, mean 84, SD 10 (% of predicted)."
      - reference: "PMID:16674831"
        reference_title: "Air pollution and lung function among susceptible adult subjects: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "(Table 4). No association between respiratory function indices and average concentrations of any of the pollutants (neither at various lags, nor as cumulative exposure over 48 or 72 h) was observed among IHD patients (Table 4)."
        explanation: "States this panel's null result, which is why no response comparison is recorded for it."
      - reference: "PMID:16674831"
        reference_title: "Air pollution and lung function among susceptible adult subjects: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "No association between average ambient concentrations of any air pollutant and lung function was observed among IHD cases."
        explanation: "The authors' summary of the same null result."
      - reference: "PMID:16674831"
        reference_title: "Air pollution and lung function among susceptible adult subjects: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "This study suggests that the short-term negative impact of exposure to air pollutants on respiratory volume and flow is limited to individuals with already impaired respiratory function."
        explanation: "The authors' conclusion, which rests on contrasting this panel's null with the COPD and asthma findings."
      - reference: "PMID:16674831"
        reference_title: "Air pollution and lung function among susceptible adult subjects: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The average number of repeated observations was 15 in the COPD panel (ranging from 1 to 32 per subject), 24 in the IHD panel (from 12 to 32 per case)"
        explanation: "States the 24 repeated observations per IHD case quoted in this assay's description."
