# =============================================================================
# LUNG FUNCTION ASSAY 2 — ASTHMA PANEL
#
# 11 young, mild intermittent asthmatics, 108 spirometries plus 107 exhaled
# nitric oxide measurements. NO2 was the only pollutant associated with lung
# function here; fine particles were not.
# =============================================================================

  - id: "LF:lagorio-asthma-spirometry"
    name: "Supervised spirometry and exhaled nitric oxide in the mild intermittent asthma panel with ambient pollutant exposure assessment"
    description: "Time-series panel spirometry in 11 never-smoking adults with mild intermittent asthma, examined at the Pneumology Clinic of the UCSC over the same two 1999 survey periods, yielding 108 spirometries. Group averages over the survey periods: FVC 115 +/- 12 % of predicted and FEV1 95 +/- 16 % of predicted - the best lung function of the three panels, as expected from the mild disease stage. The average number of repeated observations was 9 per person (range 6 to 18). Nitric oxide in exhaled breath, an indicator of bronchial inflammation, was measured in this panel only: 107 measurements, group average 50 +/- 34 ppb; overall there was no clear association of the various pollutants with this biological marker of inflammation. FEV1 fell with increasing NO2 at the 24 h lag and at the 48 h and 72 h cumulative exposures (recorded in response_comparisons); no association was found with PM2.5, coarse particles, PM10, CO or O3, and no statistically significant negative association between metal concentrations and lung function indices was observed in this panel (data not shown in the paper). The authors note that the absent O3 effect may reflect the good clinical condition of these asthmatics, the relatively low O3 levels, or lack of power, and that NO2 is difficult to credit as directly responsible given its low intrinsic toxicity - it may instead be a marker of the traffic combustion mixture, in particular of ultra fine particles."
    evidence:
      - reference: "PMID:16674831"
        reference_title: "Air pollution and lung function among susceptible adult subjects: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Admittance to the asthmatic panel was allowed to subjects aged 18 to 64 years, positive at the bronchial reactivity test by hypertonic saline solution, with disease in the mild intermittent stage"
        explanation: "States the asthma panel's eligibility criteria recorded in subject_characteristics."
      - reference: "PMID:16674831"
        reference_title: "Air pollution and lung function among susceptible adult subjects: a panel study."
        supports: SUPPORT
