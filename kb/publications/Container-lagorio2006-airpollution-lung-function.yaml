# =============================================================================
# RESPONSE COMPARISONS — the paper's reported GEE effect estimates (Table 4).
#
# MODELLING NOTE: these are GEE regression coefficients for panel data — the
# change in a lung function index (% of predicted) per 10 ug/m3 increase in a
# pollutant (per 1 mg/m3 for CO), at the 24 h lag or averaged over the
# previous 48 or 72 hours. There is no control group and no treated group, so
# control_output and treated_output are deliberately omitted: no pair of
# output records exists for a continuous-exposure coefficient to point at, and
# fabricating group records would invent data the paper does not contain.
# change_value carries the signed beta exactly as Table 4 prints it, with the
# printed SE as its variability and the printed p-value.
#
# Models controlled for repeated individual observations, temperature,
# relative humidity and day of the week (COPD and IHD panels) or beta-2
# stimulant inhalation (asthma panel), and all included the within-subject
# between-period (season) effect.
#
# ONLY the coefficients with p < 0.05 are recorded. Table 4's remaining cells
# (coarse particles, CO and O3 in every panel; all IHD cells; PM in the asthma
# panel) are non-significant and are described qualitatively on the assays.
# The metal effect estimates are NOT recorded at all: they appear only as dots
# and bars in Figures 2 and 3, and no figure-derived value may be extracted.
# =============================================================================

