# =============================================================================
# Lagorio et al. (2006) - Air pollution and lung function among susceptible
# adult subjects: a panel study
# =============================================================================
#
# Source: Environ Health. 2006;5:11
# DOI: 10.1186/1476-069X-5-11
# PMID: 16674831
#
# Study design (HUMAN OBSERVATIONAL — time-series panel study; not in vitro,
# not an animal experiment):
#   - Rome, Italy, 1999; two one-month surveys (24 May to 24 June, spring; and
#     18 November to 22 December, winter), 67 study days in total
#   - 29 outpatients of the Catholic University Hospital (UCSC) in three
#     diagnostic panels: COPD (n=11), mild intermittent asthma (n=11) and
#     ischemic heart disease (IHD, n=7), all living within 2 km of one of six
#     air monitoring stations
#   - Subjects were scheduled for supervised spirometry every three days (at
#     home for the COPD and IHD panels, at the Pneumology Clinic for the
#     asthmatics); 449 spirometries in all (COPD 171, asthma 108, IHD 170).
#     FVC and FEV1 are expressed as a percentage of subject-specific predicted
#     values
#   - Exhaled nitric oxide was measured in the asthmatic panel only
#     (107 measurements)
#   - Exposure: 24 h ambient PM2.5 and PM10-2.5 collected on dichotomous
#     samplers at two sites and analysed gravimetrically; eight metals in the
#     PM fractions by atomic absorption spectrometry; NO2, CO, O3 and SO2 from
#     the regional air-quality monitoring network
#
# IMPORTANT — WHAT THE EXPOSURE CONTRAST ACTUALLY IS:
#   This is a continuous-exposure panel study. There is NO unexposed control
#   group and no two-group contrast anywhere in the paper: every headline
#   number is a generalized estimating equations (GEE) regression coefficient
#   — the change in a lung function index (% of predicted) per 10 ug/m3
#   increase in a pollutant (per 1 mg/m3 for CO), at a 24 h lag or averaged
#   over the previous 48 or 72 h. Those reported-in-paper effect estimates are
#   recorded below as response_comparisons WITHOUT control_output /
#   treated_output references, because no pair of output records exists for
#   them to point at. Each panel contributes ONE output record: the group
#   average of the lung function indices over the survey periods (Table 1),
#   marked experimental_group: baseline and measured under the shared ambient
#   exposure condition.
#
#   The metal effect estimates (Zn, Fe, Ni on FVC and FEV1, per interquartile
#   range increase) are presented ONLY as dots and bars in Figures 2 and 3 —
#   the paper prints no numeric coefficients for them. Per the extraction
#   rules, no figure-derived values are recorded; the metal findings appear as
#   qualitative statements in descriptions, backed by quotes.
#
# Key findings recorded here:
#   - COPD panel: FVC fell with ambient PM2.5 (-0.80 %predicted per 10 ug/m3
#     at 24 h, p=0.027; -0.89 at 48 h, p=0.031; -1.10 at 72 h, p=0.044) and
#     with PM10 (-0.66, -0.75, -0.94; p=0.027/0.032/0.045)
#   - COPD panel: FEV1 fell with PM2.5 and PM10 only at the 72 h cumulative
#     lag (-1.06, p=0.032; -0.87, p=0.040) and with NO2 at 24 h and 48 h
#     (-1.16, p=0.005; -1.38, p=0.005)
#   - Asthma panel: FEV1 fell with NO2 at all three lags (-1.10, p=0.002;
#     -1.28, p=0.001; -1.17, p=0.007); no effect of fine particles
#   - IHD panel: no association between any pollutant and lung function
#   - Zn (and, less consistently, Fe and Ni) from the PM2.5 fraction were
#     associated with FVC and FEV1 decrements in the COPD panel (figures only)
#   - Exhaled NO in the asthmatics showed no clear association with any
#     pollutant
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:16674831"
  reference_title: "Air pollution and lung function among susceptible adult subjects: a panel study."
  doi: "10.1186/1476-069X-5-11"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:lagorio-spirometry-001"
    name: "Supervised spirometry for FVC and FEV1, expressed as percentage of predicted"
    description: "Forced vital capacity (FVC) and forced expiratory volume in 1 second (FEV1) were measured by spirometry. Spirometries were supervised and done with the subject in a sitting position and wearing a nose-clip, following the suggestions of the American Thoracic Society (Standardization of Spirometry, 1994 update). Spirometries were always done in the afternoon (between 4 pm and 8 pm), at least 6 hours after a possible inhalation of short-acting bronchodilators. A heated Fleish tube n. 3 portable spirometer (Biomedin, Italy) was used in the COPD and IHD panels, and a light bell Stead-Wells spirometer (Biomedin, Italy) in the asthmatic group. Between-instrument reproducibility, for both FVC and FEV1, was within 30 ml, and calibration procedures were regularly performed. Pulmonary function indices used in the analyses are expressed as the percentage of the predicted values based on the subject-specific sex, age, height and weight (Quanjer et al. 1993). Subjects were scheduled to be examined three days apart, at home for the COPD and IHD panels or at the Pneumology Clinic of the UCSC for the asthmatic panel. No bronchodilator was administered as part of the testing protocol."
    spirometry_standard: "American Thoracic Society, Standardization of Spirometry, 1994 Update (Am J Respir Crit Care Med 1995;152:1107-1136)"
    equipment_required:
      - "Heated Fleish tube n. 3 portable spirometer (Biomedin, Italy) — COPD and IHD panels"
      - "Light bell Stead-Wells spirometer (Biomedin, Italy) — asthmatic panel"

  - id: "PROTOCOL:lagorio-exhaled-no-001"
    name: "Measurement of nitric oxide in exhaled breath (asthmatic panel only)"
    description: "Only amongst asthmatics, concentrations of nitric oxide (NO) in exhaled breath — an indicator of bronchial inflammation — were determined using the analyzer model 280 (Sievers Instruments, USA). Subjects were breathing NOx free air prior to this test. Asthmatics were also asked to fill in a brief daily questionnaire collecting information about the occurrence of asthma attacks and beta-2 agonist inhalations."
    equipment_required:
      - "Nitric oxide analyzer model 280 (Sievers Instruments, USA)"

  - id: "PROTOCOL:lagorio-pm-sampling-001"
    name: "24 h dichotomous sampling of ambient PM2.5 and PM10-2.5 at two Rome sites"
    description: "Because PM2.5 was not routinely measured by the Rome air-quality monitoring network, 24 h concentrations of PM10-2.5 and PM2.5 were measured for this survey at two fixed monitoring sites, Villa Ada and Istituto Superiore di Sanita (ISS), about 3.5 km apart and considered representative of low and high traffic areas respectively. Air samples were collected by means of dichotomous samplers (Graseby Andersen, model SA 241) operating at 16.7 L/min with an omni-directional aerosol inlet; this sampler has been designated as reference for PM10 by US EPA. Sampling was carried out from 3 pm to 3 pm of the following day, in order to match the spirometry time schedule. Sixty-two 24 hour samples were collected, with 5 missing observations at the beginning of the winter survey. The dust on the couple of sequential polytetrafluoroethylene (PTFE) filters (polymethylpentane ringed, 2.0 um pore size, 37 mm diameter; Gelman, USA) was gravimetrically analyzed to obtain average daily concentrations of PM2.5 and PM10-2.5. PM10 concentrations were calculated by adding the concentrations of the sampled fine and coarse fractions. The averages of PM concentrations measured at the two locations were used in the statistical analyses."
    equipment_required:
      - "Dichotomous sampler (Graseby Andersen, model SA 241), 16.7 L/min, omni-directional aerosol inlet"
      - "Sequential PTFE filters (polymethylpentane ringed, 2.0 um pore size, 37 mm diameter; Gelman, USA)"

  - id: "PROTOCOL:lagorio-metals-aas-001"
    name: "Atomic absorption spectrometry of eight metals in the PM fractions"
    description: "In the PM10-2.5 and PM2.5 samples, the content of selected metals (cadmium, chromium, iron, nickel, lead, platinum, vanadium and zinc) was determined by atomic absorption spectrometry (AAS). The concentrations used in the analysis were calculated as the ratio of the metal amount in each PM sample to the air volume collected during the sampling. Six of the eight metals examined were more represented in the fine than in the coarse fraction of outdoor PM, so only metal concentrations from the PM2.5 fraction are reported."
    equipment_required:
      - "Atomic absorption spectrometer"

  - id: "PROTOCOL:lagorio-gaseous-monitoring-001"
    name: "Regional network monitoring of NO2, CO, O3 and SO2, and daily city means"
    description: "The Department of Environment of the Latium Region provided hourly concentrations of nitrogen dioxide (NO2), carbon monoxide (CO), ozone (O3) and sulphur dioxide (SO2) recorded at the fixed sites for air-quality monitoring in Rome, which are equipped with continuous inlet samplers. NO2 is determined by chemiluminescence, CO by IR absorption, O3 by UV absorption, and SO2 by UV fluorescence. Daily city means were computed as 24 h values from 3 pm to 3 pm of the following day, based on data from varying type and number of sites: five fixed sites for NO2 and CO (Magna Grecia, Fermi, Libia in densely populated central areas; Preneste and Villa Ada as background), two background sites for O3 (Preneste and Villa Ada), and one urban plus one background site for SO2 (Fermi and Villa Ada). Mean daily temperature, barometric pressure and relative humidity came from the Rome weather station (Collegio Romano). SO2 was not considered further in the analyses because its 24 h concentrations were low and showed little variability in both seasons; barometric pressure was excluded from the regression models because of its negligible daily variability."
    equipment_required:
      - "Regional air-quality monitoring network, Rome (continuous inlet samplers)"
      - "Rome weather station, Collegio Romano - Ufficio Centrale di Ecologia Agricola"

  - id: "PROTOCOL:lagorio-gee-analysis-001"
    name: "Generalized estimating equations (GEE) for panel data with 24, 48 and 72 h exposure windows"
    description: "The relationships between respiratory function indices and concentrations of air pollutants were analyzed using generalized estimating equations (GEE) for panel data, with an autoregressive correlation matrix of lag 1 to account for correlations between repeated measures on the same subject. STATA release 8.0 (XTGEE, with the 'force' option to allow unequally spaced observations) was used. All linear models included the within-subject between-period effect, using the dichotomous season variable (spring and winter). For the COPD and IHD panels, terms for daily mean temperature, relative humidity and day of the week (weekday/weekend) were included; for the asthmatic panel, temperature and humidity were included along with beta-2 agonist use (yes/no), but not weekday/weekend, because only 8 of 108 spirometries were done on Saturday and none on Sunday. A temperature-squared term gave no model improvement and was dropped. The daily variability of pulmonary function was examined with respect to the mean pollutant concentrations of the previous 24 hours and to the cumulative exposures over the previous 48 and 72 hours. Results are reported as changes in percentage of predicted values per 10 ug/m3 increase in pollutant concentrations (per 1 mg/m3 for CO), and, for metals, per interquartile range of increasing concentrations. Missing observations in exposure or outcome variables were not replaced with estimates."

# =============================================================================
# LUNG FUNCTION ASSAY 1 — COPD PANEL
#
# 11 COPD outpatients, 171 spirometries. This is the panel in which the
# paper's positive findings sit: FVC and FEV1 decrements with ambient PM2.5,
# PM10 and NO2, and (figures only) with Zn, Fe and Ni from the PM2.5 fraction.
# The full ambient exposure characterization (PM fractions, eight metals, and
# the gaseous pollutants) is attached here.
# =============================================================================

lung_function_assays:
  - id: "LF:lagorio-copd-spirometry"
    name: "Supervised spirometry in the COPD panel with 24 h ambient PM, metal and gaseous pollutant exposure assessment"
    description: "Time-series panel spirometry in 11 COPD outpatients in Rome over two one-month surveys in 1999 (spring and winter), yielding 171 spirometries. Group averages over the survey periods: FVC 63 +/- 10 % of predicted and FEV1 45 +/- 10 % of predicted (the lowest of the three panels, as expected from the eligibility criterion of FEV1/FVC below 60%). The average number of repeated observations was 15 per subject (range 1 to 32). Associations with ambient pollutants are recorded in response_comparisons: FVC fell significantly with PM2.5 and PM10 at the 24 h lag and at the 48 h and 72 h cumulative exposures, while FEV1 fell with PM2.5 and PM10 only once 72 hours of exposure had accumulated, and with NO2 at the 24 h and 48 h windows. No association was seen for coarse particles (PM10-2.5), CO or O3 at any lag. Zinc concentrations in the PM2.5 fraction were associated with FVC and FEV1 decrements at the 24 h lag and at the 48 h and 72 h cumulative lags, with similar but less consistent associations for iron and nickel; those metal coefficients are presented only as regression coefficients and 95% confidence intervals plotted in Figures 2 and 3, so no numeric metal effect estimate is recorded here."
