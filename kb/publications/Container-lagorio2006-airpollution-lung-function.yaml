# =============================================================================
# KEY EVENT RELATIONSHIP
#
# The paper does not measure oxidative stress: it proposes it as the mechanism
# linking the transition metals in fine PM to the observed lung function
# decrements, citing the metals' water solubility and its established link to
# oxidative damage. The relationship is therefore recorded with weak evidence
# support — hypothesised by the authors and supported by cited prior work,
# not demonstrated by any measurement in this study.
# =============================================================================

key_event_relationships:
  - id: "KER:lagorio-oxidative-stress-to-decreased-lung-function"
    name: "Oxidative stress induced by transition metals in fine particulate matter leads to decreased lung function"
    description: "The authors attribute the fine-PM and metal associations with FVC and FEV1 decrements in COPD patients to oxidative stress: the ability of particulate matter to induce oxidative stress in the airways is cited as an important biological mechanism, zinc and iron are given a potential role via oxidative stress, and the two metals' high water solubility is noted as having been directly related to oxidative damage. No oxidative stress marker was measured in this study, so the link is hypothesised rather than demonstrated here."
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    relationship_type: "indirectly leads to"
    evidence_support: weak
