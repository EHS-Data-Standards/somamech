key_event_relationships:
  - id: "KER:harding-ahr-to-egfr"
    name: "AhR pathway activation leads to EGFR activation via c-src"
    description: "The paper's central proposed mechanism: ligand activation of Ahr releases the non-receptor tyrosine kinase c-src into the cytoplasm, which translocates to the cell membrane and activates Egfr, whose downstream target is Erk1/2. The paper's own scRNA-seq contribution is the observation that Egfr is upregulated in the epithelial Ahr pathway map; the c-src step is cited to prior literature, which is why evidence_support is moderate rather than strong."
    upstream_event:
      id: "KE:mie-ahr-activation"
      name: "AhR pathway activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    relationship_type: "directly leads to"
    evidence_support: moderate
    quantitative_understanding: low
    evidence:
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Ahr activation is known to induce c-src-dependent stimulation of Egfr  and its downstream target Erk 1/2"
        explanation: "States the AhR-to-EGFR link this relationship records, and names c-src as the intermediate."
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "tyrosine kinase c-src in the cytoplasm. C-src kinase translocates to the cell membrane where it activates Egfr"
        explanation: "Spells out the mechanistic step by which AhR ligand activation reaches EGFR."
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Epithelial cells further showed, Ahr activation is brought on by Ahr/ARNT nuclear translocation and activation of tyrosine kinase c-src, Egfr, and subsequently Erk1/2 pathways."
        explanation: "The authors' abstract-level statement of the same AhR to c-src to EGFR to Erk1/2 sequence, drawn from their own epithelial data."

  - id: "KER:harding-egfr-to-airway-inflammation"
    name: "EGFR activation indirectly leads to airway inflammation via Erk1/2, cox-2 and eTh17 differentiation"
    description: "Egfr activation is described as leading to Erk1/2 activation and transcription of cox-2, which the paper states is essential to pathogenic eTh17 differentiation; eTh17 cells in turn drive the neutrophilic inflammation this paper is about. The chain has several steps the paper did not measure directly, so relationship_type is indirect and quantitative understanding is low."
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    relationship_type: "indirectly leads to"
    evidence_support: weak
    quantitative_understanding: low
    evidence:
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Egfr activation further leads to Erk1/2 pathway activation promoting the transcription of cox-2 which has been shown to be essential in eTh17 differentiation"
        explanation: "States the EGFR to Erk1/2 to cox-2 to eTh17 chain that connects EGFR activation to the inflammatory phenotype."
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Neutrophilic infiltration is dependent on Il-17 signaling through Il-17 induced proinflammatory cytokines and chemokines in lung structural cells promoting neutrophilic infiltration"
        explanation: "Supplies the last step of the chain: the Il-17 programme downstream of eTh17 differentiation is what recruits neutrophils into the airway."

  - id: "KER:harding-ahr-to-airway-inflammation"
    name: "AhR pathway activation indirectly leads to airway inflammation through eTh17 differentiation"
    description: "The paper's overall conclusion: PM-induced epithelial transcriptomic changes activate Ahr, which through epithelial, dendritic and T-cell cytokine programmes promotes pathogenic eTh17 differentiation and neutrophilic asthma. Recorded as indirect because the intervening cell-to-cell steps are inferred from pathway enrichment at a single 4-h timepoint rather than measured as a causal series."
    upstream_event:
      id: "KE:mie-ahr-activation"
      name: "AhR pathway activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    relationship_type: "indirectly leads to"
    evidence_support: moderate
    quantitative_understanding: low
    evidence:
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In this paper, we present data suggesting that PM induced epithelial transcriptomic changes are responsible for the activation of Ahr through Ahr/Arnt activation/nuclear translocation and an increase in Egfr  expression, ultimately resulting in neutrophilic asthma"
        explanation: "States the relationship directly: Ahr activation in the epithelium ultimately results in neutrophilic asthma."
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Collectively, our data corroborates that PM initiates an eTh17 specific inflammatory response causing neutrophilic asthma through pathways in epithelial, dendritic, and T cells that promote eTh17 differentiation during initial PM exposure."
        explanation: "The paper's conclusion, naming the intervening epithelial, dendritic and T-cell pathways that make this relationship indirect."
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, our previous data found that PM is capable of inducing T helper cell 17 (Th17) immune responses via aryl hydrocarbon receptor (Ahr) activation, which was associated with neutrophilic invasion characteristic of steroid insensitive asthma."
        explanation: "The prior finding this paper sets out to explain mechanistically, linking Ahr activation to Th17 responses and neutrophilic invasion."
