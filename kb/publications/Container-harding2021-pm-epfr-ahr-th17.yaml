  # Arm 2 - Drop-seq single-cell RNA sequencing of dissociated whole lung
  # ===========================================================================

  # --- Whole-lung differential expression and KEGG enrichment ---
  - id: "GE:harding-scrnaseq-lung-deg-4h"
    name: "Whole-lung differential gene expression and KEGG pathway enrichment after 4-h PM exposure (scRNA-seq)"
    description: "Drop-seq single-cell RNA sequencing of all dissociated lung cells from PM-exposed versus vehicle-exposed mice. More than 6000 vehicle cells and more than 5000 PM cells were retained after quality control (15,813 genes x 6118 cells and 15,851 genes x 5337 cells respectively). Over 18,000 distinct genes were detected overall and 210 were differentially expressed at FDR < 0.05. KEGG analysis of those DEGs showed upregulated IL17 signalling, viral protein interaction with cytokine and cytokine receptors, chemokine signalling, Tnf signalling, toll-like receptor signalling and P53 signalling; downregulated pathways included antigen processing and presentation, salmonella infection, phagosome, oxidative phosphorylation and Staphylococcus aureus infection. No target_gene is named because this assay covers the whole transcriptome. Enrichment is reported as combined scores in Fig. 1c, so no measurement value is recorded."
    gene_expression_method: "Drop-seq single-cell RNA sequencing with Seurat differential expression and KEGG pathway enrichment"
    normalization_reference: "sctransform normalization; Wilcoxon rank-sum test with FDR < 0.05"
    evidence:
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "we retained more than 6000 cells from our vehicle exposed and more than 5000 cells from our PM exposed groups"
        explanation: "Gives the per-group cell counts behind this assay's two output records."
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Comparing all RNA in PM-exposed to vehicle-exposed cells, over 18,000 distinct genes were detected overall"
        explanation: "States the comparison this assay makes and the number of genes detected across it."
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "B Volcano plot showing fold change of 210 differentially expressed genes (DEG) over vehicle-exposed that were FDR < 0.05."
        explanation: "Gives the count of differentially expressed genes and the significance threshold recorded in this assay's description."
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "C KEGG pathway analysis illustrating an increase in Il17 signaling, Tnf signaling, toll-like receptor signaling, and P 53 signaling"
        explanation: "Names the upregulated inflammatory signalling pathways that make this assay inform on airway inflammation."
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
