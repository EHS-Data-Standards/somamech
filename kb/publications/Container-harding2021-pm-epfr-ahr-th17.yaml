# =============================================================================
# Harding et al. (2021) - Association between particulate matter containing
# EPFRs and neutrophilic asthma through AhR and Th17
# =============================================================================
#
# Source: Respir Res. 2021;22:275
# DOI: 10.1186/s12931-021-01867-w
#
# The committed reference cache entry for this PMID is full text
# (content_type: full_text_pdf), so every evidence snippet below is quoted
# from text CI can resolve. No verification receipt is needed.
#
# Study design (all in vivo, single 4-h timepoint):
#   - Male and female C57BL/6J mice, 8-10 weeks. A single oropharyngeal
#     aspiration of 50 ul of either vehicle (sterile saline + 0.02%
#     tween-80) or 50 ul of MCP230, a laboratory-generated combustion-derived
#     particulate matter carrying environmentally persistent free radicals
#     (EPFRs), mean aerodynamic diameter < 0.2 um, suspended at 1 mg/ml.
#     The paper states this is equivalent to an inhalation exposure of
#     200 ug/m3. Lungs were taken 4 h later.
#   - Arm 1: RT2 Mouse Drug Metabolism profiler PCR array on whole-lung RNA,
#     84 genes, n = 5 per group (Methods: n = 10 mice in total).
#   - Arm 2: Drop-seq single-cell RNA sequencing of dissociated whole lung,
#     6118 vehicle cells and 5337 PM cells after QC, clustered into 20
#     populations and annotated with SingleR against ImmGen, then pathway
#     enrichment (Enrichr / KEGG / Ahr wikipathway) per population.
#
# Key findings:
#   - 12 of 84 array genes significantly increased after PM; Cyp1a1 by far
#     the largest (log2 fold change 4.91). DAVID pathway analysis of the
#     array pointed to oxidative stress and an antioxidant response.
#   - scRNA-seq: 210 differentially expressed genes across the lung,
#     upregulated Il17, Tnf, toll-like receptor and P53 signalling.
#   - Epithelial cells upregulated the Ahr wikipathway (including Egfr) and
#     Il-17, Egfr and T-cell receptor signalling; dendritic cells upregulated
#     Th17 differentiation, Il-17, Tnf and NF-kB signalling; all three T-cell
#     clusters upregulated Th17 differentiation.
#   - Ahr expression itself did not change, so the authors attribute Ahr
#     activation to Ahr/Arnt nuclear translocation and c-src/Egfr/Erk1/2
#     signalling rather than to increased Ahr transcription.
#   - Il-10 was not expressed in any lung cell, i.e. no regulatory Th17
#     (rTh17) differentiation - the response is pathogenic eTh17.
#
# NUMERIC VALUES. Table 1 is the only source of per-group numbers in this
# paper, and it reports LOG2 FOLD CHANGES with p-values, not absolute
# expression levels. So:
#   - No output record carries an mrna_level: there is no absolute value for
#     either group to record, and estimating one from a figure is not allowed.
#   - Each array gene's log2 fold change is recorded in response_comparisons.
#     ChangeTypeEnum has no log2 member, so those entries use
#     change_type: fold_change with a unit that names the log2 scale
#     explicitly, and each one says in its description that the value must not
#     be read as a linear fold change. Converting to a linear fold change
#     would be a computed value, which extraction does not produce.
#   - The scRNA-seq arm reports pathway enrichment and per-cell-type
#     expression as figures and combined scores only. Those assays therefore
#     record direction and significance threshold in their descriptions and
#     carry no measurement values.
#
# ONE ASSAY PER GENE. GeneExpressionAssay.target_gene is single-valued, so a
# single merged assay for the array could name only one of its twelve genes
# and would silently drop the other eleven. Each gene therefore gets its own
# assay id; all twelve share the one protocol id, because the array is one
# protocol run.
#
# KEY EVENT ASSIGNMENT for the array genes: the two cytochrome P450
# xenobiotic response elements (Cyp1a1, Cyp4b1) are assigned to
# KE:mie-ahr-activation, since the paper uses Cyp1a1 induction as its readout
# of Ahr activation. The ten detoxification and antioxidant genes are
# assigned to KE:mie-oxidative-stress, following the paper's own DAVID
# conclusion that the array indicates increased oxidative stress and an
# antioxidant response. Every Key Event block is copied verbatim from
# origin/main.
#
# PER-SPECIMEN SUBJECTS. The scRNA-seq populations are gated out of one
# dissociated lung suspension, so each analysed population gets its own
# InVivoSubject id rather than reusing one id (cf. issue #132, where id reuse
# lost specimen detail in the workbook export). InVivoSubject has no
# cell_type slot, so the CL identity of each population is stated in the
# subject and assay names instead of being grounded in an ontology term.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:34702270"
  reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
  doi: "10.1186/s12931-021-01867-w"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:harding-pm-oa-001"
    protocol_type: MolecularAssayProtocol
    name: "Oropharyngeal aspiration exposure to MCP230 EPFR-containing particulate matter"
    description: "MCP230, a laboratory-generated particulate matter containing environmentally persistent free radicals with a mean aerodynamic diameter < 0.2 um, created and characterized by Dr. Lomnicki at Louisiana State University. Particles suspended at 1 mg/ml in sterile saline with 0.02% tween-80 and sonicated for 2 min at 30-s intervals on ice with a probe sonicator at 50% amplitude. Mice received 50 ul of vehicle or 50 ul of the PM suspension by oropharyngeal aspiration and were held for 4 h. The paper states that 50 ul oropharyngeal aspiration corresponds to an inhalation exposure equivalent of 200 ug/m3. Protocol typed as MolecularAssayProtocol because the schema offers no exposure-protocol subclass."
    detection_method: "not applicable - exposure protocol"
    equipment_required:
      - "Probe sonicator"
      - "MCP230 EPFR-containing particulate matter"
    institution: "Louisiana State University"
    quality_control_criteria: "All animal protocols written according to Policy for the Care and Use of Laboratory Animals and approved by the LSU Institutional Animal Care and Use Committee"

  - id: "PROTOCOL:harding-rt2-array-001"
    protocol_type: MolecularAssayProtocol
    name: "RT2 Profiler PCR array for mouse drug metabolism"
    description: "Lungs retrograde-perfused with 2 ml Hank's Balanced Salt solution to remove red blood cells, then total RNA isolated and purified per the manufacturer's protocol. The RT2 PCR kit for mouse drug metabolism (Catalog No. 330231) was used to analyse 84 genes related to the metabolism of PM particles. Data analysed with the RT2 Profiler PCR Data Analysis tools on Qiagen's website, using a CT cutoff of 35 and the full panel geometric mean normalization method. Significance by Student's t-test at p < 0.05."
    detection_method: "RT2 Profiler quantitative PCR array (84-gene mouse drug metabolism panel)"
    normalization_method: "full panel geometric mean normalization, CT cutoff 35"
    platform: "Qiagen RT2 Profiler PCR Array, Catalog No. 330231"
    # replicate_requirements is an integer slot: 5 mice per exposure group.
    # Table 1 reports n = 5 per group; the Methods state n = 10 mice in total.
    replicate_requirements: 5

  - id: "PROTOCOL:harding-dropseq-001"
    protocol_type: MolecularAssayProtocol
    name: "Single-cell dissociation of mouse lung and Drop-seq barcoding"
    description: "Lungs retrograde-perfused with 2 ml Hank's Balanced Salt solution, then dissociated with a gentleMACS Dissociator in 2 ml pre-warmed digest buffer (2 mg/ml Type 2 Collagenase, 1 mg/ml ProNase E, 62.5 U/ml DNAse 1, 5 mM CaCl2 in DPBS) per 100 mg tissue, further dissociated by pipetting and on a ThermoMixer at 1200 RPM for 5 min at 37 C, passed through a 23-gauge needle and twice through a 40-uM filter, then centrifuged and resuspended in 1% FBS/PBS. Single cells were barcoded with the Drop-seq protocol Version 3.1 at 100 cells/ul and droplets sequenced on an Illumina Nextseq500."
    detection_method: "Drop-seq single-cell RNA sequencing on Illumina Nextseq500"
    platform: "Drop-seq protocol Version 3.1; Illumina Nextseq500"
    equipment_required:
      - "gentleMACS Dissociator (Miltenyi Biotec)"
      - "ThermoMixer (Eppendorf)"
      - "Illumina Nextseq500"
    protocol_version: "Drop-seq protocol Version 3.1"
    protocol_author: "Steven Potter (Cincinnati Children's Hospital)"

  - id: "PROTOCOL:harding-scrnaseq-bioinf-001"
    protocol_type: MolecularAssayProtocol
    name: "Drop-seq alignment, Seurat clustering and pathway enrichment pipeline"
    description: "Drop-seq tools-2.3.0 used to tag cell and molecular barcodes, trim primer and polyA sequences and align with STAR to the M24 (GRCm38.p6) mouse genome. Cells with fewer than 300 detected genes or more than 10% mitochondrial transcript counts were removed, as were genes detected in fewer than 3 cells, leaving 15,813 genes x 6118 cells (vehicle) and 15,851 genes x 5337 cells (PM). Data processed with sctransform normalization and the standard Seurat (3.1.2) integration protocol, clustered with Seurat's UMAP on principal components selected by a JackStraw plot, and cell types assigned with SingleR against the ImmGen mouse database. Differentially expressed genes identified with Seurat's FindMarkers (Wilcoxon rank-sum test, FDR < 0.05); pathway and gene-set enrichment via R clusterProfiler, Enrichr and KEGG with Benjamini-Hochberg correction."
    detection_method: "Seurat UMAP clustering with SingleR/ImmGen annotation and Enrichr/KEGG pathway enrichment"
    normalization_method: "sctransform normalization; Benjamini-Hochberg FDR correction"
    platform: "Drop-seq tools-2.3.0, STAR, Seurat 3.1.2, SingleR, clusterProfiler, Enrichr"
    quality_control_criteria: "Cells with < 300 detected genes or > 10% mitochondrial transcript counts removed; genes detected in < 3 cells removed; significance at FDR < 0.05"

# =============================================================================
# GENE EXPRESSION ASSAYS
#
# Arm 1 - RT2 Profiler PCR array on whole-lung RNA (one assay per gene)
# Arm 2 - Drop-seq single-cell RNA sequencing of dissociated whole lung
# =============================================================================

gene_expression_assays:
  # --- Cyp1a1 ---
  - id: "GE:harding-cyp1a1-rt2-4h"
    name: "Cyp1a1 mRNA in whole lung after 4-h PM exposure (RT2 Profiler array)"
    description: "Cytochrome P450, family 1, subfamily a, polypeptide 1 (Cyp1a1) was one of the 12 genes significantly increased in the lungs of PM-exposed mice relative to vehicle-exposed mice on the RT2 Mouse Drug Metabolism profiler PCR array, 4 h after oropharyngeal exposure. Table 1 reports the change as a log2 fold change with a p-value and gives no absolute expression level for either group, so no mrna_level is recorded on the output records; the log2 fold change is carried in response_comparisons as COMP:harding-cyp1a1-log2fc. Assigned to AhR pathway activation: this is a cytochrome P450 xenobiotic response element, and the paper treats Cyp1a1 induction as the readout of Ahr activation."
    target_gene: "NCBIGene:13076"
    gene_expression_method: "RT2 Profiler PCR array (mouse drug metabolism, Catalog No. 330231)"
    normalization_reference: "full panel geometric mean, CT cutoff 35"
    evidence:
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Cyp1a1 Cytochrome P450, family 1, subfamily a, polypeptide 1 4.91 0.010"
        explanation: "The Table 1 row for Cyp1a1, giving the gene name, its log2 fold change of 4.91 and its p-value of 0.010 in PM-exposed versus vehicle-exposed lung."
      - reference: "PMID:34702270"
        reference_title: "Association between particulate matter containing EPFRs and neutrophilic asthma through AhR and Th17."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The RT2 Profiler array shows significant (p < 0.05) gene regulation of Ahr cytokines in PM compared to vehicle exposed (n = 5) mice after 4-h post exposure (n = 5)"
        explanation: "Table 1's caption establishes the comparison, the significance threshold and the group sizes behind this assay's output records."
    has_exposure_condition:
      - id: "EXPOSURE:harding-vehicle-oa-4h"
        name: "Vehicle control: 50 ul sterile saline with 0.02% tween-80 by oropharyngeal aspiration, 4 h"
        exposure_duration:
          value: "4"
          unit:
            id: "UO:0000032"
            name: "hour"
      - id: "EXPOSURE:harding-pm-mcp230-oa-4h"
        name: "MCP230 EPFR-containing combustion-derived particulate matter, mean aerodynamic diameter < 0.2 um, 50 ul of a 1 mg/ml suspension by oropharyngeal aspiration for 4 h (stated inhalation-exposure equivalent 200 ug/m3)"
        exposure_agent:
          id: "ENVO:01000416"
          name: "ultrafine respirable suspended particulate matter"
        exposure_concentration:
          value: "1"
          unit:
            id: "UO:0000176"
            name: "milligram per milliliter"
        exposure_duration:
          value: "4"
          unit:
            id: "UO:0000032"
            name: "hour"
    has_specified_output:
      - id: "GE:harding-cyp1a1-rt2-4h-output-vehicle"
        name: "Vehicle-exposed mouse lung - Cyp1a1 mRNA"
        description: "Reference group for the array. Table 1 reports only the log2 fold change of PM versus vehicle, so no absolute value is recorded."
        experimental_group: vehicle_control
        measured_under: "EXPOSURE:harding-vehicle-oa-4h"
      - id: "GE:harding-cyp1a1-rt2-4h-output-pm"
        name: "PM-exposed mouse lung - Cyp1a1 mRNA"
        description: "Significantly increased relative to vehicle (log2 fold change 4.91, p = 0.010). Table 1 reports no absolute value, so none is recorded."
        experimental_group: treated
        measured_under: "EXPOSURE:harding-pm-mcp230-oa-4h"
    assay_date: "2021-01-01"
    informs_on_key_event:
      id: "KE:mie-ahr-activation"
      name: "AhR pathway activation"
      biological_action: activated
      level_of_biological_organization: molecular
    study_subject:
      subject_type: InVivoSubject
      id: "SUBJECT:harding-mouse-lung-rt2"
      name: "C57BL/6J mouse, retrograde-perfused whole lung, total RNA for the RT2 Profiler array"
      model_species:
