# =============================================================================
# Chandel & Naura (2024) - Dynamics of Inflammatory and Pathological Changes
# Induced by Single Exposure of Particulate Matter (PM2.5) in Mice
# =============================================================================
#
# Source: Cell Biochem Biophys. 2024;82:3463-3475
# DOI: 10.1007/s12013-024-01433-3
#
# Study design (in vivo only):
#   - Male BALB/c mice, 4-6 weeks old, 25-30 g, n = 3-6 per group
#   - Single intratracheal (i.t.) instillation of PM2.5 (NIST SRM 1648a urban
#     particulate matter) in 50 ul PBS + 0.05% Tween 80 under isoflurane
#   - Dose-response: 50, 100 or 200 ug; time course with the 100 ug dose
#   - Euthanasia at 2, 4, 7, 14, 21 days (BALF/lung) and 28 days (histology)
#
# Key findings recorded here:
#   - BALF inflammatory cells rise at 4 days (100/200 ug), peak at day 7,
#     persist to day 14, and resolve by day 21
#   - Pro-inflammatory cytokines in BALF peak at day 7 (IL-6, G-CSF, MCP-1)
#     or day 14 (KC, TNF-alpha, IL-1beta)
#   - Continuous oxidative stress in lung tissue (raised LPO/MDA; reduced
#     GSH, GSH:GSSG, SOD and catalase)
#   - Enhanced mitochondrial ROS in BALF CD11b+ inflammatory cells at day 7
#   - Progressive decline in lung function to 28 days, with emphysematous
#     lesions on histology at 28 days
#
# Evidence note: only the abstract of this paper is publicly cached
# (references_cache/PMID_39031246.md is content_type: abstract_only), so every
# committed snippet is quoted from that abstract. The quantitative values were
# read from the full text of the publisher PDF (Results, Figs. 1-8) and the
# figure and statistics are named in each assay description.
# =============================================================================

source_publication:
  reference: "PMID:39031246"
  reference_title: "Dynamics of Inflammatory and Pathological Changes Induced by Single Exposure of Particulate Matter (PM(2.5)) in Mice: Potential Implications in COPD."
  doi: "10.1007/s12013-024-01433-3"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:chandel-balf-001"
    name: "BALF collection and inflammatory cell differential"
    description: "BALF procured from euthanized mice; total inflammatory cells counted with a hemocytometer. For differential analysis, cytoslides were prepared on a cytospin centrifuge and stained with hematoxylin and eosin (H&E); images captured on a Nikon Eclipse Y-TV 55 microscope and analysed with NIS-Elements software."
    equipment_required:
      - "Hemocytometer"
      - "Cytospin centrifuge"
      - "Nikon Eclipse Y-TV 55 microscope with camera"
      - "NIS-Elements software"

  - id: "PROTOCOL:chandel-bioplex-001"
    name: "Bioplex multiplex cytokine immunoassay on BALF supernatant"
    description: "TNF-alpha, IL-1beta, IL-6, KC, G-CSF, MCP-1, IL-4 and IL-5 measured in 50 ul BALF supernatant with a Bioplex assay kit on the Bioplex immunoassay system (Bio-Rad, Hercules, CA, USA) per the manufacturer's instructions."
    equipment_required:
      - "Bio-Rad Bioplex immunoassay system"
      - "Bioplex mouse cytokine assay kit"

  - id: "PROTOCOL:chandel-oxstress-001"
    name: "Oxidative stress parameters in lung tissue homogenate"
    description: "Lung tissue homogenates (10% w/v) prepared in ice-cold PBS (pH 7.4) at 4 C with a Potter/Elvehjem homogenizer; supernatant collected after centrifugation at 8000 rpm for 10 min. Malondialdehyde (MDA) quantified as a measure of lipid peroxidation; reduced glutathione (GSH) by the method of Moron et al.; superoxide dismutase by the method of Kono; catalase by the method of Lueck."
    equipment_required:
      - "Potter/Elvehjem homogenizer"
      - "Refrigerated centrifuge"
      - "UV-visible spectrophotometer"

  - id: "PROTOCOL:chandel-mitosox-001"
    name: "Mitochondrial ROS by MitoSOX Red flow cytometry"
    description: "BALF cells suspended in PBS stained with FITC-conjugated anti-mouse CD11b antibody (BD Biosciences #557396) for 10-15 min at 4 C, washed, then stained with MitoSOX Red (5 uM) for 10 min at 37 C in the dark. Cells analysed on a BD LSR Fortessa Cell Analyser with BD FACSDiva 8.0; the shift in MitoSOX fluorescence (MFI) in the targeted cell population was quantified."
    equipment_required:
      - "BD LSR Fortessa Cell Analyser flow cytometer"
      - "MitoSOX Red (Invitrogen)"
      - "FITC-conjugated anti-mouse CD11b antibody (BD Biosciences #557396)"

  - id: "PROTOCOL:chandel-pft-001"
    name: "Pulmonary function test by double chamber plethysmography"
    description: "Non-invasive pulmonary function testing in conscious mice with a double chamber plethysmograph (SCIREQ, EMKA Technologies; Montreal, Canada). Parameters analysed in a time course manner: peak inspiratory flow (PIF), peak expiratory flow (PEF), tidal volume (TV), breathing rate/frequency (F), minute volume (MV) and specific airway resistance (sRaw)."
    equipment_required:
      - "Double chamber plethysmograph (SCIREQ, EMKA Technologies)"

  - id: "PROTOCOL:chandel-histo-001"
    name: "Lung histology with H&E and mean linear intercept"
    description: "Lungs fixed in 5% formalin and embedded in paraffin; 5 um sections stained with H&E and examined under a light microscope (100x and 400x) for air space enlargement. Mean linear intercept (MLI) calculated with Fiji (ImageJ) to quantify morphometric changes in alveolar size."
    equipment_required:
      - "Microtome"
      - "Light microscope"
      - "Fiji (ImageJ) software"

