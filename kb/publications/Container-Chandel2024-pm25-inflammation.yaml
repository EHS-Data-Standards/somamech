# =============================================================================
# OXIDATIVE STRESS ASSAYS - lung tissue redox and mitochondrial ROS
# =============================================================================

oxidative_stress_assays:

  - id: "OX:chandel-lung-redox-7d"
    name: "Lung tissue redox status - PM2.5 100 ug, day 7"
    description: "Lung homogenates assessed 7, 14 and 21 days after a single 100 ug PM2.5 dose (Fig. 5). At 7 days: malondialdehyde (lipid peroxidation) increased 2.4-fold (p < 0.01); reduced glutathione fell 3-fold (p < 0.001); the GSH:GSSG ratio fell 3.4-fold (p < 0.01); superoxide dismutase activity fell 2.2-fold (p < 0.001) and catalase activity fell ~3-fold (p < 0.001), all with respect to control. Mean +/- SD of 4-5 animals per group. Oxidative stress persisted at 21 days despite resolution of inflammation."
    ros_probe_type: "Not applicable - colorimetric assays of MDA, GSH, SOD and catalase in lung homogenate"
    evidence:
      - reference: "PMID:39031246"
        reference_title: "Dynamics of Inflammatory and Pathological Changes Induced by Single Exposure of Particulate Matter (PM(2.5)) in Mice: Potential Implications in COPD."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Data on LPO/GSH and activities of SOD/Catalase show induction of continuous oxidative stress in lung tissue."
        explanation: "The abstract states that the LPO/GSH data and SOD/catalase activities show induction of continuous oxidative stress in lung tissue, which is exactly what this assay records."
    has_specified_output:
      id: "OX:chandel-lung-redox-7d-output"
      name: "Lung tissue redox measurements, 100 ug day 7"
      lipid_peroxidation:
        value: "2.4"
        unit:
          id: "STATO:0000169"
          name: "fold change"
      antioxidant_enzyme_activities: "Superoxide dismutase activity reduced 2.2-fold (p < 0.001) and catalase activity reduced ~3-fold (p < 0.001) with respect to control; reduced glutathione lowered 3-fold (p < 0.001) and the GSH:GSSG ratio lowered 3.4-fold (p < 0.01)"
    has_exposure_condition:
