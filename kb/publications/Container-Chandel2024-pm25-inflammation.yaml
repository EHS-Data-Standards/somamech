# LUNG FUNCTION ASSAYS - double chamber plethysmography time course
# =============================================================================

lung_function_assays:

  - id: "LF:chandel-pm25-14d"
    name: "Pulmonary function - PM2.5 100 ug, day 14"
    description: "Double chamber plethysmography in conscious mice 14 days after a single 100 ug PM2.5 dose. PIF and PEF began to decline significantly at day 14 (~70% of control, p < 0.01; ~71% of control, p < 0.05 respectively; Fig. 7a, b), and specific airway resistance (sRaw) was elevated 2.1-fold (p < 0.05; Fig. 7f). Mean +/- SD of 5 animals per group."
    evidence:
      - reference: "PMID:39031246"
        reference_title: "Dynamics of Inflammatory and Pathological Changes Induced by Single Exposure of Particulate Matter (PM(2.5)) in Mice: Potential Implications in COPD."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "A continuous decline in lung function was observed till 28 days."
        explanation: "The abstract reports a continuous decline in lung function up to 28 days; this assay records the first significant time point of that decline, at day 14."
    has_specified_output:
      id: "LF:chandel-pm25-14d-output"
      name: "Lung function measurements, 100 ug day 14"
