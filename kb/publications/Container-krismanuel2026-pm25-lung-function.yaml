# =============================================================================
# Krismanuel & Tjhin (2026) - Precision public health: A natural experiment on
# chronic high-contrast PM2.5 exposure and pulmonary function among older adults
# =============================================================================
#
# Source: PLoS One. 2026;21(5):e0349025
# DOI: 10.1371/journal.pone.0349025
# PMID: 42133592
#
# Study design (HUMAN OBSERVATIONAL - natural experiment, two-group
# cross-sectional comparison with a decadal residency filter; not in vitro,
# not an animal experiment):
#   - 101 non-smoking older adults (65-80 y, normal BMI 18.5-22.9 kg/m2) in
#     Indonesia, recruited from community health posts (Posbindu) and measured
#     on 31 May 2025 and 14 June 2025
#   - Two contrasting residential areas, each validated by 24-h on-site
#     monitoring: Kedoya (Jakarta) at PM2.5 57 ug/m3 as the high-exposure site
#     and Pangalengan (Bandung Regency) at PM2.5 10 ug/m3 as the low-exposure
#     site. 54 participants from Kedoya, 47 from Pangalengan.
#   - Every participant had held permanent residence at that address for at
#     least ten continuous years - the "decadal filter" that gives this design
#     its quasi-longitudinal character and its temporal precedence
#   - Spirometry per ATS/ERS 2019 with internal BTPS compensation (the two
#     sites differ in altitude); raw FEV1, FVC and FEV1/FVC converted to
#     GLI-2012 Southeast Asian-adjusted z-scores
#
# WHAT THE EXPOSURE CONTRAST IS, AND WHAT IT IS NOT:
#   The exposure is assigned at the AREA level - residence in Kedoya vs
#   Pangalengan - as an ecological proxy for a decade of ambient PM2.5. There
#   is no personal exposure monitoring and no cumulative dose model, which the
#   authors state plainly as a limitation. The low-exposure (Pangalengan) group
#   is the reference group, recorded here as experimental_group: control; it is
#   a lower-exposure comparison population, NOT an unexposed control, and its
#   own PM2.5 concentration (10 ug/m3) is modelled as its own
#   ExposureCondition.
#
# HOW THE MEASUREMENTS ARE RECORDED:
#   The paper's headline outcomes are GLI-2012 z-scores, which are
#   dimensionless (units of standard deviations of the reference population),
#   so fev1, fvc and fev1_fvc_ratio carry UCUM:1. The absolute (actual)
#   FEV1/FVC values in litres are reported only as significance verdicts
#   (FEV1_actual p < 0.001, FVC_actual p = 0.002, FEV1/FVC_actual p = 0.687) -
#   no group means in litres appear anywhere in the text or the reproduced
#   tables, so none are recorded. Group-level z-score means come from the
#   Results; the FEV1_z group means are reported alongside Mann-Whitney mean
#   ranks and no SD is given for them, so no variability is recorded on the
#   FEV1_z or FEV1/FVC_z values. FVC_z group means likewise appear without
#   their SDs.
#
# Key findings recorded here:
#   - FEV1_z: -0.45 (low exposure) vs -1.89 (high exposure), Mann-Whitney
#     p < 0.001; the high-exposure mean falls below the LLN of -1.645
#   - FVC_z: -1.2409 vs -2.4520, t-test p < 0.001, mean difference 1.2111
#     z-score units, Cohen's d = 1.21
#   - FEV1/FVC_z: +1.96 vs +1.57, Mann-Whitney p = 0.464 - no difference, and
#     both groups well above the obstruction threshold
#   - Adjusted multivariable regression: exposure group was the ONLY
#     significant predictor, B = -1.434 for FEV1_z and B = -1.145 for FVC_z
#     (both p < 0.001); for FEV1/FVC_z, B = -0.560, p = 0.071 (not significant,
#     and the whole model was not significant: p = 0.082)
#   - Pattern = reduced lung volumes with a preserved ratio, i.e. a subclinical
#     non-obstructive (restrictive-like) deficit, not airflow obstruction
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:42133592"
  reference_title: "Precision public health: A natural experiment on chronic high-contrast PM2.5 exposure and pulmonary function among older adults."
  doi: "10.1371/journal.pone.0349025"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:krismanuel-spirometry-001"
    name: "Portable digital spirometry with internal BTPS compensation and GLI-2012 Southeast Asian z-score conversion"
    description: "Pulmonary function was measured with a portable digital spirometer (volume accuracy 3%, flow range 0-16 L/s, calibrated before each session) in strict accordance with ATS/ERS standards, with participants seated. Maneuvers were repeated until at least two consistent best results were obtained, with the difference between maneuvers not exceeding 150 mL. Because the coastal Jakarta site and the highland Bandung site differ in temperature and atmospheric pressure, the spirometer carried an internal BTPS (Body Temperature, Ambient Pressure, Saturated with water vapor) sensor that automatically adjusted measured lung volumes to ambient conditions at each site. Raw FEV1, FVC and FEV1/FVC were then converted to z-scores using the Global Lung Initiative (GLI) 2012 Southeast Asian-adjusted reference equations. All spirometry technicians were blinded to participants' exposure status. The final analytical sample was established after strict adherence to the ATS/ERS 2019 quality standards."
    spirometry_standard: "American Thoracic Society / European Respiratory Society (ATS/ERS) standards; ATS/ERS 2019 quality standards for spirometry acceptance"
    equipment_required:
      - "Portable digital spirometer (volume accuracy 3%, flow range 0-16 L/s) with internal BTPS sensor"

  - id: "PROTOCOL:krismanuel-exposure-assessment-001"
    name: "Two-stage hybrid area-level PM2.5 exposure assessment (macro-level mapping plus 24-h ground-truthing)"
    description: "A two-tiered exposure assessment combined macro-level secondary data with micro-level direct sampling. Stage 1 (macro-level mapping) reviewed longitudinal ambient PM2.5 records from government-operated air quality monitoring stations across the Jakarta and Bandung metropolitan areas to identify the regions with the highest and lowest historical levels. Stage 2 (micro-level direct measurement) validated neighbourhood-level conditions at six preliminary locations (three in Jakarta, three in Bandung) using calibrated sensors over 24-hour sampling periods, performed by an independent certified air quality monitoring company, to minimise ecological fallacy. Kedoya (Jakarta) was confirmed as the highest-exposure site and Pangalengan (Bandung Regency) as the lowest-exposure site; all participants were recruited from the single administrative sub-district (kelurahan) immediately surrounding the validated sites. Participants were then assigned to exposure categories by an area-level proxy reflecting the validated chronic ambient conditions of their primary residence. NOTE: this is an ecological exposure proxy - there was no individual personal exposure monitoring, cumulative dose modelling, indoor air quality assessment, or time-activity analysis."
    equipment_required:
      - "Calibrated ambient PM2.5/PM10 sensors operated over 24-hour sampling periods by an independent certified air quality monitoring company"
      - "Government-operated air quality monitoring stations (Jakarta and Bandung metropolitan areas)"

  - id: "PROTOCOL:krismanuel-screening-001"
    name: "Multi-layered 'ultrapure' cohort screening with a 10-year residency filter and frequency matching"
    description: "A sampling frame of 245 candidates was built from community health post (Posbindu) registries and pre-screened on age (65-80 y), never-smoking status and the 10-year stable residency requirement. Stratified random sampling invited 60 candidates per site (n = 120); 123 individuals attended the clinical phase (68 Kedoya, 55 Pangalengan) for one-day screening comprising structured interviews, physical examination and electrocardiography. Inclusion: age 65-80 y, at least ten continuous years of permanent residence at the current address, willingness and physical ability to perform standardized spirometry, and BMI within the WHO Asian normal range (18.5-22.9 kg/m2, applied to exclude the restrictive effect of obesity on lung expansion). Exclusions: current or former active smoking or significant daily passive smoke exposure; chronic respiratory disease (COPD, pulmonary fibrosis, uncontrolled asthma, prior pulmonary tuberculosis); acute respiratory infection within the preceding four weeks; severe cardiovascular or systemic disease; lung cancer; neuromuscular or cognitive impairment; significant occupational exposure to industrial dust, biomass smoke or chemical irritants; and communication barriers such as illiteracy. Frequency matching on age, gender, education and occupation was then applied. Of the 123 screened, 22 were excluded: 14 for clinical abnormalities found at screening, 3 for invalid spirometry not meeting ATS/ERS 2019 quality standards, and 5 by the frequency matching procedure. Enumerators and clinical staff were blinded to exposure status."

# =============================================================================
# LUNG FUNCTION ASSAY - GLI-2012 z-score spirometry in two populations with a
# decade of contrasting ambient PM2.5 exposure.
#
# One assay with two output records, one per residential exposure group, each
# pointing at its own validated area-level ExposureCondition. Group differences
# and the adjusted regression coefficients are in response_comparisons below.
# =============================================================================

lung_function_assays:
  - id: "LF:krismanuel-gli-zscore-spirometry"
    name: "GLI-2012 z-score spirometry in older adults after a decade of residence in high- vs low-PM2.5 areas"
    description: "Natural-experiment spirometry in 101 rigorously screened, non-smoking, normal-BMI older adults (65-80 y) who had each lived at the same address for at least ten continuous years: 54 in high-exposure Kedoya (Jakarta, validated PM2.5 57 ug/m3) and 47 in low-exposure Pangalengan (Bandung Regency, validated PM2.5 10 ug/m3). FEV1, FVC and FEV1/FVC were measured per ATS/ERS with internal BTPS compensation and expressed as GLI-2012 Southeast Asian-adjusted z-scores. The high-exposure group showed markedly lower FEV1_z (mean -1.89 vs -0.45, Mann-Whitney p < 0.001) and FVC_z (mean -2.4520 vs -1.2409, t-test p < 0.001, mean difference 1.2111 z-score units, Cohen's d = 1.21), while FEV1/FVC_z did not differ (+1.57 vs +1.96, p = 0.464) and both groups stayed well above the obstruction threshold. The high-exposure FEV1_z mean falls below the Lower Limit of Normal (z = -1.645), so the shift is into the impaired range. The same pattern held for the absolute (actual) parameters as significance verdicts: FEV1_actual significantly lower (p < 0.001), FVC_actual significantly different (p = 0.002), FEV1/FVC_actual not different (p = 0.687); no group means in litres are reported anywhere in the paper, so none are recorded here. The combination of reduced volumes with a preserved ratio is a subclinical non-obstructive (restrictive-like) deficit rather than airflow obstruction, in a cohort selected to be free of known respiratory disease. Exposure was assigned ecologically at the area level, which the authors note cannot capture within-area variability or individual exposure trajectories."
    reference_dataset: "Global Lung Initiative (GLI) 2012 Southeast Asian-adjusted reference equations"
