    study_subject:
      subject_type: InVivoSubject
      id: "SUBJECT:krismanuel-older-adults"
      name: "Non-smoking older adults with at least ten years' residence in high- (Kedoya) or low-PM2.5 (Pangalengan) areas of Indonesia"
      model_species:
        id: "NCBITaxon:9606"
        name: "Homo sapiens"
      sex: "both sexes, predominantly female: Pangalengan 37 women and 10 men (78.72% female), Kedoya 47 women and 7 men (87.04% female); the gender distribution did not differ between groups (chi-square p = 0.265)"
      disease_state: "apparently healthy; screened free of chronic respiratory disease (COPD, pulmonary fibrosis, uncontrolled asthma, prior pulmonary tuberculosis), recent acute respiratory infection, severe cardiovascular or systemic disease, and lung cancer"
      subject_characteristics: "101 participants aged 65-80 y: 54 from high-exposure Kedoya, 47 from low-exposure Pangalengan. Group mean ages 71.32 y (SD 2.59) in the low-exposure group and 71.52 y (SD 3.57) in the high-exposure group, not significantly different (mean difference -0.199 y; t = -0.317, p = 0.747); no pooled cohort mean age is reported. All within the WHO Asian normal BMI range (18.5-22.9 kg/m2): mean 20.74 kg/m2 (SD 0.80) low-exposure vs 20.80 kg/m2 (SD 0.70) high-exposure, not significantly different (t = -0.441, p = 0.661). Mean height 147.53 cm (SD 7.21) vs 151.30 cm (SD 6.04) - the one baseline variable that did differ (Welch/Brown-Forsythe p = 0.006), and height was therefore carried as a covariate. Ethnicity recorded as Southeast Asian in both groups. All never-smokers with no significant passive-smoke exposure and no significant occupational exposure to industrial dust, biomass smoke or chemical irritants. Education predominantly low (72.34% vs 70.37% not attending school or elementary only); occupation was 100% in the lowest ordinal category (unemployed, labourer, farmer or small trader) in both groups. Baseline vital signs comparable: median respiratory rate 19.0 breaths/min in both groups (p = 0.032), median oxygen saturation 96.0% (p = 0.947). Frequency matching on age, gender, education and occupation balanced the groups."
      clinical_context: "Natural experiment with a quasi-longitudinal decadal residency filter, Indonesia; data collected 31 May 2025 and 14 June 2025 at community health posts (Posbindu) in two administrative sub-districts (kelurahan) immediately surrounding validated monitoring sites - Kedoya (Jakarta, high exposure) and Pangalengan (Bandung Regency, low exposure). Ethical approval 007/KER/FK/04/2025, Faculty of Medicine, Universitas Trisakti; reported per STROBE. Enumerators, clinical examiners and spirometry technicians were blinded to exposure status. Exposure is an area-level ecological proxy, not personal monitoring."
    follows_protocols:
      - protocol_type: SpirometryProtocol
        id: "PROTOCOL:krismanuel-spirometry-001"
        name: "Portable digital spirometry with internal BTPS compensation and GLI-2012 Southeast Asian z-score conversion"
        spirometry_standard: "American Thoracic Society / European Respiratory Society (ATS/ERS) standards; ATS/ERS 2019 quality standards for spirometry acceptance"
      - id: "PROTOCOL:krismanuel-exposure-assessment-001"
        name: "Two-stage hybrid area-level PM2.5 exposure assessment (macro-level mapping plus 24-h ground-truthing)"
      - id: "PROTOCOL:krismanuel-screening-001"
        name: "Multi-layered 'ultrapure' cohort screening with a 10-year residency filter and frequency matching"

# =============================================================================
# RESPONSE COMPARISONS - the paper's reported group differences and adjusted
# regression coefficients.
#
# MODELLING NOTES:
#   - SIGN CONVENTION. The paper reports the FVC_z group difference as
#     mu1 - mu2 = +1.2111, i.e. LOW-exposure minus HIGH-exposure. The schema's
#     control/treated pairing is the other way round (control = low-exposure
#     reference, treated = high-exposure), so change_value is recorded as
#     -1.2111: the same reported magnitude, oriented as treated minus control.
#     This is a documented sign convention, not a recomputation - no arithmetic
#     beyond negation was performed, and every magnitude is as printed.
#   - The three adjusted coefficients (B) come from multivariable linear
#     regression of each z-score on exposure group, adjusted for age, gender,
#     education, height and BMI. They are NOT differences between the two
#     output records above, so control_output and treated_output are omitted on
#     those three: pointing them at the unadjusted group records would
#     misrepresent an adjusted coefficient as a raw group difference.
#   - p_value carries 0.001 where the paper prints "p < 0.001" (the schema
#     slot is a float and cannot hold an inequality); each description states
#     the printed form.
# =============================================================================

response_comparisons:
  - id: "COMP:krismanuel-fvcz-group-difference"
    name: "Unadjusted FVC_z difference between the high- and low-exposure groups"
    description: "Independent-samples t-test on FVC_z (both groups normally distributed, Shapiro-Wilk p = 0.054 and p = 0.989; variances homogeneous, Levene's p = 0.051): a highly significant difference, printed as p < 0.001. The paper states the Mean Difference (mu1 - mu2) as +1.2111 z-score units with Mean 1 = -1.2409 (low exposure) and Mean 2 = -2.4520 (high exposure), a large effect (Cohen's d = 1.21) - the average FVC_z in the lower-exposure group was 1.21 standard deviations higher than in the higher-exposure group. Recorded here as -1.2111, the same magnitude oriented as treated (high exposure) minus control (low exposure); see the section note on the sign convention."
    derived_from_assay: "LF:krismanuel-gli-zscore-spirometry"
    compared_measurement: "fvc"
    control_output: "LF:krismanuel-gli-zscore-spirometry-output-low-exposure"
    treated_output: "LF:krismanuel-gli-zscore-spirometry-output-high-exposure"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-1.2111"
      unit:
        id: "UCUM:1"
        name: "GLI-2012 z-score (dimensionless)"
    p_value: 0.001
    statistical_test: "Independent samples t-test (two-tailed, alpha = 0.01); paper prints p < 0.001, Cohen's d = 1.21"
    derivation: reported_in_paper

  - id: "COMP:krismanuel-fev1z-group-difference"
    name: "Unadjusted FEV1_z difference between the high- and low-exposure groups"
    description: "Mann-Whitney U test on FEV1_z, used because group 1 violated normality (p = 0.001) and variances were unequal (Levene's p < 0.001): a highly significant difference, printed as p < 0.001. The lower-exposure group had the higher distribution (mean rank 64.63; mean -0.45) and the higher-exposure group the lower (mean rank 39.14; mean -1.89), a mean rank difference of +25.49. The paper does not print a mean difference in z-score units for FEV1_z, and computing one here would be a calculation the paper does not make, so no change_value is recorded - the comparison stands on the two group means on the output records, with the test and its p-value. The high-exposure mean falls below the clinical threshold of -1.645."
    derived_from_assay: "LF:krismanuel-gli-zscore-spirometry"
    compared_measurement: "fev1"
    control_output: "LF:krismanuel-gli-zscore-spirometry-output-low-exposure"
    treated_output: "LF:krismanuel-gli-zscore-spirometry-output-high-exposure"
    change_type: absolute_difference
    change_direction: decreased
    p_value: 0.001
    statistical_test: "Mann-Whitney U test (two-tailed, alpha = 0.01), used because of non-normality in group 1 and unequal variances; paper prints p < 0.001"
    derivation: reported_in_paper

  - id: "COMP:krismanuel-fev1fvcz-group-difference"
    name: "Unadjusted FEV1/FVC_z comparison between the high- and low-exposure groups (null result)"
    description: "Mann-Whitney U test on the FEV1/FVC_z ratio showed no statistically significant difference (p = 0.464), with similar rank distributions (mean rank 53.29 low-exposure vs 49.01 high-exposure) and both group means (+1.96 and +1.57) far above the obstruction threshold (LLN = -1.645). This null result is the load-bearing negative finding of the paper: it is what makes the volume deficit non-obstructive rather than obstructive. No change_value is recorded because the paper reports no difference estimate for this ratio, only the null test."
    derived_from_assay: "LF:krismanuel-gli-zscore-spirometry"
    compared_measurement: "fev1_fvc_ratio"
    control_output: "LF:krismanuel-gli-zscore-spirometry-output-low-exposure"
    treated_output: "LF:krismanuel-gli-zscore-spirometry-output-high-exposure"
    change_type: absolute_difference
    change_direction: no_change
    p_value: 0.464
    statistical_test: "Mann-Whitney U test (two-tailed, alpha = 0.01)"
    derivation: reported_in_paper

  - id: "COMP:krismanuel-fev1z-adjusted-beta"
    name: "Adjusted effect of high-exposure residence on FEV1_z (multivariable linear regression)"
    description: "In the adjusted multivariable linear regression model for FEV1_z (overall model F(6,94) = 7.189, p < 0.001, R2 = 0.315, i.e. about 31.5% of the variance), residence in the high-exposure area was the only significant predictor: unstandardized coefficient B = -1.434, printed p < 0.001. After controlling for age, gender, education, height and BMI, participants in the high-PM2.5 area had an FEV1_z score 1.434 units lower than those in the low-PM2.5 area. BMI showed a positive association (B = 0.443, p = 0.015) but did not meet the study's stringent 0.01 threshold. Model diagnostics: maximum Cook's distance 0.149, VIF below 1.6. This is an adjusted model coefficient, so no control/treated output pair is referenced (see the section note)."
    derived_from_assay: "LF:krismanuel-gli-zscore-spirometry"
    compared_measurement: "fev1"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-1.434"
      unit:
        id: "UCUM:1"
        name: "GLI-2012 z-score (dimensionless)"
    p_value: 0.001
    statistical_test: "Multivariable linear regression (unstandardized B), adjusted for age, gender, education, height and BMI; alpha = 0.01; paper prints p < 0.001"
    derivation: reported_in_paper

  - id: "COMP:krismanuel-fvcz-adjusted-beta"
    name: "Adjusted effect of high-exposure residence on FVC_z (multivariable linear regression)"
    description: "In the adjusted multivariable linear regression model for FVC_z (overall model F(6,94) = 5.475, p < 0.001, R2 = 0.259, i.e. about 25.9% of the variance), the PM2.5 exposure group was the sole significant predictor: unstandardized coefficient B = -1.145, printed p < 0.001 - showing that the effect of higher exposure on reduced lung volume remains robust after adjustment. This is an adjusted model coefficient, so no control/treated output pair is referenced (see the section note)."
    derived_from_assay: "LF:krismanuel-gli-zscore-spirometry"
    compared_measurement: "fvc"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-1.145"
      unit:
        id: "UCUM:1"
        name: "GLI-2012 z-score (dimensionless)"
    p_value: 0.001
    statistical_test: "Multivariable linear regression (unstandardized B), adjusted for age, gender, education, height and BMI; alpha = 0.01; paper prints p < 0.001"
    derivation: reported_in_paper

  - id: "COMP:krismanuel-fev1fvcz-adjusted-beta"
    name: "Adjusted effect of high-exposure residence on FEV1/FVC_z (multivariable linear regression, null)"
    description: "The adjusted model for FEV1/FVC_z was not statistically significant overall (F(6,94) = 1.943, p = 0.082, R2 = 0.110) and no predictor reached significance, including PM2.5 exposure (B = -0.560, p = 0.071). Recorded as a null adjusted coefficient: the change_value is the printed B, but with p = 0.071 against the study's alpha of 0.01 the direction is not established, so change_direction is no_change. This is an adjusted model coefficient, so no control/treated output pair is referenced (see the section note)."
    derived_from_assay: "LF:krismanuel-gli-zscore-spirometry"
    compared_measurement: "fev1_fvc_ratio"
    change_type: absolute_difference
    change_direction: no_change
    change_value:
      value: "-0.560"
      unit:
        id: "UCUM:1"
        name: "GLI-2012 z-score (dimensionless)"
    p_value: 0.071
    statistical_test: "Multivariable linear regression (unstandardized B), adjusted for age, gender, education, height and BMI; alpha = 0.01, so this coefficient is not significant and the overall model (p = 0.082) is not significant either"
    derivation: reported_in_paper

  - id: "COMP:krismanuel-pm25-fev1z-correlation"
    name: "Bivariate correlation between area-level PM2.5 exposure and FEV1_z"
    description: "Ambient PM2.5 exposure showed a significant moderate negative correlation with FEV1_z (Pearson r = -0.469, p < 0.001; Spearman rho = -0.436, p < 0.001). Recorded as a ratio-type change because a correlation coefficient is a dimensionless association measure, not a group difference: change_value carries the Pearson r. The companion FVC_z correlation is recorded separately. PM2.5 was NOT significantly correlated with FEV1/FVC_z (Pearson r = -0.136, p = 0.176), consistent with every other analysis of the ratio in this paper."
    derived_from_assay: "LF:krismanuel-gli-zscore-spirometry"
    compared_measurement: "fev1"
    change_type: ratio
    change_direction: decreased
    change_value:
      value: "-0.469"
      unit:
        id: "UCUM:1"
        name: "Pearson correlation coefficient (dimensionless)"
    p_value: 0.001
    statistical_test: "Pearson correlation (alpha = 0.01, two-tailed); paper prints p < 0.001, with Spearman rho = -0.436, p < 0.001 as the non-parametric companion"
    derivation: reported_in_paper

  - id: "COMP:krismanuel-pm25-fvcz-correlation"
    name: "Bivariate correlation between area-level PM2.5 exposure and FVC_z"
    description: "Area-level PM2.5 exposure was significantly and moderately negatively correlated with FVC_z. NOTE A DISCREPANCY INSIDE THE PAPER: Table 5 gives Pearson r = -0.442 (p < 0.001) with Spearman rho = -0.415 (p < 0.001), while the Results text for the same correlation prints r = -0.462. The Table 5 value is recorded here because the table is the reported correlation matrix and its Pearson and Spearman pair are internally consistent; the text's -0.462 appears once and is not reproduced elsewhere. Recorded as a ratio-type change for the same reason as the FEV1_z correlation."
    derived_from_assay: "LF:krismanuel-gli-zscore-spirometry"
    compared_measurement: "fvc"
    change_type: ratio
    change_direction: decreased
    change_value:
      value: "-0.442"
      unit:
        id: "UCUM:1"
        name: "Pearson correlation coefficient (dimensionless)"
    p_value: 0.001
    statistical_test: "Pearson correlation (alpha = 0.01, two-tailed); paper prints p < 0.001, with Spearman rho = -0.415, p < 0.001 as the non-parametric companion"
    derivation: reported_in_paper

  - id: "COMP:krismanuel-pm25-fev1fvcz-correlation"
    name: "Bivariate correlation between area-level PM2.5 exposure and FEV1/FVC_z (null)"
    description: "PM2.5 exposure was not statistically significantly correlated with the FEV1/FVC_z ratio (Pearson r = -0.136, p = 0.176; Spearman rho = -0.073, p = 0.467), evaluated against the study's alpha of 0.01. Recorded to keep the null ratio result explicit alongside the two significant volume correlations."
    derived_from_assay: "LF:krismanuel-gli-zscore-spirometry"
    compared_measurement: "fev1_fvc_ratio"
    change_type: ratio
    change_direction: no_change
    change_value:
      value: "-0.136"
      unit:
        id: "UCUM:1"
        name: "Pearson correlation coefficient (dimensionless)"
    p_value: 0.176
    statistical_test: "Pearson correlation (alpha = 0.01, two-tailed), not significant; Spearman rho = -0.073, p = 0.467"
    derivation: reported_in_paper
