    description: "The anti-apoptotic gene BCL2 in airway cells. BCL2 transcript was significantly upregulated in spring and Bcl-2 protein showed robust expression in spring, so Bcl-2 upregulation was consistent at both transcript and protein level in the airway cells. After Bonferroni adjustment the airway BCL2 delta-Ct differed significantly between the two PM2.5 exposure levels; LMER estimated a delta-Ct change of -1.61 (95% CI -2.14, -1.09) - higher transcript abundance - and a protein change of +0.82 (95% CI 0.69, 0.94) relative units per 10 ug/m3 increase in PM2.5. Airway cells also showed a significant decline in the frequency of early apoptotic cells in spring, with an LMER estimate of -11.00 (95% CI -14.27, -7.77) per 10 ug/m3 PM2.5; that flow-cytometry endpoint has no matching output slot, so it is recorded here as description text. Values are in Figs. 3g, 3i and 3k only, so no value is recorded in the output records."
    target_gene: "NCBIGene:596"
    gene_expression_method: "RT-qPCR (delta-Ct against GAPDH) and indirect ELISA for Bcl-2"
    normalization_reference: "GAPDH (transcripts); total protein per well (ELISA)"
    evidence:
