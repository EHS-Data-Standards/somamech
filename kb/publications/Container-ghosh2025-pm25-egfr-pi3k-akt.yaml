# =============================================================================
# KEY EVENT RELATIONSHIPS
# =============================================================================
#
# Three KE ids are minted here because no existing key event on main fits:
#   KE:ke-suppressed-apoptosis, KE:ke-increased-proliferation and
#   KE:ke-proangiogenic-signaling. Each is kept minimal so the next paper can
#   reuse it verbatim. The other key events used in this file
#   (KE:ao-decreased-lung-function, KE:ke-airway-inflammation,
#   KE:ke-systemic-inflammation, KE:ke1-egfr-activation,
#   KE:mie-oxidative-stress) are copied verbatim from main.
#
# These relationships are the ones the paper states for its own data; the
# PI3K/AKT-to-downstream links the paper only cites from other work are not
# recorded here.
# =============================================================================

key_event_relationships:
  - id: "KER:ghosh-egfr-to-suppressed-apoptosis"
    name: "EGFR/PI3K/AKT activation leads to suppressed apoptosis"
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-suppressed-apoptosis"
      name: "Suppressed apoptosis"
      biological_action: decreased
      level_of_biological_organization: cellular
    relationship_type: "indirectly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:41469766"
        reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "These molecular alterations reflected enhanced proliferative and pro-angiogenic signaling and reduced apoptosis in the airway cells and the leukocytes."
        explanation: "The authors tie the activated EGFR/PI3K/AKT cascade in their own participants to reduced apoptosis in both compartments, which is this relationship."
      - reference: "PMID:41469766"
        reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "high PM 2.5 may impact the activation of pro-oncogenic signaling"
        explanation: "The paper's conclusion that PM2.5 exposure activates the EGFR/PI3K/AKT signaling that suppresses apoptosis."

  - id: "KER:ghosh-egfr-to-proliferation"
    name: "EGFR/PI3K/AKT activation leads to increased cell proliferation"
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-increased-proliferation"
      name: "Increased cell proliferation"
      biological_action: increased
      level_of_biological_organization: cellular
    relationship_type: "indirectly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:41469766"
        reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "These molecular alterations reflected enhanced proliferative and pro-angiogenic signaling and reduced apoptosis in the airway cells and the leukocytes."
        explanation: "The authors tie the activated EGFR/PI3K/AKT cascade to enhanced proliferative signaling, measured here as Cyclin D1 protein upregulation."
      - reference: "PMID:41469766"
        reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "the protein profile of Cyclin D1 showed prominent"
        explanation: "The proliferation marker whose spring upregulation supports the downstream proliferation event in this relationship."

  - id: "KER:ghosh-egfr-to-proangiogenic-signaling"
    name: "EGFR/PI3K/AKT activation leads to increased pro-angiogenic signaling"
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-proangiogenic-signaling"
      name: "Increased pro-angiogenic signaling"
      biological_action: increased
      level_of_biological_organization: cellular
    relationship_type: "indirectly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:41469766"
        reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "These molecular alterations reflected enhanced proliferative and pro-angiogenic signaling and reduced apoptosis in the airway cells and the leukocytes."
        explanation: "The authors tie the activated EGFR/PI3K/AKT cascade to enhanced pro-angiogenic signaling, measured here as VEGF and HIF-1alpha upregulation."
      - reference: "PMID:41469766"
        reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "the same proteins further validated their upregulation in the airway"
        explanation: "The VEGF and HIF-1alpha protein upregulation that supports the downstream pro-angiogenic event in this relationship."

  - id: "KER:ghosh-egfr-upstream-of-pi3k-akt"
    name: "EGFR activation is the upstream regulator of the PI3K/AKT circuit"
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-increased-proliferation"
      name: "Increased cell proliferation"
      biological_action: increased
      level_of_biological_organization: cellular
    relationship_type: "indirectly leads to"
    evidence_support: weak
    # Not quantified by the authors: EGFR and the PI3K/AKT nodes were
    # measured in the same samples and moved together with PM2.5, but the
    # upstream-regulator claim itself is carried over from the cited
    # literature rather than tested in this study.
    quantitative_understanding: low
    evidence:
      - reference: "PMID:41469766"
        reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "and has been established as a major upstream regulator of the"
        explanation: "States the upstream-regulator relationship between EGFR and the PI3K/AKT pathway that frames this file's assays; the authors cite it as established rather than demonstrating causality in their own data, hence evidence_support: weak."
