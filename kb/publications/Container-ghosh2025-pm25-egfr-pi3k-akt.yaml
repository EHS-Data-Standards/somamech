# =============================================================================
# RESPONSE COMPARISONS - the paper's LMER beta estimates
# =============================================================================
#
# Every entry is an LMER beta estimate with its 95% CI, reported in the paper
# (Suppl. Table 1) as the change per 10 ug/m3 increase in PM2.5 while adjusting
# for the demographic and socioeconomic covariates. They are therefore
# exposure-response slopes, not raw monsoon-to-spring group differences; the
# statistical_test string on every record says so, and derivation is
# reported_in_paper because no delta was computed during extraction.
# =============================================================================

response_comparisons:
  - id: "COMP:ghosh-lf-fev1fvc"
    name: "Association of PM2.5 with the measured FEV1/FVC ratio"
    description: "LMER beta estimate: every 10 ug/m3 increase in PM2.5 decreased the measured FEV1/FVC ratio by 2.62 percentage points."
    derived_from_assay: "LF:ghosh-pm25-seasonal-spirometry"
    compared_measurement: "fev1_fvc_ratio"
    control_output: "LF:ghosh-pm25-seasonal-spirometry-output-monsoon"
    treated_output: "LF:ghosh-pm25-seasonal-spirometry-output-spring"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-2.62"
      unit:
        id: "UO:0000187"
        name: "percent"
      variability:
        variability_type: confidence_interval_95
        lower_bound: "-3.68"
        upper_bound: "-1.56"
        unit:
          id: "UO:0000187"
          name: "percent"
    statistical_test: "linear mixed-effects regression (LMER) with participant identity code as the random effect, adjusted for age, BMI, marital status, number of family members, education, profession, income, number of working years, work duration, mode of transport, passive smoking and cooking fuel type; the estimate is the change per 10 ug/m3 increase in PM2.5, not a raw monsoon-to-spring difference"
    derivation: reported_in_paper
  - id: "COMP:ghosh-ros-airway"
    name: "Association of PM2.5 with ROS generation in airway cells"
    description: "LMER beta estimate: every 10 ug/m3 rise in PM2.5 caused robust ROS generation in the airway cells. Unit omitted: the readout is DCFH-DA mean fluorescence intensity normalized per 10^5 viable cells, for which no unit ontology term applies."
    derived_from_assay: "OX:ghosh-ros-airway"
    compared_measurement: "reactive_oxygen_species"
    control_output: "OX:ghosh-ros-airway-output-monsoon"
    treated_output: "OX:ghosh-ros-airway-output-spring"
    change_type: absolute_difference
    change_direction: increased
    change_value:
      value: "0.064"
      variability:
        variability_type: confidence_interval_95
        lower_bound: "0.045"
        upper_bound: "0.078"
    statistical_test: "linear mixed-effects regression (LMER) with participant identity code as the random effect, adjusted for age, BMI, marital status, number of family members, education, profession, income, number of working years, work duration, mode of transport, passive smoking and cooking fuel type; the estimate is the change per 10 ug/m3 increase in PM2.5, not a raw monsoon-to-spring difference"
    derivation: reported_in_paper
  - id: "COMP:ghosh-ros-leukocyte"
    name: "Association of PM2.5 with ROS generation in leukocytes"
    description: "LMER beta estimate: every 10 ug/m3 rise in PM2.5 caused robust ROS generation in the leukocytes. Unit omitted: the readout is DCFH-DA mean fluorescence intensity normalized per 10^5 viable cells."
    derived_from_assay: "OX:ghosh-ros-leukocyte"
    compared_measurement: "reactive_oxygen_species"
    control_output: "OX:ghosh-ros-leukocyte-output-monsoon"
    treated_output: "OX:ghosh-ros-leukocyte-output-spring"
    change_type: absolute_difference
    change_direction: increased
    change_value:
      value: "0.046"
      variability:
        variability_type: confidence_interval_95
        lower_bound: "0.034"
        upper_bound: "0.056"
    statistical_test: "linear mixed-effects regression (LMER) with participant identity code as the random effect, adjusted for age, BMI, marital status, number of family members, education, profession, income, number of working years, work duration, mode of transport, passive smoking and cooking fuel type; the estimate is the change per 10 ug/m3 increase in PM2.5, not a raw monsoon-to-spring difference"
