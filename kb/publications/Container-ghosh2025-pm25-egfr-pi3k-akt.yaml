# =============================================================================
# LUNG FUNCTION ASSAY - spirometry in the paired seasonal visits
# =============================================================================

lung_function_assays:
  - id: "LF:ghosh-pm25-seasonal-spirometry"
    name: "Spirometry in thermal power plant participants during monsoon and spring"
    description: "Measured and percent-predicted FVC, FEV1 and FEV1/FVC in the same 33 asymptomatic male participants at the low-PM2.5 monsoon visit (Aug 2021) and the high-PM2.5 spring visit (Mar 2022). FVC and FEV1 stayed within normal limits and did not differ significantly between seasons (p = 0.59 and p = 0.66), but the measured FEV1/FVC ratio fell significantly in spring (90.06 +/- 6.19% to 84.32 +/- 3.86%, p = 0.00), which the authors read as a tendency toward obstructive lung function. Percent-predicted values, reported in Table 3 but not recorded in the output slots because the schema has no percent-predicted slot, were: FVC 88.67 +/- 7.4% (monsoon) and 87.06 +/- 14.06% (spring); FEV1 100.15 +/- 6.39% and 100.55 +/- 15.61%; FEV1/FVC 109.85 +/- 9.28% and 109.48 +/- 10.66%. HEMATOLOGY CONTEXT (Table 2, same visits, N = 33 each, paired t-test): Hb 13.68 +/- 1.36 to 12.95 +/- 1.28 g/dl (p = 0.00); ESR 28.61 +/- 25.65 to 17.24 +/- 18.83 mm (p = 0.00); WBC 7603.03 +/- 1628.55 to 5551.52 +/- 2383.42 per cu. mm (p = 0.00); monocytes 1.03 +/- 0.18% to 2.19 +/- 1.6% (p = 0.00); eosinophils, lymphocytes and neutrophils unchanged. The corresponding LMER estimates per 10 ug/m3 PM2.5 were Hb -0.33 (95% CI -0.45, -0.21), ESR -5.19 (95% CI -8.46, -1.92) and WBC -937.49 (95% CI -1351.36, -523.62). These hematology values are recorded here as description text only: the schema has no whole-blood hematology output class, and LungFunctionAssay's hemoglobin_level slot sits on the assay rather than on the per-season output records, so it cannot carry two seasonal values."
    reference_dataset: "reference equation not stated by the authors; percent-predicted values are reported in Table 3 alongside the measured values"
    evidence:
      - reference: "PMID:41469766"
        reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FEV1/FVC (measured) 90.06±6.19 84.32±3.86 0.00"
        explanation: "Table 3 row giving the measured FEV1/FVC values this assay records for the monsoon and spring visits, with the paired t-test p-value."
      - reference: "PMID:41469766"
        reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
        supports: SUPPORT
