balf_sputum_assays:
  - id: "BALF:ghosh-sputum-cytology"
    name: "Sputum differential cytology during monsoon and spring"
    description: "Papanicolaou-stained spontaneous sputum from the same 33 participants in both seasons, counted over at least 10 random fields per sample. Alveolar macrophages - the primary cells recruited against respiratory pathogens - were significantly reduced in spring, which the authors read as reduced pulmonary immunity. Neutrophils trended upward in spring but the seasonal difference was not significant. The LMER model estimated a decrease in the frequency of alveolar macrophages of -5.46 (95% CI -9.44, -1.47) per 10 ug/m3 rise in PM2.5, adjusted for the independent covariates. Fig. 2a, b reports the average cell numbers graphically only, with no numeric values in the text; the paper's unit is an average cell number per field rather than a percentage, so no value is recorded in the percentage slots and the LMER estimate is kept in this description instead of a response_comparisons record."
    # The assay counts alveolar macrophages, neutrophils, eosinophils and
    # lymphocytes, but only the alveolar macrophage change reached
    # significance, so it is the primary focus recorded here.
    target_cell_type:
      id: "CL:0000583"
      name: "alveolar macrophage"
    evidence:
      - reference: "PMID:41469766"
        reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "evidenced with a significant reduction in the frequency of alveolar"
        explanation: "States the significant spring reduction in alveolar macrophage frequency that this assay records."
      - reference: "PMID:41469766"
        reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Though neutrophils depicted an increasing trend in spring, the"
        explanation: "States the non-significant upward neutrophil trend recorded in the spring output record."
