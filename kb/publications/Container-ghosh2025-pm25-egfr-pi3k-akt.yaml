# =============================================================================
# Ghosh et al. (2025) - Seasonal impact of PM2.5 on pro-oncogenic drivers
# among participants of a thermal power plant in India
# =============================================================================
#
# Source: Sci Rep (2025), accepted manuscript ("ARTICLE IN PRESS")
# DOI: 10.1038/s41598-025-33906-7
#
# Study design (committed reference cache for this PMID is full_text_pdf, so
# every evidence snippet below is quoted from the committed cache entry):
#   - Human panel study with paired within-subject seasonal sampling.
#     33 asymptomatic adult male employees (aged 25-60 y, mean 42.54 +/- 8.23 y)
#     of a thermal power plant in Bankura district, West Bengal, India
#     (23.46414 N, 87.13182 E). 352 individuals screened, 88 asymptomatic,
#     33 consented and were sampled in BOTH seasons.
#   - Exposure contrast: ambient PM2.5 measured by an on-site ground
#     monitoring station Apr 2021 - Mar 2022. Daily mean PM2.5 was
#     45.28 +/- 9.40 ug/m3 during winter-spring (Dec 2021 - Mar 2022) versus
#     23.39 +/- 11.17 ug/m3 during summer-monsoon (Apr 2021 - Aug 2021).
#   - Samples: blood (3 mL, ante-cubital vein, with and without K2EDTA) and
#     early-morning spontaneously expectorated sputum, collected once in
#     Aug 2021 (monsoon, lower PM2.5) and once in Mar 2022 (spring, higher
#     PM2.5). Sputum-derived cells are called "airway cells" throughout the
#     paper; whole-blood leukocytes are the systemic compartment.
#   - Readouts: spirometry; automated hematology; Papanicolaou sputum
#     cytology; gelatin zymography for serum MMP-9; DCFH-DA ROS; Annexin
#     V-FITC/PI apoptosis by flow cytometry; RT-qPCR (delta-Ct, GAPDH
#     reference) for PIK3CA, AKT2, MTOR, PTEN, EGFR, BCL2, BAX, CCND1,
#     VEGFA, HIF1A; indirect ELISA for the matching proteins; EGFR
#     immunocytochemistry.
#   - Statistics: paired t-test with Bonferroni family-wise correction, plus
#     a Linear Mixed-Effects Regression (LMER) with participant ID as the
#     random effect, adjusted for age, BMI, marital status, family size,
#     education, profession, income, years of service, work duration, mode
#     of transport, passive smoking and cooking fuel. LMER estimates are
#     reported as the change per 10 ug/m3 increase in PM2.5.
#
# Key findings:
#   - Higher winter-spring PM2.5 coincided with lower Hb, ESR and WBC,
#     higher monocyte percentage, and a significantly reduced measured
#     FEV1/FVC ratio.
#   - Fewer sputum alveolar macrophages; a non-significant upward trend in
#     sputum neutrophils; pro MMP-9 activity down and active MMP-9 up.
#   - More ROS in both airway cells and leukocytes.
#   - EGFR/PI3K/AKT axis activated (pPI3K p85alpha Tyr508, pAKT Ser473,
#     pEGFR Tyr1068, Cyclin D1, VEGF, HIF-1alpha all up) with PTEN down, and
#     early apoptosis reduced in airway cells (and early + late in
#     leukocytes).
#   - Estimated relative risk of lung cancer mortality higher in
#     winter-spring than summer-monsoon.
#
# MODELING NOTES - read before adding numbers to this file:
#   1. Only Tables 1-3 report numeric group values. Every molecular readout
#      (RT-qPCR delta-Ct, ELISA, zymography band intensity, ROS MFI, apoptosis
#      frequencies, EGFR MFI) is shown in Figs. 2-4 ONLY, with no numbers in
#      the running text. Per the extraction rules figure-derived values are
#      not estimated, so those output records carry their experimental group,
#      the exposure condition they were measured under, and a description of
#      the reported direction - but no QuantityValue.
#   2. The paper's quantitative molecular results are the LMER beta estimates
#      with 95% CIs, which are associations per 10 ug/m3 increase in PM2.5
#      rather than monsoon-to-spring differences. They are recorded in
#      response_comparisons with change_type: absolute_difference and a
#      statistical_test string that states the per-10 ug/m3 scaling, so the
#      number is never mistaken for a raw group delta.
#   3. The hematology numbers (Hb, ESR, WBC, monocyte %) are real and
#      quoted in the lung function assay description, but the schema has no
#      whole-blood hematology output class and LungFunctionAssay's
#      hemoglobin_level slot sits on the assay, not on the per-season output
#      records - so it cannot hold two seasonal values and is left unset.
#   4. The monsoon visit is the lower-exposure reference, so it is marked
#      experimental_group: baseline (within-subject paired design, not a
#      separate control arm).
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:41469766"
  reference_title: "Seasonal impact of PM(2.5) on pro-oncogenic drivers among participants of a thermal power plant in India."
  doi: "10.1038/s41598-025-33906-7"

# =============================================================================
# PROTOCOLS
# =============================================================================
#
# qPCR and ELISA protocols are split per target: each qPCR target has its own
# primer pair (Suppl. Table 4) and each ELISA target its own antibody and
# dilution, so one id per target keeps one id denoting one protocol.
# =============================================================================

protocols:
  - id: "PROTOCOL:ghosh-spirometry-001"
    protocol_type: SpirometryProtocol
    name: "PC spirometry per American Thoracic Society guidelines"
    description: "Pulmonary function testing performed according to the American Thoracic Society (1995) guidelines by PC spirometry (SP260, Schiller, Barr, Switzerland). Measured and percent-predicted FVC, FEV1 and FEV1/FVC recorded for each participant in both seasons (N = 33). PFT camps were organised on site and the reports were read by a consultant pulmonologist."
    spirometry_standard: "American Thoracic Society (1995) guidelines"
    equipment_required:
      - "PC spirometer (SP260, Schiller, Barr, Switzerland)"

  - id: "PROTOCOL:ghosh-hematology-001"
    protocol_type: MolecularAssayProtocol
    name: "Automated hematology analyzer for total count, differential count, ESR and hemoglobin"
    description: "Hematological parameters - total count (TC), differential count (DC), erythrocyte sedimentation rate (ESR) and hemoglobin (Hb) - measured on an automated hematology analyzer (Erma PCE-210, Saitama, Japan) in anticoagulated whole blood collected in K2EDTA vacutainers."
    detection_method: "automated hematology analyzer (Erma PCE-210)"
    equipment_required:
      - "Automated hematology analyzer (Erma PCE-210, Saitama, Japan)"

  - id: "PROTOCOL:ghosh-pap-cytology-001"
    protocol_type: StainingProtocol
    name: "Papanicolaou staining and differential cytology of spontaneous sputum"
    description: "Sputum cytology by the Papanicolaou (PAP) staining method. The average number of cells (excluding squamous epithelial cells) was calculated after counting at least 10 randomly selected fields under a light microscope (CX40, Olympus/Evident, Tokyo, Japan). Samples were accepted as representative of lower airway origin when squamous epithelial cell contamination was below 20% and bronchial epithelial cells and/or alveolar macrophages were present. Alveolar macrophages, bronchial epithelial cells, neutrophils, eosinophils and lymphocytes were identified by standard cytological criteria."
    staining_type: "Papanicolaou (PAP) stain"
    detection_method: "light microscopy, at least 10 randomly selected fields per sample"
    equipment_required:
      - "Light microscope (CX40, Olympus/Evident, Tokyo, Japan)"

  - id: "PROTOCOL:ghosh-cell-isolation-001"
    protocol_type: MolecularAssayProtocol
    name: "Isolation of sputum-derived airway cells and whole-blood leukocytes"
    description: "Sputum treated with dithiothreitol and centrifuged at 1000 x g for 5-6 min at room temperature; the viscous fraction diluted in PBS and centrifuged at 3000 x g for 5-6 min to pellet airway cells, then passed through 40-um cell strainers. RNA and protein extracted with the bashing-bead method (ZR BashingBead Lysis Tubes, 0.1 and 0.5 mm, Zymo Research). Anticoagulated whole blood incubated with RBC lysis buffer for 15 min and centrifuged at 3000 x g for 5 min; the leukocyte pellet washed in PBS and re-centrifuged. Lysates prepared in RIPA buffer with phosphatase inhibitors (NaF, Na3VO4) and cOmplete Mini EDTA-free protease inhibitor cocktail (Roche). Total protein determined by Lowry's method."
    detection_method: "differential centrifugation with DTT mucolysis (sputum) and RBC lysis (blood); Lowry protein assay"
    lysis_buffer: "radioimmunoprecipitation assay (RIPA) buffer with NaF, Na3VO4 and cOmplete Mini EDTA-free protease inhibitor cocktail (Roche Diagnostics)"
    equipment_required:
      - "Refrigerated centrifuge"
      - "40-um cell strainers"
      - "ZR BashingBead Lysis Tubes (Zymo Research)"

  - id: "PROTOCOL:ghosh-zymography-mmp9-001"
    protocol_type: MolecularAssayProtocol
    name: "Gelatin zymography for pro and active MMP-9 in serum"
    description: "Serum incubated with Sepharose beads (GE Healthcare 17-0956-11) for 2-3 h and run on SDS-PAGE gels containing 0.1% gelatin (Merck Sigma Aldrich K21568978). Gels washed with 2.5% Triton X-100 (Promega H5141) for 30 min and incubated in reaction buffer A (50 mM Tris-HCl pH 8.0, 0.2 M NaCl, 5 mM CaCl2) at 37 C for 24 h, then stained with Coomassie Brilliant Blue R-250 (Merck Sigma Aldrich 42660). Bands imaged on an iBright FL1500 system and quantified with ImageJ Launcher 1.4.3.67. Serum-free medium of MDA-MB-231 served as the positive control and reaction buffer B (with 20 mM EDTA) as the negative control."
    detection_method: "gelatin zymography with Coomassie Brilliant Blue R-250 staining and ImageJ densitometry"
    equipment_required:
      - "SDS-PAGE apparatus"
      - "Gel documentation system (iBright FL1500, Thermo Fisher Scientific)"
      - "ImageJ Launcher version 1.4.3.67"

  - id: "PROTOCOL:ghosh-dcfhda-ros-001"
    protocol_type: MolecularAssayProtocol
    name: "DCFH-DA fluorescence spectrometry for intracellular ROS"
    description: "Intracellular ROS measured with 2',7'-dichlorodihydrofluorescein diacetate (DCFH-DA). A 10 mM stock in anhydrous DMSO was diluted in HEPES buffer (SRL 63732) to 10 uM DCFH-DA containing 0.1% DMSO, with a DMSO vehicle control in every assay. Cell suspensions were incubated with the diluted reagent at 37 C for 45 min and read on a Cary Eclipse Fluorescence Spectrometer (Agilent). ROS reported as mean fluorescence intensity (MFI) averaged across airway cells (N = 33) and leukocytes (N = 33), normalized to viable cell count per 10^5 cells by trypan blue exclusion, with unstained-control autofluorescence subtracted."
    detection_method: "DCFH-DA fluorescence spectrometry, mean fluorescence intensity normalized per 10^5 viable cells"
    normalization_method: "viable cell count per 10^5 cells (trypan blue exclusion); unstained-control autofluorescence subtracted"
    equipment_required:
      - "Cary Eclipse Fluorescence Spectrometer (Agilent, Santa Clara, CA, USA)"

  - id: "PROTOCOL:ghosh-annexinv-apoptosis-001"
    protocol_type: MolecularAssayProtocol
    name: "Annexin V-FITC / propidium iodide flow cytometry for apoptosis"
    description: "Airway cells and leukocytes assessed with the BD Pharmingen FITC Annexin V Apoptosis Detection Kit I (556547). Cells washed in ice-cold PBS, suspended in binding buffer, and incubated with annexin V-FITC and propidium iodide for 15 min at room temperature in the dark. Acquired on a DxFLEX flow cytometer (Beckman Coulter) with CytExpert software, 10,000 events per sample. Unstained-control autofluorescence subtracted; single-colour FITC-only and PI-only controls used for compensation and gating."
    detection_method: "annexin V-FITC / propidium iodide flow cytometry, 10,000 events per sample"
    equipment_required:
      - "DxFLEX flow cytometer (Beckman Coulter) with CytExpert software"
      - "BD Pharmingen FITC Annexin V Apoptosis Detection Kit I (556547)"

  - id: "PROTOCOL:ghosh-icc-egfr-001"
    protocol_type: ImagingProtocol
    name: "Immunocytochemistry for EGFR localization in sputum-derived airway cells"
    description: "Air-dried sputum smears fixed in 95% ethanol, washed in PBS, blocked with 1% BSA in PBST and incubated overnight at 4 C with anti-human EGFR mouse monoclonal antibody (Santa Cruz sc-373746, 1:1000 in 1% BSA/PBS), then with FITC-tagged secondary antibody (Santa Cruz sc-65218, 1:2000) and DAPI (Merck Sigma Aldrich D9542). Viewed on a fluorescence microscope (MVX10, Olympus, Tokyo, Japan). No-primary-antibody controls ruled out nonspecific and autofluorescent signal. Mean fluorescence intensity quantified with ImageJ Launcher 1.4.3.67 by region-of-interest analysis across five randomly selected fields per sample."
    fluorescent_labeling: "FITC-tagged secondary antibody (Santa Cruz sc-65218) with DAPI nuclear counterstain"
    fluorescent_tracer: "fluorescein isothiocyanate (FITC)"
    equipment_required:
      - "Fluorescence microscope (MVX10, Olympus, Tokyo, Japan)"
      - "ImageJ Launcher version 1.4.3.67"

  # --- RT-qPCR, one protocol id per target (target-specific primer pair) ---
  - id: "PROTOCOL:ghosh-qpcr-pik3ca"
    protocol_type: MolecularAssayProtocol
    name: "RT-qPCR for PIK3CA (delta-Ct against GAPDH)"
    description: "Total RNA from airway cells and leukocytes isolated with the PureLink RNA Mini Kit (12183018A) and reverse transcribed with the RevertAid RT kit (K1622); only RNA with A260/A280 between 1.8 and 2.0 was used, 2 ug reverse transcribed per reaction. PIK3CA-specific primers (Suppl. Table 4) with FastStart Essential DNA Green Master Mix (06402712001) on a LightCycler 96 (Roche). Each 15 uL reaction held 10 ng cDNA: 98 C for 10 min, then 40 cycles of 95 C for 30 s, target-specific annealing for 40 s and 72 C for 60 s, followed by melt-curve analysis. Triplicate reactions, with no-template and no-RT controls. Relative expression reported as delta-Ct (Ct_target - Ct_GAPDH); lower delta-Ct means higher transcript abundance. Results are relative, semi-quantitative trends, not fold changes."
    detection_method: "SYBR-type (FastStart Essential DNA Green) real-time qPCR on a LightCycler 96"
    normalization_method: "delta-Ct (Ct_target - Ct_GAPDH); no absolute PM2.5 = 0 control available for fold-change estimation"
    reference_gene: "GAPDH"
    platform: "LightCycler 96 system (Roche Diagnostics, Rotkreuz, Switzerland)"

  - id: "PROTOCOL:ghosh-qpcr-akt2"
    protocol_type: MolecularAssayProtocol
    name: "RT-qPCR for AKT2 (delta-Ct against GAPDH)"
    description: "As PROTOCOL:ghosh-qpcr-pik3ca but with the AKT2-specific primer pair (Suppl. Table 4)."
    detection_method: "SYBR-type (FastStart Essential DNA Green) real-time qPCR on a LightCycler 96"
    normalization_method: "delta-Ct (Ct_target - Ct_GAPDH)"
    reference_gene: "GAPDH"
    platform: "LightCycler 96 system (Roche Diagnostics, Rotkreuz, Switzerland)"

  - id: "PROTOCOL:ghosh-qpcr-mtor"
