# =============================================================================
#
# One assay per target per compartment. mRNA (delta-Ct) and protein (ELISA or
# zymography) readouts for the same target in the same compartment share one
# assay because GeneExpressionOutput carries both mrna_level and protein_level.
# Every value in this section is reported in Figs. 2-4 graphically only, so the
# output records carry group, condition and direction but no QuantityValue; the
# LMER beta estimates live in response_comparisons.
# =============================================================================

