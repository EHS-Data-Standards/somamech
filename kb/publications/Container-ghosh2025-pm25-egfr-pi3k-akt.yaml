  # --- Indirect ELISA, one protocol id per target (target-specific antibody) ---
  - id: "PROTOCOL:ghosh-elisa-ppi3k-y508"
    protocol_type: MolecularAssayProtocol
    name: "Indirect ELISA for pPI3K p85alpha Tyr508"
    description: "96-well plates coated in triplicate with 10 ug total protein per well, overnight at 4 C; blocked with 1% BSA in PBS for 1 h at 37 C; washed three times in 0.05% Tween-20/PBS with a 1-min soak. Primary antibody pPI3K p85alpha Tyr508 (Santa Cruz sc-12929, 1:1000) for 1 h at 37 C, then HRP-conjugated secondary (Santa Cruz, 1:2000) for 1 h at 37 C. TMB substrate (Merck Sigma Aldrich T444) in the dark, stopped with 1 M H2SO4, absorbance at 450 nm on an Infinite 200 PRO reader. Per-well normalization to total protein; phospho-signal specificity verified with phosphatase-treated lysates, and the phosphoprotein normalized to its total protein counterpart. Blank and no-primary-antibody wells subtracted. Intra-plate %CV 2-8%, inter-plate %CV 6-12%. Readouts are normalized relative units, not absolute concentrations."
    detection_method: "indirect ELISA, TMB substrate, absorbance at 450 nm"
    normalization_method: "per-well total protein; phosphoprotein normalized to its total protein counterpart"
    antibodies_used:
      - "pPI3K p85alpha Tyr508 (Santa Cruz Biotechnology sc-12929, 1:1000)"
      - "HRP-conjugated secondary antibody (Santa Cruz Biotechnology, 1:2000)"
    platform: "Infinite 200 PRO microplate reader (Tecan, Maennedorf, Zurich, Switzerland)"

  - id: "PROTOCOL:ghosh-elisa-pakt-s473"
    protocol_type: MolecularAssayProtocol
    name: "Indirect ELISA for pAKT Ser473"
    description: "As PROTOCOL:ghosh-elisa-ppi3k-y508 but with primary antibody pAKT Ser473 (Abclonal AP1208, 1:2000)."
