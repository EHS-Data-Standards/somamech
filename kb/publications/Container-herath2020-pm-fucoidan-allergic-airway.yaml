  - id: "OX:herath-8ohdg-serum"
    name: "8-OHdG level in serum (DNA/RNA oxidative damage ELISA)"
    description: "Serum 8-hydroxy-2'-deoxyguanosine measured as the 8-OHdG-acetylcholinesterase conjugate with a DNA/RNA oxidative damage ELISA kit (Figure 1K). 8-OHdG rose significantly over the healthy control in OVA only (81.4%), PM only (122.2%) and OVA + PM (116.8%), all p < 0.005. Fucoidans reduced serum 8-OHdG by 11.8% at both doses but the reduction was not significant, whereas prednisone reduced it by 25.7% (p < 0.05). The authors read this contrast as fucoidans and prednisone attenuating PM-induced oxidative stress through different signalling pathways. No absolute 8-OHdG concentrations are reported."
    ros_probe_type: "8-OHdG-acetylcholinesterase conjugate (DNA/RNA oxidative damage tracer) ELISA"
    evidence:
