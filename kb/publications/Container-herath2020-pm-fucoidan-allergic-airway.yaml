        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "As in the case of MDA analysis, we observed a significant increase in the serum 8-OHdG level in OVA only (by 81.4%, p < 0.005), PM only (by 122.2%, p < 0.005), and OVA + PM groups (by 116.8%, p < 0.005) compared with the healthy control."
