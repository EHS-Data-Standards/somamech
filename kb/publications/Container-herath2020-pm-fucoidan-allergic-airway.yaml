        evidence_source: MODEL_ORGANISM
        snippet: "However, fucoidan treatments attenuated the PAS positive cell proportion in the trachea compared with the OVA + PM group (by 9.1% with a low dose of fucoidan and by 36.7% with a high dose of fucoidan, p < 0.005)."
