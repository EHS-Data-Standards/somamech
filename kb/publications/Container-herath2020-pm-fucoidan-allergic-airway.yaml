  - id: "GE:herath-gr1-trachea"
    name: "Gr-1+ granulocytes in trachea sections (immunohistochemistry)"
    description: "Gr-1+ granulocytes detected by immunohistochemistry on trachea sections and counted per site in ImageJ v1.46 (Figure 5A-G, 5O). OVA + PM raised the granulocyte influx by 200.0% over the healthy control (p < 0.0005) and PM exacerbated Gr-1+ infiltration by 52.5% over OVA alone. Fucoidan reduced the influx by 36.6% at 100 mg/kg and 53.3% at 400 mg/kg, and prednisone by 55.5%. No absolute counts are reported."
    gene_expression_method: "immunohistochemistry with avidin-biotin peroxidase complex and 3,3'-diaminobenzidine; positive cells per site counted in ImageJ v1.46"
    evidence:
