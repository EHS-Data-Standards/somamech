        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The OVA + PM group (Figure 5D,O) enhanced the influx of granulocytes in the trachea significantly (by 200.0%, p < 0.0005) compared with the healthy control."
        explanation: "Gives the percent increase recorded for the OVA + PM output record of this assay against the healthy control."
