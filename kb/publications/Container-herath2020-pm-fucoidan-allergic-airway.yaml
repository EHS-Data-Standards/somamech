  - id: "KER:herath-mucin-hypersecretion-to-lung-function"
    name: "Mucin hypersecretion leads to decreased lung function"
    description: "The adverse-outcome end of the pathway. Airway hyper-responsiveness measured as Penh rose in the PM only, OVA only and OVA + PM groups and fell by 43.0% with high-dose fucoidans, alongside the fall in PAS positive cells; the paper argues the mechanism from the clinical literature - mucus plugs obstructing the airways and mediators inducing bronchoconstriction - rather than testing it, so support is weak."
