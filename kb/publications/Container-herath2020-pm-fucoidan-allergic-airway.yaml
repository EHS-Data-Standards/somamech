  - id: "GE:herath-mast-cell-degranulation-trachea"
    name: "Degranulated mast cells in trachea sections (toluidine blue)"
    description: "Degranulated mast cells counted per site on toluidine-blue-stained trachea sections in ImageJ v1.46 (Figure 9I). OVA + PM showed the highest degranulation of all groups, 133.6% above OVA alone. Fucoidan treatments reversed the PM-induced degranulation by 51.9% at 100 mg/kg and by 76.7% at 400 mg/kg (p < 0.005), and the high dose was as effective as prednisone. No absolute counts are reported."
