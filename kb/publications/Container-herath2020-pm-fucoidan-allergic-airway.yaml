        evidence_source: MODEL_ORGANISM
        snippet: "In the meantime, PM-challenged and OVA-sensitized mice (OVA + PM group) significantly increased (by 378.0%, p < 0.0005) the secretion of mucus and goblet cell hyperplasia in the lungs compared with the healthy control."
