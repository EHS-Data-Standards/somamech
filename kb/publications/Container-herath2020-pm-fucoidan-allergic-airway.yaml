  - id: "GCM:herath-pas-lung"
    name: "PAS positive cell percentage in lung sections"
    description: "Periodic acid-Schiff staining of lung sections quantified as the PAS positive cell percentage in ImageJ v1.46 (Figure 10J-P). Mucus secretion and goblet cell hyperplasia increased by 378.0% in OVA + PM relative to the healthy control (p < 0.0005), and PM induced PAS positive cells in the lungs by 49.0% over OVA alone (p < 0.005). Fucoidan treatments reduced the number of PAS positive cells by 35.2% at 100 mg/kg (p < 0.005) and by 66.8% at 400 mg/kg (p < 0.0005). The paper separately reports, without quantification, that PM exposure enhanced mucus secretion with enlarged submucosal mucous glands and that fucoidans dose-dependently reversed both (Figure 11); there is no submucosal-gland slot in this schema, so that observation is recorded here and in the goblet-to-mucin key event relationship rather than as a measurement."
