lung_function_assays:
  - id: "LF:herath-penh-methacholine"
    name: "Airway resistance (Penh) under methacholine challenge"
    description: "Enhanced pause (Penh) measured by whole-body plethysmography 24 h after the final PM challenge, with nebulised methacholine at 0, 12.5, 25 and 50 mg/mL and readings averaged over 3 min (Figure 2A). At the high methacholine concentration (50 mg/mL) the PM only, OVA only and OVA + PM groups all showed significantly increased airway hyper-responsiveness over the healthy control (p < 0.0005); PM exacerbated OVA-induced hyper-responsiveness by 20.7% (p < 0.05); and high-dose fucoidans attenuated the PM-exacerbated hyper-responsiveness by 43.0% (p < 0.0005), similarly to prednisone. Penh is a dimensionless plethysmography index rather than a spirometric volume or a measured resistance, and the paper reports it only as figure curves, so no magnitude is recorded in the output records."
    evidence:
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The PM only, OVA only, and OVA + PM groups showed significant (p < 0.0005) increases in airway hyper-responsiveness compared with the healthy control when exposed to a high concentration of methacholine (50 mg/mL)."
        explanation: "States the increase in airway hyper-responsiveness recorded in the PM only, OVA only and OVA + PM output records of this assay."
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Moreover, PM exacerbated OVA-induced airway hyper-responsiveness (by 20.7%, p < 0.05)."
        explanation: "Gives the percent increase recorded for the OVA + PM output record of this assay against the OVA only group."
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "More importantly, the group that received a high dose of fucoidans had markedly attenuated (by 43.0%, p < 0.0005) PM-exacerbated airway hyper-responsiveness compared with OVA + PM (with 50 mg/mL methacholine)."
        explanation: "Gives the percent reduction recorded for the 400 mg/kg fucoidan output record of this assay against OVA + PM."
