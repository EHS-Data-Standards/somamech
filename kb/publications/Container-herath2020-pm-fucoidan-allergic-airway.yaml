        evidence_source: MODEL_ORGANISM
        snippet: "We observed a 36.6% reduction with low-dose fucoidan treatment (Figure 5E,O) and a 53.3% reduction with high-dose fucoidan treatment (Figure 5F,O) compared with OVA + PM."
