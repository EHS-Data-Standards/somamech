    description: "Total serum IgE measured by ELISA (Figure 8A). Total IgE increased by 280.1% in OVA + PM over the healthy control (p < 0.05), and PM augmented the serum IgE level of OVA-sensitised mice by 68.3% over OVA alone (p < 0.05). High-dose fucoidan treatment attenuated the PM-exacerbated level considerably, by 33.2% (p < 0.005), though the paper notes fucoidans were not as effective as prednisone. No absolute IgE concentrations are reported."
