  - id: "GE:herath-cytokines-lung"
    name: "IL-4, IL-17a and IL-33 in lung homogenate (ELISA)"
    description: "IL-4, IL-17a and IL-33 measured by ELISA in lung homogenate supernatant (Figure 12G-I). IL-4 was significantly increased in OVA + PM over the healthy control (p < 0.05) and attenuated by high-dose fucoidans (p < 0.05); IL-17a was appreciably increased and attenuated without reaching significance; IL-33 was significantly increased in the lungs of OVA + PM mice and attenuated by high-dose fucoidan, which the authors read as contributing to the attenuated Th2 response. No absolute concentrations are reported."
