goblet_cell_assays:
  - id: "GCM:herath-pas-trachea"
    name: "PAS positive cell percentage in trachea sections"
    description: "Periodic acid-Schiff staining of trachea sections, counterstained with 0.5% methyl green, quantified as the PAS positive cell percentage in ImageJ v1.46 (Figure 10). Goblet cell hyperplasia and mucus secretion increased by 287.5% in OVA + PM relative to the healthy control (p < 0.0005); the PM only and OVA only groups also showed elevated PAS positive cells, but the highest proportion was in OVA + PM. Fucoidan treatments attenuated the PAS positive cell proportion by 9.1% at 100 mg/kg and by 36.7% at 400 mg/kg (p < 0.005). The paper gives no absolute percentages, so the stated changes live in response_comparisons."
    evidence:
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PAS staining of the trachea showed significant increases (by 287.5%, p < 0.0005) in goblet cell hyperplasia and mucus secretion in the OVA + PM group compared with the healthy control, confirming the presence of severe airway inflammation."
        explanation: "Gives the percent increase recorded for the OVA + PM output record of this assay against the healthy control."
      - reference: "PMID:32580518"
