    evidence:
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PM exposure, as well as OVA, significantly (p < 0.05) enhanced the level of MDA (increased by 88.4% in PM only, by 88.6% in OVA, by 89.5% in OVA + PM) compared with a healthy control."
