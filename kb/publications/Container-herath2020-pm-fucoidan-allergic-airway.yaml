# =============================================================================
# KEY EVENT RELATIONSHIPS
#
# The pathway this paper supports: inhaled PM raises oxidative stress, which
# drives airway inflammation, which drives goblet cell hyperplasia and mucin
# hypersecretion, ending in impaired airway function - with a systemic
# inflammatory arm (serum immunoglobulins and cytokines) running alongside the
# airway one. Every key event is one that already exists on main; none is
# minted here. Support is moderate where the paper measured both sides in the
# same animals and weak where it argues the step from the literature.
# =============================================================================

key_event_relationships:
  - id: "KER:herath-oxidative-stress-to-airway-inflammation"
    name: "Increased oxidative stress leads to airway inflammation"
    description: "The paper's framing of its own exposure arm: PM inhalation triggers oxidative stress, which drives the inflammation that then sustains airway injury. The oxidative markers (lung and serum MDA, serum 8-OHdG) and the inflammatory endpoints (BALF differential, eosinophil, granulocyte, macrophage and CD4+ T cell infiltration) rose together in the same animals, and oral fucoidans lowered both. The causal step itself is argued from the literature rather than tested here - there is no antioxidant-only arm that would separate the oxidative stress from the inflammation - so the support is recorded as moderate."
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    relationship_type: "indirectly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Exposure to PM initially triggers oxidative stress, and the oxidative stress further leads to lipid peroxidation."
        explanation: "States the upstream event of this relationship and the lipid-peroxidation readout through which the paper measures it."
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Since prolonged inflammation is a vital mechanism in the development of pulmonary diseases, PM inhalation and subsequent ROS generation pose a serious risk at all stages of airway injury."
        explanation: "The authors' statement linking PM-induced ROS generation to inflammation and airway injury, the downstream side of this relationship."

  - id: "KER:herath-airway-inflammation-to-systemic-inflammation"
    name: "Airway inflammation is accompanied by increased systemic inflammation"
    description: "The same exposure that raised airway inflammatory endpoints also raised serum total IgE, OVA-specific IgE and IgG1, serum IL-4 and serum IL-17a, and high-dose fucoidans lowered both sets together. The paper measures the airway and systemic compartments in parallel without testing which drives which, so this is recorded as an association with weak support rather than a causal step."
    upstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    downstream_event:
      id: "KE:ke-systemic-inflammation"
      name: "Increased systemic inflammation"
      biological_action: increased
      level_of_biological_organization: organism
    relationship_type: "associated with"
    evidence_support: weak
    evidence:
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Consistently, high-dose fucoidan (400 mg/kg) treatment was as effective as prednisone for reducing the serum IgE level, a hallmark of the pathogenesis of Th2-mediated allergic airway inflammation."
        explanation: "Ties the systemic readout of this relationship - serum IgE - to the airway inflammation the paper is characterising, as the authors themselves frame it."
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "These results suggest that fucoidans might exert their therapeutic efficacy against PM-exacerbated allergic airway inflammation via attenuating the Th2 immune response."
        explanation: "The authors' reading of the systemic Th2 cytokine and immunoglobulin results alongside the airway results, which is the association this relationship records."

  - id: "KER:herath-airway-inflammation-to-goblet-hyperplasia"
    name: "Airway inflammation leads to goblet cell hyperplasia"
    description: "The paper states its own causal reading explicitly: the goblet cell hyperplasia and increased mucus secretion seen in PM-exposed mice are taken to be a consequence of the PM-exacerbated Th2/Th17 response and macrophage infiltration. Both sides were measured in the same animals - the inflammatory cell infiltration by BALF differential and immunohistochemistry, the hyperplasia by PAS staining of trachea and lung - and both fell together under fucoidan treatment."
    upstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    downstream_event:
      id: "KE:ke2-goblet-hyperplasia"
