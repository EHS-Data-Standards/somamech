    description: "CD4+ T cells detected by immunohistochemistry on trachea sections and counted per site in ImageJ v1.46 (Figure 7A-G, 7O). CD4+ T cells increased by 64.1% in OVA + PM over the healthy control (p < 0.005), and fell dose-dependently with fucoidan treatment, by 15.4% at 100 mg/kg and by 56.4% at 400 mg/kg (p < 0.05). No absolute counts are reported."
