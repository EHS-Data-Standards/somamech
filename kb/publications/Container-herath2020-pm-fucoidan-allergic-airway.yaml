        evidence_source: MODEL_ORGANISM
        snippet: "Groups that received a high dose of fucoidans had significantly (p < 0.05) attenuated PM-exacerbated infiltration of inflammatory cells; eosinophils, neutrophils, and lymphocytes in BALF."
        explanation: "States the reduction in eosinophils, neutrophils and lymphocytes recorded in the 400 mg/kg fucoidan output record of this assay."
