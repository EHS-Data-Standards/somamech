        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "One hallmark of asthma is the hyperproduction of mucus in response to inflammatory provocation, and we performed PAS staining to examine goblet cell hyperplasia and mucus secretion (Figure 10)."
        explanation: "Names the measurement behind the downstream event of this relationship and the inflammatory provocation that the paper places upstream of it."

  - id: "KER:herath-goblet-hyperplasia-to-mucin-hypersecretion"
    name: "Goblet cell hyperplasia leads to mucin hypersecretion"
    description: "PAS staining measured goblet cell hyperplasia and mucus secretion as one endpoint in both trachea and lung, and the paper separately reports that PM exposure enhanced mucus secretion with enlarged submucosal mucous glands, which fucoidans dose-dependently reversed (Figure 11). The submucosal gland observation is the paper's only separate evidence for the secretory side and is qualitative, with no score or magnitude, so this relationship is recorded with weak support."
