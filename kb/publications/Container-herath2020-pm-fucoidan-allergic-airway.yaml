# =============================================================================
# INFLAMMATORY CELL INFILTRATION, IMMUNOGLOBULINS AND CYTOKINES
#
# Recorded as gene_expression_assays because that is the only assay class in
# this schema with slots for an immunohistochemical positive-cell count
# (percentage_positive_cells) and for a protein concentration measured by
# ELISA (protein_level). The class is annotated in_vitro_only, but the same
# pattern is already used for in vivo subjects on main (li2021 rat lung,
# oluwole2013 human serum CRP).
# =============================================================================

gene_expression_assays:
  - id: "GE:herath-eosinophils-trachea"
    name: "Congo red positive eosinophils in trachea sections"
    description: "Eosinophils stained with Congo red on trachea sections and counted per site in ImageJ v1.46 (Figure 4A-G, 4O). PM increased eosinophil infiltration in the trachea of OVA-sensitised mice by 500.0% over the healthy control (p < 0.0005), and OVA + PM exceeded OVA alone by 56.4% (p < 0.005). Fucoidan treatments attenuated the PM-exacerbated infiltration dose-dependently, by 52.0% at 100 mg/kg and by 72.0% at 400 mg/kg. The paper reports eosinophil counts only as figure bars, so no magnitude is recorded."
    gene_expression_method: "Congo red staining with 0.5% methyl green counterstain; eosinophils per site counted in ImageJ v1.46"
    evidence:
      - reference: "PMID:32580518"
