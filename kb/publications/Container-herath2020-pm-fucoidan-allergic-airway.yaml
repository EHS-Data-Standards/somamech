    name: "Inflammatory cell differential in BALF (Diff Quick)"
    description: "Differential counts of macrophages, eosinophils, neutrophils, lymphocytes and basophils on methanol-fixed BALF smears stained with a Diff Quick kit (Figure 2B). High-dose fucoidans significantly attenuated the PM-exacerbated infiltration of eosinophils, neutrophils and lymphocytes (p < 0.05), and attenuated neutrophil infiltration more effectively than prednisone did; the macrophage and basophil counts fell dose-dependently but not significantly. The paper reports the counts as figure bars with no numbers, so no magnitude is recorded. The H&E inflammatory activity grade of trachea and lung sections (Figure 3O, 3P) corroborates the same key event but has no assay class in this schema; its result is quoted here as the second evidence item."
    evidence:
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
