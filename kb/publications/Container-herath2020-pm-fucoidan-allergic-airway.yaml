# =============================================================================
# Herath et al. (2020) - The Role of Fucoidans Isolated from the Sporophylls of
# Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway
# Inflammation: Evidence of the Attenuation of Oxidative Stress and
# Inflammatory Responses
#
# Molecules. 2020;25(12):2869 - doi:10.3390/molecules25122869 (gold OA)
#
# Focus of this extraction: what inhaled particulate matter does to an
# ovalbumin-sensitised mouse airway - oxidative stress, inflammatory cell
# influx, immunoglobulin and cytokine response, mucus hypersecretion and
# airway hyper-responsiveness - and how far oral fucoidans reverse each step.
#
# Study design as reported (in vivo only; no in vitro arm):
#   Animals  - Female Balb/c mice, 20-25 g, 7-8 weeks old (OrientBio, Sungnam,
#              Korea), n = 7 per group, seven groups.
#   Groups   - healthy control; PM only; OVA only; OVA + PM;
#              OVA + PM + fucoidans 100 mg/kg; OVA + PM + fucoidans 400 mg/kg;
#              OVA + PM + prednisone 5 mg/kg.
#   Model    - OVA 10 ug in 200 uL saline with 2 mg Al(OH)3 intraperitoneally;
#              two weeks later, nebulised PM 5 mg/m3 for 30 min/day on 7
#              consecutive days, with fucoidans or prednisone by oral gavage
#              on the same days. Mice sacrificed one day after the final PM
#              exposure (day 22).
#   PM       - certified reference material (CRM) No. 28 urban aerosol (NIES,
#              Japan); the majority of the PM was <2.5 um in diameter and the
#              sample contained polycyclic aromatic hydrocarbons and heavy
#              metals such as Pb and Ba.
#
# IMPORTANT ON NUMBERS: this paper reports every endpoint graphically and then
# states, in the text, the PERCENT CHANGE of each group relative to a named
# comparator together with a significance threshold (p < 0.05 / 0.005 /
# 0.0005). It gives no absolute group means, no SDs and no per-figure sample
# sizes. So the output records here carry their experimental group and the
# condition they were measured under but no measurement magnitudes, and every
# number the paper states lives in a `response_comparisons:` entry as a
# `percent_change` with `derivation: reported_in_paper`. Where the paper states
# only a direction ("dose-dependently attenuated"), the comparison carries
# `change_direction` with no `change_type` and no `change_value`.
#
# `p_value` is omitted throughout: the paper reports significance thresholds,
# not p-values, and a threshold is not a p-value. Each threshold is recorded in
# the description of the entry it belongs to. The one exception worth flagging
# is the lung CD4+ T cell comparison of OVA + PM against OVA alone, which the
# paper reports at "p < 0.09" - i.e. NOT significant at the 0.05 level the
# paper itself sets; its description says so.
#
# TWO ENDPOINTS HAVE NO HOME IN THE SCHEMA and are therefore recorded only in
# descriptions, not as assays:
#   - the H&E histopathological inflammation grade of trachea and lung
#     (Figure 3O, 3P, a 0-4 ordinal score). There is no histopathology-score
#     assay class, and the score is not a cell count, cytokine or function
#     measure. The quote stating its result is attached to the BALF
#     inflammatory-cell differential, whose key event it corroborates.
#   - the enlargement of submucosal mucous glands (Figure 11), which is
#     recorded in the description of the lung PAS assay and in the
#     goblet-hyperplasia-to-mucin-hypersecretion key event relationship.
#
# KEY EVENT BLOCKS are copied verbatim from the wordings already on main.
# Where an id carries more than one wording there, the majority variant whose
# name matches its id was taken: "Airway inflammation" (6 blocks) over "Th2
# airway inflammation" (1), and "Goblet cell hyperplasia" (24) over "Goblet
# cell hyperplasia and mucin hypersecretion" (2).
# =============================================================================

source_publication:
  reference: "PMID:32580518"
  reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
  doi: "10.3390/molecules25122869"

# =============================================================================
# PROTOCOLS
#
# Immunohistochemistry and ELISA each ran against several different targets
# with different antibodies, dilutions and kits, so each target gets its own
# protocol id rather than one shared id (issue #131): one id must denote one
# protocol, or every consumer keyed on id keeps one variant and drops the rest.
# =============================================================================

protocols:
  - id: "PROTOCOL:herath-mouse-model-001"
    name: "PM-exacerbated mouse model of allergic airway inflammation"
    description: "Mice (n = 7 per group) randomly divided into seven groups: healthy control, PM only, OVA only, OVA + PM, OVA + PM + fucoidans (100 mg/kg), OVA + PM + fucoidans (400 mg/kg), and OVA + PM + prednisone (5 mg/kg). Mice in the OVA induction groups were sensitised with OVA (10 ug) dissolved in 200 uL saline and 2 mg Al(OH)3 by intraperitoneal injection. Two weeks after sensitisation, mice in groups other than the healthy control and OVA only groups were nebulised with PM (5 mg/m3, 30 min/day) daily for 7 consecutive days. Together with PM exposure the PM-exposed mice were orally gavaged with either a low dose (100 mg/kg) or high dose (400 mg/kg) of fucoidans, or prednisone (5 mg/kg), suspended in saline; other groups were orally administered saline. The protocol follows a previously described model with minor modifications. Fucoidans were supplied by Haewon Biotech Co., Ltd. (Seoul, Korea). PM was certified reference material (CRM) No. 28 urban aerosol from the National Institute for Environmental Studies (NIES), Japan, the majority of which was <2.5 um in diameter. Animal experiments were performed in accordance with the Guidelines for the Care and Use of Laboratory Animals of the Institutional Ethical Committee of Jeju National University."
    quality_control_criteria: "Mice randomly allocated to the seven groups; healthy control and OVA only groups were not nebulised with PM, and all non-treatment groups received oral saline so that gavage itself was matched across groups."

  - id: "PROTOCOL:herath-tissue-prep-001"
    name: "Trachea and lung fixation, embedding and sectioning"
    description: "Mice were sacrificed one day after the final exposure to PM (day 22) and lung and trachea sections were fixed in 10% formalin. After fixation, samples were embedded in paraffin and sectioned at 3 um onto coated glasses."

  - id: "PROTOCOL:herath-lung-homogenate-001"
    name: "Lung tissue homogenisation for lipid peroxidation and cytokine assays"
    description: "Lung tissues homogenised using a tacoPrep bead beater (GeneReach Biotechnology Co., Taichung City, Taiwan) in RIPA buffer containing protease inhibitors (2 mM Na3VO4, 1 mM PMSF, 10 ug/mL aprotinin, 10 ug/mL leupeptin). The homogenate was centrifuged at 3000x g for 10 min at 4 C and the supernatant used for assay; protein concentration in the supernatant was measured by the Bradford protein assay method."

  - id: "PROTOCOL:herath-serum-prep-001"
    name: "Serum separation from cardiac-puncture blood"
    description: "Blood was collected from anaesthetised mice on day 22 via cardiac puncture using a heparinised syringe. Serum was separated from blood cells by centrifuging the collected blood at 12,000 rpm for 10 min at 4 C."

  - id: "PROTOCOL:herath-balf-collection-001"
    name: "Bronchoalveolar lavage fluid collection"
    description: "1 mL of DPBS was instilled into the lungs (intra-tracheal) using a cannula and BALF gently collected. For differential cell counts the collected BALF was centrifuged at 300x g for 5 min at 4 C and the supernatant separated for cytokine analysis; for the cytokine ELISAs reported in the Methods the collected BALF was centrifuged at 12,000 rpm for 10 min at 4 C and the supernatant analysed."

  - id: "PROTOCOL:herath-mda-lung-001"
    name: "Thiobarbituric acid assay for lipid peroxidation in lung homogenate"
    description: "An equal amount of protein from the lung homogenate supernatant was mixed with 10% (w/v) trichloroacetic acid and incubated for 10 min at 4 C. After centrifuging at 2000x g for 15 min at 4 C the resulting supernatant was reacted with an equal volume of 0.67% (w/v) thiobarbituric acid in a heating block for 10 min. The supernatant was separated by centrifuging at 2000x g for 15 min at 4 C and its absorbance measured at 532 nm using a microplate reader. The malondialdehyde (MDA) content in the samples was measured with the predetermined MDA standard curve."
    equipment_required:
      - "tacoPrep bead beater (GeneReach Biotechnology Co., Taichung City, Taiwan)"
      - "Microplate reader, absorbance at 532 nm"

  - id: "PROTOCOL:herath-mda-serum-001"
    protocol_type: MolecularAssayProtocol
    name: "Lipid peroxidation assay kit for serum malondialdehyde"
    description: "The MDA level in mouse serum was measured using a lipid peroxidation assay kit following the manufacturer's instructions. MDA activity was measured at the micromolar level based on the standard curve using a colorimetric assay."
    detection_method: "Colorimetric lipid peroxidation assay kit, quantified against an MDA standard curve"

  - id: "PROTOCOL:herath-elisa-8ohdg"
    protocol_type: MolecularAssayProtocol
    name: "DNA/RNA oxidative damage ELISA for serum 8-OHdG"
    description: "Serum 8-OHdG-acetylcholinesterase conjugate (DNA/RNA oxidative damage tracer) measured with the DNA/RNA oxidative damage ELISA kit (Cayman Chemicals, Ann Arbor, MI, USA) following the manufacturer's recommendations."
    detection_method: "DNA/RNA oxidative damage ELISA kit (Cayman Chemicals)"

  - id: "PROTOCOL:herath-plethysmography-001"
    protocol_type: SpirometryProtocol
    name: "Whole-body plethysmography with methacholine challenge"
    description: "After 24 h of the final challenge with PM the mice were nebulised with different concentrations of methacholine (0, 12.5, 25, 50 mg/mL) for 10 min in a whole body chamber. Immediately after each nebulisation the enhanced pause (Penh) was measured in a plethysmography chamber (Allmedicus, Anyang, Korea). The readings were averaged for a 3 min period."
    spirometry_standard: "Enhanced pause (Penh) in a plethysmography chamber (Allmedicus, Anyang, Korea)"
    bronchodilator_agent: "acetyl-beta-methylcholine (methacholine) aerosol challenge at 0, 12.5, 25 and 50 mg/mL"
    plethysmography_method: "whole-body plethysmography, readings averaged over 3 min"

  - id: "PROTOCOL:herath-balf-diffquick-001"
    protocol_type: StainingProtocol
    name: "Diff Quick differential cell count on BALF smears"
    description: "The collected BALF was centrifuged (300x g, 5 min, at 4 C) and the supernatant separated for cytokine analysis. The cells were fixed in methanol and smears prepared on glass slides. The smears were stained with a Diff Quick staining kit (Sysmex Corporation, Kobe, Japan) and the cell compositions of macrophages, eosinophils, neutrophils, lymphocytes and basophils determined using a microscope with an Olympus DP-72 microscope camera (Olympus, Tokyo, Japan)."
    staining_type: "Diff Quick"
    fixation_method: "methanol-fixed smears"
    detection_method: "Light microscopy with Olympus DP-72 camera; differential count of macrophages, eosinophils, neutrophils, lymphocytes and basophils"

  - id: "PROTOCOL:herath-he-001"
    protocol_type: StainingProtocol
    name: "Haematoxylin and eosin staining with inflammation grading"
    description: "Tissue sections were stained with haematoxylin and eosin (H&E) and observed under a light microscope (Olympus, Tokyo, Japan) for histopathological examinations. Inflammation in trachea and lung sections was scored as follows: 0, normal; 1, few inflammatory cells infiltrated; 2, observed inflammatory cells one cell layer deep; 3, observed inflammatory cells 2-4 cell layers deep; and 4, infiltrated inflammatory cells of more than four cell layers deep."
    staining_type: "H&E"
    fixation_method: "10% formalin, paraffin embedding, 3 um sections"
    detection_method: "Light microscopy; ordinal 0-4 inflammatory activity grade"

  - id: "PROTOCOL:herath-congored-001"
    protocol_type: StainingProtocol
    name: "Congo red staining for eosinophil infiltration"
    description: "Infiltration of eosinophils in the lung and trachea tissue sections was confirmed by Congo red staining. Deparaffinised tissues were immersed in Congo red working solution for 30 min, washed in running tap water and counterstained with 0.5% methyl green. Stained sections were observed under a microscope and representative areas captured using an Olympus DP-72 microscope camera (Olympus, Tokyo, Japan). The number of Congo red stained eosinophils per site from at least three sites of each section (3 sections were taken from each mouse) was quantified using ImageJ (v1.46) software."
    staining_type: "Congo red"
    counterstain: "0.5% methyl green"
    detection_method: "Light microscopy; eosinophils per site counted in ImageJ v1.46 from at least three sites per section, three sections per mouse"
    replicate_requirements: 3

  - id: "PROTOCOL:herath-toluidine-001"
    protocol_type: StainingProtocol
    name: "Toluidine blue staining for mast cell count and degranulation"
    description: "Mast cell infiltration in the trachea was evaluated using toluidine blue staining. Deparaffinised trachea sections were immersed in 0.5% toluidine blue solution and counterstained with 0.5% methyl green. Stained sections were observed under a microscope and representative areas captured using an Olympus DP-72 microscope camera (Olympus, Tokyo, Japan). The number of mast cells per site and the number of degranulated mast cells per site from at least three sites of each section (3 sections were taken from each mouse) were quantified using ImageJ (v1.46) software."
    staining_type: "toluidine blue"
    counterstain: "0.5% methyl green"
    detection_method: "Light microscopy; mast cells per site and degranulated mast cells per site counted in ImageJ v1.46"
    replicate_requirements: 3

  - id: "PROTOCOL:herath-pas-001"
    protocol_type: StainingProtocol
    name: "Periodic acid-Schiff staining for goblet cells and mucus secretion"
    description: "Trachea and lung sections were stained with periodic acid-Schiff (PAS) and counterstained with 0.5% methyl green to evaluate goblet cell metaplasia and mucus secretion. The PAS-positive cell percentage from at least three sites of each section (3 sections were taken from each mouse) was quantified using ImageJ (v1.46) software."
    staining_type: "PAS"
    counterstain: "0.5% methyl green"
    detection_method: "Light microscopy; PAS-positive cell percentage quantified in ImageJ v1.46"
    replicate_requirements: 3

  - id: "PROTOCOL:herath-ihc-mda"
    protocol_type: StainingProtocol
    name: "Immunohistochemistry for malondialdehyde adducts"
    description: "Trachea and lung sections on glass slides were de-paraffinised in a xylene series and rehydrated in an ethanol series. Nonspecific binding was blocked by immersing tissues in 0.3% hydrogen peroxide with rabbit or horse serum for 30 min. Following blocking, tissues were incubated with MDA antibody (1:400) overnight at 4 C. After washing, tissues were incubated with biotinylated anti-rabbit IgG for 45 min followed by treatment with an avidin-biotin peroxidase complex using the Vectastain Elite ABC kit (Vector Inc., Burlingame, CA, USA). HRP binding sites were detected with 3,3'-diaminobenzidine (DAB, Vector Inc.). Images were captured using an Olympus DP-72 microscope camera (Olympus, Tokyo, Japan). The number of positive cells per site from at least three sites of each section (3 sections were taken from each mouse) was acquired with ImageJ (v1.46) software."
    staining_type: "immunohistochemistry"
    antibodies_used:
      - "anti-malondialdehyde antibody (abcam, Cambridge, UK), 1:400"
      - "biotinylated anti-rabbit IgG, 45 min"
    detection_method: "Avidin-biotin peroxidase complex (Vectastain Elite ABC kit) with 3,3'-diaminobenzidine; positive cells per site counted in ImageJ v1.46"
    replicate_requirements: 3

  - id: "PROTOCOL:herath-ihc-gr1"
    protocol_type: StainingProtocol
    name: "Immunohistochemistry for Gr-1+ granulocytes"
    description: "As for the MDA immunohistochemistry protocol, with mouse Gr-1 antibody (1:200) as the overnight primary antibody and biotinylated anti-rat IgG as the secondary antibody."
    staining_type: "immunohistochemistry"
    antibodies_used:
      - "mouse Gr-1 antibody (R&D Systems, Minneapolis, MN, USA), 1:200"
      - "biotinylated anti-rat IgG, 45 min"
    detection_method: "Avidin-biotin peroxidase complex (Vectastain Elite ABC kit) with 3,3'-diaminobenzidine; positive cells per site counted in ImageJ v1.46"
    replicate_requirements: 3

  - id: "PROTOCOL:herath-ihc-f480"
    protocol_type: StainingProtocol
    name: "Immunohistochemistry for F4/80+ macrophages"
    description: "As for the MDA immunohistochemistry protocol, with purified anti-mouse F4/80 antibody (1:200) as the overnight primary antibody and biotinylated anti-rat IgG as the secondary antibody."
    staining_type: "immunohistochemistry"
    antibodies_used:
      - "purified anti-mouse F4/80 antibody (BioLegend, San Diego, CA, USA), 1:200"
      - "biotinylated anti-rat IgG, 45 min"
    detection_method: "Avidin-biotin peroxidase complex (Vectastain Elite ABC kit) with 3,3'-diaminobenzidine; positive cells per site counted in ImageJ v1.46"
    replicate_requirements: 3

  - id: "PROTOCOL:herath-ihc-cd4"
    protocol_type: StainingProtocol
    name: "Immunohistochemistry for CD4+ T lymphocytes"
    description: "As for the MDA immunohistochemistry protocol, with anti-CD4 antibody (1:400) as the overnight primary antibody."
    staining_type: "immunohistochemistry"
    antibodies_used:
      - "CD4 antibody (Novus Biologicals, LLC, USA), 1:400"
    detection_method: "Avidin-biotin peroxidase complex (Vectastain Elite ABC kit) with 3,3'-diaminobenzidine; positive cells per site counted in ImageJ v1.46"
    replicate_requirements: 3

  - id: "PROTOCOL:herath-elisa-total-ige"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for total serum IgE"
    description: "Total IgE in serum measured with an ELISA kit (Bethyl Lab, Montgomery, TX, USA) following the manufacturer's recommendations."
    detection_method: "ELISA, total IgE kit (Bethyl Lab, Montgomery, TX, USA)"

  - id: "PROTOCOL:herath-elisa-ova-ige"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for OVA-specific serum IgE"
    description: "OVA-specific IgE in serum measured with an ELISA kit (BioLegend, San Diego, CA, USA) following the manufacturer's recommendations."
    detection_method: "ELISA, OVA-specific IgE kit (BioLegend, San Diego, CA, USA)"

  - id: "PROTOCOL:herath-elisa-ova-igg1"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for OVA-specific serum IgG1"
    description: "OVA-specific IgG1 measured with an ELISA kit (Cayman Chemicals, Ann Arbor, MI, USA) on serum diluted 1:2000, following the manufacturer's recommendations."
    detection_method: "ELISA, OVA-specific IgG1 kit (Cayman Chemicals); serum diluted 1:2000"

  - id: "PROTOCOL:herath-elisa-ova-igg2a"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for OVA-specific serum IgG2a"
    description: "OVA-specific IgG2a measured with an ELISA kit (BioLegend, San Diego, CA, USA) following the manufacturer's recommendations."
    detection_method: "ELISA, OVA-specific IgG2a kit (BioLegend, San Diego, CA, USA)"

  - id: "PROTOCOL:herath-elisa-cytokines"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for IL-4, IL-17a and IL-33 in serum, BALF and lung homogenate"
    description: "IL-4 and IL-17a measured with ELISA kits from BioLegend (San Diego, CA, USA) and IL-33 with the Mouse IL-33 ELISA kit (Invitrogen, Thermo Fisher Scientific, Waltham, MA, USA), each following the manufacturer's recommendations. The same three kits were applied to serum, to BALF supernatant and to lung homogenate supernatant."
    detection_method: "ELISA; IL-4 and IL-17a kits (BioLegend), Mouse IL-33 kit (Invitrogen)"

# =============================================================================
# OXIDATIVE STRESS - lung immunohistochemistry, lung homogenate, serum
# =============================================================================

oxidative_stress_assays:
  - id: "OX:herath-mda-ihc-lung"
    name: "MDA positive cell percentage in lung sections (immunohistochemistry)"
    description: "Malondialdehyde adducts stained by immunohistochemistry on 3 um lung sections and quantified as the MDA positive cell percentage (Figure 1A-H). PM exposure as well as OVA significantly enhanced the MDA positive cell percentage in the PM only, OVA only and OVA + PM groups relative to the healthy control (p < 0.0005), and fucoidans dose-dependently attenuated it relative to OVA + PM. The paper reports this endpoint as images plus a bar chart with no absolute percentages, so no magnitude is recorded; the two directions it states are in response_comparisons without a change value."
    ros_probe_type: "anti-malondialdehyde antibody immunohistochemistry (MDA protein adducts)"
    evidence:
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PM exposure as well as OVA significantly (p < 0.0005) enhanced the MDA positive cell percentage in PM only, OVA only, and OVA + PM compared to a healthy control."
        explanation: "States the increase this assay records in the PM only, OVA only and OVA + PM output records relative to the healthy control."
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Fucoidans dose-dependently attenuated the MDA positive cell percentage in the lungs compared with OVA + PM."
        explanation: "States the dose-dependent reduction recorded in the two fucoidan output records of this assay."
    has_exposure_condition:
