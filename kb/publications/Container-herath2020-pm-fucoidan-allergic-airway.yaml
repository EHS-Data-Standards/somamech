        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Despite having significant pulmonary allergic inflammation, we observed goblet cell hyperplasia and increased mucus secretion in PM-exposed mice, and we believe this is a consequence of the PM-exacerbated activation of the Th2/Th17 response and macrophage infiltration [41]."
