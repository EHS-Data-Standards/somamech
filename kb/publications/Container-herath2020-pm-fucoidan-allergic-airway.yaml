  - id: "GE:herath-eosinophils-lung"
    name: "Congo red positive eosinophils in lung sections"
    description: "Eosinophils stained with Congo red on lung sections and counted per site in ImageJ v1.46 (Figure 4H-N, 4P). The highest infiltration was in OVA + PM: 566.6% above the healthy control (p < 0.0005) and 74.0% above OVA only (p < 0.005). Fucoidan attenuated eosinophil infiltration dose-dependently, by 45.0% at 100 mg/kg and by 65.0% at 400 mg/kg, and the high dose was as effective as prednisone. No absolute counts are reported."
