# =============================================================================
# CHANGES VS CONTROL THAT THE PAPER STATES
#
# Every entry is a percentage the paper states in its own text, recorded with
# `change_type: percent_change` and `derivation: reported_in_paper`. Four
# entries carry a direction only - the MDA immunohistochemistry pair and the
# BALF differential comparisons - because the paper states those directions
# without a magnitude. `p_value` is omitted throughout: the paper reports
# significance thresholds, not p-values, and each threshold is named in the
# entry's description.
# =============================================================================

response_comparisons:
  - id: "COMP:herath-mda-ihc-ova-pm-vs-control"
    name: "MDA positive cell percentage in lung, OVA + PM vs healthy control"
    description: "PM exposure as well as OVA significantly enhanced the MDA positive cell percentage in the lungs relative to the healthy control. Reported significance threshold: p < 0.0005. The paper states no magnitude for this change, so change_type and change_value are omitted."
    derived_from_assay: "OX:herath-mda-ihc-lung"
    compared_measurement: "lipid_peroxidation"
    control_output: "OX:herath-mda-ihc-lung-output-control"
    treated_output: "OX:herath-mda-ihc-lung-output-ova-pm"
    change_direction: increased
    statistical_test: "one-way analysis of variance followed by Tukey's multiple comparison test"
    derivation: reported_in_paper

