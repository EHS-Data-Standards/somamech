  - id: "GE:herath-cd4-lung"
    name: "CD4+ T lymphocytes in lung sections (immunohistochemistry)"
    description: "CD4+ T cells detected by immunohistochemistry on lung sections and counted per site in ImageJ v1.46 (Figure 7H-N, 7P). CD4+ T cell infiltration rose 197.8% in OVA + PM over the healthy control. The paper also reports that PM exacerbated OVA-induced CD4+ T cell infiltration by 24.5% over OVA alone at p < 0.09 - which does not meet the paper's own 0.05 significance criterion, so that comparison is recorded as not significant. High-dose fucoidan reduced CD4+ T cell infiltration by 59.1% relative to OVA + PM (p < 0.0005), similarly to prednisone. No absolute counts are reported."
