    evidence:
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The level of IL-17a was also appreciably increased in the serum (Figure 12B), BALF (Figure 12E), and lungs (Figure 12H) of the OVA + PM group compared with the healthy control."
        explanation: "States the lung IL-17a increase recorded in the OVA + PM output record of this assay."
      - reference: "PMID:32580518"
        reference_title: "The Role of Fucoidans Isolated from the Sporophylls of Undaria pinnatifida against Particulate-Matter-Induced Allergic Airway Inflammation: Evidence of the Attenuation of Oxidative Stress and Inflammatory Responses."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Although not significant, however, high-dose fucoidan treatment attenuated the level of IL-17a."
        explanation: "States that the IL-17a reduction recorded in the 400 mg/kg fucoidan output record of this assay did not reach significance."
      - reference: "PMID:32580518"
