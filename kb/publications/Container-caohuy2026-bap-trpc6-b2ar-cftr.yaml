# =============================================================================
# Caohuy et al. (2026) - PM2.5 toxin benzo[a]pyrene induces life-limiting
# inflammation and oxidative stress in the airway by up-regulation of TRPC6
# and inactivation of beta2AR/CFTR signaling
#
# bioRxiv preprint, posted 2026-04-24 - doi:10.64898/2026.04.21.719931
# US Government work, CC0 license (not certified by peer review).
#
# Focus of this extraction: the mechanism the paper proposes, in which
# benzo[a]pyrene (B[a]P) - the toxin adsorbed to the PM2.5 particle surface -
# binds beta2AR irreversibly, drives PI3K/AKT/IKK/NFkB proinflammatory
# signaling, then destroys both beta2AR and its signalplex partner CFTR by
# endocytic recycling, which releases the CFTR-inhibited TRPC6 calcium
# channel and so raises cytosolic calcium, ROS and oxidative stress.
#
# Study design as reported:
#   In vitro  - differentiated BCi-NS1.1 (dBCi) basal-cell organoid cultures at
#               air-liquid interface for 25-28 days; polarized 16HBE14o- cells
#               at ALI for 9-10 days. Both apical and basolateral sides treated
#               with DMSO (control), B[a]P (0.1, 1.0, 10 uM) or PM2.5
#               (ERM-CZ110, 12.5, 25, 50, 100 ng/mL); apical media removed
#               after 6 h and exposure continued a further 18 h under ALI
#               (24 h total). Inhibitors: PI3K blocker LY 294002 with its
#               inactive analogue LY 303511; TRPC6 blocker BI 749327 (5 uM);
#               proteasome inhibitor MG-132 (20 uM). H2O2 (100 uM) served as
#               a positive control for oxidative stress.
#   Ex vivo   - tracheobronchial slice cultures from two ferret lungs, 9 cubes
#               per lung (average wet weight 400 mg), 24 h with DMSO,
#               10 uM B[a]P or 100 ng/mL PM2.5; n = 6 independent sections.
#
# IMPORTANT ON NUMBERS: this paper reports every assay result graphically -
# Western blot images with densitometry, ELISA bar charts, Isc tracings and
# fluorescence traces - and states directions of change with significance
# thresholds (p < 0.05 / p < 0.01) rather than numeric group means. Its
# statistics section says only that "Results are expressed as mean +/- SD".
# Therefore NO measurement magnitudes are recorded here: output records carry
# their experimental group and the exposure condition they were measured
# under, and every stated direction of change lives in a `description:` field
# or in a `response_comparisons:` entry with no `change_value`. Reading
# magnitudes off the figures would invent data the paper does not report.
#
# The numbers that ARE recorded are the ones the paper states in text:
# exposure agents, concentrations and durations, sample sizes (n = 3 for dBCi
# experiments, n = 4 for polarized 16HBE14o- experiments, n = 6 for ferret
# sections), the statistical test, and the two Pearson correlation
# coefficients (r = 0.9948, p = 0.005 for beta2AR vs CFTR; r = -0.9875,
# p = 0.01 for beta2AR vs TRPC6). The schema has no slot for a correlation
# coefficient, so those two values are recorded in `description:` fields
# beside the quotes that state them.
#
# SCHEMA GAP: the intracellular calcium measurements (Fluo-4 AM, Fig 6a/6b and
# 6f/6g) are central to the mechanism but the schema has no calcium-flux assay
# class, so they are recorded as `key_event_relationships:` entries rather
# than as assays - the same treatment Container-liu2024-pm25-p2y2-cftr.yaml
# gave the calcium step. PROTOCOL:caohuy-fluo4-001 documents the method behind
# those relationships.
#
# NEW KEY EVENT IDS minted here (no existing KE on main fits; see PR body):
#   KE:ke-decreased-b2ar                     - loss of beta2AR protein
#   KE:ke-increased-trpc6                    - up-regulation of TRPC6
#   KE:ke-increased-intracellular-calcium    - the increase direction; the
#       existing KE:ke-decreased-intracellular-calcium encodes the opposite
#       direction in both its id and its name, so it cannot be reused here.
#   KE:ke-mirna-dysregulation                - the five suppressed microRNAs
# Reused verbatim from origin/main: KE:ke-airway-inflammation,
# KE:ke-decreased-cftr, KE:mie-oxidative-stress, KE:ke-pi3k-akt-activation.
#
# ON QUOTE SPANS: the quote checker strips square-bracketed spans from a
# snippet before matching (they are normally editorial glosses or citation
# markers), which makes any span containing this paper's central token
# 'B[a]P' - or '[Ca2+]' - unmatchable as written. Snippets here therefore
# either stop short of that token or use the checker's documented elision
# form ('B ... P'), where each fragment must appear in order. Separately,
# the cached PDF text renders beta, kappa, alpha and mu in the body text as
# symbol-font private-use glyphs, so spans covering 'beta2AR' or 'NFkB' are
# taken from the abstract or the figure captions, which carry real Unicode.
# No quote was reworded to pass the check: every snippet is verbatim source
# text, verified against the committed references_cache/ entry.
# =============================================================================

source_publication:
  reference: "PMID:42079210"
  reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
  doi: "10.64898/2026.04.21.719931"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:caohuy-ali-treatment-001"
    name: "Air-liquid-interface culture and apical/basolateral exposure"
    description: "hTERT-transformed BCi-NS1.1 basal stem cells (gift of Dr R.G. Crystal, Cornell Medical College) and human bronchial 16HBE14o- cells (Sigma-Aldrich, SCC150) were seeded at 5x10^5 cells/cm2 on 12-mm Snapwell or Transwell inserts and 9x10^5 cells/cm2 on 24-mm Transwell inserts. All experiments were performed after maintaining the cells at the air-liquid interface for 25-28 days (dBCi) and 9-10 days (16HBE14o-) at 37 C and 5% CO2. B[a]P, LY 294002, LY 303511, BI 749327 and PM2.5 powder were dissolved in DMSO; the DMSO concentration in all treatments was less than 1.0%. Both apical and basolateral sides were exposed; after a 6 h incubation the treated media were removed from the apical side and the cells were exposed for a further 18 h under ALI conditions, giving a 24 h total exposure. Basolateral media were collected for IL-8, IL-6 and TNF-alpha measurement."
    quality_control_criteria: "The DMSO concentration in all treatments was less than 1.0%; non-toxic exposure concentrations were established by MTT assay before use (B[a]P 0.1-10 uM and PM2.5 12.5-100 ng/mL were not toxic)."

  - id: "PROTOCOL:caohuy-mtt-001"
    name: "MTT cell viability assay"
    description: "Cell viability was assessed with the MTT assay. An equal volume of MTT solution (5 mg/mL) relative to the existing culture medium was added to each treatment well of a 12-well plate and the cells were incubated in a CO2 incubator in the dark for 2 h. The medium was removed, the formazan crystals were dissolved in 200 uL solubilization solution, and the plate was shaken on a rotary to ensure complete dissolution. Absorbance was read at 570 nm on a CLARIOstar microplate reader (BMG LABTECH, UK). Used here only to establish that the exposure concentrations were non-toxic; the schema has no cell-viability assay class, so the viability result is recorded in the descriptions of the assays that used those concentrations."
    equipment_required:
      - "CLARIOstar microplate reader (BMG LABTECH, UK)"
      - "12-well plates"

  - id: "PROTOCOL:caohuy-elisa-cytokines-001"
    protocol_type: MolecularAssayProtocol
    name: "DuoSet ELISA for human IL-8, IL-6 and TNF-alpha in basolateral media"
    description: "Culture media from the basolateral compartments were collected and assayed for IL-8, IL-6 and TNF-alpha using the respective DuoSet ELISA kits (R&D Systems) according to the manufacturer's instructions. Concentrations of human TNF-alpha, IL-6 and IL-8 were calculated from a standard curve and normalized to the MTT or total protein concentration values."
    detection_method: "Human IL-8/CXCL8 DuoSet ELISA, Human IL-6 DuoSet ELISA and Human TNF-alpha DuoSet ELISA (R&D Systems); absorbance read against a standard curve"
    normalization_method: "Normalized to MTT or total protein concentration values"

  - id: "PROTOCOL:caohuy-elisa-ferret-il6-001"
    protocol_type: MolecularAssayProtocol
    name: "Ferret IL-6 ELISA on slice-culture medium"
    description: "After 24 h of culture, medium samples from ferret tracheobronchial slice cultures were collected and centrifuged at 400 x g, 4 C for 5 min to remove cellular material, then analysed with a Ferret IL-6 ELISA kit (Genorise, PA, USA)."
    detection_method: "Ferret IL-6 ELISA kit (Genorise, PA, USA)"

  - id: "PROTOCOL:caohuy-ussing-001"
    name: "Ussing chamber short-circuit current for cAMP-activated CFTR"
    description: "Treated Snapwell inserts were mounted in Ussing chambers (Physiologic Instruments, Reno, Nevada). A basolateral-to-apical chloride gradient was imposed by replacing NaCl with sodium gluconate. The chloride-containing solution was 120 mM NaCl, 20 mM NaHCO3, 5 mM KHCO3, 1.2 mM NaH2PO4, 1.2 mM CaCl2, 1.2 mM MgCl2 and 5.6 mM glucose; in the chloride-free solution all Cl salts were exchanged for gluconate salts and Ca2+ was raised to 5 mM to compensate for chelation of Ca2+ by gluconate. Both chamber compartments were gassed with 5% CO2 (pH 7.4) and experiments were done at 37 C. CFTR channel activity was detected by first inactivating sodium currents with 100 uM amiloride, then activating CFTR chloride channels with 10 uM forskolin and 100 uM IBMX, then specifically inactivating CFTR channels with 10 uM CFTRinh-172. At the end of the assay the cells were washed with PBS and lysed in RIPA buffer with anti-protease/phosphatase cocktail, or labelled with cell-impermeable Sulfo-NHS-SS-biotin, for Western blot analysis."
    equipment_required:
      - "Ussing chambers (Physiologic Instruments, Reno, Nevada)"
      - "Snapwell inserts"
    quality_control_criteria: "Sodium currents were inactivated with 100 uM amiloride before CFTR activation, and CFTR-specific current was confirmed by inhibition with 10 uM CFTRinh-172."

  - id: "PROTOCOL:caohuy-wb-001"
    protocol_type: MolecularAssayProtocol
    name: "Western blot with densitometry on treated cell lysates"
    description: "Treated cells were washed with PBS and lysed in RIPA buffer supplemented with anti-protease/phosphatase cocktail. Equivalent amounts of lysate (50 ug per sample) were electrophoresed on 4-12% gradient gels (Invitrogen) and transferred to PVDF membranes, which were probed at 4 C overnight with the corresponding primary antibody at the manufacturer's recommended dilution. After incubation with the appropriate HRP-coupled secondary antibody and washing, immunoreactive bands were exposed to chemiluminescent HRP substrate and visualized on a BioRad ChemiDoc imaging system, then quantified with Imagelab software."
    detection_method: "Chemiluminescence on a BioRad ChemiDoc imaging system; densitometry in Imagelab"
    antibodies_used:
      - "beta-actin (Sigma, A5441)"
      - "CFTR (R&D Systems, MAB1660)"
      - "CFTR (SCBT, sc-376683)"
      - "beta2AR (Novus Biologicals, NBP261710)"
      - "TRADD (SCBT, sc-46653)"
      - "TNFR1 (Cell Signaling, 3736)"
      - "IKK beta (SCBT, sc-8014)"
      - "IkB alpha (Cell Signaling, 9242)"
      - "phospho-IkB alpha Ser32/36 (Cell Signaling, 9246)"
      - "phospho-NFkB p65 Ser276 (Cell Signaling, 3037)"
      - "NFkB p65 (Cell Signaling, 8242)"
      - "phospho-IKK alpha/beta Ser176/180 (Cell Signaling, 2697)"
      - "IKK alpha (Cell Signaling, 11930)"
      - "AKT (Cell Signaling, 9272)"
      - "phospho-AKT Ser473 (Cell Signaling, 9271)"
      - "TRPC6 (Protein Tech, 18236-1-AP)"
      - "Ubiquitin (Protein Tech, 80992-1-RR)"
    normalization_method: "beta-actin loading control"

  - id: "PROTOCOL:caohuy-biotinylation-001"
    protocol_type: MolecularAssayProtocol
    name: "Cell surface biotinylation of beta2AR and CFTR"
    description: "After B[a]P treatment, ALI-differentiated cells were washed three times with Ca2+/Mg2+-PBS buffer (pH 8.2) and incubated with cell-impermeable Sulfo-NHS-SS-biotin (1 mg/mL) for 2 h at 4 C in the dark, then washed three times with 100 mM Tris buffer to quench all free biotin reagent. Biotinylated cells were lysed in RIPA buffer with anti-protease/phosphatase cocktail; biotinylated proteins at 1 mg/mL in the lysates were extracted with streptavidin magnetic beads, and biotinylated beta2AR and CFTR were determined by Western blot."
    detection_method: "Streptavidin magnetic bead pulldown of surface-biotinylated protein followed by Western blot"
    normalization_method: "beta-actin loading control"

  - id: "PROTOCOL:caohuy-recycling-001"
    protocol_type: MolecularAssayProtocol
    name: "Endosomal recycling assay with glutathione stripping"
    description: "To measure recycling of endogenous beta2AR and CFTR, ALI-differentiated cells were first biotinylated with 1 mg/mL Sulfo-NHS-SS-biotin for 2 h at 4 C in the dark, then incubated at 37 C for 6 h with culture media containing DMSO control or different concentrations of B[a]P. After the 37 C incubation, biotin molecules remaining at the cell surface were stripped five times with glutathione (GSH) solution, so that only the biotinylated protein protected inside the cell remained labelled. One biotinylated sample without 37 C incubation and without GSH stripping, and another without 37 C incubation but with GSH stripping, served as controls for biotin labelling efficiency and for GSH stripping efficiency respectively. Biotinylated proteins were extracted from the lysates with streptavidin magnetic beads and biotinylated beta2AR and CFTR were determined by Western blot."
    detection_method: "GSH-stripped surface biotin followed by streptavidin pulldown and Western blot"
    normalization_method: "beta-actin, used to confirm equal amounts of biotinylated sample in the extraction"
    quality_control_criteria: "Biotinylated samples without 37 C incubation, with and without GSH stripping, were run as positive controls for biotinylation and for GSH stripping efficiency."

  - id: "PROTOCOL:caohuy-ubiquitination-001"
    protocol_type: MolecularAssayProtocol
    name: "CFTR immunoprecipitation and ubiquitination Western blot"
    description: "Both apical and basolateral sides of polarized 16HBE14o- monolayers were exposed to DMSO or different concentrations of B[a]P in the presence of 20 uM proteasome inhibitor MG-132; treated media were removed from the apical side after 6 h and exposure continued for a further 18 h at the ALI. Cell monolayers were lysed in RIPA buffer; lysates at 1 mg/mL were precleared with Protein G Dynabeads then incubated for 6 h at 4 C with 2 ug of normal mouse serum or anti-CFTR R-domain antibody, followed by overnight incubation with Protein G Dynabeads. After washing, CFTR ubiquitination in the immunoprecipitated complexes was analysed by Western blot with an anti-ubiquitin antibody."
    detection_method: "Anti-CFTR R-domain immunoprecipitation followed by anti-ubiquitin Western blot"
    antibodies_used:
      - "anti-CFTR R Domain antibody (2 ug per IP)"
      - "normal mouse serum (IP specificity control)"
      - "Ubiquitin (Protein Tech, 80992-1-RR)"
    quality_control_criteria: "Normal mouse serum was immunoprecipitated in parallel as a specificity control, and 20 uM MG-132 was present to block proteasomal degradation of the ubiquitinated species."

  - id: "PROTOCOL:caohuy-fluo4-001"
    protocol_type: MolecularAssayProtocol
    name: "Fluo-4 AM fluorescence measurement of intracellular free calcium"
    description: "16HBE14o- cells at 1x10^5 cells/mL in black visiplate 24-well tissue culture plates were treated with DMSO or different concentrations of B[a]P or PM2.5 for 24 h at 37 C, washed three times with Ca2+/Mg2+-free HBSS buffer, and incubated for 1 h at 37 C with 10 uM cell-permeant Fluo-4 AM and 2.5 mM of the organic anion transport inhibitor probenecid in Ca2+/Mg2+-free HBSS. After washing, basal Fluo-4 AM fluorescence in cells bathed in Ca2+/Mg2+-free HBSS was recorded at Ex 483 nm / Em 530 nm on a CLARIOstar microplate reader (BMG LABTECH). Once the baseline was stable, 1 mM CaCl2 was added and fluorescence was recorded over time; the TRPC6-blockade experiments added 2 mM Ca2+ in the presence or absence of 5 uM BI 749327. At least three independent experiments in duplicate were conducted. The schema has no calcium-flux assay class, so the results obtained with this protocol are recorded in the key_event_relationships section rather than as an assay."
    detection_method: "Fluo-4 AM fluorescence, Ex 483 nm / Em 530 nm, reported as the mean change in RFU (F1 - F0) after Ca2+ addition"
    platform: "CLARIOstar microplate reader (BMG LABTECH)"
    replicate_requirements: 3

  - id: "PROTOCOL:caohuy-cellrox-001"
    protocol_type: MolecularAssayProtocol
    name: "CellROX Green reactive oxygen species assay"
    description: "CellROX Green reagent (ThermoFisher) is cell-permeable and shows no or very weak fluorescence in a reduced state, but strong fluorescence on oxidation by ROS. Both apical and basolateral sides of polarized 16HBE14o- cells were incubated with PM2.5, B[a]P or hydrogen peroxide at 37 C in a CO2 incubator. After 6 h, treated media from the apical sides were removed and replaced with 10 uM CellROX Green in Ca2+/Mg2+-free HBSS buffer, followed by further incubation for 18 h. Cell monolayers were washed three times with PBS at room temperature and lysed in 0.1% Triton X-100-PBS. Lysates were transferred to a black, clear-bottom 24-well plate and fluorescence was recorded at Ex 483 nm / Em 530 nm on a CLARIOstar microplate reader (BMG LABTECH). Background fluorescence was subtracted from each value and normalized to the total protein concentration."
    detection_method: "CellROX Green fluorescence, Ex 483 nm / Em 530 nm"
    normalization_method: "Background-subtracted and normalized to total protein concentration"
    platform: "CLARIOstar microplate reader (BMG LABTECH)"

  - id: "PROTOCOL:caohuy-taqman-mir-001"
    protocol_type: MolecularAssayProtocol
    name: "TaqMan microRNA assay on differentiated dBCi cells"
    description: "Both apical and basolateral sides of differentiated dBCi cells were incubated with DMSO or different concentrations of B[a]P for 24 h, with the apical media removed after 6 h and treatment continued under ALI conditions. Cells were lysed and total RNA was extracted with mirVana total RNA isolation kits (Life Technologies, Frederick, MD) per the manufacturer's protocol. RNA yield and quality were assessed on a NanoDrop ND-1000 spectrophotometer, all samples showing A260/A280 ratios between 1.8 and 2.0. MicroRNAs were measured with specific TaqMan probes and U6 was used as the endogenous control. The data represent the average of three technical replicates, and relative fold changes were analysed by the 2^-deltadeltaCT method and reported as mean +/- SEM."
    detection_method: "TaqMan microRNA real-time PCR, 2^-deltadeltaCT relative quantification"
    reference_gene: "U6"
    normalization_method: "U6 endogenous control"
    platform: "NanoDrop ND-1000 for RNA QC; TaqMan Assays (Life Technologies)"
    replicate_requirements: 3
    quality_control_criteria: "All RNA samples showed A260/A280 absorbance ratios between 1.8 and 2.0, indicative of high-quality RNA."

  - id: "PROTOCOL:caohuy-ferret-slice-001"
    name: "Ex vivo ferret tracheobronchial slice culture"
    description: "Lung tissues were donated from two ferrets. Lung parenchymal tissues were washed three times with PBS supplemented with 1X penicillin/streptomycin in a petri dish, then dissected into small cubes, 9 cubes per ferret lung with an average wet weight of 400 mg, containing tracheobronchial tubes. The tissues were transferred to a 24-well tissue culture plate, conditioned for 1 h in Pneumacult-EX Plus Basal media, then cultured for 24 h in the same media containing DMSO, 100 ng/mL PM2.5 or 10 uM B[a]P at 37 C and 5% CO2. Culture medium was collected for ferret IL-6 ELISA. Treated tissues were washed with PBS and homogenized in RIPA buffer with anti-protease/phosphatase inhibitor cocktail using a handheld motor-driven tissue homogenizer, followed by centrifugation at 20,000 rpm for 5 min; 50 ug of lysate per sample was electrophoresed on 4-12% gradient gels and transferred to PVDF for Western blot."
    equipment_required:
      - "Handheld motor-driven tissue homogenizer"
      - "24-well tissue culture plates"
      - "Pneumacult-EX Plus Basal media kit (Stemcell)"
    antibodies_used:
      - "CFTR (CFF Antibody Distribution program, mAb 660 + mAb 596)"
      - "beta2AR (Novus Biologicals, NBP261710)"
      - "TRPC6 (Protein Tech, 18236-1-AP)"
      - "beta-Actin (Cell Signaling, 4970)"
    replicate_requirements: 6
# =============================================================================
# CFTR CHLORIDE CHANNEL FUNCTION - Ussing chamber
#
# Figures 2a/2b report Isc tracings against "step-wise increases in B[a]P
# concentration" without itemising the concentrations in the text. The graded
# B[a]P series is therefore modelled as a single treated exposure condition
# (EXPOSURE:caohuy-bap-graded-24h) rather than as one condition per dose: the
# three non-toxic concentrations established in Fig 1a (0.1, 1.0 and 10 uM) are
# the series used throughout the paper, but assigning a specific dose to a
# specific Isc tracing would go beyond what the text states.
# =============================================================================

cftr_assays:
  - id: "CFTR:caohuy-isc-dbci-bap-24h"
    name: "cAMP-activated CFTR short-circuit current after 24 h B[a]P, differentiated BCi-NS1.1 organoid"
    description: "CFTR channel function measured as forskolin/IBMX-activated, CFTRinh-172-sensitive short-circuit current in Ussing chambers, in dBCi ALI cultures after 24 h exposure to DMSO or a graded series of B[a]P concentrations. Sodium currents were first inactivated with 100 uM amiloride, CFTR was then activated with 10 uM forskolin plus 100 uM IBMX, and the CFTR component was confirmed by inactivation with 10 uM CFTRinh-172. Isc was systematically and significantly reduced as the B[a]P concentration rose. The same monolayers were then lysed for the Western blots of total CFTR and beta2AR recorded as GE:caohuy-cftr-protein-dbci-bap and GE:caohuy-b2ar-protein-dbci-bap, so the functional loss and the protein loss come from one experiment. The paper reports Isc as representative tracings and bar charts with a significance threshold (p < 0.01 by one-way ANOVA with Tukey post-hoc against the DMSO control) and gives no current magnitudes, so no values are recorded. PM2.5 was also found to significantly reduce cAMP-dependent CFTR chloride channel activity (Supplemental Fig S2), which is not extracted here because the supplemental figure is not in the fetched text."
    stimulation_agent: "10 uM forskolin plus 100 uM IBMX, after inactivation of sodium currents with 100 uM amiloride"
    inhibitor_used: "10 uM CFTRinh-172, used to confirm the CFTR-specific component of the current"
    evidence:
      - reference: "PMID:42079210"
        reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Fig 2a and Fig 2b showed that CFTR channel function, represented by short circuit currents"
        explanation: "Identifies the Ussing-chamber short-circuit current as the CFTR function readout this assay records."
      - reference: "PMID:42079210"
        reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "CFTR channel activity was detected by first inactivating sodium currents with 100 µM amiloride; then activating CFTR chloride channels with 10 µM forskolin and 100 µM IBMX; then specifically inactivating CFTR channels with 10 µM CFTRinh-172."
        explanation: "Gives the stimulation and inhibition steps recorded in stimulation_agent and inhibitor_used."
    has_exposure_condition:
      - id: "EXPOSURE:caohuy-dmso-vehicle-24h"
        name: "DMSO vehicle, less than 1.0%, apical and basolateral, 24 h"
        exposure_agent:
          id: "CHEBI:28262"
          name: "dimethyl sulfoxide"
        exposure_duration:
          value: "24"
          unit:
            id: "UO:0000032"
            name: "hour"
      - id: "EXPOSURE:caohuy-bap-graded-24h"
        name: "Benzo[a]pyrene, graded step-wise concentration series, apical and basolateral, 24 h (individual concentrations not itemised in the text for this figure)"
        exposure_agent:
          id: "CHEBI:29865"
          name: "benzo[a]pyrene"
        exposure_duration:
          value: "24"
          unit:
            id: "UO:0000032"
            name: "hour"
    has_specified_output:
      - id: "CFTR:caohuy-isc-dbci-bap-24h-output-control"
        name: "CFTR short-circuit current, DMSO control"
        description: "Baseline forskolin/IBMX-activated, CFTRinh-172-sensitive Isc. Representative tracing and bar chart only; no current magnitude is given in the paper."
        experimental_group: vehicle_control
        measured_under: "EXPOSURE:caohuy-dmso-vehicle-24h"
      - id: "CFTR:caohuy-isc-dbci-bap-24h-output-bap-graded"
        name: "CFTR short-circuit current, graded B[a]P series"
        description: "Isc was systematically and significantly reduced by increases in B[a]P concentration. Representative tracings and bar chart only; no current magnitudes are given, and the paper does not itemise which concentration produced which tracing."
        experimental_group: treated
        measured_under: "EXPOSURE:caohuy-bap-graded-24h"
    informs_on_key_event:
      id: "KE:ke-decreased-cftr"
      name: "Decreased CFTR function"
      biological_action: decreased
      level_of_biological_organization: molecular
    study_subject:
      subject_type: CellularSystem
      id: "soma:caohuy-dbci-001"
      name: "Differentiated BCi-NS1.1 (dBCi) bronchial basal-cell organoid at air-liquid interface"
      description: "hTERT-transformed BCi-NS1.1 human bronchial basal stem cells (gift of Dr R.G. Crystal, Cornell Medical College), seeded at 5x10^5 cells/cm2 on 12-mm Snapwell or Transwell inserts and 9x10^5 cells/cm2 on 24-mm Transwell inserts, then maintained at the air-liquid interface for 25-28 days at 37 C and 5% CO2 before exposure. The paper notes as a limitation that this differentiated organoid is composed of multiple cell types. days_at_differentiation is omitted because the paper gives a 25-28 day range rather than a single value."
