# =============================================================================
# KEY EVENT RELATIONSHIPS
#
# The mechanistic chain the paper proposes and tests:
#   beta2AR loss -> CFTR loss -> TRPC6 release -> cytosolic calcium ->
#   ROS / oxidative stress, with two routes into NFkB-driven inflammation
#   (PI3K/AKT, and relief of CFTR's inhibition of TRADD) and one feedback
#   limb in which oxidative stress itself represses CFTR.
# =============================================================================

key_event_relationships:
  - id: "KER:caohuy-b2ar-loss-to-cftr-loss"
    name: "Decreased beta-2 adrenergic receptor leads to decreased CFTR function"
    description: "The paper's central step. Irreversible B[a]P binding first activates beta2AR, then drives it into endosomes by the classical desensitisation route; because beta2AR is bound to CFTR through a NHERF1 PDZ signalplex, CFTR is removed by the same or a parallel process and destroyed in the proteasome. The evidence is direct: surface-biotinylated CFTR and beta2AR both fall, both are retained in endosomes as B[a]P rises, CFTR immunoprecipitates become ubiquitinated, and the two protein losses correlate at r = 0.9948 (p = 0.005)."
    upstream_event:
      id: "KE:ke-decreased-b2ar"
      name: "Decreased beta-2 adrenergic receptor"
      biological_action: decreased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-decreased-cftr"
      name: "Decreased CFTR function"
      biological_action: decreased
      level_of_biological_organization: molecular
    relationship_type: "directly leads to"
    evidence_support: strong
    evidence:
      - reference: "PMID:42079210"
        reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "(iv) also destroyed β2AR's signalplex partner CFTR by the same process"
        explanation: "States the relationship directly: the process that destroys beta2AR also destroys CFTR."
      - reference: "PMID:42079210"
        reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "a Pearson Correlation Coefficient (r) of 0.9948 (p= 0.005)."
        explanation: "The quantitative coupling between the two protein losses that makes this relationship strongly supported."

  - id: "KER:caohuy-cftr-loss-to-trpc6"
    name: "Decreased CFTR function leads to increased TRPC6 expression"
    description: "CFTR normally binds and constitutively inhibits the TRPC6 calcium channel within the apical signalplex, so losing CFTR releases TRPC6, which is then activated and further expressed in the apical plasma membrane. TRPC6 rose on every blot where CFTR fell - across the PM2.5 dose series, with pure B[a]P, and in ferret slice cultures - and the beta2AR loss and TRPC6 gain were inversely correlated at r = -0.9875 (p = 0.01)."
