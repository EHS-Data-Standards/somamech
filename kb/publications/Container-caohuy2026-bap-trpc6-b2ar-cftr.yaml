# CHANGES VS CONTROL
#
# Every comparison here is a direction the paper states, with the statistical
# test it used. None carries a change_value: the paper reports significance
# thresholds (p < 0.05, p < 0.01) rather than magnitudes, and computing a
# magnitude off a figure would invent data.
# =============================================================================

