    name: "PI3K blockade of B[a]P-induced IL-6 and IL-8 secretion, polarized 16HBE14o- cells"
    description: "The test of whether B[a]P drives cytokine release through PI3K. Polarized 16HBE14o- cells were exposed to B[a]P with or without the classical PI3K blocker LY 294002 or its inactive analogue LY 303511. LY 294002 blocked B[a]P-activated secretion of IL-8 and IL-6, while the inactive analogue LY 303511 did not - the specificity control that makes this a PI3K-dependent effect rather than a general drug effect. The paper reports that equivalent experiments on PM2.5-treated cells with LY 294002 or LY 303511 gave similar statistically significant results (Supplemental Fig S3), which is not extracted here because the supplemental figure is not in the fetched text. Bar charts, mean +/- SD (n = 4), with significance thresholds only (p < 0.05, p < 0.01 by one-way ANOVA with Tukey post-hoc); the concentrations of LY 294002 and LY 303511 are not stated in the text, so those exposure conditions carry no concentration."
