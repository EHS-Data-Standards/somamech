        snippet: "(v) activated the CFTR-bound calcium channel protein TRPC6 due to loss of inhibitory CFTR; leading to (vi) increased cytosolic ... concentration; (vii) increased ROS due to mitochondrial uncoupling; and (viii) increased expression of oxidative stress."
        explanation: "States this relationship and the two that follow it: loss of inhibitory CFTR activates TRPC6, which raises cytosolic calcium, ROS and oxidative stress."
