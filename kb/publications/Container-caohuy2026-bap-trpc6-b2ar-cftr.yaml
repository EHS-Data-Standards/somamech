  - id: "COMP:caohuy-il6-dbci-bap"
    name: "IL-6 secretion, B[a]P 10 uM vs DMSO control (dBCi organoid)"
    description: "IL-6 in the basolateral media rose as the B[a]P concentration rose and was significantly elevated at 1 and 10 uM. The paper gives no magnitude for the change, only its direction and a significance threshold, so change_value and change_type are omitted."
