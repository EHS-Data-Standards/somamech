    description: "Calcium entering through the released TRPC6 channel is taken up by mitochondria, which uncouple and release reactive oxygen species, producing a state of oxidative stress. The pharmacological test is the strongest evidence: the TRPC6 blocker BI 749327 prevented ROS production and the genesis of oxidative stress by denying entry of Ca2+."
