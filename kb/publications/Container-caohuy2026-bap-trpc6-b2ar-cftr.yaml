        evidence_source: IN_VITRO
        snippet: "Fig 5a showed that LY 294002 blocked B ... P-activated secretion of IL-8 and IL-6, However, the inactive form LY 303511 was inactive."
        explanation: "States both arms this assay records: the PI3K inhibitor suppressed the B[a]P-driven IL-6 and IL-8 release, and the inactive analogue did not."
      - reference: "PMID:42079210"
        reference_title: "PM2.5 toxin benzo[a]pyrene induces life-limiting inflammation and oxidative stress in the airway by up-regulation of TRPC6 and inactivation of β2AR/CFTR signaling."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "(ii) increased NFκB-activated release of proinflammatory cytokines through IKKαβ activation by PI3K/AKT, which was suppressed by the PI3K inhibitor LY 294002"
