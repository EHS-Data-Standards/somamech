    description: "Calcium influx was measured with Fluo-4 AM (PROTOCOL:caohuy-fluo4-001) rather than as an assay, because the schema has no calcium-flux assay class. After 24 h a significant increase in intracellular calcium was measurable at 1 and 10 uM B[a]P, and the specific TRPC6 inhibitor BI 749327 significantly inhibited that B[a]P-dependent calcium influx - which is what makes the calcium entry TRPC6-dependent rather than merely coincident with the TRPC6 rise. The paper reports the traces and the mean change in RFU (F1 - F0) as figures only, with no numeric values."
