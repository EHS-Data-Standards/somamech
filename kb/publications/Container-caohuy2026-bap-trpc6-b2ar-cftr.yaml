  - id: "GE:caohuy-tnf-nfkb-panel-dbci-bap"
    name: "TNF/NFkB signaling protein panel after 24 h B[a]P, differentiated BCi-NS1.1 organoid"
    description: "A panel Western blot of the classical TNF/NFkB activation pathway in dBCi ALI cultures across the B[a]P dose series. As the B[a]P concentration rose, protein expression increased for TNFR1, TRADD, phospho-IKK-beta, phospho-IkB-alpha, phospho-NFkB p65 (serine 536) and phospho-NFkB p65 (serine 276), while the non-phosphorylated substrate proteins IKK-alpha, IkB-alpha and NFkB p65 were not significantly changed - the pattern that identifies classical NFkB activation rather than a change in total protein. The B[a]P-dependent elevation of TRADD matters to the paper's argument because TRADD is the node CFTR normally inhibits, so its rise ties the inflammatory arm to the CFTR loss. No single target_gene is given because this assay measures a multi-protein panel. Representative blots from three independent experiments; no densitometric values are reported, so no protein_level values are recorded."
