# =============================================================================
# PROTEIN AND microRNA EXPRESSION
#
# All Western blots are reported as representative images with densitometry
# bar charts and significance thresholds; the paper states no densitometric
# values, so every output record here carries a direction in its description
# and no protein_level value. target_gene uses PRO identifiers verified
# against the ontology: PR:P13569 (CFTR), PR:P07550 (beta2AR),
# PR:Q9Y210 (TRPC6), PR:P31749 (AKT1), PR:Q04206 (NFkB p65 / RELA).
#
# This collection opens with the five cytokine-secretion assays (IL-6, IL-8 and
# TNF-alpha by DuoSet ELISA in basolateral media; ferret IL-6 in slice-culture
# medium). They are GeneExpressionAssay entries rather than BALFSputumAssay
# entries because BALFSputumAssay restricts study_subject to InVivoSubject, and
# every model in this paper is a cell culture or an ex vivo explant. That costs
# the dedicated il6_concentration / il8_concentration / tnf_alpha_concentration
# slots, but the paper reports no cytokine concentrations anyway - every ELISA
# result is a bar chart - so no recorded value is lost, and the matching
# response_comparisons use protein_level. The multi-cytokine assays and the
# multi-protein panels carry no single target_gene.
# =============================================================================

gene_expression_assays:
  - id: "GE:caohuy-cytokines-dbci-bap-24h"
    name: "IL-6, IL-8 and TNF-alpha secretion after 24 h B[a]P, differentiated BCi-NS1.1 organoid"
    description: "Basolateral IL-6, IL-8 and TNF-alpha in dBCi ALI cultures exposed apically and basolaterally to DMSO or B[a]P at 0.1, 1.0 and 10 uM (6 h, then a further 18 h under ALI). All three cytokines rose as the B[a]P concentration rose. At the lowest 0.1 uM dose only the IL-8 and IL-6 increases were significant, whereas at 1 and 10 uM all three were significantly and proportionately elevated. The MTT assay established that these concentrations were not toxic to the cells, so the cytokine rise is not a cytotoxicity artefact. Reported as bar charts with means +/- SD from three independent experiments and significance thresholds only (p < 0.05, p < 0.01 by one-way ANOVA with Tukey post-hoc against the DMSO control); no cytokine concentrations are given, so no values are recorded."
    gene_expression_method: "ELISA (R&D Systems DuoSet kits) on basolateral culture media"
    normalization_reference: "MTT or total protein concentration"
    evidence:
