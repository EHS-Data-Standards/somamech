oxidative_stress_assays:
  - id: "OXS:caohuy-ros-16hbe-24h"
    name: "CellROX Green ROS production after 24 h PM2.5, B[a]P or H2O2, polarized 16HBE14o- cells"
    description: "ROS measured with the CellROX Green probe in polarized 16HBE14o- cells. Both sides of the monolayer were treated for 6 h, after which the apical media were replaced with 10 uM CellROX Green in Ca2+/Mg2+-free HBSS and incubated a further 18 h; lysate fluorescence was background-subtracted and normalized to total protein. 50 and 100 ng/mL PM2.5, 10 uM B[a]P and the 100 uM H2O2 positive control all significantly increased ROS generation. This is the step the paper predicts from calcium influx through TRPC6 after loss of inhibitory CFTR, and the step that the TRPC6 inhibitor BI 749327 blocks. Reported as a bar chart, mean +/- SD (n = 4), with significance thresholds only (p < 0.05, p < 0.01 by one-way ANOVA with Tukey post-hoc against the DMSO control); no fluorescence magnitudes are given, so no values are recorded."
    ros_probe_type: "CellROX Green (ThermoFisher), 10 uM, Ex 483 nm / Em 530 nm"
    evidence:
      - reference: "PMID:42079210"
