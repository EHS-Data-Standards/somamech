# =============================================================================
# Ferecatu et al. (2010) - Polycyclic aromatic hydrocarbon components
# contribute to the mitochondria-antiapoptotic effect of fine particulate
# matter on human bronchial epithelial cells via the aryl hydrocarbon receptor
# =============================================================================
#
# Source: Part Fibre Toxicol. 2010;7:18
# DOI: 10.1186/1743-8977-7-18
# PMID: 20663163
#
# The committed reference cache for this PMID is FULL TEXT
# (content_type: full_text_pdf), so every evidence snippet below is quoted
# from the committed cache and is checkable by CI without a receipt.
#
# Study design (in vitro only):
#   - Cells: 16HBE14o- (immortalized), NCI-H292 and BEAS-2B (carcinoma lines),
#     and non-differentiated primary normal human bronchial epithelial cells
#     (NHBE, Lonza). All subconfluent, submerged culture.
#   - Exposure agent: urban Parisian PM2.5 collected in winter/summer 2003 at
#     a curbside station (Porte d'Auteuil: AW, AS) and an urban background
#     station (Vitry-sur-Seine: VW, VS). Standard dose 10 ug/cm2 (40 ug/ml);
#     dose range 1-50 ug/cm2. Also tested: PM2.5-AW organic extracts (Oex),
#     aqueous extracts (Aex), washed particles, 95 nm carbon black, five heavy
#     (>=4-ring) PAH, light (3-ring) PAH, and an LPS-neutralizing protein.
#   - Design: 4 h PM2.5 pretreatment, then 20 h with an apoptosis inducer
#     (A23187 3 uM, staurosporine 1 uM, oligomycin 5 uM, rotenone 5 uM,
#     antimycin A 25 ug/ml, ionomycin 0.5 uM, or H2O2 500 uM).
#   - Readouts: four-parameter flow cytometry (DiOC6(3) for mitochondrial
#     transmembrane potential, hydroethidine for superoxide anion, Annexin
#     V-FITC for phosphatidylserine exposure, propidium iodide for plasma
#     membrane permeabilization); transmission electron microscopy; ELISA for
#     amphiregulin and GM-CSF; Western blot for AhR; AhR siRNA silencing;
#     AhR agonist (beta-naphthoflavone) and antagonist
#     (alpha-naphthoflavone).
#
# Key findings:
#   - Parisian PM2.5 (1-50 ug/cm2, 24-72 h) is NOT cytotoxic to any of the
#     four bronchial epithelial cell models: no mitochondrial depolarization,
#     no superoxide anion production, no phosphatidylserine exposure, no
#     plasma membrane permeabilization. H2O2 remained an effective positive
#     control, so the cells were not intrinsically apoptosis-resistant.
#   - A 4 h PM2.5-AW pretreatment instead PROTECTS against mitochondria-driven
#     apoptosis: 33% reduction of DiOC6(3) low for oligomycin, 35% for
#     A23187, 44% for staurosporine - but no protection against ionomycin,
#     rotenone, antimycin A or H2O2. Confirmed in NCI-H292 and NHBE cells.
#   - The protection is not an artifact of inducer adsorption onto particles
#     (wash-out and cell-free co-incubation controls).
#   - Amphiregulin and GM-CSF secretion appear only at 24 h, i.e. after the
#     antiapoptotic effect; recombinant EGF and the EGFR inhibitor AG1478
#     changed nothing, ruling the classical EGFR pathway out.
#   - Aqueous extracts, organic extracts, washed particles and four of five
#     heavy PAH (B(a)P most efficient) mimic the protection; carbon black,
#     light PAH and endotoxin do not. PM2.5-VS (metal-rich, PAH-poor) was the
#     only batch that failed to protect.
#   - AhR carries part of the mechanism: the agonist beta-naphthoflavone
#     reduced apoptosis on its own (31% reduction of DiOC6(3) low) and
#     improved PM2.5 protection (54% vs. 37%); the antagonist
#     alpha-naphthoflavone (25% vs. 37%) and AhR siRNA (18% vs. 27%) each
#     partially removed it.
#
# EXTRACTION NOTES - read before adding numbers to this file:
#   - NO measurement values are recorded in the output records. Every
#     quantitative result in this paper is either (a) a percent reduction of
#     "DiOC6(3) low" cells - a mitochondrial-transmembrane-potential /
#     apoptosis readout for which the SOMA assay microschemas have no named
#     measurement slot - or (b) figure-only (Figures 1-7 carry the dose and
#     kinetic series; the text reports no numbers for them). Per the
#     extraction rules, figure-derived values are not digitized and slots
#     with no paper-reported value are omitted rather than guessed, so the
#     output records carry only their experimental group and exposure link.
#     The percent reductions ARE preserved, verbatim, as evidence snippets on
#     KE:ke-inhibited-apoptosis and KE:mie-ahr-activation.
#   - For the same reason there is no response_comparisons section: the
#     paper's reported changes are all on that unmodelled DiOC6(3) readout,
#     and inventing a compared_measurement name for it would be worse than
#     omitting it.
#   - The AhR pharmacology arms (beta-NF, alpha-NF, siRNA-AhR apoptosis
#     readouts in Figure 7) are likewise recorded as key-event evidence
#     rather than as assays: their readout is DiOC6(3)/PI apoptosis, not an
#     oxidative-stress, gene-expression or EGFR measurement. The Western blot
#     that validated the silencing IS modelled, as a GeneExpressionAssay.
#   - The NCI-H292 / BEAS-2B / NHBE arms measured only DiOC6(3) and PI, with
#     no ROS probe, so they are not modelled as OxidativeStressAssay records;
#     their result is carried as evidence on KE:ke-inhibited-apoptosis.
#   - The rEGF / AG1478 experiment measured apoptosis, not EGFR
#     phosphorylation, so it is recorded as REFUTE evidence on
#     KER:ferecatu-egfr-inhibited-apoptosis rather than as an assay.
#   - target_gene on GENE:ferecatu-ahr-wb-16hbe is a bare-string slot the term
#     validator does not visit, so it was checked by hand: PR:000003858 is
#     "aryl hydrocarbon receptor" in the Protein Ontology (confirmed with
#     `runoak -i ols:pr info PR:000003858`), i.e. the AhR protein the Western
#     blot detected.
#   - exposure_agent is single-valued, so the combination conditions
#     (PM2.5 pretreatment followed by an apoptosis inducer) carry PM2.5 as
#     the agent and name the inducer, its dose and its 20 h window in the
#     condition name and timing_post_exposure. The inducer is therefore not
#     machine-readable from exposure_agent alone; it would need either a
#     multivalued exposure_agent or a second linked condition upstream.
#   - PDF-text artifacts: the committed cache is a pypdf extraction, which
#     renders the paper's "PM2.5" as "PM 2.5" in the body text (but not in
#     the abstract) and breaks some words across line ends. Snippets below
#     are copied verbatim from the committed cache, so body-text quotes keep
#     the "PM 2.5" spacing and avoid line-broken words. None of this changes
#     the quoted meaning.
#
# Key event vocabulary: KE:mie-oxidative-stress, KE:mie-ahr-activation,
# KE:ke1-egfr-activation, KE:ke-airway-inflammation and KE:ke-airway-remodeling
# are copied VERBATIM from the wordings on origin/main (each is unanimous
# there: "Increased oxidative stress"/increased, "AhR pathway
# activation"/activated, "EGFR activation"/activated, "Airway
# inflammation"/increased - the majority wording, not the single
# "Th2 airway inflammation" variant - and "Airway remodeling"/increased).
# KE:ke-inhibited-apoptosis is newly minted here: no existing key event covers
# suppression of apoptosis, and it is kept minimal so the next paper can reuse
# it unchanged.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:20663163"
  reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
  doi: "10.1186/1743-8977-7-18"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:ferecatu-flow-apoptosis-001"
    name: "Four-parameter flow cytometric apoptosis panel in bronchial epithelial cells"
    description: >-
      Apoptosis hallmarks recommended by the Nomenclature Committee on Cell
      Death were quantified by flow cytometry: 3,3-dihexyloxacarbocyanine
      iodide (DiOC6(3), 2 nM) for the mitochondrial transmembrane potential,
      hydroethidine (HE, 2 uM) for superoxide anion generation, Annexin
      V-FITC for phosphatidylserine exposure, and propidium iodide (PI,
      10 ug/ml) for plasma membrane permeabilization. Percentage induction of
      apoptosis was computed relative to the apoptotic fraction of control
      cells.
    detection_method: "flow cytometry (DiOC6(3), hydroethidine, Annexin V-FITC and propidium iodide staining)"
    platform: "CyAn ADP LX (Dako Cytomation)"
    replicate_requirements: 3
    quality_control_criteria: "results reported as mean +/- standard deviation of three independent experiments; one-way ANOVA with Dunnett's test versus control and Student-Newman-Keuls for pairwise comparisons; p < 0.05 considered significant"

  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:ferecatu-elisa-amphiregulin-001"
    name: "Amphiregulin ELISA on bronchial epithelial cell supernatants"
    description: >-
      Subconfluent 16HBE cells were exposed to PM2.5-AW for 4 h or 24 h;
      supernatants were recovered, centrifuged at 15,000 x g for 15 min at
      4 degrees C to pellet particles, frozen at -80 degrees C, and assayed
      for released amphiregulin.
    detection_method: "enzyme-linked immunosorbent assay (R&D Systems Europe)"

  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:ferecatu-elisa-gmcsf-001"
    name: "GM-CSF ELISA on bronchial epithelial cell supernatants"
    description: >-
      Granulocyte monocyte colony-stimulating factor released into the
      supernatant of PM2.5-AW-exposed subconfluent 16HBE cells (4 h or 24 h)
      was measured on the same particle-cleared, frozen supernatants used for
      amphiregulin.
    detection_method: "enzyme-linked immunosorbent assay (R&D Systems Europe)"

  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:ferecatu-sirna-ahr-001"
    name: "AhR gene silencing by fluorescent siRNA in 16HBE cells"
    description: >-
      16HBE cells were seeded at 2 x 10^4 cells/cm2 and transfected overnight
      later with 10 nM AhR siRNA (Hs_AHR_6 AlexaFluor-647, SI03043971,
      Qiagen) or a non-silencing control siRNA (AllStars Neg AlexaFluor-647,
      1027287, Qiagen) using HiPerFect. The AlexaFluor-647 tag allowed
      transfected cells to be gated by flow cytometry. Experiments were run
      48 h after transfection.
    detection_method: "lipid-based siRNA transfection with AlexaFluor-647-tagged duplexes, transfected cells gated by flow cytometry"
    platform: "HiPerFect Transfection Reagent (Qiagen)"

  - protocol_type: MolecularAssayProtocol
    id: "PROTOCOL:ferecatu-wb-ahr-001"
    name: "Western blot for AhR protein in 16HBE cells"
    description: >-
      Whole-cell lysates from siRNA-transfected 16HBE cells were blotted for
      AhR and for actin as the loading reference; immunoreactive bands were
      detected by chemiluminescence. The blot is qualitative - the paper
      reports no densitometric values - and served to confirm that the siRNA
      silenced AhR.
    detection_method: "immunoblot with chemiluminescent HRP substrate"
    antibodies_used:
      - "mouse-monoclonal anti-AhR (WH0000196M2, Sigma)"
      - "mouse-monoclonal anti-Actin (A5441, Sigma)"
      - "peroxidase-conjugated anti-mouse immunoglobulin (A9044, Sigma)"
    normalization_method: "actin loading control"
    platform: "FujiFilm LAS 4000 camera system"

# =============================================================================
# KEY EVENTS
# Blocks for existing IDs are copied verbatim from origin/main.
# KE:ke-inhibited-apoptosis is newly minted here.
# =============================================================================

key_events:
  # --- Negative evidence: at these doses PM2.5 did NOT raise oxidative
  # stress, and pretreatment LOWERED inducer-driven ROS production. Both
  # snippets therefore point against this key event, and are marked REFUTE.
  - id: "KE:mie-oxidative-stress"
    name: "Increased oxidative stress"
    biological_action: increased
    level_of_biological_organization: molecular
    evidence:
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: "even when 16HBE cells were exposed for longer times to PM 2.5-AW (1-50 μg/cm2), no significative increase of apoptotic parameters was observed"
        explanation: "Superoxide anion generation (hydroethidine) was one of the apoptotic parameters quantified, so this result shows that PM2.5-AW at 1-50 ug/cm2 did not increase oxidative stress in 16HBE cells even at 48-72 h."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: "Conversely, a 4 hour-pretreatment with PM2.5 prevent mitochondria-driven apoptosis triggered by broad spectrum inducers (A23187, staurosporine and oligomycin) by reducing the mitochondrial transmembrane potential loss, the subsequent ROS production, phosphatidylserine externalization, plasma membrane permeabilization and typical morphological outcomes"
        explanation: "PM2.5 pretreatment reduced rather than increased ROS production downstream of the apoptosis inducers, which is the opposite direction to this key event."

  - id: "KE:mie-ahr-activation"
    name: "AhR pathway activation"
    biological_action: activated
    level_of_biological_organization: molecular
    evidence:
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Finally, the activation or silencing of the aryl hydrocarbon receptor (AhR) showed that it is involved into the molecular mechanism of the antiapoptotic effect of PM2.5 at the mitochondrial checkpoint of apoptosis."
        explanation: "Both pharmacological activation and genetic silencing of AhR changed the PM2.5 response, placing AhR activation in the mechanism."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Note that the particle-coupled PAH are bioavailable in our system since CYP1A1 mRNA and its enzymatic activity were increased"
        explanation: "Induction of CYP1A1, a canonical AhR target gene, is direct evidence that the particle-bound PAH reached and activated the AhR pathway in these cells."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "beta-NF (20 μg/ml) used prior to A23178 significantly reduced the amount of apoptotic cells (31% reduction of DiOC6(3) low), and further improved the protection conferred by PM 2.5 exposure (54% vs. 37% reduction of DioC6(3) low)."
        explanation: "The AhR agonist beta-naphthoflavone reproduced and amplified the PM2.5 effect, showing that activating this pathway is sufficient to protect the mitochondrial checkpoint."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "exposure (25% vs. 37% reduction of DiOC6(3) low), although it did not noticeably modify the apoptotic effect of A23187."
        explanation: "The AhR antagonist alpha-naphthoflavone cut the PM2.5 protection from 37% to 25% without affecting A23187 on its own, so the loss is specific to the AhR-dependent arm."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Then, intracellular PAH can target and activate the aryl hydrocarbon receptor (AhR)."
        explanation: "The authors' mechanistic model names PAH desorbed from endocytosed particles as the AhR ligands."

  # --- PM2.5 does drive EGFR-ligand (amphiregulin) secretion, but only at
  # 24 h, and blocking the receptor did not touch the antiapoptotic effect.
  # The first snippet supports the key event; the second refutes its place in
  # this paper's mechanism.
  - id: "KE:ke1-egfr-activation"
    name: "EGFR activation"
    biological_action: activated
    level_of_biological_organization: molecular
    evidence:
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Results showed that AR and GM-CSF secretion occur only after a 24 h exposure, which is in agreement with previous studies published on PM 2.5-VW and PM 2.5-AS"
        explanation: "PM2.5 exposure does elicit secretion of the EGFR ligand amphiregulin from 16HBE cells, confirming EGFR pathway engagement - but as a late (24 h) event."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: "The use of recombinant EGF and specific inhibitor led us to rule out the involvement of the classical EGFR signaling pathway as well as the proinflammatory cytokines secretion."
        explanation: "Neither adding recombinant EGF nor inhibiting the receptor altered the response, so EGFR activation is not the step through which PM2.5 suppresses apoptosis here."

  # --- Newly minted. No key event on origin/main covers suppression of
  # apoptosis; kept minimal (name, action, level) for reuse.
  - id: "KE:ke-inhibited-apoptosis"
    name: "Inhibited apoptosis"
    biological_action: inhibited
    level_of_biological_organization: cellular
    evidence:
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Conversely, a 4 hour-pretreatment with PM2.5 prevent mitochondria-driven apoptosis triggered by broad spectrum inducers (A23187, staurosporine and oligomycin) by reducing the mitochondrial transmembrane potential loss, the subsequent ROS production, phosphatidylserine externalization, plasma membrane permeabilization and typical morphological outcomes"
        explanation: "A 4 h PM2.5 pretreatment suppressed every measured hallmark of mitochondria-driven apoptosis, which is this key event."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "(33% reduction of DiOC6(3) low), the calcium ionophore A23187 (35% reduction of DiOC6(3) low) and staurosporine (44% reduction of DiOC6(3) low), but not by ionomycin, rotenone,"
        explanation: "Quantifies the inhibition in 16HBE cells - 33% for oligomycin, 35% for A23187, 44% for staurosporine - and shows it is selective, with no protection against ionomycin, rotenone, antimycin A or H2O2."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "experiments performed in NCI-H292 and NHBE cells showed that PM 2.5-AW also reduced apoptosis induced by A23187 or STS but not by H2O2"
        explanation: "The inhibition is not a quirk of one immortalized line: it reproduces in the NCI-H292 carcinoma line and in primary NHBE cells."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "the antiapoptotic effect of PM 2.5 -AW was partially efficient at 10 μg/cm 2 and totally effective for concentrations beyond 25 μg/cm 2"
        explanation: "Gives the particle dose-dependence of the inhibition: partial at the standard 10 ug/cm2 dose, complete above 25 ug/cm2."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "but PM 2.5 -AW (50 μg/cm 2) totally counteracted the cellular volume decrease"
        explanation: "The morphological arm of the same inhibition: A23187 alone shrank the cells to 66.2% of control volume, and PM2.5-AW at 50 ug/cm2 fully blocked that apoptotic cell-volume loss."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Instead, the water-soluble fraction, washed particles and organic compounds such as polycyclic aromatic hydrocarbons (PAH) could mimic this antiapoptotic activity."
        explanation: "Identifies which particle fractions carry the inhibitory activity: the water-soluble fraction, the washed particles themselves, and the adsorbed organic PAH."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Except for B(b)F, all the other PAH reduced the amount of apoptosis induced by A23187, similar to that of PM 2.5 pretreatment and B(a)P seems to be the most efficient"
        explanation: "Four of the five heavy PAH tested reproduced the inhibition on their own, with benzo[a]pyrene the most potent."

  - id: "KE:ke-airway-inflammation"
    name: "Airway inflammation"
    biological_action: increased
    level_of_biological_organization: tissue
    evidence:
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The PM2.5-antiapoptotic effect in addition to the well-documented inflammatory response might explain the maintenance of a prolonged inflammation state induced after pollution exposure and might delay repair processes of injured tissues."
        explanation: "The authors place their finding alongside the established inflammatory response to PM2.5, proposing that apoptosis resistance is what sustains airway inflammation after exposure."

  - id: "KE:ke-airway-remodeling"
    name: "Airway remodeling"
    biological_action: increased
    level_of_biological_organization: tissue
    evidence:
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Thus, mechanisms involved in airway remodelling might be the excessive cell proliferation as well as the resistance to the apoptotic cell death."
        explanation: "The paper names resistance to apoptotic cell death as one of the mechanisms behind airway remodeling, which is why this tissue-level key event is relevant here."

# =============================================================================
# KEY EVENT RELATIONSHIPS
# =============================================================================

key_event_relationships:
  - id: "KER:ferecatu-ahr-inhibited-apoptosis"
    name: "AhR pathway activation leads to inhibited apoptosis in bronchial epithelial cells"
    description: >-
      PAH desorbed from PM2.5 activate AhR, and AhR activation accounts for
      part of the protection of the mitochondrial apoptosis checkpoint.
      Three independent manipulations agree: the agonist beta-naphthoflavone
      protected on its own and raised PM2.5 protection from 37% to 54%, the
      antagonist alpha-naphthoflavone cut it to 25%, and AhR siRNA cut it
      from 27% to 18%. Because neither the antagonist nor the siRNA abolished
      the protection, the authors conclude AhR only partially contributes and
      another pathway must also be involved - hence moderate, not strong,
      support.
    upstream_event:
      id: "KE:mie-ahr-activation"
      name: "AhR pathway activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-inhibited-apoptosis"
      name: "Inhibited apoptosis"
      biological_action: inhibited
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Finally, the activation or silencing of the aryl hydrocarbon receptor (AhR) showed that it is involved into the molecular mechanism of the antiapoptotic effect of PM2.5 at the mitochondrial checkpoint of apoptosis."
        explanation: "States the causal link directly: AhR status determines whether PM2.5 suppresses apoptosis at the mitochondrial checkpoint."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "AhR silencing significantly reduced the protection triggered by PM 2.5 (18% vs. 27% reduction of DiOC(6)3 low) alike the antagonist (alpha-NF) did."
        explanation: "Genetic loss of AhR weakened the downstream inhibition of apoptosis, the key necessity test for this relationship."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "these results suggest that AhR partially contributes to the antiapoptotic effect of PM 2.5 exposure."
        explanation: "The authors' own summary of the relationship's strength: real but partial, which is why evidence_support is moderate."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "some of them might be mitochondrial MMP regulators (dotted arrow), thus might protect the cell from apoptosis induced by A23187, staurosporin (STS) or oligomycin (Omy)."
        explanation: "Proposes the intermediate step - AhR target genes acting as mitochondrial membrane permeabilization regulators - linking AhR activation to the apoptosis block."

  - id: "KER:ferecatu-egfr-inhibited-apoptosis"
    name: "EGFR activation leads to inhibited apoptosis in bronchial epithelial cells"
    description: >-
      Tested and ruled out. Amphiregulin and GM-CSF secretion appeared only
      at 24 h, after the antiapoptotic effect was already established, and
      neither recombinant EGF nor the EGFR inhibitor AG1478 altered the
      reduction of A23187-induced apoptosis. Recorded as a relationship with
      REFUTE evidence so the negative result is not re-tested by the next
      curator; evidence_support is weak because the paper argues against the
      link rather than for it.
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-inhibited-apoptosis"
      name: "Inhibited apoptosis"
      biological_action: inhibited
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: weak
    evidence:
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: "we used a recombinant EGF ligand (rEGF) or the inhibitor of EGF receptor (AG1478, Figure 5B) to show that none of the two compounds modifies the reduction of A23187-induced apoptosis."
        explanation: "Driving the receptor with ligand and blocking it with AG1478 both left the apoptosis inhibition unchanged, so EGFR activation is not the upstream step."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: "Results showed that AR and GM-CSF secretion occur only after a 24 h exposure, which is in agreement with previous studies published on PM 2.5-VW and PM 2.5-AS"
        explanation: "Timing argues against the link: the EGFR-ligand response is a late event while the apoptosis inhibition is established within the 4 h pretreatment."
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: "The use of recombinant EGF and specific inhibitor led us to rule out the involvement of the classical EGFR signaling pathway as well as the proinflammatory cytokines secretion."
        explanation: "The authors state the rule-out explicitly for both the EGFR pathway and the proinflammatory cytokine arm."

  - id: "KER:ferecatu-inhibited-apoptosis-airway-inflammation"
    name: "Inhibited apoptosis leads to sustained airway inflammation"
    description: >-
      The authors' proposed in vivo consequence of their in vitro finding:
      apoptosis resistance on top of the established inflammatory response
      might maintain a prolonged inflammation state after pollution exposure.
      Hedged ("might explain") and not tested in this paper, so support is
      weak and the relationship is indirect.
    upstream_event:
      id: "KE:ke-inhibited-apoptosis"
      name: "Inhibited apoptosis"
      biological_action: inhibited
      level_of_biological_organization: cellular
    downstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    relationship_type: "indirectly leads to"
    evidence_support: weak
    evidence:
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The PM2.5-antiapoptotic effect in addition to the well-documented inflammatory response might explain the maintenance of a prolonged inflammation state induced after pollution exposure and might delay repair processes of injured tissues."
        explanation: "States the hypothesised causal chain from the antiapoptotic effect to prolonged airway inflammation and delayed tissue repair."

  - id: "KER:ferecatu-inhibited-apoptosis-airway-remodeling"
    name: "Inhibited apoptosis leads to airway remodeling"
    description: >-
      Background reasoning the paper's result speaks to: airway remodeling
      after chronic particle exposure may arise from excessive proliferation
      and from resistance to apoptotic cell death. This paper supplies the
      apoptosis-resistance half in vitro but does not measure remodeling, so
      support is weak and the relationship is indirect.
    upstream_event:
      id: "KE:ke-inhibited-apoptosis"
      name: "Inhibited apoptosis"
      biological_action: inhibited
      level_of_biological_organization: cellular
    downstream_event:
      id: "KE:ke-airway-remodeling"
      name: "Airway remodeling"
      biological_action: increased
      level_of_biological_organization: tissue
    relationship_type: "indirectly leads to"
    evidence_support: weak
    evidence:
      - reference: "PMID:20663163"
        reference_title: "Polycyclic aromatic hydrocarbon components contribute to the mitochondria-antiapoptotic effect of fine particulate matter on human bronchial epithelial cells via the aryl hydrocarbon receptor."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Thus, mechanisms involved in airway remodelling might be the excessive cell proliferation as well as the resistance to the apoptotic cell death."
        explanation: "Names resistance to apoptotic cell death as a mechanism of airway remodeling, which is the relationship asserted here."

