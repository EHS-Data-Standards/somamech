# =============================================================================
# Gras et al. (2013) - Bronchial epithelium as a target for innovative
# treatments in asthma
# =============================================================================
#
# Source: Pharmacol Ther. 2013
# DOI: 10.1016/j.pharmthera.2013.07.008
# PMID: 23880290
#
# Study design: narrative review (no primary assays or quantitative
# measurements). The committed reference cache is abstract-only, so every
# evidence snippet below is quoted verbatim from the abstract.
#
# What this review contributes to the knowledge base:
#   - Human-asthma support for existing key events in the shared vocabulary:
#     mucin hypersecretion (a hallmark of airway remodeling in asthma) and
#     airway inflammation (central in current asthma management, with the
#     epithelium shaping the TH2 paradigm)
#   - Airway remodeling as a tissue-level key event observed in severe
#     chronic airway diseases
#   - Two relationships the review states: mucin hypersecretion is a
#     hallmark of airway remodeling, and airway remodeling may result from
#     ongoing disturbance of epithelial signal transduction and renewal
#
# No assay collections are populated: a review reports no measurements of
# its own, and hallucinating numbers is prohibited.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:23880290"
  reference_title: "Bronchial epithelium as a target for innovative treatments in asthma."
  doi: "10.1016/j.pharmthera.2013.07.008"

# =============================================================================
# KEY EVENTS - shared AOP vocabulary this review provides evidence for.
# Blocks for existing KE IDs are copied verbatim from the vocabulary on main;
# KE:ke-airway-remodeling and KE:ke-disturbed-epithelial-renewal are newly
# minted here (no existing key event covers them) and kept minimal for reuse.
# =============================================================================

key_events:
  - id: "KE:ke-mucin-hypersecretion"
    name: "Mucin hypersecretion"
    biological_action: increased
    level_of_biological_organization: cellular
    evidence:
      - reference: "PMID:23880290"
        reference_title: "Bronchial epithelium as a target for innovative treatments in asthma."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In asthma, excessive mucus production is a hallmark of airway remodeling."
        explanation: "The review states that excessive mucus production is a defining feature of asthmatic airway remodeling, supporting mucin hypersecretion as a key event in human asthma."
      - reference: "PMID:23880290"
        reference_title: "Bronchial epithelium as a target for innovative treatments in asthma."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Since many years we tried to therapeutically target mucus hypersecretion, but actually this option is still not achieved."
        explanation: "The review identifies mucus hypersecretion as a long-standing but still unmet therapeutic target in asthma, underscoring its relevance as a key event."

  - id: "KE:ke-airway-inflammation"
    name: "Airway inflammation"
    biological_action: increased
    level_of_biological_organization: tissue
    evidence:
      - reference: "PMID:23880290"
        reference_title: "Bronchial epithelium as a target for innovative treatments in asthma."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Airway inflammation is central in current asthma management."
        explanation: "The review names airway inflammation as the central target of current asthma management, supporting it as a key event in the asthma pathway."
      - reference: "PMID:23880290"
        reference_title: "Bronchial epithelium as a target for innovative treatments in asthma."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Understanding of how the airway epithelium influences the TH2 paradigm in response to deleterious agents is improving."
        explanation: "The review places the airway epithelium upstream of the TH2 inflammatory paradigm triggered by deleterious agents, linking epithelial responses to airway inflammation."

  - id: "KE:ke-airway-remodeling"
    name: "Airway remodeling"
    biological_action: increased
    level_of_biological_organization: tissue
    evidence:
      - reference: "PMID:23880290"
        reference_title: "Bronchial epithelium as a target for innovative treatments in asthma."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Airway remodeling is observed in severe chronic airway diseases and may result from ongoing disturbance of signal transduction and epithelial renewal."
        explanation: "The review reports airway remodeling as an observed tissue-level change in severe chronic airway diseases such as asthma."

  - id: "KE:ke-disturbed-epithelial-renewal"
    name: "Disturbed epithelial signal transduction and renewal"
    biological_action: disrupted
    level_of_biological_organization: cellular
    evidence:
      - reference: "PMID:23880290"
        reference_title: "Bronchial epithelium as a target for innovative treatments in asthma."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Airway remodeling is observed in severe chronic airway diseases and may result from ongoing disturbance of signal transduction and epithelial renewal."
        explanation: "The review proposes ongoing disturbance of epithelial signal transduction and renewal as the process underlying airway remodeling, supporting it as a cellular-level key event."

