    evidence:
      - reference: "PMID:40681630"
        reference_title: "Improved cookstoves enhance household air quality and respiratory health in rural Rwanda."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "After three years, the lung function of the ICS users showed a higher forced vital capacity (FVC) than that of traditional cooks"
        explanation: "States the cross-sectional FVC advantage of the improved-cookstove group recorded in this assay."
      - reference: "PMID:40681630"
        reference_title: "Improved cookstoves enhance household air quality and respiratory health in rural Rwanda."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "median = 2.82 L for ICS users vs. 2.74 L for traditional cooks, Wilcoxon test, P-value = 0.044"
        explanation: "Gives the median FVC value of 2.82 L recorded for the ICS group and its P-value."
      - reference: "PMID:40681630"
        reference_title: "Improved cookstoves enhance household air quality and respiratory health in rural Rwanda."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "and PEF (median = 4.46 L for ICS users vs. 4.46 L for traditional cooks, P-value = 0.936)"
        explanation: "Gives the median PEF value of 4.46 L recorded for the ICS group."
      - reference: "PMID:40681630"
        reference_title: "Improved cookstoves enhance household air quality and respiratory health in rural Rwanda."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In terms of PM0.3−2.5, the mean exposure during traditional cooking was 167 ± 207 µg m −3 hour−1, significantly higher than the mean exposure of 38 ± 41 µg m −3 hour−1 measured during the improved stove use (P-value < 0.001)."
        explanation: "Gives the mean PM0.3-2.5 exposure of 38 ug m-3 hour-1 recorded in this assay's improved-cookstove exposure condition."
      - reference: "PMID:40681630"
        reference_title: "Improved cookstoves enhance household air quality and respiratory health in rural Rwanda."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "During traditional cooking, BC exposure was 60 ± 49 µg m−3 h−1 and decreased to 30 ± 20 µg m−3 h−1 during the improved stove use."
        explanation: "Gives the mean BC exposure of 30 ug m-3 h-1 named in this assay's improved-cookstove exposure condition."
      - reference: "PMID:40681630"
        reference_title: "Improved cookstoves enhance household air quality and respiratory health in rural Rwanda."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Regarding the organic-light-absorbing carbon (BrC), the mean hourly exposure was 163 ± 120 and 35 ± 23 µg m−3 h−1 for traditional cooking and the ICS, respectively."
