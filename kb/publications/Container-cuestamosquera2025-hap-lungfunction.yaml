# =============================================================================
# Cuesta-Mosquera et al. (2025) - Improved cookstoves enhance household air
# quality and respiratory health in rural Rwanda
# =============================================================================
#
# Source: Sci Rep. 2025;15:26065 (PMID:40681630)
# DOI: 10.1038/s41598-025-09863-6
#
# Study design:
#   - Randomized controlled trial, rural Rwanda (Musanze and Gatsibo districts)
#   - 1001 adults at baseline (2019): 380 received a Save80 improved cookstove
#     (ICS, intervention), 621 continued traditional three-stone-fire cooking
#   - Follow-up health assessment three years later (2022): questionnaire from
#     907 participants, acceptable spirometry from 848 (520 traditional,
#     328 ICS)
#   - Spirometry (FVC, FEV1, FEV1/FVC, PEF) per ERS/ATS guidelines with a
#     Vyntus SPIRO PC-Spirometer
#   - Household air pollution (HAP) measured in 2022 in a subgroup (n = 45
#     households for online BC/BrC/PM exposure, n = 21 households for filter
#     OC/EC/TC/PAH), each household measured while cooking traditionally and
#     then with the ICS
#
# Key findings captured here:
#   - Cross-sectional at follow-up: FVC higher in ICS users (2.82 L vs 2.74 L,
#     P = 0.044); FEV1, PEF and FEV1/FVC not significantly different
#   - Longitudinal: three-year FVC change -0.02 L (ICS) vs -0.16 L
#     (traditional), P < 0.001
#   - Exposure: PM0.3-2.5 167 vs 38 ug m-3 hour-1; BC 60 vs 30 ug m-3 h-1;
#     BrC 163 vs 35 ug m-3 h-1; cooking time reduced 34%
#   - Symptoms (questionnaire, not modelled as an assay here): coughing -11%
#     and mucus production -9% in ICS users vs traditional cooks
#
# =============================================================================

source_publication:
  reference: "PMID:40681630"
  reference_title: "Improved cookstoves enhance household air quality and respiratory health in rural Rwanda."
  doi: "10.1038/s41598-025-09863-6"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:cuesta-spirometry-001"
    name: "ERS/ATS spirometry in a rural field setting"
    description: "Spirometry performed following European Respiratory Society and American Thoracic Society guidelines, measuring FVC, FEV1 and PEF. Repeated until at least three flow-volume curves met the ERS/GOLD criteria. Airway obstruction defined as FEV1/FVC < 70%. Volume calibration with a calibration pump every morning, afternoon and after significant weather changes."
    equipment_required:
      - "Vyntus SPIRO PC-Spirometer (VYAIRE)"
      - "Mouthpiece with integrated bacterial filter"
      - "Nose clip"
      - "Calibration pump"
      - "Portable weather station (Technoline WS 6765)"

  - id: "PROTOCOL:cuesta-hap-001"
    name: "Household air pollution measurement during cooking"
    description: "Indoor measurements at each household in three stages: 10-15 min before the cooking fire started, during cooking, and 10-15 min after the fire was turned off. Instruments carried in portable backpacks placed 2-3 m from the cooking fire or stove. Total exposure calculated as the time integral of the measured concentration over the cooking period."
    equipment_required:
      - "microAeth MA200 (Aethlabs) light absorption photometer"
      - "Optical particle size spectrometer model 3330 (TSI Inc)"
      - "Portable pump model Gilian 12 (Sensidyne) with 37 mm quartz-fiber filters"
      - "Sunset Laboratory dual carbonaceous analyzer (OC/EC)"
      - "Curie-point pyrolyzer (JPS-350, JAI) coupled to GC-MS (Agilent 6890N/5973)"

# =============================================================================
# LUNG FUNCTION ASSAYS
# =============================================================================

