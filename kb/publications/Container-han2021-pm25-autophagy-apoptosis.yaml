    reference_dataset: "no reference dataset - mouse model, PM2.5 group compared with a concurrent control group"
    evidence:
      - reference: "PMID:33235610"
        reference_title: "PM2.5 induces autophagy-mediated cell apoptosis via PI3K/AKT/mTOR signaling pathway in mice bronchial epithelium cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The results indicated that PM2.5 significantly decreased lung function, including total lung capacity, residual volume, vital capacity and airway resistance in experimental mice (Fig. 1A-D)."
        explanation: "States exactly what this assay records: the four pulmonary function parameters were significantly lower in the PM2.5 group than in the control group."
      - reference: "PMID:33235610"
        reference_title: "PM2.5 induces autophagy-mediated cell apoptosis via PI3K/AKT/mTOR signaling pathway in mice bronchial epithelium cells."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Body weight of mice was significantly decreased by PM2.5 compared with the control (Fig. 1E). H&E staining demonstrated that PM2.5 induced lung injury (Fig. 1F)."
        explanation: "Records the two accompanying in vivo findings described in this assay - decreased body weight and histological lung injury - that place the lung function loss in the context of overt organ damage."
      - reference: "PMID:33235610"
        reference_title: "PM2.5 induces autophagy-mediated cell apoptosis via PI3K/AKT/mTOR signaling pathway in mice bronchial epithelium cells."
