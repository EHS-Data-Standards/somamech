# =============================================================================
# KEY EVENT RELATIONSHIPS
#
# The paper states one explicit mechanistic chain - PM2.5 activates
# PI3K/AKT/mTOR, which drives autophagy, which mediates apoptosis - and
# supports it with inhibitor reversal. The downstream link from epithelial
# apoptosis to the loss of lung function is the paper's framing rather than
# something it tested, so it is recorded as an indirect, moderately supported
# relationship. The oxidative stress link is recorded as weak: the paper
# reports ROS and apoptosis in the same cells but tests no causal step
# between them, and states only that ROS "may induce oxidative injury".
# =============================================================================

key_event_relationships:
  - id: "KER:han-pi3k-to-autophagy"
    name: "PI3K/AKT/mTOR signaling activation leads to increased autophagy"
