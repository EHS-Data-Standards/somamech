# =============================================================================
# Han & Zhuang (2021) - PM2.5 induces autophagy-mediated cell apoptosis via
# PI3K/AKT/mTOR signaling pathway in mice bronchial epithelium cells
# =============================================================================
#
# Source: Exp Ther Med. 2021 (PMID:33235610)
# DOI: 10.3892/etm.2020.9433
# Committed reference cache: references_cache/PMID_33235610.md
#   content_type: full_text_xml (PMC) - every snippet below is quoted from the
#   committed full text, so no verification receipt is needed for this paper.
#
# Study design:
#   - In vivo: 20 eight-week-old male C57BL/6 mice (20-23 g), randomly split
#     into two groups of 10 - a PM2.5 environment and a normal survival
#     (Control) environment - housed for 21 days and euthanized on day 22.
#     PM2.5 was delivered by intratracheal instillation as previously
#     reported. On day 22: FlexiVent pulmonary function, plasma ELISA for
#     IL-1beta and IL-6, H&E lung histology, and TUNEL on lung sections.
#   - In vitro: mouse bronchial epithelium cells (MBECs, Shanghai Sixin
#     Biotechnology) seeded at 1x10^5/ml in six-well plates and placed for
#     24 h in air containing PM2.5, PM2.5 + PI3K inhibitor (PI3KIR,
#     Sigma-Aldrich cat. no. 526559), PI3KIR alone, or 95% air / 5% CO2
#     (control). Readouts: DCFH-DA ROS imaging, western blot for PI3K,
#     p-PI3K, AKT and p-AKT, TUNEL apoptosis, and LC3B immunofluorescence
#     for autophagy.
#
# Key findings:
#   - PM2.5 significantly decreased lung function (total lung capacity,
#     residual volume, vital capacity, airway resistance) and body weight,
#     and induced lung injury on H&E.
#   - PM2.5 raised IL-1beta and IL-6 in serum and in MBECs, and raised ROS
#     production in MBECs.
#   - PM2.5 increased apoptosis in lung tissue and in MBECs.
#   - PM2.5 increased PI3K, AKT and mTOR expression and PI3K/AKT
#     phosphorylation in MBECs, and induced autophagy.
#   - The PI3K inhibitor lowered PI3K, AKT and mTOR expression and blocked
#     PM2.5-induced autophagy and apoptosis of MBECs.
#
# IMPORTANT - no numeric measurement values are recorded below. This paper
# reports every group-level result in figures only (Fig. 1-5); the running
# text and the abstract state directions of change ("significantly
# decreased", "markedly increased") but give no numbers, no group means, no
# spread and no p-values. Per the extraction rules, figure-derived values are
# not estimated, so each output record carries only its experimental group,
# the exposure condition it was measured under, and a description of the
# reported direction. For the same reason there is no response_comparisons:
# section - the paper states no percent change, fold change or difference
# that could be recorded with derivation: reported_in_paper.
#
# The exposure concentration of PM2.5 is likewise never stated, in vivo or in
# vitro, so exposure_concentration is omitted throughout and only the stated
# durations (21 days in vivo, 24 h in vitro) are recorded. The PI3K inhibitor
# is identified only by catalogue number (Sigma-Aldrich 526559), with no
# chemical name or concentration, so it carries no exposure_agent CURIE.
#
# Note on the lung function parameter list: the Methods say "lung capacity,
# residual volume, tidal volume and airway resistance" while the Results and
# the abstract say "total lung capacity, residual volume, vital capacity and
# airway resistance". The two lists disagree on tidal vs vital capacity; both
# are recorded in the assay description rather than resolved.
#
# Three new Key Events are minted here (KE:mie-pi3k-akt-mtor-activation,
# KE:ke-increased-autophagy, KE:ke-epithelial-apoptosis). No existing KE on
# main covers pathway activation, autophagy or apoptosis; each new block is
# kept minimal so the next paper can reuse it. All other KeyEvent blocks are
# copied verbatim from main.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:33235610"
  reference_title: "PM2.5 induces autophagy-mediated cell apoptosis via PI3K/AKT/mTOR signaling pathway in mice bronchial epithelium cells."
  doi: "10.3892/etm.2020.9433"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:han-flexivent-001"
    protocol_type: SpirometryProtocol
    name: "FlexiVent pulmonary function testing in anaesthetized mice"
    description: "On day 22 all experimental mice were anesthetized with 40 mg/kg sodium pentobarbital, intubated with a custom-made laryngoscope blade and mechanically ventilated with a rodent ventilator. Pulmonary functions - lung capacity, residual volume, tidal volume and airway resistance - were analysed using the FlexiVent system (SCIREQ) according to the manufacturer's protocol. The Results section lists the same panel as total lung capacity, residual volume, vital capacity and airway resistance."
    spirometry_standard: "FlexiVent forced oscillation system (SCIREQ), manufacturer's protocol"
    plethysmography_method: "invasive measurement in intubated, mechanically ventilated mice"
    equipment_required:
      - "FlexiVent system (SCIREQ)"
      - "Rodent ventilator"
      - "Custom-made laryngoscope blade"

  - id: "PROTOCOL:han-elisa-il1b-001"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for IL-1beta in mouse plasma"
    description: "On day 22 blood was collected from each group and plasma obtained by centrifugation at 10,000 x g for 10 min at 4 C. IL-1beta was measured with an ELISA kit (cat. no. MLB00C; Bio-Rad Laboratories, Inc.)."
    detection_method: "ELISA (Bio-Rad cat. no. MLB00C)"
    equipment_required:
      - "Microplate reader"
      - "IL-1beta ELISA kit (Bio-Rad cat. no. MLB00C)"
      - "Refrigerated centrifuge"

  - id: "PROTOCOL:han-elisa-il6-001"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for IL-6 in mouse plasma"
    description: "On day 22 blood was collected from each group and plasma obtained by centrifugation at 10,000 x g for 10 min at 4 C. IL-6 was measured with an ELISA kit (cat. no. M6000B; Bio-Rad Laboratories, Inc.)."
    detection_method: "ELISA (Bio-Rad cat. no. M6000B)"
    equipment_required:
      - "Microplate reader"
      - "IL-6 ELISA kit (Bio-Rad cat. no. M6000B)"
      - "Refrigerated centrifuge"

  - id: "PROTOCOL:han-he-001"
    protocol_type: StainingProtocol
    name: "Hematoxylin and eosin staining of mouse lung sections"
    description: "Lung tissues were fixed with 4% formaldehyde overnight at room temperature, embedded in paraffin and cut into 4 um sections. Sections underwent hematoxylin and eosin staining for 30 min at room temperature, were washed with PBS three times and observed under a light microscope at x100 magnification (Olympus Corporation)."
    staining_type: "hematoxylin and eosin (H&E)"
    detection_method: "light microscopy at x100 magnification"
    equipment_required:
      - "Microtome"
      - "Light microscope (Olympus Corporation)"

  - id: "PROTOCOL:han-dcfhda-001"
    protocol_type: ImagingProtocol
    name: "DCFH-DA fluorescence detection of ROS production in MBECs"
    description: "A 2',7'-dicholorofluorescein-diacetate (DCFH-DA) probe was used to evaluate ROS production in PM2.5-treated MBECs in six-well plates. DCFH-DA (10 uM) was added and cells cultured for 30 min at 37 C in the dark, then washed three times with ice-cold PBS. ROS production was examined at x50 magnification on a fluorescence microscope (Olympus Corporation) and fluorescence intensity calculated with analysis LS 5.0 soft image solution (Olympus Imaging America Inc.)."
    fluorescent_labeling: "2',7'-dicholorofluorescein-diacetate (DCFH-DA), 10 uM, 30 min at 37 C in the dark"
    fluorescent_tracer: "DCFH-DA"
    equipment_required:
      - "Fluorescence microscope (Olympus Corporation)"
      - "DCFH-DA probe"
      - "analysis LS 5.0 soft image solution"

  - id: "PROTOCOL:han-wb-001"
    protocol_type: MolecularAssayProtocol
    name: "Western blotting for PI3K, phospho-PI3K, AKT and phospho-AKT"
    description: "MBECs (5x10^6) were lysed in RIPA buffer (M-PER reagent for cells, T-PER for tissues; Thermo Fisher Scientific). Protein concentration was measured with a BCA protein assay kit. Protein (20 ug) was electrophoresed on a 15% SDS-PAGE gel and transferred to PVDF (EMD Millipore). Membranes were blocked with 5% BSA at 4 C overnight, probed with primary rabbit anti-rat antibodies, washed three times in PBST, incubated with HRP-conjugated goat anti-rabbit IgG mAb (1:2,000; cat. no. PV-6001; OriGene Technologies) for 1 h at 37 C, and developed with a chemiluminescence assay system (EMD Millipore). Densitometric quantification used Quantity-One 1.2 software (Bio-Rad Laboratories)."
    detection_method: "chemiluminescent immunoblot with densitometric quantification (Quantity-One 1.2)"
    normalization_method: "beta-actin loading control"
    antibodies_used:
      - "PI3K (1:1,000; cat. no. ab76315; Abcam)"
      - "phosphorylated PI3K (1:500; cat. no. ab182651; Abcam)"
      - "AKT (1:500; cat. no. ab185633; Abcam)"
      - "phosphorylated AKT (1:1,000; cat. no. ab133458; Abcam)"
      - "beta-actin (1:2,000; cat. no. ab8226; Abcam)"
      - "HRP-conjugated goat anti-rabbit IgG mAb (1:2,000; cat. no. PV-6001; OriGene Technologies, Inc.)"
    equipment_required:
      - "SDS-PAGE apparatus"
      - "Chemiluminescence imaging system (EMD Millipore)"

  - id: "PROTOCOL:han-tunel-tissue-001"
    protocol_type: StainingProtocol
    name: "TUNEL apoptosis staining of mouse lung tissue sections"
    description: "TUNEL analysis used an In Situ Cell Death Detection kit (DeadEnd Colorimetric Tunel System; Promega Corporation). Lung tissue sections (4 um) were deparaffinized in xylene, rehydrated in graded ethanol and rehydrated for 3 min, then incubated with TUNEL for 2 h at 37 C per the manufacturer's protocol. Images were captured in six fields of view with a ZEISS LSM 510 confocal microscope at 488 nm, x100 magnification, and the apoptosis rate measured with Developer XD 1.2 software (Definiens AG). Note the tissue incubation is 2 h, versus 1 h for cultured cells, so the two TUNEL runs are recorded as separate protocols."
    staining_type: "TUNEL (DeadEnd Colorimetric Tunel System, Promega)"
    detection_method: "confocal microscopy at 488 nm, x100 magnification; apoptosis rate by Developer XD 1.2"
    equipment_required:
      - "ZEISS LSM 510 confocal microscope"
      - "In Situ Cell Death Detection kit (DeadEnd Colorimetric Tunel System, Promega)"
      - "Developer XD 1.2 software (Definiens AG)"

  - id: "PROTOCOL:han-tunel-cells-001"
    protocol_type: StainingProtocol
    name: "TUNEL apoptosis staining of cultured MBECs"
    description: "MBECs were treated with 4% paraformaldehyde for 15 min at room temperature, washed three times with PBST at room temperature, and incubated with TUNEL (DeadEnd Colorimetric Tunel System, Promega) for 1 h at 37 C per the manufacturer's protocol. Cells were washed three times with PBS and incubated with 5% DAPI (Sigma-Aldrich) under Antifade mounting medium (cat. no. P0126; Beyotime Institute of Biotechnology) for 30 min at 37 C. Images were captured in six fields of view with a ZEISS LSM 510 confocal microscope at 488 nm, x100 magnification, and the apoptosis rate measured with Developer XD 1.2 software (Definiens AG)."
    staining_type: "TUNEL (DeadEnd Colorimetric Tunel System, Promega) with DAPI counterstain"
    detection_method: "confocal microscopy at 488 nm, x100 magnification; apoptosis rate by Developer XD 1.2"
    equipment_required:
      - "ZEISS LSM 510 confocal microscope"
      - "In Situ Cell Death Detection kit (DeadEnd Colorimetric Tunel System, Promega)"
      - "Developer XD 1.2 software (Definiens AG)"

  - id: "PROTOCOL:han-lc3b-if-001"
    protocol_type: ImagingProtocol
    name: "LC3B immunofluorescence for autophagy in MBECs"
    description: "MBECs in culture dishes were fixed with 4% paraformaldehyde for 15 min at room temperature and blocked with 0.5% BSA for 30 min at 37 C. Cells were washed three times with PBST at room temperature and incubated with anti-LC3B (1:1,000; cat. no. ab48394; Abcam) for 12 h at 4 C, then with Alexa Fluor 488-labeled goat anti-rabbit secondary antibodies (1:2,000; Beyotime Institute of Biotechnology) for 12 h at 4 C. Images were captured on a confocal microscope (ZEISS GmbH; LSM510 META; x100 magnification) and analysed with AxioVision Rel. 4.6 software (Zeiss GmbH)."
    fluorescent_labeling: "anti-LC3B (Abcam ab48394, 1:1,000) with Alexa Fluor 488-labeled goat anti-rabbit secondary (1:2,000), imaged by confocal microscopy at x100 magnification and analysed with AxioVision Rel. 4.6"
    equipment_required:
      - "Confocal microscope (ZEISS LSM510 META)"
      - "Anti-LC3B antibody (Abcam ab48394)"
      - "AxioVision Rel. 4.6 software"

