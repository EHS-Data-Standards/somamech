    description: "Intracellular reactive oxygen species imaged with a DCFH-DA probe in MBECs placed for 24 h in air containing PM2.5 or in 95% air / 5% CO2. ROS production was upregulated by PM2.5 relative to control, which the authors read as the source of oxidative injury in lung cells. Fluorescence intensity was calculated with analysis LS 5.0 but reported only as images and figure bars (Fig. 2C), so no numeric value is recorded."
    ros_probe_type: "DCFH-DA"
    evidence:
      - reference: "PMID:33235610"
        reference_title: "PM2.5 induces autophagy-mediated cell apoptosis via PI3K/AKT/mTOR signaling pathway in mice bronchial epithelium cells."
