# =============================================================================
# INTRAEPITHELIAL MUCUS MORPHOMETRY
# =============================================================================

goblet_cell_assays:
  - id: "GCM:carvalho-pm25-mucus-120min"
    name: "Intraepithelial mucus stores - frog palate exposed to urban PM 2.5"
    description: "AB-PAS point-counting morphometry of the frog palate epithelium after 120 minutes of immersion. Urban PM 2.5 (0.1 mg/mL, n=10 and 3.0 mg/mL, n=9), even at the lowest concentration, significantly reduced the volume proportion of stored intraepithelial acid, neutral and total mucus, consistent with mucus-secretory epithelial cells extruding their contents. The two p-values reported for this effect belong to different contrasts: the results text gives p<0.05 for PM 2.5 versus the amphibian Ringer's control, while the Figure 4 legend gives p<0.001 for both PM 2.5 concentrations versus the TSP and Ringer's groups. PM 2.5 also decreased epithelial thickness (p=0.01; the Figure 5 legend attributes this decrease to the higher concentration). Total suspended particles behaved like the amphibian Ringer's control for both endpoints. Volume proportions are shown only in Figures 4 and 5, so no numeric value is recorded here."
    has_specified_output:
      id: "GCM:carvalho-pm25-mucus-120min-output"
      name: "Intraepithelial mucus volume proportions - urban PM 2.5"
      description: "Volume proportions of intraepithelial acid mucus, neutral mucus and total mucus (acid + neutral), expressed as a percentage of the epithelial area, all decreased after PM 2.5 exposure; values reported graphically only (Figure 4)."
    has_exposure_condition:
      - id: "EXPOSURE:carvalho-pm25-0.1mgml-120min"
        name: "Urban PM 2.5 0.1 mg/mL in amphibian Ringer's solution for 120 minutes"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
        exposure_concentration:
          value: "0.1"
          unit:
            id: "UO:0000176"
            name: "milligram per milliliter"
        exposure_duration:
          value: "120"
          unit:
            id: "UO:0000031"
            name: "minute"
      - id: "EXPOSURE:carvalho-pm25-3.0mgml-120min"
        name: "Urban PM 2.5 3.0 mg/mL in amphibian Ringer's solution for 120 minutes"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
        exposure_concentration:
          value: "3.0"
          unit:
            id: "UO:0000176"
            name: "milligram per milliliter"
        exposure_duration:
          value: "120"
          unit:
            id: "UO:0000031"
            name: "minute"
    informs_on_key_event:
      id: "KE:ke-decreased-epithelial-mucus"
      name: "Decreased stored epithelial mucus"
      biological_action: decreased
      level_of_biological_organization: cellular
    study_subject:
      subject_type: CellularSystem
      id: "soma:carvalho-frog-palate-001"
      name: "Ex vivo frog palate preparation"
      description: "Excised palate of a mature Rana catesbeiana frog (approximately 100 g), rested for two days at 4 degrees Celsius and used on the third day; 38 palates were used across the four experimental groups."
      cell_type:
        id: "CL:0000067"
        name: "ciliated epithelial cell"
      anatomical_origin:
        id: "UBERON:0005019"
        name: "mucosa of palate"
      model_species:
        id: "NCBITaxon:8400"
        name: "Aquarana catesbeiana"
      donor_info: "Mature Rana catesbeiana frogs weighing approximately 100 g, obtained from a vivarium in the city of Mogi das Cruzes; per-group sizes are given in each assay description"
    follows_protocols:
      - protocol_type: StainingProtocol
        id: "PROTOCOL:carvalho-abpas-001"
        name: "AB-PAS morphometry of intraepithelial mucus and epithelial thickness"
    evidence:
      - reference: "PMID:26598085"
        reference_title: "Chemical composition modulates the adverse effects of particles on the mucociliary epithelium."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "reduced epithelial mucous and epithelium thickness, while total suspended particles behaved similarly to the control group."
        explanation: "States that urban PM 2.5 lowered stored epithelial mucus and epithelial thickness while total suspended particles did not, which is the contrast this morphometry assay records."

