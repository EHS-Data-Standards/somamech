  - id: "COMP:chen-so2-pm10-interaction"
    name: "SO2 x PM10 crude (unadjusted) interaction coefficient for the relative risk of obstructive impairment"
    description: "SO2 modified the relationship of PM10 with the relative risk of obstructive impairment: interaction beta = 0.01 with SE 0.00, p for interaction = 0.0052. This is the CRUDE, UNADJUSTED interaction term: in Table 3 the 'beta (SE), P for interaction' column sits inside the crude block, immediately after the crude OR and its p-value, and before the model 1 and model 2 adjusted OR columns. The model-adjusted counterpart from the same table row is recorded separately in COMP:chen-so2-pm10-interaction-adjusted and is NOT significant (beta = 0.00, SE 0.00, p = 0.3423). The paper headlines this crude term in its abstract and Results text, which is why it is recorded, but it should not be read as an adjusted effect. The value is a coefficient on the log-odds scale for the SO2 x PM10 product term, not a change in any lung function measurement, and its positive sign means the PM10 association strengthens as SO2 rises. change_type is absolute_difference with a dimensionless unit because that is what a regression coefficient is; change_direction reflects the sign of beta only."
