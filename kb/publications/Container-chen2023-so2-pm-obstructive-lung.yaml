      subject_characteristics: "2,635 Taiwan Biobank volunteers aged 30-70 with no history of cancer: 1,225 men (46.5%) and 1,410 women (53.5%), mean age 49.80 +/- 10.53 years. By monitoring region, 494 (18.7%) northern, 529 (20.1%) central and 1,612 (61.2%) southern Taiwan. 1,917 (72.8%) never smokers and 718 (27.2%) current or former smokers; 2,371 (90.0%) no or occasional alcohol consumption and 264 (10.0%) current or quit. Mean height 162.94 +/- 8.25 cm, weight 64.38 +/- 12.05 kg, BMI 24.14 +/- 3.4 kg/m2, body adiposity index 28.5 +/- 3.88, body roundness index 3.71 +/- 1.11. Comorbidities: hypertension 275 (10.4%), type 2 diabetes 120 (4.6%), renal failure 4 (0.2%), metabolic syndrome 475 (18.0%), coronary artery disease 27 (1.0%). Each participant provided informed consent and underwent a face-to-face interview, physical examination, blood sampling and a lifestyle questionnaire. The Taiwan Biobank holds no information on occupational exposure to toxic substances, which the authors list as a limitation."
      clinical_context: "Cross-sectional, population-based study linking the Taiwan Biobank to the Taiwan Air Quality Monitoring Database; exposure assigned from the nearest of 74 monitoring stations as the average concentration over the year leading up to each participant's survey date. Because the design is cross-sectional, the authors state that further prospective studies are needed to elucidate causal effects."
