# =============================================================================
# KEY EVENT RELATIONSHIPS
#
# The KeyEvent blocks below are copied verbatim from the wordings already on
# main: "Increased oxidative stress" (KE:mie-oxidative-stress, 55 occurrences,
# unanimous) and "Decreased lung function" (KE:ao-decreased-lung-function,
# 32 occurrences, unanimous). Neither was re-authored here.
#
# EVIDENCE STRENGTH: weak, and deliberately so. This paper measures no
# oxidative stress marker of its own — not one. The oxidative stress limb of
# this relationship is the authors' PROPOSED MECHANISM in the Discussion,
# resting on cited work (SO2 causing oxidative stress and DNA damage; Yun et
# al.'s finding that PM10 and SO2 together induce reactive oxygen species and
# NF-kB activation at low concentrations). What this paper contributes is the
# epidemiological other end: residential SO2, and the SO2 x PM interaction,
# associated with obstructive impairment in 2,635 people. The relationship is
# recorded because the authors explicitly draw it, with its provenance stated
# rather than glossed.
#
# And note how narrow that epidemiological end is. The SO2 main effect is
# solid (adjusted OR 1.25 and 1.28, both models). The INTERACTION, which is
# the paper's title claim, is significant only in Table 3's crude column;
# every model-adjusted interaction term is non-significant (see the response
# comparisons note above). What survives adjustment is Table 4's bivariate
# thin-plate smoothing splines, quoted below. So the synergy limb of this
# relationship rests on the GAM spline result, not on an adjusted interaction
# coefficient — another reason evidence_support is weak rather than moderate.
# =============================================================================

key_event_relationships:
  - id: "KER:chen-oxidative-stress-to-lung-function"
    name: "Increased oxidative stress is associated with decreased lung function"
    description: "The authors' proposed mechanism linking their epidemiological findings to lung injury: SO2 exposure affects the respiratory tract and causes oxidative stress and DNA damage that further damages the lungs, and the SO2 x PM synergy they report is attributed, citing Yun et al., to PM10 and SO2 jointly inducing reactive oxygen species production and NF-kB activation at low concentrations of both. This paper measures no oxidative stress marker itself; the oxidative stress limb comes entirely from cited literature in the Discussion, while the decreased lung function limb is this paper's own cross-sectional association (adjusted OR for obstructive impairment 1.25 and 1.28 per ppb SO2). The design is cross-sectional, so the authors state that prospective studies are needed to elucidate causal effects."
    upstream_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    relationship_type: "associated with"
    evidence_support: weak
    evidence:
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Exposure to SO2 has been shown to affect the respiratory tract and cause oxidative stress and DNA damage, which would further damage the lungs ( 39)."
        explanation: "The authors' statement of the oxidative stress mechanism connecting SO2 exposure to lung damage. It cites reference 39 rather than any measurement in this paper, which is why evidence_support is weak."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "That is because, we found that there was a synergistic effect between SO2 and PM2.5/PM10. Yun et al. found that synergistic injury in terms of cell survival and apoptosis occurred under low concentrations of PM10 and SO2 (15). The proposed mechanism was that PM10 and SO2 synergistic induced cytotoxicity of radical oxygen species production and nuclear factor kappa B (NF-κB) activation (15, 50)."
        explanation: "States the reactive-oxygen-species mechanism the authors propose for their SO2 x PM synergy, and makes explicit that it is Yun et al.'s in vitro finding rather than a measurement in this study."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The GAM (Figure 1) showed that obstructive impairment was associated with a quadratic pattern for SO2 (per SD) and PM10 (per SD) in model 1, and a quadratic pattern for SO2 (per SD) but not PM2.5 (per SD) in model 2. We also found that the bivariate thin-plate smoothing spline in models 1 and 2 were significantly associated with obstructive impairment (p < 0.0001) (Table 4)."
        explanation: "This paper's own contribution to the downstream limb: the generalized additive model result establishing that the joint SO2-PM surface, not either pollutant alone, is what tracks obstructive impairment."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Spline2(SO2 per SD, PM10 per SD) 4.00 37.19 37.19 <0.0001"
        explanation: "The Table 4 row giving the bivariate thin-plate smoothing spline statistic for SO2 with PM10 (DF 4.00, chi-square 37.19, p < 0.0001), the quantitative form of the synergy claim."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Spline2 (SO2 per SD, PM2.5 per SD) 4.00 48.04 48.04 <0.0001"
        explanation: "The Table 4 row giving the bivariate thin-plate smoothing spline statistic for SO2 with PM2.5 (DF 4.00, chi-square 48.04, p < 0.0001)."
      - reference: "PMID:37809009"
        reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "CONCLUSION: Our study showed high temperature, humidity, and low rainfall increased the risk of obstructive lung disease. Synergistic effects were observed among temperature, SO2, and PM2.5/PM10. The impact of air pollutants on obstructive lung disease should consider these interactions."
        explanation: "The authors' own conclusion, which is the claim this relationship records: the joint action of SO2, PM and meteorology on obstructive lung disease."
