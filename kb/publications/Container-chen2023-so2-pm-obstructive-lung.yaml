        spirometry_standard: "American Thoracic Society and European Respiratory Society guidelines (FEV1/FVC < 70% defines obstruction)"
      - id: "PROTOCOL:chen-air-monitoring-001"
        name: "Taiwan Air Quality Monitoring Database: 74-station daily ambient pollutant monitoring"
      - id: "PROTOCOL:chen-exposure-assignment-001"
        name: "Three-step geocoding of residential address to nearest monitoring station, one-year average exposure"
      - id: "PROTOCOL:chen-statistics-001"
        name: "ANOVA, propensity score matching, multinomial logistic regression and generalized additive modelling"

# =============================================================================
# RESPONSE COMPARISONS — the paper's reported regression and interaction
# estimates.
#
# MODELLING NOTE: every record below is an estimate the paper states, with
# derivation: reported_in_paper. Two kinds appear:
#
#   1. ODDS RATIOS for obstructive impairment, from stepwise multinomial
#      logistic regression (model 1 carries PM10, model 2 carries PM2.5;
#      PM10 and PM2.5 correlate at r = 0.69 so they are never fitted
#      together). change_type is ratio and change_value is dimensionless.
#      compared_measurement is "fev1_fvc_ratio" because the modelled outcome
#      is obstructive impairment DICHOTOMIZED from that ratio at 70% — the
#      odds ratio is not a change in the ratio itself, and each description
#      says so. control_output and treated_output are omitted throughout:
#      these are coefficients on continuous exposures across the whole
#      cohort, not contrasts between the two output records, so no pair of
#      records exists for them to point at.
#
#   2. INTERACTION COEFFICIENTS beta (SE) with their p for interaction,
#      testing whether SO2 modifies the PM10 or PM2.5 relationship with the
#      relative risk of obstructive impairment. These are log-odds-scale
#      coefficients, so change_type is absolute_difference with a
#      dimensionless unit, and change_direction reflects the sign of beta,
#      not a direction of lung function change.
#
# READING TABLE 3'S COLUMNS CORRECTLY — this matters for the interaction
# terms. Table 3's column order is:
#
#   Crude OR (95%CI) | P-value | beta (SE), P for interaction
#     || Model 1 Adjusted OR | P || Model 2 Adjusted OR | P
#     || Adjusted beta (SE), P for interaction
#
# So the "beta (SE), P for interaction" column the paper headlines in its
# abstract sits inside the CRUDE block, BEFORE the model 1 and model 2
# adjusted OR columns — it is an unadjusted interaction term, not a model 1
# estimate. A separate "Adjusted beta (SE), P for interaction" column closes
# the table. Both are recorded below, as separate comparisons:
#
#   term            crude beta (SE), p        adjusted beta (SE), p
#   SO2 x PM10      0.01 (0.00), 0.0052       0.00 (0.00), 0.3423
#   SO2 x PM2.5     0.01 (0.00), 0.0155       0.05 (0.05), 0.3423
#   per-SD PM10     0.11 (0.04), 0.0052      -0.00 (0.00), 0.5086
#   per-SD PM2.5    0.09 (0.04), 0.0155      -0.03 (0.04), 0.5086
#
# ALL FOUR ADJUSTED INTERACTION TERMS ARE NON-SIGNIFICANT, and the two
# per-SD ones change sign. Keeping only the significant crude terms — which
# is what the abstract and Results text discuss — would make this file read
# as stronger synergy evidence than Table 3 shows, so the adjusted terms are
# recorded alongside them. The paper never comments on the discrepancy. The
# synergy claim in the abstract and Conclusion rests on the crude interaction
# terms and on Table 4's bivariate thin-plate smoothing splines (chi-square
# 37.19 for SO2 x PM10 and 48.04 for SO2 x PM2.5, both p < 0.0001), not on
# the adjusted interaction coefficients.
#
# Table 3's crude main-effect ORs for the three pollutants are recorded too,
# so the crude interaction terms sit beside the crude main effects they
# belong with.
#
# A p-value printed only as a threshold (p < 0.001, p < 0.0001) cannot go in
# the float p_value slot, so p_value is omitted for those records and the
# threshold is stated in the description instead. Note that the Results text
# and Table 3 disagree on these thresholds for several adjusted ORs (text
# p < 0.001, table p < 0.0001); the affected descriptions say so.
# =============================================================================

response_comparisons:
  # --- FEV1 percent-predicted, case group vs comparison groups ---
  - id: "COMP:chen-fev1pred-obstructive-vs-normal"
    name: "FEV1 percent-predicted, obstructive impairment group vs full normal spirometry group"
    description: "FEV1 percent-predicted was 58.42 +/- 18.31% in the obstructive impairment group versus 95.09 +/- 13.73% in the normal spirometry group, reported at p < 0.0001 (Table 1, one-way ANOVA). The paper prints only the two group values and the threshold p, never a difference, percent change or ratio, so change_value is omitted rather than computed. The p-value is a threshold, not an exact value, so p_value is omitted too. Note the direction of this contrast is the definition of the groups, not a treatment effect: participants were assigned to groups by their own spirometry."
    derived_from_assay: "LF:chen-twb-spirometry"
    compared_measurement: "fev1"
    control_output: "LF:chen-twb-spirometry-output-normal"
    treated_output: "LF:chen-twb-spirometry-output-obstructive"
    change_type: absolute_difference
    change_direction: decreased
    statistical_test: "one-way ANOVA between spirometry groups (Table 1), reported as p < 0.0001"
    derivation: reported_in_paper

  - id: "COMP:chen-fev1pred-obstructive-vs-normal-matched"
    name: "FEV1 percent-predicted, obstructive impairment group vs propensity-score-matched normal spirometry subset"
    description: "FEV1 percent-predicted was 58.42 +/- 18.31% in the obstructive impairment group versus 95.13 +/- 13.54% in the 1:2 propensity-score-matched normal spirometry subset, again at p < 0.0001 (Table 1). Matching on age category, sex, region, smoking, drinking, BMI, BAI and BRI barely moved the comparison group's value (95.09% unmatched to 95.13% matched), which is what the authors use to argue the spirometry contrast is not driven by those baseline characteristics. change_value and p_value are omitted for the same reasons as the unmatched comparison."
    derived_from_assay: "LF:chen-twb-spirometry"
    compared_measurement: "fev1"
    control_output: "LF:chen-twb-spirometry-output-normal-matched"
    treated_output: "LF:chen-twb-spirometry-output-obstructive"
    change_type: absolute_difference
    change_direction: decreased
    statistical_test: "one-way ANOVA between spirometry groups after 1:2 propensity score matching (Table 1), reported as p < 0.0001"
    derivation: reported_in_paper

