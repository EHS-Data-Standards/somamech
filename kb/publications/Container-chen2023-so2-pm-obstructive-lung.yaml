    derived_from_assay: "LF:chen-twb-spirometry"
    compared_measurement: "fev1_fvc_ratio"
    change_type: ratio
    change_direction: increased
    change_value:
      value: "1.25"
      unit:
        id: "UCUM:1"
        name: "odds ratio (dimensionless)"
      variability:
        variability_type: confidence_interval_95
