# =============================================================================
# Chen et al. (2023) - The impact of the synergistic effect of SO2 and
# PM2.5/PM10 on obstructive lung disease in subtropical Taiwan
# =============================================================================
#
# Source: Front Public Health. 2023;11:1229820
# DOI: 10.3389/fpubh.2023.1229820
# PMID: 37809009
#
# Study design (HUMAN OBSERVATIONAL — cross-sectional, population-based; not
# in vitro, not an animal experiment):
#   - 2,635 Taiwan Biobank (TWB) volunteers aged 30-70 with no history of
#     cancer, linked to the Taiwan Air Quality Monitoring Database (TAQMD)
#   - Residential address geocoded to the nearest of 74 air quality monitoring
#     stations; each participant's exposure is the station's AVERAGE
#     concentration over the year leading up to their survey date
#   - Spirometry recorded in the TWB (MicroLab spirometer, Spida 5 software);
#     obstructive lung disease defined as FEV1/FVC < 70% per ATS/ERS guidance
#
# IMPORTANT — WHAT THE GROUP CONTRAST ACTUALLY IS:
#   The two groups here are defined by OUTCOME, not by assigned exposure:
#   participants were split by their own spirometry into an obstructive
#   impairment group (FEV1/FVC < 70%, n = 733) and a normal spirometry group
#   (n = 1,902), and the air pollutant concentrations are MEASURED EXPOSURES
#   that happened to differ between those two outcome groups. There is no
#   unexposed arm and no assigned treatment anywhere in the paper. The output
#   records below therefore use experimental_group: treated for the
#   obstructive impairment group and control for the normal spirometry group
#   as the nearest available coding of "case" and "comparison" — the exposure
#   did not create the groups, the outcome did. A third output record carries
#   the propensity-score-matched normal spirometry group (1:2 matching on age
#   category, sex, region, smoking, drinking, BMI, BAI and BRI; n = 1,466),
#   which is a SUBSET of the 1,902 normal-spirometry participants rather than
#   an independent group.
#
# IMPORTANT — THE ONLY NUMERIC LUNG FUNCTION VALUE IS PERCENT-PREDICTED:
#   Table 1's only spirometry row is "FEV10_PRED" — FEV1 as a percentage of
#   its predicted value (the row's own category breakdown runs >=80%, 50-80%,
#   30-50%, <30%, confirming it is a percentage). The paper reports NO
#   absolute FEV1 or FVC in litres and no mean FEV1/FVC ratio, so the fev1
#   slot below carries a PERCENT value, not a volume, and every such record
#   says so in its name and description. The LungFunctionAssay schema
#   anticipates this ("often reported as % of predicted baseline") and
#   reference_dataset records that the authors never state which reference
#   equation produced the predicted values.
#
# IMPORTANT — THE PM ODDS RATIOS POINT THE "WRONG" WAY, AS REPORTED:
#   Higher SO2 was associated with obstructive impairment (adjusted OR 1.25
#   and 1.28), but higher PM10 and PM2.5 were associated with LOWER odds
#   (adjusted OR 0.99 and 0.97) — i.e. the obstructive group lived where SO2
#   was higher and PM was lower. The authors explicitly flag this as contrary
#   to most previous studies and attribute it to the SO2 x PM synergy they
#   report: injury occurs at LOW concentrations of both pollutants together.
#   These directions are recorded exactly as the paper reports them, with the
#   authors' own explanation in each comparison's description; nothing has
#   been re-signed or re-interpreted.
#
# Key findings recorded here:
#   - FEV1 percent-predicted 58.42 +/- 18.31% in the obstructive impairment
#     group vs 95.09 +/- 13.73% in the normal spirometry group (p < 0.0001)
#   - SO2 positively correlated with PM10 (r = 0.53) and PM2.5 (r = 0.52),
#     both p < 0.0001; PM10 and PM2.5 correlated r = 0.69, p < 0.0001
#   - SO2 modified the PM10 (beta = 0.01, p = 0.0052) and PM2.5 (beta = 0.01,
#     p = 0.0155) relationships with the relative risk of obstructive
#     impairment; per-SD, beta = 0.11 and 0.09 with the same p-values. These
#     are Table 3's CRUDE interaction terms — see the note below, because the
#     model-adjusted interaction terms in the same rows are NOT significant
#   - Adjusted ORs for obstructive impairment: SO2 1.25 (model 1) and 1.28
#     (model 2); PM10 0.99; PM2.5 0.97; temperature 1.24 and 1.31; relative
#     humidity 1.05 and 1.04; rainfall 0.08 in both models
#   - Bivariate thin-plate smoothing splines of SO2 with PM10 (chi-square
#     37.19) and with PM2.5 (chi-square 48.04) were associated with
#     obstructive impairment at p < 0.0001 — the synergy result
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:37809009"
  reference_title: "The impact of the synergistic effect of SO(2) and PM(2.5)/PM(10) on obstructive lung disease in subtropical Taiwan."
  doi: "10.3389/fpubh.2023.1229820"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:chen-spirometry-001"
    name: "Taiwan Biobank spirometry with ATS/ERS FEV1/FVC < 70% definition of obstruction"
    description: "Pulmonary function parameters including forced expiratory volume in one second (FEV1), forced vital capacity (FVC), the FEV1/FVC% ratio, the FVC-predicted value and the FEV1-predicted value were recorded in the Taiwan Biobank. Technicians used MicroLab spirometers and Spida 5 software (Micro Medical Ltd., Rochester, Kent, UK) to perform the spirometry measurements. Obstructive lung diseases including asthma, COPD and bronchiectasis were defined as patients with FEV1/FVC < 70%, according to the American Thoracic Society and European Respiratory Society guidelines. The paper does not state a reference equation for the predicted values, nor whether spirometry was pre- or post-bronchodilator."
    spirometry_standard: "American Thoracic Society and European Respiratory Society guidelines (FEV1/FVC < 70% defines obstruction)"
    equipment_required:
      - "MicroLab spirometer (Micro Medical Ltd., Rochester, Kent, UK)"
      - "Spida 5 software (Micro Medical Ltd.)"

  - id: "PROTOCOL:chen-air-monitoring-001"
    name: "Taiwan Air Quality Monitoring Database: 74-station daily ambient pollutant monitoring"
    description: "Daily ambient pollutant concentrations came from 74 air quality monitoring stations located throughout Taiwan, as recorded by the Taiwan Air Quality Monitoring Database (TAQMD) of the Taiwan Environmental Protection Administration. Measurement methods by pollutant: PM2.5 and PM10 by beta-ray attenuation; SO2 by ultraviolet fluorescence; CO by nondispersive infrared; O3 by ultraviolet absorption; NOx by chemiluminescence. All air pollutant data are stored in the cloud every hour and are free to access, and the average concentrations of air pollutants in a selected year were obtained before analysis."
    equipment_required:
      - "74 Taiwan EPA air quality monitoring stations"
      - "Beta-ray attenuation monitors (PM2.5, PM10)"
      - "Ultraviolet fluorescence analyser (SO2)"

  - id: "PROTOCOL:chen-exposure-assignment-001"
    name: "Three-step geocoding of residential address to nearest monitoring station, one-year average exposure"
    description: "A three-step procedure assigned each participant an exposure. First, Google geocoding determined the exact geoposition of each residential address. Second, the interpolation point between each residential address and the nearest air quality monitoring station was determined. Lastly, data from that station recorded during the year leading up to the survey date were selected and the average values of PM2.5, PM10, CO, NO, NO2, NOx, SO2 and O3 for the chosen year were calculated. The exposure metric is therefore a ONE-YEAR AVERAGE at the nearest station, not a personal measurement; the authors list this as a limitation, since personal exposure, travel exposure and indoor air quality are not captured."

  - id: "PROTOCOL:chen-statistics-001"
    name: "ANOVA, propensity score matching, multinomial logistic regression and generalized additive modelling"
    description: "Descriptive analysis between spirometry groups used one-way ANOVA and the chi-square or Fisher's exact tests as appropriate; air pollution factors were compared between the obstructive impairment group and the normal spirometry comparison group by independent t-test. Propensity score matching (1:2) balanced baseline characteristics (age categories, sex, live region, smoking, drinking, BMI, BAI and BRI). Multinomial logistic regression estimated crude odds ratios and 95% CIs, and stepwise multinomial logistic regression calculated adjusted ORs and 95% CIs. Pearson's correlation analysis evaluated relationships between temperature, relative humidity, rainfall, PM10, PM2.5 and SO2. Because SO2 correlated with both PM2.5 and PM10, a generalized additive model (GAM) was used to fit equations and splines and to explore linear and nonlinear effects on obstructive impairment, with a semiparametric model taking temperature, relative humidity and rainfall as the linear part. All analyses used SAS version 9.4."

# =============================================================================
# LUNG FUNCTION ASSAY — Taiwan Biobank spirometry in 2,635 participants,
# linked to one-year average residential air pollutant concentrations.
#
# One assay, three output records: the outcome-defined obstructive impairment
# group, the full normal spirometry comparison group, and the
# propensity-score-matched subset of that comparison group. Each points at the
# COND record describing its own group's residential air, while the per-group
# per-pollutant distributions sit on the EXPOSURE records (one agent each, as
# ExposureCondition carries a single exposure_agent). The regression and GAM
# results are in response_comparisons below.
# =============================================================================

lung_function_assays:
  - id: "LF:chen-twb-spirometry"
    name: "Taiwan Biobank spirometry (FEV1 percent-predicted) by obstructive impairment status, with one-year average residential SO2, PM10 and PM2.5"
    description: "Cross-sectional spirometry in 2,635 Taiwan Biobank participants (mean age 49.80 +/- 10.53 years; 1,225 men (46.5%) and 1,410 women (53.5%)), each linked to the one-year average pollutant concentrations at their nearest air quality monitoring station. Participants were stratified by their own lung function into a normal spirometry control group (72.2%, 1902/2635) and an obstructive impairment group (27.8%, 733/2635, FEV1/FVC < 70%). FEV1 percent-predicted was 58.42 +/- 18.31% in the obstructive impairment group versus 95.09 +/- 13.73% in the normal spirometry group (p < 0.0001), and 95.13 +/- 13.54% in the propensity-matched normal subset (p < 0.0001). No absolute FEV1 or FVC volume and no mean FEV1/FVC ratio is reported anywhere in the paper, so the fev1 slot on each output carries a PERCENT-PREDICTED value. AFTER 1:2 propensity score matching the two groups did not differ in age, gender, smoking, alcohol consumption, anthropometric factors or comorbidities - that sentence of the paper follows its matching paragraph and describes the MATCHED comparison. In Table 1's UNMATCHED columns several of those characteristics do differ: age p = 0.0216, body adiposity index p = 0.0369, type 2 diabetes p = 0.0449 and monitoring region p < 0.0001. So the balance claim should not be read as a property of the raw 733-vs-1,902 contrast that the rest of this file uses. WHOLE-COHORT POLLUTANT LEVELS (Table 1, median (IQR) over all 2,635 observations): PM10 68.12 (17.2) ug/m3, PM2.5 37.72 (10.8) ug/m3, SO2 3.63 (1.19) ppb, CO 0.44 (0.18) ppm, NO 4.09 (3.83) ppb, NO2 14.86 (5.6) ppb, NOX 18.93 (8.71) ppb, O3 30.97 (3.85) ppb; only SO2, PM10 and PM2.5 are carried as structured exposure conditions here because the remaining pollutants play no part in the paper's models. WHOLE-COHORT METEOROLOGY (Table 1, mean (SD)): temperature 24.33 (0.75) degrees C, relative humidity 74.28 (2.45)%, rainfall 0.22 (0.05) mm/day; the obstructive group lived at higher temperature (24.41 +/- 0.84 vs 24.31 +/- 0.72 degrees C, p = 0.0016), higher relative humidity (74.51 +/- 2.37 vs 74.20 +/- 2.47%, p = 0.0028) and lower rainfall (0.21 +/- 0.05 vs 0.22 +/- 0.05 mm/day, p = 0.0039). Meteorological values are recorded here as description text only: ExposureCondition carries exposure_agent, concentration, duration and timing, with no slot for ambient temperature, humidity or rainfall, and their odds ratios are recorded in response_comparisons. 61.2% of participants (1,612 individuals) were from southern Taiwan, which the authors offer as the reason their 27.8% prevalence of obstructive impairment far exceeds Taiwan's reported 6.1% COPD and 5.1% asthma prevalence."
    reference_dataset: "reference equation not stated by the authors; FEV1-predicted and FVC-predicted values were recorded in the Taiwan Biobank and Table 1 reports FEV1 percent-predicted (FEV10_PRED) without naming the predicted-value source"
