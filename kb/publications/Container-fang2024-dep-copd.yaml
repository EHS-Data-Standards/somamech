# =============================================================================
# Fang et al. (2024) - Fine particulate matter contributes to COPD-like
# pathophysiology: experimental evidence from rats exposed to diesel exhaust
# particles
# =============================================================================
#
# Source: Respir Res. 2024;25:14 (PMID:38178075)
# DOI: 10.1186/s12931-023-02623-y
#
# Study design:
#   - 36 male Sprague Dawley rats (6 weeks old, ~200 g), healthy lungs
#   - Six groups by exposure condition (filtered-air controls, 2-wk, 4-wk and
#     8-wk DEP), 6 rats per group
#   - Whole-body inhalation of freshly generated diesel exhaust particles
#     (DEP, a model PM2.5) in a 3.3 x 2.2 x 2.2 m Teflon-lined chamber,
#     4 h/day, 6 days/week, for 2, 4 or 8 consecutive weeks
#   - Steady-state particle mass concentration 1.03 mg/m3 (0.99-1.07),
#     ~25-fold the filtered-air chamber concentration of 0.042 mg/m3
#   - Endpoints: airway/alveolar morphometry, PAS + MUC5AC staining, tissue
#     inflammatory-cell counts, BALF differential + cytokine ELISA,
#     alpha-SMA immunofluorescence, lung hydroxyproline, serum MDA/8-OHdG,
#     and lung function (Forced Pulmonary Maneuver System)
#
# Key findings captured here:
#   - Lung function: total lung capacity increased at 2, 4 and 8 wk
#     (8-wk: 19.0 vs 15.9 ml); lung resistance increased at 4 and 8 wk
#     (0.16 vs 0.13 cm H2O s/ml) - an obstructive/hyperinflation pattern
#   - Mucus: MUC5AC-positive and PAS-positive cells per mm basement membrane
#     increased at 4 and 8 wk (8-wk PAS: 6.67 vs 0.33 cells/mm BM)
#   - Inflammation: peribronchial eosinophils up 6.5-fold (4 wk) and
#     14.0-fold (8 wk); Ibal-1+ macrophages and mast cells also increased;
#     BALF total cells, macrophages, neutrophils and TNF-alpha/IL-6/IL-13/
#     IL-17A increased; NO neutrophil infiltration in tissue, and BALF IL-5
#     unchanged
#   - Remodeling: alpha-SMA in small airway wall 24.5% (4 wk) and 24.7%
#     (8 wk) vs ~9.8% in controls; alveolar alpha-SMA+ cells up at all
#     durations; lung hydroxyproline up at 4 and 8 wk
#   - Oxidative stress: serum MDA increased at every duration, 8-OHdG at
#     4 and 8 wk (figure-only values, direction recorded without numbers)
#
# Curation notes:
#   - Values that appear ONLY in figures (BALF differential counts, BALF
#     cytokine concentrations, serum MDA and 8-OHdG) are recorded as
#     direction + quoted evidence, with no numeric output slots invented.
#   - Airway/alveolar morphometry (WAt of small airways ~2-fold up; MLI
#     89.7 vs 48.1 um at 4 wk and 101.8 vs 51.1 um at 8 wk; subepithelial
#     fibrosis area) has no dedicated assay class in this schema; it is
#     summarised here and quoted inside the remodeling assays rather than
#     modelled as its own assay.
#   - Peribronchial inflammatory-cell counts are IHC/special-stain counts on
#     lung sections, not lavage; they are carried as BALFSputumAssay entries
#     (the schema's only airway-inflammation assay class) with
#     sample_type: biopsy and total_cell_count in cells per mm of basement
#     membrane. See the PR description.
#
# =============================================================================

source_publication:
  reference: "PMID:38178075"
  reference_title: "Fine particulate matter contributes to COPD-like pathophysiology: experimental evidence from rats exposed to diesel exhaust particles."
  doi: "10.1186/s12931-023-02623-y"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:fang-dep-inhalation-001"
    name: "Whole-body inhalation exposure to freshly generated diesel exhaust particles"
    description: "Rats were placed in a 3.3 m x 2.2 m x 2.2 m Teflon-coated chamber and inhaled freshly generated DEP 4 h a day, 6 days a week, for 2, 4 or 8 consecutive weeks. DEP were generated by a 2.0 L Nissan M1D diesel automotive engine burning Sinopec #0 diesel fuel. Chamber temperature 21.0 degrees C and relative humidity 60.0%. Controls inhaled filtered ambient air under the same chamber settings. Particle mass concentration was determined gravimetrically from quartz fiber filters and particle number concentration with a Dylos DC1700 counter at one-minute resolution."
    equipment_required:
      - "2.0 L diesel automotive engine (Nissan, M1D, Japan)"
      - "Teflon-coated whole-body exposure chamber (3.3 m x 2.2 m x 2.2 m)"
      - "High-volume particulate matter samplers (Thermo, GUV-15HBL1, USA) with Whatman QM-A quartz fiber filters"
      - "Dylos DC1700 particle counting device"
      - "Thermal/optical transmittance aerosol carbon analyzer (Sunset Laboratory Inc.)"

  - id: "PROTOCOL:fang-lungfunction-001"
    name: "Forced pulmonary maneuver lung function measurement in anesthetized rats"
    description: "Rats were anesthetized with pentobarbital (60 mg/kg body), tracheostomized, intubated and placed in the body chamber of the Forced Pulmonary Maneuver System. Average breathing frequency was set to 80 breaths/min. Resistance and compliance were determined by measuring tracheal pressure and flow continuously during ventilation. Total lung capacity was determined by a quasi-static pressure volume maneuver inflating the lungs to +30 cm H2O and slowly exhaling to -30 cm H2O."
    equipment_required:
      - "Forced Pulmonary Maneuver System (Buxco Research Systems, USA)"
      - "Tracheal cannula and ventilator"

  - id: "PROTOCOL:fang-bal-001"
    name: "Bronchoalveolar lavage with H&E differential counts and cytokine ELISA"
    description: "The lung was lavaged with 2 ml saline three times to obtain about 5 ml of bronchoalveolar lavage fluid. BALF cells were stained with hematoxylin and eosin for differential leukocyte counting, at least 400 cells per slide. Cytokines in the BALF supernatant were measured by ELISA. Black carbon area phagocytosed by macrophages was quantified from high-magnification light micrographs, at least 10 fields per slide, blinded."
    equipment_required:
      - "ELISA kits (R&D Systems, USA)"
      - "Light microscope"
      - "ImageScope software (Leica Biosystems, v.11)"

  - id: "PROTOCOL:fang-pas-muc5ac-001"
    name: "PAS staining and MUC5AC immunohistochemistry of small airway epithelium"
    description: "Right upper lungs were fixed in 10% buffered formalin, cut into 4-um sections and deparaffinized. Periodic Acid-Schiff staining identified mucus-containing cells; PAS-positive cells were counted in the superficial epithelia of small airways (perimeter < 1000 um) and divided by the length of the basement membrane. MUC5AC immunohistochemistry used a mouse monoclonal anti-MUC5AC antibody overnight at 4 degrees C followed by a two-step detection system."
    equipment_required:
      - "MUC5AC mouse monoclonal antibody (Abcam, #Ab3649, UK)"
      - "Two-step detection system (ZSGB-Bio, #PV-9000, China)"
      - "Light microscope"

  - id: "PROTOCOL:fang-tissue-inflammation-001"
    name: "Special staining and immunohistochemistry for inflammatory cells in lung tissue"
    description: "Macrophages and neutrophils were labelled with Ibal-1 and neutrophil elastase by standard immunohistochemistry. Eosinophils were stained red with chromotrope 2R (1% in 5% phenol) for 30 min; mast cell cytoplasmic granules were detected with 1% toluidine blue. Positive cells were quantified with the NIH Image Analysis system and expressed as cells per millimeter of basement membrane, at least 10 fields per slide, blinded."
    equipment_required:
      - "Ibal-1 antibody (Wako, #019-19741, Japan)"
      - "Neutrophil elastase antibody (Abcam, #ab310335, UK)"
      - "Chromotrope 2R (Sigma-Aldrich, #4197-07-3)"
      - "Toluidine blue (Sigma-Aldrich, #6586-04-5)"
      - "NIH Image Analysis system"

  - id: "PROTOCOL:fang-asma-if-001"
    name: "Alpha-SMA immunofluorescence of peripheral lung"
    description: "Lung sections were incubated with a mouse monoclonal anti-alpha-SMA antibody overnight at 4 degrees C, washed, incubated with a secondary antibody and viewed under a laser confocal microscope. In small airways the alpha-SMA-positive area was expressed relative to total airway wall area; in the alveolar region alpha-SMA-positive cells were counted per mm2."
    equipment_required:
      - "alpha-SMA mouse monoclonal antibody (Novus Biologicals, #NB300-978, USA)"
      - "Secondary antibody (Abcam, #ab6881, UK)"
      - "Laser confocal microscope (Nikon, C1Si, Japan)"

  - id: "PROTOCOL:fang-hydroxyproline-001"
    name: "Colorimetric hydroxyproline assay of lung tissue"
    description: "The lower right lungs were analyzed for hydroxyproline content as an estimate of collagen content using a colorimetric assay kit."
    equipment_required:
      - "Hydroxyproline Colorimetric Assay Kit (BioVision, #K555-100, USA)"
      - "Plate reader"

  - id: "PROTOCOL:fang-serum-oxstress-001"
    name: "Serum MDA and 8-OHdG by HPLC and LC-MS/MS"
    description: "Blood was taken from the left heart with a 25G needle, left to clot at 4 degrees C and centrifuged at 4 degrees C, 2400 g for 10 min. Serum stored at -80 degrees C was analyzed for malondialdehyde (MDA) and 8-hydroxy-2'-deoxyguanosine (8-OHdG) using published HPLC and LC-MS/MS methods."
    equipment_required:
      - "HPLC system"
      - "LC-MS/MS system"
      - "Refrigerated centrifuge"

