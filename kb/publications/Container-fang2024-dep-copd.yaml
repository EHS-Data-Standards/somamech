oxidative_stress_assays:

  - id: "OX:fang-dep-serum-8wk"
    name: "Serum MDA and 8-OHdG after DEP inhalation"
    description: "Systemic oxidative stress was assessed in serum. Serum MDA (lipid peroxidation) increased significantly after DEP exposures of any duration, and serum 8-OHdG (DNA oxidation) increased significantly after the 4-week and 8-week exposures. The concentrations themselves are shown only in Fig. 7 A-B, so no numeric values are recorded here. n = 6 rats/group."
    assay_date: "2024-01-01"
    has_specified_output:
      id: "OX:fang-dep-serum-8wk-output"
      name: "Increased serum MDA and 8-OHdG after DEP exposure"
