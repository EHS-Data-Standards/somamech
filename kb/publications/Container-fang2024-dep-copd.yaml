      - reference: "PMID:38178075"
        reference_title: "Fine particulate matter contributes to COPD-like pathophysiology: experimental evidence from rats exposed to diesel exhaust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Serum levels of two oxidative stress biomarkers (MDA and 8-OHdG) were significantly increased."
        explanation: "States that both oxidative stress biomarkers recorded in this assay increased significantly."
      - reference: "PMID:38178075"
        reference_title: "Fine particulate matter contributes to COPD-like pathophysiology: experimental evidence from rats exposed to diesel exhaust particles."
        supports: SUPPORT
