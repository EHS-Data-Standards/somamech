        snippet: "Compared to the filtered air control, 4-wk and 8-wk DEP exposures induced a ... increase in 8-OhdG concentration, respectively"
        explanation: "States that the serum 8-OHdG increase was significant after the 4-week and 8-week exposures."
      - reference: "PMID:38178075"
        reference_title: "Fine particulate matter contributes to COPD-like pathophysiology: experimental evidence from rats exposed to diesel exhaust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We also observed a significant increase in serum MDA concentration following DEP exposures of any duration"
        explanation: "States that the serum MDA increase was significant at every exposure duration."
      - reference: "PMID:38178075"
        reference_title: "Fine particulate matter contributes to COPD-like pathophysiology: experimental evidence from rats exposed to diesel exhaust particles."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Systemic effects of DEP exposures were assessed using serum malondialdehyde (MDA, a product of lipid ... and 8-hydroxy-deoxyguanosine (8-OhdG, a product of DNA oxidation)."
        explanation: "Identifies the two serum markers measured in this assay and what each reports on."
