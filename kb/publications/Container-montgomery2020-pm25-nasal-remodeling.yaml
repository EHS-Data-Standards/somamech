# =============================================================================
# Montgomery et al. (2020) - Genome-Wide Analysis Reveals Mucociliary
# Remodeling of the Nasal Airway Epithelium Induced by Urban PM2.5
# =============================================================================
#
# Source: Am J Respir Cell Mol Biol (2020)
# DOI: 10.1165/rcmb.2019-0454OC
# Committed cache: references_cache/PMID_32275839.md (content_type:
#   full_text_html, PMC7397762 via OpenAlex) — every snippet below is verbatim
#   in that committed file, so CI can re-check all of them.
#
# Study design (from the committed full text):
#   - Primary human nasal AECs from GALA II childhood asthma study donors,
#     differentiated at air-liquid interface, stimulated on Day 28-32
#   - PM2.5 collected 2011 on 47-mm PTFE filters at three California sites
#     (Bakersfield/Fresno, Sacramento, Yuba City), fractionated into a
#     water-soluble extract (WE) and an organic extract (OE); blank filters
#     extracted as mock controls
#   - Acute dose-response (n=5 donors): WE 3 and 30 ug/cm2; OE 0.045, 0.45 and
#     4.5 ug/cm2; NIST 2786 reference material 30 ug/cm2. Two apical
#     stimulations 24 h apart, harvest 24 h after the second (48 h total)
#   - Moderate OE dose (0.45 ug/cm2) characterized on 12 donors (6 healthy,
#     6 with asthma)
#   - Chronic model: high OE dose (Yuba City sample) or 10 ng/ml IL-13,
#     re-applied every 24 h for five stimulations (5 days)
#
# Units note: log2 fold changes (LFCs) from RNA-seq/qPCR are recorded in the
# measurement slots WITHOUT a unit, because the repo has no unit term for a
# log2 fold change and labelling an LFC "fold change" would misstate it by a
# power of two. Each such output record's description says it is an LFC and
# carries the paper's P value, which has no slot outside
# response_comparisons. Genuine linear fold changes (immunofluorescence,
# Western blot, AB-PAS, mucin secretion) and the percent decrease in FOXJ1+
# nuclei are recorded in response_comparisons, with their p_value and
# statistical_test in the dedicated slots.
#
# Relationship to the two existing test fixtures for this PMID
# (tests/data/valid/Container-montgomery2020-pm25-mucociliary.yaml and
# Container-montgomery2020-extended.yaml): those are schema fixtures, not kb
# entries — they carry no source_publication and no evidence quotes. This file
# is the corpus extraction: written from the committed cache text, with an
# exact quote on every assay. KeyEvent blocks are copied byte-for-byte from
# the fixtures (shared vocabulary); every other ID is new, so nothing in this
# file collides with a fixture ID carrying different content.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:32275839"
  reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
  doi: "10.1165/rcmb.2019-0454OC"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:montgomery-extract-prep-001"
    name: "PM2.5 collection, fractionation and chemical characterization"
    description: "PM2.5 collected on 47-mm polytetrafluoroethylene filters at three California monitoring sites in 2011, pooled by region and fractionated into water-soluble (WE) and organic (OE) extracts. WE species quantified by inductively coupled plasma mass spectrometry and ion chromatography; OE PAH species by gas chromatography-mass spectrometry. Blank filters were extracted to produce the mock extract controls used for stimulations."
    equipment_required:
      - "47-mm polytetrafluoroethylene filters"
      - "Inductively coupled plasma mass spectrometer"
      - "Ion chromatograph"
      - "Gas chromatograph-mass spectrometer"

  - id: "PROTOCOL:montgomery-ali-stim-001"
    name: "Nasal AEC air-liquid interface culture and apical extract stimulation"
    description: "Primary nasal AECs expanded and differentiated at air-liquid interface. On mucociliary differentiation (Day 28-32 of ALI culture) cultures were washed with PBS and apically treated with mock extract or PM2.5 extract in a final volume of 20 ul culture media; the wash and stimulation were repeated at 24 hours and RNA was collected 24 hours later. For chronic experiments the wash and stimulation were repeated every 24 hours for five stimulations, with a high OE dose or 10 ng/ml IL-13."
    equipment_required:
      - "Transwell inserts"
      - "ALI culture media"
      - "RNA lysis buffer (Zymo Research) with 40 mM DTT"

  - id: "PROTOCOL:montgomery-transcriptome-001"
    name: "Whole transcriptome RNA-seq of stimulated ALI cultures"
    description: "KAPA mRNA HyperPrep (Roche) whole transcriptome libraries from 250 ng RNA per sample with 12 cycles of amplification, sequenced on the Illumina NovaSeq 6000. Paired differential expression analysis between mock-stimulated and extract-stimulated cultures from the same donor; DEG enrichment tested with Enrichr against GO/KEGG/Reactome and against scRNA-seq-derived cell type marker lists, with P values corrected for multiple testing. Networks built with FGNet and GeneTerm Linker."
    equipment_required:
      - "KAPA mRNA HyperPrep kit (Roche)"
      - "Illumina NovaSeq 6000"

  - id: "PROTOCOL:montgomery-qpcr-chronic-001"
    name: "Quantitative PCR of chronically stimulated cultures"
    description: "Quantitative PCR of chronic OE- and IL-13-stimulated cultures against paired mock/media controls. The paper places the detailed qPCR conditions in its online data supplement, which is not part of the cached article text."

  - id: "PROTOCOL:montgomery-if-mucin-001"
    name: "Immunofluorescence labeling for MUC5AC and MUC5B"
    description: "Immunofluorescence labeling of culture histological sections for the gel-forming mucins MUC5AC and MUC5B with DAPI nuclear counterstain, followed by quantification of MUC5AC+ and MUC5B+ cells. Representative of labeling in cultures from four donors."
    equipment_required:
      - "Fluorescence microscope"
      - "Anti-MUC5AC antibody"
      - "Anti-MUC5B antibody"
      - "DAPI"

  - id: "PROTOCOL:montgomery-if-foxj1-001"
    name: "Immunofluorescence labeling for FOXJ1 and acetylated alpha-tubulin"
    description: "Confocal fluorescence microscopy maximum projections of intact epithelial cultures labeled for E-cadherin, acetylated alpha-tubulin (cilia) and FOXJ1, with DAPI nuclear counterstain, followed by quantification of FOXJ1+ nuclei. Representative of labeling in cultures from three donors."
    equipment_required:
      - "Confocal fluorescence microscope"
      - "Anti-FOXJ1 antibody"
      - "Anti-acetylated alpha-tubulin antibody"
      - "Anti-E-cadherin antibody"
      - "DAPI"

  - id: "PROTOCOL:montgomery-abpas-staining-001"
    name: "Alcian blue-periodic acid-Schiff staining of culture sections"
    description: "Alcian blue-periodic acid-Schiff staining of culture histological sections for mucopolysaccharides/mucins, with quantification of AB-PAS+ cells. Four donor pairs examined."
    equipment_required:
      - "AB-PAS staining reagents"
      - "Light microscope"

  - id: "PROTOCOL:montgomery-wb-spdef-001"
    name: "Western blot for SPDEF protein"
    description: "Western blot analysis of total protein for SPDEF, quantified by band intensity normalized to actin as a loading control. Representative of data from five independent donors."
    equipment_required:
      - "SDS-PAGE apparatus"
      - "Anti-SPDEF antibody"
      - "Densitometry imaging system"

  - id: "PROTOCOL:montgomery-mucin-elisa-001"
    name: "ATP-induced mucin secretion assay with colorimetric ELISA"
    description: "ATP-induced mucus secretion assay followed by colorimetric ELISA absorbance readings at 490 nm for MUC5AC and MUC5B in the secretions of cultures from five donors."
    equipment_required:
      - "Plate reader (490 nm)"
      - "MUC5AC ELISA"
      - "MUC5B ELISA"
      - "ATP stimulation reagent"

