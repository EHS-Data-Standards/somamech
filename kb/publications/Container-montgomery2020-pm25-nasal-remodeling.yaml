  - id: "GE:montgomery-il1a-il1b-mod"
    name: "IL1A and IL1B expression - moderate OE dose"
    description: "IL1A (LFC 0.91) and IL1B (LFC 1.22) were among the most highly upregulated genes at the moderate OE dose. In the eight-metagroup OE response network built with FGNet, CYP1A1, IL1A and IL1B were shared across metagroups and had especially high betweenness centrality, marking the IL-1 axis as a hub of the response rather than an incidental signal. Both were further upregulated at the high OE dose."
