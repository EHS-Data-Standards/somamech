# =============================================================================
# KEY EVENT RELATIONSHIPS - as stated by the paper
# =============================================================================

key_event_relationships:
  - id: "KER:montgomery-ahr-to-il1"
    name: "AhR pathway activation leads to IL-1 inflammatory program activation"
    description: "The paper places AHR signaling activation by PM2.5 PAHs as the early, central event underlying the wider epithelial response, with IL1A and IL1B as the hub genes of the resulting inflammatory network."
    upstream_event:
      id: "KE:mie-ahr-activation"
      name: "AhR pathway activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-il1-inflammation"
      name: "IL-1 inflammatory program activation"
      biological_action: increased
      level_of_biological_organization: molecular
    relationship_type: "directly leads to"
    evidence_support: moderate
    quantitative_understanding: low
    evidence:
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "which in turn initiates a mucus secretory program in the airway epithelium"
        explanation: "Closes the paper's summary sentence that moderate OE exposure triggers AHR signaling and IL-1-mediated inflammation, placing the two molecular events on one chain; the paper states co-occurrence and network centrality, not a perturbation experiment, so evidence_support is moderate."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "TheCYP1A1,IL1A, andIL1Bgenes were shared by multiple metagroups and exhibited especially high betweenness centrality, indicating the likely critical nature of these genes in the transcriptional response to OE stimulation."
        explanation: "The network evidence placing the AHR marker CYP1A1 and the IL-1 cytokines in one connected response."

  - id: "KER:montgomery-il1-to-goblet"
    name: "IL-1 inflammatory program activation leads to goblet cell hyperplasia"
    description: "The paper's central mechanistic claim: the IL-1-driven inflammatory network initiates the mucus secretory program, whose transcription factors SPDEF and FOXA3 drive mucus metaplasia, confirmed cellularly by the chronic exposure model."
    upstream_event:
      id: "KE:ke-il1-inflammation"
      name: "IL-1 inflammatory program activation"
      biological_action: increased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke2-goblet-hyperplasia"
      name: "Goblet cell hyperplasia"
      biological_action: increased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: moderate
    quantitative_understanding: low
    evidence:
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "which in turn initiates a mucus secretory program in the airway epithelium"
        explanation: "The paper's statement that the AHR- and IL-1-driven response initiates the mucus secretory program; the chronic model then shows the cellular hyperplasia, but no IL-1 blockade experiment is reported, so evidence_support is moderate."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "These data demonstrate that chronic OE stimulation induces simultaneous expansion and reduction of MUC5AC+and MUC5B+mucus secretory cells, respectively, resulting in corresponding changes in secretion of these mucins."
        explanation: "The cellular-level confirmation that the transcriptional mucus secretory program ends in an expanded MUC5AC+ secretory compartment and altered mucin secretion."
