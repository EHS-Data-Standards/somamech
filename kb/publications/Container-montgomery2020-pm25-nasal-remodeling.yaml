gene_expression_assays:

  # ---- Dose-response: which PM2.5 fraction moves the transcriptome at all
  - id: "GE:montgomery-deg-burden-dose-series"
    name: "Differentially expressed gene burden across the PM2.5 extract dose series"
    description: "Paired mock-versus-treated RNA-seq across the full acute dose series in five donor cultures. Water-soluble extract produced no DEGs at either 3 or 30 ug/cm2. Organic extract produced a dose-dependent DEG burden: 11 DEGs at the low dose (0.045 ug/cm2), 124 at the moderate dose (0.45 ug/cm2) and 1,296 at the high dose (4.5 ug/cm2) - roughly a 10-fold rise in DEG count per 10-fold rise in concentration. The NIST 2786 reference material at 30 ug/cm2 gave 111 DEGs, comparable in size to the moderate OE dose. DEG counts are study-level totals rather than per-gene measurements, so they are recorded in these descriptions and no QuantityValue is invented for them."
    gene_expression_method: "Whole transcriptome RNA-seq (KAPA mRNA HyperPrep, Illumina NovaSeq 6000)"
    normalization_reference: "paired mock-stimulated culture from the same donor"
    evidence:
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "from 11 (low dose) to 124 (moderate dose) to 1,296 (high dose)"
        explanation: "Gives the dose-dependent DEG counts for the three organic extract doses that this assay's three treated output records stand for."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "No genes exhibited significantly modified expression with either WE stimulation concentration tested."
        explanation: "Supports the two water-soluble extract output records, which record a null transcriptomic response at both WE concentrations."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We also detected 111 DEGs induced by NIST 2786 stimulation, a response comparable in size to the moderate OE dose stimulation"
        explanation: "Supports the NIST 2786 benchmark output record and its comparison with the moderate OE dose."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Experiments were conducted by performing two consecutive stimulations at the indicated concentrations 24 hours apart, with culture harvest 24 hours after the second stimulation."
        explanation: "Establishes the 48-hour acute exposure duration recorded on every acute exposure condition in this file."
    has_specified_output:
      - id: "GE:montgomery-deg-burden-dose-series-output-mock"
        name: "Mock extract control, acute stimulation"
        description: "Paired mock (blank filter extract) control. All DEG counts and log2 fold changes in this file are relative to this paired control, so no absolute expression value is recorded here."
