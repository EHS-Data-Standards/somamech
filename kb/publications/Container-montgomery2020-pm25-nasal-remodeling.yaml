# =============================================================================
# GOBLET CELL / MUCIN ASSAYS
# =============================================================================

goblet_cell_assays:

  # ---- Gel-forming mucin transcripts and their ratio across the acute dose series
  - id: "GCM:montgomery-mucin-transcripts-acute"
    name: "Gel-forming mucin transcripts and MUC5AC/MUC5B ratio - acute OE dose series"
    description: "MUC5AC was strongly induced at the moderate OE dose (LFC 0.90) together with the normally gut-restricted gel-forming mucin MUC2 (LFC 1.34). MUC5B trended down only at the high dose (LFC -0.79, Padj = 1.0e-1). The resulting MUC5AC/MUC5B ratio, which governs the viscoelastic properties of airway mucus, rose significantly at the moderate dose (P = 3.19e-2) and further at the high dose (P = 2.68e-2), both by two-tailed paired t test against mock-treated cultures. A high-dose-specific induction of mucin O-glycosylation enzymes (GALNT3, 5, 6, 7, 12 and GCNT3) accompanied the ratio shift. Mucin mRNA values are log2 fold changes; the ratio itself is reported only as a significant increase, with no ratio value, so no QuantityValue is recorded for it."
    evidence:
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "MUC5AC(mucin 5AC), was strongly induced by OE stimulation, as was another gel-forming mucin,MUC2(mucin 2), which is normally expressed in the gut and lowly expressed in the airway (LFC, 0.90 and 1.34, respectively; Table E2)"
        explanation: "Source of the MUC5AC LFC of 0.90 and the MUC2 LFC of 1.34 recorded on the moderate-dose output record."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we observed a trend toward decreased expression of the other major gel-forming mucin,MUC5B(mucin 5B), only with the high OE dose"
        explanation: "Source of the MUC5B decrease recorded on the high-dose output record, and of its status as a trend (Padj = 1.0e-1) rather than a significant change."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "It is notable that a significant increase in theMUC5AC/MUC5Bratio with moderate OE dose"
        explanation: "States the significant increase in the MUC5AC/MUC5B ratio at the moderate dose, which this assay records qualitatively because the paper gives only its p-values."
      - reference: "PMID:32275839"
