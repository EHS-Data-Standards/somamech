  # ---- Chronic OE: FOXJ1 transcript and nuclear protein
  - id: "FOXJ:montgomery-foxj1-chronic"
    name: "FOXJ1 expression and nuclear localization - chronic OE stimulation"
    description: "Chronic OE stimulation lowered FOXJ1 transcript levels (LFC -0.36, P = 1.92e-2; IL-13 benchmark LFC -1.15, P = 6.34e-3) and, by confocal immunofluorescence in three donors, produced a 75% average decrease in FOXJ1+ nuclei versus mock (P = 1.20e-2) - more pronounced than the nonsignificant 40% decrease under IL-13 (P = 1.02e-1). Ciliary structure and abundance were relatively consistent across conditions, although acetylated alpha-tubulin staining appeared weaker in OE-stimulated cultures, so the paper reads this as loss of nuclear FOXJ1 rather than loss of ciliated cells. The percent decreases are recorded in response_comparisons."
    evidence:
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "OE-stimulated cultures displayed a 75% average decrease in FOXJ1+nuclei compared with mock-treated cultures"
        explanation: "Source of the 75% decrease in FOXJ1+ nuclei recorded for the chronic OE condition (P = 1.20e-2 in the same sentence of the cached text)."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "as well as downregulation ofFOXJ1(forkhead box J1)"
        explanation: "Source of the FOXJ1 transcript downregulation under chronic OE and IL-13 recorded on the two treated output records."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The lack of nuclear FOXJ1 in ciliated cells from chronic OE-stimulated cultures is consistent with the decrease in ciliated cell gene expression observed in our transcriptome analysis."
        explanation: "Ties the chronic nuclear FOXJ1 loss to the acute high-dose ciliary transcriptional downregulation, which is why both assays inform on the same altered ciliogenesis key event."
