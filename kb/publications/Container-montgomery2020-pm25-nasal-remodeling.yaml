foxj_assays:

  # ---- High acute OE dose: ciliated cell programs and their transcription factors
  - id: "FOXJ:montgomery-ciliary-programs-high-oe"
    name: "Ciliated cell expression programs - high acute OE dose"
    description: "Downregulated DEGs specific to the high OE dose were dominated by cilia development and function terms, and were highly enriched for ciliated cell marker genes (Padj = 3.57e-118). Mean expression of the ciliary movement (P = 3.05e-3) and ciliary assembly (P = 4.20e-4) GO modules fell only at the high dose, by two-tailed paired t test. The canonical ciliated cell differentiation transcription factors MCIDAS, MYB, TP73, RFX2, RFX3 and FOXJ1 were consistently decreased. The cached text gives no per-gene LFC for these transcription factors at this dose, so no value is recorded on the output record."
    evidence:
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Enrichment analysis of downregulated genes yielded multiple terms specific to the high OE dose, the majority of which were related to the development and function of cilia"
        explanation: "Establishes that the ciliary programs are the high-dose-specific downregulated signature this assay records."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "exhibited significant downregulation in expression only with high OE dose"
        explanation: "Covers the significant fall in the ciliary movement and ciliary assembly module means, and that it was confined to the high dose."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Supporting this loss in ciliated cell gene expression, we found canonical TFs controlling ciliated cell differentiation (MCIDAS,MYB,TP73,RFX2,RFX3, andFOXJ1) were consistently decreased with high OE dose"
        explanation: "Names the ciliogenesis transcription factors whose decrease this assay records as decreased ciliogenesis; copied exactly as cached, where the gene symbols run together."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Together, these data show that high OE dose mediates the same mucus secretory changes observed with moderate OE dose but also downregulates ciliary expression programs."
        explanation: "The paper's own summary that the ciliary downregulation is an additional, dose-dependent effect on top of the mucus secretory response."
    has_specified_output:
      - id: "FOXJ:montgomery-ciliary-programs-high-oe-output-mock"
        name: "Ciliated cell programs in paired mock-stimulated cultures"
        description: "Paired mock control; module expression and transcription factor changes are reported only against it."
        experimental_group: control
        measured_under: "EXPOSURE:montgomery-mock-48h"
      - id: "FOXJ:montgomery-ciliary-programs-high-oe-output-oe-high"
        name: "Ciliated cell programs at the high OE dose"
        description: "Ciliary assembly (P = 4.20e-4) and ciliary movement (P = 3.05e-3) module mean expression significantly downregulated; ciliated cell marker enrichment among downregulated DEGs Padj = 3.57e-118; MCIDAS, MYB, TP73, RFX2, RFX3 and FOXJ1 consistently decreased. No per-gene effect size is reported in the cached text, so no value is recorded."
        experimental_group: treated
        measured_under: "EXPOSURE:montgomery-oe-high-48h"
    assay_date: "2020-01-01"
    has_exposure_condition:
      - id: "EXPOSURE:montgomery-mock-48h"
        name: "Mock extract control (blank filter extract), two apical stimulations 24 h apart"
        exposure_duration:
          value: "48"
          unit:
            id: "UO:0000032"
            name: "hour"
      - id: "EXPOSURE:montgomery-oe-high-48h"
        name: "PM2.5 organic extract 4.5 ug/cm2 (high dose), two apical stimulations 24 h apart"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
        exposure_concentration:
          value: "4.5"
