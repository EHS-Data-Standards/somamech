  # ---- CYP1A1 and the AHR xenobiotic battery (moderate OE, n=12)
  - id: "GE:montgomery-cyp1a1-ahr-battery-mod"
    name: "CYP1A1 and AHR battery enzyme expression - moderate OE dose"
    description: "In the 12-donor moderate OE dose characterization (424 DEGs: 281 up, 143 down), CYP1A1 was the most highly induced gene at LFC 6.21. Other AHR-inducible xenobiotic metabolizing enzymes were also significantly induced (CYP1B1, NQO1, ALDH3A1), consistent with the PAH content of the organic extract acting through AHR-mediated transcriptional activation. The paper reports no effect sizes for CYP1B1, NQO1 or ALDH3A1 in the cached text, so only CYP1A1 carries a value."
    target_gene: "CYP1A1"
    gene_expression_method: "Whole transcriptome RNA-seq (KAPA mRNA HyperPrep, Illumina NovaSeq 6000)"
    normalization_reference: "paired mock-stimulated culture from the same donor"
    evidence:
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we found that the most highly OE-induced gene was the xenobiotic metabolizing cytochrome P450 enzyme,CYP1A1(LFC, 6.21;Figure 3B)"
        explanation: "Source of the CYP1A1 LFC of 6.21 recorded on the treated output record, and of the statement that it was the most highly induced gene. Gene symbols run into the surrounding words in the cached HTML text; the quote is copied exactly as cached."
      - reference: "PMID:32275839"
        reference_title: "Genome-Wide Analysis Reveals Mucociliary Remodeling of the Nasal Airway Epithelium Induced by Urban PM(2.5)."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Consistent with OE activation of the AHR receptor, we observed significant induction of other AHR-inducible xenobiotic metabolizing enzymes, includingCYP1B1and genes encoding the AHR battery enzymesNQO1"
        explanation: "Supports reading the CYP1A1 induction as AHR pathway activation rather than an isolated gene effect, which is the key event this assay informs on."
      - reference: "PMID:32275839"
