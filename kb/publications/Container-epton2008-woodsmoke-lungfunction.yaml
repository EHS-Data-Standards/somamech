      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    study_subject:
      subject_type: InVivoSubject
      id: "SUBJECT:epton-asthma-longitudinal"
      name: "Asthmatic boarding students under twice-daily lung function monitoring"
      description: "The asthma subgroup of the panel, followed with twice-daily spirometry and diary cards from end-March to early September 2004."
      model_species:
        id: "NCBITaxon:9606"
        name: "Homo sapiens"
      sex: "male"
      disease_state: "doctor-diagnosed asthma"
      subject_characteristics: "26 male boarders aged 12-18 with doctor-diagnosed asthma, all non-smokers. Reliever use was low, documented on 3.26% of diary card days, and did not differ between low and moderate/high pollution days (Mann-Whitney U, p = 0.488); daily reliever use was carried as a covariate in the regression models."
      clinical_context: "Longitudinal panel monitoring during the 2004 Christchurch winter"
    follows_protocols:
      - protocol_type: SpirometryProtocol
        id: "PROTOCOL:epton-spirometry-001"
        name: "Twice-daily personal electronic spirometry to ATS standards"
        spirometry_standard: "ATS"

  - id: "LF:epton-wholepanel-pollution-multivariate"
    name: "Whole-panel association of 24-hour average outdoor PM10 with FEV1 and PEFR"
    description: "Longitudinal analysis over the whole 93-student panel. FEV1 was available for a median of 129.5 time points per student (range 4-189) and PEFR for a median of 128 time points (range 2-186); both were expressed as within-student Z-scores. Univariate (Spearman) analysis found a significant negative correlation between morning FEV1 and the previous day's 24-hour average outdoor pollution (rho -0.201, p = 0.034). This did not survive adjustment: in the mixed-model linear regression across six lung function variables with pollution lagged out to seven days, no pollution variable was retained, only minor temperature effects. This assay therefore records a null whole-panel result."
    assay_date: "2004-07-01"
    evidence:
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "outdoor air pollution levels the previous day (Spearman's rho -0.201, p = 0.034)."
        explanation: "Gives the univariate Spearman correlation of -0.201 (p = 0.034) between morning FEV1 and the previous day's 24-hour average outdoor pollution recorded in this assay."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "and lagging air pollution measures out to seven days, no pollution variable was retained in a regression model, with only minor temperature effects being retained."
        explanation: "Records the negative multivariate finding this assay captures: no pollution variable survived adjustment in the whole panel."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
