  - id: "LF:epton-asthma-peak-pollution-multivariate"
    name: "Multivariate association of peak outdoor PM10 with FEV1 variability and afternoon PEFR in asthmatic students"
    description: "Mixed-model linear regression over six dependent lung function variables (FEV1 and PEF, morning and afternoon, and daily variation in both), with air pollution measures lagged out to seven days and daily reliever use as a covariate, run separately in the asthmatic students. Small but statistically significant associations were found between maximum outdoor air pollution levels and both FEV1 variability and night-time PEFR: with higher maximum outdoor pollution, morning-to-afternoon FEV1 variability dropped and afternoon PEFR dropped. Effect size was small, R2 of 3.6% for afternoon PEFR. Because the effects tracked 10-minute peak rather than 24-hour average pollution, the authors read them as a half-day to one-day lag effect. Reliever use was retained only in the model for daily PEF variability. No numeric lung function values are given for these model terms, so no output is recorded."
    assay_date: "2004-07-01"
    evidence:
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "When asthmatics were studied separately, small but statistically significant associations between maximum outdoor air pollution levels and variability in FEV 1, and night time PEFR were noted."
        explanation: "States the statistically significant multivariate associations in the asthma subgroup that this assay records."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FEV1 variability between morning and afternoon dropped, and afternoon PEFR dropped. Effect size was small, in the case of afternoon PEFR having an R2 of 3.6%."
        explanation: "Gives the direction of both effects and the R2 of 3.6% for afternoon PEFR recorded in this assay."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Peak outdoor PM 10 levels for a 10-minute period reached 105 μg/m3 and 257 μg/m3 respectively."
        explanation: "Gives the peak 10-minute outdoor PM10 levels of 105 and 257 ug/m3 that define this assay's peak-pollution exposure condition."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "There was no significant correlation between peak PM 10 levels and lung function in either asthmatics or non-asthmatics."
        explanation: "Records the countervailing univariate result: in bivariate analysis peak PM10 was not correlated with lung function in either subgroup, so the multivariate associations this assay records are the only peak-pollution effects detected."
    has_exposure_condition:
      - id: "EXPOSURE:epton-pm10-peak-outdoor"
        name: "Maximum 10-minute outdoor PM10 level; the two high-pollution event nights reached peaks of 105 and 257 ug/m3"
        exposure_agent:
          id: "ENVO:01000405"
          name: "respirable suspended particulate matter"
        exposure_concentration:
          value: "257"
          unit:
            id: "UCUM:ug/m3"
            name: "microgram per cubic meter"
