  # ---- Longitudinal lung function vs pollution ----

  - id: "LF:epton-asthma-morning-fev1-highpollution"
    name: "Morning FEV1 on moderate/high pollution days in asthmatic students"
    description: "Comparison of each asthmatic student's median morning FEV1 between moderate/high pollution days (24-hour average outdoor PM10 above 20 ug/m3) and low pollution days, by Mann-Whitney U test. Students with asthma had lower readings on high pollution days (p = 0.043). The paper reports the significance but not the group medians, so no numeric output is recorded. Restricting the analysis to moderate/high pollution days alone showed no significant correlation between lung function and pollution level."
    assay_date: "2004-07-01"
    evidence:
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "students with asthma demonstrated lower readings on high pollution days (p = 0.043)"
        explanation: "States the finding and p-value this assay records: lower morning FEV1 in asthmatic students on moderate/high pollution days."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "moderate/high (24 hour average> 20 μm/m3 outdoor) pollution days and low pollution days."
        explanation: "Defines the moderate/high pollution day threshold of a 24-hour average outdoor level above 20 ug/m3 used as this assay's exposure condition. (The paper writes the unit as 'μm/m3'; the 24-hour PM10 averages it reports elsewhere are in μg/m3.)"
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Peak levels of air pollution were associated with small but statistically significant effects on lung function in the asthmatic students, but not healthy students."
        explanation: "The authors' summary of the asthma-restricted lung function effect that this assay records."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The effect size however was small, with a change in PM10 of 50 μg/m3 being associated with a 1.5% increase in proportions of children reporting cough (equivalent to one extra report of cough on high pollution days in this cohort)."
        explanation: "Quantifies the parallel symptom effect on high pollution days, establishing the small magnitude of respiratory response at this exposure level."
    has_exposure_condition:
      - id: "EXPOSURE:epton-pm10-moderate-high-day"
        name: "Moderate/high pollution day, defined as a 24-hour average outdoor PM10 above 20 ug/m3 (wood-smoke-dominated ambient particulate)"
        exposure_agent:
          id: "ENVO:01000405"
          name: "respirable suspended particulate matter"
        exposure_concentration:
          value: "20"
          unit:
            id: "UCUM:ug/m3"
            name: "microgram per cubic meter"
    informs_on_key_event:
