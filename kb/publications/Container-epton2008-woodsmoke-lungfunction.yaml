      id: "SUBJECT:epton-asthma-longitudinal"
      name: "Asthmatic boarding students under twice-daily lung function monitoring"
      description: "The asthma subgroup of the panel, followed with twice-daily spirometry and diary cards from end-March to early September 2004."
      model_species:
        id: "NCBITaxon:9606"
        name: "Homo sapiens"
      sex: "male"
      disease_state: "doctor-diagnosed asthma"
      subject_characteristics: "26 male boarders aged 12-18 with doctor-diagnosed asthma, all non-smokers. Reliever use was low, documented on 3.26% of diary card days, and did not differ between low and moderate/high pollution days (Mann-Whitney U, p = 0.488); daily reliever use was carried as a covariate in the regression models."
      clinical_context: "Longitudinal panel monitoring during the 2004 Christchurch winter"
    follows_protocols:
      - protocol_type: SpirometryProtocol
        id: "PROTOCOL:epton-spirometry-001"
        name: "Twice-daily personal electronic spirometry to ATS standards"
        spirometry_standard: "ATS"

  - id: "LF:epton-nonasthma-morning-fev1-highpollution"
    name: "Morning FEV1 on moderate/high pollution days in non-asthmatic students"
    description: "The same moderate/high versus low pollution day comparison of median morning FEV1, restricted to students without asthma. No effect was seen. This assay records a negative result: ambient wood-smoke particulate pollution did not measurably reduce lung function in the healthy students."
    assay_date: "2004-07-01"
    evidence:
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "No effect was seen in non-asthmatic students."
        explanation: "Records the negative finding this assay captures: no lung function effect of moderate/high pollution days in the non-asthmatic students."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "There is no significant effect of ambient wood-smoke particulate air pollution on lung function of healthy school-aged students, but a small effect on respiratory symptoms."
        explanation: "The authors' own conclusion that lung function in the healthy students was not affected, which is the negative result this assay records."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "moderate/high (24 hour average> 20 μm/m3 outdoor) pollution days and low pollution days."
