# =============================================================================
# Epton et al. (2008) - The effect of ambient air pollution on respiratory
# health of school children: a panel study
# =============================================================================
#
# Source: Environ Health. 2008;7:16 (PMID:18479529)
# DOI: 10.1186/1476-069X-7-16
#
# Study design:
#   - Panel study, winter 2004, Christ's College boarding houses, central
#     Christchurch, New Zealand. Ambient particulate pollution in Christchurch
#     is dominated by domestic wood burning; PM10 is ~90% PM2.5.
#   - 93 male boarding students aged 12-18, all healthy non-smokers; 26 (28%)
#     with doctor-diagnosed asthma.
#   - Indoor and outdoor PM10/PM2.5/PM1 monitored continuously with a TEOM
#     Series 1400a, as 10-minute averages and 24-hour (midday-to-midday) means.
#   - Longitudinal arm: twice-daily FEV1 and PEFR on personal downloadable
#     Piko-1 spirometers plus symptom diary cards, over end-March to early
#     September 2004. Lung function expressed as within-student Z-scores.
#   - Event-study arm: within 24 h of two high-pollution nights (24 June,
#     21 July 2004) students gave urine (1-hydroxypyrene) and exhaled breath
#     condensate (pH, hydrogen peroxide). Two low-pollution control days
#     (autumn control, winter control) served as comparators.
#
# Key findings captured here:
#   - Baseline: no difference in % predicted FEV1 between asthmatic and
#     non-asthmatic students; FEV1/FVC significantly lower in asthmatics.
#   - Asthmatic students only: median morning FEV1 lower on moderate/high
#     pollution days (24-h outdoor PM10 > 20 ug/m3), p = 0.043; and, in
#     multivariate analysis, afternoon PEFR and morning-to-afternoon FEV1
#     variability fell with higher maximum outdoor pollution (R2 3.6% for
#     afternoon PEFR). No effect in non-asthmatic students.
#   - Whole panel: a univariate correlation of morning FEV1 with the previous
#     day's 24-h outdoor PM10 (rho -0.201, p = 0.034) did NOT survive
#     multivariate analysis - no pollution variable was retained.
#   - EBC hydrogen peroxide (oxidative stress) and EBC pH (airway
#     inflammation): no effect of pollution, in healthy or asthmatic students.
#   - Exposure was confirmed biologically: urinary 1-hydroxypyrene was
#     significantly higher on both high-pollution days than on either control
#     day (p < 0.0001).
#
# Curation notes:
#   - Urinary 1-hydroxypyrene is a PAH exposure biomarker; no SOMA assay class
#     covers it, so its values are recorded as evidence supporting the
#     exposure conditions of the event-study assays rather than as an assay.
#   - Respiratory symptom (cough, ENT) diary results have no SOMA assay class
#     either; the cough effect size is quoted as evidence on the asthma
#     high-pollution-day lung function assay.
#   - EBC pH and EBC H2O2 values are presented only in Figures 4 and 5, so no
#     numeric outputs are recorded for those assays - only the authors' stated
#     (null) findings.
#
# =============================================================================

source_publication:
  reference: "PMID:18479529"
  reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
  doi: "10.1186/1476-069X-7-16"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:epton-spirometry-001"
    name: "Twice-daily personal electronic spirometry to ATS standards"
    description: "All students were issued personal downloadable electronic spirometers (Piko-1) measuring FEV1 and peak expiratory flow rate to American Thoracic Society standards, and were trained in their use. Measurements were taken twice daily, in the early morning and around 6.00 pm, supervised by House Matrons who were trained nurses given training in spirometry. No instructions about withholding reliever medication were given. Data were downloaded at least fortnightly. Longitudinal data were cleaned against an a priori protocol to exclude physiologically impossible points, and each student's FEV1 and PEFR were expressed as a Z-score relative to that student's own mean over the study period."
    equipment_required:
      - "Piko-1 downloadable electronic spirometer (Ferraris Respiratory Europe Ltd, Hertford, UK)"

  - id: "PROTOCOL:epton-baseline-spirometry-001"
    name: "Baseline spirometry and atopy assessment"
    description: "Prior to the study the health status of the students was assessed by a brief medical history, with baseline spirometry and skin prick testing for atopic status. Baseline FEV1 is reported as percent predicted and FEV1/FVC as a ratio; the paper does not name the predicted-value reference equations used."

  - id: "PROTOCOL:epton-pollution-001"
    name: "Continuous indoor and outdoor particulate monitoring"
    description: "Two monitoring sites were established: an indoor second-floor corridor in a naturally ventilated, centrally heated boarding house away from indoor particulate sources, and an outdoor courtyard within the school grounds. Indoor and outdoor PM10, PM2.5 and PM1 were measured continuously with a TEOM Series 1400a Ambient Particulate Monitor and expressed as 10-minute averages and as 24-hour averages from midday to midday. TEOM readings were corrected with an established factor for loss of semi-volatile compounds. Weather data (wind speed, temperature, temperature difference, relative humidity) were collected continuously at the outdoor site as 10-minute averages."
    equipment_required:
      - "TEOM Series 1400a Ambient Particulate Monitor"

  - id: "PROTOCOL:epton-ebc-001"
    name: "Exhaled breath condensate collection with pH and hydrogen peroxide measurement"
    description: "Exhaled breath condensate was collected with the RTube system using an aluminium cooling tube stored at -20 degrees C for at least 24 hours beforehand. Collection ran for ten minutes per sampling occasion after the mouth was rinsed to reduce saliva contamination, yielding approximately 2 ml of condensate per student. pH was measured immediately on about 30 ul of undegassed condensate with a pre-calibrated Shindengen ISFET pH meter (model KS701). Hydrogen peroxide was measured by fluorometry with 4-hydroxyphenylacetic acid, quantified within four hours against a standard curve; the assay limit of detection was 3.4 nM H2O2."
    equipment_required:
      - "RTube exhaled breath condensate collection system (Respiratory Research Inc, Charlottesville, USA) with aluminium cooling tube"
      - "Shindengen ISFET pH meter, model KS701"
      - "Hitachi F4500 Fluorescence Spectrophotometer"

