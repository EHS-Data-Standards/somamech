      subject_characteristics: "Male secondary school boarders aged 12-18 years, all healthy non-smokers with no other significant medical conditions. 26 students (28% of the panel) had doctor-diagnosed asthma; 17 used short-acting beta agonists as required and 8 took regular inhaled corticosteroids. Regular oral corticosteroid use was an exclusion criterion and asthma management was not altered by the investigators."
