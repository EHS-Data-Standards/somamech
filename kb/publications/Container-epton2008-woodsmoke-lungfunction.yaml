# =============================================================================
# OXIDATIVE STRESS ASSAYS (exhaled breath condensate hydrogen peroxide)
# =============================================================================

oxidative_stress_assays:

  - id: "OX:epton-ebc-h2o2-event-study"
    name: "Exhaled breath condensate hydrogen peroxide after high-pollution nights"
    description: "Fluorometric measurement of hydrogen peroxide in exhaled breath condensate collected within 24 hours of the two high-pollution nights (24 June and 21 July 2004) and on two low-pollution control days (autumn control and winter control). Detectable H2O2 was present in most samples, but there was no difference in measured H2O2 between any of the sampling days, control or high pollution, and no difference in the proportion of samples with detectable H2O2. There was no independent effect of asthma. H2O2 did not correlate with EBC pH or with urinary 1-hydroxypyrene. Values are presented only in Figure 5, so no numeric output is recorded. Assay limit of detection 3.4 nM H2O2. This assay records a negative result for pollution-induced oxidative stress."
    ros_probe_type: "4-hydroxyphenylacetic acid fluorometric assay for hydrogen peroxide"
    assay_date: "2004-07-22"
    evidence:
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "Detectable hydrogen peroxide was present in most samples. There was no difference in measured H 2O2 between any of the sampling days, either control or high pollution."
        explanation: "Records the negative finding this assay captures: EBC hydrogen peroxide did not rise on high-pollution days despite being detectable in most samples."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "No significant effect of pollution could be seen either on airway inflammation and oxidative stress either in healthy students or students with asthma."
        explanation: "The authors' summary of the null oxidative stress result that this assay records, in both healthy and asthmatic students."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "There was no independent effect of asthma in comparison with healthy subjects."
        explanation: "Records that the null H2O2 result held in the asthmatic students as well as the healthy ones."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The limit of detection of the assay used for these experiments was 3.4 nM H2O2."
        explanation: "Gives the assay limit of detection of 3.4 nM H2O2 recorded in this assay's description."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Urine 1-OHP levels were significantly higher on the high pollution days compared to both low pollution control days."
        explanation: "Confirms biologically that this assay's exposure condition was real: the same students' urinary PAH metabolite rose on the high-pollution days."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Pollution day 1 0.043 (0.030–0.073, n = 79) μmol OHP/mol creatinine;"
        explanation: "Gives the median urinary 1-hydroxypyrene on the first high-pollution day, quantifying this assay's exposure condition."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Autumn control 0.0195 (0.009–0.036, n = 88) μmol OHP/mol creatinine;"
        explanation: "Gives the median urinary 1-hydroxypyrene on the autumn control day, the low-pollution comparator for this assay."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "PM10 level recorded at the school on those dates was 43 μg/m3 and 72 μg/m3 respectively."
        explanation: "Gives the 24-hour average outdoor PM10 of 43 and 72 ug/m3 on the two high-pollution event days that define this assay's exposure condition."
    has_exposure_condition:
      - id: "EXPOSURE:epton-pm10-event-night"
        name: "High-pollution night (24 June or 21 July 2004): 24-hour average outdoor PM10 of 43 and 72 ug/m3, with 10-minute peaks of 105 and 257 ug/m3"
        exposure_agent:
          id: "ENVO:01000405"
          name: "respirable suspended particulate matter"
        exposure_concentration:
          value: "72"
          unit:
            id: "UCUM:ug/m3"
            name: "microgram per cubic meter"
        timing_post_exposure:
          value: "24"
          unit:
            id: "UO:0000032"
            name: "hour"
    informs_on_key_event:
      id: "KE:mie-oxidative-stress"
      name: "Increased oxidative stress"
      biological_action: increased
      level_of_biological_organization: molecular
    study_subject:
      subject_type: InVivoSubject
      id: "SUBJECT:epton-event-study"
      name: "Boarding students assessed after high-pollution nights"
      description: "Participating students assessed within 24 hours of each of the two high-pollution nights, and on two low-pollution control days, with urine and exhaled breath condensate collection."
      model_species:
        id: "NCBITaxon:9606"
        name: "Homo sapiens"
      sex: "male"
      sample_type: exhaled_breath_condensate
      subject_characteristics: "Male secondary school boarders aged 12-18 years, all healthy non-smokers; 26 of the 93 with doctor-diagnosed asthma. Students were excused evening study activities and assessed by the investigating team the day after a high-pollution night, as notified by Environment Canterbury."
      clinical_context: "Event study within 24 hours of a high-pollution night, compared with autumn and winter low-pollution control days"
    follows_protocols:
      - id: "PROTOCOL:epton-ebc-001"
        name: "Exhaled breath condensate collection with pH and hydrogen peroxide measurement"

# =============================================================================
# AIRWAY INFLAMMATION ASSAYS (exhaled breath condensate pH)
# =============================================================================

balf_sputum_assays:

  - id: "BALF:epton-ebc-ph-event-study"
    name: "Exhaled breath condensate pH after high-pollution nights"
    description: "EBC pH measured immediately on undegassed condensate with an ISFET pH meter, on the two high-pollution event days and the two low-pollution control days. Airway acidification in EBC is used here as a non-invasive marker of airway inflammation. There was a broad range of pH readings on all sampling days. pH differences between the autumn and winter controls reached statistical significance, and pH on the first high pollution day was significantly higher - not lower - than on the second study day and the winter control day, but not the autumn control day; the pattern therefore does not track pollution. There was no independent effect in students with asthma. EBC pH did not correlate with EBC hydrogen peroxide or with urinary 1-hydroxypyrene. Values are presented only in Figure 4, so no numeric output is recorded. This assay records a negative result for pollution-induced airway inflammation. Note: the sample here is exhaled breath condensate, not BALF or sputum; BALFSputumAssay is the SOMA class that carries the airway inflammation key event."
    assay_date: "2004-07-22"
    evidence:
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "No demonstrable effect of pollution on EBC pH or H 2O2 was demonstrated in this study, either in healthy children, or children with asthma."
        explanation: "Records the negative finding this assay captures: EBC pH showed no demonstrable effect of pollution in either subgroup."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "There was a broad range of pH readings on all sampling days."
        explanation: "Describes the spread of EBC pH readings this assay records, which the authors invoke to explain the absence of a detectable pollution effect."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "pH differences between autumn and winter controls reached statistical significance, and pH at the first high pollution day was significantly higher than the second study day, and the winter control day, but not the autumn control day."
        explanation: "Gives the exact pattern of statistically significant EBC pH differences between sampling days recorded in this assay."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: REFUTE
        evidence_source: HUMAN_CLINICAL
        snippet: "was no independent effect in students with asthma in comparison with healthy students."
        explanation: "Records that the EBC pH result did not differ between asthmatic and healthy students."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "30 μl of EBC to a pre-calibrated Shindengen ISFET pH meter (model KS701)."
        explanation: "Gives the measurement method and sample volume behind this assay's pH readings."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Pollution day 2 0.042 (0.022–0.064, n = 73);"
        explanation: "Gives the median urinary 1-hydroxypyrene on the second high-pollution day, quantifying this assay's exposure condition."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Winter control 0.025 (0.013–0.038, n = 77) μmol OHP/mol"
        explanation: "Gives the median urinary 1-hydroxypyrene on the winter control day, the low-pollution comparator for this assay."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "p < 0.0001 for all comparisons of high"
        explanation: "Gives the p-value for the urinary 1-hydroxypyrene contrast between high-pollution and control days, confirming this assay's exposure condition was real."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Peak outdoor PM 10 levels for a 10-minute period reached 105 μg/m3 and 257 μg/m3 respectively."
        explanation: "Gives the 10-minute peak outdoor PM10 levels reached on the two high-pollution event nights that define this assay's exposure condition."
    has_exposure_condition:
      - id: "EXPOSURE:epton-pm10-event-night"
        name: "High-pollution night (24 June or 21 July 2004): 24-hour average outdoor PM10 of 43 and 72 ug/m3, with 10-minute peaks of 105 and 257 ug/m3"
        exposure_agent:
          id: "ENVO:01000405"
          name: "respirable suspended particulate matter"
        exposure_concentration:
          value: "72"
          unit:
            id: "UCUM:ug/m3"
            name: "microgram per cubic meter"
        timing_post_exposure:
          value: "24"
          unit:
            id: "UO:0000032"
            name: "hour"
    informs_on_key_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
