    name: "Baseline spirometry in students with doctor-diagnosed asthma"
    description: "Pre-study baseline spirometry in the 26 students with doctor-diagnosed asthma. Mean FEV1 97.54% predicted (SE 2.481, n = 26), not significantly different from the non-asthmatic students; mean FEV1/FVC ratio 0.803 (SE 0.013, n = 26), significantly lower than the non-asthmatic group (0.834, p = 0.05)."
    reference_dataset: "Within-study comparison against the non-asthmatic student group; the predicted-value reference equations behind the % predicted FEV1 are not named in the publication"
    assay_date: "2004-03-01"
    has_specified_output:
      id: "LF:epton-baseline-asthma-output"
      name: "Baseline lung function of the asthma group"
      fev1:
        value: "97.54"
        unit:
          id: "UO:0000187"
          name: "percent"
      fev1_fvc_ratio:
        value: "0.803"
        unit:
          id: "UO:0000186"
          name: "dimensionless unit"
    evidence:
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "There was no significant difference in % predicted FEV 1 between asthmatics and non-asthmatics (97.54% ± 2.481 (mean ± 1 s.e.) n = 26, vs 95.49% ± 1.635 n = 57)"
        explanation: "Gives the asthma group's mean % predicted FEV1 of 97.54% with its standard error and n = 26 recorded in this assay."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "FEV1/FVC ratio was significantly lower in the asthmatic students (FEV1/FVC ratio asthma group 0.803 ± 0.013 n = 26 vs normal group 0.834 ± 0.009 n = 57, p = 0.05)"
        explanation: "Gives the asthma group's mean FEV1/FVC ratio of 0.803 with its standard error, n = 26 and the between-group p-value recorded in this assay."
      - reference: "PMID:18479529"
        reference_title: "The effect of ambient air pollution on respiratory health of school children: a panel study."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Twenty-six (28%) of the students had a doctor diagnosis of asthma."
