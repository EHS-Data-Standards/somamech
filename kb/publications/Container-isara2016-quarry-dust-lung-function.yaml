          unit:
            id: "UO:0000099"
            name: "liter"
          central_tendency: mean
          sample_size: 76
          variability:
            variability_type: standard_deviation
            value: "0.73"
            unit:
              id: "UO:0000099"
              name: "liter"
        fvc:
