      subject_characteristics: "Adult quarry workers aged 18 years and above who had worked in the quarry for at least one year, working in the production area (milling, grinding, breaking and loading of stones). 53.9% had worked in the quarries for 1-5 years; less than a quarter were smokers. Significantly younger than the office-worker controls (p < 0.05). Workers with contraindications to spirometry were excluded."
      clinical_context: "Descriptive cross-sectional study of quarry workers in Ikpeshi community, Akoko-Edo local government area, Edo State, southern Nigeria"
