# =============================================================================
# RESPONSE COMPARISONS
#
# The paper reports both groups' values and significance but never a
# difference, percent change or fold change, so change_value is omitted
# rather than computed (the extraction rule: never calculate a delta).
# p_value is recorded only where the paper gives an exact value (FEV1
# site-vs-office p = 0.02; FEV1 smokers-vs-non-smokers p = 0.01); the
# remaining comparisons report only the p < 0.05 threshold, which the float
# p_value slot cannot hold. Each control_output lives on the companion
# control-group assay (see the modelling notes at the top of the file);
# derived_from_assay points at the exposed group's assay.
# =============================================================================

response_comparisons:
  - id: "COMP:isara-fev1-site-vs-office"
    name: "FEV1 in quarry site workers vs office workers"
    description: "FEV1 2.77 +/- 0.73 L in site workers vs 3.14 +/- 0.78 L in office workers, p = 0.02 (Results body; the abstract gives p < 0.05). The paper reports no difference value, so change_value is omitted. The control output lives on the office-worker assay."
    derived_from_assay: "LF:isara-site-workers-spirometry"
    compared_measurement: "fev1"
    control_output: "LF:isara-office-workers-spirometry-output-control"
    treated_output: "LF:isara-site-workers-spirometry-output-exposed"
    change_type: absolute_difference
    change_direction: decreased
    p_value: 0.02
    statistical_test: "Student's t-test"
    derivation: reported_in_paper

  - id: "COMP:isara-fvc-site-vs-office"
    name: "FVC in quarry site workers vs office workers"
    description: "FVC 3.48 +/- 0.84 L in site workers vs 3.89 +/- 0.92 L in office workers, p < 0.05 (a significance threshold, not an exact p-value, so p_value is omitted). The paper reports no difference value, so change_value is omitted. The control output lives on the office-worker assay."
    derived_from_assay: "LF:isara-site-workers-spirometry"
    compared_measurement: "fvc"
    control_output: "LF:isara-office-workers-spirometry-output-control"
    treated_output: "LF:isara-site-workers-spirometry-output-exposed"
    change_type: absolute_difference
    change_direction: decreased
