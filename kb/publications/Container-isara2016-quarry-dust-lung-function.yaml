  # ---------------------------------------------------------------------------
  # Smoker vs non-smoker contrast, pooled across both worker groups. The paper
  # reports this as a secondary analysis ("In both groups, smokers had
  # significantly lower mean (SD) FEV1, FVC and PEFR compared with
  # non-smokers") without giving the number of smokers, so these outputs carry
  # no sample_size.
  # ---------------------------------------------------------------------------

  - id: "LF:isara-smokers-spirometry"
    name: "Spirometry - quarry workers who smoke (both groups pooled)"
    description: "Among the 113 quarry workers (site and office groups pooled), smokers had significantly lower lung function than non-smokers: FEV1 2.91 +/- 0.77 L vs 3.39 +/- 0.69 L (p = 0.01), FVC 3.61 +/- 0.91 L vs 4.26 +/- 0.74 L (p < 0.05), PEFR 6.56 +/- 2.43 vs 7.98 +/- 1.67 (printed unit L; PEFR is a flow conventionally in L/s or L/min, recorded as printed) (p < 0.05). The paper does not report the number of smokers, only that less than a quarter of respondents in both groups were smokers, so no sample_size is recorded. Smoking was not significantly associated with the prevalence of respiratory symptoms, which the authors attribute to the relatively few smokers identified."
    evidence:
      - reference: "PMID:27347301"
        reference_title: "Respiratory symptoms and ventilatory functions among quarry workers in Edo state, Nigeria."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In both groups, smokers had significantly lower mean (SD) FEV1, FVC and PEFR compared with non-smokers; 2.91L (0.77) versus 3.39L (0.69), p = 0.01, 3.61L (0.91) versus 4.26L (0.74), p < 0.05 and 6.56L (2.43) versus 7.98L (1.67), p < 0.05."
        explanation: "States the mean and SD of FEV1, FVC and PEFR recorded on this assay's smoker output and on the companion non-smoker assay's output, with the exact p-value for FEV1."
      - reference: "PMID:27347301"
        reference_title: "Respiratory symptoms and ventilatory functions among quarry workers in Edo state, Nigeria."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Less than quarter of the respondents in both groups were smokers."
        explanation: "Documents why the smoker and non-smoker outputs carry no sample_size: the paper gives only this bound, not the number of smokers."
