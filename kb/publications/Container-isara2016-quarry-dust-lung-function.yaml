      subject_characteristics: "Smokers among the 113 adult quarry workers (both site and office groups); the paper reports only that less than a quarter of respondents in both groups were smokers, without an exact count. All respiratory symptoms assessed were lower among smokers than non-smokers, an association the authors attribute to the small number of smokers."
