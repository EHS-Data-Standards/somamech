# =============================================================================
# Isara et al. (2016) - Respiratory symptoms and ventilatory functions among
# quarry workers in Edo state, Nigeria
# =============================================================================
#
# Source: Pan Afr Med J. 2016;23:212
# DOI: 10.11604/pamj.2016.23.212.7640
# PMID: 27347301
#
# Study design (HUMAN OBSERVATIONAL — not in vitro, not an animal experiment):
#   - Descriptive cross-sectional study in Ikpeshi community, Akoko-Edo local
#     government area, Edo State, southern Nigeria
#   - Population: 113 quarry workers — 76 "site workers" (production area:
#     milling, grinding, breaking and loading of stones; the EXPOSURE group)
#     and 37 "office workers" (administrative offices; the CONTROL group)
#   - Eligibility: adults aged 18+ who had worked in the quarry for at least
#     one year; contraindications to spirometry excluded
#   - Spirometry with a KoKo Legend spirometer (Model 314000, Serial
#     2007LB0538) per ATS/ERS 2005 criteria; FEV1, FVC, FEV1/FVC and PEFR
#   - Respiratory symptoms by a questionnaire adapted from the BOLD
#     (Burden of Obstructive Lung Diseases) questionnaire
#
# MODELLING NOTES:
#   - Each worker group is its own assay with its own InVivoSubject (the
#     calderon2001 pattern): the site-worker and office-worker cohorts differ
#     in age and job, so merging them under one study_subject would lose which
#     group a record describes. The response_comparisons therefore reference a
#     control_output that lives on the companion (office-worker or non-smoker)
#     assay, with derived_from_assay pointing at the exposed group's assay.
#   - The paper also compares smokers with non-smokers pooled across both
#     groups ("In both groups, smokers had significantly lower mean (SD) FEV1,
#     FVC and PEFR compared with non-smokers"). That contrast is modelled as a
#     second assay pair with cigarette smoke as the exposure agent. The paper
#     does not report how many of the 113 workers smoked ("Less than quarter
#     of the respondents in both groups were smokers"), so those output
#     records carry no sample_size.
#   - The exposure agent is recorded as ENVO:00002008 "dust": the paper
#     reports no dust sampling ("we did not carry out dust sampling of the
#     site and office environment in this study"), so no exposure
#     concentration is recorded and exposure is group membership only.
#   - FEV1/FVC ratio and PEFR per exposure group, and airflow obstruction
#     prevalence (defined as FEV1/FVC <70%), appear only in Table 3, which is
#     not reproduced in the cached full text, so no numeric values for them
#     are recorded for the site/office contrast.
#   - P-value discrepancy in the source: the abstract gives the FEV1
#     site-vs-office comparison as p < 0.05, while the Results body gives
#     p = 0.02. The exact body value (0.02) is recorded in the comparison.
#   - Unit note: the paper prints FEV1, FVC and PEFR values with the unit "L"
#     (e.g. "2.77L (0.73)"). For FEV1 and FVC litre is the correct volume
#     unit. PEFR is a flow and is conventionally reported in L/s or L/min;
#     the printed unit is recorded as-is (UO:0000099, liter) rather than
#     silently normalised, with this caveat.
#
# RESPIRATORY SYMPTOM PREVALENCES (no SOMA slot exists for symptom
# prevalence, so these stay in prose per the extraction rules):
#   - Chest tightness: 35.5% exposure vs 16.2% control — the only
#     statistically significant symptom difference (p < 0.05)
#   - Cough 23.7% vs 13.5%, sputum 21.1% vs 16.2%, dyspnoea 7.9% vs 5.4%
#     (higher in exposure, not significant); wheeze 10.8% vs 10.5% and nasal
#     congestion 27.0% vs 25.0% (higher in controls, not significant)
#
# WHAT THE PAPER DOES *NOT* CLAIM:
#   This is a cross-sectional association study with no dust measurements and
#   no mechanistic intermediate readouts, so no key_event_relationships are
#   recorded: the paper links exposure group membership to the adverse
#   outcome (reduced lung function indices) directly.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:27347301"
  reference_title: "Respiratory symptoms and ventilatory functions among quarry workers in Edo state, Nigeria."
  doi: "10.11604/pamj.2016.23.212.7640"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:isara-spirometry-001"
    name: "KoKo Legend spirometry per ATS/ERS 2005 criteria"
    description: "FEV1, FVC, FEV1/FVC and PEFR measured with a KoKo Legend spirometer (Model 314000, Serial 2007LB0538). A minimum of 3 and a maximum of 8 acceptable and repeatable forced expiratory manoeuvres were done with the study participant seated and upright according to ATS/ERS 2005 criteria. The best test (acceptable curve with the highest sum of FVC and FEV1) was used for interpretation. The spirometer was calibrated daily before the first participant and after the 8th participant or after 4 hours of continuous usage, using a valid certified accurate 3L calibration syringe. Airflow obstruction was defined as FEV1/FVC <70%."
    spirometry_standard: "ATS/ERS 2005 criteria"
    equipment_required:
      - "KoKo Legend spirometer (Model 314000, Serial 2007LB0538)"
      - "Certified accurate 3L calibration syringe"

  - id: "PROTOCOL:isara-questionnaire-001"
    name: "Respiratory symptom questionnaire adapted from the BOLD questionnaire"
    description: "Structured questionnaire adapted from relevant sections of the Burden of Obstructive Lung Diseases (BOLD) questionnaire, administered on the study participants by the researchers. Collected socio-demographic characteristics and respiratory symptoms of interest: cough, sputum, wheezing, chest pain, dyspnoea and nasal congestion."

# =============================================================================
# LUNG FUNCTION ASSAYS — spirometry per worker group. The site workers
# (production area, quarry dust exposure) are the exposure group; the office
# workers at the same quarries are the control group. A second assay pair
# records the smoker vs non-smoker contrast pooled across both groups.
# =============================================================================

lung_function_assays:
  - id: "LF:isara-site-workers-spirometry"
    name: "Spirometry - quarry site workers (dust-exposed group)"
    description: "FEV1 and FVC in the 76 quarry site workers were significantly lower than in the 37 office-worker controls: FEV1 2.77 +/- 0.73 L vs 3.14 +/- 0.78 L (p = 0.02 in the Results body; the abstract rounds this to p < 0.05), FVC 3.48 +/- 0.84 L vs 3.89 +/- 0.92 L (p < 0.05). FEV1/FVC and PEFR were also measured, but their per-group values appear only in Table 3, which is not reproduced in the cached full text, so they are not recorded here. The site workers also had a significantly higher occurrence of chest tightness (35.5% vs 16.2%, p < 0.05); cough (23.7% vs 13.5%), sputum (21.1% vs 16.2%) and dyspnoea (7.9% vs 5.4%) were higher in the exposure group without reaching statistical significance. No dust sampling was carried out, so exposure is recorded as group membership with no concentration."
    evidence:
      - reference: "PMID:27347301"
        reference_title: "Respiratory symptoms and ventilatory functions among quarry workers in Edo state, Nigeria."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The mean (SD) FEV1, and FVC were significantly lower among the exposure compared with the control group; 2.77L (0.73) versus 3.14L (0.78), p = 0.02, and 3.48L (0.84) versus 3.89L (0.92), p < 0.05."
        explanation: "States the mean and SD of FEV1 and FVC recorded on this assay's site-worker output and on the companion office-worker assay's output, with the exact p-value for FEV1."
      - reference: "PMID:27347301"
        reference_title: "Respiratory symptoms and ventilatory functions among quarry workers in Edo state, Nigeria."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The exposure group had significantly higher occurrence of chest tightness (35.5%) compared with 16.2% of the controls (p < 0.05)."
        explanation: "Supports the symptom-prevalence findings carried in this assay's description; chest tightness was the only symptom with a statistically significant excess in the dust-exposed site workers."
      - reference: "PMID:27347301"
        reference_title: "Respiratory symptoms and ventilatory functions among quarry workers in Edo state, Nigeria."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Although we did not carry out dust sampling of the site and office environment in this study, it is expected that the level of respirable dust will be higher in the site environment than the office environment."
        explanation: "Justifies recording the quarry-dust exposure condition without a concentration value: the study measured no dust levels, so exposure is group membership only."
    has_exposure_condition:
      - id: "EXPOSURE:isara-quarry-dust"
        name: "Occupational quarry dust exposure in the production area (milling, grinding, breaking and loading of stones); no dust sampling performed, so no concentration is recorded"
        exposure_agent:
          id: "ENVO:00002008"
          name: "dust"
    has_specified_output:
      - id: "LF:isara-site-workers-spirometry-output-exposed"
        name: "Measured FEV1 and FVC in quarry site workers"
        experimental_group: treated
        measured_under: "EXPOSURE:isara-quarry-dust"
        fev1:
