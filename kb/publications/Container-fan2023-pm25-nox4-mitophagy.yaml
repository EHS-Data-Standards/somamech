      - reference: "PMID:36608590"
        reference_title: "PM2.5 increases susceptibility to acute exacerbation of COPD via NOX4/Nrf2 redox imbalance-mediated mitophagy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "As shown in Fig. 5A–C, inhibiting NOX4 regulated the NOX4/Nrf2 redox balance and inhibited PM2.5-CSE-induced ROS generation."
