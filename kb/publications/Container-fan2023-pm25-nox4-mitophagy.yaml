  # --- PM2.5 + CSE co-exposure in BEAS-2B ----------------------------------
  - id: "OXSTRESS:fan-pm25-cse-beas2b"
    name: "Oxidative stress in BEAS-2B cells co-exposed to low-dose PM2.5 and cigarette smoke extract"
    description: "BEAS-2B cells exposed to PM2.5 (200 ug/mL) alone, CSE (2.5%) alone, or the two combined. Neither agent alone raised oxidative stress; the combination increased total ROS and MDA, decreased GSH/GSSG and SOD, increased mito-ROS and decreased mitochondrial membrane potential. This is the paper's central in vitro AECOPD model. All results are figure panels (Fig. 3A-H); no measured values appear in the text, so no named measurement slot is populated."
    ros_probe_type: "DCFH-DA for intracellular ROS, MitoSOX for mitochondrial ROS, TMRM for mitochondrial membrane potential"
    evidence:
      - reference: "PMID:36608590"
        reference_title: "PM2.5 increases susceptibility to acute exacerbation of COPD via NOX4/Nrf2 redox imbalance-mediated mitophagy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In addition, PM2.5-CSE induced an increase in the MDA levels but a decrease in the GSH/GSSG and SOD levels, leading to redox imbalance (Fig. 3D–F)."
        explanation: "States the direction of every oxidative stress marker this assay records under co-exposure: MDA up, GSH/GSSG and SOD down."
      - reference: "PMID:36608590"
        reference_title: "PM2.5 increases susceptibility to acute exacerbation of COPD via NOX4/Nrf2 redox imbalance-mediated mitophagy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "These results show that PM2.5 or CSE alone did not increase oxidative stress."
        explanation: "The paper's own negative control result, recorded in the assay description so the co-exposure effect is not overstated as a PM2.5-only effect."
      - reference: "PMID:36608590"
