oxidative_stress_assays:

  # --- PM2.5 dose response in BEAS-2B --------------------------------------
  - id: "OXSTRESS:fan-pm25-dose-beas2b-24h"
    name: "Oxidative stress and mitochondrial ROS across a PM2.5 dose range in BEAS-2B cells"
    description: "BEAS-2B cells exposed to PM2.5 (50, 100, 200, 400 ug/mL) for 24 h. Total ROS rose dose-dependently; GSH/GSSG, SOD and MDA were changed at the high dose (400 ug/mL); mito-ROS rose and mitochondrial membrane potential fell at 400 ug/mL. The paper reports these results as figure panels only (Fig. 1A, 1E-G, 1H-I) and states no measured ROS, GSH/GSSG, SOD or MDA values in the text, so no named measurement slot is populated here."
    ros_probe_type: "DCFH-DA for intracellular ROS, MitoSOX for mitochondrial ROS, TMRM for mitochondrial membrane potential"
    evidence:
      - reference: "PMID:36608590"
        reference_title: "PM2.5 increases susceptibility to acute exacerbation of COPD via NOX4/Nrf2 redox imbalance-mediated mitophagy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "PM2.5 significantly increased the levels of ROS in a dose-dependent manner, leading to redox imbalance."
        explanation: "States the dose-dependent ROS increase that is this assay's primary readout."
      - reference: "PMID:36608590"
        reference_title: "PM2.5 increases susceptibility to acute exacerbation of COPD via NOX4/Nrf2 redox imbalance-mediated mitophagy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Moreover, the levels of oxidant and antioxidant enzymes, including GSH/GSSG, SOD and MDA, were obviously changed in high-dose PM2.5 (400 μg/ml) group (Fig. 1E–G)."
        explanation: "Names the oxidant and antioxidant markers recorded here and the single dose (400 ug/mL) at which they changed; the paper gives no values, only the direction word 'changed'."
      - reference: "PMID:36608590"
        reference_title: "PM2.5 increases susceptibility to acute exacerbation of COPD via NOX4/Nrf2 redox imbalance-mediated mitophagy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "the high-dose PM2.5 (400 μg/ml) group exhibited significant increases in mito-ROS generation and decreased in membrane potential (Fig. 1H and I)."
