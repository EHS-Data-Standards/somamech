    description: "Intervention arm: BEAS-2B cells transfected with NOX4 siRNA before PM2.5 (200 ug/mL) plus CSE (2.5%). Knockdown restored the NOX4/Nrf2 redox balance, suppressed PM2.5-CSE-induced total and mitochondrial ROS generation, and reduced cytotoxicity, mitochondrial damage and mitophagy. Recorded against the oxidative stress key event as reversal evidence; the direction on the KeyEvent block is the key event's own direction, not the direction produced by the knockdown. Figure panels only (Fig. 5A-J); no values in the text."
    ros_probe_type: "DCFH-DA for total ROS, MitoSOX for mitochondrial ROS"
