# =============================================================================
# Fan et al. (2023) - PM2.5 increases susceptibility to acute exacerbation of
# COPD via NOX4/Nrf2 redox imbalance-mediated mitophagy
# =============================================================================
#
# Source: Redox Biol. 2023;59:102587
# DOI: 10.1016/j.redox.2022.102587   PMID: 36608590
#
# Study design:
#   - In vitro: BEAS-2B human bronchial epithelial cells. PM2.5 (NIST
#     SRM1649b) dose response (50, 100, 200, 400 ug/mL, 24 h); then a
#     co-exposure model using low-dose PM2.5 (200 ug/mL) plus cigarette smoke
#     extract (CSE, 2.5%). Intervention arms: NOX4 siRNA, the NOX4 inhibitor
#     GKT137831 (25 uM) and the mitochondria-targeted antioxidant mito-TEMPO
#     (100 uM).
#   - In vivo: male BALB/c mice, 6-8 weeks. COPD induced by intranasal LPS
#     (50 ug/mouse, days 1 and 14) plus 4 weeks of cigarette smoke; AECOPD by
#     adding intranasal PM2.5 (10 mg/kg) daily for 7 days from day 21.
#     Treatment arms: GKT137831 (60 mg/kg ip) and mito-TEMPO (20 mg/kg ip).
#     n = 3-5 per group.
#
# Key findings:
#   - PM2.5 raised ROS dose-dependently, with deficient Nrf2 activation and
#     sustained NOX4 activation (dose- and time-dependent); GSH/GSSG, SOD and
#     MDA changed at 400 ug/mL, as did mito-ROS and membrane potential.
#   - Neither PM2.5 (200 ug/mL) nor CSE (2.5%) alone raised oxidative stress;
#     the combination did, and it triggered excessive mitophagy (LC3-II, ATG3,
#     PINK1, Parkin up; p62, p-mTOR, TOM20, TIM23 down).
#   - NOX4 siRNA (and GKT137831 / mito-TEMPO) restored the NOX4/Nrf2 balance
#     and reduced ROS, cytotoxicity, mitochondrial damage and mitophagy.
#   - In mice, CS + PM2.5 worsened airway inflammation, BALF cytokines
#     (IL-1, IL-6, IL-8, TNF-alpha), goblet cell hyperplasia and mucus
#     secretion, BALF ROS/MPO/MDA (with SOD and GSH down), and mitophagy.
#     GKT137831 and mito-TEMPO reversed all of these.
#
# Extraction notes:
#   - EVERY quantitative result in this paper lives in a figure panel. The
#     running text and figure legends state directions of change, exposure
#     doses and significance thresholds, never measured values. No named
#     measurement slot is therefore populated with a figure-read number; the
#     recorded numbers are exposure doses and the group sizes/statistics that
#     the text states outright. Directions of change are carried in the assay
#     and output descriptions, each backed by an exact quote.
#   - Statistics discrepancy in the source, recorded here rather than
#     silently resolved: section 2.17 says "All the values are presented as
#     the mean +/- SEM", while every figure legend says "mean +/- SD". Both
#     statements are quoted below on the assays they govern.
#   - KE:ke-excessive-mitophagy is a NEW key event ID minted by this file.
#     No existing SOMA key event covers mitophagy, which is this paper's
#     central mechanistic node. Wording is kept minimal so the next paper can
#     reuse the block verbatim.
#   - KE:ke-nox4-induction is reused byte-for-byte from the Amara 2007
#     extraction (DEP/MMP-1); KE:mie-oxidative-stress, KE:ke-airway-
#     inflammation, KE:ke-mucus-metaplasia and KE:ke-mucin-hypersecretion are
#     reused byte-for-byte from the other open extraction PRs.
#   - The intervention assays (NOX4 siRNA, GKT137831, mito-TEMPO) are
#     recorded against the same key events as the exposure assays: they are
#     reversal evidence for those key events, so the direction recorded on the
#     KeyEvent block is the key event's own direction, not the direction the
#     intervention produced.
#   - sample_type for the two lung-tissue subjects is recorded as 'biopsy',
#     the schema's only tissue value (SampleTypeEnum has no generic 'tissue'
#     or 'lung' member). These are whole mouse lungs harvested at necropsy,
#     not clinical biopsies; sample_collection_method states what was
#     actually taken.
#   - Cigarette smoke / CSE exposures carry no exposure_agent CURIE: neither
#     CHEBI nor ENVO has a term for cigarette smoke or its extract, so the
#     agent is named in the exposure's name and description instead.
# =============================================================================

source_publication:
  reference: "PMID:36608590"
  reference_title: "PM2.5 increases susceptibility to acute exacerbation of COPD via NOX4/Nrf2 redox imbalance-mediated mitophagy."
  doi: "10.1016/j.redox.2022.102587"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:fan-pm25-cse-prep-001"
    name: "Preparation of PM2.5 stock and cigarette smoke extract (CSE)"
    description: "PM2.5 was NIST standard reference material SRM1649b, dissolved in DMSO to 400 mg/mL, shaken and ultrasonicated for 2 h, centrifuged, and the supernatant stored. CSE was prepared by bubbling the smoke of one cigarette through 10 mL of DMEM with a peristaltic pump, adjusting the pH to 7.2 and filtering through 0.22 um; this stock was defined as 10% CSE and diluted as needed."

  - id: "PROTOCOL:fan-ros-imaging-001"
    name: "Intracellular and mitochondrial ROS and membrane potential imaging"
    description: "Intracellular ROS measured with DCFH-DA (Beyotime) after 40 min at 37 C and mitochondrial ROS with MitoSOX (Invitrogen) after 15 min, both read by fluorescence microscopy. Mitochondrial membrane potential measured by TMRM staining for 20 min and read as red fluorescence intensity."

  - id: "PROTOCOL:fan-redox-kits-001"
    name: "SOD, GSH, MPO and MDA assay kits"
    description: "Commercial SOD, GSH, MPO and MDA assay kits used per the manufacturers' instructions to evaluate oxidative stress in BEAS-2B cells and in mouse lung tissue and BALF."

  - id: "PROTOCOL:fan-western-001"
    name: "Western blotting for redox, mitochondrial, mitophagy and mucin proteins"
    description: "Cells or lung tissues lysed in RIPA buffer with protease and phosphatase inhibitors at 4 C, protein quantified by BCA, separated by SDS-PAGE, transferred to PVDF, blocked in 5% nonfat milk and probed overnight with primary antibodies (NOX4 and MUC5ac from ZENBIO; Nrf2, p-mTOR, SIRT3, VCAM, ICAM and beta-actin from Abcam; caspase-3, Bax, Bcl2, cleaved caspase-3, Drp1, AIF, Cyto-c, LC3B, P62, ATG3, Tom20 and Parkin from Cell Signaling Technology; PINK1 from Sigma-Aldrich; Tim23 and p-creb from Proteintech). Densitometry in ImageJ."

  - id: "PROTOCOL:fan-autophagic-flux-001"
    name: "Tandem fluorescent LC3 autophagic flux and TIM23/TOM20 immunofluorescence"
    description: "Autophagic flux assessed with mRFP-GFP-LC3 (reported in the figure legends as tandem fluorescent mCherry-GFP-LC3B) adenoviral vectors and read by confocal microscopy. Immunofluorescence for Tom20 and Tim23 used monoclonal antibodies at 1:200 overnight at 4 C on cells fixed in 4% paraformaldehyde, permeabilized with 0.2% Triton X-100 and blocked in 5% BSA, with DAPI counterstain."

  - id: "PROTOCOL:fan-nox4-sirna-001"
    name: "NOX4 knockdown by small interfering RNA in BEAS-2B cells"
    description: "Small interfering RNAs targeting NOX4 (si 1, si 2 and si 3) designed and supplied by HanBio Technology (Shanghai, China) and transfected into BEAS-2B cells with RNA-FIT."

  - id: "PROTOCOL:fan-tem-001"
    name: "Transmission electron microscopy of mitochondria and mitophagy"
    description: "BEAS-2B cells and mouse lung tissues fixed in 2.5% glutaraldehyde, sectioned on an ultrathin microtome, stained and imaged by transmission electron microscopy to score mitochondrial structure, vacuolation and mitophagy."

  - id: "PROTOCOL:fan-copd-aecopd-mouse-001"
    name: "Cigarette smoke COPD and PM2.5 AECOPD mouse model"
    description: "Male BALB/c mice aged 6-8 weeks randomized to control, COPD, AECOPD, AECOPD+GKT137831 (60 mg/kg ip) and AECOPD+mito-TEMPO (20 mg/kg ip). COPD was induced with intranasal LPS (50 ug/mouse) on days 1 and 14 followed by cigarette smoke three times daily (nine cigarettes in total) for up to 4 weeks in a PAB-S200 passive smoking exposure system. AECOPD mice additionally received intranasal PM2.5 (10 mg/kg) daily for 7 consecutive days from day 21."

  - id: "PROTOCOL:fan-balf-elisa-001"
    name: "BALF collection, cell counting and cytokine ELISA"
    description: "After euthanasia and endotracheal intubation, 500 uL PBS was instilled and the alveoli flushed twice to collect BALF. Total cell numbers were counted and cells stained with a Giemsa and ROS staining kit. IL-1, IL-6, IL-8 and TNF-alpha in BALF were measured by ELISA (BioLegend)."

  - id: "PROTOCOL:fan-histology-001"
    name: "H&E, PAS and TUNEL staining of lung tissue"
    description: "Lung tissues fixed in 4% paraformaldehyde, embedded, sliced and dehydrated, then stained with H&E (lung injury score), PAS (percentage of PAS-positive cells) and TUNEL (apoptotic nuclei)."

  - id: "PROTOCOL:fan-statistics-001"
    name: "Statistical analysis"
    description: "At least three independent experiments per result, analyzed in GraphPad Prism by one-way ANOVA with a posttest; P < 0.05 considered significant. NOTE: section 2.17 reports values as mean +/- SEM while every figure legend reports mean +/- SD; both statements are quoted on the assays below and the discrepancy is left as the paper states it. In vivo group sizes are n = 3-5."

