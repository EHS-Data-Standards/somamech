  - id: "GENE:fan-mitophagy-rescue-mice"
    name: "Effect of GKT137831 and mito-TEMPO on lung mitophagy proteins in AECOPD model mice"
    description: "Intervention arm: AECOPD model mice treated with GKT137831 (60 mg/kg ip) or mito-TEMPO (20 mg/kg ip) showed activation of mTOR, p62, TOM20, TIM23 and SIRT3 and inhibition of LC3-II, ATG3, PINK1, Parkin, Drp1, cyto-c and AIF relative to untreated AECOPD mice, with fewer TUNEL-positive cells and less mitochondrial damage on TEM. Recorded against the mitophagy key event as reversal evidence. Figure panels only (Fig. 10A-I)."
    gene_expression_method: "Western blot with ImageJ densitometry; TUNEL staining; transmission electron microscopy"
    evidence:
      - reference: "PMID:36608590"
        reference_title: "PM2.5 increases susceptibility to acute exacerbation of COPD via NOX4/Nrf2 redox imbalance-mediated mitophagy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The mice in the treatment group showed more significant activation of the key mitophagy and mitochondrial-related proteins mTOR, p62, TOM20, TIM23 and SIRT3 and inhibition of LC3-II, ATG3, PINK1, Parkin, Drp1, cyto-c and AIF than the AECOPD model mice (Fig. 10A- F)."
        explanation: "Names every protein in the panel this assay records and the direction of each under GKT137831 or mito-TEMPO treatment."
      - reference: "PMID:36608590"
        reference_title: "PM2.5 increases susceptibility to acute exacerbation of COPD via NOX4/Nrf2 redox imbalance-mediated mitophagy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "as shown by a decreased number of TUNEL-positive cells (Fig. 10G)"
        explanation: "The TUNEL evidence for reduced cell death under treatment, recorded in this assay's description."
      - reference: "PMID:36608590"
        reference_title: "PM2.5 increases susceptibility to acute exacerbation of COPD via NOX4/Nrf2 redox imbalance-mediated mitophagy."
        supports: SUPPORT
