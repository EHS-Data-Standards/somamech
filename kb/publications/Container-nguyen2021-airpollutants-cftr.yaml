# =============================================================================
# Nguyen et al. (2021) - Effects of environmental air pollutants on CFTR
# expression and function in human airway epithelial cells
# =============================================================================
#
# Source: Toxicol In Vitro (2021)
# DOI: 10.1016/j.tiv.2021.105253
#
# ABSTRACT-ONLY EXTRACTION
#   There is no local PDF for this paper and `just fetch-reference` returned
#   content_type: abstract_only. Every evidence snippet below is verbatim from
#   references_cache/PMID_34601066.md, which holds only the abstract. The
#   abstract reports directions of effect but no numeric values, so every
#   output record here is deliberately value-free: concentrations, currents,
#   expression levels, sample sizes and p-values are NOT in the cached text
#   and are therefore omitted rather than guessed.
#
# Study design (as stated in the abstract):
#   - In vitro only: human airway epithelial cells (Calu-3)
#   - Exposure: air pollutant extracts for 24 h, with and without
#     pharmacological interventions
#   - Three pollutants tested, kept as separate exposures/assays here:
#       * tobacco smoke extract (TSE)
#       * urban particulate matter (UPM)
#       * diesel exhaust particles (DEP)
#   - Readouts: CFTR expression AND CFTR function (kept as separate assays)
#
# Key findings (abstract):
#   - Tobacco smoke extract led to acquired CFTR dysfunction
#   - Diesel exhaust particles led to acquired CFTR dysfunction
#   - Urban particulate matter was tested but is NOT among the pollutants the
#     abstract reports as causing acquired CFTR dysfunction (recorded below as
#     REFUTE evidence against decreased CFTR function for UPM)
#   - Acquired CFTR dysfunction was rescued pharmacologically in the diesel
#     exhaust particle models
#   - The abstract states CFTR readouts were taken for expression as well as
#     function, but does NOT report the direction or size of any expression
#     change; the expression assays below record that the readout was taken
#     and carry no values.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:34601066"
  reference_title: "Effects of environmental air pollutants on CFTR expression and function in human airway epithelial cells."
  doi: "10.1016/j.tiv.2021.105253"

# =============================================================================
# PROTOCOLS
# =============================================================================
#
# The abstract does not describe methods in detail. These protocol records
# capture only what the cached record states or indexes: a 24 h exposure of
# Calu-3 cells to air pollutant extracts, with CFTR function read out
# electrophysiologically (the record is indexed under "Membrane
# Potentials/drug effects") and CFTR expression read out by immunoblot (the
# record is indexed under "Blotting, Western"). No reagent, concentration or
# instrument details are available from the abstract, so none are asserted.

protocols:
  - id: "PROTOCOL:nguyen-exposure-001"
    name: "Calu-3 air pollutant extract exposure, 24 hours"
    description: "Human airway epithelial cells (Calu-3) exposed to air pollutant extracts (tobacco smoke extract, urban particulate matter, or diesel exhaust particles) for 24 h, with and without pharmacological interventions. Extract preparation, concentrations and vehicle are not reported in the abstract, which is the only text available for this paper."

  - id: "PROTOCOL:nguyen-cftr-function-001"
    name: "CFTR function readout in Calu-3 cells"
    description: "Electrophysiological readout of CFTR function after 24 h pollutant extract exposure. The abstract states only that CFTR function was a readout; the cached record is indexed under the MeSH heading 'Membrane Potentials/drug effects'. Chamber type, stimulation agent, inhibitor and units are not reported in the abstract."

  - id: "PROTOCOL:nguyen-cftr-expression-001"
    name: "CFTR expression readout by immunoblot"
    description: "CFTR protein expression measured after 24 h pollutant extract exposure. The abstract states only that CFTR expression was a readout; the cached record is indexed under the MeSH heading 'Blotting, Western'. Antibodies, loading control and quantification are not reported in the abstract."

