      - reference: "PMID:34601066"
        reference_title: "Effects of environmental air pollutants on CFTR expression and function in human airway epithelial cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "We demonstrate that both tobacco smoke extract and diesel exhaust particles led to acquired CFTR dysfunction"
        explanation: "The abstract's stated result names tobacco smoke extract as one of the two pollutants that produced acquired CFTR dysfunction, which is the decreased CFTR function this assay's treated output records."
    has_exposure_condition:
      - id: "EXPOSURE:nguyen-vehicle-24h"
        name: "Vehicle control, 24 hours (unexposed Calu-3)"
        exposure_duration:
          value: "24"
          unit:
            id: "UO:0000032"
