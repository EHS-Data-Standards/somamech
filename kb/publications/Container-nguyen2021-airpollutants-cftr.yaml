# KEY EVENT RELATIONSHIPS - the topology the abstract states
# =============================================================================
#
# No response_comparisons section: the abstract reports directions only, and a
# ResponseComparison needs a change value the paper states. Computing one here
# would mean inventing it.

key_event_relationships:
  - id: "KER:nguyen-cftr-to-mcc"
    name: "Decreased CFTR function leads to impaired mucociliary clearance"
    description: "Framing stated in the abstract's background: mucociliary clearance defends the airway against environmental air pollutants and is regulated by ion transporters including CFTR, so pollutant-acquired CFTR dysfunction acts on mucociliary clearance. Asserted as background in this paper, not measured in it."
    upstream_event:
      id: "KE:ke-decreased-cftr"
      name: "Decreased CFTR function"
      biological_action: decreased
      level_of_biological_organization: molecular
