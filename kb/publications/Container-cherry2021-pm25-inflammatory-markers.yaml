  # ---------------------------------------------------------------------------
  # C2L component score vs cumulative PM2.5 exposure (both services, late)
  # ---------------------------------------------------------------------------
  - id: "BALF:cherry-plasma-c2l-exposure"
    name: "Second late principal component (C2L) of plasma markers versus cumulative PM2.5 exposure"
    description: "Principal component analysis of the 42 markers in the 160 late samples from both services. C1L accounted for 43.7% and C2L for 11.6% of the variance. C2L carried high positive weights (>0.5) for GROalpha, PDGF-AA, PDGF-BB, sCD40L, IP-10, MCP-1, IL-18 and TNF-alpha. C2L correlated with log total cumulative PM2.5 exposure (R = 0.38, P < 0.001) and with dehydration rating (R = 0.32, P < 0.001), and decreased with days since last deployment (R = -0.24, P = 0.003) and days since last fire (R = -0.21, P = 0.008). In a multilevel regression clustered within fire service (N = 159), cumulative exposure (beta = 0.19, 95% CI 0.09 to 0.30), dehydration (beta = 0.65, 95% CI 0.04 to 1.27) and weeks since last fire (beta = -0.04, 95% CI -0.06 to -0.01) were all related to C2L; C1L was unrelated to exposure."
    evidence:
      - reference: "PMID:33620067"
        reference_title: "Are Inflammatory Markers an Indicator of Exposure or Effect in Firefighters Fighting a Devastating Wildfire? Follow-up of a Cohort in Alberta, Canada."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "C2L scores were higher with higher exposure on all the exposure indices and lower with time since ending a deployment to the Fort McMurray or any other fire."
        explanation: "States the direction of the C2L relation this assay records: higher with every exposure index, lower with time since the last deployment."
      - reference: "PMID:33620067"
        reference_title: "Are Inflammatory Markers an Indicator of Exposure or Effect in Firefighters Fighting a Devastating Wildfire? Follow-up of a Cohort in Alberta, Canada."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "cumulative exposure (β = 0.19, 95% CI 0.09-0.30), dehydration (β = 0.65, 95% CI 0.04-1.27) and time since last deployed to a fire (β = -0.04, 95% CI -0.06 to -0.01) were all related to the C2L score."
        explanation: "Gives the regression coefficients and confidence intervals for cumulative exposure, dehydration and time since last fire recorded in this assay's description."
    has_specified_output:
      id: "BALF:cherry-plasma-c2l-exposure-output"
      name: "C2L component score and its exposure associations"
      description: "C2L accounted for 11.6% of the variance in the 160 late samples (C1L 43.7%). Pearson correlations of C2L with exposure indices: log total exposure R = 0.38 (P < 0.001), log highest day exposure R = 0.20 (P = 0.010), days since last deployment R = -0.24 (P = 0.003), days since last fire R = -0.21 (P = 0.008), dehydration R = 0.32 (P < 0.001), heat stress R = 0.28 (P < 0.001), noise R = 0.20 (P = 0.011), exhaustion R = 0.33 (P < 0.001), musculoskeletal strain R = 0.28 (P < 0.001); N = 160."
      evidence:
        - reference: "PMID:33620067"
          reference_title: "Are Inflammatory Markers an Indicator of Exposure or Effect in Firefighters Fighting a Devastating Wildfire? Follow-up of a Cohort in Alberta, Canada."
          supports: SUPPORT
          evidence_source: HUMAN_CLINICAL
          snippet: "Log total exposure -0.32 0.008 0.03 0.791 -0.00 0.992 0.38 <0.001"
          explanation: "Table 6 row giving the Pearson correlations of each component with log total exposure, including the C2L value of 0.38 (P < 0.001) recorded here."
    informs_on_key_event:
