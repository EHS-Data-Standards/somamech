      name: "GM-CSF concentrations by bronchial wall thickening status"
      description: "Mean log GM-CSF 3.54 ng/ml with bronchial wall thickening (N = 5) versus 1.50 ng/ml without (N = 17), P = 0.082. The schema has no named GM-CSF slot, so these values are recorded in the description and in the quoted evidence."
