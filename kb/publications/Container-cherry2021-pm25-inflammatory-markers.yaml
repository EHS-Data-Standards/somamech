# =============================================================================
# Cherry et al. (2021) - Are Inflammatory Markers an Indicator of Exposure or
# Effect in Firefighters Fighting a Devastating Wildfire? Follow-up of a
# Cohort in Alberta, Canada
# =============================================================================
#
# Source: Ann Work Expo Health. 2021;65(6):635-648
# DOI: 10.1093/annweh/wxaa142
# PMID: 33620067
#
# Study design:
#   - Human occupational cohort (in vivo): non-smoking first responders
#     deployed to the May 2016 Fort McMurray wildfire, Alberta, Canada
#   - Service A (near Edmonton, short deployments from day 2): blood + spirometry
#     in May 2016 (early, median 15.5 days from fire start) and again in
#     August/September 2016 (late, median 107 days); N = 68 paired, 84 late
#   - Service B (Fort McMurray, long repeated deployments): late samples only,
#     median 122 days from fire start; N = 76
#   - Exposure: estimated cumulative PM2.5 from wildfire smoke (log scale),
#     self-rated physical stressors, time since last deployment
#   - Plasma assayed for 42 inflammatory markers (cytokines, chemokines,
#     growth factors) by bead-based Luminex multiplex array (pg/ml)
#   - Principal component scores (C1E/C2E early, C1L/C2L late) reduced the
#     42 markers to two components per time point
#   - Respiratory outcomes: spirometry (FEV1/FVC) at each blood draw, visual
#     analogue symptom scores, ECRHS questionnaire ~30 months later, and
#     clinical assessment (methacholine challenge, chest CT) in 2019-2020
#
# Key findings recorded here:
#   - Marker concentrations fell from early to late samples for all but 3 of
#     the 42 markers, significantly for 25
#   - C2L (late second component) rose with cumulative PM2.5 exposure
#     (beta = 0.19, 95% CI 0.09-0.30) and dehydration, and fell with time
#     since the last fire
#   - C2E related to a lower FEV1/FVC (beta = -1.63, 95% CI -3.11 to -0.14,
#     P = 0.032)
#   - Group mean FEV1/FVC did not differ between time points or services, but
#     was lower after the fire than in pre-fire records (N = 29-34 per group)
#
# Notes on schema mapping:
#   - Plasma inflammatory-marker measurements are recorded under
#     balf_sputum_assays, the schema's in vivo inflammatory-mediator assay
#     class; study_subject.sample_type is "blood" to record that the matrix
#     was plasma rather than BALF or sputum.
#   - The paper reports the 42 individual marker concentrations only in
#     Appendix 5 tables (not in the article text), so no per-cytokine
#     concentrations are extracted here; component scores, marker counts and
#     the one marker mean stated in the text are recorded instead.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:33620067"
  reference_title: "Are Inflammatory Markers an Indicator of Exposure or Effect in Firefighters Fighting a Devastating Wildfire? Follow-up of a Cohort in Alberta, Canada."
  doi: "10.1093/annweh/wxaa142"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:cherry-luminex-001"
    protocol_type: MolecularAssayProtocol
    name: "Multiplex bead-based assay of 42 plasma inflammatory markers"
    description: "Blood drawn by a phlebotomist during a normal shift, spun down for 15 min at 200 g, plasma pipetted into three 0.5 ml aliquots and stored at -80C before transfer on dry ice to the analytic laboratory. The array estimated the concentration (pg/ml) of 42 cytokines, chemokines and growth factors. Samples below the detection limit were replaced by beta substitution; the mean of the two aliquots was used and log-transformed."
    detection_method: "bead-based Luminex multiplex array"
    platform: "Luminex 100 system (Luminex, Austin, TX, USA), run by Eve Technologies Corp. (Calgary, Alberta, Canada)"
    equipment_required:
      - "Refrigerated centrifuge"
      - "-80C freezer"
      - "Luminex 100 system"

  - id: "PROTOCOL:cherry-spirometry-001"
    protocol_type: SpirometryProtocol
    name: "Spirometry following ATS/ERS guidelines"
    description: "Lung function assessed in a mobile clinical laboratory parked adjacent to the blood draw location, by a study physician, using a minimum of three and a maximum of eight manoeuvres. FEV1, FVC and their ratio recorded at the time of each blood draw."
    spirometry_standard: "ATS/ERS"
    equipment_required:
      - "Spirometer in mobile clinical laboratory"

  - id: "PROTOCOL:cherry-exposure-estimation-001"
    protocol_type: Protocol
    name: "Estimation of cumulative PM2.5 exposure and physical stressors"
    description: "Cumulative PM2.5 exposure estimated by combining firefighter-reported dates, hours and locations of firefighting with Alberta Environment particulate estimates from monitoring stations and satellite imagery; the key (first) rotation was weighted for task and for respiratory protective equipment. Physical stressors (dehydration, heat stress, noise, exhaustion, musculoskeletal strain) were self-rated on 0-100 visual analogue scales."

