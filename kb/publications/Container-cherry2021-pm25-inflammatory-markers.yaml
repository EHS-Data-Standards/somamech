  # ---------------------------------------------------------------------------
  # GM-CSF and bronchial wall thickening (clinical assessment subgroup)
  # ---------------------------------------------------------------------------
  - id: "BALF:cherry-plasma-gmcsf-clinical"
    name: "Plasma GM-CSF and MDC versus clinical respiratory findings"
    description: "Follow-up of the two markers (GM-CSF and MDC) reported as related to declining lung function in New York City firefighters after the World Trade Center disaster. GM-CSF was unrelated to the respiratory health outcomes considered; the only difference approaching significance was with bronchial wall thickening on chest CT, where mean log GM-CSF was 3.54 ng/ml in those with thickening (N = 5) and 1.50 ng/ml in those without (N = 17), P = 0.082. MDC concentrations were negatively correlated with visual analogue symptoms at the time of the blood draw and unrelated to FEV1/FVC."
    evidence:
      - reference: "PMID:33620067"
        reference_title: "Are Inflammatory Markers an Indicator of Exposure or Effect in Firefighters Fighting a Devastating Wildfire? Follow-up of a Cohort in Alberta, Canada."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "mean log GM-CSF in those with thickening (N = 5) was 3.54 ng/ml and those without"
        explanation: "Gives the mean log GM-CSF concentration in firefighters with bronchial wall thickening and the size of that subgroup."
      - reference: "PMID:33620067"
        reference_title: "Are Inflammatory Markers an Indicator of Exposure or Effect in Firefighters Fighting a Devastating Wildfire? Follow-up of a Cohort in Alberta, Canada."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "GM-CSF was unrelated to any of the respiratory health outcomes considered in Tables 8 and 9"
        explanation: "Records the negative finding: the marker reported in World Trade Center firefighters did not relate to respiratory health in this cohort."
    has_specified_output:
