        snippet: "Interestingly, we did not find any alterations in FOXJ1 mRNA expression, when cells were chronically exposed to CSE over 28 days"
        explanation: "FOXJ1 mRNA was unchanged by CSE, so this assay's evidence points against a FOXJ1-transcriptional route to the altered ciliogenesis key event rather than for it."
