  # --- Barrier function (TEER) --------------------------------------------
  - id: "GENEXPR:schamberger-teer-28d"
    name: "Transepithelial electrical resistance during pHBEC differentiation under chronic CSE"
    description: >-
      TEER was followed over 28 days of ALI differentiation with or without
      2.5% or 5% CSE. Chronic CSE significantly decreased TEER from day 14
      on, in a concentration-dependent manner, so CSE impaired establishment
      of the bronchial barrier in differentiating basal cells. The paper
      shows TEER graphically only (Figure 1c) and states no numeric
      resistances in the text, so the output records carry no values. The
      concentrations used were first shown to be non-toxic by LDH assay over
      the first 72 hours.
    gene_expression_method: "TEER measurement"
    has_exposure_condition:
      - id: "EXPOSURE:schamberger-nt-28d"
        name: "Non-treated control (no CSE), 28 days of ALI differentiation"
        exposure_duration:
