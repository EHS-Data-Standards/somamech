        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "we demonstrate that CSE reduces ciliated cell numbers in the bronchial epithelium via a FOXJ1-independent pathway or factors further downstream of FOXJ1"
        explanation: "The authors' own reading of the null result: ciliated cell loss occurs without a change in FOXJ1 transcription."

