# =============================================================================
# FOXJ1 ASSAYS — the ciliogenesis transcription programme (NULL RESULT)
# =============================================================================

foxj_assays:
  - id: "FOXJ:schamberger-foxj1-mrna-28d"
    name: "FOXJ1 mRNA and FOXJ1 target gene transcripts under chronic CSE (no change)"
    description: >-
      NULL RESULT. qRT-PCR for FOXJ1 across 28 days of ALI differentiation
      with or without chronic CSE (2.5% or 5%). FOXJ1 mRNA rose greatly over
      time in control conditions, correlating with ciliated cell numbers, but
      chronic CSE produced no alteration in FOXJ1 mRNA at any time point. The
      reported FOXJ1 target genes DNAI1, DNALI1, SPAG6 and TEKT1 were
      likewise unchanged. The paper reports these data graphically only, so
      no expression values are recorded. This is the basis for the authors'
      conclusion that the loss of ciliated cells is FOXJ1-independent.
    has_exposure_condition:
      - id: "EXPOSURE:schamberger-nt-28d"
        name: "Non-treated control (no CSE), 28 days of ALI differentiation"
        exposure_duration:
          value: "28"
          unit:
            id: "UO:0000033"
            name: "day"
      - id: "EXPOSURE:schamberger-cse-2.5pct-28d"
        name: "2.5% CSE basolateral, 28 days of ALI differentiation"
        exposure_agent:
          id: "ENVO:01000838"
          name: "smoke"
        exposure_concentration:
          value: "2.5"
          unit:
            id: "UO:0000187"
            name: "percent"
        exposure_duration:
          value: "28"
          unit:
            id: "UO:0000033"
            name: "day"
      - id: "EXPOSURE:schamberger-cse-5pct-28d"
        name: "5% CSE basolateral, 28 days of ALI differentiation"
        exposure_agent:
