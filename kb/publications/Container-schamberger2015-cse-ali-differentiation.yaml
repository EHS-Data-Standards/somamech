            id: "UO:0000033"
            name: "day"
    has_specified_output:
      - id: "FOXJ:schamberger-foxj1-mrna-28d-output-control"
        name: "FOXJ1 mRNA, non-treated control"
        experimental_group: control
        measured_under: "EXPOSURE:schamberger-nt-28d"
      - id: "FOXJ:schamberger-foxj1-mrna-28d-output-cse-2.5"
