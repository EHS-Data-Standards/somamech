# =============================================================================
# RESPONSE COMPARISONS — changes stated by the paper
# =============================================================================

response_comparisons:
  - id: "COMP:schamberger-goblet-cells-d28"
    name: "Increase in goblet cell numbers under CSE in fully differentiated pHBECs"
    description: >-
      The only change vs control that the paper states numerically rather
      than showing graphically. Reported in the discussion as "a 7% increase
      in goblet cell numbers in fully differentiated pHBECs" — the paper does
      not say whether this is 7 percentage points or a 7% relative increase,
      and gives no absolute goblet cell percentages to disambiguate it, so it
      is recorded as a percent change exactly as stated. Statistical support
      comes from the results section, which reports the day 28 increase under
      5% CSE as significant but gives no exact p-value.
    derived_from_assay: "GOBLET:schamberger-muc5ac-cells-d28"
    compared_measurement: "goblet_cell_percentage"
    control_output: "GOBLET:schamberger-muc5ac-cells-d28-output-control"
    treated_output: "GOBLET:schamberger-muc5ac-cells-d28-output-cse-5"
    change_type: percent_change
    change_direction: increased
    change_value:
      value: "7"
      unit:
        id: "UO:0000187"
        name: "percent"
    statistical_test: "repeated measures two-way ANOVA with Bonferroni post-tests versus the non-treated control"
    derivation: reported_in_paper

# =============================================================================
# KEY EVENT RELATIONSHIPS
# =============================================================================

key_event_relationships:
  - id: "KER:schamberger-ciliogenesis-to-mcc"
    name: "Altered ciliogenesis leads to impaired mucociliary clearance"
    description: >-
      The paper's own bridge from its in vitro result to the clinical
      phenotype: the authors state that the reduction in ciliated cell number
      they measured, together with a lower ciliary beat frequency, likely
      contributes to the reduced mucociliary clearance seen in smokers and
      COPD patients. Stated as a likelihood and not measured in this study —
      no mucociliary clearance assay was performed — so the support is weak
      and the quantitative understanding low.
    upstream_event:
      id: "KE:ke-altered-ciliogenesis"
      name: "Altered ciliogenesis"
      biological_action: decreased
      level_of_biological_organization: cellular
    downstream_event:
      id: "KE:ke3-impaired-mcc"
      name: "Impaired mucociliary clearance"
      biological_action: impaired
      level_of_biological_organization: tissue
    relationship_type: "indirectly leads to"
    evidence_support: weak
    quantitative_understanding: low
    evidence:
      - reference: "PMID:25641363"
        reference_title: "Cigarette smoke alters primary human bronchial epithelial cell differentiation at the air-liquid interface."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "reduction in ciliated cell number along with a lower ciliary beat frequency contributes to reduced mucociliary clearance found in smokers and COPD patients"
        explanation: "The authors link their measured loss of ciliated cells to reduced mucociliary clearance in smokers and COPD patients; the sentence is hedged (\"It is likely that\"), which is why evidence_support is weak."
