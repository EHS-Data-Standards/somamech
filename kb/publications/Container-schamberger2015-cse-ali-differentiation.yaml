  # --- CC10-positive Clara (club) cell fraction ----------------------------
  - id: "GENEXPR:schamberger-cc10-positive-cells-d28"
    name: "CC10-positive Clara (club) cell percentage under chronic CSE"
    description: >-
      Immunofluorescence quantification of CC10-positive Clara cells over 28
      days of ALI differentiation. The Clara cell fraction peaked at about
      20% at day 14 in all conditions. Control and 2.5% CSE cultures then
      dropped gradually to about 10% by day 28, whereas 5% CSE cultures did
      not decline between day 14 and day 28 and held about 17% at day 28
      (p < 0.01). Percentages are stated in prose as approximations and no
      spread is given for them. NOTE ON THE KEY EVENT: the shared key event
      is "Club cell marker loss" (decreased), but this paper reports club
      cell NUMBER going UP under CSE, so the evidence here is recorded as
      REFUTE. The companion assay on intracellular CC10 protein supports the
      same key event.
