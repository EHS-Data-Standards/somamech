# =============================================================================
# Schamberger et al. (2015) — "Cigarette smoke alters primary human bronchial
# epithelial cell differentiation at the air-liquid interface."
# Sci Rep 5:8163. DOI 10.1038/srep08163. PMID:25641363
# =============================================================================
#
# Cached reference content_type: full_text_pdf — every snippet below is
# verbatim from the committed references_cache/PMID_25641363.md, so CI can
# resolve all of them. No local-PDF-only quotes and no verification receipt.
#
# Study design (in vitro only):
#   - Normal primary human bronchial epithelial cells (pHBECs) from two
#     non-diseased donors (donor #1: male, Hispanic, 61 y; donor #2: female,
#     Asian, 62 y), differentiated on transwell inserts at the air-liquid
#     interface (ALI) for up to 28 days after air-lift.
#   - Cigarette smoke extract (CSE) made by bubbling mainstream smoke of
#     3R4F research cigarettes through BEBM medium; applied chronically from
#     the BASOLATERAL side at 2.5% or 5% between day 0 and day 28, renewed
#     every 2-3 days. Non-treated (NT) cultures are the control.
#   - Read-outs at day 7, 14, 21 and 28: TEER, LDH, immunofluorescence
#     quantification of acTUB+/CC10+/MUC5AC+ cells, qRT-PCR, Western blot.
#   - n = 3 independent differentiations; 12 images per group for the
#     immunofluorescence quantification. Data are mean +/- SD unless stated
#     otherwise (KRT5/KRT14 densitometry is mean +/- SEM, n = 4).
#
# Key findings recorded here:
#   - CSE impaired epithelial barrier formation (TEER), and induced CYP1A1
#     at all time points (AhR pathway activation, confirms CSE potency).
#   - Ciliated cells: control ~53% at day 28 vs ~30% under chronic CSE;
#     unchanged up to day 21. Acetylated tubulin protein fell from day 14.
#   - NULL RESULT: FOXJ1 mRNA and its target genes DNAI1, DNALI1, SPAG6 and
#     TEKT1 were unchanged — the ciliated-cell loss is FOXJ1-independent.
#   - Clara (club) cells: control fell to ~10% by day 28 while 5% CSE
#     cultures held ~17% (p < 0.01) — i.e. club cell NUMBER went UP, which
#     points against the shared "Club cell marker loss" key event. The club
#     cell MARKER did fall: intracellular CC10 protein decreased while
#     secreted CC10 increased.
#   - Goblet cells: 5% CSE significantly increased MUC5AC-positive cells at
#     day 28; the paper states a 7% increase in goblet cell numbers.
#   - NULL RESULT: MUC5AC and MUC5B transcript levels were largely unchanged.
#   - KRT14 protein increased significantly at day 28 and IVL transcript was
#     elevated at day 7 and day 28 — squamous metaplasia / impaired basal
#     cell differentiation.
#
# Quantitative caveats: the ciliated- and Clara-cell percentages the paper
# states in prose are approximations ("about 53%", "about 30%", "about 10%",
# "about 17%", "a peak of about 20%"); they are recorded as reported, with
# the hedge noted in each output record's description. No spread is given
# for these prose values, so no variability is recorded for them. TEER,
# LDH and CYP1A1 values are shown graphically only, so those output records
# carry no QuantityValues.
#
# Key Event blocks are copied byte-for-byte from origin/main (shared
# vocabulary). One new KE is minted: KE:ke-squamous-metaplasia — no existing
# key event on main covers squamous metaplasia / basal cell marker
# expansion (KE:ke-mucus-metaplasia is "Mucus secretory program
# activation", a different program).
# ONTOLOGY NOTE: the exposure agent is cigarette smoke extract (CSE),
# prepared by bubbling mainstream smoke of 3R4F research cigarettes through
# culture medium. No ontology term for "cigarette smoke extract" passes term
# validation — CHEBI:39188, which two old test fixtures use under that label,
# actually denotes bensultap — so the agent is grounded to ENVO:01000838
# "smoke" (already in use on main) and the cigarette-smoke-extract detail is
# carried in each exposure condition's name.
# =============================================================================

source_publication:
  reference: "PMID:25641363"
  reference_title: "Cigarette smoke alters primary human bronchial epithelial cell differentiation at the air-liquid interface."
  doi: "10.1038/srep08163"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:schamberger-if-quantification-001"
    protocol_type: StainingProtocol
    name: "Indirect immunofluorescence staining and cell-fraction quantification on transwell membranes"
    description: >-
      pHBECs were stained on the transwell membrane and the different cell
      fractions quantified as described previously. Cell-type-specific markers
      were acetylated tubulin (acTUB) for ciliated cells, CC10 for Clara
      cells and MUC5AC for goblet cells, with DAPI as counterstain. 12 images
      per group were analysed, from 3 independent differentiations.
    staining_type: "indirect immunofluorescence"
    antibodies_used:
      - "anti-acetylated tubulin (acTUB)"
      - "anti-CC10"
      - "anti-MUC5AC"
    counterstain: "DAPI"

  - id: "PROTOCOL:schamberger-qrtpcr-001"
    protocol_type: MolecularAssayProtocol
    name: "qRT-PCR of differentiation marker transcripts"
    description: >-
      Transcript levels were measured by qRT-PCR at day 7, 14, 21 and 28 of
      ALI differentiation. Relative transcript abundance is expressed as
      ddCt = [dCt(gene of interest, condition NT, day 7)] - [dCt(gene of
      interest, condition X, day X)] with dCt = Ct(gene of interest) -
      Ct(reference). For non-treated cells at day 21 or day 28, when CYP1A1
      transcript levels were below detection level, Ct = 40 was used for
      statistical analysis.
    detection_method: "quantitative real-time RT-PCR"
    normalization_method: "ddCt relative to the day 7 non-treated condition"

  - id: "PROTOCOL:schamberger-western-001"
    protocol_type: MolecularAssayProtocol
    name: "Western blot of differentiation markers with densitometric quantification"
    description: >-
      Western blot analysis of protein extracts from pHBECs differentiated
      for 7, 14, 21 or 28 days, non-treated or treated with 2.5% or 5% CSE.
      Blots were probed for acTUB, CC10, KRT5, KRT14 and GAPDH as loading
      control; secreted CC10 was blotted from the cell supernatants. Protein
      levels of KRT5 and KRT14 were quantified via densitometry analysis
      using Image Lab software, relative to GAPDH, as mean +/- SEM of four
      independent differentiations.
    detection_method: "Western blot with densitometry (Image Lab)"
    normalization_method: "relative to GAPDH"
    reference_gene: "GAPDH"

  - id: "PROTOCOL:schamberger-teer-001"
    protocol_type: MolecularAssayProtocol
    name: "Transepithelial electrical resistance (TEER) measurement"
    description: >-
      TEER development of differentiating pHBECs was monitored with a
      Millicell-ERS-2 volt-ohm-meter and an STX01 chopstick electrode. 500 ul
      pre-warmed HBSS was added apically and equilibrated for 10 minutes,
      then a triplicate measurement was performed for every well; 6 to 12
      individual wells were analysed per experiment and time point. Values
      were blank-corrected and multiplied by the effective membrane area
      (1.12 cm2 for 12-well transwell inserts).
    detection_method: "Millicell-ERS-2 volt-ohm-meter with STX01 chopstick electrode"
    normalization_method: "blank-subtracted and multiplied by effective membrane area (1.12 cm2)"

# =============================================================================
# CILIARY FUNCTION ASSAYS — ciliated cell fraction
# =============================================================================

ciliary_function_assays:
  - id: "CILIARY:schamberger-ciliated-cells-d28"
    name: "Acetylated-tubulin-positive ciliated cell percentage after 28 days of ALI differentiation with chronic CSE"
    description: >-
      Immunofluorescence quantification of acTUB-positive ciliated cells over
      28 days of pHBEC differentiation at ALI, with or without chronic CSE.
      The ciliated cell fraction rose over time in all cultures and was
      unchanged by CSE up to day 21; at day 28 chronic CSE strikingly reduced
      it in a concentration-dependent manner. The paper reports the day 28
      percentages in prose as approximations: controls approximately 50-55%
      (about 53%), CSE-exposed cultures only about 30%. The discussion pools
      the two CSE concentrations when stating the ~30% figure, so the treated
      output record is tied to a pooled chronic-CSE condition rather than to
      a single dose. No spread is given for these prose values.
    airway_region: "bronchus (primary human bronchial epithelial cells differentiated at the air-liquid interface)"
    has_exposure_condition:
      - id: "EXPOSURE:schamberger-nt-28d"
        name: "Non-treated control (no CSE), 28 days of ALI differentiation"
        exposure_duration:
          value: "28"
          unit:
            id: "UO:0000033"
            name: "day"
      - id: "EXPOSURE:schamberger-cse-chronic-28d"
        name: "Chronic basolateral CSE (2.5% or 5%, pooled), 28 days of ALI differentiation"
        exposure_agent:
          id: "ENVO:01000838"
          name: "smoke"
        exposure_duration:
          value: "28"
          unit:
            id: "UO:0000033"
            name: "day"
    has_specified_output:
      - id: "CILIARY:schamberger-ciliated-cells-d28-output-control"
        name: "Ciliated cell percentage at day 28, non-treated control"
        description: >-
          The paper states this value twice and approximately: "approximately
          50-55% of cells were ciliated" in the results and "about 53%" in the
          discussion. 53 is recorded as the value; no variability is stated
          for the prose figure.
        experimental_group: control
        measured_under: "EXPOSURE:schamberger-nt-28d"
        percentage_ciliated_cells:
          value: "53"
          unit:
            id: "UO:0000187"
            name: "percent"
          central_tendency: mean
          sample_size: 3
      - id: "CILIARY:schamberger-ciliated-cells-d28-output-cse"
        name: "Ciliated cell percentage at day 28, chronic CSE"
        description: >-
          "cells chronically exposed to CSE developed only about 30% ciliated
          cells" — stated without separating the 2.5% and 5% arms, so this
          record is pooled across both CSE concentrations. No variability is
          stated for the prose figure.
        experimental_group: treated
        measured_under: "EXPOSURE:schamberger-cse-chronic-28d"
        percentage_ciliated_cells:
          value: "30"
          unit:
            id: "UO:0000187"
            name: "percent"
          central_tendency: mean
          sample_size: 3
    informs_on_key_event:
      id: "KE:ke-altered-ciliogenesis"
      name: "Altered ciliogenesis"
      biological_action: decreased
      level_of_biological_organization: cellular
    study_subject:
      subject_type: CellularSystem
      id: "soma:schamberger-phbec-ali-001"
      name: "Primary human bronchial epithelial cells differentiated at the air-liquid interface"
      model_species:
        id: "NCBITaxon:9606"
        name: "Homo sapiens"
      cell_type:
        id: "CL:0002328"
        name: "bronchial epithelial cell"
      anatomical_origin:
        id: "UBERON:0002185"
        name: "bronchus"
      cell_culture_growth_mode: air_liquid_interface
      substrate_type: transwell_insert
      days_at_differentiation: 28
      donor_info: "Two non-diseased donors (Lonza): donor #1 male, Hispanic, 61 years, used for 2 independent differentiations; donor #2 female, Asian, 62 years, used for 1 differentiation."
    follows_protocols:
      - protocol_type: StainingProtocol
        id: "PROTOCOL:schamberger-if-quantification-001"
        name: "Indirect immunofluorescence staining and cell-fraction quantification on transwell membranes"
    evidence:
      - reference: "PMID:25641363"
        reference_title: "Cigarette smoke alters primary human bronchial epithelial cell differentiation at the air-liquid interface."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In controls, after 28 days, approximately 50–55% of cells were ciliated."
        explanation: "Gives the control ciliated cell fraction at day 28 that the control output record records as 53%."
      - reference: "PMID:25641363"
        reference_title: "Cigarette smoke alters primary human bronchial epithelial cell differentiation at the air-liquid interface."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "While control cells reached about 53% ciliated cells"
        explanation: "The discussion restates the control value as about 53%, the number recorded in the control output."
      - reference: "PMID:25641363"
        reference_title: "Cigarette smoke alters primary human bronchial epithelial cell differentiation at the air-liquid interface."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "cells chronically exposed to CSE developed only about 30% ciliated cells."
        explanation: "Gives the CSE-exposed ciliated cell fraction at day 28 recorded in the treated output."
      - reference: "PMID:25641363"
        reference_title: "Cigarette smoke alters primary human bronchial epithelial cell differentiation at the air-liquid interface."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In contrast, chronic CSE exposure strikingly reduced ciliated cell numbers at this time point in a concentration-dependent manner"
