      cultures goblet cells increased up to day 21 and declined afterwards;
      5% CSE significantly increased MUC5AC-positive cells at day 28. The
      paper states the effect size only as "a 7% increase in goblet cell
      numbers in fully differentiated pHBECs" and gives no absolute goblet
      cell percentages, so the output records carry no percentages and the
      stated increase is recorded in the response comparison below. The
      authors caution that the fractions must be viewed with caution because
      MUC5AC/CC10 double-positive cells exist.
