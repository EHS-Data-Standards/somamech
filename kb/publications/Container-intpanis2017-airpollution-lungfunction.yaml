# =============================================================================
# RESPONSE COMPARISONS — all 36 estimates in Table 3.
#
# Each entry is the estimated change in one lung function parameter per
# 10 ug/m3 increase in one pollutant at one lag, with its printed 95% CI and
# p-value. These are regression slopes from a linear mixed model, NOT
# differences between a control and a treated group, so control_output and
# treated_output are omitted throughout: this cohort has no unexposed arm.
#
# p_value is omitted wherever the paper prints only a threshold ("<0.0001")
# rather than an exact value — the slot is a float, and 0.0001 is not what the
# paper reported. Those cases are stated in the description instead.
#
# change_direction follows the paper's own significance criterion (p < 0.01,
# per the Table 3 footnote): estimates the paper does not call significant are
# recorded as no_change, with the signed point estimate kept in change_value.
# =============================================================================

response_comparisons:
  - id: "COMP:intpanis-pm10-lag0-fvc"
    name: "FVC change per 10 ug/m3 PM10 at lag 0"
    description: "Estimated change in FVC per 10 ug/m3 increase in particulate matter with an aerodynamic diameter < 10 um on the day of the lung function test (lag 0). Linear mixed model with a random intercept per participant (REML, unstructured autocorrelation), adjusted for sex, age, age squared, body mass index, smoking status, quality grade of the lung function test, apparent temperature, hour of the day, day of the week, month and year of the clinical visit. The paper treats p < 0.01 as significant, so this estimate is significant by the paper's own criterion. The paper reports only the threshold p < 0.0001, not an exact p-value, so p_value is omitted rather than invented. This is a regression slope across a continuously exposed cohort, not a contrast between a control group and a treated group: the study has no unexposed arm, so control_output and treated_output are deliberately omitted."
    derived_from_assay: "LF:intpanis-spirometry-cohort"
    compared_measurement: "fvc"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-18.9"
      unit:
        id: "UCUM:mL"
        name: "milliliter"
      central_tendency: single_value
      sample_size: 5404
      variability:
        variability_type: confidence_interval_95
        lower_bound: "-27.5"
        upper_bound: "-10.3"
        unit:
          id: "UCUM:mL"
          name: "milliliter"
    statistical_test: "linear mixed model (SAS MIXED procedure), random intercept per participant, REML with unstructured autocorrelation"
    derivation: reported_in_paper

