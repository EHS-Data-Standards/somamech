# =============================================================================
# Int Panis et al. (2017) - Short-term air pollution exposure decreases lung
# function: a repeated measures study in healthy adults
# =============================================================================
#
# Source: Environ Health. 2017;16:60
# DOI: 10.1186/s12940-017-0271-z
# PMID: 28615020
#
# Study design (HUMAN OBSERVATIONAL — not in vitro, not an animal experiment):
#   - Retrospective repeated-measures (panel) cohort study drawn from the
#     occupational medical surveillance programme of the Belgian Nuclear
#     Research Centre (SCK-CEN) in Mol, Belgium
#   - 2449 adult employees, 5404 clinical visits with spirometry between
#     26/01/2011 and 30/01/2015; visits on average 435 +/- 92 days apart
#   - Exposure: daily ambient PM10, NO2 and O3 from one fixed regulatory
#     monitoring station (VMM Dessel 42N016) 6 km from the medical centre,
#     at three lags: the day of the visit (lag 0), the day before (lag 1) and
#     two days before (lag 2). Ozone models were restricted to the warm
#     season (May-September).
#   - Outcomes: FVC, FEV1, FEV1/FVC and PEF from a single Vitalograph
#     Pneumotrac spirometer
#
# IMPORTANT — WHAT THE EXPOSURE CONTRAST ACTUALLY IS:
#   There is NO unexposed arm and no control group. Every participant breathed
#   the same ambient air; what varies is the day-to-day pollutant level. The
#   paper's results are therefore REGRESSION SLOPES — the estimated change in
#   a lung function parameter per 10 ug/m3 increase in a pollutant — from
#   linear mixed models with a random intercept per participant, not
#   differences between groups. That is modelled here as:
#     * ONE LungFunctionAssay (the spirometry), carrying ONE output record
#       with the pooled observed absolute lung function values (Table 1) and
#       pointing at the ambient-air condition the whole cohort was under
#     * the nine pollutant/lag exposure metrics as nine further
#       ExposureConditions, distinguished by exposure_agent and by
#       timing_post_exposure (0, 1 or 2 days)
#     * all 36 estimates in Table 3 as response_comparisons, each carrying the
#       slope, its 95% CI and its p-value, with control_output and
#       treated_output DELIBERATELY OMITTED because no such pair of groups
#       exists. Which pollutant and lag each comparison belongs to is in its
#       id, name and description.
#   The assay is deliberately NOT split per pollutant: there was one
#   spirometry measurement per visit, so splitting would duplicate the same
#   Table 1 values three times over as if they were separate measurements.
#
# IMPORTANT — SIGNIFICANCE THRESHOLD:
#   This paper does NOT use p < 0.05. Table 3's footnote states "P-values
#   < 0.01 are considered significant". Every response comparison's
#   change_direction follows that stated criterion: an estimate the paper does
#   not call significant is recorded as no_change, with its signed point
#   estimate still kept in change_value. Two Table 3 estimates sit between the
#   two thresholds — PM10 lag-2 FEV1/FVC (p = 0.016) and NO2 lag-2 FEV1
#   (p = 0.04) — so they are recorded as no_change here although they would
#   count as significant under a conventional p < 0.05; both descriptions say
#   so. 13 of the 36 estimates are significant by the paper's own criterion,
#   every one of them a decrease, and every one of them PM10 or NO2.
#
# IMPORTANT — WHAT THE PAPER DOES *NOT* CLAIM:
#   No mechanism was investigated: "we have not looked into possible
#   physiological pathways for the effects observed in this study." No
#   key_event_relationships are therefore recorded — there is nothing in this
#   paper linking one key event to another, only exposure to outcome. The
#   single key event this file informs on is the adverse outcome
#   KE:ao-decreased-lung-function, whose block is copied verbatim from main.
#
# SOURCE INCONSISTENCIES recorded as printed (never silently corrected):
#   - PM10 lag-0 PEF: Table 3 prints the 95% CI as (-75.0 to -27.7), the
#     abstract as (-75.0 to -27.0). The Table 3 value is recorded.
#   - Several printed 95% CIs are not centred on their point estimate
#     (O3 lag-0 FVC, NO2 lag-0 FEV1/FVC, NO2 lag-2 FEV1 and PEF). Recorded as
#     printed, flagged in each comparison's description.
#   - PM10 lag-0 FEV1/FVC: the printed CI excludes zero while the printed
#     p-value is 0.14.
#   - BMI: the Results text says 25.4 kg/m2 (IQR = 4.8) while Table 1 says
#     25.4 +/- 4.0 (SD). Both are noted in subject_characteristics; neither is
#     recorded as a numeric QuantityValue, since BMI has no subject slot.
#
# Key findings recorded here:
#   - Per 10 ug PM10/m3 on the day of the test: FVC -18.9 ml, FEV1 -12.8 ml,
#     PEF -51.4 ml/s (all p < 0.0001); comparable at lag 1 and lag 2
#   - Per 10 ug NO2/m3: PEF -66.1 ml/s and FEV1 -13.8 ml at lag 0
#   - FEV1/FVC was not associated with any pollutant; ozone was associated
#     with no outcome
#   - Concentrations were below European limit values but above WHO guidance
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:28615020"
  reference_title: "Short-term air pollution exposure decreases lung function: a repeated measures study in healthy adults."
  doi: "10.1186/s12940-017-0271-z"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:intpanis-spirometry-001"
    name: "Vitalograph Pneumotrac spirometry in an occupational surveillance programme"
    description: "Lung function measured with a Vitalograph Pneumotrac (Ennis, U.K.) in a standing posture, otherwise following the most recent European Respiratory Society and American Thoracic Society guidelines for lung function testing in occupational settings. The same device was used throughout the study, and participants were supervised and coached by one of three trained nurses. Examinations were performed on weekdays in the morning between 8 am and 12 am at the SCK-CEN medical centre. FVC, FEV1, FEV1/FVC ratio and PEF were obtained with the Vitalograph Pneumotrac software; the manoeuvre with the largest FEV1 + FVC sum was recorded and used for all other parameters. Three respiratory manoeuvres (maximum exhalation) were performed per visit in 2011, 2012 and 2013; because of the high reproducibility of the measurements, most participants performed only two manoeuvres in 2014 and 2015. The authors flag this mid-study change as a deviation from ERS/ATS guidelines and a limitation. No replicate_requirements value is recorded because the schema's slot is a single integer and the requirement changed during the study."
    spirometry_standard: "European Respiratory Society and American Thoracic Society guidelines for lung function testing in occupational settings"
    equipment_required:
      - "Vitalograph Pneumotrac spirometer (Ennis, U.K.)"
    quality_control_criteria: "A measuring session was considered usable when at least two manoeuvres, free from artefacts, passed the test acceptability criteria (quality grade C). A session with a maximum difference between two FEV1 values of 150 mL and a maximum difference between two FVC values of 150 mL was graded A; when only the former was met, the quality was graded B. Across the study 49% of sessions were graded A, 15% B and 36% C. The quality grade was carried into the models as a covariate."
    institution: "Belgian Nuclear Research Centre (SCK-CEN) medical centre, Mol, Belgium"

  - id: "PROTOCOL:intpanis-ambient-monitoring-001"
    name: "Daily ambient PM10, NO2 and ozone from a fixed regulatory monitoring station"
    description: "Validated daily concentrations of PM10, NO2 and O3 obtained from the official air quality monitoring station of the Flanders Environment Agency (VMM) in Dessel (station number 42N016), a rural background station 6 km east of the SCK-CEN medical centre, with no major local pollution sources near either site. Exposure was calculated as the average concentration on the day of each clinical visit (lag 0), the day before (lag 1) or two days before (lag 2). The 24-h mean outdoor temperature and humidity came from the meteorological station Antwerpen-Luchtbal (T2M802, about 50 km from the air quality station) and were used to compute apparent temperature with the August-Roche-Magnus approximation. The authors note that NO2 exhibits large spatial variation, so exposure misclassification is likely greater for NO2 than for PM10, biasing the NO2 effect estimates towards the null."
    equipment_required:
      - "Thermo Andersen ESM FH 62 I-R (PM10)"
      - "ThermoFisher Model 42i (NO2)"
      - "Teledyne API Model T400 (ozone)"
    institution: "Flanders Environment Agency (VMM), monitoring station Dessel 42N016"

# =============================================================================
# LUNG FUNCTION ASSAY — one spirometry assay for the whole cohort.
#
# The output record holds the pooled OBSERVED lung function values (Table 1),
# which is the only absolute lung function data the paper reports. The
# pollutant-specific findings are slopes and live in response_comparisons
# below, keyed to this assay by derived_from_assay.
# =============================================================================

lung_function_assays:
  - id: "LF:intpanis-spirometry-cohort"
    name: "Repeated spirometry in 2449 Belgian adult workers under ambient air pollution"
    description: "Annual occupational-surveillance spirometry (FVC, FEV1, FEV1/FVC, PEF) in 2449 healthy adult employees over 5404 clinical visits between 26/01/2011 and 30/01/2015, analysed against daily ambient PM10, NO2 and ozone at three lags. Most participants (35%) had 3 valid measurements during the study period; 28% had 2, 25% a single one, and 12% more than 3. Measured concentrations were well below the European limit value of 40 ug/m3 but exceeded 50 ug PM10/m3 on 26, 18, 14 and 13 days in 2011-2014, above the WHO recommended maximum of 3 days/year — the setting the authors stress, since effects appear at concentrations that comply with EU regulation. Mixed models separating within- from between-subject exposure showed the reported associations are driven by within-subject effects, while between-subject effects were not significant. Secondary analyses found no differential effect of sex, age (above or below 30) or smoking status, and sensitivity analyses excluding participants who changed smoking status or measurements taken during the influenza season did not change the conclusions. Limitations the authors state: asthmatic status could not be included (it was only in non-digitised written medical files), residential addresses and travel history were unavailable, no personal monitoring was possible, and the spirometry protocol changed from three to two manoeuvres mid-study. No numeric value is recorded for the exposure-stratified or sensitivity analyses because the paper reports them as 'data not shown' or only in figures."
    evidence:
      - reference: "PMID:28615020"
        reference_title: "Short-term air pollution exposure decreases lung function: a repeated measures study in healthy adults."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "To evaluate the association between daily changes in air pollution and lung function in healthy adults we obtained annual lung function measurements from a routine worker health surveillance program not designed for research purposes. Forced Vital Capacity (FVC), Forced Expiratory Volume in the first second (FEV1), FEV1/FVC and Peak Expiratory flow (PEF) from a cohort of 2449 employees were associated with daily measurements of PM10, NO2 and ozone at a nearby monitoring station in the North of Belgium. Repeated measures were available for the period 2011-2015."
        explanation: "States the study design, the cohort size, the four spirometry outcomes and the three pollutants this assay records, and the 2011-2015 repeated-measures period."
