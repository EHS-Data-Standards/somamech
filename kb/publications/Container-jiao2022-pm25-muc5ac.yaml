  # ---------------------------------------------------------------------------
  # EGFR LIGAND PROTEIN (ELISA, Fig. 4) - the protein-level counterpart of the
  # ligand mRNA assays above, and the only assays that follow
  # PROTOCOL:jiao-elisa-001.
  #
  # Two things to know before reading these six records:
  #   1. The paper reports the ELISA data graphically only (Fig. 4; y-axes in
  #      pg per mg total cell culture protein) and states no mean, SEM or exact
  #      p-value anywhere in the text or a table. Every numeric value in this
  #      file is quoted from the paper, so these outputs carry no
  #      protein_level: the direction is recorded in response_comparisons
  #      instead, exactly as the Western blot and inhibitor arms are.
  #   2. The ELISA arm used n = 4 cultures in BOTH donor groups (Fig. 4
  #      legend), whereas the mRNA arm used n = 6 CRSwNP-derived cultures.
  #      That is why these are separate assays rather than extra outputs on
  #      the mRNA assays above.
  #
  # EREG protein was assayed by the same ELISA but fell below the kit's
  # detection range, so it gets no assay record (see PROTOCOL:jiao-elisa-001).
  # ---------------------------------------------------------------------------
  - id: "GE:jiao-hbegf-protein-control-24h"
    name: "HB-EGF protein (ELISA) - control-subject HNECs, PM2.5 24 h"
    description: "ELISA for heparin-binding EGF-like growth factor protein in ALI cultures from control subjects (n = 4) treated with 200 ug/mL PM2.5 for 24 h. HB-EGF protein was increased relative to medium-only cultures (Fig. 4; p < 0.05), matching the HB-EGF mRNA rise recorded in GE:jiao-hbegf-mrna-control-24h. Values are expressed as pg per mg total cell culture protein (Bradford assay). The paper shows these data graphically only, so neither output carries a numeric protein_level; COMP:jiao-hbegf-protein-control records the direction without a magnitude."
    target_gene: "NCBIGene:1839"
    gene_expression_method: "ELISA (Cloud Clone Corp. kit, absorbance at 450 nm)"
    normalization_reference: "total cell culture protein (Bradford assay)"
    evidence:
      - reference: "PMID:34736257"
        reference_title: "PM2.5 Upregulates the Expression of MUC5AC via the EGFR-PI3K Pathway in Human Sinonasal Epithelial Cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "treatment with PM2.5 at 200 μg/mL for 24 h obviously increased the protein expression of HB-...EGF and AREG in both control cultures and CRSwNP-...derived cultures (Fig. 4)."
