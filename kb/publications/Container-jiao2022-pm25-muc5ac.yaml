# =============================================================================
# Jiao et al. (2022) - PM2.5 Upregulates the Expression of MUC5AC via the
# EGFR-PI3K Pathway in Human Sinonasal Epithelial Cells
# =============================================================================
#
# Source: Int Arch Allergy Immunol. 2022;183(4):361-374
# DOI: 10.1159/000519702
#
# Study design (in vitro only):
#   - Primary human nasal epithelial cells (HNECs) at air-liquid interface
#   - Donors: 8 control subjects (non-inflammatory sinus surgery) and
#     14 patients with chronic rhinosinusitis with nasal polyps (CRSwNP);
#     n = 4 control-derived and n = 6 CRSwNP-derived cultures per experiment
#   - PM2.5 collected in Beijing (Sept-Nov 2019), applied apically at
#     100 or 200 ug/mL for 24 h; Western blot arm used 200 ug/mL for 30 min
#   - Inhibitors: AG1478 (10 uM, EGFR inhibitor) and LY294002 (25 uM, PI3K
#     inhibitor), 30 min pretreatment before PM2.5
#   - Statistics: mean +/- SEM, t test or one-way ANOVA with Bonferroni;
#     significance reported only as * p < 0.05 (no exact p-values given)
#
# Key findings:
#   - 200 ug/mL PM2.5 increased MUC5AC mRNA and the percentage of
#     MUC5AC-positive cells in both donor groups
#   - 200 ug/mL PM2.5 increased SPDEF mRNA (goblet cell differentiation TF)
#   - PM2.5 increased HB-EGF, AREG and EREG mRNA (EGFR ligands)
#   - PM2.5 increased HB-EGF and AREG protein by ELISA in both donor groups;
#     TGF-alpha protein did not change and EREG protein was below the kit's
#     detection range (Fig. 4, graphical only - no values stated)
#   - PM2.5 (30 min) increased p-PI3K, p-AKT and p-ERK; total protein unchanged
#   - AG1478 and LY294002 pretreatment attenuated PM2.5-induced MUC5AC
#   - NULL RESULT: PM2.5 did not change GMNC, MCIDAS, FOXJ1 or DNAI2 mRNA,
#     nor the percentage of beta-tubulin IV-positive (ciliated) cells
#
# Provenance of numbers: most quoted snippets below are verbatim from the
# committed abstract in references_cache/PMID_34736257.md. The fold-change
# values and sample sizes come from the Results section of the full text,
# read locally from the PDF (references_cache_local/, gitignored); the
# abstract states the direction of each change but not its magnitude.
# The EGFR ligand protein (ELISA) assays are the exception: the abstract says
# nothing about them, so their snippets quote the full-text Results and the
# Figure 4 legend, verified against the local PDF extraction and held to the
# committed receipt verification/PMID_34736257.json. Those quotes carry "..."
# elisions at the points where the PDF's two-column layout hyphenates a word
# across a line break ("HB-EGF" -> "HB- EGF", "patients" -> "pa- tients");
# the elision is the quote checker's own form for a span it must skip.
# Control output records are anchored at 1.0 because the paper expresses
# every treated value as "-fold than that of cells treated with medium only".
#
# =============================================================================

source_publication:
  reference: "PMID:34736257"
  reference_title: "PM2.5 Upregulates the Expression of MUC5AC via the EGFR-PI3K Pathway in Human Sinonasal Epithelial Cells."
  doi: "10.1159/000519702"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:jiao-ali-001"
    name: "Primary HNEC air-liquid interface culture"
    description: "Nasal mucosal tissue dissociated in 0.1% protease type XIV in DMEM overnight at 4C. Cells seeded at 150,000 per well onto human placental collagen-precoated 6.5-mm Transwell polyester membranes (0.4 um pore, Costar/Corning). Submerged culture in bronchial epithelial growth medium:DMEM (1:1); ALI established at confluence by removing apical medium, basolateral ALI medium containing 50 nM all-trans retinoic acid, changed every other day for 14 days until differentiated. PM2.5 added to the apical compartment; control cultures received ALI culture medium only."
    equipment_required:
      - "Transwell polyester membrane inserts, 6.5 mm, 0.4 um pore (Costar, Corning)"
      - "Human placental collagen coating"
      - "Bronchial epithelial growth medium:DMEM (1:1) with 50 nM all-trans retinoic acid"

  - id: "PROTOCOL:jiao-qpcr-muc5ac"
    protocol_type: MolecularAssayProtocol
    name: "Real-time PCR for MUC5AC"
    description: "ALI cultures lysed in RLT buffer after 24 h PM2.5; total RNA extracted with RNeasy mini kit (Qiagen). Reverse transcription with PrimeScript RT Master Mix (TaKaRa). SYBR Green assay on ABI7500 Real-Time PCR Detection System (Applied Biosystems). GAPDH endogenous reference; relative expression by the comparative cycle threshold method."
    detection_method: "SYBR Green real-time PCR"
    reference_gene: "GAPDH"
    primer_sequences:
      - "MUC5AC-F: ACCAATGCTCTGTATCCTTCCC"
      - "MUC5AC-R: GTTTGGGTGGAGTAAGCCACA"
    equipment_required:
      - "ABI7500 Real-Time PCR Detection System (Applied Biosystems)"
      - "RNeasy mini kit (Qiagen)"
      - "PrimeScript RT Master Mix (TaKaRa Biotechnology)"

  - id: "PROTOCOL:jiao-qpcr-spdef"
    protocol_type: MolecularAssayProtocol
    name: "Real-time PCR for SPDEF"
    description: "ALI cultures lysed in RLT buffer after 24 h PM2.5; total RNA extracted with RNeasy mini kit (Qiagen). Reverse transcription with PrimeScript RT Master Mix (TaKaRa). SYBR Green assay on ABI7500 Real-Time PCR Detection System (Applied Biosystems). GAPDH endogenous reference; relative expression by the comparative cycle threshold method."
    detection_method: "SYBR Green real-time PCR"
    reference_gene: "GAPDH"
    primer_sequences:
      - "SPDEF-F: CAGTGCCCGGTCATTGACA"
      - "SPDEF-R: CAGCCGGTATTGGTGCTCT"
    equipment_required:
