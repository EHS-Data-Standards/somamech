# =============================================================================
# KEY EVENT RELATIONSHIPS - the mechanism this paper argues for
# =============================================================================

key_event_relationships:
  - id: "KER:jiao-egfr-to-mucin"
    name: "EGFR activation leads to mucin hypersecretion"
    description: "Central mechanism of Jiao 2022: PM2.5 raises EGFR ligand expression (HB-EGF, AREG, EREG) and activates PI3K-AKT/ERK, and blocking either EGFR (AG1478) or PI3K (LY294002) attenuates the PM2.5-induced rise in MUC5AC mRNA and protein in human nasal epithelial cells."
    upstream_event:
      id: "KE:ke1-egfr-activation"
      name: "EGFR activation"
      biological_action: activated
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-mucin-hypersecretion"
      name: "Mucin hypersecretion"
      biological_action: increased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: strong
    evidence:
      - reference: "PMID:34736257"
        reference_title: "PM2.5 Upregulates the Expression of MUC5AC via the EGFR-PI3K Pathway in Human Sinonasal Epithelial Cells."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Furthermore, this study shows that PM2.5-induced MUC5AC expression is likely mediated through the EGFR-PI3K pathway."
        explanation: "The abstract's conclusion states the directional link this key event relationship records: EGFR-PI3K pathway activation mediates the increase in MUC5AC."
      - reference: "PMID:34736257"
