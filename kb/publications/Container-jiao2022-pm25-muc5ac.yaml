    description: "ALI cultures lysed in RLT buffer after 24 h PM2.5; total RNA extracted with RNeasy mini kit (Qiagen). Reverse transcription with PrimeScript RT Master Mix (TaKaRa). SYBR Green assay on ABI7500 Real-Time PCR Detection System (Applied Biosystems). GAPDH endogenous reference; relative expression by the comparative cycle threshold method."
