  - id: "PROTOCOL:jiao-icc-muc5ac"
    protocol_type: StainingProtocol
    name: "Immunocytochemical staining for MUC5AC"
    description: "ALI cultures fixed in 50:50 methanol:acetone, permeabilized with 0.3% Triton X-100, blocked with 5% skim milk, incubated overnight at 4C with anti-beta-tubulin IV (1:500, Sigma-Aldrich) and anti-MUC5AC (1:200, Abcam). Secondary antibodies labelled with fluorescein isothiocyanate (1:500, Invitrogen) and rhodamine (1:500, Invitrogen). Nuclei counterstained with 4,6-diamidino-2-phenylindole. Imaged on an Olympus IX81 confocal microscope; positive cells expressed as a percentage of total cells."
    staining_type: "immunofluorescence"
    fixation_method: "50:50 methanol:acetone"
    detection_method: "confocal microscopy (Olympus IX81)"
    antibodies_used:
      - "anti-MUC5AC (1:200, Abcam)"
      - "rhodamine-labelled secondary (1:500, Invitrogen)"
    equipment_required:
      - "Olympus IX81 confocal microscope"
      - "anti-beta-tubulin IV (Sigma-Aldrich)"
      - "anti-MUC5AC (Abcam)"

  - id: "PROTOCOL:jiao-icc-btub"
    protocol_type: StainingProtocol
    name: "Immunocytochemical staining for beta-tubulin IV"
    description: "ALI cultures fixed in 50:50 methanol:acetone, permeabilized with 0.3% Triton X-100, blocked with 5% skim milk, incubated overnight at 4C with anti-beta-tubulin IV (1:500, Sigma-Aldrich) and anti-MUC5AC (1:200, Abcam). Secondary antibodies labelled with fluorescein isothiocyanate (1:500, Invitrogen) and rhodamine (1:500, Invitrogen). Nuclei counterstained with 4,6-diamidino-2-phenylindole. Imaged on an Olympus IX81 confocal microscope; positive cells expressed as a percentage of total cells."
    staining_type: "immunofluorescence"
    fixation_method: "50:50 methanol:acetone"
    detection_method: "confocal microscopy (Olympus IX81)"
    antibodies_used:
      - "anti-beta-tubulin IV (1:500, Sigma-Aldrich)"
      - "fluorescein isothiocyanate-labelled secondary (1:500, Invitrogen)"
    equipment_required:
      - "Olympus IX81 confocal microscope"
      - "anti-beta-tubulin IV (Sigma-Aldrich)"
      - "anti-MUC5AC (Abcam)"

  - id: "PROTOCOL:jiao-elisa-001"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for EGFR ligand protein (HB-EGF, TGF-alpha, AREG)"
    description: "ALI cultures treated with PM2.5 for 24 h assayed with commercial ELISA kits (Cloud Clone Corp., Wuhan) for HB-EGF, TGF-alpha and AREG. Absorbance read at 450 nm. Protein concentration of each culture determined by Bradford assay. EREG protein was also assayed but fell below the kit's detection range, so no EREG protein assay record exists."
    detection_method: "colorimetric ELISA, absorbance read at 450 nm"
    normalization_method: "pg per mg total cell culture protein (Bradford assay)"
    equipment_required:
      - "ELISA plate reader (450 nm)"
      - "HB-EGF / TGF-alpha / AREG ELISA kits (Cloud Clone Corp., Wuhan)"

  - id: "PROTOCOL:jiao-wb-001"
    protocol_type: MolecularAssayProtocol
    name: "Western blot for PI3K, AKT and ERK phosphorylation"
    description: "ALI cultures treated with PM2.5 for 30 min harvested in RIPA lysis buffer with protease and phosphatase inhibitors. Equal protein separated by SDS-PAGE, transferred to polyvinylidene fluoride membranes, blocked in 5% BSA, incubated overnight at 4C with anti-p-PI3K (1:1,000), anti-PI3K (1:2,000), anti-p-AKT (1:1,000), anti-AKT (1:2,000), anti-p-ERK (1:1,000), anti-ERK (1:2,000) (Cell Signaling Technology) and anti-GAPDH (1:10,000, Abcam). Electrogenerated chemiluminescence detection; bands analysed in ImageJ."
    detection_method: "electrogenerated chemiluminescence"
    normalization_method: "GAPDH loading control"
    antibodies_used:
      - "anti-p-PI3K (1:1,000, Cell Signaling Technology)"
      - "anti-PI3K (1:2,000, Cell Signaling Technology)"
      - "anti-p-AKT (1:1,000, Cell Signaling Technology)"
      - "anti-AKT (1:2,000, Cell Signaling Technology)"
      - "anti-p-ERK (1:1,000, Cell Signaling Technology)"
      - "anti-ERK (1:2,000, Cell Signaling Technology)"
      - "anti-GAPDH (1:10,000, Abcam)"
    equipment_required:
      - "SDS-PAGE and polyvinylidene fluoride transfer apparatus"
      - "Electrogenerated chemiluminescence detection system"
      - "ImageJ densitometry software"

