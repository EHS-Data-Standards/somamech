        id: "PROTOCOL:calderon-tem-001"
        name: "Transmission electron microscopy of nasal biopsy ultrathin sections"

# =============================================================================
# KEY EVENT RELATIONSHIPS
# =============================================================================

key_event_relationships:
  - id: "KER:calderon-ciliary-to-mcc"
    name: "Acquired ciliary defects lead to impaired mucociliary clearance"
    description: "The paper links the prominent acquired ciliary defects and the disordered nasal epithelium of SWMMC children to the loss of intact mucociliary defense. The link is asserted qualitatively from ultrastructure; no clearance measurement quantifies it."
    upstream_event:
      id: "KE:ke3-impaired-ciliary"
      name: "Decreased ciliary function"
      biological_action: decreased
    downstream_event:
      id: "KE:ke3-impaired-mcc"
      name: "Impaired mucociliary clearance"
      biological_action: impaired
    relationship_type: "directly leads to"
    evidence_support: moderate
    quantitative_understanding: not_specified
    evidence:
      - reference: "PMID:11159046"
        reference_title: "Ultrastructural nasal pathology in children chronically and sequentially exposed to air pollutants."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "The nasal epithelium in SWMMC children is fundamentally disordered, and their mucociliary defense mechanisms are no longer intact."
        explanation: "Ties the structural disorder of the epithelium, including the acquired ciliary defects, to the loss of mucociliary defense - the upstream-to-downstream link this relationship records."
