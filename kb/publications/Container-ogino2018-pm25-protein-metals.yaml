# =============================================================================
# RESPONSE COMPARISONS
#
# Every comparison here is acid/heat-TREATED PM2.5 against PURE PM2.5 — i.e.
# the effect of SUBTRACTING PM2.5-bound protein and acid-soluble metals, not
# the effect of PM2.5 against saline. `control_output` therefore holds the
# pure-PM2.5 record: pure PM2.5 is the baseline for this particular contrast,
# which is the contrast the abstract's RESULTS sentences actually report.
#
# `change_value`, `change_type`, `p_value` and `statistical_test` are omitted
# throughout: the abstract reports direction only ("attenuated" / "was
# increased") with no magnitudes, units or statistics. `derivation:
# reported_in_paper` records that the direction is the paper's own statement.
# =============================================================================

response_comparisons:
  - id: "COMP:ogino-ahr"
    name: "AHR, treated PM2.5 vs pure PM2.5"
    description: "Removing PM2.5-bound protein and acid-soluble metals attenuated airway hyperresponsiveness. Direction reported in the abstract; no value or p-value available without the full text."
    derived_from_assay: "LF:ogino-ahr-treated-pm25"
    compared_measurement: "lung_resistance"
    control_output: "LF:ogino-ahr-pure-pm25-output"
    treated_output: "LF:ogino-ahr-treated-pm25-output"
