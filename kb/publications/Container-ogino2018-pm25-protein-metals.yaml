# =============================================================================
# KEY EVENT RELATIONSHIPS
#
# One relationship only. The abstract reports airway hyperresponsiveness,
# BALF eosinophilia and peribronchial inflammation moving together in the same
# direction under the same manipulation, which supports the inflammation ->
# lung function link. It does NOT support an oxidative-stress -> airway
# inflammation link in this model: 4-OH-2-nonenal and Nrf2 rose while the
# allergic inflammation fell, so that edge is deliberately not asserted.
# =============================================================================

key_event_relationships:
  - id: "KER:ogino-airway-inflammation-to-lung-function"
    name: "Airway inflammation leads to decreased lung function"
    description: "In this component-subtraction experiment airway hyperresponsiveness, BALF eosinophil percentage and peribronchial inflammation were all attenuated together by the same manipulation (removal of PM2.5-bound protein and acid-soluble metals), linking the inflammatory key event to the functional outcome."
    upstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    downstream_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    relationship_type: "directly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:30849251"
        reference_title: "Involvement of PM2.5-bound protein and metals in PM2.5-induced allergic airway inflammation in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The treatment of PM2.5 with a strong acid at a high temperature attenuated AHR, eosinophil percentage in BALF, mRNA levels of IL-13 and CXCL3 and peribronchial inflammation."
        explanation: "AHR (the functional outcome) is attenuated in the same sentence, by the same manipulation, as BALF eosinophilia, IL-13/CXCL3 mRNA and peribronchial inflammation (the inflammatory key event). Co-attenuation of the upstream and downstream measures under one intervention is the coherence this relationship rests on; the abstract does not test the edge directly, hence moderate rather than strong support."
