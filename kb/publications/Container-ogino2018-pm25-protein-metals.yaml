        evidence_source: MODEL_ORGANISM
        snippet: "Allergic airway inflammation was compared between the three groups (saline, pure PM2.5 and treated PM2.5) by evaluating airway hyperresponsiveness (AHR), bronchoalveolar lavage fluid (BALF) cells, serum IgE, the mRNA of various cytokine (IL-4, IL-5, IL-13, eotaxin-1 and CXCL3), mucus protein mRNA (MUC5ac and MUC5b) and the filtration of inflammatory cells in the lung."
        explanation: "Establishes that BALF cells were measured in a pure PM2.5 group alongside a saline group and a treated PM2.5 group, which is exactly the group structure and endpoint this assay record represents."
