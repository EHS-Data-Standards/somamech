# =============================================================================
# Ogino et al. (2018) - Involvement of PM2.5-bound protein and metals in
# PM2.5-induced allergic airway inflammation in mice
# =============================================================================
#
# Source: Inhal Toxicol (2018)
# DOI: 10.1080/08958378.2018.1561769
# PMID: 30849251
#
# EXTRACTION SCOPE — ABSTRACT ONLY
#   The committed reference cache entry for PMID:30849251 is `content_type:
#   abstract_only` and no local PDF of this paper exists in the repository.
#   Every `snippet:` below is therefore taken verbatim from the cached
#   abstract, and nothing is recorded that the abstract does not state.
#   Consequences for this file:
#     - No numeric measurement values are recorded. The abstract reports the
#       DIRECTION of each change ("attenuated" / "was increased") but no
#       values, units, group sizes or p-values. Output records therefore carry
#       the group linkage only, and the reported direction is captured in
#       `response_comparisons` with `derivation: reported_in_paper` and no
#       `change_value`.
#     - Protocol records describe only what the abstract states about method.
#     - Serum IgE, IL-4, IL-5, eotaxin-1, MUC5ac and MUC5b were measured by
#       the authors (they are named in the METHODS sentence) but the abstract
#       does not report which way any of them moved, so no assay is recorded
#       for them. They are named here so a later full-text pass knows what is
#       still missing.
#
# Study design (as stated in the abstract):
#   - Species: BALB/c mice (Mus musculus). The PubMed record indexes the study
#     under "Mice, Inbred BALB C" and "Male".
#   - Sensitization protocol: the abstract describes NO separate allergen
#     (e.g. OVA) sensitization or challenge step. PM2.5 itself, collected by a
#     cyclone system, was administered to the mice and is reported to have
#     induced the allergic airway inflammation. Any sensitization detail beyond
#     that is not in the abstract and is deliberately not recorded.
#   - Three groups: (1) saline, (2) pure PM2.5, (3) treated PM2.5.
#   - "Treated PM2.5" = PM2.5 held at high temperature and exposed to a strong
#     acid, which hydrolyzes the PM2.5-bound protein and removes trace
#     elements. It is the component-subtraction arm: comparing treated PM2.5
#     against pure PM2.5 isolates the contribution of PM2.5-bound protein plus
#     acid-soluble metals.
#
# The two components, kept distinct (this is the point of the paper):
#
#   PM2.5-BOUND PROTEIN + ACID-SOLUBLE METALS (removed by the treatment).
#   The treatment "reduced PM2.5-bound proteins as well as the percentages of
#   the trace elements in PM2.5 in the order Zn > Cu > Pb > P > S > Mn > Fe >
#   Ca > Ni". Removing them ATTENUATED the eosinophilic/Th2-type arm of the
#   response: AHR, BALF eosinophil percentage, IL-13 and CXCL3 mRNA, and
#   peribronchial inflammation all fell. So the bound protein and the
#   acid-soluble metal fraction are what drive the allergic, eosinophilic
#   airway inflammation.
#
#   THE RESIDUAL PARTICLE CORE (what the treatment left behind; the abstract
#   reports the percentage of C, Si and Cl increased). Against that
#   protein- and metal-depleted particle the response SHIFTED rather than
#   disappeared: BALF neutrophil percentage, MIP2a, EGFR, Nrf2 and TLR4 mRNA,
#   and lung 4-OH-2-nonenal all rose — a neutrophilic, oxidative-stress /
#   innate-signalling response attributable to the carbonaceous core, not to
#   the protein or the acid-soluble metals.
#
#   The abstract does not separate PM2.5-bound protein from acid-soluble
#   metals from each other: a single treatment removes both at once, so the
#   paper's own conclusion attributes the effect to them jointly ("PM2.5-bound
#   proteins and acid-soluble metals may be involved"). This file does not
#   attribute any effect to protein alone or to metals alone.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:30849251"
  reference_title: "Involvement of PM2.5-bound protein and metals in PM2.5-induced allergic airway inflammation in mice."
  doi: "10.1080/08958378.2018.1561769"

# =============================================================================
# PROTOCOLS
# Descriptions are limited to what the abstract states about method.
# =============================================================================

protocols:
  - id: "PROTOCOL:ogino-pm25-treatment-001"
    name: "High-temperature strong-acid treatment of PM2.5"
    description: "Component-subtraction preparation of the test particle. PM2.5 was treated at high temperature and with a strong acid in order to hydrolyze any protein content and remove trace elements. The abstract reports the treatment reduced PM2.5-bound proteins and the percentages of the trace elements in PM2.5 in the order Zn > Cu > Pb > P > S > Mn > Fe > Ca > Ni, while the percentage of C, Si and Cl increased. Specific temperature, acid identity, concentration and contact time are not given in the abstract."
    equipment_required:
      - "Cyclone PM2.5 collection system"

  - id: "PROTOCOL:ogino-ahr-001"
    name: "Airway hyperresponsiveness measurement"
    description: "Airway hyperresponsiveness (AHR) was evaluated in each of the three groups. The abstract names AHR as an endpoint but gives no instrument, bronchoconstrictor agent, dose series or reported metric."

  - id: "PROTOCOL:ogino-balf-001"
    name: "Bronchoalveolar lavage fluid cell differential"
    description: "Bronchoalveolar lavage fluid (BALF) cells were evaluated and reported as eosinophil and neutrophil percentages. The abstract gives no lavage volume, stain or counting method."

  - id: "PROTOCOL:ogino-mrna-001"
    name: "Cytokine, chemokine and mucus protein mRNA measurement in lung"
    description: "mRNA of various cytokines (IL-4, IL-5, IL-13, eotaxin-1 and CXCL3) and mucus protein mRNA (MUC5ac and MUC5b) were evaluated; the results section additionally reports mRNA expression of MIP2a, EGFR, Nrf2 and TLR4. The abstract names no platform, reference gene or primers."

  - id: "PROTOCOL:ogino-lung-histology-001"
    name: "Lung histology for inflammatory cell infiltration"
    description: "The filtration of inflammatory cells in the lung was evaluated; the results are reported as peribronchial inflammation. The abstract names no fixation, section thickness or stain."

  - id: "PROTOCOL:ogino-4hne-001"
    name: "4-OH-2-nonenal measurement in lung"
    description: "4-OH-2-nonenal (4-hydroxy-2-nonenal, a lipid peroxidation marker) levels were measured in the lung. The abstract names no detection method."

# =============================================================================
# LUNG FUNCTION ASSAYS — airway hyperresponsiveness (in vivo)
#
# Pure PM2.5 induced the response; removing PM2.5-bound protein and
# acid-soluble metals attenuated it.
# =============================================================================

lung_function_assays:
  - id: "LF:ogino-ahr-pure-pm25"
    name: "Airway hyperresponsiveness - pure PM2.5"
    description: "AHR in BALB/c mice administered untreated (pure) PM2.5 collected by the cyclone system. This is the intact-particle arm: protein and trace elements still bound. The abstract reports that this PM2.5 induced allergic airway inflammation in mice but gives no AHR value."
    evidence:
      - reference: "PMID:30849251"
        reference_title: "Involvement of PM2.5-bound protein and metals in PM2.5-induced allergic airway inflammation in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PM2.5 collected by of the cyclone system induced allergic airway inflammation in mice."
        explanation: "The paper's own conclusion that the intact, cyclone-collected PM2.5 induced allergic airway inflammation in the mouse. Airway hyperresponsiveness is one of the endpoints by which that inflammation was compared between groups, so this sentence establishes the pure-PM2.5 arm this assay records."
    has_exposure_condition:
      - id: "EXPOSURE:ogino-pure-pm25"
        name: "Pure (untreated) PM2.5 administration"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
    has_specified_output:
      - id: "LF:ogino-ahr-pure-pm25-output"
        name: "AHR - pure PM2.5 group"
        experimental_group: treated
        measured_under: "EXPOSURE:ogino-pure-pm25"
    informs_on_key_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    study_subject:
      subject_type: InVivoSubject
      id: "SUBJECT:ogino-mouse-pure-pm25"
      name: "Pure PM2.5 BALB/c mouse"
      model_species:
        id: "NCBITaxon:10090"
        name: "Mus musculus"
      sex: "male"
      disease_state: "PM2.5-induced allergic airway inflammation"
      subject_characteristics: "BALB/c mice. The abstract describes no separate allergen sensitization or challenge step; PM2.5 itself was administered. Age and body weight are not given in the abstract."
    follows_protocols:
      - protocol_type: SpirometryProtocol
        id: "PROTOCOL:ogino-ahr-001"
        name: "Airway hyperresponsiveness measurement"

  - id: "LF:ogino-ahr-treated-pm25"
    name: "Airway hyperresponsiveness - acid/heat-treated PM2.5"
    description: "AHR in BALB/c mice administered PM2.5 whose bound protein had been hydrolyzed and whose trace elements had been removed by high-temperature strong-acid treatment. AHR was attenuated relative to pure PM2.5, so PM2.5-bound protein and acid-soluble metals are required for the airway hyperresponsiveness. The abstract reports attenuation without a value or p-value."
    evidence:
      - reference: "PMID:30849251"
        reference_title: "Involvement of PM2.5-bound protein and metals in PM2.5-induced allergic airway inflammation in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The treatment of PM2.5 with a strong acid at a high temperature attenuated AHR, eosinophil percentage in BALF, mRNA levels of IL-13 and CXCL3 and peribronchial inflammation."
        explanation: "States directly that the strong-acid, high-temperature treatment — the treatment the abstract elsewhere says hydrolyzes PM2.5-bound protein and removes trace elements — attenuated AHR. That attenuation is what this treated-PM2.5 output record captures."
    has_exposure_condition:
      - id: "EXPOSURE:ogino-treated-pm25"
        name: "Acid- and heat-treated PM2.5 administration (bound protein hydrolyzed, trace elements removed)"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
    has_specified_output:
      - id: "LF:ogino-ahr-treated-pm25-output"
        name: "AHR - treated PM2.5 group"
        experimental_group: treated
        measured_under: "EXPOSURE:ogino-treated-pm25"
    informs_on_key_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    study_subject:
      subject_type: InVivoSubject
      id: "SUBJECT:ogino-mouse-treated-pm25"
      name: "Treated PM2.5 BALB/c mouse"
      model_species:
        id: "NCBITaxon:10090"
        name: "Mus musculus"
      sex: "male"
      disease_state: "PM2.5-induced allergic airway inflammation"
      subject_characteristics: "BALB/c mice. The abstract describes no separate allergen sensitization or challenge step; acid- and heat-treated PM2.5 was administered. Age and body weight are not given in the abstract."
    follows_protocols:
      - protocol_type: SpirometryProtocol
        id: "PROTOCOL:ogino-ahr-001"
        name: "Airway hyperresponsiveness measurement"

