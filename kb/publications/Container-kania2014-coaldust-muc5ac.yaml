# =============================================================================
# Kania et al. (2014) - Subchronic inhalation of coal dust particulate matter 10
# induces bronchoalveolar hyperplasia and decreases MUC5AC expression in male
# Wistar rats
# =============================================================================
#
# Source: Exp Toxicol Pathol. 2014
# DOI: 10.1016/j.etp.2014.06.001
#
# Study design (in vivo):
#   - Male Wistar rats, whole-animal subchronic inhalation of coal dust PM10
#   - Doses: 6.25, 12.5 and 25 mg/m3
#   - Durations: 14 days and 28 days
#   - EGF in rat lung measured by ELISA
#   - EGFR and MUC5AC measured by confocal laser scanning microscopy
#   - Lung histology of bronchoalveolar epithelium and pulmonary parenchyma
#
# Key findings:
#   - 14-d exposure: no significant difference in MUC5AC, EGF or EGFR (p>0.05)
#   - 28-d exposure: no significant difference in EGF or EGFR (p>0.05), but a
#     significant difference in MUC5AC (p<0.05); the paper's conclusion states
#     the direction is a decrease in MUC5AC expression
#   - Histology at 14 and 28 days: epithelial rearrangement, hyperplastic
#     (metaplastic) goblet cells, scattered massive inflammatory cells
#
# EXTRACTION NOTES - read before adding numbers to this file:
#   - The committed reference cache for PMID:24975055 is ABSTRACT ONLY. Every
#     evidence snippet below is quoted verbatim from that abstract.
#   - The abstract reports NO numeric measurement values, no group sizes and no
#     exact p-values - only significance thresholds. Per the extraction rules,
#     measurement slots are therefore omitted rather than guessed, and the
#     output records carry only their experimental group and exposure link.
#   - The abstract's group sentence is internally ambiguous: it calls the
#     14-day arm "control groups exposed to coal dust". It does not describe an
#     unexposed / filtered-air comparator, so none is modelled here and no
#     control output record is invented. The response_comparisons below
#     therefore carry a treated_output but no control_output, and record only
#     the direction the paper states.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:24975055"
  reference_title: "Subchronic inhalation of coal dust particulate matter 10 induces bronchoalveolar hyperplasia and decreases MUC5AC expression in male Wistar rats."
  doi: "10.1016/j.etp.2014.06.001"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:kania-inhalation-001"
    name: "Subchronic coal dust PM10 inhalation exposure"
    description: "Subchronic inhalation exposure of male Wistar rats to coal dust particulate matter 10 at 6.25, 12.5 and 25 mg/m3 for 14 or 28 days. The abstract does not report chamber type, daily exposure hours, particle characterisation or group sizes."
    equipment_required:
      - "Coal dust PM10 inhalation exposure apparatus"

  - id: "PROTOCOL:kania-elisa-001"
    name: "ELISA for EGF in rat lung"
    description: "Epidermal growth factor (EGF) expression in rat lungs measured by enzyme-linked immunosorbent assay. The abstract does not report kit manufacturer, dilutions or standard curve details."
    equipment_required:
      - "ELISA plate reader"

  - id: "PROTOCOL:kania-clsm-001"
    name: "Confocal laser scanning microscopy for EGFR and MUC5AC"
    description: "EGFR and MUC5AC expression measured by a confocal laser scanning microscope on rat lung tissue. The abstract does not report antibodies, dilutions or the quantification method."
    equipment_required:
      - "Confocal laser scanning microscope"

  - id: "PROTOCOL:kania-histology-001"
    name: "Lung histology of bronchoalveolar epithelium and pulmonary parenchyma"
    description: "Histological examination of the bronchoalveolar epithelial and pulmonary parenchymal images of rat lung after 14 and 28 days of coal dust exposure. The abstract does not name the stain used or a scoring scheme."
    equipment_required:
      - "Light microscope"

