        sample_size: 142
        variability:
          variability_type: standard_deviation
          value: "6.74"
          unit:
            id: "UO:0000036"
            name: "year"
      subject_characteristics: "142 healthy male informal e-waste workers (100 recruited at round 1 plus 42 replacements at round 2 after >30% attrition) working as burners, dismantlers, sorters and collectors at the Agbogbloshie scrapyard, rated by Pure Earth among the top ten most contaminated areas on earth. Significantly younger (mean 26.45 ± 6.74 years) than the controls, with lower mean daily income and education (56% had no formal or primary education). Cigarette smoking frequency 32.65% vs 10% in controls (p < 0.001); higher prevalence of self-reported past bronchial asthma than controls. Mostly migrants of the Dagomba tribe from northern Ghana."
      clinical_context: "Longitudinal cohort study with repeated exposure and lung function measurements (four rounds per the Methods; the abstract says three repeated measures) aligned to the dry, rainy and harmattan seasons, Agbogbloshie informal e-waste recycling site, Accra, Ghana, March 2017 to November 2018"
