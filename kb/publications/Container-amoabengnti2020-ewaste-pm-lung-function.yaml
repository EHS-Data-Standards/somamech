        name: "Spirometry outcomes in e-waste workers (per-group numeric means only in supplementary Table S3, not reproduced in the cached full text)"
        description: "Lung function parameters were generally significantly lower among e-waste workers than controls, with the FEV1/FVC ratio significantly lower across the dry, rainy and harmattan seasons (p ≤ 0.001, p = 0.007, p = 0.007); mean FEV1 and FVC were slightly lower without statistical significance. The cached full text reports only pooled ranges across both groups and seasons (FEV1 2.83 ± 0.54 to 3.84 ± 1.02 L; FVC 2.95 ± 0.54 to 3.85 ± 1.23 L) and no per-group numeric means (those are in supplementary Table S3), so no numeric lung function values are recorded here."
        experimental_group: treated
        measured_under: "EXPOSURE:amoabengnti-ewaste-occupational"
