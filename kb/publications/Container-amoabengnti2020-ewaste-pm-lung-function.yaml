# =============================================================================
# Amoabeng Nti et al. (2020) - Effect of Particulate Matter Exposure on
# Respiratory Health of e-Waste Workers at Agbogbloshie, Accra, Ghana
# =============================================================================
#
# Source: Int J Environ Res Public Health. 2020;17(9):3042
# DOI: 10.3390/ijerph17093042
# PMID: 32349371
#
# Study design (HUMAN OBSERVATIONAL — longitudinal occupational cohort, not in
# vitro, not an animal experiment):
#   - Longitudinal cohort study with repeated measures among 207 male
#     participants: 142 healthy informal e-waste workers at the Agbogbloshie
#     scrapyard (Accra, Ghana) and 65 control participants from Madina Zongo,
#     a suburb more than 10 km from the e-waste site, 2017-2018
#   - Internal inconsistency in the source on the number of measurement
#     rounds: the abstract says "three repeated measures" while the Methods
#     describe "four rounds of repeated exposure and health outcome
#     measurements" (March 2017 to November 2018) with three follow-ups after
#     round 1. Recorded as described in the Methods.
#   - Internal inconsistency on control recruitment: the study-area section
#     says 64 male residents of Madina Zongo were selected as the control
#     population, the recruitment section says 51 controls were recruited at
#     round 1 plus 14 replacements at round 2 (= 65), and the abstract says
#     65 control participants. The abstract total (65) is used as the control
#     sample size.
#   - Breathing-zone PM2.5 and PM10 measured with a personal MetOne Aerocet
#     831 particle mass profiler worn in a backpack for a 4-h period of the
#     work shift (2 h during the harmattan season); the coarse fraction
#     (PM2.5-10) was derived as the difference between PM10 and PM2.5
#   - Spirometry (FVC, FEV1, FEV1/FVC, PEF, FEF25-75) with a portable EasyOne
#     spirometer per American Thoracic Society guidelines, expressed as
#     predicted z-scores per the NHANES III equation
#   - Data collection aligned to the dry, rainy and harmattan seasons;
#     effects of PM on lung function estimated with random-effects models
#     with random slope terms, controlling for age, education, job category,
#     height, cigarette smoking status, location and seasonal variation
#
# MODELLING NOTES:
#   - Each participant group is its own assay with its own InVivoSubject (the
#     isara2016/calderon2001 pattern): the e-waste worker and Madina Zongo
#     control cohorts differ in age, education and smoking, so merging them
#     under one study_subject would lose which group a record describes.
#   - PM concentrations: the paper calls these values "median/IQR
#     concentrations" and prints them as "median ± value" (e.g. "69.86 ±
#     36.33"); they are recorded here as central_tendency: median with
#     variability_type: interquartile_range, as printed. Per-fraction,
#     per-season breathing-zone concentrations are modelled as separate
#     ExposureCondition entries on each group's assay; the spirometry output
#     records point at an umbrella occupational/ambient condition because the
#     measurement was made under the whole exposure, not under any single PM
#     fraction (the intpanis2017 pattern).
#   - Suspect prints recorded with caveats rather than silently corrected:
#     e-waste harmattan PM2.5 "70.69 ± 4825" (IQR implausible next to the
#     other seasons' 36.33 and 37.92, possibly 48.25 — median recorded, IQR
#     omitted); control dry-season PM2.5 "34.88 ± 0.14.72" (unparseable —
#     median recorded, IQR omitted); control harmattan PM10 "395.57 ± 412"
#     (recorded as printed; it exceeds the e-waste value and its comparison
#     p = 0.998).
#   - ENVO has no term for the coarse PM fraction (PM2.5-10), so those
#     conditions carry the parent class ENVO:01000405 "respirable suspended
#     particulate matter" with the fraction stated in the condition name;
#     PM10 conditions carry the same parent class.
#   - Per-group spirometry means appear only in supplementary Table S3, which
#     is not reproduced in the cached full text, so the two output records
#     carry no numeric lung function values; the body text reports only
#     pooled ranges ("FEV1 and FVC ranged from ... respectively among e-waste
#     workers and the control group across the three seasons") and group
#     contrasts with p-values, which are carried in descriptions and in
#     response_comparisons.
#   - The regression effect estimates are reported-in-paper coefficients from
#     random-effects models on log-transformed lung function; there is no
#     per-coefficient control/treated output pair for the PM, burner and
#     asthma predictors (the hart2018 pattern), so those comparisons omit
#     control_output/treated_output. change_value carries the paper's percent
#     decrease; the printed beta and 95% CI are kept in the description
#     because the CI is on the log-scale coefficient, not on the percent.
#   - Source inconsistency on the headline PEF/FEF25-75 estimates: the
#     abstract attributes "decreases in PEF and FEF 25-75 by 13.3% % [β =
#     -3.133; 95% CI: -0.243, -0.022) and 26.6% [β = -0.266; 95% CI: -0.437,
#     0.094]" to a 10 µg increase in PM, while the Results body prints the
#     identical betas and CIs as the harmattan-season effect from the
#     confounder analysis (Table S4). Both framings are quoted; the
#     comparisons record the abstract's per-10-µg-PM framing with the
#     discrepancy noted. The printed β = -3.133 for PEF is inconsistent with
#     its own CI (-0.243, -0.022) and with the body's "PEF by 12.5%"/"PEF
#     -13.3%" wording (likely a misprint for -0.133); it is quoted as printed
#     and not corrected.
#   - The paper's primary adjusted result is a null: "PM (2.5, 2.5–10 and 10
#     µm) in personal air was not significantly associated with lung function
#     percentage of predicted at a 95% confidence level". The significant
#     findings are the group contrast in FEV1/FVC, the harmattan/per-10-µg
#     PEF and FEF25-75 decreases, and the burner and asthma-history
#     predictors; descriptions say which is which.
#
# WHAT THE PAPER DOES *NOT* CLAIM:
#   This is an observational association study with no mechanistic
#   intermediate readouts, so no key_event_relationships are recorded: the
#   paper links breathing-zone PM exposure to the adverse outcome (decreased
#   lung function) directly, and its statements about oxidative stress,
#   inflammation and small airway disease are background/discussion, not
#   measured results.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:32349371"
  reference_title: "Effect of Particulate Matter Exposure on Respiratory Health of e-Waste Workers at Agbogbloshie, Accra, Ghana."
  doi: "10.3390/ijerph17093042"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:amoabengnti-spirometry-001"
    name: "Portable EasyOne spirometry per American Thoracic Society guidelines, NHANES III z-scores"
    description: "Lung function tests performed with a portable EasyOne spirometer (ndd Medical Technologies, Andover, MA) by a qualified technician and physician according to American Thoracic Society (ATS) guidelines. FVC, FEV1, FEV1/FVC, PEF and FEF25-75 were measured in the standing position. A minimum of three acceptable FVC manoeuvres were performed, up to a maximum of six when reproducibility criteria were not met; end-of-test criterion of at least 2 seconds of no change in volume with an exhalation time of at least 6 seconds; reproducibility criterion of less than 5% variation or 0.1 L difference of the largest FVC and FEV1. The largest FVC and FEV1 from acceptable curves were recorded. All lung function data were expressed as predicted z-scores of the normal values according to the NHANES III equation, with ethnically appropriate reference values (Hankinson, Odencrantz, & Fedan, 1999). An abnormal test was defined as less than 80% or greater than 120% of predicted for FVC and FEV1 and <70% for FEV1/FVC."
    spirometry_standard: "American Thoracic Society (ATS) guidelines"
    equipment_required:
      - "EasyOne portable spirometer (ndd Medical Technologies, Andover, MA)"

  - id: "PROTOCOL:amoabengnti-pm-sampling-001"
    name: "Personal breathing-zone PM sampling with MetOne Aerocet 831 particle mass profiler"
    description: "PM in the breathing zone of participants was measured using a MetOne Aerocet 831 particle mass profiler (MetOne Instruments Incorporated, Grants Pass, OR, USA), which simultaneously measured PM2.5 and PM10 levels per minute at a flow rate of 2.8 L/min. The battery-operated sampler was incorporated into a backpack worn by participants while performing their routine work tasks. Sampling was done for a 4-h period of the work shift, except during the harmattan season when PM collection was done for 2 h because the Aerocet pump got overloaded quickly. The coarse fraction (PM2.5-10) was derived by estimating the difference between the PM2.5 and PM10 concentrations. Readings were recorded at the beginning of each deployment and at retrieval."
    equipment_required:
      - "MetOne Aerocet 831 particle mass profiler (MetOne Instruments Incorporated, Grants Pass, OR, USA)"

  - id: "PROTOCOL:amoabengnti-questionnaire-001"
    name: "Comprehensive respiratory health questionnaire"
    description: "Comprehensive respiratory health questionnaire administered by trained interviewers in the participant's preferred language (Dagbani, Hausa, Twi or English), collecting demographics (age, gender, religion, ethnicity, education, measures of socioeconomic position, location of birth, childhood and all residences), previous work and home inhalational exposures (including indoor cooking and biomass fuel use), personal and family medical history, and lifestyle habits including cigarette smoking (age at initiation, duration, sticks per day; current, ex- or never-smoker, with cessation greater than a month defining ex-smokers) and alcohol use. Limited interview guides at follow-up rounds explored changes in home and work exposures and other respiratory conditions."

# =============================================================================
# LUNG FUNCTION ASSAYS — spirometry per participant group. The e-waste
# workers at Agbogbloshie are the exposed group; the Madina Zongo residents
# are the control group. Breathing-zone PM concentrations per fraction and
# season are recorded as exposure conditions on each group's assay.
# =============================================================================

lung_function_assays:
  - id: "LF:amoabengnti-ewaste-spirometry"
    name: "Spirometry - informal e-waste workers at Agbogbloshie (PM-exposed group)"
    description: "Repeated spirometry (FVC, FEV1, FEV1/FVC, PEF, FEF25-75; EasyOne, ATS guidelines, NHANES III z-scores) in 142 healthy male informal e-waste workers at the Agbogbloshie scrapyard across the dry, rainy and harmattan seasons, 2017-2018, with per-round breathing-zone PM (2.5, 2.5-10 and 10 µm) measurement. Lung function parameters were generally significantly lower among e-waste workers than controls; the FEV1/FVC ratio was lower among the e-waste workers across the dry, rainy and harmattan seasons (p ≤ 0.001, p = 0.007 and p = 0.007). Mean FEV1 and FVC were slightly lower than controls without reaching statistical significance; the body text gives only pooled ranges (FEV1 2.83 ± 0.54 to 3.84 ± 1.02 L; FVC 2.95 ± 0.54 to 3.85 ± 1.23 L across both groups and the three seasons) and per-group means appear only in supplementary Table S3, which is not reproduced in the cached full text, so no numeric lung function values are recorded on the output. Breathing-zone PM2.5 was 2-3x higher than in the control group and the highest PM concentrations were consistently observed among e-waste burners compared to non-burners (dismantlers, sorters and collectors). Adjusted random-effects models found PM in personal air not significantly associated with lung function percent of predicted at the 95% confidence level; the reported significant effects (per-10-µg PM / harmattan-season decreases in PEF and FEF25-75, burner job category, asthma history) are recorded in response_comparisons. Cigarette smoking was more frequent among e-waste workers (32.65% vs 10%, p < 0.001)."
