# =============================================================================
# RESPONSE COMPARISONS
#
# MODELLING NOTE: the first comparison is the two-group FEV1/FVC contrast and
# references the two output records; the paper reports only seasonal p-values
# for it, never a difference value, so change_value is omitted (the rule:
# never calculate a delta). The remaining comparisons are reported-in-paper
# effect estimates from random-effects models on log-transformed lung
# function (predictors: PM per 10 µg increase, burner job category, past
# asthma history); no control/treated output pair exists for a regression
# coefficient, so control_output/treated_output are omitted (the hart2018
# pattern). change_value carries the paper's percent decrease; the printed
# beta and 95% CI stay in the description because the CI is on the log-scale
# coefficient, not on the percent. Exact p-values are not reported for the
# regression estimates, so p_value is omitted throughout except where a
# group-contrast p is exact.
# =============================================================================

response_comparisons:
  - id: "COMP:amoabengnti-fev1fvc-ewaste-vs-control"
    name: "FEV1/FVC ratio in e-waste workers vs Madina Zongo controls"
    description: "The FEV1/FVC ratio was lower among the e-waste workers than the control group across the dry, rainy and harmattan seasons (p ≤ 0.001, p = 0.007 and p = 0.007 respectively). The paper reports no difference value, so change_value is omitted; p_value is omitted because the three seasonal p-values cannot be carried in one float slot (the two exact values are 0.007). The control output lives on the Madina Zongo assay."
    derived_from_assay: "LF:amoabengnti-ewaste-spirometry"
    compared_measurement: "fev1_fvc_ratio"
    control_output: "LF:amoabengnti-control-spirometry-output-control"
    treated_output: "LF:amoabengnti-ewaste-spirometry-output-exposed"
    change_type: absolute_difference
    change_direction: decreased
    statistical_test: "bivariate analysis (Student's t-test / Chi-square / Spearman's rank correlation per the Methods)"
    derivation: reported_in_paper

  - id: "COMP:amoabengnti-pm-pef"
    name: "Decrease in PEF per 10 µg increase in breathing-zone PM"
    description: "The abstract reports that a 10 µg increase in PM (2.5, 2.5-10 and 10 µm) was associated with a 13.3% decrease in PEF, printed as 'β = -3.133; 95% CI: -0.243, -0.022'. The printed β is inconsistent with its own CI and with the Results body (which gives 'PEF by 12.5%' for the rainy season and 'PEF −13.3%' for the harmattan season with the identical β and CI), and is likely a misprint for -0.133; it is quoted as printed and not corrected. The Results body attributes these same numbers to the harmattan season in the confounder analysis ('Harmattan season showed significant influence especially on PEF and FEF 25–75'), a source inconsistency recorded here rather than resolved. The CI excludes zero (the paper's only PM-effect CI to do so). Lung function was modelled as log-transformed predicted z-scores, so the beta is on the log scale and the CI is not in percent units; change_value carries the paper's percent figure without variability."
    derived_from_assay: "LF:amoabengnti-ewaste-spirometry"
    compared_measurement: "peak_expiratory_flow"
    change_type: percent_change
    change_direction: decreased
    change_value:
      value: "-13.3"
      unit:
        id: "UO:0000187"
        name: "percent"
    statistical_test: "random-effects model with random slope effects terms, adjusted for age, education, job category, height, cigarette smoking status, location and seasonal variation"
    derivation: reported_in_paper

  - id: "COMP:amoabengnti-pm-fef2575"
    name: "Decrease in FEF25-75 per 10 µg increase in breathing-zone PM"
    description: "The abstract reports that a 10 µg increase in PM (2.5, 2.5-10 and 10 µm) was associated with a 26.6% decrease in FEF 25-75, printed as 'β = -0.266; 95% CI: -0.437, 0.094' (the CI as printed spans zero; the Results body prints the identical numbers as the harmattan-season effect — the same source inconsistency as the PEF estimate). The beta is on the log scale (predicted z-scores), so change_value carries the paper's percent figure without variability."
    derived_from_assay: "LF:amoabengnti-ewaste-spirometry"
    compared_measurement: "fef25_75"
    change_type: percent_change
    change_direction: decreased
    change_value:
      value: "-26.6"
      unit:
        id: "UO:0000187"
        name: "percent"
    statistical_test: "random-effects model with random slope effects terms, adjusted for age, education, job category, height, cigarette smoking status, location and seasonal variation"
    derivation: reported_in_paper

  - id: "COMP:amoabengnti-burner-pef"
    name: "Decrease in PEF predicted by e-waste burner job category"
    description: "Work as an e-waste burner predicted a 14.2% decrease in PEF (β = −0.142; 95% CI: −0.278, −0.008 — excludes zero). Burners showed the highest decreases in lung function parameters of all job categories and consistently carried the highest breathing-zone PM concentrations across the seasons. Beta on the log scale (predicted z-scores); change_value carries the percent figure without variability."
    derived_from_assay: "LF:amoabengnti-ewaste-spirometry"
    compared_measurement: "peak_expiratory_flow"
    change_type: percent_change
    change_direction: decreased
    change_value:
      value: "-14.2"
      unit:
        id: "UO:0000187"
        name: "percent"
    statistical_test: "random-effects model with random slope effects terms (confounder analysis, Table S4)"
    derivation: reported_in_paper

  - id: "COMP:amoabengnti-burner-fef2575"
    name: "Decrease in FEF25-75 predicted by e-waste burner job category"
    description: "Work as an e-waste burner predicted a 22.5% decrease in FEF25-75 (β = −0.225; 95% CI: −0.451–0.001, printed with an en-dash range; the upper bound as printed is 0.001, so the CI marginally spans zero). The same sentence reports burner-predicted decreases in FEV1 of 4.5% (β = −0.045; 95% CI: −0.151–0.061) and FEV1/FVC of 6.0% (β = −0.060; 95% CI: −0.123–0.004), both with CIs spanning zero; they are carried here in prose rather than as separate comparisons. Beta on the log scale (predicted z-scores); change_value carries the percent figure without variability."
    derived_from_assay: "LF:amoabengnti-ewaste-spirometry"
    compared_measurement: "fef25_75"
    change_type: percent_change
    change_direction: decreased
    change_value:
      value: "-22.5"
      unit:
        id: "UO:0000187"
        name: "percent"
    statistical_test: "random-effects model with random slope effects terms (confounder analysis, Table S4)"
    derivation: reported_in_paper

  - id: "COMP:amoabengnti-asthma-fev1"
    name: "Decrease in FEV1 predicted by past history of asthma"
    description: "Participants with a previous history of asthma were predicted to have a 35.8% decrease in FEV1 (β = −0.358; 95% CI: −0.590, 0.125 as printed in the Results body; the abstract prints the same estimate as '-0.358; 95% CI: -0.590, 0.125' and calls it significant although the printed CI spans zero — recorded as printed). Asthma history is a subject characteristic, not an exposure; the comparison is kept because the paper reports it as a significant predictor of the lung function outcome alongside e-waste burning. Beta on the log scale (predicted z-scores); change_value carries the percent figure without variability."
