  - id: "LF:amoabengnti-control-spirometry"
    name: "Spirometry - Madina Zongo residents (control group)"
    description: "Repeated spirometry (same EasyOne/ATS protocol) in 65 male control participants from Madina Zongo, a suburb of Accra more than 10 km from the Agbogbloshie e-waste site, selected for similarity in ethnicity and religion to the e-waste workers. The paper is internally inconsistent on control recruitment (64 selected in the study-area section; 51 recruited at round 1 plus 14 replacements; 65 in the abstract — the abstract total is used as sample size). Controls were older (mean 30.97 ± 9.92 years), better educated (61% attained high school education) and smoked less (10% vs 32.65%, p < 0.001) than the e-waste workers. Control breathing-zone PM concentrations, though 2-3x lower than the e-waste workers' for PM2.5, still exceeded the WHO air quality standards across the seasons; their seasonal medians are recorded on this assay's exposure conditions. Mean FEV1 and FVC were slightly higher than the e-waste workers' (not statistically significant) and the FEV1/FVC ratio was significantly higher; PEF and FEV1/FVC showed greater variability among Madina Zongo participants than at Agbogbloshie."
    evidence:
      - reference: "PMID:32349371"
        reference_title: "Effect of Particulate Matter Exposure on Respiratory Health of e-Waste Workers at Agbogbloshie, Accra, Ghana."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Sixty-four (n = 64) male residents from Madina Zongo, a suburb of Accra in the La Nkwantanang sub-metropolitan district located more than 10 km from the Agbogbloshie e-waste site were selected as the control population."
        explanation: "Documents the control population and its distance from the exposure site; the count here (64) differs from the abstract's 65 (source inconsistency recorded in the header and description)."
      - reference: "PMID:32349371"
        reference_title: "Effect of Particulate Matter Exposure on Respiratory Health of e-Waste Workers at Agbogbloshie, Accra, Ghana."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Madina Zongo was selected as a control population because of similarities in ethnicity and religion, as similar to e-waste workers at Agbogbloshie, majority are of the Dagomba tribe who migrated from northern Ghana, as well as being Muslims"
        explanation: "Documents why this group serves as the comparison population for the e-waste workers."
      - reference: "PMID:32349371"
        reference_title: "Effect of Particulate Matter Exposure on Respiratory Health of e-Waste Workers at Agbogbloshie, Accra, Ghana."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "This continued until a total of one hundred (100) male e- waste workers and fifty-one (51) male controls from Madina-Zongo were recruited."
        explanation: "States the round-1 recruitment counts (quoted exactly as printed, including the spacing in 'e- waste'); with the 14 control replacements added at round 2 this yields the 65 controls used as this assay's sample size."
      - reference: "PMID:32349371"
        reference_title: "Effect of Particulate Matter Exposure on Respiratory Health of e-Waste Workers at Agbogbloshie, Accra, Ghana."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "In comparison, the concentrations for the control population were 34.88 ± 0.14.72, 34.13 ± 7.22 and 50.21 ± 169.64 across the three seasons respectively (p < 0.001, p < 0.001 and p = 0.950)"
        explanation: "States the control group's seasonal median PM2.5 concentrations recorded on this assay's PM2.5 exposure conditions; the dry-season '± 0.14.72' is unparseable as printed, so that condition carries the median only."
      - reference: "PMID:32349371"
        reference_title: "Effect of Particulate Matter Exposure on Respiratory Health of e-Waste Workers at Agbogbloshie, Accra, Ghana."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "118.12 ± 79.99 μg/m3/p ≤ 0.001, 99.35 ± 107.1 μg/m3/p ≤ 0.001 and 395.57 ± 412/p = 0.998"
        explanation: "The control group's seasonal median PM10 concentrations (dry, rainy, harmattan), quoted without the enclosing square brackets; the harmattan value exceeds the e-waste workers' and its comparison p = 0.998, recorded as printed."
      - reference: "PMID:32349371"
        reference_title: "Effect of Particulate Matter Exposure on Respiratory Health of e-Waste Workers at Agbogbloshie, Accra, Ghana."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Generally, e-waste workers were younger (26.45 ± 6.74) compared to the controls (30.97 ± 9.92)"
        explanation: "States the control group's mean age and SD recorded on this assay's study_subject."
      - reference: "PMID:32349371"
        reference_title: "Effect of Particulate Matter Exposure on Respiratory Health of e-Waste Workers at Agbogbloshie, Accra, Ghana."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Conversely, PEF and FEV1/FVC showed greater variability for Madina- Zongo participants compared to Agbogbloshie."
        explanation: "Supports the description's statement about the control group's lung function variability (quoted exactly as printed, including the spacing in 'Madina- Zongo')."
