# =============================================================================
# Curjuric et al. (2012) - Different Genes Interact with Particulate Matter and
# Tobacco Smoke Exposure in Affecting Lung Function Decline in the General
# Population
# =============================================================================
#
# Source: PLoS One 2012;7(7):e40175
# DOI: 10.1371/journal.pone.0040175
#
# Study design:
#   - Human population cohort (SAPALDIA, Switzerland), non-asthmatic adults
#   - Longitudinal: spirometry in 1991 (baseline) and 2002 (follow-up), 11 years
#   - Discovery sample: up to 669 adults with genome-wide data (n = 650 with
#     complete data on all three lung function parameters)
#   - Replication sample: 3320 SAPALDIA participants without GWAS data
#   - Exposures: interval PM10 (modelled home outdoor exposure, summed over
#     follow-up, (ug/m3)*years; IQR 83.4) and packyears smoked (IQR 9.8)
#   - Outcomes: decline in FEV1, FEV1/FVC and FEF25-75 between 1991 and 2002
#   - Analysis: SNP x exposure interaction terms for 12679 SNPs in 152
#     oxidative-stress genes / 14 pathways, gene- and pathway-level p-values
#     by the adaptive rank truncation product (ARTP) method
#
# Key findings extracted here:
#   - rs2035268 (SNCA) x PM10: 3.8% accelerated FEV1/FVC decline per G-allele
#   - rs12190800 (PARK2) x PM10: 95.1 ml attenuated FEV1 decline per C-allele
#   - CRISP2 x PM10 on FEV1/FVC decline significant after Bonferroni correction
#   - Genotype-specific PM10 effect at rs2035268 (GT/GG vs TT)
#   - Packyears main effect on FEV1/FVC and FEV1 decline
#   - Replication of the two strongest SNP interactions was not successful
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:22792237"
  reference_title: "Different genes interact with particulate matter and tobacco smoke exposure in affecting lung function decline in the general population."
  doi: "10.1371/journal.pone.0040175"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:curjuric-spirometry-001"
    protocol_type: SpirometryProtocol
    name: "SAPALDIA spirometry 1991 and 2002"
    description: "Spirometry without bronchodilation, identical protocols and devices at baseline (1991) and follow-up (2002). Participants sat upright and performed three to eight forced expiratory maneuvers according to American Thoracic Society quality criteria; at least two acceptable FVC and FEV1 measurements were obtained, and FEF25-75 was recorded."
    spirometry_standard: "American Thoracic Society quality criteria"
    equipment_required:
      - "Sensormedics model 2200 spirometer (Yorba Linda, USA)"
    quality_control_criteria: "At least two acceptable measurements of forced vital capacity (FVC) and forced expiratory volume in the first second (FEV1)"

  - id: "PROTOCOL:curjuric-artp-001"
    protocol_type: Protocol
    name: "SNP-, gene- and pathway-level gene-environment interaction analysis (ARTP)"
    description: "Multiple linear regression per gene in ProbABEL v0.1.3 with robust sandwich-estimation of standard errors, specifying an additive SNP effect, main effects for packyears smoked and interval PM10 exposure, and an interaction term between the SNP variable and either exposure; adjusted for sex, age and height at follow-up, packyears smoked up to baseline, principal components of population ancestry, and study area. Gene- and pathway-level interaction p-values were derived with a modified adaptive rank truncation product (ARTP) method over 10000 permutations."
    equipment_required:
      - "ProbABEL v0.1.3"
      - "Illumina Human 610quad BeadChip (GABRIEL genotyping)"
      - "MACH v1.0 imputation against the HapMap v22 CEPH reference panel"
    quality_control_criteria: "Samples with <97% genotyping success rate, non-European origin, cryptic relatedness or sex-inconsistencies excluded; SNPs excluded for Hardy-Weinberg p<1e-4, call rate <97%, MAF <5% or imputation Rsq <0.5"

# =============================================================================
# LUNG FUNCTION ASSAYS
# (human cohort spirometry; each assay records one gene-environment
#  interaction or main-effect estimate on lung function decline)
# =============================================================================

lung_function_assays:

  # ---------------------------------------------------------------------------
  # 1. SNCA rs2035268 x interval PM10 on FEV1/FVC decline (SNP level)
  # ---------------------------------------------------------------------------
  - id: "LF:curjuric-snca-pm10-fev1fvc"
    name: "FEV1/FVC decline, rs2035268 (SNCA) x interval PM10 interaction"
    description: "SNP-level interaction surviving Bonferroni correction for 12679 SNPs (alpha = 3.9e-6). Each G-allele of rs2035268 in SNCA was associated with a 3.8% (95%-CI 2.2 to 5.4%) higher FEV1/FVC decline per interquartile range of interval PM10 exposure (83.4 ug/m3*years) over 11 years; p interaction = 2.5e-6. Effect allele frequency 0.05 (imputed SNP, chromosome 4q21). Analysis sample n = 650."
    has_specified_output:
      id: "LF:curjuric-snca-pm10-fev1fvc-output"
      name: "FEV1/FVC decline per G-allele per IQR PM10 over 11 years"
      fev1_fvc_ratio:
        value: "3.8"
        unit:
          id: "UO:0000187"
          name: "percent"
    assay_date: "2002-01-01"
    has_exposure_condition:
      - id: "EXPOSURE:curjuric-pm10-iqr"
        name: "Interval PM10 exposure, one interquartile range (83.4 ug/m3*years)"
        exposure_agent:
          id: "ENVO:01000405"
          name: "respirable suspended particulate matter"
        exposure_concentration:
          value: "83.4"
          unit:
            id: "UCUM:ug/m3.a"
            name: "microgram per cubic meter times year"
        exposure_duration:
          value: "11"
          unit:
            id: "UO:0000036"
            name: "year"
    informs_on_key_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    study_subject:
      subject_type: InVivoSubject
      id: "SUBJECT:curjuric-sapaldia-gwas"
      name: "SAPALDIA non-asthmatic adults with genome-wide data"
      model_species:
        id: "NCBITaxon:9606"
        name: "Homo sapiens"
      subject_characteristics: "Up to 669 non-asthmatic SAPALDIA participants with genome-wide data passing quality control and complete data on sex, age, height, PM10 and smoking exposure; n = 650 with complete data on all three lung function parameters; European ancestry; aged 18-60 years at baseline (1991)"
      clinical_context: "Population-based Swiss cohort; spirometry at baseline (1991) and follow-up (2002), 11 years of follow-up"
    follows_protocols:
      - protocol_type: SpirometryProtocol
        id: "PROTOCOL:curjuric-spirometry-001"
        name: "SAPALDIA spirometry 1991 and 2002"
        spirometry_standard: "American Thoracic Society quality criteria"
      - protocol_type: Protocol
        id: "PROTOCOL:curjuric-artp-001"
        name: "SNP-, gene- and pathway-level gene-environment interaction analysis (ARTP)"
    evidence:
      - reference: "PMID:22792237"
        reference_title: "Different genes interact with particulate matter and tobacco smoke exposure in affecting lung function decline in the general population."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "rs2035268 in gene SNCA accelerated FEV(1)/FVC decline by 3.8% (p(interaction) = 2.5×10(-6))"
        explanation: "States the interaction effect size (3.8% accelerated FEV1/FVC decline) and interaction p-value recorded by this assay."
      - reference: "PMID:22792237"
        reference_title: "Different genes interact with particulate matter and tobacco smoke exposure in affecting lung function decline in the general population."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Compared to the baseline TT genotype, each G-allele was associated with a 3.8% (95% confidence interval (95%-CI) 2.2 to 5.4%) higher decline per 83.4 mg/m3*year PM10 exposure (IQR) over 11 years."
        explanation: "Gives the per-allele effect, its confidence interval, the PM10 interquartile-range exposure contrast (83.4 units) and the 11-year follow-up recorded in the exposure condition."

