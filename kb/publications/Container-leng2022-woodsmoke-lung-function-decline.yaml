# =============================================================================
# RESPONSE COMPARISONS — the paper's reported LME coefficients for ever wood
# smoke exposure.
#
# MODELLING NOTE: every value here is a multivariable-adjusted linear mixed
# effects regression coefficient printed in the paper (Table 2 unless stated
# otherwise), not a difference between the output records' unadjusted group
# means. Two kinds appear:
#   - DECLINE comparisons carry the WS exposure x time-in-cohort INTERACTION
#     coefficient: the difference in annual slope between the groups. The
#     never-exposed group's own FEV1 slope is recorded as decline_rate on the
#     control output.
#   - BASELINE comparisons carry the WS exposure MAIN effect: the difference
#     in the modelled intercept, i.e. baseline lung function.
#
# HOW compared_measurement IS SET, AND WHY IT IS NOT UNIFORM. The schema's only
# slope slot, decline_rate, is FEV1-specific ("longitudinal decline rate in
# mL/year"), so only the FEV1 decline comparisons can point at it
# (COMP:leng-ws-fev1-decline, -decline-older, -decline-younger,
# -decline-age-interaction, -decline-excl-lung-cancer). The FVC and FEV1/FVC
# ratio decline comparisons have no slope slot to name, so they point at the
# measurand slot (fvc, fev1_fvc_ratio) that their baseline siblings also use.
# That is deliberate, not an oversight, and it does NOT collapse the two kinds
# together: within each measurand the slope and the intercept stay
# machine-distinguishable by the unit on change_value, because a slope carries
# a per-year unit and an intercept does not --
#   FVC:       decline UCUM:mL/a   vs  baseline UCUM:mL
#   FEV1/FVC:  decline UCUM:%/a    vs  baseline UO:0000187 (percent)
#   FEV1:      decline UCUM:mL/s/a vs  baseline UCUM:mL/s
# A consumer that needs to separate slopes from intercepts should therefore key
# on the unit, not on compared_measurement alone.
#
# control_output and treated_output reference the two group output records
# throughout, because this study does have a genuine two-group contrast; what
# they do NOT mean is that change_value equals the difference between the
# values stored on those records. Models adjusted for baseline age, smoking
# status, packyears, BMI, height, sex and ethnicity, with random intercept and
# slope per subject. Where the paper prints "P < 0.0001" the float-ranged
# p_value slot is omitted and the bound stated in the description.
# =============================================================================

response_comparisons:
  - id: "COMP:leng-ws-fev1-decline"
    name: "Difference in annual FEV1 decline between ever and never wood smoke-exposed subjects (all subjects)"
    description: "The headline result: ever WS exposure was associated with an additional FEV1 decline of 4.3 ml/s per year (SE 1.9, P = 0.025) on top of the -24.2 ml/s per year seen without WS exposure. This is the WS exposure x time-in-cohort interaction coefficient from the LME model over all 2372 subjects, not a difference between the two groups' baseline means. Table 3 shows the estimate is robust to further adjustment: -4.1 (1.9) adding current smoking x years, -4.3 (1.9) adding airway obstruction x years, -4.0 (1.9) adding CMH x years, and -3.7 (1.9) with all three (P = 0.050), i.e. less than a 15% reduction in magnitude. SLOT NOTE: compared_measurement names decline_rate, but the treated_output referenced here deliberately carries no decline_rate value - the paper prints only this slope DIFFERENCE for the exposed group, never that group's own slope, and computing one is out of scope. The control_output does carry decline_rate (-24.2 ml/s per year), which is the slope this difference is relative to. See the section note above and the header's modelling notes."
    derived_from_assay: "LF:leng-ws-exposed-spirometry"
    compared_measurement: "decline_rate"
    control_output: "LF:leng-ws-never-spirometry-output-control"
    treated_output: "LF:leng-ws-exposed-spirometry-output-exposed"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-4.3"
      unit:
        id: "UCUM:mL/s/a"
        name: "milliliter per second per year"
      variability:
        variability_type: standard_error
        value: "1.9"
        unit:
          id: "UCUM:mL/s/a"
          name: "milliliter per second per year"
    p_value: 0.025
    statistical_test: "linear mixed effects model with subject-specific random intercept and slope; coefficient of the ever WS exposure x time-in-cohort interaction, adjusted for baseline age, smoking status, packyears, BMI, height, sex and ethnicity"
    derivation: reported_in_paper

  - id: "COMP:leng-ws-ratio-decline"
    name: "Difference in annual FEV1/FVC ratio decline between ever and never wood smoke-exposed subjects (all subjects)"
    description: "Ever WS exposure was associated with an additional FEV1/FVC ratio decline of 0.093 percentage points per year (SE 0.038, P = 0.015) on top of the -0.386%/year (SE 0.019, P < 0.0001) reference slope. WS exposure x time-in-cohort interaction coefficient from the LME model over all 2372 subjects. Robust to further adjustment (Table 3): -0.088 (0.038) adding current smoking x years, -0.094 (0.039) adding airway obstruction x years, -0.088 (0.038) adding CMH x years, -0.080 (0.037) with all three (P = 0.034)."
    derived_from_assay: "LF:leng-ws-exposed-spirometry"
    compared_measurement: "fev1_fvc_ratio"
    control_output: "LF:leng-ws-never-spirometry-output-control"
    treated_output: "LF:leng-ws-exposed-spirometry-output-exposed"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-0.093"
      unit:
        id: "UCUM:%/a"
        name: "percent per year"
      variability:
        variability_type: standard_error
        value: "0.038"
        unit:
          id: "UCUM:%/a"
          name: "percent per year"
    p_value: 0.015
    statistical_test: "linear mixed effects model with subject-specific random intercept and slope; coefficient of the ever WS exposure x time-in-cohort interaction, adjusted for baseline age, smoking status, packyears, BMI, height, sex and ethnicity"
    derivation: reported_in_paper

  - id: "COMP:leng-ws-fvc-decline"
    name: "Difference in annual FVC decline between ever and never wood smoke-exposed subjects (all subjects) - null"
    description: "A NULL result, and the basis of the paper's central inference. Ever WS exposure was not associated with a steeper FVC decline: -2.4 ml/year (SE 2.4, P = 0.30) against a reference slope of -15.0 ml/year (SE 1.2, P < 0.0001). Because FEV1 and FEV1/FVC ratio declined faster while FVC did not, the authors conclude WS exposure drives an OBSTRUCTIVE pattern of lung function loss, consistent with COPD development rather than a restrictive process. Recorded with change_direction decreased because the point estimate is negative, but the confidence in a real difference is low."
    derived_from_assay: "LF:leng-ws-exposed-spirometry"
    compared_measurement: "fvc"
    control_output: "LF:leng-ws-never-spirometry-output-control"
    treated_output: "LF:leng-ws-exposed-spirometry-output-exposed"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-2.4"
      unit:
        id: "UCUM:mL/a"
        name: "milliliter per year"
      variability:
        variability_type: standard_error
        value: "2.4"
        unit:
          id: "UCUM:mL/a"
          name: "milliliter per year"
    p_value: 0.30
    statistical_test: "linear mixed effects model with subject-specific random intercept and slope; coefficient of the ever WS exposure x time-in-cohort interaction, adjusted for baseline age, smoking status, packyears, BMI, height, sex and ethnicity"
    derivation: reported_in_paper

  - id: "COMP:leng-ws-fev1-baseline"
    name: "Difference in baseline FEV1 between ever and never wood smoke-exposed subjects"
    description: "Ever WS exposure was associated with a 75.2 ml/s lower baseline FEV1 (SE 23.7, P = 0.0016) - the WS exposure MAIN effect in the LME model, i.e. the adjusted intercept difference. Note the contrast with the unadjusted group means on the output records (2.54 vs 2.59 L/s, P = 0.21): adjustment for age, smoking, BMI, height, sex and ethnicity reveals a deficit the crude comparison does not. The authors note this baseline effect was independent of age at study entry, and suggest early-life WS exposure may blunt lung development and the maximal attainable lung function in addition to accelerating later decline."
    derived_from_assay: "LF:leng-ws-exposed-spirometry"
    compared_measurement: "fev1"
    control_output: "LF:leng-ws-never-spirometry-output-control"
    treated_output: "LF:leng-ws-exposed-spirometry-output-exposed"
    change_type: absolute_difference
    change_direction: decreased
    change_value:
      value: "-75.2"
      unit:
        id: "UCUM:mL/s"
        name: "milliliter per second"
      variability:
        variability_type: standard_error
        value: "23.7"
        unit:
          id: "UCUM:mL/s"
          name: "milliliter per second"
    p_value: 0.0016
    statistical_test: "linear mixed effects model with subject-specific random intercept and slope; main effect of ever WS exposure, adjusted for baseline age, smoking status, packyears, BMI, height, sex and ethnicity"
    derivation: reported_in_paper

  - id: "COMP:leng-ws-ratio-baseline"
    name: "Difference in baseline FEV1/FVC ratio between ever and never wood smoke-exposed subjects"
    description: "Ever WS exposure was associated with a 1.792 percentage point lower baseline FEV1/FVC ratio (SE 0.430, P < 0.0001 - below the float p_value slot's reach, so the bound is stated here rather than recorded). WS exposure main effect in the LME model. UNIT NOTE: the value is a difference in percentage POINTS, recorded with UO:0000187 \"percent\" because SOMA has no percentage-point unit; the same reading applies to the other ratio coefficients in this file. As with baseline FEV1, this adjusted deficit is larger and far more significant than the unadjusted group comparison on the output records (72.3 vs 73.4%, P = 0.024), and the authors note it held regardless of age group."
