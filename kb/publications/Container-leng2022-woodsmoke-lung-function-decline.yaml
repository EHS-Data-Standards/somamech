# =============================================================================
# Leng et al. (2022) - Wood smoke exposure affects lung aging, quality of life,
# and all-cause mortality in New Mexican smokers
# =============================================================================
#
# Source: Respir Res. 2022;23:236
# DOI: 10.1186/s12931-022-02162-y
# PMID: 36076291
#
# Study design (HUMAN OBSERVATIONAL — a longitudinal community cohort; not in
# vitro, not an animal experiment):
#   - The Lovelace Smokers Cohort (LSC), established in 2001 in the greater
#     Albuquerque area of New Mexico, USA. Members were 40-75 years of age,
#     former or current smokers with at least 10 pack-years, free of prior
#     lung cancer, and able to understand English.
#   - Analyses here used 2372 LSC subjects with at least one post-bronchodilator
#     spirometry and no missing wood smoke (WS) exposure or covariate data:
#     684 reporting ever WS exposure for over a year and 1688 reporting none.
#   - Members returned roughly every 18 months for spirometry (pre- and
#     post-bronchodilator, 1994 American Thoracic Society guidelines) and
#     questionnaires; active on-site follow-up ended in summer 2017, after
#     which lung cancer incidence and deaths were collected annually. 11,328
#     person-visits of spirometry were collected across 2511 unique subjects.
#   - Lung function decline was estimated with linear mixed effects (LME)
#     models carrying a WS-exposure x time-in-cohort interaction term.
#
# IMPORTANT — WHAT THE EXPOSURE CONTRAST ACTUALLY IS:
#   Exposure is a single self-reported binary question ("Have you been exposed
#   to wood smoke for 12 months or longer"), asked once at study entry. There
#   is no dosimetry, no concentration, and no timing: the authors state plainly
#   that "this binary exposure assessment does not allow us to detect
#   dose-response relationship". So the exposure condition below carries an
#   agent (ENVO:01000838 "smoke") and no concentration, and group membership is
#   the whole of the exposure characterisation — the isara2016 pattern.
#
# MODELLING NOTES:
#   - Two assays, one per exposure group (the isara2016 / calderon2001
#     pattern): the ever-exposed and never-exposed groups differ in age,
#     ethnicity, smoking status and follow-up length, so merging them under one
#     study_subject would lose which group a record describes. Each assay's
#     output record carries that group's baseline spirometry (Table 1), and the
#     response_comparisons point at the pair.
#   - The output records' spirometry values are UNADJUSTED baseline group means
#     from Table 1. Every value in response_comparisons is instead an ADJUSTED
#     LME or Cox coefficient (Tables 2, 3 and 5). The two are not
#     interchangeable, and the comparisons' change_values are therefore NOT
#     the differences between the output records' means.
#   - decline_rate is recorded only on the never-exposed (control) output. It
#     is the LME main effect of time in cohort (Table 2, "Years" column), which
#     in a model carrying a WS x time interaction is the modelled annual slope
#     for subjects WITHOUT WS exposure. The paper never prints the exposed
#     group's own slope — only the slope DIFFERENCE (the interaction
#     coefficient, recorded as COMP:leng-ws-fev1-decline) — so no decline_rate
#     is recorded on the exposed output rather than computing one.
#   - Variability is recorded as standard_error for every model coefficient:
#     Tables 2, 3 and 4 print "estimate (SE)", and Table 1 prints "mean +/- SD".
#     Neither was converted into the other.
#   - P values below 0.0001 cannot be expressed in the float-ranged p_value
#     slot; those comparisons omit p_value and state "P < 0.0001" in their
#     description.
#   - INTERNAL DISCREPANCY IN THE SOURCE: the same basic-model coefficients
#     appear in both Table 2 and Table 3 with slightly different rounding.
#     Table 2 (and the abstract and Fig. 1) give FEV1 decline -4.3 (1.9),
#     P = 0.025 and FEV1/FVC ratio decline -0.093 (0.038), P = 0.015; Table 3's
#     "Basic model" row gives -4.3 (1.9), P = 0.024 and -0.094 (0.038),
#     P = 0.015. The Table 2 / abstract values are the ones recorded, since
#     they are the paper's headline numbers; Table 3's rounding is noted here
#     rather than silently reconciled.
#   - The demographic detail in each study_subject's subject_characteristics
#     comes from Table 1. Individual Table 1 rows are quoted as evidence only
#     for the values that land in a schema slot (group sizes, age, spirometry,
#     airway obstruction, CMH); the remaining prose figures are read from the
#     same table but not separately quoted, since description fields are not
#     quote-checked.
#   - Unit note: this paper reports FEV1 as a FLOW (L/s, declining in ml/s per
#     year) rather than the conventional volume in litres. The printed units
#     are recorded as-is (UCUM:L/s, UCUM:mL/s, UCUM:mL/s/a) rather than
#     silently normalised to litres. FVC is a volume (L, declining in ml/year).
#
# FINDINGS WITH NO SOMA SLOT (kept in prose per the extraction rules):
#   - Health-related quality of life: WS exposure worsened every SGRQ and SF-36
#     domain. Adjusted SGRQ total score was 6.9 (SE 0.7) points higher with WS
#     exposure (P < 0.0001), 4.6 (0.6) after adding comorbidity, airway
#     obstruction and CMH — above the minimal clinically important difference
#     of 4. Unadjusted baseline SGRQ total 27.8 +/- 19.54 vs 19.6 +/- 17.0.
#   - Mortality and cancer: 380 deaths and 72 incident lung cancers by
#     mid-2020. Adjusted HRs for ever WS exposure: all-cause mortality 1.53
#     (95% CI 1.21-1.92, P = 0.0003); cardiopulmonary mortality 1.49
#     (1.03-2.15, P = 0.033); cancer mortality 1.52 (1.02-2.28, P = 0.041);
#     lung cancer incidence 1.53 (0.92-2.55, P = 0.10, borderline). All-cause
#     mortality HR stayed elevated after further adjustment for baseline airway
#     obstruction and comorbidity (HR 1.39, 95% CI 1.10-1.75, P = 0.0054).
#     Mean age at death was 69.3 +/- 10.3 vs 72.8 +/- 10.2 years — a lifespan
#     shortened by 3.5 years.
#   - Mediation: SGRQ total score and SF-36 physical functioning each mediated
#     about 21% of the WS-mortality association, comparable to or larger than
#     FEV1 (18.8%).
#   - Baseline group imbalances (Table 1): the WS-exposed group was younger
#     (55.3 +/- 9.0 vs 56.7 +/- 9.5 y, P = 0.0013), more often Hispanic and
#     currently smoking, less educated and lower income, and had more airway
#     obstruction (31.4% vs 26.2%, P = 0.0097) and more chronic mucous
#     hypersecretion (32.4% vs 23.5%, P < 0.0001). Sputum methylation index did
#     not differ (P = 0.90).
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:36076291"
  reference_title: "Wood smoke exposure affects lung aging, quality of life, and all-cause mortality in New Mexican smokers."
  doi: "10.1186/s12931-022-02162-y"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - protocol_type: SpirometryProtocol
    id: "PROTOCOL:leng-spirometry-001"
    name: "Pre- and post-bronchodilator spirometry per the 1994 American Thoracic Society guidelines"
    description: "At study entry cohort members underwent pre- and post-bronchodilator spirometry testing adhering to the 1994 American Thoracic Society guidelines, and returned approximately every 18 months to repeat spirometry alongside questionnaire updates and biological sample collection. Spirometry data were collected from 2511 unique subjects for a total of 11,328 person-visits; active enrollment and on-site follow-up ended in the summer of 2017. Analyses in this study used subjects with at least one post-bronchodilator spirometry. The bronchodilator agent and dose are not stated in the paper, so neither is recorded."
    spirometry_standard: "1994 American Thoracic Society guidelines"

  - id: "PROTOCOL:leng-ws-questionnaire-001"
    name: "Self-reported binary wood smoke exposure question at study entry"
    description: "Wood smoke exposure was self-reported in response to a single question, \"Have you been exposed to wood smoke for 12 months or longer\", asked once as part of the general health survey at study entry. The question is intended to give a qualitative yes/no readout of cumulative exposure of at least one year from any source (indoor wood stove, wildfire, occupational, recreational), and had been partially validated in earlier cross-sectional LSC analyses by its associations with lower percent predicted FEV1, airflow obstruction and chronic mucous hypersecretion. It yields no concentration, no duration beyond the 12-month floor, and no timing, so it cannot support dose-response analysis."

  - id: "PROTOCOL:leng-lme-analysis-001"
    name: "Linear mixed effects modelling of lung function decline with a wood smoke x time-in-cohort interaction"
    description: "Linear mixed effects models with a subject-specific random intercept and slope assessed whether WS exposure was associated with more rapid decline of FEV1, FVC and FEV1/FVC ratio. An interaction term between WS exposure and time in cohort (TIC, in years) and their main effects were included. Fixed effects for baseline age, smoking status (current versus former), packyears of smoking, body mass index (BMI), and height, sex, and ethnicity (Hispanic and Others with non-Hispanic white as the reference) were included. A significant interaction estimate means the slope of lung function change over time varies by WS exposure, with the slope difference given by the interaction coefficient; a significant WS main effect quantifies the baseline (intercept) difference. Extended models added interaction terms between TIC and baseline current smoking, airway obstruction (FEV1/FVC ratio <= 70%) or chronic mucous hypersecretion. Stratified models split the cohort at the median baseline age of 55.9 years. Analyses were run in SAS 9.4."

  - id: "PROTOCOL:leng-hrqol-001"
    name: "Health-related quality of life by SGRQ and SF-36"
    description: "Health-related quality of life was assessed with the generic SF-36 questionnaire and the lung disease-specific St. George's Respiratory Questionnaire (SGRQ), both with a four-week recall period. SF-36 scores run 0-100 with higher scores better; SGRQ total and its activity, symptom and impact subscores run 0-100 with higher scores worse, and the minimal clinically important difference is 4 points. SGRQ was collected for all cohort members at baseline and thereafter predominantly for those with FEV1/FVC ratio < 75%, whereas SF-36 was collected at the baseline visit only. No SOMA assay class covers questionnaire scores, so this protocol has no assay attached; the findings are summarised in the header notes."

  - id: "PROTOCOL:leng-mortality-ascertainment-001"
    name: "Mortality and lung cancer incidence ascertainment and Cox modelling"
    description: "Two National Death Index searches, completed in 2014 and mid-2020, identified 380 deaths among the 2372 subjects; primary causes were coded with ICD-10. Incident lung cancer (n = 72) was identified through NDI searches, obituary data, or self-report by subjects or next of kin, with pathology reports collected to confirm diagnosis, histology and stage. Kaplan-Meier curves and Cox proportional hazards models assessed the impact of WS exposure on lung cancer incidence, all-cause mortality and cause-specific mortality, with deaths from other or unknown causes treated as competing risks and with baseline age, smoking status, packyears, BMI, income, education, sex and ethnicity adjusted. No SOMA assay class covers time-to-event outcomes, so this protocol has no assay attached; the hazard ratios are summarised in the header notes."

# =============================================================================
# LUNG FUNCTION ASSAYS — baseline post-bronchodilator spirometry in the two
# self-reported wood smoke exposure groups of the Lovelace Smokers Cohort.
#
# One assay per group, each with its own InVivoSubject, because the groups
# differ systematically in age, ethnicity, smoking status and follow-up
# length. The adjusted LME coefficients for decline and for baseline
# differences live in response_comparisons below.
# =============================================================================

lung_function_assays:
