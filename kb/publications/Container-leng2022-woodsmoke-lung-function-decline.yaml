# =============================================================================
# KEY EVENT RELATIONSHIPS
#
# The paper's one quantitative KE-to-KE finding: baseline chronic mucous
# hypersecretion (CMH) predicted faster subsequent lung function decline in the
# same cohort. CMH is the clinical manifestation of airway mucin
# hypersecretion, so it is mapped to KE:ke-mucin-hypersecretion; the KeyEvent
# blocks are copied verbatim from origin/main.
# =============================================================================

key_event_relationships:
  - id: "KER:leng-cmh-to-lung-function-decline"
    name: "Chronic mucous hypersecretion is associated with more rapid subsequent lung function decline"
    description: "Baseline chronic mucous hypersecretion (CMH, defined as self-reported cough productive of phlegm for at least 3 months per year for at least 2 consecutive years - the standard definition of chronic bronchitis) predicted faster decline of both FEV1 and FEV1/FVC ratio over follow-up in the same cohort. In the LME model adding a CMH x time-in-cohort interaction, CMH carried an excess decline of 5.4 ml/s per year for FEV1 (SE 2.0, P = 0.0061) and 0.097 percentage points per year for the FEV1/FVC ratio (SE 0.040, P = 0.014) - of the same order as the wood smoke effect itself. CMH was also commoner in the WS-exposed group (32.4% vs 23.5%, P < 0.0001), yet adding CMH x years to the model reduced the WS coefficient by less than 15% (from -4.3 to -4.0 ml/s per year), so in this cohort CMH is a parallel contributor rather than the pathway through which WS exposure acts. In the fully adjusted model carrying current smoking, airway obstruction and CMH interactions together, the CMH term fell to -3.1 (2.1) ml/s per year (P = 0.13) while airway obstruction dominated at -7.2 (2.0) (P = 0.0002). This is an observational association within one cohort, with no mechanistic measurement, hence evidence_support moderate. The authors separately note in vivo and in vitro evidence from Tesfaigzi's group for wood smoke-induced mucous cell hyperplasia, but that evidence is cited from other papers and is not recorded here."
    upstream_event:
      id: "KE:ke-mucin-hypersecretion"
      name: "Mucin hypersecretion"
      biological_action: increased
      level_of_biological_organization: cellular
    downstream_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    relationship_type: "associated with"
    evidence_support: moderate
    evidence:
