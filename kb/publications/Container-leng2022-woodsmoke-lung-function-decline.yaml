    name: "Spirometry - LSC smokers reporting ever wood smoke exposure for over a year (exposed group)"
    description: "Baseline post-bronchodilator spirometry in the 684 Lovelace Smokers Cohort subjects who self-reported ever wood smoke exposure for over a year: FEV1 2.54 +/- 0.77 L/s, FVC 3.51 +/- 0.94 L, FEV1/FVC ratio 72.3 +/- 11.3%. Unadjusted baseline FEV1 (P = 0.21) and FVC (P = 0.73) did not differ significantly from the never-exposed group, while the FEV1/FVC ratio was lower (P = 0.024); the adjusted LME models in response_comparisons show significantly lower baseline FEV1 and FEV1/FVC ratio once age, smoking, BMI, height, sex and ethnicity are accounted for. This group also had a higher baseline prevalence of airway obstruction (31.4% vs 26.2%, P = 0.0097) and of chronic mucous hypersecretion (32.4% vs 23.5%, P < 0.0001), was younger (55.3 +/- 9.0 vs 56.7 +/- 9.5 years, P = 0.0013), and had a shorter duration in cohort (median 3.6 vs 4.6 years) and fewer spirometry tests (median 3 vs 4). Over follow-up this group declined more rapidly in FEV1 and FEV1/FVC ratio but not FVC. No decline_rate is recorded here: the paper prints only the slope DIFFERENCE for this group (the WS x time interaction coefficient), never its own slope, and computing one is out of scope. Exposure is group membership from a single binary self-report question, with no concentration measured."
