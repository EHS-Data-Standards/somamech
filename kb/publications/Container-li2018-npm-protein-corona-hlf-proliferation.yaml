# =============================================================================
# KEY EVENTS
# =============================================================================
#
# Both blocks are copied verbatim from origin/main (unanimous wordings; see
# the header note). The evidence attached below is this paper's contribution.
# =============================================================================

key_events:
  - id: "KE:mie-oxidative-stress"
    name: "Increased oxidative stress"
    biological_action: increased
    level_of_biological_organization: molecular
    evidence:
      - reference: "PMID:29386584"
        reference_title: "Protein corona of airborne nanoscale PM2.5 induces aberrant proliferation of human lung fibroblasts based on a 3D organotypic culture."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Taken together, these results demonstrate that the NPM-protein corona is expected to result in a limited increase in ROS levels."
        explanation: "The paper's own characterisation of the oxidative stress event it induced: a real but limited rise in ROS, accompanied by GSH depletion and no damage markers."

  - id: "KE:ke-increased-proliferation"
    name: "Increased cell proliferation"
    biological_action: increased
    level_of_biological_organization: cellular
    evidence:
      - reference: "PMID:29386584"
        reference_title: "Protein corona of airborne nanoscale PM2.5 induces aberrant proliferation of human lung fibroblasts based on a 3D organotypic culture."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The protein corona is believed to mitigate NPM cytotoxicity and further stimulate aberrant HLF proliferation."
        explanation: "The paper's conclusion naming the proliferation event, and noting that the protein coat is what makes it possible by blunting the cytotoxicity of naked NPM."
      - reference: "PMID:29386584"
        reference_title: "Protein corona of airborne nanoscale PM2.5 induces aberrant proliferation of human lung fibroblasts based on a 3D organotypic culture."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The results demonstrated that the NPM-protein corona potentially promoted the cell growth of 3D-cultured HLFs."
        explanation: "The MTT result establishing that proliferation increased in the exposed 3D cultures."

# =============================================================================
# KEY EVENT RELATIONSHIPS
# =============================================================================
#
# One edge: the limited ROS increase drives alpha-SMA upregulation and through
# it the aberrant HLF proliferation. The authors test this with an antioxidant
# (vitamin C), which suppressed ROS, GSH depletion, alpha-SMA and
# proliferation together, and with TGF-beta1, which reproduced all four. That
# is interventional support within one model system, so evidence_support is
# moderate rather than strong: the pathway was inferred from a single cell
# type in vitro, the final link to fibrosis is explicitly a "may", and no
# direct alpha-SMA knockdown was performed.
#
# quantitative_understanding carries the MTT cell viabilities, which are the
# only numbers the paper states in text for the proliferation endpoint.
# =============================================================================

key_event_relationships:
