  # --- MDA: no change (REFUTE for oxidative damage) ---
  - id: "OX:li2018-3dhlf-mda"
    name: "Intracellular MDA in 3D-cultured HLFs across the NPM-protein corona dose series and with vitamin C or TGF-beta1"
    description: "Malondialdehyde, a lipid peroxidation end product, measured by ELISA after three days. Despite the ROS rise and GSH depletion, the NPM-protein corona induced no MDA increase at any dose, and neither vitamin C nor TGF-beta1 changed MDA. This negative result is the basis for the authors' conclusion that the corona produces a limited ROS increase without oxidative damage. Values reported only in Fig. 7A-B; none recorded."
    evidence:
      - reference: "PMID:29386584"
        reference_title: "Protein corona of airborne nanoscale PM2.5 induces aberrant proliferation of human lung fibroblasts based on a 3D organotypic culture."
        supports: REFUTE
        evidence_source: IN_VITRO
        snippet: "The NPM-protein corona stimulated ROS generation but induced no MDA increase"
        explanation: "Recorded as REFUTE because this measurement argues against membrane lipid-peroxidation damage as part of the oxidative stress event: MDA did not rise even though ROS did."
