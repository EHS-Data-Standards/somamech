# =============================================================================
# GENE EXPRESSION ASSAYS - alpha-SMA (ACTA2), the proliferation pathway
# =============================================================================
#
# alpha-SMA is measured by immunofluorescence intensity, not by transcript
# quantification, so gene_expression_method records the imaging method.
# target_gene is the human ACTA2 gene (actin alpha 2, smooth muscle), the gene
# whose product alpha-smooth muscle actin is.
# =============================================================================

gene_expression_assays:
  # --- alpha-SMA dose series ---
  - id: "GE:li2018-3dhlf-asma-dose"
    name: "Alpha-SMA expression in 3D-cultured HLFs across an NPM-protein corona dose series"
    description: "Alpha-smooth muscle actin immunofluorescence in 3D-cultured HLFs after three days of exposure to the NPM-protein corona at 5, 10 and 20 ug/ml NPM. The corona stimulated HLFs to express alpha-SMA and expression was positively correlated with the NPM exposure concentration. Alpha-SMA is a key protein of activated, not quiescent, fibroblasts and a fibrosis marker, so this is the proliferation pathway the authors propose. Fluorescence intensity reported only in Fig. 8A with images in Fig. 8F-H; no numeric value recorded."
    target_gene: "NCBIGene:59"
    gene_expression_method: "immunofluorescence confocal imaging with ImageJ intensity quantification"
    normalization_reference: "untreated control group fluorescence intensity"
    evidence:
      - reference: "PMID:29386584"
        reference_title: "Protein corona of airborne nanoscale PM2.5 induces aberrant proliferation of human lung fibroblasts based on a 3D organotypic culture."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The results demonstrated that the NPM-protein corona stimulated HLFs to express α-SMA."
        explanation: "States the core result this assay records: the NPM-protein corona induced alpha-SMA expression in the 3D-cultured HLFs."
      - reference: "PMID:29386584"
        reference_title: "Protein corona of airborne nanoscale PM2.5 induces aberrant proliferation of human lung fibroblasts based on a 3D organotypic culture."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "α-SMA expression was positively correlated with the NPM exposure concentration"
        explanation: "States the dose-response this assay's three corona groups record."
      - reference: "PMID:29386584"
        reference_title: "Protein corona of airborne nanoscale PM2.5 induces aberrant proliferation of human lung fibroblasts based on a 3D organotypic culture."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "α-SMA is a key protein expressed by activated HLFs but not by quiescent fibroblasts."
        explanation: "Establishes why alpha-SMA induction is read as fibroblast activation and therefore informs the proliferation key event."
