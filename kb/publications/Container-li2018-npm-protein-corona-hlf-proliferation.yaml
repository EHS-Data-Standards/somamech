# =============================================================================
# Li et al. (2018) - Protein corona of airborne nanoscale PM2.5 induces
# aberrant proliferation of human lung fibroblasts based on a 3D organotypic
# culture
# =============================================================================
#
# Source: Sci Rep. 2018;8:1939
# DOI: 10.1038/s41598-018-20445-7
# PMID:29386584
#
# The committed reference cache for this PMID is full text (content_type:
# full_text_xml, PMC), so every evidence snippet below is quoted from the
# committed cache and no verification receipt is needed.
#
# Study design (all in vitro, single cellular system):
#   - Airborne PM2.5 collected on quartz filters in Wuhan City with a
#     high-volume sampler, sonicated off the filter and filtered to < 1 um to
#     isolate airborne nanoscale particulate matter (NPM, naked diameter
#     ~50 nm). Characterized by SEM, SEM-EDS, AFM and ATR-FTIR.
#   - NPM incubated with fetal bovine serum (37 C, 24 h) to form the
#     NPM-protein corona (NPC); SEM showed complexes of 100-200 nm and FTIR
#     confirmed the protein coat.
#   - Primary human lung fibroblasts (HLFs, ATCC PCS-201-013) suspended in a
#     fibrinogen/thrombin precursor, gelled for 1 h and cultured for three
#     days as a 3D organotypic fibrin-hydrogel construct in a microfluidic
#     chip (imaging) or a 96-well plate (quantitative assays).
#   - Final 3D exposure concentrations: NPC at 5, 10 and 20 ug/ml NPM; naked
#     NPM 20 ug/ml; pure serum; vitamin C 0.1 mg/ml co-treatment with NPC
#     (20 ug/ml NPM); TGF-beta1 2 ng/ml as a positive comparator. Control was
#     HLF medium alone.
#   - Readouts: MTT cell proliferation/viability, ROS (DCFH-DA), GSH
#     (ThioGlo-1), MDA and 8-OH-dG (ELISA), alpha-smooth muscle actin
#     (alpha-SMA) immunofluorescence.
#
# Key findings:
#   - The NPM-protein corona promoted 3D-HLF proliferation dose-dependently
#     (cell viabilities 103%, 109%, 113% at 5, 10, 20 ug/ml NPM); 20 ug/ml was
#     significant versus control (p < 0.01). Naked NPM (104%) and pure serum
#     (105%) did not.
#   - ROS rose with NPM concentration and GSH was depleted, but MDA and
#     8-OH-dG did not change: a limited ROS increase without oxidative damage.
#   - alpha-SMA expression rose with NPM concentration. Vitamin C repressed
#     ROS, GSH depletion, alpha-SMA and proliferation; TGF-beta1 reproduced
#     all of them.
#   - The authors' mechanism: NPC -> limited ROS increase -> ROS-mediated
#     alpha-SMA upregulation -> aberrant HLF proliferation -> pulmonary
#     fibrosis.
#
# IMPORTANT - no numeric measurement values are recorded on the oxidative
# stress or alpha-SMA outputs. ROS, GSH, MDA, 8-OH-dG and alpha-SMA are all
# reported as fluorescence-intensity or ELISA bar charts (Figs 5-8) with no
# numbers in the running text, and figure-derived values are not estimated.
# The MTT cell viabilities ARE stated numerically in the text; because the
# schema has no proliferation or viability assay slot, they are recorded as
# the quantitative_understanding of the key event relationship below and
# quoted verbatim in its evidence, rather than being filed under an assay
# type they do not belong to. Exposure concentrations and durations are
# stated numerically in the Methods and are recorded as such.
#
# Key events are copied verbatim from origin/main. Both were unanimous:
#   KE:mie-oxidative-stress    "Increased oxidative stress"  (47 occurrences)
#   KE:ke-increased-proliferation "Increased cell proliferation" (3 occurrences)
# No new KE id is minted.
#
# =============================================================================

# =============================================================================
# SOURCE PUBLICATION
# =============================================================================

source_publication:
  reference: "PMID:29386584"
  reference_title: "Protein corona of airborne nanoscale PM2.5 induces aberrant proliferation of human lung fibroblasts based on a 3D organotypic culture."
  doi: "10.1038/s41598-018-20445-7"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:li2018-3dculture-001"
    protocol_type: Protocol
    name: "3D organotypic fibrin-hydrogel culture of human lung fibroblasts"
    description: "Human lung fibroblasts were suspended at 2 x 10^6 cells/ml, mixed with the exposure solution, fibrinogen (10 mg/ml) and thrombin (100 U/ml) in a ratio of 60:20:19:1 on ice, and seeded as 15 ul aliquots in a microfluidic chip (AIM Biotech, Singapore) for imaging or 50 ul aliquots in a 96-well plate for quantitative assays. Gelation ran 1 h at 37 C, after which the construct was filled with HLF culture medium, replaced daily, and cultured for three days. Fibrinogen was dissolved in FBS-free HLF medium; thrombin in DPBS containing 0.1% BSA."
    quality_control_criteria: "Live/dead and nuclear fluorescence confirmed intact, viable cells with clear nuclei in the fibrin scaffold before exposure readouts"
    equipment_required:
      - "Microfluidic chip (AIM Biotech, Singapore)"
      - "Fibrinogen (Sigma) and thrombin (Sigma)"
      - "Confocal microscope (Olympus IX81)"

  - id: "PROTOCOL:li2018-mtt-001"
    protocol_type: MolecularAssayProtocol
    name: "MTT assay for cell proliferation of 3D-cultured HLFs"
    description: "After three days of exposure the cell medium was removed by pipetting and 100 ul of gel dissociation saline solution (Biovision) was added. Mixtures were incubated at room temperature for 5-10 min and pipetted with a 1 ml tip until the fibrin matrix dissolved, then centrifuged at 1,000 x g for 5 min at 4 C and the supernatant removed. Cell proliferation was measured with an MTT kit (Nanjing Jiancheng, China) and reported as cell viability relative to the untreated control."
    detection_method: "MTT colorimetric assay kit (Nanjing Jiancheng)"
    normalization_method: "percentage of the untreated control group"
    equipment_required:
      - "Microplate reader"
      - "MTT assay kit (Nanjing Jiancheng)"
      - "Gel dissociation saline solution (Biovision)"

  - id: "PROTOCOL:li2018-dcfhda-001"
    protocol_type: ImagingProtocol
    name: "DCFH-DA fluorescence detection of intracellular ROS in 3D-cultured HLFs"
    description: "Intracellular reactive oxygen species were labelled with DCFH-DA (Merck KGaA, Germany). Images of fluorochrome-labelled ROS in 3D-cultured HLFs were captured on a confocal microscope (Olympus IX81) at x10 magnification and processed with Imaris software. For quantification, 3D-cultured HLFs on cell plates were released from the fibrin matrix with gel dissociation saline solution and ROS fluorescence intensity was read on a fluorescence reader (FLx800; BioTek Instruments)."
    fluorescent_labeling: "DCFH-DA (Merck KGaA)"
    fluorescent_tracer: "DCFH-DA"
    equipment_required:
      - "Confocal microscope (Olympus IX81)"
      - "Fluorescence reader (FLx800, BioTek Instruments)"
      - "DCFH-DA probe (Merck KGaA)"

  - id: "PROTOCOL:li2018-thioglo-001"
    protocol_type: ImagingProtocol
    name: "ThioGlo-1 fluorescence detection of intracellular GSH in 3D-cultured HLFs"
    description: "Intracellular glutathione was labelled with ThioGlo(TM)-1 (Merck KGaA, Germany). Images of fluorochrome-labelled GSH in 3D-cultured HLFs were captured on a confocal microscope (Olympus IX81) at x10 magnification. GSH fluorescence intensity was quantified on a fluorescence reader (FLx800; BioTek Instruments) after the cells were released from the fibrin matrix."
    fluorescent_labeling: "ThioGlo(TM)-1 (Merck KGaA)"
    fluorescent_tracer: "ThioGlo-1"
    equipment_required:
      - "Confocal microscope (Olympus IX81)"
      - "Fluorescence reader (FLx800, BioTek Instruments)"
      - "ThioGlo-1 probe (Merck KGaA)"

  - id: "PROTOCOL:li2018-elisa-001"
    protocol_type: MolecularAssayProtocol
    name: "ELISA quantification of MDA and 8-OHdG in 3D-cultured HLFs"
    description: "Concentrations of malondialdehyde (MDA, a lipid peroxidation end product) and 8-hydroxydeoxyguanosine (8-OHdG, a marker of oxidative DNA damage) were measured with ELISA kits according to the manufacturer's instructions (Nanjing Jiancheng, China), on 3D-cultured HLFs recovered from the fibrin matrix by gel dissociation and centrifugation."
    detection_method: "ELISA kits (Nanjing Jiancheng)"
    equipment_required:
      - "Microplate reader"
      - "MDA and 8-OHdG ELISA kits (Nanjing Jiancheng)"

  - id: "PROTOCOL:li2018-asma-if-001"
    protocol_type: StainingProtocol
    name: "Alpha-SMA immunofluorescence in 3D-cultured HLFs"
    description: "Alpha-smooth muscle actin was detected with a fluorescent anti-alpha-SMA agent (Abcam, USA) in HLFs cultured in the microfluidic chip. Nuclei were counterstained with DAPI (Invitrogen) and live cells labelled with an Invitrogen live-cell dye. 3D fluorescence images were captured on a confocal microscope (Olympus IX81) at x10 magnification and processed with Imaris software; the fluorescence intensity of alpha-SMA expression was analysed with ImageJ software."
    staining_type: "immunofluorescence"
    detection_method: "confocal fluorescence microscopy with ImageJ intensity quantification"
    antibodies_used:
      - "anti-alpha-SMA (Abcam, USA)"
    counterstain: "DAPI (Invitrogen)"
    equipment_required:
      - "Confocal microscope (Olympus IX81)"
      - "Imaris software (Bitplane Scientific Software)"
      - "ImageJ software"

