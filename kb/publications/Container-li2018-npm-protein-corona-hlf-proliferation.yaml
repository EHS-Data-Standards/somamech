  # --- alpha-SMA with vitamin C and TGF-beta1 ---
  - id: "GE:li2018-3dhlf-asma-modulators"
    name: "Alpha-SMA expression in 3D-cultured HLFs with vitamin C or TGF-beta1"
    description: "Alpha-SMA immunofluorescence in 3D-cultured HLFs after three days of exposure to the NPM-protein corona (20 ug/ml NPM), the same corona co-treated with vitamin C 0.1 mg/ml, or TGF-beta1 2 ng/ml. Vitamin C repressed alpha-SMA secretion, tying the induction to the ROS it also suppressed; TGF-beta1 promoted alpha-SMA, reproducing the corona effect. Values reported only in Fig. 8B with images in Fig. 8C-E; none recorded."
    target_gene: "NCBIGene:59"
    gene_expression_method: "immunofluorescence confocal imaging with ImageJ intensity quantification"
    normalization_reference: "untreated control group fluorescence intensity"
    evidence:
      - reference: "PMID:29386584"
        reference_title: "Protein corona of airborne nanoscale PM2.5 induces aberrant proliferation of human lung fibroblasts based on a 3D organotypic culture."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Vitamin C effectively repressed the secretion of α-SMA"
