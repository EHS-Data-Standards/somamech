    relationship_type: "indirectly leads to"
    evidence_support: moderate
    # low, not moderate: the paper quantifies only the downstream endpoint.
    # Neither the ROS rise nor the alpha-SMA rise has a numeric value, so no
    # response-response relationship between the two key events can be stated.
