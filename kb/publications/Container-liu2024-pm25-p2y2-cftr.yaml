# =============================================================================
# Liu et al. (2024) - PM2.5 Exposure Inhibits Transepithelial Anion
# Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway
#
# Int J Med Sci. 2024;21(10):1929-1944 - doi:10.7150/ijms.96777 (gold OA, CC-BY)
#
# Focus of this extraction: the ATP/P2Y2R -> intracellular calcium -> CFTR
# pathway that the paper proposes, and the downstream airway outcomes it
# measures in the OVA asthma model.
#
# Study design as reported:
#   In vitro  - Calu-3 human airway epithelial cells, submerged monolayer on
#               transwell inserts (Corning 3801), 21-day post-confluency.
#               Six groups: control, ATP (10 uM), PM2.5 (100 ug/mL),
#               Suramin (100 uM), ATP+PM2.5, Suramin+PM2.5; 24 h and 48 h.
#   In vivo   - 50 male Balb/c mice, 6-8 weeks, 18-22 g, SPF. Five groups:
#               control, OVA, OVA+ATP (50 mg/kg), OVA+PM2.5 (100 ug/mL),
#               OVA+Suramin (50 mg/kg). OVA sensitisation on days 1, 7, 14;
#               1% OVA challenge days 21-27; nasal instillation days 21-27.
#   PM2.5     - collected in Guangzhou, July-November 2019; LC-MS/MS
#               composition reported (total carbon 337 ug/mg).
#
# IMPORTANT ON NUMBERS: this paper reports every assay result graphically and
# semi-quantitatively - directions of change plus significance thresholds
# (p < 0.05 / 0.01 / 0.001). It states no numeric group means, SDs or sample
# sizes for any measurement, and its statistics section says only that
# "Continuous variables were expressed with mean +/- standard deviation".
# Therefore no measurement magnitudes are recorded here: output records carry
# their experimental group and the condition they were measured under, and
# every stated direction of change lives in a `description:` field or a
# `response_comparisons:` entry with no `change_value`. Reading magnitudes off
# the figures would invent data the paper does not report.
#
# Values that ARE recorded are the ones the paper states in its Methods:
# exposure agents, concentrations and durations.
# =============================================================================

source_publication:
  reference: "PMID:39113893"
  reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
  doi: "10.7150/ijms.96777"

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:liu-p2y2-ussing-cell-001"
    name: "Ussing chamber short-circuit current, Calu-3 monolayer"
    description: "TER measured with an RE1600 epithelium resistor (Kingtech, Beijing). Monolayers loaded into an Ussing chamber (Kingtech, Beijing) with 5 mL K-H solution per side: solution A (NaCl 120 mM, NaHCO3 25 mM, KH2PO4 3.3 mM, K2HPO4 0.128 mM, MgCl2 1.2 mM, CaCl2 1.2 mM, mannitol 10 mM) on side A, solution B (mannitol replaced by glucose 10 mM) on side B. Agar-bridge current and voltage electrodes (1% agar in 3 M KCl). Chamber at 37 C, 95% oxygen / 5% carbon dioxide; an electrode was accepted only if the current exceeded 60 uA, and the A/B resistance difference was compensated to zero. Voltage clamped at zero; baseline Isc recorded once stable (up to 30 min), then ATP added to side A. Analysis of the response from baseline to peak: maximum difference (delta-Isc) and average rate (delta-Isc/delta-T)."
    equipment_required:
      - "Ussing chamber, electrophysiological detection equipment (Kingtech, Beijing)"
      - "RE1600 epithelium resistor (Kingtech, Beijing)"
      - "Agar-bridge current and voltage electrodes (1% agar in 3 M KCl)"
      - "K-H solution A and solution B"
    quality_control_criteria: "An electrode was accepted only when the current exceeded 60 uA; the resistance difference between solution A and solution B was compensated to zero; baseline Isc was recorded only once stable."

  - id: "PROTOCOL:liu-p2y2-ussing-trachea-001"
    name: "Ussing chamber short-circuit current, mouse tracheal tissue"
    description: "As for the Calu-3 protocol, with tissue in place of a monolayer: main trachea excised at 8 mm x 8 mm, held in saline to preserve viability, blood vessels and connective tissue removed, mounted on the tissue clip with K-H solution A to the luminal side and solution B to the basal side. The ATP concentration used to stimulate tissue was 100 uM rather than 10 uM."
    equipment_required:
      - "Ussing chamber, electrophysiological detection equipment (Kingtech, Beijing)"
      - "Tissue clip"

  - id: "PROTOCOL:liu-p2y2-asl-001"
    name: "Airway surface liquid volume on transwell inserts"
    description: "At 100% confluency in transwell plates, 100 uL of medium containing ATP or PM2.5 was added per group; the control received 100 uL PBS. ASL volume was recovered from the chamber after 24 h with a pipette accurate to 0.01 uL. The experiment was repeated three times. The paper reports the resulting volumes only as figure bars, not as numbers."
    equipment_required:
      - "Transwell plates (3801, Corning)"
      - "Pipette with 0.01 uL accuracy"
    replicate_requirements: 3

  - id: "PROTOCOL:liu-p2y2-qpcr-001"
    protocol_type: MolecularAssayProtocol
    name: "qRT-PCR for P2Y2R in Calu-3 cells"
    description: "Total RNA extracted from Calu-3 cells by the TRIzol method (Sigma); cDNA synthesised with a reverse transcription kit (Takara, Dalian). GADPH used as internal control. Experiment repeated three times."
    reference_gene: "GADPH"
    primer_sequences:
      - "P2Y2R forward: CCTGAGAGGAGAAGCGCAG"
      - "P2Y2R reverse: GAACTCTGCGGGAAACAGGA"
      - "GADPH forward: AGATCCCTCCAAAATCAAGTGG"
      - "GADPH reverse: GGCAGAGATGATGACCCTTTT"
    replicate_requirements: 3

  - id: "PROTOCOL:liu-p2y2-wb-001"
    protocol_type: MolecularAssayProtocol
    name: "Western blot for P2Y2R and CFTR"
    description: "RIPA lysate (Solarbio, Beijing) used to extract total protein from Calu-3 cells and from right lung tissue of mice; protein quantified with a BCA Protein Assay Kit (Beyotime). 40 ug per lane separated on 10% SDS-PAGE, transferred to PVDF (Millipore), blocked in 5% skim milk / TBS-T for 1.5 h. Bands observed on a ChemiScope series imager (Clinx, Shanghai) and analysed semi-quantitatively by densitometry. Experiment repeated three times."
    detection_method: "Chemiluminescence, ChemiScope series (Clinx, Shanghai); semi-quantitative densitometry"
    antibodies_used:
      - "anti-P2Y2R (Abcam, ab272891, 1:1000)"
      - "anti-CFTR (CST, 78335S, 1:1000)"
      - "anti-rabbit IgG HRP (CST, 7074S, 1:2500)"
    normalization_method: "GADPH loading control"
    replicate_requirements: 3

  - id: "PROTOCOL:liu-p2y2-flowcyt-001"
    protocol_type: MolecularAssayProtocol
    name: "Fluo-3/AM flow cytometry for cytoplasmic free calcium"
    description: "Calu-3 cells digested with EDTA-free trypsin and washed twice in calcium-free PBS. Each sample split in half; one half labelled with 0.5 uL Fluo-3/AM probe (Beyotime, Shanghai), the other kept as the unlabelled control. Incubated at 37 C for 30 min, washed twice in calcium-free PBS, resuspended in 400 uL PBS and incubated 20 min. FITC-channel fluorescence read on a BD Accuri C6 Plus flow cytometer; Fluo-3/AM excitation 488 nm, emission 525 nm. Mean fluorescence intensity analysed in FlowJo v10.0. Experiment repeated three times."
    detection_method: "Flow cytometry, FITC channel, mean fluorescence intensity"
    platform: "BD Accuri C6 Plus"
    replicate_requirements: 3

  - id: "PROTOCOL:liu-p2y2-ihc-001"
    protocol_type: StainingProtocol
    name: "Immunohistochemistry for P2Y2R and CFTR in lung tissue"
    description: "Left lung fixed in 4% paraformaldehyde (Sigma) for 24 h, paraffin-embedded and cut at 5 um. Sections incubated with primary antibodies, washed in PBS, then incubated with mouse anti-rabbit IgG and a streptavidin peroxidase complex for 40 min at 37 C (ZSGB-BIO, Beijing). Expression quantified by staining intensity and expressed as the percentage of positive cells."
    staining_type: "immunohistochemistry"
    fixation_method: "4% paraformaldehyde, 24 h"
    antibodies_used:
      - "anti-P2Y2R (1:500, Abcam, UK)"
      - "anti-CFTR (1:1000, Abclone, CN)"
    detection_method: "0.05% diaminobenzidine (DAB) substrate"

  - id: "PROTOCOL:liu-p2y2-pas-001"
    protocol_type: StainingProtocol
    name: "Periodic Acid-Schiff staining for goblet cells"
    description: "Tissue slices (5 um) stained with Periodic Acid-Schiff to assess hyperplasia of goblet cells in the bronchus. PAS-stained cells counted as goblet cells; result expressed as the percentage of positive cells."
    staining_type: "PAS"
    fixation_method: "4% paraformaldehyde, 24 h"

  - id: "PROTOCOL:liu-p2y2-elisa-001"
    protocol_type: MolecularAssayProtocol
    name: "ELISA for Th2 cytokines in mouse BALF"
    description: "After isoflurane anaesthesia (RWD, Guangzhou) the left main bronchus was ligated with surgical thread; the right lung was washed twice with 0.5 mL saline and the lavage liquid collected. IL-4, IL-5 and IL-13 measured with mouse ELISA kits (Absin, Shanghai) per the manufacturer's instructions."
    detection_method: "ELISA, mouse kits (Absin, Shanghai)"

  - id: "PROTOCOL:liu-p2y2-plethys-001"
    protocol_type: SpirometryProtocol
    name: "Whole-body plethysmography with methacholine challenge"
    description: "Mice placed in a whole-body chamber connected to the BUXCO system (DSI, MN). Airway responsiveness expressed as special airway resistance (sRaw, cmH2O/mL/s), obtained with aerosols of methacholine at 0, 5, 10 and 20 mg/mL and analysed with FLexi Vent software."
    spirometry_standard: "BUXCO whole-body plethysmography (DSI, MN)"
    bronchodilator_agent: "methacholine aerosol challenge at 0, 5, 10 and 20 mg/mL"
    plethysmography_method: "whole-body plethysmography"

