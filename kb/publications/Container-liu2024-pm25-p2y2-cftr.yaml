# =============================================================================
# CHANGES VS CONTROL THAT THE PAPER STATES
#
# The paper states the direction and the significance threshold of each change
# but no magnitude, so these entries carry `change_direction` and no
# `change_value`. `change_type` is likewise omitted: the paper does not say
# whether its figures show a fold change, a percent change or an absolute
# difference. `p_value` is omitted because a threshold (p < 0.05) is not a
# p-value; the threshold is recorded in each entry's description.
# =============================================================================

response_comparisons:
  - id: "COMP:liu-p2y2-isc-calu3-pm25-vs-control"
    name: "ATP-induced Isc, PM2.5 vs control (Calu-3, 24 h)"
    description: "The increase in the ATP-induced Isc peak was significantly slower in the PM2.5 group than in the control group, and the average rate delta-Isc/delta-T evidently decreased. Reported significance: p < 0.05 by one-way ANOVA. The paper gives no magnitude for the change."
    derived_from_assay: "CFTR:liu-p2y2-isc-calu3-24h"
    compared_measurement: "cftr_chloride_secretion"
    control_output: "CFTR:liu-p2y2-isc-calu3-24h-output-control"
    treated_output: "CFTR:liu-p2y2-isc-calu3-24h-output-pm25"
    change_direction: decreased
    statistical_test: "one-way analysis of variance"
    derivation: reported_in_paper

  - id: "COMP:liu-p2y2-isc-trachea-pm25-vs-control"
    name: "ATP-induced Isc, PM2.5 vs control (mouse trachea)"
    description: "Cross-assay comparison: the control and PM2.5 tracheal recordings are separate assay records because they come from different animals. PM2.5 exposure inhibited the ATP-induced transepithelial Isc of tracheal tissue. Reported significance: p < 0.05 by Student's t test. The paper gives no magnitude for the change."
    derived_from_assay: "CFTR:liu-p2y2-isc-trachea-pm25"
    compared_measurement: "cftr_chloride_secretion"
    control_output: "CFTR:liu-p2y2-isc-trachea-control-output"
    treated_output: "CFTR:liu-p2y2-isc-trachea-pm25-output"
    change_direction: decreased
    statistical_test: "Student's t test"
    derivation: reported_in_paper

  - id: "COMP:liu-p2y2-goblet-pm25-vs-ova"
    name: "Goblet cell proportion, OVA+PM2.5 vs OVA"
    description: "The proportion of PAS-positive goblet cells in the PM2.5 group was obviously higher than in the OVA group. Reported by non-parametric test with thresholds p < 0.05, p < 0.001 and p < 0.0001 marked on the figure; the paper gives no magnitude for the change."
    derived_from_assay: "GCM:liu-p2y2-pas-bronchus"
    compared_measurement: "goblet_cell_percentage"
    control_output: "GCM:liu-p2y2-pas-bronchus-output-ova"
    treated_output: "GCM:liu-p2y2-pas-bronchus-output-ova-pm25"
    change_direction: increased
    statistical_test: "non-parametric test"
    derivation: reported_in_paper

  - id: "COMP:liu-p2y2-goblet-atp-vs-ova"
    name: "Goblet cell proportion, OVA+ATP vs OVA"
    description: "The proportion of PAS-positive goblet cells in ATP-treated OVA mice was evidently lower than in the OVA group - the rescue arm of the same experiment. Reported by non-parametric test; the paper gives no magnitude for the change."
    derived_from_assay: "GCM:liu-p2y2-pas-bronchus"
    compared_measurement: "goblet_cell_percentage"
    control_output: "GCM:liu-p2y2-pas-bronchus-output-ova"
    treated_output: "GCM:liu-p2y2-pas-bronchus-output-ova-atp"
    change_direction: decreased
    statistical_test: "non-parametric test"
    derivation: reported_in_paper

  - id: "COMP:liu-p2y2-sraw-pm25-vs-ova"
    name: "Special airway resistance, OVA+PM2.5 vs OVA"
    description: "sRaw in the PM2.5 group was significantly elevated over the OVA group across methacholine concentrations. Reported by one-way ANOVA with p < 0.05 marked against the OVA group; the paper gives no magnitude for the change."
    derived_from_assay: "LF:liu-p2y2-sraw-methacholine"
    compared_measurement: "lung_resistance"
    control_output: "LF:liu-p2y2-sraw-methacholine-output-ova"
    treated_output: "LF:liu-p2y2-sraw-methacholine-output-ova-pm25"
    change_direction: increased
    statistical_test: "one-way analysis of variance"
    derivation: reported_in_paper

  - id: "COMP:liu-p2y2-sraw-suramin-vs-ova"
    name: "Special airway resistance at 20 mg/mL methacholine, OVA+Suramin vs OVA"
    description: "sRaw at 20 mg/mL methacholine in the Suramin+OVA group was higher than in the OVA group alone; the paper states the threshold P < 0.05 and no magnitude. This arm is the paper's evidence that blocking P2Y2R alone worsens airway responsiveness."
    derived_from_assay: "LF:liu-p2y2-sraw-methacholine"
    compared_measurement: "lung_resistance"
    control_output: "LF:liu-p2y2-sraw-methacholine-output-ova"
    treated_output: "LF:liu-p2y2-sraw-methacholine-output-ova-suramin"
    change_direction: increased
    statistical_test: "one-way analysis of variance"
    derivation: reported_in_paper

# =============================================================================
# KEY EVENT RELATIONSHIPS
#
# The pathway the paper proposes: PM2.5 downregulates P2Y2R, which lowers
# ATP-induced cytoplasmic free calcium, which lowers CFTR-mediated anion
# current, which reduces ASL - and downstream, Th2 airway inflammation and
# airway hyperresponsiveness. The calcium step is the one key event with no
# existing KE: ID in this repository, so KE:ke-decreased-intracellular-calcium
# is newly minted here and kept minimal.
# =============================================================================

key_event_relationships:
  - id: "KER:liu-p2y2-p2y2r-to-calcium"
    name: "Decreased P2Y2R expression leads to decreased intracellular calcium"
    description: "ATP pre-treatment raised cytoplasmic free calcium in Calu-3 cells, and Suramin (a P2Y2R antagonist) or PM2.5 reduced the ATP-induced rise, which the paper reads as P2Y2R-dependent calcium mobilisation. Measured by Fluo-3/AM flow cytometry; the paper reports mean fluorescence intensity as figure bars only, so it is recorded here as a relationship rather than as an assay with a magnitude (the schema also has no calcium-mobilisation assay type)."
    upstream_event:
      id: "KE:ke-decreased-p2y2r"
      name: "Decreased P2Y2R expression"
      biological_action: decreased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-decreased-intracellular-calcium"
      name: "Decreased intracellular calcium"
      biological_action: decreased
      level_of_biological_organization: molecular
    relationship_type: "directly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:39113893"
        reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The mean fluorescent intensity in the ATP group was significantly higher than that of the control group after 24 h and 48 h (p <0.01), but the fluorescent intensity in the ATP+PM2.5group were significantly lower than that of the ATP group (p < 0.01)"
        explanation: "The flow cytometry result behind this relationship: ATP raised cytoplasmic calcium and PM2.5 suppressed that rise."
      - reference: "PMID:39113893"
        reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Our study demonstrated that PM2.5inhibited the release of ATP-induced cytoplasmic free calcium in the airway epithelial cells."
        explanation: "The authors' own statement of the downstream event in this relationship."

  - id: "KER:liu-p2y2-calcium-to-cftr"
    name: "Decreased intracellular calcium leads to decreased CFTR function"
    description: "The paper concludes that PM2.5 inhibited the transepithelial anion Isc by downregulating the P2Y2R/CFTR pathway and the P2Y2/calcium-dependent chloride channel, and suggests that activation of calcium-dependent chloride channels participates in modulating transepithelial Isc."
    upstream_event:
      id: "KE:ke-decreased-intracellular-calcium"
      name: "Decreased intracellular calcium"
      biological_action: decreased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-decreased-cftr"
      name: "Decreased CFTR function"
      biological_action: decreased
      level_of_biological_organization: molecular
    relationship_type: "indirectly leads to"
    evidence_support: weak
    evidence:
      - reference: "PMID:39113893"
        reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In addition, PM2.5 exposure decreased the expression levels of P2Y2R, CFTR and cytoplasmic free-calcium, but ATP can increase the expressions of these proteins."
        explanation: "Places the calcium decrease alongside the CFTR decrease under the same exposure; the paper infers, but does not directly test, the causal step, hence weak support."

  - id: "KER:liu-p2y2-p2y2r-to-cftr"
    name: "Decreased P2Y2R expression leads to decreased CFTR function"
    description: "The central mechanism of the paper: PM2.5 downregulates the P2Y2R/CFTR pathway and so impairs the ATP-induced transepithelial anion short-circuit current, in Calu-3 monolayers and in mouse tracheal tissue alike."
    upstream_event:
      id: "KE:ke-decreased-p2y2r"
      name: "Decreased P2Y2R expression"
      biological_action: decreased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-decreased-cftr"
      name: "Decreased CFTR function"
      biological_action: decreased
      level_of_biological_organization: molecular
    relationship_type: "directly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:39113893"
        reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Together, our study reveals that PM2.5 impairs the ATP-induced transepithelial anion Isc through downregulating P2Y2R/CFTR pathway, and this process may participate in aggravating airway hyperresponsiveness and airway inflammation."
        explanation: "The paper's summary of this relationship and of the two downstream relationships recorded below."

  - id: "KER:liu-p2y2-cftr-to-asl"
    name: "Decreased CFTR function leads to decreased ASL"
    description: "The ATP-induced anion current and the ASL volume fell together after PM2.5 exposure in the transwell model; the authors attribute the ASL loss to partial inhibition of the ATP-induced anion current, which is mainly controlled by CFTR."
    upstream_event:
      id: "KE:ke-decreased-cftr"
      name: "Decreased CFTR function"
      biological_action: decreased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-decreased-asl"
      name: "Decreased ASL height"
      biological_action: decreased
      level_of_biological_organization: cellular
    relationship_type: "directly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:39113893"
        reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In short, PM2.5exposures impaired the production of ASL and transepithelial anion Isc."
        explanation: "States that the same exposure impaired both the anion current and ASL production, the two events this relationship links."

  - id: "KER:liu-p2y2-cftr-to-inflammation"
    name: "Decreased CFTR function leads to airway inflammation"
    description: "The paper's in vivo arm: PM2.5 and Suramin, both of which lower P2Y2R/CFTR, raised Th2 cytokines in BALF, lung inflammation, collagen deposition and goblet cell hyperplasia, while ATP administration reduced lung inflammation in the asthma model."
    upstream_event:
      id: "KE:ke-decreased-cftr"
      name: "Decreased CFTR function"
      biological_action: decreased
      level_of_biological_organization: molecular
    downstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    relationship_type: "indirectly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:39113893"
        reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "PM2.5 exposure increased the levels of Th2-related cytokines of bronchoalveolar lavage fluid, lung inflammation, collagen deposition and hyperplasisa of goblet cells."
        explanation: "The inflammatory downstream event of this relationship, as stated in the abstract."

  - id: "KER:liu-p2y2-inflammation-to-lung-function"
    name: "Airway inflammation leads to decreased lung function"
    description: "sRaw rose in OVA mice over control and rose further with PM2.5, and rose at 20 mg/mL methacholine with Suramin; the paper concludes that impairing the ATP/P2Y2R pathway increases airway responsiveness alongside Th2 inflammatory factors."
    upstream_event:
      id: "KE:ke-airway-inflammation"
      name: "Airway inflammation"
      biological_action: increased
      level_of_biological_organization: tissue
    downstream_event:
      id: "KE:ao-decreased-lung-function"
      name: "Decreased lung function"
      biological_action: decreased
      level_of_biological_organization: organ
    relationship_type: "indirectly leads to"
    evidence_support: moderate
    evidence:
      - reference: "PMID:39113893"
        reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The sRaw value in PM2.5group was significantly elevated than that in the OVA group."
        explanation: "The lung-function endpoint of this relationship: airway resistance rose further when PM2.5 was added to the OVA model."
