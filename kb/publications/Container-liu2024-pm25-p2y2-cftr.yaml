# =============================================================================
# CFTR / TRANSEPITHELIAL ANION SHORT-CIRCUIT CURRENT
# =============================================================================

cftr_assays:
  - id: "CFTR:liu-p2y2-isc-calu3-24h"
    name: "ATP-induced transepithelial anion Isc, Calu-3 control vs PM2.5, 24 h"
    description: "Isc measured in an Ussing chamber. A stable baseline with no Isc peak was seen in both the control and the PM2.5 group before stimulation; adding ATP 10 uM to side A produced a rapidly rising Isc peak in both. The increase in the ATP-induced Isc peak (delta-Isc) in the PM2.5 group was significantly slower than in the control group (p < 0.05), and the average rate (delta-Isc/delta-T) evidently decreased in the PM2.5 group. The paper reports these as figure traces and bars with a significance threshold only, so no current magnitudes are recorded here."
    stimulation_agent: "ATP 10 uM, added to side A (luminal)"
    evidence:
      - reference: "PMID:39113893"
        reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In transwell model, the adenosine triphosphate (ATP)-induced transepithelial anion short-circuit current (Isc) and airway surface liquid (ASL) significantly decreased after PM2.5 exposure."
        explanation: "The paper's abstract statement of this assay's result: the ATP-induced Isc fell after PM2.5 exposure."
      - reference: "PMID:39113893"
        reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Obviously, compared with the control group, the average rate (∆Isc/∆T) of Iscchanges evidently decreased in the PM2.5group"
        explanation: "Gives the specific quantity that decreased in the PM2.5 output of this assay - the average rate of Isc change from baseline to peak."
    has_exposure_condition:
      - id: "EXPOSURE:liu-p2y2-pbs-vehicle-24h"
        name: "PBS vehicle, 100 uL apical, 24 h"
        exposure_duration:
          value: "24"
          unit:
            id: "UO:0000032"
            name: "hour"
      - id: "EXPOSURE:liu-p2y2-pm25-100ug-24h"
        name: "PM2.5 100 ug/mL, 24 h"
        exposure_agent:
          id: "ENVO:01000415"
          name: "fine respirable suspended particulate matter"
        exposure_concentration:
          value: "100"
          unit:
            id: "UO:0000274"
            name: "microgram per milliliter"
        exposure_duration:
          value: "24"
          unit:
            id: "UO:0000032"
            name: "hour"
    has_specified_output:
      - id: "CFTR:liu-p2y2-isc-calu3-24h-output-control"
        name: "ATP-induced Isc, control monolayer"
        description: "Stable baseline with no Isc peak before ATP, then a rapidly rising ATP-induced Isc peak. Reported as a figure trace; the paper gives no numeric current or rate."
        experimental_group: vehicle_control
        measured_under: "EXPOSURE:liu-p2y2-pbs-vehicle-24h"
      - id: "CFTR:liu-p2y2-isc-calu3-24h-output-pm25"
        name: "ATP-induced Isc, PM2.5-exposed monolayer"
        description: "ATP-induced Isc peak rose significantly more slowly than control (p < 0.05) and the average rate delta-Isc/delta-T evidently decreased. Reported as a figure trace and bar; the paper gives no numeric current or rate."
        experimental_group: treated
        measured_under: "EXPOSURE:liu-p2y2-pm25-100ug-24h"
