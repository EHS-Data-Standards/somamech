asl_assays:
  - id: "ASL:liu-p2y2-asl-calu3-24h"
    name: "ASL volume after 24 h ATP and/or PM2.5, Calu-3 transwell"
    description: "ASL volume recovered from the apical chamber after 24 h in four groups: PBS control, ATP 10 uM, PM2.5 100 ug/mL and ATP+PM2.5. Reported directions: ASL volume in the ATP group was higher than in the blank control group (p < 0.001), and ASL in the ATP+PM2.5 group was evidently lower than in the ATP group; the authors conclude that PM2.5 reduced ASL production. Transepithelial resistance was measured on the same monolayers: no difference between ATP and control, TER in the PM2.5 group lower than control, and TER in PM2.5+ATP significantly lower than in ATP alone. No numeric volumes or resistances are reported - only figure bars - so no magnitude is recorded here, and the schema has no slot for ASL volume (as opposed to height) or for TER."
    evidence:
      - reference: "PMID:39113893"
        reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "In the transwell model, the volume of ASL in the ATP group was higher than that in the blank control group (p < 0.001)."
        explanation: "Establishes the ATP-stimulated baseline against which the PM2.5 and ATP+PM2.5 groups of this assay are compared."
      - reference: "PMID:39113893"
        reference_title: "PM(2.5) Exposure Inhibits Transepithelial Anion Short-circuit Current by Downregulating P2Y2 Receptor/CFTR Pathway."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "These results indicated that PM2.5treatment reduced the ASL production in airway epithelial cells."
        explanation: "The authors' own summary of this assay: PM2.5 reduced ASL production, the decrease this assay records."
    has_exposure_condition:
      - id: "EXPOSURE:liu-p2y2-pbs-vehicle-24h"
