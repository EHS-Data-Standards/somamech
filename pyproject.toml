[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "somamech"
description = "SOMA mechanistic knowledge base: paper-extraction pipeline and curated kb/ built on the soma-schema LinkML schema."
authors = [
  {name = "Sierra Moxon", email = "smoxon@lbl.gov"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.4",
  # SOMA LinkML schema + generated datamodel (import name: soma)
  "soma-schema >=0.2.3",
]

# Knowledge base and pipeline, not an installable library
[tool.uv]
package = false

[dependency-groups]
dev = [
    "linkml>=1.9.3",
    "mkdocs-material>=8.2.8",
    "mkdocs-mermaid2-plugin>=1.1.1",
    "jupyter>=1.0.0",
    "mknotebooks>= 0.8.0",
    "oaklib>=0.7.4",
    # Checks that every ontology term in kb/ files exists, has the right
    # label, and sits in the right ontology branch (see conf/oak_config.yaml)
    "linkml-term-validator>=0.4.5",
    # Checks that every evidence snippet is an exact quote from the cited
    # publication and that reference titles are real
    # (see conf/reference_validator_config.yaml)
    "linkml-reference-validator>=0.2.1",
    # PDF text extraction for the local-only reference cache
    "pypdf>=5.0.0",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
]

# Reminder: words have to be lowercased for the ignore-words-list
ignore-words-list = "linke"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
]
