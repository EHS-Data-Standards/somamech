# =============================================================================
# Haswell et al. (2017) - Reduced biological effect of e-cigarette aerosol
# compared to cigarette smoke evaluated in vitro using normalized nicotine
# dose and RNA-seq-based toxicogenomics
# =============================================================================
#
# Source: Scientific Reports 7: 888
# DOI: 10.1038/s41598-017-00852-y
#
# Study Design:
#   - In vitro: MucilAir (reconstituted human nasal airway epithelia) at ALI
#   - Donor for RNA-seq: #MD058501 (age 41, Caucasian female, non-smoker)
#   - qPCR validation: 3 donors (#MD058501, #MD008301, #MD009101)
#   - Products: 3R4F reference cigarette smoke vs Vype ePen e-cigarette aerosol
#   - Smoking regimen: HCI for 3R4F, CORESTA CRM81 for e-cigarette
#   - Exposure: 1 hour continuous at ALI, matched puff numbers
#   - 3R4F smoke: 1/30 dilution (aerosol:air, v-v)
#   - E-cigarette aerosol: 1/7 (nicotine-matched to 3R4F) and 1/3 (2x nicotine)
#   - Nicotine delivery: 3R4F 1/30 ~2743 ng/ml; e-cig 1/7 ~2343 ng/ml (p=0.27);
#     e-cig 1/3 ~8579 ng/ml (p=0.046 vs 3R4F)
#   - RNA-seq at 24hrs and 48hrs post-exposure; qPCR validation at 24hrs
#   - Three independent exposure runs with 3 intra-experimental replicates
#
# Key findings:
#   - 3R4F smoke 24hrs: 873 DEGs (pFDR<0.01, |FC|>2); 48hrs: 205 DEGs
#   - E-cigarette aerosol: max 3 DEGs at |FC|>2 per timepoint
#   - E-cig 1/3 (time-adjusted): 113 RNAs at pFDR<0.05, only 3 exceeded FC=2
#   - No reduction in CBF for any treatment vs air
#   - TEER reduced for e-cig 1/3 vs air (p<0.05) but within functional range
#   - MUC5AC decreased for e-cig 1/3 vs air (p<0.05)
#   - No significant change in FOXJ1 for any treatment
#   - LDH cytotoxicity <5% for all treatments
#   - 3R4F: enrichment for fibrosis, DNA damage, oxidative stress, lung cancer
#   - E-cigarette: metabolic/biosynthetic processes, extracellular membrane,
#     apoptosis, hypoxia (lower confidence)
#
# =============================================================================

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:haswell-rnaseq-001"
    name: "Stranded Total RNA-seq protocol (Illumina TruSeq)"
    description: "Illumina TruSeq Stranded Total RNA with Ribo-Zero. Libraries pooled and sequenced on NextSeq 500 at 150bp paired-end, target 80M reads/sample. STAR alignment to GRCh38, cufflinks counting (GENCODE v23), voom transformation, TMM normalization."
    equipment_required:
      - "Illumina NextSeq 500"
      - "Illumina TruSeq Stranded Total RNA kit"
      - "Ribo-Zero Human/Mouse/Rat"
      - "Agilent 2100 BioAnalyzer"

  - id: "PROTOCOL:haswell-qpcr-001"
    name: "TaqMan qPCR validation protocol"
    description: "High-capacity RNA-to-cDNA reverse transcription (Applied Biosystems). Custom TaqMan array 96-well plates. TaqMan Fast Universal Master mix II with UNG. 2^-ddCt method with GAPDH normalization."
    equipment_required:
      - "Fast PCR 7500 (Applied Biosystems)"
      - "Custom TaqMan array 96-well plates"

  - id: "PROTOCOL:haswell-cbf-001"
    name: "Cilia beat frequency measurement protocol"
    description: "Inverted AX10 Zeiss microscope (100x magnification, 10x ocular, 10x objective) with heated chamber at 37C. High-speed digital camera (Ammons Engineering). 5 min equilibration, 120 fps, minimum 512 frames captured."
    equipment_required:
      - "AX10 Zeiss inverted microscope"
      - "Pecon heated chamber (37C)"
      - "High-speed digital camera (Ammons Engineering)"

  - id: "PROTOCOL:haswell-teer-001"
    name: "Trans-epithelial electrical resistance measurement"
    description: "PBS added to apical surface, resistance measured with World Precision Instruments meter at 24hrs and 48hrs post-exposure."
    equipment_required:
      - "Resistance meter (World Precision Instruments)"

  - id: "PROTOCOL:haswell-ihc-001"
    name: "Quantitative immunohistochemistry for MUC5AC and FOXJ1"
    description: "Fixation with 3.6% formaldehyde/PBS, dehydration in 70% ethanol, paraffin inclusion. 4 um sections. Primary antibodies: MUC5AC and FOXJ1 (Abcam) for 1hr RT. Biotinylated secondary (Dako), HRP-conjugated ABC visualization. Quantitative image analysis with ImagePro Plus 6.2, 20 images per insert."
    equipment_required:
      - "Microtome"
      - "Anti-MUC5AC antibody (Abcam)"
      - "Anti-FOXJ1 antibody (Abcam)"
      - "Biotinylated secondary antibody (Dako)"
      - "ImagePro Plus 6.2 (Media Cybernetics)"

  - id: "PROTOCOL:haswell-exposure-001"
    name: "ALI aerosol exposure protocol"
    description: "RM20S smoking machine (Borgwaldt KC). 3R4F at HCI regimen (55ml puff, 2s duration, 30s interval, bell-wave profile). E-cigarette at CRM81 (55ml puff, 3s duration, 30s interval, square-wave profile). 1hr continuous exposure in acrylic chambers. Matched puff numbers between products."
    equipment_required:
      - "RM20S smoking machine (Borgwaldt KC)"
      - "Acrylic exposure chambers"
      - "MucilAir culture inserts (Epithelix Sarl)"

