# =============================================================================
# Montgomery et al. (2020) - Genome-Wide Analysis Reveals Mucociliary
# Remodeling of the Nasal Airway Epithelium Induced by Urban PM2.5
# =============================================================================
#
# Source: Am J Respir Cell Mol Biol. 2020;63(2):172-184
# DOI: 10.1165/rcmb.2019-0454OC
# PMCID: PMC7397762
#
# Study Design:
#   - In vitro: Primary human nasal AECs from GALA II childhood asthma study
#   - Culture: Air-liquid interface (ALI), Day 28-32 differentiation
#   - PM2.5 source: California urban sites (Bakersfield/Fresno, Sacramento,
#     Yuba City), collected 2011 on PTFE filters
#   - Fractions: Organic extract (OE) and water-soluble extract (WE)
#   - Acute doses: Low OE 0.045, Mod OE 0.45, High OE 4.5 ug/cm2;
#     WE 3 and 30 ug/cm2; NIST 2786 at 30 ug/cm2
#   - Acute protocol: 2x stimulations 24h apart, harvest 24h after second
#   - Chronic protocol: 5x daily stimulations (high OE), harvest after 5th
#   - Donors: n=12 (6 healthy, 6 asthmatic) for moderate OE; n=5 for
#     dose-response; n=4-5 for chronic experiments
#
# Key Findings:
#   - OE but not WE drives dose-dependent transcriptomic response
#   - Moderate OE: 424 DEGs (281 up, 143 down); CYP1A1 LFC=6.21
#   - AhR signaling activation + IL-1 inflammatory network
#   - Mucus secretory cell marker enrichment (Padj=1.19e-74)
#   - High OE: 1296 DEGs; ciliary gene program strongly downregulated
#   - Chronic OE: MUC5AC+ cells FC=2.88, FOXJ1+ nuclei 75% decrease
#   - SPDEF protein 1.5-fold increase; mucus metaplasia phenotype
#
# =============================================================================

# =============================================================================
# PROTOCOLS
# =============================================================================

protocols:
  - id: "PROTOCOL:montgomery-ali-001"
    name: "Mucociliary ALI culture and PM2.5 stimulation"
    equipment_required:
      - "Transwell inserts"
      - "ALI culture media"
      - "PM2.5 organic and water-soluble extracts"

  - id: "PROTOCOL:montgomery-rnaseq-001"
    name: "Whole transcriptome RNA-seq"
    equipment_required:
      - "KAPA mRNA HyperPrep kit (Roche)"
      - "Illumina NovaSeq 6000"

  - id: "PROTOCOL:montgomery-qpcr-001"
    name: "qRT-PCR validation"
    equipment_required:
      - "Real-time PCR system"

  - id: "PROTOCOL:montgomery-wb-001"
    name: "Western blot for SPDEF protein"
    equipment_required:
      - "SDS-PAGE apparatus"
      - "Densitometry imaging system"

  - id: "PROTOCOL:montgomery-if-001"
    name: "Immunofluorescence for MUC5AC/MUC5B/FOXJ1"
    equipment_required:
      - "Confocal fluorescence microscope"
      - "Anti-MUC5AC antibody"
      - "Anti-MUC5B antibody"
      - "Anti-FOXJ1 antibody"
      - "Anti-acetylated alpha-tubulin antibody"
      - "Anti-E-cadherin antibody"
      - "DAPI"

  - id: "PROTOCOL:montgomery-elisa-001"
    name: "Colorimetric ELISA for ATP-induced mucin secretion"
    equipment_required:
      - "Plate reader (490 nm)"
      - "Anti-MUC5AC ELISA kit"
      - "Anti-MUC5B ELISA kit"
      - "ATP stimulation reagent"

  - id: "PROTOCOL:montgomery-abpas-001"
    name: "Alcian blue-periodic acid-Schiff staining"
    equipment_required:
      - "AB-PAS staining reagents"
      - "Light microscope"

